<!doctype html>
<html>
<head><style>html,body{margin:0;padding:0}canvas{display:block}</style></head>
<body>
<canvas id="c" width="1600" height="560"></canvas>
<script>
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
const W = cv.width, H = cv.height;

ctx.fillStyle = "#ffffff";
ctx.fillRect(0, 0, W, H);

// Meadow palette: gold sky -> amber -> slope green -> deep shadow -> violet flowers
const stops = [
  [217, 152, 52],   // gold
  [255, 190, 87],   // amber
  [44, 128, 104],   // green
  [36, 79, 92],     // deep teal
  [138, 123, 192]   // violet
];

function mix(a, b, t) {
  return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
}

function palette(t) {
  t = Math.max(0, Math.min(0.999, t));
  const seg = t * (stops.length - 1);
  const i = Math.floor(seg);
  return mix(stops[i], stops[i + 1], seg - i);
}

// Cheap smooth field from layered sines (no libs needed)
function field(x, y) {
  return (
    Math.sin(x * 0.008 + Math.sin(y * 0.011) * 2.2) * 0.5 +
    Math.sin(y * 0.013 + Math.cos(x * 0.006) * 1.9) * 0.35 +
    Math.sin((x + y) * 0.0045) * 0.4
  );
}

// Mulberry32 for stable jitter
let seed = 20260711;
function rand() {
  seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}

const chars = "01·+×:∙o▪—";
const cell = 11;
ctx.textBaseline = "top";

for (let y = 0; y < H; y += cell) {
  for (let x = 0; x < W; x += cell) {
    const n = field(x, y);
    // diagonal drift: gold toward top-right, green/violet toward bottom-left
    let t = 0.52 * (y / H) + 0.3 * (1 - x / W) + n * 0.18;

    // flower speckle in the lower half
    if (y > H * 0.45 && rand() < 0.06) t = 0.82 + rand() * 0.17;
    // amber blooms upper right
    if (y < H * 0.4 && x > W * 0.5 && rand() < 0.05) t = 0.12 + rand() * 0.12;

    const [r, g, b] = palette(t);
    const alpha = 0.3 + Math.abs(field(x * 1.7 + 400, y * 1.7 - 200)) * 0.42 + rand() * 0.22;
    ctx.fillStyle = `rgba(${r | 0}, ${g | 0}, ${b | 0}, ${Math.min(alpha, 0.95).toFixed(2)})`;

    const ch = chars[(rand() * chars.length) | 0];
    const size = 8 + ((rand() * 3) | 0);
    ctx.font = `${size}px Menlo, monospace`;
    ctx.fillText(ch, x + rand() * 2, y + rand() * 2);
  }
}
</script>
</body>
</html>
