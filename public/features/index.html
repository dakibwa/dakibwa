     while turquoise was `done` — which rhymed, because descent caps a net at
     done and the card it speaks in said so in done's own colour. the ladder has
     moved and turquoise is `clean` now, so the same rhyme became a lie: the one
     card in the game that tells you a rung is no longer available was drawn in
     the colour of a rung you can still reach.
     green instead, which is off the ladder entirely and already means exactly
     this — `.coach-dots i.done` is the tutorial's mark for a step the game has
     walked you through. one colour for the game helping, on both surfaces that
     do it. see the flashMsg calls in descentTick, which follow it. */
  .descentbtn{opacity:.4;pointer-events:none;
    transition:opacity .5s var(--ease-out),color var(--t-ui),transform var(--t-lift) var(--ease-out)}
  .descentbtn.on{opacity:1;pointer-events:auto}
  .descentbtn.on:hover{color:var(--sig-gruen)}
  .descentbtn.on:hover svg{border-color:var(--sig-gruen)}
  .descentbtn.running{color:var(--sig-gruen);pointer-events:none;opacity:1}
  .descentbtn.running svg{border-color:var(--sig-gruen);animation:pulse 1.5s ease-in-out infinite}
  .field .mnode.settling{animation:settle 2.4s ease-in-out infinite}
  @keyframes settle{0%,100%{stroke-width:var(--nw)}50%{stroke-width:calc(var(--nw) * 1.4)}}
  #netsvg{transition:filter .45s}

  /* ---------- tutorial coach card (floats over the board) ---------- */
  .play{flex:1 1 auto;min-width:0;min-height:0;display:flex;flex-direction:column}
  .coach{
    display:none;position:absolute;top:16px;left:50%;transform:translateX(-50%);
    width:min(440px,calc(100% - 40px));background:var(--surface);
    border:1px solid var(--silver);box-shadow:var(--shadow-float);z-index:6;
    -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  }
  .play.tutorial .coach{display:block;animation:coachin .42s var(--ease-out) both}
  @keyframes coachin{from{opacity:0;transform:translateX(-50%) translateY(-10px)}to{opacity:1;transform:translateX(-50%)}}
  /* the coach used to be switched off. it leaves now — and the exit is opacity
     only, because the card is centred by a transform on desktop and not on a
     phone, and a keyframe cannot know which. */
  .play.tutorial .coach.leaving{animation:coachout .24s var(--ease-in) forwards}
  @keyframes coachout{to{opacity:0}}
  .coach-strip{height:5px;display:flex}
  .coach-strip i{flex:1}
  .coach-body{padding:13px 16px 14px}
  .coach-head{display:flex;justify-content:space-between;align-items:center;gap:12px;
    font-size:10px;letter-spacing:.16em;color:var(--ink-soft);text-transform:lowercase}
  .coach-dots{display:flex;gap:5px}
  .coach-dots i{width:7px;height:7px;border:1.5px solid var(--silver);display:block;transition:background .3s,border-color .3s}
  .coach-dots i.done{background:var(--sig-gruen);border-color:var(--sig-gruen)}
  .coach-dots i.now{border-color:var(--ink);animation:pulse 2s ease-in-out infinite}
  .coach-text{font-size:14px;line-height:1.45;margin-top:8px}
  .coach-text b{font-weight:700}
  .coach-key{display:flex;gap:14px;margin-top:11px;padding-top:10px;border-top:1px dashed var(--silver);flex-wrap:wrap}
  .coach-key span{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--ink-soft);letter-spacing:.04em}
  /* the same board fragments the rules card uses, smaller */
  .coach-key .rmark{width:38px;height:24px}

  /* ---------- the game's voice (floats over the board) ----------
     everything the game says in play used to be 10px of light blue in the foot
     of the masthead: a status log, in the one place on screen you are not
     looking while you drag. it is a card now, in the same language as the rules
     card and the coach — a colour strip, a flat panel, hairline rules, plain
     lowercase — because the things it says are the game talking, not telemetry.

     WHERE. it went to the middle first, then to the board's upper-third line,
     and it is in the bottom-right corner now — because a card over the tangle
     is a card over the puzzle, and the third line only made that cheaper
     rather than free. measured across 250 generated nets, what a card-sized
     rectangle hides in board coordinates:

       bottom right   0.02 crossings a net, worst net 4%   <- here
       top left       0.05                       worst 12%
       top right      0.07                       worst 17%
       bottom left    0.07                       worst 21%
       centre         1.01                       worst 71%

     drawn line is ~1.5% either way and is not the deciding number: the
     crossings are what the player is hunting, and the centre hid fifty times
     more of them than the corner does. bottom right also has the whole of the
     coach card's half of the board between it and the coach, so the guided net
     can still have both at once. bottom LEFT is a one-line change if the
     corners ever want swapping — the two are within a rounding error of each
     other on the mean, and it is the worst net that separates them.

     THIS RULE IS THE WHOLE PLACEMENT, at every width. the phone used to override
     it into a band across the middle of the board and no longer does; the
     re-measurement that ended that is in the max-width:700px block, and it found
     the same shape of answer on a turned plate that this table found on a flat
     one. what the phone still changes is the type, not the corner.

     WHICH CORNER OF WHAT. `.say` is positioned against `.field`, and the board
     does not fill `.field` — a fixed viewBox under xMidYMid meet is
     letterboxed into whatever the window leaves. a plain `right:18px` would
     hang the card in that dead margin, ~85px clear of the board it belongs to.
     so the corner offsets add the measured letterbox, published onto `.field`
     by publishPlateInset as `--plate-x` / `--plate-y`. the fallbacks are what
     the card falls back TO if the script never ran, which is the field corner
     — wrong but on-screen, rather than nothing.

     it never takes a pointer. a message can land the instant a drag ends and
     the next one begins under it, and on a phone the finger is where the card
     is. `.field` has overflow:hidden, so a tall card is clipped by the board
     rather than growing the page — this cannot introduce a scrollbar. */
  .say{
    position:absolute;
    right:calc(var(--plate-x,0px) + 18px);
    bottom:calc(var(--plate-y,0px) + 18px);
    /* the card is as wide as what it has to say and no wider — "weather" in a
       408px plate is mostly empty plate. the cap is what keeps the long ones
       from becoming a line of type across the board.
       the second term is the letterbox again, in the other dimension: 100% is
       the field, and a cap measured against the field lets the longest message
       in the game (the descent one, 389px) run off the side of a plate narrower
       than that. at 720x420 the plate is 347px and it overhung by 59. so the
       cap comes off the plate — the field less both margins, less the 18px
       inset twice so the wrap point is where the card would touch the far
       corner. it only ever binds on a plate under ~440px wide; every ordinary
       desktop is still capped at 408. */
    width:max-content;
    max-width:min(408px,calc(100% - 2 * var(--plate-x,0px) - 36px));
    z-index:7;pointer-events:none;
    /* the card used to be centred BY a transform, which its entrance then had
       to compose with rather than replace. a corner needs no transform to sit
       in, so `transform` is the entrance and nothing else — and where the
       phone still centres on an axis it does it with the separate `translate`
       property, which composes with this one instead of fighting it. */
    transform:translateY(7px);
    opacity:0;visibility:hidden;
    transition:opacity var(--t-fade) var(--ease-in),transform 0s linear var(--t-fade),
               visibility 0s linear var(--t-fade);
  }
  .say.on{
    opacity:1;visibility:visible;transform:none;
    transition:opacity var(--t-card) var(--ease-out),transform var(--t-card) var(--ease-out),visibility 0s;
  }
  .saycard{background:var(--surface);border:1px solid var(--silver);box-shadow:var(--shadow-float)}
  /* one colour is the thing being spoken about; two is a shared neuron, and the
     strip is then literally the two features meeting; four is the wordmark's
     own flag, for the messages that are the game rather than a feature */
  .saystrip{height:7px;display:flex}
  .saystrip i{flex:1;display:block}
  .sayrow{display:flex;align-items:center;gap:13px;padding:12px 16px}
  /* the instruction card. it arrives while you are looking at the board and
     trying to act on it, so it is the one card that wants to be small enough to
     read past rather than large enough to command the screen. */
  .sayrow.tight{gap:10px;padding:9px 13px}
  .sayrow.tight .sayline{font-size:12.5px;line-height:1.35}
  .sayrow.tight .saykick{font-size:9px;letter-spacing:.14em}
  .sayrow.tight .saymark{width:44px;height:29px}
  .sayrow + .sayrow{border-top:1px solid var(--rule)}
  /* a row's own colour — only when there is more than one row to tell apart.
     on a single-row card the strip above has already said it, and saying it
     twice in the space of 7px reads as an unfinished detail. */
  .saybar{flex:0 0 3px;align-self:stretch;min-height:26px;background:var(--silver)}
  .saytext{min-width:0;flex:1}
  .saykick{font-size:10px;letter-spacing:.16em;color:var(--ink-soft);text-transform:lowercase;
           display:block}
  .sayline{font-size:14px;line-height:1.45;color:var(--ink);margin-top:3px}
  /* one card in the game sets a word large, and it is the word you just earned */
  .sayline.big{font-size:25px;font-weight:700;letter-spacing:-.02em;line-height:1.05;margin-top:4px}
  /* the instruction is the only one that draws. a reward names a thing the
     board is already showing you — the light running down the thread, the two
     halves parting — and a second small copy of that in a card would compete
     with the board at the one moment the board is worth watching. the blocked
     thread is the opposite case: nothing on the board moved, that is exactly
     the problem, and "tap it to split" is useless until you know which ring.
     so it carries the ring, in the two colours the real neuron is wearing. */
  .saymark{flex:0 0 auto;width:58px;height:38px;display:block}
  .say .rowin{animation:rowin .26s var(--ease-out) both}

  /* ---------- status ---------- */
  .devchip[hidden]{display:none}
  .devchip{
    border:1px dashed var(--sig-violett);color:var(--sig-violett);padding:2px 7px;
    font-size:9px;letter-spacing:.12em;text-transform:lowercase;
  }
  .credit{margin-top:13px;font-size:10px;color:var(--ink-soft);letter-spacing:.1em;text-transform:lowercase}

  /* ---------- overlays ----------
     the page no longer scrolls, which turned every card taller than the window
     into a card with an unreachable button — the rules card at 1280x720, the
     "continue" on a landscape phone. the veil scrolls instead, and the cards
     cap at the window.
     every overlay in the game — the cleared card, the run card, the collection,
     the record, the rules — enters and leaves the same way now: the ground
     fades, the card lifts the last few pixels onto its mark. display:none
     cannot be transitioned, so a hidden veil stays in the layout and is hidden
     with visibility, which also keeps it out of hit-testing. that means
     hideVeils() and every `.show` toggle already in the code gets an exit for
     free, rather than each one having to remember to animate itself out. */
  .veil{
    position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    z-index:40;background:var(--veil);padding:20px;overflow-y:auto;
    opacity:0;visibility:hidden;pointer-events:none;
    transition:opacity var(--t-exit) var(--ease-in),visibility 0s linear var(--t-exit);
  }
  .veil.show{
    opacity:1;visibility:visible;pointer-events:auto;
    -webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);
    transition:opacity var(--t-card) var(--ease-out),visibility 0s;
  }
  .veil > *{
    max-height:calc(100dvh - 40px);overflow-y:auto;
    opacity:0;transform:translateY(14px) scale(.985);
    transition:opacity var(--t-exit) var(--ease-in),transform var(--t-exit) var(--ease-in);
  }
  .veil.show > *{
    opacity:1;transform:none;
    transition:opacity 180ms var(--ease-out),transform var(--t-card) var(--ease-out);
  }
  /* a card taller than the window must sit at the top of it, not be centred
     with its head cut off */
  @media (max-height:760px){ .veil{align-items:flex-start} }

  /* ---------- bulletin-style panel ----------
     THE SAME CARD AS THE OTHER TWO. everything the game floats over the board —
     the in-play `.saycard`, the tutorial `.coach` — is a --surface ground, a
     hairline --silver border, ink type, and a thin colour strip along the top.
     this one was the exception: a saturated --dunkelblau plate carrying white
     type, with the tier as a band across it. it is the card that lands at the
     best moment in the game and it did not belong to the game's own family.
     it is a surface card now, in the same four parts and the same order.

     what that costs and what it buys. white on dunkelblau measured 5.39:1; ink
     on --surface measures 15.22 dark and 16.93 light, so the 12px note has three
     times the headroom it had. the stamps gain more: a feature plate against the
     dunkelblau card ran 1.00 to 3.21 — an emblem you could barely find on the
     card announcing you had earned it — and against --surface it is 3.22 to
     10.32 on the dark ground. and the tier strip is freed: see TIERCOL, where
     that one plate was quietly deciding the whole ladder.

     it stays OPAQUE, which was measured separately and does not change with the
     ground: the thing behind this card is a lit board, and a note composited
     over a board is a note on an unknown ground. 12% does not read as
     transparency anyway. */
  .bulletin{
    max-width:440px;width:100%;color:var(--ink);position:relative;overflow:hidden;
    background:var(--surface);border:1px solid var(--silver);
    box-shadow:var(--shadow-card);
  }
  /* the tier, and the one place on this card the ladder is drawn. same 7px the
     `.say` card uses for the feature it is speaking about — the two cards sit in
     the same corner of the same board and their strips have to weigh the same.
     it is bands rather than a fill because the strip can now carry more than
     one colour, exactly as `.saystrip` does and for the same reason: one band is
     a tier, four is the wordmark's flag. a single band still fills the width. */
  .bulletin .bstrip{height:7px;width:100%;display:flex}
  .bulletin .bstrip i{flex:1;display:block}
  .bulletin .bhead{display:flex;justify-content:space-between;align-items:flex-start;padding:20px 22px 0}
  .bulletin h2{font-size:31px;font-weight:700;letter-spacing:-.025em;text-transform:lowercase;line-height:1}
  /* the rung, in words, directly under the title. it is ink rather than the
     tier's own colour: the strip above has already said which rung this is, and
     a word in a signal colour would be the game's one saturated piece of TYPE. */
  .bulletin .bsub{font-size:11px;letter-spacing:.18em;text-transform:lowercase;color:var(--ink-soft);margin-top:5px}
  .bulletin .bnum{font-size:52px;font-weight:300;line-height:.85;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
  /* hairlines in --rule, the same material every other rule in the game is drawn
     in. they were white at 35%, which is a rule mixed with its own ground and
     only exists on a plate that has one. */
  .bulletin .brules{margin:18px 0 0;border-top:1px solid var(--rule)}
  .bulletin .brow{display:flex;justify-content:space-between;gap:12px;padding:9px 22px;border-bottom:1px solid var(--rule);font-size:11.5px;letter-spacing:.1em;text-transform:lowercase;color:var(--ink-soft)}
  /* the rows arrive in reading order, a beat apart, inside the card's own
     entrance — the card is a readout being printed, not a picture being shown */
  .veil.show .bulletin .brow{animation:rowin .26s var(--ease-out) both;
    animation-delay:calc(70ms + var(--i,0) * 32ms)}
  @keyframes rowin{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
  /* the label is quiet and the figure is ink: on a row that is a reading, the
     reading is the part worth looking at. on the white plate they were one
     colour and the distinction could not be made at all. */
  .bulletin .brow b{font-weight:400;font-variant-numeric:tabular-nums;color:var(--ink)}
  .bulletin .bbody{padding:16px 22px 20px;position:relative}
  .bulletin .bnote{font-size:12.5px;line-height:1.55;color:var(--ink-soft);padding-right:46px}
  /* the offer, under the note that has just said the day is over. it is the
     same idea as the archive line at the foot of the record and it is drawn to
     the same rule: quieter than the thing above it, a hairline under the way
     through rather than a field around it, and no colour of its own. a filled
     button here would be the loudest object on the screen that is the payoff of
     the whole day — which is the mistake the record already made once and had
     taken out of it.
     a step down from .bnote in size and a step up in tracking, because it is a
     different KIND of sentence from the one above: that one is the game telling
     you where you are, this one is an offer, and a reader who cannot tell them
     apart will read the offer as the game talking. */
  .bulletin .boffer{
    margin-top:9px;font-size:10.5px;letter-spacing:.05em;
    color:var(--ink-soft);padding-right:46px;
  }
  .bulletin .boffer a{
    color:var(--ink-soft);text-decoration:none;
    border-bottom:1px solid var(--rule);padding-bottom:1px;
    transition:color var(--t-ui),border-color var(--t-ui);
  }
  .bulletin .boffer a:hover{color:var(--ink);border-bottom-color:var(--ink)}
  /* the ray dial belongs to the card, not to its controls. anchored to the whole
     bulletin it sat in the same band as the buttons, and on a narrow card the
     buttons grow until they reach it — measured 15px of it lying across "stop
     for today" at a 306px card. a decoration that lands on a control's label is
     not decoration. so it hangs off the note band instead, where the only thing
     it can ever overlap is the text that has been given room for it. */
  /* the dial is drawn in --silver rather than at 50% white, for the same reason
     the rules are: a decoration mixed with its own ground cannot follow the
     ground anywhere else. it keeps its opacity, which is what makes it a
     watermark rather than a diagram. */
  .bulletin .bsun{position:absolute;right:22px;bottom:16px;width:34px;height:34px;opacity:.55;pointer-events:none}
  .bactions{display:flex;gap:9px;padding:0 22px 20px}
  /* the sign-in invitation, and the only thing that ever sits below the buttons
     on a bulletin. it is the record's foot, moved: same hairline rule, same
     quietest ink, same links — because it is the same offer, and a player who
     meets it here and then finds it again at the foot of the record should
     recognise it rather than meet it twice. --surface-2 so it reads as a
     footnote to the card rather than a second card stacked under it. */
  /* two lines here where the record's foot is one, and that is the card's width
     talking: the bulletin is a little over half as wide as the record, and one
     line across it ellipsed the message down to a single letter while the four
     names — which are the actionable half — kept every pixel they asked for.
     so the message gets its own line and wraps rather than truncating. it is
     the sentence that makes the links mean anything; a link row above an
     ellipsis is four words with no reason attached. */
  .bfoot{
    display:flex;flex-direction:column;align-items:flex-start;gap:7px;
    padding:10px 22px 12px;border-top:1px solid var(--rule);background:var(--surface-2);
    font-size:9px;letter-spacing:.12em;text-transform:lowercase;color:var(--ink-soft);
  }
  .bfoot[hidden]{display:none}
  .bfoot-say{line-height:1.5}
  .bfoot-ins{display:flex;align-items:center;gap:13px;flex-wrap:wrap}
  .bfoot-ins .acctlink{margin-left:0}
  /* a wide button depresses rather than shrinking. it is the same physical idea
     as the icon buttons — the control moves under the finger — said in the way
     each shape can say it: a small square scales, a long bar goes down.
     these are the game's own two button idioms now that the card has no plate to
     invert against: a ghost is a --silver hairline round ink, like `.dstate` and
     `.act`; the primary is a solid block of ink with the ground knocked out of
     it, which is exactly `.intro-start` — down to the dunkelblau it goes to on
     hover, the one job that colour still has here. */
  .wbtn{
    border:1px solid var(--silver);background:transparent;font:inherit;font-size:12px;
    letter-spacing:.1em;padding:8px 15px;cursor:pointer;color:var(--ink);text-transform:lowercase;
    transition:background var(--t-ui),color var(--t-ui),border-color var(--t-ui),
               transform var(--t-lift) var(--ease-out);
  }
  .wbtn:hover{background:var(--surface-2);border-color:var(--ink)}
  .wbtn:active{transform:translateY(1px) scale(.99);
    transition-duration:var(--t-ui),var(--t-ui),var(--t-ui),var(--t-press)}
  .wbtn.solid{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .wbtn.solid:hover{background:var(--dunkelblau);border-color:var(--dunkelblau);color:var(--paper)}
  /* shut, drawn the way the archive line at the foot of the record is drawn: a
     dashed hairline and the quieter ink. dashed means shut and means nothing
     else anywhere in this game. it is NOT disabled — it still leads somewhere,
     to the record, where the unlock lives — so it keeps its hover, it simply
     does not light up as though it were about to start a run. */
  .wbtn.shut{border-style:dashed;color:var(--ink-soft)}
  .wbtn.shut:hover{background:transparent;border-color:var(--silver);color:var(--ink)}

  /* minted badges strip inside bulletin.
     the stamps are sized to hold a row rather than to a drawing width. at 82px
     three of them wanted 266 and a 306px card offers 262 — four pixels short, so
     the commonest result in the game (three features off one net) broke to two
     rows and left the third stamp alone above the note with a hole beside it.
     78 fits three across on the narrowest card the layout supports, and they may
     shrink further before they will wrap. */
  .minted{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 18px}
  /* a stamp is pressed down onto the card: it comes in slightly large and stops
     dead on contact. the old one arrived at 1.4x and five degrees off true and
     then bounced — a cartoon, and the one overshoot in the game that had least
     business being one, since a stamp is the most physical object on screen. */
  .minted .mb{flex:0 1 78px;min-width:0;text-align:center;animation:stampin .32s var(--ease-snap) both;
    animation-delay:calc(150ms + var(--i,0) * 60ms)}
  .minted .mb .feature-stamp{display:block;width:100%;height:auto;filter:drop-shadow(0 2px 0 rgba(36,52,61,.12))}
  .minted .mb span{display:block;font-size:9px;letter-spacing:.08em;padding:3px 2px 0;text-transform:lowercase;color:var(--ink)}
  /* the strength tally belongs to the label above it, so it sits ON it rather
     than floating a line below looking like a stray mark */
  .minted .mb u{display:block;text-decoration:none;font-size:8px;letter-spacing:1px;
    line-height:1;margin-top:2px;color:var(--ink-soft)}
  @keyframes stampin{from{opacity:0;transform:scale(1.16)}to{opacity:1;transform:none}}

  /* ---------- the cards that sit ON the board ----------
     holdCleared exists to hold a SOLVED board still for 1.6s — the last crossing
     goes, every freed thread eases into a drawing of its own sign, and then
     nothing moves. a 440x639 plate was then drawn over the middle of that under
     a 7px blur: the card announced a board it had just finished making worth
     looking at, and took it away to do so. measured, it covered 43% of the plate
     and blurred the other 57%.
     so these veils stop being veils. they keep `.show` — sayShow, dismissVeil,
     hideVeils and nextNet all read that class and none of them can tell the
     difference — and give up only what they PAINT: no ground, no backdrop blur.
     each is still the full click target across the board, so clicking beside the
     cleared card still continues, which is what dismissVeil promises.

     BOTH bulletins are here now. the day card was the exception, on the stated
     grounds that it was terminal and had no board left behind it — and that was
     never true. `continue →` on the tenth net built an ELEVENTH, so the biggest
     moment in the game arrived as a 440x619 modal, 30% of a 1280x720 window and
     88% of a phone, over a blurred tangle nobody would ever be allowed to play.
     the day now ends on the board it was won on and stays there (see clearNet),
     which takes the exception away with it: the last thing the game does is the
     same thing it does after every other net, at the scale of the whole day.

     WHERE. the same corner as the in-play `.say` card, chosen the same way:
     bottom right hides 0.02 crossings a net where the centre hides 1.01. and the
     same offsets, because there is only one letterbox and publishPlateInset
     already publishes it — `--plate-x` / `--plate-y` on `.field`. those are
     inherited custom properties, which is the whole reason both veils sit
     inside `.field` in the markup: a fixed overlay at body level cannot see them,
     and measuring the board a second time to work around that would be two
     sources of truth for one number. absolute rather than fixed, so `.field`'s
     own overflow clips them to the board and the masthead stays reachable
     behind.

     WHAT IT IS NOT: translucent. the ground was --dunkelblau when that was
     measured and is --surface now, and the answer did not change — it got
     easier. white on dunkelblau was 5.39:1, and composited over the paper plate
     at 12% clear the same white fell to 4.37:1, under the 4.5 a 12px note needs,
     before a gelb thread had passed beneath it (4.80). ink on --surface starts
     from 15.22:1 dark and 16.93 light, so the arithmetic no longer binds — but
     the reason underneath it does: the thing behind this card is a LIT BOARD,
     not a flat colour, so a translucent card's contrast is whatever happens to
     be passing under it. 12% does not read as transparency anyway. the ground
     stays opaque and the board shows AROUND the card rather than through it:
     16% of the plate covered where it was 43%, and none of the rest blurred. */
  .veil.boardcard{
    position:absolute;background:none;padding:0;overflow:visible;
    align-items:flex-end;justify-content:flex-end;
  }
  .veil.boardcard.show{-webkit-backdrop-filter:none;backdrop-filter:none}
  .boardcard > .bulletin{
    max-width:min(360px,calc(100% - 2 * var(--plate-x,0px) - 36px));
    /* both letterbox margins, the way the width already takes both — the card is
       anchored to the plate's bottom edge, so a cap counting the inset once let
       a tall card climb out of the top of the plate and into the dead margin
       above it. it never bound on the net card at 270px; the day card is twice
       that and finds it at the first short window. */
    max-height:calc(100% - 2 * var(--plate-y,0px) - 36px);
    margin:0 calc(var(--plate-x,0px) + 18px) calc(var(--plate-y,0px) + 18px) 0;
    /* the shadow of the other corner card, not of a modal: `.saycard` sits on
       --shadow-float and these now sit beside it on the same board. --shadow-card
       is left to the cards that really are modals — the record, the rules. */
    box-shadow:var(--shadow-float);
    /* a corner card lifts the way the other corner card does: 7px, no scale.
       the 14px-and-a-scale entrance belongs to a plate arriving in the middle of
       the screen, and neither of these is one any more. */
    transform:translateY(7px);
  }
  .boardcard.show > .bulletin{transform:none}
  /* a small object in the corner of a board, so the whole card steps down
     together rather than one part of it shrinking against the rest */
  .boardcard h2{font-size:23px}
  .boardcard .bsub{font-size:10px;margin-top:4px}
  .boardcard .bnum{font-size:40px}
  .boardcard .bhead{padding:15px 18px 0}
  .boardcard .brules{margin-top:13px}
  .boardcard .brow{padding:8px 18px;font-size:11px}
  .boardcard .bbody{padding:13px 18px 14px}
  .boardcard .bnote{font-size:12px;padding-right:0}
  .boardcard .minted{gap:7px;margin:0}
  .boardcard .minted + .bnote{margin-top:13px}
  /* five is the most features a net ever holds, and 5 x 58 + 4 x 7 = 318 against
     the 324 this card leaves inside its padding — so the commonest results and
     the worst case all stay on one row. the day card's eight run to a second
     row on the same measure, which is why it shows two full fives (showRunOver)
     rather than a five and a ragged three. */
  .boardcard .minted .mb{flex:0 1 58px}
  .boardcard .bactions{padding:0 18px 16px}
  .boardcard .wbtn{padding:7px 12px}
  /* the day card is the one with somewhere to send you — share, the record, run
     again, the trial, and the way back into an unfinished set. five buttons on a
     324px line is three rows of one-and-a-half words each, so they go to a grid
     of two and the leading action takes the full width of it. */
  #runveil .bactions{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  #runveil .bactions .wbtn:first-child:nth-last-child(odd){grid-column:1 / -1}
  #runveil .wbtn{padding:8px 10px;font-size:11.5px;letter-spacing:.08em}
  /* the readings these cards stopped printing. on the net card: features freed
     was a count of the stamps directly beneath it, the strength tally had no key
     anywhere on the card, and clean-so-far and turns-today are DAY facts on a
     card about one net. on the day card: today's set, clean and the streak, none
     of which this card has to print — the title and the numeral say the set is
     complete and how deep it went an inch above, the sub line says the clean
     count, and the streak is the welcome back card's own headline, `n days
     running`, from when the session opened. cut from the drawing, kept for the
     reader, because a screen reader has no glance back at a card already
     dismissed and no board to count stamps off. */
  .bulletin .bquiet{position:absolute;width:1px;height:1px;overflow:hidden;
    clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}

  @media (max-width:700px){
    /* the card spans the board and sits at the FOOT of it — the one edge a
       portrait net can spare, and short enough that the top half of the plate,
       where the signs mostly settle, is still open. unlike `.say`, this one
       genuinely is a wide card at every width: a title, a numeral, a row of
       stamps and two buttons will not fold into a 159px object, so there is no
       corner for it to shrink into and the foot is the honest place for it.
       WIDTH AND INSET COME OFF THE PLATE, not off the field. they used to come
       off the field — `max-width:none;width:calc(100% - 20px)` — on the argument
       that a card spanning the board is already inside it. that is true only
       where the plate nearly fills the field, which is the phone and nothing
       else. measured on the cleared card:
         375x812  field 353, plate 349  -> card 333, 8px clear of the plate
         700x900  field 678, plate 398  -> card 658, 130px off EACH side of it
       at 700 the card announcing a board was twice the width of the board. so it
       takes the same cap the desktop rule takes, which is the plate less both
       18px insets, and the same bottom inset — 313 wide with 18 clear at 375,
       and inside the plate at every width in between. the bare 10px bottom was
       measurably wrong too: at 430x932 the plate carries an 8px bottom letterbox
       and the card was landing 3px off the plate's edge.
       the numbers this replaces were desktop numbers and were only ever true
       there: `.boardcard` above says the corner covers 16% of the plate where the
       centred modal covered 43%, and that holds at 1280x720 (14.6%) and 1440x900
       (8.9%). at 375x812 the same card covers 40%. that is the cost of a card
       that cannot shrink on a plate that cannot widen, and it is charged on the
       one card in the game shown to a board that is already SOLVED — nothing
       under it is still being hunted. it is not the trade `.say` was making. */
    /* THE FOOT, not the plate's foot. `--plate-y` is the board's letterbox, and
       on a portrait phone it is enormous — 128px at 375x812 — so a card inset by
       it floated 146px clear of the bottom with a band of empty board under it,
       which reads as a card stranded mid-screen rather than one sitting at the
       end. that inset was written for the horizontal case, where `--plate-x`
       keeps the card off the plate's edge and the margin either side is small.
       vertically it buys nothing: nothing is drawn in the letterbox, so there is
       nothing to stay clear of. the coach card sits at the foot of the field on
       this width and so does every message; this now does too. */
    .boardcard > .bulletin{
      max-width:min(360px,calc(100% - 2 * var(--plate-x,0px) - 36px));
      width:calc(100% - 20px);
      margin:0 auto 10px;max-height:62%;
    }
    /* 297px inside the padding here against the 318 five 58s want: the worst case
       broke to a second row and cost 90px of card — 15% of the plate — to show
       one stamp with a hole beside it. 52 keeps all five on the line, and the
       same arithmetic the desktop size came off: 5 x 52 + 4 x 7 = 288. */
    .boardcard .minted .mb{flex:0 1 52px}
    /* the day's second row of stamps costs 105px, and this card has 388 to spend
       — it was the difference between a card that fits at the foot of the plate
       and one whose last row of buttons is below the board. so the phone shows
       the row it has room for. the count the row is a sample of is in .bquiet,
       and the whole set is one button away in the record. */
    #runveil .minted .mb:nth-child(n+6){display:none}
  }

  /* the same cut, for the same reason, on a window too SHORT rather than too
     narrow. a landscape phone at 720x420 leaves the plate 434x242 and the card
     204 to sit in — the NET card already overruns that, at 268, and scrolls
     inside itself. neither can be made to fit and stay a card: the day card
     needs 329 with one row of stamps, and the only arrangement that clears 204
     is no stamps, no note and the buttons on a single line, which is not the
     card any more. so it still scrolls here, by 125 rather than by 230, against
     the modal's own 239 over a board it also blurred. */
  @media (max-height:560px){
    #runveil .minted .mb:nth-child(n+6){display:none}
  }

  /* ---------- a question ----------
     `confirm()` is titled "akibwa.com says". it uses the OS button shapes, the
     OS button ORDER, sentence case and the system face, and none of that can be
     reached from here — so at the one moment the game asks the player to decide
     something, the decision is handed to a different piece of software wearing a
     different typeface. it was also the only sentence in the game that was not
     lowercase.
     a question is a bulletin. the same four parts in the same order as the card
     that ends a net, and that card already IS a confirm: a title, a reading, and
     two buttons where one of them leads. nothing new is drawn here — the whole
     of this rule is a z-index and a measure.
     ABOVE EVERYTHING. it is the one overlay that has to be answered before
     anything else can happen, and both callers are reached from something that
     is already covering the screen: the record (a veil, 40) and the dev drawer
     (70). a question underneath the thing that asked it is not a question. */
  .askveil{z-index:80}
  /* narrower than the 440 the bulletin takes on its own. a question is one line
     of consequence and two buttons; at 440 the buttons sit in the corner of a
     mostly empty card and the sentence runs longer than the eye wants for a
     thing it has to decide on. */
  .askveil > .bulletin{max-width:392px}

  /* every control is in here until it earns a place on the board. the HUD
     should be readable as a HUD, not as a HUD plus a workbench. */
  .devdrawer{
    position:fixed;right:14px;bottom:14px;z-index:70;width:212px;
    background:var(--surface);border:1px solid var(--silver);
    box-shadow:var(--shadow-float);padding:11px 12px 12px;
  }
  .devdrawer:not([hidden]){animation:drawerin .22s var(--ease-out) both}
  @keyframes drawerin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .devdrawer[hidden]{display:none}
  .dd-head{display:flex;justify-content:space-between;align-items:baseline;
    font-size:9.5px;letter-spacing:.14em;color:var(--ink-soft);text-transform:lowercase;margin-bottom:9px}
  .dd-head a{color:var(--silver);text-decoration:none}
  .dd-head a:hover{color:var(--ink)}
  .devdrawer .actionrow{display:grid;grid-template-columns:1fr 1fr;gap:3px}
  .dd-note{margin-top:10px;padding-top:9px;border-top:1px solid var(--rule);
    font-size:9px;line-height:1.5;letter-spacing:.06em;color:var(--silver);text-transform:lowercase}
  .dd-note b{color:var(--ink-soft)}
  .devtab{
    position:fixed;right:14px;bottom:14px;z-index:69;width:9px;height:9px;
    border:1px solid var(--rule);background:transparent;cursor:pointer;padding:0;
  }
  .devtab:hover{border-color:var(--silver)}

  /* ---------- the record ----------
     one card, and only one thing on it moves. the head holds the one question
     a day list structurally cannot answer — which of the sixteen features have
     still never come off a board — and the days scroll under it. */
  .record{
    max-width:640px;width:100%;display:flex;flex-direction:column;
    /* the LIST scrolls, not the card: .veil > * hands every overlay an
       overflow-y of its own, and here that would take the head with it */
    max-height:calc(100dvh - 40px);overflow:hidden;
    border:1px solid var(--silver);background:var(--surface);box-shadow:var(--shadow-card);
    /* `--set-ahead` was declared here too, and is gone with the rest of it.
       the masthead draws a net not yet reached as the BARE TRACK, and this card
       deliberately does not: these cells sit on --surface with no track behind
       them, and --rule on --surface is 1.28:1, which is no mark at all. what
       they take instead is plain --silver, which is free again now that no rung
       is a neutral, and which measures 4.31 here on paper and 2.97 on the dark
       ground. the hairline is a hairline and every rung is a block, which is
       the one thing the rows kept when their ladder became a bar — see
       .track.dtrack, where the same two measurements decide the same thing. */
  }
  /* IT WRAPS AGAIN, and only when it has to. this head is a title plus up to
     four controls, and the fourth — the ground square — is what tipped the
     narrowest case over: at 375 the card gives the row 323px, and title +
     `collection` + `full version` + ground + close want 372. with nowrap the
     flexbox pays for that by deforming everything at once, which is what it did
     — the title broke onto two lines, `full version` lost 17px of its box, and
     both 34px squares came out 26.5 wide, which is a square that is not one.
     wrapping spends the same shortfall in one place instead: the controls drop
     to a line of their own at full size, and the head gets 26px taller on the
     one screen where that is the cheapest thing it owns.
     it engages nowhere else. `full version` is drawn only where there is a till
     (`canBuy`), so the everyday narrow head is three items wanting 257 of 323
     and stays on one line, and at 640px the card has 602 for a row that wants
     363. this is the graceful end of a range, not a layout. */
  .rec-head{
    flex:0 0 auto;display:flex;flex-wrap:wrap;align-items:center;
    justify-content:space-between;gap:12px;
    padding:13px 18px;border-bottom:1px solid var(--ink);
  }
  .rec-title{font-size:15px;font-weight:700;letter-spacing:-.01em;text-transform:lowercase;line-height:1}
  /* ---- the way out is a button, the same one the masthead draws ----
     it was a text link, and `play →` on a day row was a bordered chip, and the
     three controls in the masthead were hairline boxes: three treatments for
     the same act of pressing something, on two screens the player moves between
     constantly. the material is `.help`'s — a --silver hairline, ink-soft type,
     ink on hover, and the asymmetric press — and it is written once here for all
     three so they cannot drift apart again. what differs between them is SIZE
     and nothing else: a masthead button is 34px because it stands alone in a
     row of its own, a row's chip is smaller because a list of forty of them at
     34px would be a wall of boxes.
     `.help` keeps its own copy of these values rather than joining the list: it
     also carries [hidden], a min-width and the caltext, and folding all of that
     in here to save four declarations would put the masthead's layout inside a
     rule about the record. if the material moves, it moves in both. */
  .rec-close,.rec-btn,.dstate{
    border:1px solid var(--silver);color:var(--ink-soft);text-decoration:none;
    transition:border-color var(--t-ui),color var(--t-ui),
               transform var(--t-lift) var(--ease-out);
  }
  .rec-close:hover,.rec-btn:hover,.dayrow.open:hover .dstate{border-color:var(--ink);color:var(--ink)}
  .rec-close:active,.rec-btn:active{transform:scale(.93);
    transition-duration:var(--t-ui),var(--t-ui),var(--t-press)}
  .rec-close,.rec-btn{
    display:inline-flex;align-items:center;justify-content:center;gap:7px;
    height:34px;font-size:11px;letter-spacing:.14em;text-transform:lowercase
  }
  .rec-btn{padding:0 13px}
  /* the `display:inline-flex` above outranks the user agent's own
     `[hidden]{display:none}`, so a `hidden` button stays on screen — the same
     scar `.help`, `.act`, `.bfoot` and `.devchip` all carry a line for. it bites
     hardest here because the thing that would not hide is an offer to take
     money, shown to somebody who has already paid. */
  .rec-btn[hidden]{display:none}
  /* SQUARE, and that is the whole point of dropping the word. a cross in a
     34×34 box is a control; a cross on the end of `close` in a wide box is a
     word with a decoration after it. the glyph needs more than 11px type to
     carry a button on its own.
     no ::before nudge here, and that was the first attempt: this is a flex
     container, so a pseudo-element is a second FLEX ITEM and centring two of
     them puts the cross off to one side. `line-height:1` is what actually
     centres it — the glyph's own line box is what was off, not its position. */
  .rec-close{width:34px;padding:0;font-size:17px;line-height:1;letter-spacing:0}
  /* `.rec-sq` stood here — the same 34px square for a button whose mark is drawn
     rather than set. its one user was the head's ground button, which the owner
     moved to the top bar (17 Aug 2026), so the rule had no selector left.
     A SQUARE IS AN OBJECT AND DOES NOT DEFORM, which is why the close keeps the
     line below: flex-shrink is 1 by default, so a `width:34px` in a tight row is
     a suggestion — it came out 26.5 wide the first time this head was
     over-subscribed, and a 26.5×34 box with a cross in it says nothing about
     anything. the row gives elsewhere: the word shrinks first and past that the
     head wraps, which are both losses you can look at. */
  .rec-close{flex:0 0 auto}
  /* the controls sit on their own centre line rather than the title's baseline.
     the stats block that used to share this row was type, so a baseline was
     right for it; two buttons of the same height are objects, and objects line
     up on their middles. */
  .rec-right{display:flex;align-items:center;gap:8px;margin-left:auto;min-width:0}
  /* ---------- the sixteen ----------
     one row, pinned, and the whole of what used to be a panel up here. a found
     feature wears its own plate with a band under it in the tier it was minted
     at; an unfound one is a hairline square with a cross in it, which says
     unidentified without giving the sign away. the plates are what make it a
     legend as well as a tally: a stamp in a row below is the same drawing. */
  /* ---------- the collection ----------
     SEVEN COLUMNS, FIXED, and neither of the two numbers that stood here before
     was one. it began as `repeat(16, 1fr)` — a cast size written into the
     stylesheet, which had to be edited every time the cast changed. it then
     took `--cols` from the render as ceil(sqrt(n)), which was square at any
     cast but made the SHAPE of the screen a reading of how many features happen
     to exist: four wide today, five the morning a seventeenth landed, and the
     player's collection re-laid-out under them by a change that was about the
     game and not about this card.
     seven is a target rather than a reading — 7×7 is forty-nine, the cast this
     is aimed at — so it is written here, once, and does not move again.
     ONLY THE FEATURES THAT EXIST ARE DRAWN. sixteen fills two rows and starts a
     third, which is ragged and is the honest shape: the alternative is
     forty-nine slots of which thirty-three can never be filled by any board the
     game can generate, under a caption counting to sixteen. the day the cast
     reaches forty-nine this becomes a true 7×7 with nothing changed here.
     the cells shrink as the columns rise — about 145px at four, about 80px at
     seven on the 640px card — which is why the emblems are drawn as flat signs
     rather than as illustrations.
     it scrolls like the day list it replaces on screen, and for the same reason:
     the card is a fixed height and the thing inside it is not. */
  .collection{
    flex:1 1 auto;min-height:0;overflow-y:auto;padding:14px 18px 18px;
    display:grid;grid-template-columns:repeat(7,minmax(0,1fr));
    gap:7px;align-content:start;
  }
  /* BOTH VIEWS NEED THIS and the day list has needed it since the moment it
     could be hidden: `display:grid` and `display:flex` each outrank the user
     agent's `[hidden]{display:none}`, so setting the attribute hides neither.
     the failure is the two views stacked — the collection printed underneath a
     day list that believed it was gone — and it is the same scar `.help`,
     `.act`, `.bfoot`, `.devchip` and `.rec-btn` all carry a line for. */
  .collection[hidden],.daylist[hidden]{display:none}
  /* the caption spans the grid rather than sitting above it, so it scrolls with
     the cells instead of pinning a line of type to the top of a square. */
  .colcap{
    grid-column:1/-1;margin:0 0 3px;
    font-size:9px;letter-spacing:.12em;text-transform:lowercase;color:var(--ink-soft);
  }
  .fcell{display:block;min-width:0;border-bottom:3px solid var(--tc,var(--rule));transition:filter var(--t-ui)}
  .fcell svg{display:block;width:100%;height:auto}
  .fcell:hover{filter:var(--hover-lift)}
  .fcell.none{border:1px solid var(--rule);border-bottom-width:3px;color:var(--silver)}

  /* ---------- the days ----------
     the archive is the paid tier, and it is now ONE row at the foot of the list
     rather than a row per shut day. a free player has every day older than
     yesterday shut, which was 11 of the 13 rows a new player met, growing by one
     every day forever — about 95% of the list inside a year — and the violet
     field on the first of them was the only saturated object on the card, so the
     visual anchor of a history screen was a shop. the count says the same thing
     in one line, the list stops growing, and the way through is a link in the
     quietest ink here rather than the loudest field.
     it is dashed and it is --rule: dashed means shut, the one thing it means
     anywhere on this screen, and --rule is a step below the played rows' own
     keyline, which is where the archive belongs in the order of things. */
  .dayarch{
    display:flex;align-items:center;gap:10px;width:100%;
    border:1px dashed var(--rule);background:transparent;
    padding:0 11px;min-height:34px;
  }
  /* the same line once the full version is held, and it must NOT be dashed:
     dashed means shut and means only that, and what this row says then is the
     opposite — everything is open, here is your code. solid is what a day you
     can play wears two rules down (.dayrow.open), which is the right company
     for it to keep. */
  .dayarch.held{border-style:solid}
  /* the auto margin is on the TEXT rather than on the link, because there are
     two links now — `unlock` and `restore` — and an auto margin on each of them
     splits the free space between the pair and floats them apart in the middle
     of the row. pushed from the left, they stay a set at the right-hand end. */
  .dayarch .datext{margin-right:auto;font-size:10px;letter-spacing:.09em;
    color:var(--ink-soft);text-transform:lowercase}
  /* a way through, not the subject: same ink as the line it sits on, and a
     hairline under it rather than a field around it — at 9px an unmarked link
     is not readable as one, and a hairline is the mark this whole card is made
     of. `unlock` opens stripe's own checkout and the sign-in names open the
     provider; see the account section in the script, and worker/ for what is on
     the other end of both. */
  .archlink,.acctlink{
    flex:0 0 auto;text-decoration:none;
    font-size:9px;letter-spacing:.12em;text-transform:lowercase;
    color:var(--ink-soft);border-bottom:1px solid var(--rule);padding-bottom:1px;
    transition:color var(--t-ui),border-color var(--t-ui);
  }
  .archlink:hover,.acctlink:hover{color:var(--ink);border-bottom-color:var(--ink)}
  /* the restore code, once the full version is held. it is what moves a purchase
     onto a device that is NOT signed in, so it is set to be READ OFF A SCREEN
     and typed into another one: tabular figures so the groups line up, wide
     tracking so no two characters touch, and select-all on one click because
     the alternative is dragging across a 9px string. it is data rather than
     copy, so it is the one string on this card that is not lowercase. */
  .dacode{
    flex:0 0 auto;font-size:9.5px;letter-spacing:.16em;
    font-variant-numeric:tabular-nums;color:var(--ink-soft);
    user-select:all;-webkit-user-select:all;cursor:text;
  }

  /* ---------- whose record this is ----------
     the same hairline link the archive uses, for the same reason: a way through
     rather than the subject. a row of three branded buttons is the loudest
     object anywhere in this game and it would sit under a year of somebody's
     days, which is the wrong order of importance — and the marks themselves
     cannot be drawn here anyway. google's is four colours including a red, and
     no red is the one rule this palette has no exception for; apple's and
     facebook's are curves that are on nobody's 45° grid. so the providers are
     set as words, in the voice every other control on this card is set in.
     each is `sign in with <name>` to a screen reader, where there is no palette
     to break and the long form is the clear one.
     the foot is one line and never two: `min-width:0` plus the ellipsis on the
     saying is what holds a long email inside a 640px card on a phone. */
  .rec-foot{
    flex:0 0 auto;display:flex;align-items:center;gap:10px;
    padding:9px 18px 11px;border-top:1px solid var(--rule);
    font-size:9px;letter-spacing:.12em;text-transform:lowercase;color:var(--ink-soft);
  }
  .rec-foot[hidden]{display:none}
  .acct-say{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* the sync state is a footnote to the saying, not a status light: it earns no
     colour of its own, because "saved" is the expected case and a green dot on
     the expected case is furniture. `offline` is the only one worth reading and
     it reads because it is a different word, not because it is a different hue. */
  .acct-state{opacity:.62;flex:0 0 auto}
  .acct-state::before{content:'·';margin-right:6px;opacity:.55}
  .acct-ins{margin-left:auto;flex:0 0 auto;display:flex;align-items:center;gap:10px}
  .acct-ins .acctlink{margin-left:0}
  /* signed in, the saying is a button: it is the way back to the card, and the
     only one. it wears the underline the other links wear so that it reads as a
     way through rather than as a label that happens to be clickable. */
  .acct-who{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;
    min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    border-bottom:1px solid transparent;transition:color var(--t-ui),border-color var(--t-ui)}
  .acct-who:hover{color:var(--ink);border-bottom-color:var(--rule)}

  /* ---------- the account card ----------
     the same card as the record, one size down: it is the record's own
     footnote opened up, so it is built of the same head, the same hairlines and
     the same buttons rather than of a second visual language. */
  .acct-card{
    max-width:400px;width:100%;display:flex;flex-direction:column;
    max-height:calc(100dvh - 40px);overflow:hidden;
    border:1px solid var(--silver);background:var(--surface);box-shadow:var(--shadow-card);
  }
  .acct-body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:13px;overflow-y:auto}
  .acct-ask{font-size:13px;color:var(--ink);line-height:1.45}
  .acct-note{font-size:10px;letter-spacing:.05em;color:var(--ink-soft);line-height:1.5}
  /* a field drawn the way this whole game draws things: a hairline under a
     word, no box and no rounded corner anywhere. the underline thickens to the
     ink on focus, which is the only state change it has. */
  .acct-field{
    appearance:none;width:100%;box-sizing:border-box;background:transparent;color:var(--ink);
    border:0;border-bottom:1px solid var(--rule);padding:7px 1px;font:inherit;font-size:15px;
    letter-spacing:.01em;transition:border-color var(--t-ui);
  }
  .acct-field::placeholder{color:var(--ink-soft);opacity:.75;font-size:13px}
  .acct-field:focus{outline:none;border-bottom-color:var(--ink)}
  /* the code, set as the six figures it is: tabular, tracked wide, so it can be
     read back off the mail a character at a time */
  .acct-field.code{font-size:26px;font-weight:300;letter-spacing:.32em;font-variant-numeric:tabular-nums}
  .acct-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .acct-row .wbtn{flex:0 0 auto}
  /* the opt-in. a real checkbox, because a real checkbox is the one control
     every assistive technology already knows, and `accent-color` is enough to
     bring it into the palette without rebuilding it out of divs. */
  .acct-check{display:flex;align-items:flex-start;gap:9px;cursor:pointer;font-size:12px;color:var(--ink);line-height:1.45}
  .acct-check input{appearance:auto;accent-color:var(--sig-blau);margin:2px 0 0;flex:0 0 auto;width:14px;height:14px}
  .acct-check span{min-width:0}
  /* the quiet foot of the card: sign out, and the one destructive thing in the
     game. it is set in --ink-soft with no field behind it and it takes two
     presses, which is the whole of its safety. no red — there is none here — so
     the confirm carries the weight instead of the colour. */
  .acct-foot{display:flex;align-items:center;gap:12px;padding-top:3px;border-top:1px solid var(--rule);margin-top:2px}
  .acct-foot .acctlink{margin-left:0;padding-top:10px}
  .acct-foot .acctlink.last{margin-left:auto}
  .acct-err{font-size:11px;letter-spacing:.04em;color:var(--ink);
    border-left:2px solid var(--sig-orange);padding-left:9px;line-height:1.45}

  /* the list is the one region on this card that scrolls */
  .daylist{flex:1 1 auto;min-height:0;overflow-y:auto;padding:10px 18px 16px;
    display:flex;flex-direction:column;gap:5px}
  /* ONE LINE, and structurally so: the row never wraps and the middle column is
     the only thing that gives (it ellipses). everything to the right of it holds
     a measure of its own — the bar, the slot the attempt count sits in whether or
     not the day has one, and the chip — so nothing has to be measured to know it
     fits, and the bars line up down the card as a column you can read across.
     that is the difference between a list of days and a scoreboard.
     that claim was false for a while and is true again. the bar spent a spell at
     `flex:1 1 auto`, which made it as wide as whatever the row had left over —
     so a row carrying a clause drew a shorter bar than one that did not, and the
     two rows of this list disagreed about the size of the same instrument. see
     .track.dtrack, where the measure is set and the argument is made. */
  .dayrow{
    display:flex;align-items:center;gap:10px;flex-wrap:nowrap;width:100%;
    font:inherit;color:var(--ink);text-align:left;appearance:none;
    border:1px solid var(--rule);background:var(--surface);
    padding:0 11px 0 0;min-height:38px;cursor:pointer;overflow:hidden;
    transition:border-color var(--t-ui);
  }
  /* silver, not ink: ink is what marks TODAY, so hovering any row used to make
     it look like the row you are on */
  .dayrow:hover{border-color:var(--silver)}
  /* ---------- a day in the archive ----------
     dashed and a step back in ink, which is what shut means everywhere else on
     this card. it draws nothing on the right: `play →` is the mark of a day
     that is open to you, and three hundred greyed copies of it is the shop
     repeated once per row, which is what got these rows deleted the first time.
     the keyline says shut without spending any ink at all.
     the hover moves the DETAIL and not the border. a border that lifts to
     silver on hover is the promise `.dayrow.open` makes — that pressing this
     starts a run — and a shut row must not make it. but it does answer when you
     press it, so it is not inert either, and a row that responds nowhere is a
     row people press twice and then stop trusting. */
  .dayrow.shut{border-style:dashed}
  .dayrow.shut .ddate{color:var(--ink-soft)}
  .dayrow.shut:hover{border-color:var(--rule)}
  .dayrow.shut:hover .ddet{color:var(--ink)}
  /* ---------- a day you have already had your run at ----------
     IT IS NOT DRESSED AS SHUT ANY MORE, and that is the whole of what changed
     here. it was dashed with the date a step back in ink — the card's idiom for
     "not available to you", borrowed from .shut on the argument that a second
     kind of closed should not make the reader learn a second mark. the argument
     was sound and the premise was wrong: this row is not closed. the day was
     played, the row is the record of it, and a free player has been refused
     nothing — a new set of ten arrives every day and that is the finished game.
     dressing their own record as spent was the free tier drawn as a punishment,
     on the one screen they look at their history.
     WHAT IS WITHHELD IS THE REPLAY, so the replay wears the mark: the chip on
     the right of this row is dashed, and the row around it draws exactly like
     the same row does for somebody who has paid. see .dreplay.shut. one fact,
     one mark, at the size of the thing the money actually buys — and it puts
     the idiom on an object small enough that a hundred of them would still not
     make a shop out of a list.
     WHAT SURVIVES IS THE BEHAVIOUR, which was never about ink: a border lifting
     to silver is the promise .open makes, that pressing this starts a run, and
     this row must not make it, because pressing it answers in words instead. so
     the hover moves the detail and the keyline holds still — the same contract
     .shut has, minus the drawing. TODAY is exempt and has to be: .today is ink
     and outranks whatever else a row is, but a :hover carries more weight than a
     plain pair of classes, so an unqualified rule here would drop today's own
     keyline to a hairline under the pointer. */
  .dayrow.spent:not(.today):hover{border-color:var(--rule)}
  .dayrow.spent:hover .ddet{color:var(--ink)}
  /* ---------- your best day ----------
     the month spine stood here and is gone with the long list it navigated.
     what closes the list now is the one reading that still scans the whole of
     playedDays — and closing it is half its job: two rows and then nothing
     reads as a list that failed to load, two rows and then a line that clearly
     ends the list reads as all there is.
     so it is NOT a row. it is a rule with a reading on it: no keyline, no
     surface, no field — a hairline above and type sitting on it, which is the
     mark this whole card is made of and the one shape here that cannot be
     mistaken for a day you could press.
     IT NAMES A DAY AND NO LONGER SCORES IT. the score went hard right in the
     column the played rows draw their ten cells in — and it was the third place
     on one card saying how a day went, after the head and the day's own row.
     what is left is the only thing this line was ever the answer to: WHICH day
     was your best. how well it went is in that day's row, in the cells, and on
     a two-row list that row is usually still on screen. */
  .daybest{
    display:flex;align-items:baseline;gap:9px;margin-top:9px;padding-top:10px;
    border-top:1px solid var(--rule);
    font-size:9px;letter-spacing:.12em;text-transform:lowercase;color:var(--ink-soft);
  }
  .daybest .dbwhen{font-variant-numeric:tabular-nums;letter-spacing:.07em}
  .dayrow .dtier{flex:0 0 auto;width:7px;align-self:stretch;background:var(--tc,var(--rule))}
  .dayrow .ddate{flex:0 0 auto;width:78px;padding:11px 0;
    font-size:10.5px;letter-spacing:.07em;text-transform:lowercase;font-variant-numeric:tabular-nums}
  /* THE ONLY COLUMN THAT MOVES, in both directions: it takes the row's slack
     and it is what ellipses when there is none. everything either side of it
     holds a fixed measure, so a row with nothing to say in words is a date at
     one end and the day's reading at the other with air between them — which is
     what a list item looks like — and a row with a clause spends that air on it.
     it grows because the bar stopped growing. while the bar was `flex:1 1 auto`
     this was `flex:0 1 auto` under a `max-width:47%` cap, and the cap existed to
     stop a long clause crowding the bar; a bar that neither grows nor shrinks
     cannot be crowded, so the cap and the two rules that lifted it for .shut and
     .open went with it. the growth is also what pins the right-hand objects to
     the row's edge, and it is now the only thing that does: an auto margin has
     no free space left to move anything with once this has taken it, so the two
     that used to hold that edge are gone — see .dstate and .dreplay. */
  .dayrow .ddet{flex:1 1 auto;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    font-size:10px;letter-spacing:.09em;color:var(--ink-soft);text-transform:lowercase}
  /* ---------- the day's ten ----------
     the head's bar, at the row's size: one length divided by colour, ten cells,
     no gaps. it is `.track` — the object the masthead draws three of and the
     record's own head one of — and rungTrack draws both from one function.

     WHAT IT REPLACED, because that argument was a good one and deserves an
     answer rather than a deletion. it was a height ladder: ten narrow bars,
     full for perfect, two thirds for clean, a third for done, and a hairline
     for a net the day never reached. HEIGHT was chosen because hue could not be
     leant on — turquoise against violet measures 1.43 in greyscale on either
     ground, which is a reading a screenshot, a monochrome panel and anyone
     whose cones do not part those two would lose. all of that is still true,
     and it is what this costs.
     what changed is that the ladder stopped being the only drawing on the card.
     the head above these rows is a BAY now, and it draws the same ten as a
     length divided by colour — so one screen said the day's ten twice, in two
     forms, a few inches apart, and you had to learn both to read one card. one
     instrument used twice beats two used once, and the ladder was the odd one
     out rather than the bar: the masthead's set strip, the turns bay, the
     cleared card's strips, the share plate and now the head are all this shape.
     the note that stood here called the ladder "the form the file already has
     twice", and it was — until `.track` gave up its divisions and became a
     single unbroken length. a row of separated blocks stopped being that form
     on the day that landed, and this is the debt from it being paid.
     WHAT THE BAR WINS beyond agreeing with itself: the ladder spent most of its
     box on the air above the short rungs, and it could only say how FAR the day
     got in the hairlines along its baseline, which is the one part of it nobody
     reads. filled length against bare says that at a glance — the masthead's
     own picture of the day ahead — and it is why `n of 10 nets` came out of the
     words beside it.
     colour is the sole VISUAL carrier of the breakdown, and that is the trade —
     the count in words came off the row when the bar took its column, so what is
     left in greyscale is the filled length. the row's aria-label still spells the
     rungs out, so nothing is lost to a screen reader. the share plate keeps its
     height ladder and should — see SHAREFILL, where the reading has to survive a
     feed's thumbnail with no words anywhere near it. */
  /* ---------- ITS MEASURE, and it is a column of a list rather than a chart ----
     the owner asked for a row that is less dominant, and the bar is what was
     dominating it: 414px of saturated colour and 10px of height against a 10.5px
     date, which is a chart with a date attached rather than a day in a list.
     THE HEIGHT CARRIES NOTHING and pays for the most. the two readings here are
     how far the day got — filled length against bare — and how it went, in the
     proportions of colour along that length. both are read ALONG the bar, so
     every pixel of height is ink spent on neither: 10px to 6px is 40% of the
     mark's area for nothing the eye was using. the floor is the bare run rather
     than the rungs, because --rule on --surface is the faintest pair on the card
     (1.28 dark, 1.46 light) and a field that thin is where it stops being a
     field — checked on both grounds at this height with four cells unreached,
     which is the case that needs it, and it still reads as a length.
     IT STOPPED GROWING. `flex:1 1 auto` gave it every pixel the row had spare,
     which is how it got to 414 — and it also meant the bar was as long as the row
     was empty, so a day with a clause beside it drew a shorter bar than a day
     without one, and the count that now sits between the bar and the chip would
     have shortened it again. a fixed 240 is the same instrument on every row, at
     40% of the row's width where it was at 69%. what took the space back is the
     detail column, which grows now; see .ddet.
     it can still SHRINK — `0 1 auto` with a floor — and that is a safety rather
     than a working part: at the three sizes this game is checked at the row has
     room for everything on it, so nothing here ever gives. it is what stops a
     window narrower than any of them clipping the chip off the row's end.
     WHY 240 AND NOT LESS, measured rather than judged: the masthead draws these
     same ten cells at 245px on this window, and that is the bar every player
     reads all day while they play. matching its LENGTH and dropping its height is
     the trade this row can make — the reading is unchanged and the ink is not —
     and going shorter than the board's own instrument would be spending
     legibility the game has already priced. */
  .track.dtrack{
    flex:0 1 auto;width:240px;margin-left:16px;margin-top:0;min-width:120px;height:6px;
    /* the track's own ground is --rule, and --rule on --surface measures 1.28
       on the dark ground and 1.46 on the light: no mark at all, which is what
       the note on .record already says of that pair. on the masthead the track
       sits on the rail and reads; on this card it would draw nothing, and a day
       left at six would be a short bar with no box around it to be short of. so
       the ground goes and the unreached cells carry themselves, below. */
    background:transparent;
  }
  /* a net the day never reached is a BARE BLOCK, the same as the masthead's own
     track and for the owner's own reason: the two instruments are the same
     object and were not reading as it. the masthead draws the day ahead as a
     grey length the coloured run eats into, and this drew it as a 1px hairline —
     so the bar a player meets on the board and the bar they meet in the record
     said the same thing in two different shapes.
     IT IS --rule, the masthead's own token, and the note that used to sit here
     rejected it on a measurement taken for the wrong shape. 1.28 on the dark
     ground and 1.46 on the light are the numbers for a HAIRLINE, where they are
     indeed nothing; the same pair under a 10px block two hundred wide is a
     plainly visible field, because a large area needs a fraction of the contrast
     a thin line does. silver was the honest answer to the old question and the
     wrong answer to this one — on the light ground it comes out DARKER than the
     rungs it is a ground for, so the bar reads as filled where it is empty and
     empty where it is filled. --rule sits under the colour on both grounds,
     which is the relationship the masthead has and the reason this matches it.
     WHAT IT COSTS, since the hairline was a decision and not an oversight: a
     hairline is unmistakably not a rung, and a block is a rung's shape. a day
     left at six now draws a full-width bar with four grey cells rather than a
     bar that visibly stops short. filled-against-bare is still the reading —
     it is the masthead's reading — but it is now carried by colour alone where
     it used to be carried by shape as well.
     no gaps between them, so four unreached nets draw one grey length four
     cells long — the same grammar the coloured runs follow. */
  .track.dtrack > i:not(.on){background:var(--rule)}
  /* a finished reading and not a live one: a
     cell easing into its colour is a rung being minted, and nothing is minted
     on this screen. it matters here as well as there, because a ground flip
     changes what every --fill resolves to. */
  .track.dtrack > i{transition:none}
  /* ---- THE FLAWLESS DAY, in the record ----
     the CELLS stay gelb here and do not go rosa, which is the one place the day
     and the stamp deliberately part. a cell is one net's rung and every net in a
     flawless day is genuinely `perfect` — recolouring them would be the bar
     telling ten small lies to make one large true statement. flawless is a fact
     about the SET, so it is drawn under the set: a rosa rule the width of the
     whole bar, which is the mark for the day the way the cut is the mark for the
     stamp, both in the same colour.
     IT IS A PSEUDO-ELEMENT AND CHANGES NO LAYOUT, and the version before it did
     both the wrong ways. it took the rule as a border-bottom with padding above
     it, inside a track that is exactly 6px tall — so the padding ate the bar and
     a flawless day drew as a HAIRLINE while every ordinary day drew as a block:
     the best day in the record was the thinnest mark on the card. it also cut
     the two ends at 45° to echo the stamp, which at 6px on a 240px bar is a
     detail no one can see and which clipped the rule off with it.
     `top:calc(100% + 3px)` hangs it below the track rather than inside it, so
     the six pixels stay six pixels at every breakpoint — .dtrack's height is
     restated in three places and none of them has to know about this.
     `overflow:visible` is the one thing it has to undo, and it is safe for
     exactly the reason the base rule needs the opposite: .track clips its
     children so a RUN — the moving length on the crossings and turns bays —
     can never draw longer than the number it reports. this class only ever
     lands on a ten-cell rung track, which has no run in it and nothing to
     overshoot, and it is applied only when all ten cells are there. */
  .track.flawless{position:relative;overflow:visible}
  .track.flawless::after{
    content:"";position:absolute;left:0;right:0;top:calc(100% + 3px);
    height:2px;background:var(--sig-rosa);
  }
  /* played, but filled in from the archive rather than earned on the day —
     hatched, the mark the calendar used, and the reason it never touched the
     streak. a bought day fills the grid; it cannot buy the run of days. */
  /* `--tc` carries its own fallback here as well as on .dtier: a backfilled day
     from a legacy save has no recorded rung and sets no --tc, and a bare
     `var(--tc)` inside a gradient is invalid at computed-value time — which
     drops the whole background and draws NOTHING, rather than dropping through
     to the hairline the way .dtier does. */
  .dayrow.back .dtier{background:repeating-linear-gradient(45deg,var(--tc,var(--rule)) 0 3px,var(--surface) 3px 6px)}
  /* a day you can still play is SOLID. it was dashed, and dashed is the idiom
     for "not available yet" — so the primary call to action on the screen, and
     today's own row, were drawn as though disabled, and playing one rewarded you
     by making it solid. dashed now means exactly one thing, below: shut. */
  .dayrow.open{border-color:var(--silver)}
  /* a shut day has no row of its own any more — see .dayarch, which carries the
     whole run of them in one line at the foot of the list. */
  /* today outranks both: whatever else the row is, it is the one you are on */
  .dayrow.today{border-color:var(--ink)}
  /* ink, not a signal colour: the ladder owns the hues, so a border in one of
     them reads as a tier the row did not mint */
  .dayrow.open:hover{border-color:var(--ink)}
  /* `.druns` and its note stood here: a `×2` multiplier on the right of a row
     played more than once. the owner cut it (17 Aug 2026) — how a record was got
     is not the record, and it was a fourth object in a row that already carries a
     date, a clause, a ten-cell bar and the replay chip. `runs` is still counted in
     stampToday and still merged as a max in worker/merge.js, because it is a fact
     about the day and cheap to keep; nothing in the client draws it. */
  /* the one chip left on a row: `play →` on a day still open to you. it takes
     the slot the bar takes on a played row, so the right edge of the list is one
     column whatever the row is. it held that edge with `margin-left:auto` and
     does not need to any more: .ddet grows into whatever the row has spare, so
     there is no free space left for an auto margin to move anything with, and
     ONE mechanism pins every right-hand object on every row instead of two that
     have to agree.
     the border, the ink and the hover come off the shared control block by
     .rec-close — this sets the SIZE, which is the only thing a row's button
     needs to differ in. the hover used to turn the chip hellblau while the row
     around it turned ink: one press, two colours, and the blue was the row's
     only signal hue at rest. it takes ink now, with the row. */
  .dstate{flex:0 0 auto;display:inline-flex;align-items:center;
    justify-content:center;gap:5px;height:24px;padding:0 9px;
    font-size:9px;letter-spacing:.11em;text-transform:lowercase}
  .dayrow.open .dstate{color:var(--ink)}
  /* square, and the margin is real rather than `auto`: an auto margin eats the
     row's free space before anything else can, and the detail column is what
     takes it now — with `auto` here the chip would sit at the right edge and the
     bar and the count would be pushed off the middle of the row instead. the
     glyph carries a chip on its own so it takes more than the 9px the worded
     chips are set in.
     the legacy row used to need an exception here — a save with no stored rungs
     draws no bar, and the chip landed against the end of the detail rather than
     at the row's edge. it does not any more: .ddet grows on every row, so the
     row's right-hand objects are pinned by the column to their left whether or
     not there is a bar among them. */
  .dreplay{width:24px;padding:0;margin-left:10px;font-size:13px;letter-spacing:0}
  /* ---------- the replay you have not bought ----------
     the chip is drawn on every played row now, because it is the product: a
     buyer who never sees it never finds the thing they paid for, and a free
     player who sees their row apologise instead is being told the game they are
     playing is the broken half of a better one. it is neither. so the row draws
     what money adds, and this is the mark for "not yours yet".
     IT IS DASHED AND THAT IS ALL, which is exactly .wbtn.shut and .dayrow.shut
     and the archive line at the foot of this list. dashed means shut and means
     nothing else anywhere in this game, so the reader has no second idiom to
     learn — and the three rules AGENTS.md draws round this are all kept by
     drawing nothing: no lock glyph, because a lock on a day you PLAYED reads as
     a day taken away from you rather than one you finished; no field, because a
     saturated field on a row is the single thing that got the archive rows
     deleted the first time; and no press to checkout, because the chip is a span
     inside the row and the row answers in words. the ink does not step back with
     the keyline: --ink-soft is already the resting colour of every chip here,
     and the step below it is --silver, which measures 3.1 against this row's own
     ground on the dark theme — a 13px glyph in it is a mark you have to hunt
     for, and a locked thing still has to be visible to read as locked.
     it keeps a hover, for .wbtn.shut's reason: it is shut, not disabled, and it
     does answer when pressed. the ink lifts and the keyline holds still, so it
     never lights up as though it were about to start a run. the live chip does
     the opposite and both move, because the row under it genuinely does. */
  .dreplay.shut{border-style:dashed}
  .dayrow:hover .dreplay:not(.shut){border-color:var(--ink);color:var(--ink)}
  .dayrow:hover .dreplay.shut{color:var(--ink)}
  /* `.askrungs` and `.askruns` stood here: the day's ten and its attempt count,
     drawn on the card that used to offer a day before starting it. the card is
     gone (16 Aug 2026, see openDay) and nothing else ever wrote either class, so
     the four rules had no selector left to match. the readings did not go with
     them — the record's own row draws the same bar, at `.track.dtrack`, which is
     what these were re-measuring for a card's width. */

  /* the rules card is read, not admired: one column, no artwork plate.
     it is also a reference you come back to, not a lesson — the guided net does
