     screen, so the lessons' own mark appeared for nobody. renderHud is what every
     move, every veil and every entitlement answer already calls.
     both are computed and never stored, the same way the archive's lock is (see
     POLICY.premium): that is what makes a purchase retroactive, and what shows the
     lessons' door on the same frame the third one clears.
     the lessons' mark waits until they are behind you — pressing it mid-tutorial
     would restart the tutorial the player is inside — and the till's waits for a
     server that says it can take money, and hides again the moment it says the
     player already holds it. */
  $('tutbtn').hidden = !store.tutorialDone;
  $('buybtn').hidden = !(canBuy() && !POLICY.premium);
  const trial=isTrial();
  const {optimum,par}=netTargets();
  const tier=liveTier();

  /* ---- today's set ----
     ten cells: a cleared net MINTS its own in the tier it earned, the net you
     are on carries the ink ring, and the rest are the day still ahead in
     silver. the ink cell is why the masthead no longer repeats the net number
     the board already carries in the corner — the strip says where you are by
     position.
     the strip used to open as ten empty cells and fill from the left, which
     made it the only instrument in the head that started at nothing while the
     two beside it started full and drained. that was one form and two
     behaviours. it starts full now: ten blanks of silver, each converted to its
     rung as you play it, so all three tracks open solid and all three are spent
     across the day. what the strip spends is the day itself.
     nothing about the reading moves. the cells are still ten, the divisions are
     still hairlines, and each one still records the rung its net minted — the
     change is only what an UNPLAYED cell is drawn in, which was the absence of
     a colour and is now a material. an absence cannot be a rung; neither can
     silver, and that is why it is the one chosen.
     this is the share strip too, which is the reason it is worth ten cells of
     the masthead: the day is the same ten for everyone, so the strip compares.
     it is still TEN CELLS underneath — the rung each net minted is still a
     separate thing, and the strip is still what gets shared — but the divisions
     between them are no longer drawn, so it reads as one length like the two
     bays beside it. what that costs is countability WITHIN a run of the same
     rung: four clean nets in a row are one clean length now and cannot be
     counted off. the numeral above has always been the count, the boundary into
     the day ahead is still exactly where you are, and the cells themselves are
     untouched for anything that reads them. see the note by .track. */
  const D=POLICY.dailyNets, tut=inTutorial();
  // a trial has no ten, so its strip rolls: a band of ten that empties and refills
  const cells=trial?r.cleared.slice(r.cleared.length-r.cleared.length%D):r.cleared;
  /* three steps rather than ten nets, filled as they are reached and all in the
     one colour — see the label above for why a step is not a rung. */
  if(tut){
    const step=Math.min(tutStepAt,3);
    paintCells('setmeter',Array.from({length:3},(_,i)=>'var('+(i<step?TIERCOL.perfect:SETAHEAD)+')'),
      'tutorial step '+step+' of 3');
  } else
  /* every cell is handed a colour now, so paintCells never draws its empty case
     here any more. the case stays in paintCells rather than being torn out: it
     is one `if`, and a track handed a hole should draw a hole rather than throw. */
  paintCells('setmeter',Array.from({length:D},(_,i)=>'var('+(cells[i]?tierCol(cells[i].tier):SETAHEAD)+')'),
    cells.length+' of '+D+' nets cleared');
  /* the cells persist between renders now (paintCells reuses them so the colour
     can transition), so `now` has to be cleared off the cell that was carrying
     it — it used to be discarded for free when the strip was rebuilt. */
  const strip=$('setmeter');
  [...strip.children].forEach(c=>c.classList.remove('now'));
  const cur=strip.children[cells.length];
  if(cur && !r.over) cur.classList.add('now');
  /* nets at or above the clean line, drawn in the clean line's own colour —
     which is what let the word "clean" come off it. the strip beneath is the
     referent: an orange numeral over orange cells, and a green cell reads as
     plainly better than orange without having to be told that it is. green is
     the top of the ladder and is the "nicer colour" a perfect lands on: against
     a silver blank it is the largest step any cell in the strip can take.
     this instrument still records what was EARNED while the other two show what
     is left — that difference is real and is carried by the colours themselves
     now rather than by one bar starting empty while two started full. a cell
     that has gone from silver to a signal colour is a thing gained; a bar that
     has shortened is a thing spent. same direction of travel, opposite meaning,
     and the eye gets both without either instrument breaking the form. */
  const cleanN=r.cleared.filter(c=>TIERRANK[c.tier]>=TIERRANK.clean).length;
  /* the guided net is not part of the day's ten and never was — it is one net
     played before the set starts. so the bay says what is actually happening and
     counts UP through the three steps, instead of showing a set that has not
     begun and a countdown from ten that the tutorial can never move. every step
     is drawn in `perfect`, because a step is not a rung: nothing here is being
     scored, and colouring it anything else would invent a grade for a lesson. */
  $('setlabel').textContent=tut?'tutorial':(trial?'time trial':"today's set");
  /* the numeral counts DOWN, like the two beside it: nets still to play, ten to
     nothing. all three readings in the head now answer "how much is left", so
     the day ends with three noughts rather than two noughts and a ten.
     the CELLS still fill, and that is deliberate — they are the only record of
     which rung each net minted, and a strip that emptied as you played would
     erase the day while you were having it. so the number is what is spent and
     the strip is what was earned. */
  $('setnum').textContent=tut?Math.min(tutStepAt,3)
    :(trial?r.cleared.length:Math.max(0,D-r.cleared.length));

  /* ---- turns against par ----
     ONE line at a time, and the whole bar is that line.

     it used to draw both lines at once — a solid run for the turns that still
     left a perfect and a half-strength run for the ones that only left a clean —
     two bands sharing ten pixels, in which the band you were actually chasing
     was whichever one you worked out you were standing in. and the two were the
     same colour in practice: `--hue-soft` mixed `--hue` with the track, which on
     a bar sitting ON that track is a band you cannot find.

     so the bar is a budget, and there are three of them in sequence. while a
     perfect is still on, the bar IS the perfect budget: full at the first turn,
     draining to nothing exactly as the optimum runs out. the turn after that it
     hands over — refills, and is now the par budget, draining the same way. past
     par it inverts and builds up from nothing, which is the one reading here
     that counts UP, because turns over par are the only thing in this game you
     accumulate rather than spend.
     each phase gets the whole width, so the same ten pixels answer one question
     at a time and the numeral beside it always names the line the bar is drawing.
     zero is still not failure — the day cannot be failed, and the rung the net
     mints is the strip's business.

     `graded` is the two cases with no perfect to chase: no optimum standing
     under par for this net — which from v5's `gap` rule means no optimum at
     all, so it is the time trial and the frozen days up to 2026-08-13, see
     netTargets — and a net under descent, which is capped at done. both
     skip straight to the par budget, which is then the whole of par rather than
     the part of it past the optimum. */
  const t=r.netMoves, over=t>par;
  const hasOpt=optimum<par, capped=(tier==='done'&&!over);
  const graded=hasOpt&&!capped;
  /* `<=` is what makes this agree with the rung it counts toward: tierFor awards
     perfect at moves===optimum, so standing exactly on the optimum reads "0 to
     perfect" — one more and it is gone — rather than jumping to par a turn
     early. the bar is empty at that moment and that is correct: the budget is
     spent, and the perfect is still yours until you spend one more. */
  const chasing=graded&&t<=optimum;
  /* BOTH LINES, ON ONE BAR, FROM THE FIRST TURN. the bar is the whole run to
     par, and the yellow head of it is the part that would still leave a perfect —
     so the join between yellow and turquoise IS the perfect line, standing where
     it will be, and you can see from the opening turn how much of the run is
     perfect and how much is only clean.
     it drains from that end, so the yellow shortens first: when it runs out you
     have spent the perfect and the turquoise is what is left to par. no refill,
     because there is nothing to hand over to — the par run was always on the bar,
     you were simply looking at the front of it.
     (it says yellow because `perfect` is yellow: this described a green head for
     two ladders, and outlived both.)
     this replaces a version that gave each line the whole width in turn. that one
     read well moment to moment and could not answer the question the owner
     actually had, which is where par sits while you are still chasing perfect.
     the WORDING still switches — the numeral names the nearer line you can still
     make — so the reading changes hands even though the bar does not. */
  const left=Math.max(0,par-t);
  const perfectLeft=graded?Math.max(0,Math.min(left,optimum-t)):0;
  let pct, segs, num, unit, lap=-1;
  if(over){
    /* PAST PAR THE BAR FILLS AGAIN, and the full bar is TWICE par rather than
       par. the overspend is the one reading here with no ceiling of its own, so
       the scale is a choice about how much runway it gets before it pins and
       stops saying anything — and at one par it pinned almost at once on the
       nets where it matters most. today's ten are par 3, 3, 3, 4, 8, 6, 9, 11,
       13, 15: on the first four the whole build was over in three or four turns
       and then sat full for the rest of the net.
       at twice par the rule is still one you can state — a full bar is double
       what the net should have cost — and every net gets a build long enough to
       read as one. it halves the fill rate on the deep nets too, which is not a
       side effect worth apologising for: seven over on a par-15 net drew as
       nearly half a bar, and seven over on fifteen is not half a disaster.
       the numeral is untouched either way. it names the exact overspend from the
       first turn past par and keeps naming it long after the bar has pinned, so
       nothing is lost at the ceiling except the picture.
       AND IT NO LONGER PINS. twice par is the length of a LAP now rather than a
       ceiling: the bar wraps there and fills again in the next colour, forever.
       see LAPCOL. the arithmetic below is the old line with the clamp taken off
       and the remainder taken instead, so the first lap draws what it has always
       drawn, to the pixel, up to and including the turn it fills at. */
    const span=2*par, overBy=t-par;
    lap=Math.floor(overBy/span);
    pct=100*(overBy-lap*span)/span;
    segs=[{col:`var(${LAPCOL[lap%LAPCOL.length]})`,grow:1}];
    num=overBy; unit='over par';
  } else {
    pct=100*left/par;
    segs=[{col:'var(--par-perfect)',grow:perfectLeft},
          {col:'var(--par-par)',    grow:left-perfectLeft}];
    num=chasing?optimum-t:par-t;
    unit=chasing?'to perfect':'to par';
  }
  /* crossing par is one of two moments the bar does something other than shorten:
     it empties, then starts filling again from the other end, and at --t-ui
     (170ms, the hover speed) that reversal reads as a glitch rather than as a
     turn. so that change gets a slower sweep. the perfect line needs none — the
     bar simply keeps draining through it, which is the point of drawing both.
     the other moment is a lap wrap, and it wants the opposite treatment for a
     reason spelled out where it is handled, below. */
  const meter=$('parmeter'), phase=over?'over':'under', bar=meter.firstElementChild;
  /* a cleared net holds this bay until the next one is built, the same way it
     holds the crossings one — see holdGauge. what it holds is this net's own final
     score: the bar wherever it stopped, on the lap it stopped in, and the numeral
     naming the same line. clearNet has already advanced netIndex and zeroed
     netMoves, so EVERYTHING computed above this line describes the next net, and
     any of it drawn here would be that net's opening budget standing beside a card
     announcing the one that just cleared.

     the numeral goes with the bar rather than carrying on, which is a change: it
     used to be written through the hold, because a flag over the bar had nothing
     to contradict. now that the bar is a reading again, a live numeral over a held
     bar would be the one place in this function where the two name different
     lines — see the note where they are written for why that is the thing being
     avoided.

     the phase is still written, because it is not a reading: it decides whether
     the NEXT paint gets the 520ms sweep, and a stale one would open the next net
     on a sweep inherited from this one. the lap bookkeeping below needs no such
     care — the next net is under par, which clears both the ground and the lap. */
  if($('parrow').dataset.done){
    meter.dataset.phase=phase;
    return;
  }
  if(!reduceMotion && meter.dataset.phase && meter.dataset.phase!==phase){
    bar.style.transitionDuration='520ms';
    clearTimeout(meter.__phaseT);
    meter.__phaseT=setTimeout(()=>{ bar.style.transitionDuration='' },560);
  }
  meter.dataset.phase=phase;
  /* the ground under the bar is the lap it just finished, so a lap that has
     filled and the next one at nothing are the same picture. lap zero has no
     previous lap and falls back to the bare track — which is what every net
     under par is already drawing, and what crossing par has always looked
     like. see LAPCOL and .track.parmeter. */
  if(lap>0) meter.style.setProperty('--lap-under',`var(${LAPCOL[(lap-1)%LAPCOL.length]})`);
  else meter.style.removeProperty('--lap-under');
  /* the wrap is the one width change that must NOT ease, and for the opposite
     reason to the par crossing above. the run goes from nearly the whole bay to
     nothing while the segment inside it is rebuilt in the NEXT colour — so an
     eased wrap draws a full bar of the new colour collapsing to a sliver, which
     is precisely the flash the ground was arranged to avoid. killed for one
     paint and handed straight back, with the reflow between so the width lands
     under the zeroed duration rather than after it.
     the previous lap has to be read before it is written, and only while the
     bar was already past par: arriving over par is a phase change, which the
     block above already owns. */
  const wrapping = over && meter.dataset.lap!==undefined && meter.dataset.lap!==String(lap);
  if(wrapping){ clearTimeout(meter.__phaseT); bar.style.transitionDuration='0s' }
  if(over) meter.dataset.lap=lap; else delete meter.dataset.lap;
  paintRun('parmeter',pct,segs,num+' turns '+unit);
  if(wrapping){ void bar.offsetWidth; bar.style.transitionDuration='' }
  // the numeral and its unit come off the same branch that drew the bar, so the
  // two can never name different lines
  $('parnum').textContent=num;
  $('parof').textContent=unit;

  $('field').classList.toggle('over',!!r.over);
  /* `statusword` was written here — "day complete", "out-trained", "time trial".
     the element is gone and so is the reading: the trial case is what setlabel
     above already switched the third bay to, and the over case arrives as a card
     over the board. see the note where .unit-feet used to be. */
  /* the button says the date and stops there. the streak used to ride on the end
     of it — `15 aug · 5` — and a bare numeral after a two-part date reads as a
     third part of the date rather than as a count of days. labelling it here was
     never the answer: this is one of three controls sharing the head's right
     edge, and on a phone they are already 34px squares that had to give width
     back to keep the row inside the panel (see .btns .help there).
     the reading is not lost with it, which is why it could go rather than move.
     the welcome back card leads with it as `n days running`, once a day, at the
     moment coming back is the thing the number measures; the cleared day card
     keeps it in .bquiet for a reader with no masthead to glance at. the title
     drops it too — a tooltip naming a reading the button does not show is the
     same fragment with a label bolted on where nobody reading the button is
     looking. */
  const d=new Date(), mo=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
  $('statusdate').textContent=`${d.getDate()} ${mo[d.getMonth()]}`;
  $('histbtn').title=`the record · ${d.getDate()} ${mo[d.getMonth()]}`;
}
function renderAll(){
  buildNet(); renderHud(); refresh(); startPhysics(); renderTutorial();
  if(R().over) setTimeout(showRunOver,200);
}

/* ================= misc ================= */

function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}

/* ---- share card: the day rendered as a plate ----

   this is the one thing the game makes that leaves the sharer's screen, and it
   lands in a feed beside other people's. so everything on it has to be a
   reading that DIFFERS between two players who both played today — and the day
   being a fixed ten that cannot be failed kills most of what a run knows about
   itself. depth is ten for everyone who finishes. the same ten nets free the
   same features for everyone. par is the same par.

   two things differ, and they are the whole card:
     the SCORE — turns against par, which the record screen and the masthead
     both now lead on; and
     the STRIP — one cell per net in the rung it minted, which is the
     comparable, Wordle-grade artifact now that everyone plays the same ten.

   what was here led with `depth` at 76px over the words "nets deep" (identical
   for every finisher), captioned it `n/16 collected` (a finished day frees
   about fourteen of the sixteen, so it saturates in two or three days — the
   same terminal counter the record screen and the welcome card have already
   deleted), listed `features named` and `streak`, and drew eight feature tiles
   whose emblem marks were forced to white in defiance of markOn. all of that is
   gone. the sun, the wordmark, the date and the imprint stay: they are the
   plate, not a reading. */

/* the plate is FIXED and near-black, and that is measured rather than chosen.
   the ladder is canonical on any ground — see TIERCOL, and two players on
   different grounds have to post the same card besides — so the only question is
   which ground carries canonical gelb, tuerkis and violett at once. contrast
   against the three rungs, and against white type:
     ink   #0E1214   11.20  5.91  4.13   type 18.83
     paper #EAE7DF    1.36  2.58  3.69   two rungs under 3:1
     white            1.68  3.19  4.56   canonical gelb is unusable on paper
   the ink plate is the only ground where all three rungs clear 3:1, and it is
   the only one where they do so comfortably. so the card commits to it and does
   not follow the theme, the same literal markOn already carries. this is also
   the reason the on-screen ladder USED to read --sig-gelb rather than this one.
   it no longer does: 1.68 on white is not a rung when the rung is a line, and
   the ladder is a fill everywhere it is drawn — see TIERCOL. what the plate
   still gets that no on-screen ground can is all three rungs clearing 3:1 at
   once, which is why it is chosen rather than inherited.
   dunkelblau used to be on this list, because the bulletin was a dunkelblau
   plate and shared this table's problem — nothing measures strong on it, which
   is why no rung could BE it and, transitively, why the ladder was three near
   neighbours. the bulletin is a --surface card now; that row is gone and so is
   its grip on TIERCOL. see the note there.
   what the new ladder gets back on this plate is the ORDER: 11.20, 5.91, 4.13
   is monotonic, so perfect is the brightest mark and done the dimmest, which the
   previous three could not manage in a narrow .276/.319/.280 band. SHAREFILL
   below still draws the rung as a HEIGHT, because that is the channel that
   survives a greyscale feed whatever the colours do. */
/* the game's name, in one place, for everything JS draws. the masthead's own
   <h1> is static markup and carries it literally; everything generated —
   the share plate, the share text, the exported filename — reads it from here,
   so a rename cannot leave one surface saying something else.
   NOT the localStorage key. that is `probe-run-v3` and it stays that way
   whatever the game is called: the key is keyed to the ORIGIN, so renaming it
   would silently wipe every existing player's collection and streak, and there
   is no backend to recover them from. see KEY, and the second copy of that
   literal in the boot script at the top of the file. */
const WORDMARK='features';
const PLATE='#0E1214';
const PLATEINK=lum(PLATE)>0.192?'#0E1214':'#ffffff';   // the mark rule applied, not asserted
/* the strip's second channel: the rung as a HEIGHT, so the reading survives a
   greyscale feed, a colour-blind reader, and the thumbnail a feed actually
   shows. perfect full, clean two thirds, done one third — the same three
   fractions the record's day rows drew in css until they became bars.
   IT IS NOW THE ONLY HEIGHT LADDER LEFT, and it should be. inside the app the
   count is always in words beside the picture, so the record's rows could give
   the channel up for one instrument used everywhere — see .track.dtrack. a
   share plate has no words anywhere near it: it goes into a feed as a thumbnail,
   through a greyscale render, past a reader whose cones do not part turquoise
   from violet, and the height is the whole of what survives that. the two
   screens diverge here on purpose and for a reason that only holds on one.
   the unreached net differs too. the record's rows draw it as a silver hairline
   on the bar's centreline; the card draws it as the empty FRAME the played bars
   rise inside, because at seventy pixels a frame is what makes a one-third bar
   read as a third of something, and because it leaves a day left short visibly
   unfinished.
   `par` and `over` are the dead tier keys TIERRANK still carries for badges
   minted under older schemes; they ride with their live equivalents, exactly as
   they do in TIERCOL. */
const SHAREFILL={perfect:1, clean:2/3, par:2/3, done:1/3, over:1/3};
/* and the same ladder in text, for the clipboard fallback. deliberately NOT
   emoji. the ladder is yellow, turquoise, violet, and the emoji set has honest
   squares for two of them — 🟨 and 🟪 — and nothing at all for turquoise: the
   set has 🟦 and 🟩 and the rung sits between them, so the MIDDLE of the ladder
   would be the one that lied. the previous ladder failed the same test from the
   other end (one blue character for two blue rungs). a strip in which any rung
   is drawn as a colour it is not says less than no strip. the block characters
   carry the card's own height encoding instead, and cannot contradict a colour
   they never state. */
const SHAREBLOCK={perfect:'█', clean:'▅', par:'▅', done:'▃', over:'▃'};
const SHAREEMPTY='▁';                 // a net of the day still to play
const CARD_W=760, CARD_H=470;

/* everything the card is built from, read off the run itself: the cleared nets'
   own turns and par — exactly the pair stampToday writes to the day row and the
   pair the run-over bulletin totals — and the rungs those nets minted, which is
   what the card now leads on.
   `slots` is the denominator for BOTH the strip and the count, and it is the
   same number for a good reason: a daily set is scored out of the day's ten
   however many of them were played, and a trial, which runs past ten, is scored
   out of its own length. see rungCount. */
function shareFigures(r){
  const cells=(r&&r.cleared)||[];
  const slots=Math.max(POLICY.dailyNets,cells.length);
  return {cells,slots,
    turns:cells.reduce((a,c)=>a+(c.moves||0),0),
    par:cells.reduce((a,c)=>a+(c.par||0),0),
    rung:rungCount(cells.map(c=>c.tier),slots)};
}
function shareCardSVG(){
  const r=R(), W=CARD_W, H=CARD_H, M=44, RX=W-M;
  const {cells,turns,par,slots}=shareFigures(r);
  const played=cells.length>0;
  const sp=scoreParts(turns-par);
  /* nothing cleared is not level par, it is a day not started. the figure says
     so rather than printing a score nobody played for. */
  const fig=played?sp.fig:'0', word=played?sp.word:'nets played';
  const numeric=/^\d+$/.test(fig);

  /* the strip. `slots` frames on one baseline; a played net rises out of its
     frame to the height of its rung, an unplayed one stays an empty frame. the
     frame is what makes a `done` cell read as a third of something rather than
     as a small mark on its own, and it is what makes the day ahead visible
     without needing a colour of its own. */
  const SY=312, SH=72, GAP=slots>12?4:8, CW=(RX-M-(slots-1)*GAP)/slots;
  const strip=Array.from({length:slots},(_,i)=>{
    const x=(M+i*(CW+GAP)).toFixed(1), w=CW.toFixed(1), c=cells[i];
    const frame=`<rect x="${x}" y="${SY}" width="${w}" height="${SH}" fill="none" stroke="${PLATEINK}" stroke-opacity=".3"/>`;
    if(!c) return frame;
    const h=Math.round(SH*(SHAREFILL[c.tier]||SHAREFILL.done));
    return frame+`<rect x="${x}" y="${SY+SH-h}" width="${w}" height="${h}" fill="${cssv(TIERCOL[c.tier])}"/>`;
  }).join('');

  /* the key. the card lands in front of people who have never played, and a bar
     chart of an invented ladder is decoration to them. three cells at the three
     heights, in the three colours, named. */
  const LY=414, KW=11, KH=20;
  let kx=M;
  const key=['perfect','clean','done'].map(name=>{
    const kh=Math.round(KH*SHAREFILL[name]);
    const g=`<rect x="${kx}" y="${LY-KH}" width="${KW}" height="${KH}" fill="none" stroke="${PLATEINK}" stroke-opacity=".3"/>`
      +`<rect x="${kx}" y="${LY-kh}" width="${KW}" height="${kh}" fill="${cssv(TIERCOL[name])}"/>`
      +`<text x="${kx+KW+13}" y="${LY-4}" font-size="14" letter-spacing="2" fill-opacity=".8">${name}</text>`;
    kx+=KW+13+name.length*9.3+22;
    return g;
  }).join('');
  /* the only states the strip cannot draw for itself: a day left short says how
     far it got, and a trial says it is not a day at all. a finished daily set
     says nothing, because ten of ten is the same for everyone who got there. */
  const note=isTrial() ? 'time trial'
    : (played && cells.length<POLICY.dailyNets) ? `${cells.length} of ${POLICY.dailyNets} nets` : '';

  /* the wordmark's rule, at card scale. the card is the game's identity in
     somebody else's feed, and it was carrying the word alone — no flag, so
     nothing to replace, and nothing to recognise it by either once the word has
     scrolled past. same mark as the masthead: four equal parts of the canonical
     four, under the word and exactly as long as it.

     the length is MEASURED rather than assumed. the card is set in whichever of
     Helvetica and Arial the machine actually has, and a rule that overshoots or
     falls short of the word is not an underline, it is a bar. canvas measures
     the same string at the same weight and size; the correction is the word's
     INTERNAL gaps of the -1.4 tracking the text carries, which is the difference
     between the advance and the ink. it is derived from the word rather than
     written as a number — it was -5.6, the four gaps of a five-letter word, and
     the rename to an eight-letter one would have left the rule 4.2px long.

     ONE rect with a hard-stop gradient, not four rects — the same argument as
     .wordrule, and it bites harder here: shareCardBlob rasterises this at 2x, so
     four abutting rects on a fractional boundary would leave the plate showing
     between the colours in a png that then goes out to other people. coincident
     stops have no boundary to leak through. */
  const MW=(()=>{
    try{const c=document.createElement('canvas').getContext('2d');
      c.font='700 46px Helvetica,Arial';
      return Math.max(60,c.measureText(WORDMARK).width-(WORDMARK.length-1)*1.4);
    }catch(e){return 190}   // a plausible measure, so the mark still draws
  })();
  /* the same four quarters in the same order as the wordmark on screen — FLAG,
     not a fifth hand-written copy of the run. cssv resolves --flag-1 through its
     var() chain to the canonical hex, which is what an svg leaving this machine
     needs: the card is rasterised and shared, so it cannot carry a token. */
  const MARK=FLAG.map((c,i)=>
    `<stop offset="${i/4}" stop-color="${cssv(c)}"/><stop offset="${(i+1)/4}" stop-color="${cssv(c)}"/>`
  ).join('');

  // the munich sun, the same fourteen struck arcs the bulletins draw
  const sun=Array.from({length:14},(_,i)=>{
    const a=i*(360/14)*Math.PI/180;
    return `<line x1="${(694+Math.cos(a)*8).toFixed(1)}" y1="${(70+Math.sin(a)*8).toFixed(1)}" x2="${(694+Math.cos(a+.22)*22).toFixed(1)}" y2="${(70+Math.sin(a+.22)*22).toFixed(1)}"/>`;
  }).join('');

  return `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
    <rect width="${W}" height="${H}" fill="${PLATE}"/>
    <defs><linearGradient id="mark" x1="0" y1="0" x2="1" y2="0">${MARK}</linearGradient></defs>
    <g font-family="Helvetica,Arial" fill="${PLATEINK}">
      <text x="${M}" y="76" font-size="46" font-weight="700" letter-spacing="-1.4">${WORDMARK}</text>
      <rect x="${M}" y="91" width="${MW.toFixed(2)}" height="7" fill="url(#mark)"/>

   same strings, so neither can end up describing a board that does not exist.

   them are the wordmark's own four.

       `6 of 10 clean or better` one press later, about the same day. dayReading
       and bestReading are the record's own two functions and they are not
       reimplemented — see the note on bestReading for how it picks a measure. */
    const yday=dayAdd(today(),-1);
    const ylast=dayReading(rows.find(r=>r.d===yday));
    const best=bestReading(rows);
    /* SETTING ONE FIGURE TWICE is the tautology this game has deleted three times
       over — see bestLineEl, which drops itself off the record for exactly this
       reason — and yesterday against the best day can collide two ways.
       the first is the obvious one: yesterday IS the best day, in which case the
       second line is the first line with another date on it. it is tested on the
       KEY and not on the date, because two days can tie at the top and which one
       bestReading returns then is the save's own order — so a yesterday that
       equals the record must not be drawn as though something beat it.
       and when yesterday ties the record it is worth SAYING, on the day a player
       opens the card wanting a reason to press the button. not on a first scored
       day though: everything is a personal best when there is one of them, and a
       card that congratulates you for existing is noise.
       the second collision is quieter and the render caught it: two DIFFERENT
       days can print the same reading, because the key ranks perfects and the
       reading does not — 9 of 10 with two perfects beats 9 of 10 with one, and
       both lines say `9 of 10 clean or better`. so the best day keeps its line
       there, and drops the figure it would only be repeating. the date is the
       fact left, which is exactly what bestLineEl prints on the record and the
       whole of what it prints. */
    const scored=rows.filter(r=>dayReading(r)).length;
    const yBest=!!(ylast && best && ylast.key===best.key);
    /* the best day, as ONE line above the week. it is not drawn when yesterday
       ties it — that is the top row of the list, three lines down, and setting one
       figure twice on a card is the tautology this game has deleted three times
       over (see bestLineEl, which drops itself off the record for the same
       reason). the tie is tested on the KEY and not on the date, because two days
       can tie at the top and which one bestReading returns then is the save's own
       order — so a yesterday that equals the record must not be drawn as though
       something beat it. and when it DOES tie, that is worth saying on the card a
       player opens wanting a reason to press the button; not on a first scored
       day, where everything is a personal best and a card that congratulates you
       for existing is noise. */
    const bestNew=best && !yBest;
    /* ---- the week, and the only press on it ----
       the chip is the record's, at the record's meaning: drawn on every played
       day either way, dashed when it is not yours yet, and it NEVER opens a
       checkout — the press answers in words, exactly as the record's row does,
       and `replayWords` is the one copy of what paying adds. see the long note on
       the record's chip for why a lock glyph and a solid field are both out.
       TODAY IS NOT PRESSABLE and carries no chip. the button under this list is
       how today starts, and a second door to the same run on the same card is two
       paths that can disagree about what pressing means. it is still drawn, as
       the bare bar, because a week with today missing is not a week.
       a day with no row is not pressable either. it is either the archive's,
       which the record's own foot is the one place to be sold, or a day before
       LAUNCH that weekList has already dropped — and a press on every empty row
       going to an upsell is the three-hundred-buy-buttons list that got the
       archive rows deleted the first time. */
    const week=weekList().map(({d,row})=>{
      const played=!!(row && typeof row.tiers==='string' && row.tiers);
      const isNow=d===today();
      const can=!isNow && played && canPlayDay(d);
      const chip=!isNow && played
        ? `<span class="dstate dreplay${can?'':' shut'}" aria-hidden="true"`
          +` title="${esc(can?'play this day again':replayWords())}">&#8635;</span>`
        : '<span class="dstate dreplay ghost" aria-hidden="true"></span>';
      const rd=dayReading(row);
      return `<div class="wbday${isNow?' now':''}${played?'':' none'}"`
        +(!isNow&&played?` role="button" tabindex="0" data-day="${d}"`:'')
        +` aria-label="${dayLabel(d)}${isNow?' · today':''} · ${played?tierWords(row.tiers):'not played'}`
        +`${!isNow&&played?' · '+(can?'play again':replayWords()):''}">`
        +`<span class="wbwhen">${isNow?'today':dayLabel(d)}</span>`
        +rungTrack(played?row.tiers:'',true)
        +`<span class="wbmini">${played&&rd?rd.fig:''}</span>${chip}</div>`;
    }).join('');
    /* the head, and the ONLY part of the card that knows which player it has.
       a fresh save gets the wordmark and the three sentences; everybody else gets
       the date, which is the fact that makes the run of days underneath mean
       something. both then run into the same instruments in the same order.
       the pitch keeps `.intro-lead`, and the closing line is a plain paragraph
       rather than `.intro-note` — that class draws a dashed rule above itself,
       which on this card now belongs to the crowd line at the foot and nowhere
       else. two dashed rules on one card is the division that made the rules
       card ambiguous; see the note by .rkey. */
    const head=fresh
      ? `<div class="intro-title">${WORDMARK}</div>
         <div class="intro-sub">untangle what a neural net knows</div>
         <p class="intro-lead">it learned a few things and stored them all on top of each other.</p>
         <p class="intro-lead intro-hook">pull them apart. free one and it draws itself, and tells you its name.</p>`
      : `<div class="intro-title">welcome back</div>
         <div class="intro-sub">${dayLabel(today())} · the same ten for everyone</div>`;
    /* the button says what pressing it does, and for a fresh save that is the
       lessons rather than the day — `start today's run` in front of somebody who
       is about to be taught to drag a neuron is the card promising the wrong
       thing. `start untangling` is the sentence the first card always ended on. */
    b.innerHTML=head
      +`<div class="wbstats">
        <div>${runSay}</div>
        <div><b>${perfect}</b><span>perfect nets</span></div>
      </div>
      <div class="wbread">${
        ylast&&yBest&&scored>1
          ? `<div><span class="wbwhen">yesterday · your best</span>`
            +`<span class="wbfig"><b>${ylast.fig}</b> ${ylast.word}</span></div>`
        : bestNew
          ? `<div><span class="wbwhen">best day${isIso(best.d)?' · '+dayLabel(best.d):''}</span>`
            +`<span class="wbfig"><b>${best.fig}</b> ${best.word}</span></div>`
          : ''}</div>
      <div class="wbweek">${week}</div>
      <div class="intro-note wbspread" id="wbspread"></div>
      <button class="intro-start" id="introstart">${fresh?'start untangling':"start today's run"}</button>
      <button class="intro-start intro-alt${canTimeTrial()?'':' shut'}" id="introtrial">time trial ⏱</button>`
    /* the card carries NO menu of its own. a row of five text links at its foot
       was tried and cut on the owner's call: the doors are small marks in the top
       bar, where two of them (`?` and the record) have always been, and where a
       control is a control rather than a paragraph. the card is the day — the
       week, the readings and the one press that starts it — and it stopped being
       a contents page for the rest of the game. see the masthead's control row. */
      ;
    /* one handler for the whole list, on the container: seven rows each with
       their own closure is seven listeners rebuilt every morning, and the row
       already carries the only thing the press needs. `openDay` is the record's
       own — it starts the day, and refuses a day that is not yours with the same
       sentence in the same words. */
    const press=d=>{
      if(canPlayDay(d)){ store.introSeen=true; store.lastIntroDay=today(); save();
        $('introveil').classList.remove('show'); return openDay(d) }
      flashMsg(`${dayLabel(d)} · ${replayWords()}`);
    };
    $('introbody').querySelector('.wbweek').onclick=e=>{
      const row=e.target.closest('[data-day]');
      if(row) press(row.dataset.day);
    };
    $('introbody').querySelector('.wbweek').onkeydown=e=>{
      if(e.key!=='Enter' && e.key!==' ') return;
      const row=e.target.closest('[data-day]');
      if(row){ e.preventDefault(); press(row.dataset.day) }
    };
    /* the crowd, asked for after the card is drawn and never waited on. it fills
       the line above if it answers and leaves it empty if it does not — which is
       most of the time right now, because the worker has never been deployed.
       the price is asked for here for a mark that is NOT on this card: the
       masthead's till button cannot be drawn until the server says there is a
       till, and this is the one screen every player passes through each day. the
       answer landing calls entitlementChanged, which redraws the bar. */
    paintSpread(); ensureSpread(); ensurePrice();
  }
  $('introstart').onclick=()=>{
    store.introSeen=true; store.lastIntroDay=today(); save();
    $('introveil').classList.remove('show');
  };
  if($('introtrial')) $('introtrial').onclick=()=>{
    store.introSeen=true; store.lastIntroDay=today(); save();
    startTrialRun();
  };
}
/* ---- the three lessons, again ----
   `tutorialDone` was written once and never cleared, so the guided nets were a
   one-way door: the only way back was the controls drawer's reset, which takes
   the record, the streak and the collection with it. this clears the one flag and
   resets the RUN the way endTutorial does — the same fields, in the same order,
   because a half-reset run is a day that opens on net 3 with three lessons
   stamped into it.
   NOTHING PLAYED IS TOUCHED, and the guard is what makes that true rather than
   likely: the reset above would throw away a set in progress, so a day with a
   move on it refuses. The card this is pressed from only appears on a day with no
   moves, so the refusal is unreachable today — it is here because a door to this
   is exactly the thing somebody adds next, and then the reset is live on a run.
   playedDays is not read or written here at all: the lessons score nothing and
   record nothing (see recordDay's own guard), so a replay cannot cost a day. */
function startLessons(){
  const r=R();
  if(r.netMoves || (r.cleared||[]).length)
    return flashMsg('the guided nets need a day you have not started');
  store.introSeen=true; store.lastIntroDay=today();
  store.tutorialDone=false;
  r.netIndex=0; r.netMoves=0; r.turns=0; r.positions={}; r.freed=[];
  r.splitNodes=[]; r.assisted=false; r.cleared=[]; r.over=false;
  builtFor=-1; resetDescent(); save();
  hideVeils(); renderAll();
  flashMsg('the guided nets · three lessons, and nothing here is scored');
}
$('helpbtn').onclick=()=>{renderIntro('rules'); showVeil('introveil')};
/* the three marks added beside it, each a door to a surface that already exists.
   none of them draws anything of its own: the collection and the record are two
   views of one screen, the lessons are the tutorial, and the till is beginUnlock.
   they are wired here, with `?`, because a control in that row is that row's. */
/* each of the two marks opens its OWN view, and says which. `recView` is module
   state that remembers where you were — which was right while the in-record
   toggle was the only way to move between them, and is wrong the moment there are
   two doors: without setting it, the record's mark opens the collection because
   the collection's mark was pressed an hour ago. two controls, two answers. */
$('collbtn').onclick=()=>{ recView='collection'; hideVeils(); openRecord() };
$('tutbtn').onclick=()=>startLessons();
$('buybtn').onclick=()=>beginUnlock();
/* one act, both places it can be pressed — found by the same class applyTheme
   writes, so a control that reports the ground is a control that flips it and
   there is no way to add one and get only half of that.
   preventDefault because the record's is an anchor: `.rec-btn` is the material
   its two neighbours in that head are made of, and following `#` there would
   put a fragment in the url of a page that has no fragments. */
document.querySelectorAll('.groundbtn').forEach(b=>{
  b.onclick=e=>{ e.preventDefault(); setTheme(themeNow()==='light'?'dark':'light') };
});
/* the solve button. playtesting a ramp means reaching net eight, and reaching
   net eight by hand is most of an evening — so the fastest honest way to look at
   the deep nets is to walk the solver down to them. it is gated on DEV, the same
   flag the unlimited-runs and new-run controls use, so it exists on localhost
   and on nothing else. */
if(DEV){
  $('solvebtn').hidden=false;
  $('solvebtn').onclick=()=>{ try{ window.__solveNet() }catch(e){ toast('solve failed · '+e.message) } };
}
/* escape closes every open overlay, which is right while they are alternatives
   to each other and wrong the moment one is stacked ON another. a question is
   the only card that stacks, and it takes escape for itself in the capture phase
   so this never sees it — see askKeys. */
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  document.querySelectorAll('.veil.show').forEach(dismissVeil);
});

/* test hooks */
window.__st=()=>({run:R(),badges:store.collection.badges,threads:threads.map(t=>({k:t.key,f:t.freed,c:t.crossings}))});
/* clears the net the way its own generator says it can be cleared. a family
   net carries the solved figure on every neuron (hx/hy, and alt for the half a
   split hands to the other feature), so the walkthrough is literally "put
   everything back in its slot" — which is also the construction par is priced
   off, so a run of this is a check that the two agree. */
window.__solveNet=()=>{
  const r=R();
  /* the only route to clearNet that was NOT already gated on `over`. dragging
     bails at pointerdown, descentTick and retangleTick bail on `.veil.show` and
     on `over`, and skip bails — but this walked a finished board again, found
     every thread already free, and pushed an eleventh and twelfth net into a run
     that has ten. that is where a `day complete` card reading `12 of 12` came
     from, and it wrote the same nonsense through stampToday into the day's row.
     dev-only, and a save is the one input nothing can validate, so it is fixed
     at the source rather than papered over in the card. */
  if(r.over) return;
  if(spec.fam){
    /* walks the route par was priced from, action for action, billed through
       the same function a real move is. so running this is a direct test of
       the shipped number rather than an approximation of it: it lands on par
       exactly, and if it ever does not, par and the board have come apart.
       the route is famGreedy's own log when the version prices that way, and
       the plain slot walk otherwise — the two versions get the two answers. */
    const plan=spec.plan;
    const route = (plan && GEN_RULES.parMode==='greedy')
      ? famGreedy(plan).log
      : [...members.filter(n=>n.merged).map(n=>['split',n.idx]),
         ...members.map(n=>['drag',n.idx])];
    for(const [kind,idx] of route){
      const n=members.find(m=>m.idx===idx);
      if(!n) continue;
      if(kind==='split'){
        if(!n.merged) continue;
        const alt=n.alt;
        (r.splitNodes=r.splitNodes||[]).push(n.idx);
        splitNode(n,true); chargeTurn(r);
        const half=members.find(m=>m.idx===1000+n.idx);
        if(half&&alt){half.hx=alt.x; half.hy=alt.y}
      } else {
        if(n.pinned||n.hx==null||n.merged) continue;
        // a split parts the halves by MIN_SEP/2, so the half that keeps the
        // original feature is already close enough to its slot to leave alone
        if(Math.hypot(n.x0-n.hx,n.y0-n.hy)<=MIN_SEP*.7) continue;
        n.x0=clampX(n.hx); n.y0=clampY(n.hy);
        r.positions[n.idx]=[n.x0,n.y0];
        chargeTurn(r);
      }
    }
    recordDay(); countCross();
    threads.filter(t=>!t.freed&&canFree(t)).forEach(t=>{freeThread(t,false);r.freed.push(t.key)});
    save(); refresh(); renderHud();
    if(threads.every(t=>t.freed))clearNet();
    return;
  }
  const lane=t=>BH*.09+threads.indexOf(t)*(BH*.82/Math.max(1,threads.length-1));
  const done=new Set(); let sh=0;
  threads.filter(t=>!t.freed).forEach(t=>{
    t.nodes.forEach((n,i)=>{
      if(done.has(n.idx))return; done.add(n.idx);
      if(n.pinned){done.add(n.idx);return}          // pins are already where they must be
      if(n.threads.length>1){n.x0=BW*.42+95*(sh++);n.y0=(lane(n.threads[0])+lane(n.threads[1]))/2}
      else{n.x0=clampX(BW*.07+(BW*.86*i/Math.max(1,t.nodes.length-1)));n.y0=lane(t)+(i%2?9:-9)}
      r.positions[n.idx]=[n.x0,n.y0];
    });
    r.turns=(r.turns||0)+1; r.netMoves++;
  });
  // split every shared neuron too, or the net can never fully clear
  members.filter(n=>n.merged).slice().forEach(n=>{
    (r.splitNodes=r.splitNodes||[]).push(n.idx);
    splitNode(n,true); r.turns=(r.turns||0)+1; r.netMoves++;
  });
  recordDay(); countCross();
  threads.filter(t=>!t.freed&&canFree(t)).forEach(t=>{freeThread(t,false);r.freed.push(t.key)});
  save(); refresh(); renderHud();
  if(threads.every(t=>t.freed))clearNet();
};

renderAll();
/* the first build already publishes the letterbox through applyOrientation,
   but that is measured mid-build. do it once more against the settled layout,
   so the first card of the session is anchored to where the plate actually
   ended up rather than to where it was halfway through being drawn. */
publishPlateInset();
addEventListener('load',publishPlateInset);
/* ---- when the card comes up ----
   ONE CARD NOW, so one gate: never seen, or a day you have not opened it on —
   and never over a run with a move in it, which is the half that was already
   here. it used to be two gates for two cards, and the first-visit one was
   `!introSeen` INSIDE `!tutorialDone`: a player who opened the card, did not
   finish the three lessons and came back the next day therefore got nothing at
   all, which is precisely the player the lessons link is for.
   the move guard now covers the first visit as well. it costs nothing — a fresh
   save has no moves — and it means there is one rule about when this card is
   allowed to cover the board rather than two that can disagree. */
if(!store.introSeen || (store.lastIntroDay!==today() && R().netMoves===0 && !R().cleared.length)){
  renderIntro('day'); showVeil('introveil');
}
/* the account, last and off to one side. both are network calls the first frame
   must not wait on, and both are no-ops for the visits that make up nearly all
   of them: no `?unlock=` on the url, no token and no account means nothing is
   sent at all, and the game is on screen and playable before either could have
   answered anyway.
   chained rather than fired together so that a confirm coming back from stripe
   writes the flag before /me reads it — otherwise an answer computed a second
   before the webhook landed comes back last and undoes the purchase the player
   just made, on screen, in front of them. */
readUnlockReturn().then(wakeAccount);
</script>
</body>
