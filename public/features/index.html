function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}

/* ---- share card: the day rendered as a plate ----

   this is the one thing the game makes that leaves the sharer's screen, and it
   lands in a feed beside other people's. so everything on it has to be a
   reading that DIFFERS between two players who both played today — and the day
   being a fixed ten that cannot be failed kills most of what a run knows about
   itself. depth is ten for everyone who finishes. the same ten nets free the
   same features for everyone. par is the same par.

   two things differ, and they are the whole card:
     the SCORE — turns against par, which the record screen and the masthead
     both now lead on; and
     the STRIP — one cell per net in the rung it minted, which is the
     comparable, Wordle-grade artifact now that everyone plays the same ten.

   what was here led with `depth` at 76px over the words "nets deep" (identical
   for every finisher), captioned it `n/16 collected` (a finished day frees
   about fourteen of the sixteen, so it saturates in two or three days — the
   same terminal counter the record screen and the welcome card have already
   deleted), listed `features named` and `streak`, and drew eight feature tiles
   whose emblem marks were forced to white in defiance of markOn. all of that is
   gone. the sun, the wordmark, the date and the imprint stay: they are the
   plate, not a reading. */

/* the plate is FIXED and near-black, and that is measured rather than chosen.
   the ladder is canonical on any ground — see TIERCOL, and two players on
   different grounds have to post the same card besides — so the only question is
   which ground carries canonical gelb, tuerkis and violett at once. contrast
   against the three rungs, and against white type:
     ink   #0E1214   11.20  5.91  4.13   type 18.83
     paper #EAE7DF    1.36  2.58  3.69   two rungs under 3:1
     white            1.68  3.19  4.56   canonical gelb is unusable on paper
   the ink plate is the only ground where all three rungs clear 3:1, and it is
   the only one where they do so comfortably. so the card commits to it and does
   not follow the theme, the same literal markOn already carries. this is also
   the reason the on-screen ladder USED to read --sig-gelb rather than this one.
   it no longer does: 1.68 on white is not a rung when the rung is a line, and
   the ladder is a fill everywhere it is drawn — see TIERCOL. what the plate
   still gets that no on-screen ground can is all three rungs clearing 3:1 at
   once, which is why it is chosen rather than inherited.
   dunkelblau used to be on this list, because the bulletin was a dunkelblau
   plate and shared this table's problem — nothing measures strong on it, which
   is why no rung could BE it and, transitively, why the ladder was three near
   neighbours. the bulletin is a --surface card now; that row is gone and so is
   its grip on TIERCOL. see the note there.
   what the new ladder gets back on this plate is the ORDER: 11.20, 5.91, 4.13
   is monotonic, so perfect is the brightest mark and done the dimmest, which the
   previous three could not manage in a narrow .276/.319/.280 band. SHAREFILL
   below still draws the rung as a HEIGHT, because that is the channel that
   survives a greyscale feed whatever the colours do. */
/* the game's name, in one place, for everything JS draws. the masthead's own
   <h1> is static markup and carries it literally; everything generated —
   the share plate, the share text, the exported filename — reads it from here,
   so a rename cannot leave one surface saying something else.
   NOT the localStorage key. that is `probe-run-v3` and it stays that way
   whatever the game is called: the key is keyed to the ORIGIN, so renaming it
   would silently wipe every existing player's collection and streak, and there
   is no backend to recover them from. see KEY, and the second copy of that
   literal in the boot script at the top of the file. */
const WORDMARK='features';
const PLATE='#0E1214';
const PLATEINK=lum(PLATE)>0.192?'#0E1214':'#ffffff';   // the mark rule applied, not asserted
/* the strip's second channel: the rung as a HEIGHT, so the reading survives a
   greyscale feed, a colour-blind reader, and the thumbnail a feed actually
   shows. perfect full, clean two thirds, done one third — the same three
   fractions the record screen's day bar draws in css (CELLH / .dayrow .dcells
   i.t1-t3), so a day reads the same on the card as it does in the record.
   the one deliberate difference is the unreached net. the record row is
   eighteen pixels tall and draws it as a hairline on the baseline; the card
   draws it as the empty FRAME the played bars rise inside, because at seventy
   pixels a frame is what makes a one-third bar read as a third of something,
   and because it leaves a day left short visibly unfinished.
   `par` and `over` are the dead tier keys TIERRANK still carries for badges
   minted under older schemes; they ride with their live equivalents, exactly as
   they do in TIERCOL. */
const SHAREFILL={perfect:1, clean:2/3, par:2/3, done:1/3, over:1/3};
/* and the same ladder in text, for the clipboard fallback. deliberately NOT
   emoji. the ladder is yellow, turquoise, violet, and the emoji set has honest
   squares for two of them — 🟨 and 🟪 — and nothing at all for turquoise: the
   set has 🟦 and 🟩 and the rung sits between them, so the MIDDLE of the ladder
   would be the one that lied. the previous ladder failed the same test from the
   other end (one blue character for two blue rungs). a strip in which any rung
   is drawn as a colour it is not says less than no strip. the block characters
   carry the card's own height encoding instead, and cannot contradict a colour
   they never state. */
const SHAREBLOCK={perfect:'█', clean:'▅', par:'▅', done:'▃', over:'▃'};
const SHAREEMPTY='▁';                 // a net of the day still to play
const CARD_W=760, CARD_H=470;

/* the two sums the whole card is built from, read off the run itself: the
   cleared nets' own turns and par, which is exactly the pair stampToday writes
   to the day row and the pair the run-over bulletin totals. */
function shareFigures(r){
  const cells=(r&&r.cleared)||[];
  return {cells,
    turns:cells.reduce((a,c)=>a+(c.moves||0),0),
    par:cells.reduce((a,c)=>a+(c.par||0),0),
    slots:Math.max(POLICY.dailyNets,cells.length)};   // a time trial runs past ten
}
function shareCardSVG(){
  const r=R(), W=CARD_W, H=CARD_H, M=44, RX=W-M;
  const {cells,turns,par,slots}=shareFigures(r);
  const played=cells.length>0;
  const sp=scoreParts(turns-par);
  /* nothing cleared is not level par, it is a day not started. the figure says
     so rather than printing a score nobody played for. */
  const fig=played?sp.fig:'0', word=played?sp.word:'nets played';
  const numeric=/^\d+$/.test(fig);

  /* the strip. `slots` frames on one baseline; a played net rises out of its
     frame to the height of its rung, an unplayed one stays an empty frame. the
     frame is what makes a `done` cell read as a third of something rather than
     as a small mark on its own, and it is what makes the day ahead visible
     without needing a colour of its own. */
  const SY=312, SH=72, GAP=slots>12?4:8, CW=(RX-M-(slots-1)*GAP)/slots;
  const strip=Array.from({length:slots},(_,i)=>{
    const x=(M+i*(CW+GAP)).toFixed(1), w=CW.toFixed(1), c=cells[i];
    const frame=`<rect x="${x}" y="${SY}" width="${w}" height="${SH}" fill="none" stroke="${PLATEINK}" stroke-opacity=".3"/>`;
    if(!c) return frame;
    const h=Math.round(SH*(SHAREFILL[c.tier]||SHAREFILL.done));
    return frame+`<rect x="${x}" y="${SY+SH-h}" width="${w}" height="${h}" fill="${cssv(TIERCOL[c.tier])}"/>`;
  }).join('');

  /* the key. the card lands in front of people who have never played, and a bar
     chart of an invented ladder is decoration to them. three cells at the three
     heights, in the three colours, named. */
  const LY=414, KW=11, KH=20;
  let kx=M;
  const key=['perfect','clean','done'].map(name=>{
    const kh=Math.round(KH*SHAREFILL[name]);
    const g=`<rect x="${kx}" y="${LY-KH}" width="${KW}" height="${KH}" fill="none" stroke="${PLATEINK}" stroke-opacity=".3"/>`
      +`<rect x="${kx}" y="${LY-kh}" width="${KW}" height="${kh}" fill="${cssv(TIERCOL[name])}"/>`
      +`<text x="${kx+KW+13}" y="${LY-4}" font-size="14" letter-spacing="2" fill-opacity=".8">${name}</text>`;
    kx+=KW+13+name.length*9.3+22;
    return g;
  }).join('');
  /* the only states the strip cannot draw for itself: a day left short says how
     far it got, and a trial says it is not a day at all. a finished daily set
     says nothing, because ten of ten is the same for everyone who got there. */
  const note=isTrial() ? 'time trial'
    : (played && cells.length<POLICY.dailyNets) ? `${cells.length} of ${POLICY.dailyNets} nets` : '';

  /* the wordmark's rule, at card scale. the card is the game's identity in
     somebody else's feed, and it was carrying the word alone — no flag, so
     nothing to replace, and nothing to recognise it by either once the word has
     scrolled past. same mark as the masthead: four equal parts of the canonical
     four, under the word and exactly as long as it.

     the length is MEASURED rather than assumed. the card is set in whichever of
     Helvetica and Arial the machine actually has, and a rule that overshoots or
     falls short of the word is not an underline, it is a bar. canvas measures
     the same string at the same weight and size; the correction is the word's
     INTERNAL gaps of the -1.4 tracking the text carries, which is the difference
     between the advance and the ink. it is derived from the word rather than
     written as a number — it was -5.6, the four gaps of a five-letter word, and
     the rename to an eight-letter one would have left the rule 4.2px long.

     ONE rect with a hard-stop gradient, not four rects — the same argument as
     .wordrule, and it bites harder here: shareCardBlob rasterises this at 2x, so
     four abutting rects on a fractional boundary would leave the plate showing
     between the colours in a png that then goes out to other people. coincident
     stops have no boundary to leak through. */
  const MW=(()=>{
    try{const c=document.createElement('canvas').getContext('2d');
      c.font='700 46px Helvetica,Arial';
      return Math.max(60,c.measureText(WORDMARK).width-(WORDMARK.length-1)*1.4);
    }catch(e){return 190}   // a plausible measure, so the mark still draws
  })();
  /* the same four quarters in the same order as the wordmark on screen — FLAG,
     not a fifth hand-written copy of the run. cssv resolves --flag-1 through its
     var() chain to the canonical hex, which is what an svg leaving this machine
     needs: the card is rasterised and shared, so it cannot carry a token. */
  const MARK=FLAG.map((c,i)=>
    `<stop offset="${i/4}" stop-color="${cssv(c)}"/><stop offset="${(i+1)/4}" stop-color="${cssv(c)}"/>`
  ).join('');

  // the munich sun, the same fourteen struck arcs the bulletins draw
  const sun=Array.from({length:14},(_,i)=>{
    const a=i*(360/14)*Math.PI/180;
    return `<line x1="${(694+Math.cos(a)*8).toFixed(1)}" y1="${(70+Math.sin(a)*8).toFixed(1)}" x2="${(694+Math.cos(a+.22)*22).toFixed(1)}" y2="${(70+Math.sin(a+.22)*22).toFixed(1)}"/>`;
  }).join('');

  return `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
    <rect width="${W}" height="${H}" fill="${PLATE}"/>
    <defs><linearGradient id="mark" x1="0" y1="0" x2="1" y2="0">${MARK}</linearGradient></defs>
    <g font-family="Helvetica,Arial" fill="${PLATEINK}">
      <text x="${M}" y="76" font-size="46" font-weight="700" letter-spacing="-1.4">${WORDMARK}</text>
      <rect x="${M}" y="91" width="${MW.toFixed(2)}" height="7" fill="url(#mark)"/>
      <text x="${M}" y="114" font-size="14" letter-spacing="3.4" fill-opacity=".8">${dayLabel(r.day||today())}</text>
      <g stroke="${PLATEINK}" stroke-width="2.4" stroke-opacity=".55">${sun}</g>
      <line x1="${M}" y1="128" x2="${RX}" y2="128" stroke="${PLATEINK}" stroke-opacity=".32"/>
      <text x="${M}" y="236" font-size="${numeric?126:88}" font-weight="300" letter-spacing="${numeric?-5:-2}">${fig}</text>
      <text x="${M+2}" y="274" font-size="22" letter-spacing="3.6" fill-opacity=".92">${word}</text>
      ${played?`<text x="${RX}" y="274" font-size="15" letter-spacing="1.6" text-anchor="end" fill-opacity=".72">${turns} turns · par ${par}</text>`:''}
      <line x1="${M}" y1="296" x2="${RX}" y2="296" stroke="${PLATEINK}" stroke-opacity=".32"/>
      ${strip}
      ${key}
      ${note?`<text x="${RX}" y="${LY-4}" font-size="14" letter-spacing="2" text-anchor="end" fill-opacity=".8">${note}</text>`:''}
      <text x="${M}" y="450" font-size="12" letter-spacing="2.2" fill-opacity=".7">untangling superposed features · after otl aicher, munich 1972</text>
    </g>
  </svg>`;
}
async function shareCardBlob(){
  const svg=shareCardSVG();
  const url='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
  const img=new Image();
  await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=url});
  const c=document.createElement('canvas');
  c.width=CARD_W*2; c.height=CARD_H*2;
  const ctx=c.getContext('2d');
  ctx.scale(2,2); ctx.drawImage(img,0,0);
  return await new Promise(r=>c.toBlob(r,'image/png'));
}
async function copyShare(){
  const r=R(), day=r.day||today();
  const {cells,turns,par,slots}=shareFigures(r);
  // the same two readings the plate carries, in characters that survive a chat
  const strip=Array.from({length:slots},(_,i)=>
    cells[i] ? (SHAREBLOCK[cells[i].tier]||SHAREBLOCK.done) : SHAREEMPTY).join('');
  const txt=`${WORDMARK} · ${dayLabel(day)}\n${cells.length?fmtScore(turns-par)+' · '+turns+' turns':'not played'}\n${strip}`;
  // try the image first, fall back to text, then to a download
  try{
    const blob=await shareCardBlob();
    if(blob && window.ClipboardItem && navigator.clipboard && navigator.clipboard.write){
      await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);
      toast('card copied'); return;
    }
    if(blob){
      const a=document.createElement('a');
      a.href=URL.createObjectURL(blob); a.download=`${WORDMARK}-${day}.png`;
      a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);
      toast('card saved'); return;
    }
  }catch(e){/* fall through to text */}
  try{await navigator.clipboard.writeText(txt);toast('copied')}
  catch(e){const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');toast('copied')}catch(e2){toast('copy failed')}ta.remove()}
}
/* the controls live behind `d` (or the dot in the corner) so the HUD can be
   judged on its own. nothing here is settled as a player-facing feature. */
(function(){
  const tab=document.createElement('button');
  tab.className='devtab'; tab.title='controls (d)';
  tab.onclick=()=>{$('devdrawer').hidden=false; tab.hidden=true};
  document.body.appendChild(tab);
  const hide=()=>{$('devdrawer').hidden=true; tab.hidden=false};
  $('ddclose').onclick=e=>{e.preventDefault();hide()};
  document.addEventListener('keydown',e=>{
    if(e.key!=='d'||e.metaKey||e.ctrlKey||e.altKey) return;
    const open=!$('devdrawer').hidden;
    if(open) hide(); else {$('devdrawer').hidden=false; tab.hidden=true}
  });
})();
$('histbtn').onclick=openRecord;
$('histclose').onclick=e=>{e.preventDefault();$('histveil').classList.remove('show')};
/* clicking beside a card is the most natural way anyone dismisses a modal, and
   for the cleared-net bulletin it used to leave you staring at a solved, dead
   board: by the time that card is up the net index has already moved on, and
   only the continue button rebuilds. so dismissing it IS continuing. the
   run-over card is terminal and carries its own actions, so it does not
   dismiss at all — there is nothing behind it to go back to. */
function dismissVeil(v){
  if(v.id==='introveil'||v.id==='runveil') return;
  if(v.id==='netveil'){ nextNet(); return }
  v.classList.remove('show');
}
document.querySelectorAll('.veil').forEach(v=>v.addEventListener('click',e=>{
  if(e.target===v) dismissVeil(v);
}));
$('skipnet').onclick=e=>{
  e.preventDefault();
  const r=R(); if(r.over)return;
  r.turns=(r.turns||0)+5; r.netIndex++; r.netMoves=0; r.positions={}; r.freed=[]; r.splitNodes=[]; r.assisted=false;
  resetDescent();
  save(); nextNet(); toast('net skipped · 5 turns');
};
$('reset').onclick=e=>{e.preventDefault();if(confirm('reset all progress?')){localStorage.removeItem(KEY);location.reload()}};
/* test-build affordances: play as many runs as you like, top up moves */
if(DEV){
  $('newrun').hidden=false;
  $('newrun').onclick=e=>{e.preventDefault();startAnotherRun()};
}
/* the overlay adapts: a short welcome first time (the guided net does the
   teaching), a stats-led welcome back on a new day, full rules on demand */
/* ---- the five marks the game is played with, as board fragments ----
   every one is built from neuronParts / threadPart / crossParts, at board
   scale, in a shared 68x44 window. the rules card and the coach card paste the
   same strings, so neither can end up describing a board that does not exist.
   THREADPAL's own order is used for the colours, so a fragment is coloured the
   way an actual first, second and third feature is. */
const RMARK={
  feature:()=>[threadPart([[4,32],[24,12],[44,32],[64,12]],THREADPAL[0])],
  neuron:()=>[threadPart([[2,22],[66,22]],THREADPAL[1]),
              ...neuronParts(34,22,[THREADPAL[1]])],
  /* one neuron, two features through it — which is why the second feature's
     ring is inside the first's rather than beside it.
     the two colours are arguments so the card that says "tap it to split" can
     draw the neuron actually on the board rather than a generic one; called
     with none it is the legend's version, in a first and a third feature's
     colours the way `rmark` has always drawn it. */
  shared:(a,b)=>[threadPart([[2,22],[34,22],[66,22]],a||THREADPAL[0]),
              threadPart([[16,4],[34,22],[52,40]],b||THREADPAL[2]),
              ...neuronParts(34,22,[a||THREADPAL[0],b||THREADPAL[2]])],
  pinned:()=>[threadPart([[2,22],[66,22]],THREADPAL[1]),
              ...neuronParts(34,22,[THREADPAL[1]],{pinned:true})],
  crossing:()=>[threadPart([[14,2],[54,42]],THREADPAL[0]),
                threadPart([[54,2],[14,42]],THREADPAL[1]),
                ...crossParts([[34,22]])]
};
const rmark=k=>markSVG(RMARK[k](),'0 0 68 44','rmark');

/* ---- the welcome plate: a net, drawn the way the board draws one ----
   neurons in layers, one per feature per layer, a layer holding a shared neuron
   carrying one fewer and visibly pinching for it, a pin that will not move, and
   the crossings marked where two features actually cross. it runs top to bottom
   because that is what a phone board does — applyOrientation rotates the real
   one by ninety degrees on a tall window. the threads bleed off both ends, so
   the plate can be cropped to whatever shape the panel is. */
function introPlate(){
  const A=THREADPAL[0], B=THREADPAL[1], C=THREADPAL[2];
  const parts=[
    // three features. the width spread is the board's: a stronger feature is
    // stroked heavier and is genuinely the harder one to isolate.
    threadPart([[60,-30],[60,45],[135,120],[97.5,195],[60,270],[60,345]],A,3.4),
    threadPart([[135,-30],[135,45],[60,120],[97.5,195],[210,270],[210,345]],B,5.6),
    threadPart([[210,-30],[210,45],[210,120],[172.5,195],[135,270],[135,345]],C,4.5),
    ...neuronParts(60,45,[A]), ...neuronParts(135,45,[B]), ...neuronParts(210,45,[C]),
    ...neuronParts(135,120,[A]), ...neuronParts(60,120,[B]),
    ...neuronParts(210,120,[C],{pinned:true}),
    ...neuronParts(97.5,195,[A,B]), ...neuronParts(172.5,195,[C]),
    ...neuronParts(60,270,[A]), ...neuronParts(210,270,[B]), ...neuronParts(135,270,[C]),
    ...crossParts([[97.5,82.5]]), ...crossParts([[153.75,232.5]])
  ];
  return `<svg viewBox="0 0 270 315" preserveAspectRatio="xMidYMid slice" role="img"
    aria-label="three coloured features threaded through a small net, two of them sharing one neuron">
    <defs><pattern id="introgrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="var(--rule)" stroke-width="1"/></pattern></defs>
    <rect x="-200" y="-200" width="700" height="800" fill="var(--paper)"/>
    <rect x="-200" y="-200" width="700" height="800" fill="url(#introgrid)"/>
    ${parts.map(partHTML).join('')}</svg>`;
}
function renderIntro(mode){
  const b=$('introbody');
  /* the welcome card is plain too. it used to lead with a plate of board artwork
     — a drawing of a tangle, above two paragraphs describing a tangle, in front
     of the actual tangle the button drops you into. three tellings of one thing,
     and the only one that can teach you anything is the third. */
  const plain = mode==='rules' || mode==='welcome';
  document.querySelector('.intro-card').classList.toggle('plain',plain);
  if(!plain && !$('introart').firstChild) $('introart').innerHTML=introPlate();
  const got=Object.keys(store.collection.badges).length;
  if(mode==='rules'){
    /* a legend, not a lesson. the guided net teaches on first play, so what is
       wanted here weeks later is what each mark means — and the marks say that
       better than sentences about them did. the four numbered steps, the ramp
       panels and the "the day gets harder" heading all went: the ramp repeated
       what the shared and pinned rows already show, and settle is behind the
       controls drawer, not a rule you meet in play. */
    b.innerHTML=`<div class="intro-title">how to play</div>
      <div class="intro-sub">untangle the net &middot; free the features</div>
      <div class="rkey">
        ${rmark('feature')}<span><b>feature</b></span>
        ${rmark('neuron')}<span><b>neuron</b> &middot; drag it</span>
        ${rmark('shared')}<span><b>shared neuron</b> &middot; tap to split</span>
        ${rmark('pinned')}<span><b>pinned</b> &middot; will not move</span>
        ${rmark('crossing')}<span><b>crossing</b> &middot; clear them</span>
      </div>
      <div class="intro-note">a feature with no crossings and no shared neuron pulls free and names itself.<br>
      ten nets a day &middot; within par is <b>clean</b> &middot; finishing is <b>done</b> &middot; a day cannot be failed</div>
      <button class="intro-start" id="introstart">back to the net</button>`;
  } else if(mode==='welcome'){
    /* one sentence about the game, one about why it is worth playing, and the
       button. what went: "a card on the board walks you through the first one",
       which announced the coach card the player is about to be shown anyway —
       a card telling you about a card. and the SAE line's second half, which
       explained a mechanism nobody has seen yet; the claim is the hook, the
       explanation belongs in the rules card where the marks are there to hang
       it on. */
    b.innerHTML=`<div class="intro-title">${WORDMARK}</div>
      <div class="intro-sub">a game about features</div>
      <p class="intro-lead">a small net has learned a few features and threaded them through the same neurons. pull them apart.</p>
      <div class="intro-note">a sparse autoencoder does this for real.</div>
      <button class="intro-start" id="introstart">untangle your first net</button>`;
  } else {
    const days=Math.max(1,store.meta.streak||1);
    /* the card leads with what still has somewhere to go. "features collected"
       and "tickets" both finish inside a week — measured at a median of two
       days for all sixteen, and all six tickets by day seven — so a returning
       player was being shown two counters that were already over. clean-tier
       badges and superposition pairs are the tracks with runway. */
    // at or above the clean line, so a badge upgraded to perfect still counts
    const clean=FKEYS.filter(k=>TIERRANK[(store.collection.badges[k]||{}).tier]>=TIERRANK.clean).length;
    const pairsGot=Object.keys(store.collection.pairs||{}).length;
    const pairsAll=FKEYS.length*(FKEYS.length-1)/2;
    /* best depth went from here too. it counted a descent that no longer
       exists — the set is ten and cannot be failed — so it read ten for anyone
       who finished a day and said nothing about how they finished it. the day's
       score against par is the reading that moves, and it is the same one the
       record leads on. */
    const best=dayRows().map(dayScore).filter(v=>v!=null).sort((a,b2)=>a-b2)[0];
    /* two readings, not four. `features at clean` and `superposed pairs` are
       both collection counters, and this game is not scored on collecting — the
       same objection that removed `16/16` from the record. worse, they were the
       two BIGGEST numbers on the card a returning player sees first, so the
       screen opened by telling them how much of a set they owned rather than
       how they had been playing.
       the `—` is gone with them. it meant "no score yet" and sat one stroke away
       from the minus sign it shared a slot with, so a new player's card read
       `— best day` and looked like a negative number. a day that has not been
       scored says so in words. */
    b.innerHTML=`<div class="intro-title">welcome back</div>
      <div class="intro-sub">today's ten · the same ten for everyone</div>
      <div class="wbstats wbstats-2">
        <div><b>${days}</b><span>day${days===1?'':'s'} running</span></div>
        <div><b>${best==null?'not yet':fmtScore(best)}</b><span>best day</span></div>
      </div>
      <div class="wbrow">${FKEYS.map(k=>{
        const bd=store.collection.badges[k];
        return `<i title="${k}${bd?' · '+bd.tier:' · unidentified'}" style="${bd?`background:var(${TIERCOL[bd.tier]});border-color:var(${TIERCOL[bd.tier]})`:''}"></i>`;
      }).join('')}</div>
      <div class="intro-note">${
        got<FKEYS.length ? `${FKEYS.length-got} features still unidentified.`
        : clean<FKEYS.length ? `every feature named · ${FKEYS.length-clean} still short of clean.`
        : `every feature clean · ${pairsAll-pairsGot} pairs left to catch sharing a neuron.`}</div>
      <button class="intro-start" id="introstart">start today's run</button>
      <button class="intro-start intro-alt" id="introtrial">time trial ⏱</button>`;
  }
  $('introstart').onclick=()=>{
    store.introSeen=true; store.lastIntroDay=today(); save();
    $('introveil').classList.remove('show');
  };
  if($('introtrial')) $('introtrial').onclick=()=>{
    store.introSeen=true; store.lastIntroDay=today(); save();
    startTrialRun();
  };
}
$('helpbtn').onclick=()=>{renderIntro('rules');showVeil('introveil')};
$('themebtn').onclick=()=>setTheme(themeNow()==='light'?'dark':'light');
/* the solve button. playtesting a ramp means reaching net eight, and reaching
   net eight by hand is most of an evening — so the fastest honest way to look at
   the deep nets is to walk the solver down to them. it is gated on DEV, the same
   flag the unlimited-runs and new-run controls use, so it exists on localhost
   and on nothing else. */
if(DEV){
  $('solvebtn').hidden=false;
  $('solvebtn').onclick=()=>{ try{ window.__solveNet() }catch(e){ toast('solve failed · '+e.message) } };
}
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  document.querySelectorAll('.veil.show').forEach(dismissVeil);
});

/* test hooks */
window.__st=()=>({run:R(),badges:store.collection.badges,threads:threads.map(t=>({k:t.key,f:t.freed,c:t.crossings}))});
/* clears the net the way its own generator says it can be cleared. a family
   net carries the solved figure on every neuron (hx/hy, and alt for the half a
   split hands to the other feature), so the walkthrough is literally "put
   everything back in its slot" — which is also the construction par is priced
   off, so a run of this is a check that the two agree. */
window.__solveNet=()=>{
  const r=R();
  if(spec.fam){
    /* walks the route par was priced from, action for action, billed through
       the same function a real move is. so running this is a direct test of
       the shipped number rather than an approximation of it: it lands on par
       exactly, and if it ever does not, par and the board have come apart.
       the route is famGreedy's own log when the version prices that way, and
       the plain slot walk otherwise — the two versions get the two answers. */
    const plan=spec.plan;
    const route = (plan && GEN_RULES.parMode==='greedy')
      ? famGreedy(plan).log
      : [...members.filter(n=>n.merged).map(n=>['split',n.idx]),
         ...members.map(n=>['drag',n.idx])];
    for(const [kind,idx] of route){
      const n=members.find(m=>m.idx===idx);
      if(!n) continue;
      if(kind==='split'){
        if(!n.merged) continue;
        const alt=n.alt;
        (r.splitNodes=r.splitNodes||[]).push(n.idx);
        splitNode(n,true); chargeTurn(r);
        const half=members.find(m=>m.idx===1000+n.idx);
        if(half&&alt){half.hx=alt.x; half.hy=alt.y}
      } else {
        if(n.pinned||n.hx==null||n.merged) continue;
        // a split parts the halves by MIN_SEP/2, so the half that keeps the
        // original feature is already close enough to its slot to leave alone
        if(Math.hypot(n.x0-n.hx,n.y0-n.hy)<=MIN_SEP*.7) continue;
        n.x0=clampX(n.hx); n.y0=clampY(n.hy);
        r.positions[n.idx]=[n.x0,n.y0];
        chargeTurn(r);
      }
    }
    recordDay(); countCross();
    threads.filter(t=>!t.freed&&canFree(t)).forEach(t=>{freeThread(t,false);r.freed.push(t.key)});
    save(); refresh(); renderHud();
    if(threads.every(t=>t.freed))clearNet();
    return;
  }
  const lane=t=>BH*.09+threads.indexOf(t)*(BH*.82/Math.max(1,threads.length-1));
  const done=new Set(); let sh=0;
  threads.filter(t=>!t.freed).forEach(t=>{
    t.nodes.forEach((n,i)=>{
      if(done.has(n.idx))return; done.add(n.idx);
      if(n.pinned){done.add(n.idx);return}          // pins are already where they must be
      if(n.threads.length>1){n.x0=BW*.42+95*(sh++);n.y0=(lane(n.threads[0])+lane(n.threads[1]))/2}
      else{n.x0=clampX(BW*.07+(BW*.86*i/Math.max(1,t.nodes.length-1)));n.y0=lane(t)+(i%2?9:-9)}
      r.positions[n.idx]=[n.x0,n.y0];
    });
    r.turns=(r.turns||0)+1; r.netMoves++;
  });
  // split every shared neuron too, or the net can never fully clear
  members.filter(n=>n.merged).slice().forEach(n=>{
    (r.splitNodes=r.splitNodes||[]).push(n.idx);
    splitNode(n,true); r.turns=(r.turns||0)+1; r.netMoves++;
  });
  recordDay(); countCross();
  threads.filter(t=>!t.freed&&canFree(t)).forEach(t=>{freeThread(t,false);r.freed.push(t.key)});
  save(); refresh(); renderHud();
  if(threads.every(t=>t.freed))clearNet();
};

renderAll();
/* the first build already publishes the letterbox through applyOrientation,
   but that is measured mid-build. do it once more against the settled layout,
   so the first card of the session is anchored to where the plate actually
   ended up rather than to where it was halfway through being drawn. */
publishPlateInset();
addEventListener('load',publishPlateInset);
// first visit gets the short welcome; a returning player gets it once a day
if(!store.tutorialDone){
  if(!store.introSeen){renderIntro('welcome'); showVeil('introveil')}
} else if(store.lastIntroDay!==today() && R().netMoves===0 && !R().cleared.length){
  renderIntro('back'); showVeil('introveil');
}
</script>
