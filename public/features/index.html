     the teaching — so it is a legend of the board's own marks with the words
     reduced to labels, rather than prose with pictures beside it. */
  .intro-card.plain{grid-template-columns:1fr;max-width:452px}
  .intro-card.plain .intro-art{display:none}
  .rkey{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center;
    margin-top:16px;padding-top:14px;border-top:1px dashed var(--rule);
    font-size:12.5px;color:var(--ink-soft);line-height:1.4}
  .rkey b{color:var(--ink);font-weight:700}
  /* the marks are board fragments at board scale, so a neuron here is the same
     size relative to its thread as the one you are about to drag */
  .rmark{width:56px;height:36px;display:block;flex:0 0 auto}
  /* ---------- intro ---------- */
  .intro-card{
    max-width:790px;width:100%;background:var(--surface);border:1px solid var(--ink);display:grid;
    grid-template-columns:minmax(0,1.08fr) minmax(360px,.92fr);overflow:hidden;box-shadow:var(--shadow-card);
  }
  .intro-strip{height:7px;display:flex;grid-column:1/-1}
  .intro-strip i{flex:1}
  .intro-art{position:relative;min-height:100%;overflow:hidden;background:var(--paper);border-right:1px solid var(--rule)}
  .intro-art > svg{display:block;width:100%;height:100%;min-height:390px}
  .intro-art span{
    position:absolute;left:14px;bottom:14px;background:var(--surface);border:1px solid var(--silver);
    padding:5px 8px;font-size:9.5px;letter-spacing:.16em;color:var(--ink);text-transform:lowercase;
  }
  .intro-body{padding:20px 22px 24px}
  .intro-title{font-size:19px;font-weight:700;text-transform:lowercase;letter-spacing:-.01em}
  .intro-sub{font-size:11px;color:var(--ink-soft);letter-spacing:.12em;margin-top:3px;text-transform:lowercase}
  /* .intro-steps went with the numbered steps it styled — the rules card is a
     legend now, and nothing else in the game is a numbered list. */
  .intro-note{margin-top:15px;padding-top:13px;border-top:1px dashed var(--silver);font-size:12px;color:var(--ink-soft);line-height:1.55}
  .intro-note b{color:var(--ink);font-weight:700}
  /* ONE material for the card's internal divisions. the rules card is the only
     variant that draws two of these rules at once, and they were two different
     greys — the key's in --rule and the note's in --silver, which is visibly the
     heavier of the two on both grounds. the adjacency is the scope: `.rkey` is
     only ever followed by the note on `rules`, so welcome keeps the stronger
     rule between its lead and its hook, where it is the only division there is
     and is doing real work. */
  .rkey + .intro-note{border-top-color:var(--rule)}
  /* ---- the three rungs, as the bar the game already scores in ----
     the same `.track` as the masthead's set strip and the record's head, cut in
     three instead of ten, with the words under their own thirds. see
     rungLadder() for why it is a divided length rather than three swatches and
     why the names stay in ink.
     the one difference from the masthead's: it
     does not animate. a cell easing into its colour is a rung being minted, and
     nothing is minted on a card that only explains what minting is. */
  .rladder{margin-top:15px}
  .rladder .track{margin-top:6px}
  .rladder .track > i{transition:none}
  .rlnames{display:grid;grid-template-columns:repeat(3,1fr);margin-top:7px}
  /* named rather than `.rladder i`, because every cell of the track above is an
     `i` too, so an unscoped rule reaches into the bar and hangs a `·` inside
     every cell of it. a rule written for one element names it. */
  .rlnames > i{font-style:normal;font-size:12.5px;font-weight:700;color:var(--ink);text-transform:lowercase}
  .intro-lead{font-size:14px;line-height:1.55;margin-top:14px}
  .wbstats{display:grid;grid-template-columns:1fr 1fr;gap:0;margin:15px 0 0;border-top:1px solid var(--ink)}
  .wbstats div{padding:11px 0;border-bottom:1px solid var(--rule)}
  .wbstats div:nth-child(odd){border-right:1px solid var(--rule);padding-right:12px}
  .wbstats div:nth-child(even){padding-left:12px}
  .wbstats b{display:block;font-size:23px;font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .wbstats span{font-size:10px;letter-spacing:.14em;color:var(--ink-soft);text-transform:lowercase}
  /* ---- yesterday, and the best day ----
     the record's own shape, at card size: when on the left in the label ink, the
     reading on the right with the figure set against its unit, and the day's ten
     cells after it. it is a ROW rather than a stat cell because the reading is a
     sentence — `8 of 10 clean or better` under a 23px figure would be a caption
     as long as the panel. */
  .wbread{margin-top:13px;display:grid;gap:7px}
  .wbread > div{display:flex;align-items:baseline;gap:10px}
  .wbwhen{flex:0 0 auto;font-size:10px;letter-spacing:.14em;color:var(--ink-soft);text-transform:lowercase}
  .wbfig{flex:1 1 auto;font-size:11.5px;color:var(--ink-soft);letter-spacing:.02em}
  .wbfig b{font-size:15px;font-weight:400;color:var(--ink);font-variant-numeric:tabular-nums}
  /* ---- the week ----
     seven rows of the same three objects, so the eye reads DOWN the columns: the
     date, the day's ten, and the replay. that alignment is the whole reason the
     bars are the same width on every row and the reason an unplayed day draws a
     bare one — a row that opted out of the middle column would break the only
     comparison the list exists to make.
     no borders between rows and no field on any of them. this list sits under a
     card that already draws two horizontal rules; a seven-row table of keylines
     is the shape that got the record's own long list deleted. the rows are
     separated by the gap and nothing else. */
  .wbweek{margin-top:12px;display:grid;gap:3px}
  /* A GRID AND NOT A FLEX ROW, and the two bugs that decided it are worth having
     written down, because both were invisible on screen.
     the row was flex with the bar set to grow. the date column was 66px, so
     `wed 12 aug` broke over two lines and that one row stood taller than its
     neighbours with its bar half a line out of the column. and the bar, growing
     from a flex base of zero — `.track`'s own cells are `flex:1 1 0`, so its
     content width IS zero — took the space the figure and the chip needed and
     pushed both off the right of the panel. NEITHER SHOWED UP AS AN OVERFLOW:
     .intro-card clips, so there was no scrollbar and no page scroll to catch,
     and the chips were simply not on the card.
     four fixed columns cannot do either. the bar takes 1fr and everything else
     has a declared width, so the columns line up down the list however long a
     date is and whatever the panel is doing — and the columns are the reading. */
  .wbday{display:grid;grid-template-columns:78px minmax(0,1fr) 18px 21px;
         gap:10px;align-items:center;padding:2px 0}
  .wbday .wbwhen{white-space:nowrap}
  /* today is the row the card is about: the date in full ink, and it is the one
     row with no press and no chip — see the note in renderIntro. */
  .wbday.now .wbwhen{color:var(--ink)}
  .wbday[data-day]{cursor:pointer}
  /* the press is on the ROW, so the row is what shows it is pressable. an
     underline or a border would be a control drawn inside a list of readings;
     the date coming up to full ink is the same move .dayrow.open:hover makes. */
  .wbday[data-day]:hover .wbwhen{color:var(--ink)}
  .wbday[data-day]:focus-visible{outline:1px solid var(--ink);outline-offset:2px}
  /* the ten cells at the record row's own size. the week's rows are centre
     aligned rather than baseline aligned, because a 6px bar has no baseline
     worth aligning type to.
     the week's bar FILLS ITS COLUMN, which makes it the largest object on the row
     — the same trade the record made when it widened .dtrack to 240 and cut the
     words beside it. both halves of that are needed and neither is decoration:
     `.track.dtrack` ships `width:240px;min-width:120px`, which is wider than the
     column and does not shrink, so without this the bar drew straight over the
     figure and the chip. `min-width:0` is the other half — a grid item's
     automatic minimum is its min-content size, and 120px of it would push the
     column out on a phone.
     the best-day line above is still a flex row, so it keeps a basis there. */
  /* THE WEEK'S BARS ARE 10px, which is `.track`'s own height and the height of
     every instrument a player reads on the board — the masthead's three bays and
     the record's head all draw at it. `.dtrack` drops to 6 because it is a bar
     riding inside a text row on the record, where a 10px block beside 13px type
     would out-weigh the date next to it. this card is not that: the bars ARE the
     rows here, there is no clause competing with them, and at 6px they read as a
     caption for a week that is the subject. the owner asked for the calendar's
     weight and this is where it comes from.
     `min-width:0` is not cosmetic — a grid item's automatic minimum is its
     min-content size, and `.dtrack`'s 120px would push the column out on a
     phone. `width:auto` for the same reason: 240px is wider than the column and
     does not shrink, so without it the bar draws over the figure and the chip. */
  .wbweek .track.dtrack{width:auto;min-width:0;margin-left:0;height:10px}
  .wbread .track.dtrack{flex:0 1 auto;width:96px;min-width:70px;margin-left:0;align-self:center}
  /* the day's figure, in the column between the bar and the chip. it is the ONE
     number on the row and it is the count of nets at clean or better — the words
     `of 10 clean or better` are on the best-day line above and would be seven
     more copies of themselves here. tabular so the column is a column. */
  .wbmini{flex:0 0 18px;text-align:right;font-size:11.5px;color:var(--ink-soft);
          font-variant-numeric:tabular-nums}
  /* the replay chip. `.dstate.dreplay` is the record's own mark at the record's
     own size, and `.ghost` is that slot left empty on the rows that have no
     chip — today, and a day nobody played. the slot is ALWAYS here, which is the
     argument the record's own `.druns` used to carry before it was cut: a mark
     that appears and disappears moves the bar sideways by its own width on the
     rows that lack it, and the columns are the reading. */
  /* the closing line of the pitch. it is a paragraph and not `.intro-note`,
     which draws a dashed rule above itself — on this card that rule belongs to
     the crowd line at the foot and to nothing else, and two of them is the
     ambiguous division the rules card was fixed for. */
  .intro-hook{margin-top:9px;color:var(--ink-soft)}
  .wbday .dreplay{margin-left:0;height:21px;width:21px}   /* the row's gap already spaces it */
  .wbday .dreplay.ghost{visibility:hidden}
  /* the hover pair the record's rows have, at the record's meaning: an unlocked
     chip comes up to ink with the row, and a dashed one takes the ink and keeps
     the dashes — it is still not yours. */
  .wbday[data-day]:hover .dreplay:not(.shut){border-color:var(--ink);color:var(--ink)}
  .wbday[data-day]:hover .dreplay.shut{color:var(--ink)}
  /* the crowd's line, and it is EMPTY until the answer lands. no min-height and
     no placeholder: an undeployed worker leaves nothing here, and a reserved
     empty strip would be the game holding a slot open for a feature it cannot
     reach. margin only when it has something in it. */
  .wbspread:empty{display:none}
  .wbspread{margin-top:12px;font-variant-numeric:tabular-nums}
  .intro-start{margin-top:17px;width:100%;border:1px solid var(--ink);background:var(--ink);color:var(--paper);font:inherit;font-size:12.5px;letter-spacing:.1em;padding:9px;cursor:pointer;text-transform:lowercase;
    transition:background var(--t-ui),border-color var(--t-ui),color var(--t-ui),transform var(--t-lift) var(--ease-out)}
  .intro-start:hover{background:var(--dunkelblau)}
  .intro-start:active{transform:translateY(1px) scale(.995);
    transition-duration:var(--t-ui),var(--t-ui),var(--t-ui),var(--t-press)}
  .intro-alt{margin-top:8px;background:transparent;color:var(--ink);border-color:var(--silver)}
  .intro-alt:hover{background:var(--sig-violett);border-color:var(--sig-violett);color:#fff}
  /* the same shut mark as .wbtn.shut, and for the same reason — see there */
  .intro-alt.shut{border-style:dashed;color:var(--ink-soft)}
  .intro-alt.shut:hover{background:transparent;border-color:var(--silver);color:var(--ink)}

  .toast{
    position:fixed;left:50%;bottom:32px;transform:translateX(-50%) translateY(8px);
    background:var(--ink);color:var(--paper);font-size:11.5px;letter-spacing:.1em;
    padding:8px 16px;opacity:0;pointer-events:none;text-transform:lowercase;z-index:60;
    transition:opacity var(--t-exit) var(--ease-in),transform var(--t-exit) var(--ease-in);
  }
  .toast.show{transition:opacity var(--t-ui) var(--ease-out),transform var(--t-card) var(--ease-out)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* the wordmark, three columns of instrument and three buttons stop sharing a
     line here. what gave way was the buttons: they ran off the right of the
     panel and were clipped by the shell — a two-column head did the same before
     the cluster arrived, at a slightly wider window, so this is an old break
     rather than a new one. the head keeps all its parts and drops the cluster
     onto its own row, where the tracks get the full width instead of a third of
     a squeeze each. */
  @media (max-width:860px){
    .hud-head{grid-template-columns:1fr auto;gap:11px}
    .mark{grid-column:1;grid-row:1}
    .btns{grid-column:2;grid-row:1}
    .instruments{grid-column:1 / -1;grid-row:2;border:1px solid var(--rule);padding:9px 13px 8px}
  }

  /* the board is aspect-locked, the rail is not: below roughly 1120px the rail
     is the taller column and the board floats above a growing band of white —
     233px of it at 900px. from here down the rail becomes a horizontal
     instrument strip and the board takes the full width. this is the ONLY
     thing that changes here; the narrow-screen treatment is at 700px. */
  @media (max-width:760px){
    .hud-body{grid-template-columns:minmax(0,1fr)}
    .rail{
      border-left:0;border-top:1px solid var(--silver);
      flex-direction:row;flex-wrap:wrap;align-items:flex-start;
      gap:16px 24px;padding:16px 22px 18px;
    }
    /* in a column the numeral belongs flush right; in a wide row that same
       margin-left:auto strands it ~150px from its own glyph */
    .rail .gauge-row{justify-content:flex-start;gap:12px}
    .rail .gauge-row b{margin-left:0}
    .railactions{
      flex:1 1 100%;margin-top:4px;flex-direction:row;align-items:stretch;gap:8px;
    }
    .railactions .actionrow{flex:1 1 auto;display:flex;gap:4px}
  }

  @media (max-width:700px){
    .sheet{padding:14px 10px 36px}
    h1{font-size:21px}
    .hud-head{gap:11px;padding:11px 13px 12px}
    /* three columns of a third of a phone still hold a figure, its caption and
       a countable track, so the cluster stays whole rather than splitting up —
       splitting it would cost the one line the three tracks share, which is
       the whole of what makes them one instrument. what gives instead is the
       figure and the caption sharing a line; see .unit-top below. */
    .instruments{padding:9px 11px 8px}
    .unit{padding:0 9px}
    .unit-label{font-size:8.5px;letter-spacing:.1em}
    .unit-fig{font-size:20px}
    .unit-of{font-size:7.5px}
    /* THE LINE FOLDS. a third of a phone is ~92px of usable bay, and the widest
       bay wants 20px of figure, 12 of gap and 62 of caption to hold them side by
       side — it fits at 375 by two pixels and does not fit at 360. so the
       caption takes a full line and drops under its figure. same three parts in
       the same order, one flex line instead of two, and it is the wrap doing it
       rather than a second layout: nothing here restates the desktop rule.
       the fold is set at 700 rather than at the ~430 where it is forced, because
       700 is where this file already puts the narrow treatment and a fourth
       breakpoint costs more than the 200px of tablet it would buy. */
    .unit-top{flex-wrap:wrap}
    .unit-name{margin-left:0;flex-basis:100%;margin-top:2px}
    /* a fourth button in the cluster is 48px including its gap, and on a phone
       the head did not have 48px spare: the row ran 27px past the panel and
       took the instrument tracks with it, which is a horizontal scrollbar on a
       page that does not scroll. the buttons give the width back — they are
       34px tall already, so 34 wide is the square they were always closest to. */
    /* A FIFTH, SIXTH AND SEVENTH BUTTON, and the note above is the record of what
       a fourth already cost: the row ran past the panel and took the instrument
       tracks with it, which is a horizontal scrollbar on a page that does not
       scroll. the collection, the lessons and the till are three more marks in
       that cluster, so it happened again — 14px at 375 and 69px at 320.
       what gives is the RECORD BUTTON'S DATE, not another squeeze on all of
       them: 34px squares are already the smallest square they can be, and the
       date is the one thing in the cluster that is said elsewhere as well —
       the day card's subtitle leads with it, and the record's own head is the
       date. so on a phone that button is its glyph, like every other, and the
       row comes in at 224 of the 353 it has.
       and the cluster wraps, as the floor under all of it. it is not the layout
       — nothing here is meant to reach a second line — it is what happens
       instead of a scrollbar if a mark is ever added to this row again. */
    .btns{gap:4px;flex-wrap:wrap;justify-content:flex-end}
    .btns .help{min-width:34px;padding:0 6px}
    #histbtn .caltext{display:none}
    .rail{gap:15px 20px;padding:14px 13px 15px}
    .rail .gauge{flex:1 1 128px}
    .railactions{flex-wrap:wrap}
    .railactions .actionrow{flex:1 1 100%}
    /* the coach card floated over the board and covered 73% of it — on the
       first screen a new player ever sees. inline it instead; there is no width
       here to overlay anything on.

       it goes UNDER the board, not over it. everything else the game says on a
       phone arrives at the foot — the net card, the cleared card, the say card
       in its corner — so a coach card at the top is the one box that speaks from
       somewhere else, and it pushes the board down the screen on the one screen
       where the board is the entire lesson. the first thing a new player should
       see is the tangle. */
    .field{display:flex;flex-direction:column}
    .coach{
      position:static;transform:none;width:auto;order:1;margin-top:10px;
      box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--surface);
    }
    .play.tutorial .coach{animation:none}

    /* the board is aspect-locked, so a narrow screen renders it short and every
       mark shrinks with it: at 390px a crossing marker came out 1.27 CSS px and
       a thread 1.20. scale the marks back up. presentational only — positions,
       seeds and geometry are untouched, so the day is the same puzzle here. */
    .field{--nr:15;--nw:4.2}
    /* crossings size themselves from markScale inline, so they need no width
       rule here — a stroke is not reachable from a media query anyway. neither
       the pin's square nor the shared neuron's inner ring and halo need one:
       every one of them is expressed off --nr where it is defined, so raising
       --nr here is the whole of the phone treatment for the marks. */
    /* 12.5 source units renders at 4.4 CSS px on a 390px board — a caption you
       cannot read is not a reward for freeing the thread */
    .field .tlabel2{font-size:28px;stroke-width:9}

    /* the rail was 325px against a 205px board — the instruments outweighed
       the game. tighter glyphs and gaps, and the meters lose a row. */
    .rail{gap:12px 16px;padding:12px 13px 13px}
    .gauge{gap:5px}
    .gauge-glyph{width:34px}
    .gauge-row{gap:9px}
    .gauge-row b{font-size:26px}
    /* a third of a phone is 90px of bay. the bar loses 2px of height with the
       cluster around it and keeps everything else — there is nothing to thin
       out any more, because there are no gaps left to spend. */
    .track{height:8px;margin-top:7px}

    /* a vertical list of days should be at its best on a phone, so nothing
       here reflows the row — it stays one line and the margins give instead.
       the collection's phone treatment used to be described here too, from
       when it was a strip pinned above the list that folded to two rows of
       eight. it is a view of its own with a fixed column count now, and what
       this width does to it is set on `.collection` further down. */
    .veil{padding:12px}
    .record,.acct-card{max-height:calc(100dvh - 24px)}
    .acct-body{padding:14px 13px 15px}
    /* 16px on the fields, not 15: ios zooms the whole page in on a focused
       input under 16px, and this page does not scroll, so the zoom cannot be
       got back out of by scrolling. it is the one size on this card set by the
       platform rather than by the scale. */
    .acct-field{font-size:16px}
    .rec-foot{padding:9px 13px 11px}
    .rec-head{padding:11px 13px}
    /* ---- and it fits on one line, unless the till is open ----
       this head used to wrap onto two ALWAYS: title, reading and close never
       fitted at 309px, and `today · your best` drew straight on top of
       `close ×`. the reading was always the widest thing here, and the bay that
       replaced it was wider still, so the rule here gave it a line of its own —
       plus `order` and `width` juggling to put the reading second.
       none of that is here now. the reading is gone, and `flex-wrap` moved up
       to the base `.rec-head` rule where it is conditional rather than forced:
       three items fit on one line at this width and four do not, so the head
       wraps on exactly the deploys that draw `full version` and nowhere else.
       see the comment there for the numbers. */
    .rec-right{gap:7px}
    /* SEVEN HERE TOO, and it was worth measuring rather than assuming. the
       column count is fixed now, so a phone gets the same seven across a third
       of the width: about 42px a cell against the desktop's 80. that is small
       and it still READS — the emblems are flat signs on a plate, so what
       survives the shrink is the silhouette, and the cloud, the hammer, the
       note and the leaf are all still themselves at 42px on both grounds
       (checked). the counterforms are the first thing to go and none of them
       carries a sign on its own.
       a phone-only column count was the obvious alternative and is the wrong
       trade: it would make the collection a different shape on the two devices
       the same player uses, to buy legibility that is not actually in danger.
       only the padding and the gap come in, to match the day list beside it. */
    .collection{padding:11px 13px 14px;gap:5px}
    .daylist{padding:9px 13px 13px}
    .dayrow{gap:8px;padding-right:9px}
    .dayrow .ddate{width:64px;font-size:10px;letter-spacing:.04em}
    .dayrow .ddet{font-size:9.5px}
    /* THE MEASURE IS BACK HERE, because the bar has one again and a phone's row
       is 323px where the desktop's is 602. the desktop's 240 is three quarters
       of that and would leave the detail column nothing at all — and the gutter
       before it comes in too, since 16 plus the row's own gap is a lot of air to
       spend at this width.
       88 IS THE MASTHEAD'S OWN TRACK, measured: the board draws these same ten
       cells at 88px on this device, and that is the bar every player reads all
       day. so the record's bar and the board's are the same length here, and the
       row's is quieter only in height.
       WHAT SIZED IT is the row that has to hold everything at once: an archived
       day, replayed, is a clause AND a bar AND a count on 323px, which leaves
       the bar and the clause 127px between them. `archive` wants 36 of that, so
       anything over 91 here ellipses the one thing on the row the bar cannot say
       — 114 and 100 were both tried and both drew `arch…`. at 88 the words fit
       whole and a longer clause ellipses instead, which is the right way round.
       leaving them the room is the only way to get that: flex-shrink is
       proportional and cannot be ordered, so a bar that gives ground reluctantly
       still takes a share of every squeeze the row gets.
       the floor is BELOW the measure on purpose, and it is the only thing here
       that is not about 375: nothing shrinks at the three sizes this game is
       checked at, and a 320px phone would otherwise clip the chip off the end of
       the row rather than give the last few pixels back.
       all of it has to be RESTATED rather than inherited: .track.dtrack sets its
       own and outranks a bare `.track` at any width. */
    .track.dtrack{width:88px;min-width:80px;height:5px;margin-left:10px}
    .dayarch{padding:0 9px;gap:8px}
    .dayarch .datext{font-size:9.5px}
    /* nothing floats over the board any more, so it keeps its whole height */
    .field{padding-bottom:0}
    .coach{top:10px;width:calc(100% - 20px)}
    /* THE PHONE KEEPS THE CORNER. it used to be pulled out of it and laid across
       the middle of the board — `left:0;right:0;top:28%;translate:0 -50%` and a
       width off the FIELD — on the argument that a card spanning the width has
       no corner to be tucked into, and that the foot would cover the last layer
       of the net rather than a middle one, "the same cost, moved".
       both halves of that are false, and the numbers are the ones the corner was
       chosen on in the first place. measured over nets 1-9 at 375x812, on the
       announcement a net opens with:
         middle band  325x65  10.1% of the plate  2.78 neurons  0.78 crossings
         corner        159x65   5.1% of the plate  1.00 neuron   0.00 crossings
       the card spanned the width only because this rule SET it to. released back
       to `max-content` the opening line is 159px on a 349px plate — a small
       object with a corner to sit in, which is the exact case the corner was
       built for. and the foot is not the same cost as the middle: the crossings
       cluster where the layers interleave, so the middle band stood on 0.78 of
       them a net and anything at the foot stands on none. a card over the marks
       the player is hunting is the one thing this card must never be.
       what the phone still needs from a media query is the TYPE — everything
       below — and nothing about where the card goes. the base rule already caps
       the measure to the plate (408px, or the plate less both 18px insets, which
       binds here at 313), so the longest message in the game is a band at the
       foot of the board rather than across the middle of it.
       the guided net's `top:40%` goes with it. that rule existed because the
       coach card used to be inline at the TOP of the board at this width and 28%
       landed the message on it. the coach is under the board now, so the two are
       at the same end again — but they cannot overlap: the coach is a flex item
       BELOW the plate and this card is absolute INSIDE it, clipped to the plate
       by `.field`'s own overflow. they stack, they do not collide. */
    .sayrow{gap:11px;padding:10px 12px}
    .sayline{font-size:13px}
    .sayline.big{font-size:21px}
    .saymark{width:46px;height:30px}
    .coach-body{padding:11px 13px 12px}
    .coach-text{font-size:13px}
    .intro-card{max-width:430px;grid-template-columns:1fr;max-height:92vh;overflow-y:auto}
    .intro-art{aspect-ratio:16/7;min-height:0;border-right:0;border-bottom:1px solid var(--silver)}
    .intro-art > svg{min-height:0}
    .intro-body{padding:17px 18px 20px}
  }

  /* ---------- reduced motion ----------
     deliberately not a blanket `animation:none` on everything: some of what
     moves here is carrying meaning, and a state change still has to be legible
     with the motion off. what goes is travel — slides, sweeps, lifts, the light
     that runs down a freed thread, the board swap. fades and colour changes
     stay, because a cross-fade is not motion.
     the superposed neuron's halo is the one mark here that gives anything up.
     its ping is travel, so the travel goes — and what is left is the same ring
     standing at its rest radius, which is where it spends most of every cycle
     anyway. the neuron still reads as the one to act on with the motion off,
     and the split still lands both halves where they belong, instantly.
     the physics has its own path in startPhysics: no drift, and springs that
     arrive in one frame rather than five. */
  @media (prefers-reduced-motion:reduce){
    .field,.coach,.play.tutorial .coach,.devdrawer:not([hidden]),
    .minted .mb,.veil.show .bulletin .brow,.field .tlabel2.tin,
    .field .mhalo,
    /* the guided net's spotlight gives up its two travels and nothing else. the
       ping is a travel, so it goes — and it carries opacity 0 on the element,
       so what is left is the standing ring, which was always the mark that does
       the pointing. the leader's dashes stop marching and stay dashes. the
       scrim, the ring, the leader and the landing mark are all still there,
       still ink, still on exactly one neuron and one place to take it. a static
       spotlight is fine; no spotlight is not, because on this net it is the
       only thing telling a new player which mark the coach card means. */
    .field .tutping,.field .tutlead,
    .field .mnode.landed,.field .mnode.retraining,.field .mnode.settling{animation:none}
    .field.swap-out > svg,.field.swap-in > svg,
    .field.swap-out .netnum,.field.swap-in .netnum{animation:none;opacity:1;transform:none}
    .freerun,.clearsweep{display:none}
    .field .mnode.grabbed{transition:none}
    .descentbtn.running svg{animation:none;background:rgba(18,161,154,.2)}
    .live-dot,.coach-dots i.now{animation:none;opacity:.85}
    .veil,.veil.show,.veil > *,.veil.show > *{transform:none;transition-property:opacity,visibility}
    /* the card still arrives, holds and fades — a cross-fade is not motion, and
       this is the only channel several of these facts have. what goes is the
       7px lift and the rows printing themselves in one at a time. clearing
       `transform` outright is safe now that the card sits in a corner rather
       than being centred by one — and the phone's half-height centring is on
       the `translate` property, which this does not touch. */
    .say,.say.on{transform:none;
      transition-property:opacity,visibility}
    .say .rowin{animation:none}
    .help:active,.act:active,.wbtn:active,.intro-start:active,
    .tval:hover,.tval:active{transform:none}
    .toast,.toast.show{transform:translateX(-50%);transition:opacity var(--t-ui)}
  }
</style>
</head>
<body>
<div class="sheet">

  <div class="hud">
  <header class="hud-head">
    <div class="mark">
      <div>
        <!-- the rule lives inside the heading because it is part of the word,
             not a thing beside it: it takes the word's measure for free and it
             cannot be left behind when the word resizes. -->
        <h1>features<i class="wordrule" aria-hidden="true"></i></h1>
        <!-- not "a game about features" any more: under this word that says one
             thing twice. the two lines are the object and the daily shape. -->
      </div>
    </div>
    <div class="instruments">
      <div class="unitrow">
        <!-- figure first, then the words it is a figure OF, then the bar. the
             figure and the words are one line and stand at opposite ends of the
             bay, so the bay is spoken for at both edges however wide it gets —
             see .unit-top. -->
        <div class="unit unit-cross">
          <div class="unit-top">
            <b class="unit-fig" id="crossnum">0</b>
            <span class="unit-name"><span class="unit-label">crossings left</span></span>
          </div>
          <div class="track crossbar" id="crossbar"><span class="run" id="threadrow"></span></div>
        </div>
        <div class="unit unit-par">
          <div class="unit-top">
            <b class="unit-fig" id="parnum">0</b>
            <!-- "turns" is what is counted and "to perfect" is which line it is
                 counted against, so they are one phrase and travel together -->
            <span class="unit-name"><span class="unit-label">turns</span><em class="unit-of" id="parof">to par</em></span>
          </div>
          <div class="track parmeter" id="parmeter" aria-label="turns against par"><span class="run" id="parrow"></span></div>
        </div>
        <div class="unit unit-set">
          <div class="unit-top">
            <b class="unit-fig" id="setnum">0</b>
            <span class="unit-name"><span class="unit-label" id="setlabel">today's set</span></span>
          </div>
          <div class="track setmeter" id="setmeter" aria-label="today's set"></div>
        </div>
      </div>
      <!-- every piece of game feedback lands here, so it has to be announced.
           it is clipped, not hidden, and it costs the head no height. -->
      <span class="msg" id="msg" role="status" aria-live="polite"></span>
    </div>
    <div class="btns">
      <!-- one button, because there is one screen: the collection and the record
           were two readings of the same history and are now one list. it is also
           the fourth button the phone head never had 48px spare for. -->
      <button class="help" id="histbtn" title="the record · every day you have played" aria-label="the record">
        <svg class="recglyph" viewBox="0 0 24 24" aria-hidden="true">
          <g fill="currentColor"><rect x="3" y="5" width="4" height="4"/><rect x="3" y="11" width="4" height="4"/><rect x="3" y="17" width="4" height="4"/></g>
          <g fill="none" stroke="currentColor" stroke-width="1.6"><path d="M10 7h11M10 13h11M10 19h11"/></g>
        </svg>
        <span class="caltext" id="statusdate"></span>
      </button>
      <!-- `groundbtn` is what applyTheme writes and what the click is wired to,
           so this one and the record's are found together and cannot drift. the
           id stays because it is what `.help`'s layout and the tests know it by. -->
      <button class="help groundbtn" id="themebtn" title="ground" aria-label="ground">
        <svg class="themeglyph" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor"/></svg>
      </button>
      <!-- ---- the collection ----
           the 7x7 grid it actually draws, at three by three: squares only, which
           is the one shape a grid of named things can be in this palette, and the
           same mark language `recglyph` above already uses for a list. it opens
           the record ON its collection view rather than being a screen of its
           own — there is one collection and this is a door to it. -->
      <button class="help" id="collbtn" title="the collection · every feature you have named"
              aria-label="the collection">
        <svg viewBox="0 0 24 24" aria-hidden="true"><g fill="currentColor">
          <rect x="4" y="4" width="4.5" height="4.5"/><rect x="9.75" y="4" width="4.5" height="4.5"/><rect x="15.5" y="4" width="4.5" height="4.5"/>
          <rect x="4" y="9.75" width="4.5" height="4.5"/><rect x="9.75" y="9.75" width="4.5" height="4.5"/><rect x="15.5" y="9.75" width="4.5" height="4.5"/>
          <rect x="4" y="15.5" width="4.5" height="4.5"/><rect x="9.75" y="15.5" width="4.5" height="4.5"/><rect x="15.5" y="15.5" width="4.5" height="4.5"/>
        </g></svg>
      </button>
      <!-- ---- the guided nets ----
           the tutorial's OWN mark: the spotlight it draws on the neuron to act
           on, which is a ring with light coming off it. a circle and four 45°
           rays, so it is inside the palette's geometry, and it is the one thing
           on screen a returning player has seen before in exactly this shape.
           hidden while the lessons are still ahead — pressing it then would
           restart a tutorial the player is already inside — and shown for the
           first time when they finish, which is when it becomes the only way
           back. renderHud keeps that in step. -->
      <button class="help" id="tutbtn" hidden
              title="the guided nets · the three lessons again" aria-label="the guided nets">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <circle cx="12" cy="12" r="1.8" fill="currentColor"/>
          <g fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M4.8 4.8l2.6 2.6M19.2 4.8l-2.6 2.6M4.8 19.2l2.6-2.6M19.2 19.2l-2.6-2.6"/>
          </g>
        </svg>
      </button>
      <!-- ---- the full version ----
           a PLUS, because that is what it is: the game's own framing is that the
           free tier is complete and money adds the archive, the replay and the
           trial — "an addition drawn as an addition" (see the note on the record's
           played row). a circle, a horizontal and a vertical, which is as plain as
           this palette gets.
           `hidden` until `canBuy()` says there is a till AND the player does not
           already hold it, which is the same gate the record's line and the
           cleared card's offer read. a shop button that answers "the till is not
           answering" is worse than none, and a buyer must never see one at all.
           it stays in the QUIET ink of every other control here rather than taking
           the purchase violet: a saturated field in the masthead is a badge, and
           a badge is the one form this interface does not use. -->
      <button class="help" id="buybtn" hidden
              title="the full version" aria-label="the full version">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <path d="M12 7.5v9M7.5 12h9" fill="none" stroke="currentColor" stroke-width="1.6"/>
        </svg>
      </button>
      <button class="help" id="helpbtn" title="how to play" aria-label="how to play">?</button>
      <!-- DEVELOPER TOOL, and it says so. it solves the net down the exact route
           par is priced from, so it is also a live check that the two agree.
           `hidden` by default and only unhidden on a DEV host — it must never
           reach a player, because a button that plays the game for you is the
           one control that can empty the whole product. -->
      <button class="help devsolve" id="solvebtn" hidden
              title="dev · solve this net (walks the route par is priced from)"
              aria-label="dev · solve this net">
        <svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.7">
          <path d="M4 18L10 12L4 6"/><path d="M12 18h8"/></g></svg>
      </button>
      </div>
  </header>

  <div class="hud-body">
  <div class="play" id="play">
  <div class="field" id="field">
    <svg id="netsvg" viewBox="0 0 1040 580" preserveAspectRatio="xMidYMid meet" aria-label="the tangle"></svg>

    <div class="coach" id="coach">
      <div class="coach-strip" aria-hidden="true">
        <i style="background:var(--flag-1)"></i><i style="background:var(--flag-2)"></i>
        <i style="background:var(--flag-3)"></i><i style="background:var(--flag-4)"></i>
      </div>
      <div class="coach-body">
        <div class="coach-head">
          <span id="coachlabel">guided net · step 1 of 3</span>
          <span class="coach-dots" id="coachdots"><i></i><i></i><i></i></span>
        </div>
        <div class="coach-text" id="coachtext"></div>
        <!-- filled by renderTutorial from the board's own marks -->
        <div class="coach-key" id="coachkey"></div>
      </div>
    </div>

    <!-- the seen half of every flashMsg. the heard half is #msg up in the
         masthead, which is why this is hidden from the reader: one fact, one
         announcement. -->
    <div class="say" id="say" aria-hidden="true"></div>

    <!-- both bulletins are IN the board, not over the window. they tuck into the
         plate's bottom-right off --plate-x / --plate-y, and those are inherited
         custom properties published on `.field` by publishPlateInset — so this
         is the only place in the document that can read them. see .boardcard in
         the stylesheet for the rest of the argument.
         the day card is here rather than at body level because the day now ends
         on the board it was won on: the tenth net stays cleared on the plate
         instead of being swapped out for an eleventh nobody can play. -->
    <div class="veil boardcard" id="netveil"><section class="bulletin" id="netbulletin"></section></div>
    <div class="veil boardcard" id="runveil"><section class="bulletin" id="runbulletin"></section></div>
  </div>
  </div><!-- /play -->

  </div>
  </div>
</div>


<div class="devdrawer" id="devdrawer" hidden>
  <div class="dd-head"><span>controls</span><a href="#" id="ddclose">close &times;</a></div>
  <div class="actionrow">
    <button class="act" id="descentbtn"><svg viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 4v13M7 12l5 5 5-5M5 21h14"/></g></svg><span>let it settle</span></button>
    <button class="act" id="skipnet"><svg viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 6l7 6-7 6zM13 6l7 6-7 6z"/></g></svg><span>skip net</span></button>
    <button class="act" id="reset"><svg viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8"><path d="M19 12a7 7 0 1 1-2-4.9M19 4v4h-4"/></g></svg><span>reset</span></button>
    <button class="act" id="newrun" hidden><svg viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 5l11 7-11 7z"/></g></svg><span>new run</span></button>
  </div>
  <div class="dd-note">press <b>d</b> to hide &middot; none of this is settled as part of the game</div>
</div>

<!-- neither bulletin is here: both live inside `.field`, above, because both are
     cards about a board you are still looking at. what is left at this level is
     the three overlays that genuinely replace the screen — the record, the rules
     and the welcome. -->

<!-- the record: one list, one screen.
     the month calendar, the fourteen-day stamp strip and the run list were three
     drawings of the same history — a grid you could not read a run off, a strip
     that only went back a fortnight, and a list that did not know which days you
     had missed. this is the one surface: a day per line, newest first, every day
     back to launch whether you played it or not, with the stamps you minted that
     day laid along the line. the head carries what a day list cannot say —
     which of the sixteen features you have still never seen. -->
<div class="veil" id="histveil">
  <section class="record">
    <!-- THE HEAD IS CONTROLS NOW, NOT A READING.
         it carried the day's score as an instrument — a figure, two clauses and
         the day's ten rungs drawn underneath. that reading is already on the
         screen twice: every row draws its own ten cells, and the row for today
         is two inches below the head saying the same thing about the same day.
         a number the eye meets three times in one card is furniture whatever it
         is made of, and this one was the biggest thing on a screen whose subject
         is a LIST.
         so the top of the record is a title and the ways out of it, which is
         what a title bar is for. the score lives in the rows, where it is
         attached to the day it belongs to. -->
    <div class="rec-head">
      <strong class="rec-title">the record</strong>
      <span class="rec-right">
        <!-- the way to the full version, drawn only when there is a till to
             answer — `canBuy()` is the one gate and an unlock that answers "the
             till is not responding" is worse than no unlock. it is the same act
             `runOverOffer` performs on the cleared card and it calls the same
             `beginUnlock`; what is new is only that the record can reach it,
             which it could not since the archive line stopped selling. -->
        <!-- `histview` stood here: a `collection` / `the days` toggle, the way
             between the card's two readings. and after it a `groundbtn` square,
             which was here because the record is a modal veil and its own head was
             the whole of the interface while it was up.
             BOTH ARE IN THE TOP BAR NOW and the owner cut them from here (17 Aug
             2026). the bar carries the ground, and it carries a mark for each of
             the two views — so the toggle became a third control for a choice two
             marks already make, and it made the record's mark ambiguous: press
             `collection` here and the bar's record mark opened the collection
             afterwards, because `recView` remembered.
             WHAT IT COSTS, stated rather than discovered: while this veil is up
             there is no way to flip the ground or to cross between the two
             readings. you close it — one press, and the mark you want is in the
             bar behind it. that is the trade a single menu makes, and the reason
             each bar mark now sets `recView` for itself rather than inheriting
             whatever the last one chose. -->
        <a href="#" class="rec-btn" id="histbuy" hidden>full version</a>
        <!-- a cross and nothing else. `close ×` said it twice — the word and
             the glyph are the same instruction, and the glyph is the one every
             player already reads without being taught. square, so it reads as a
             control rather than as a word that happens to be boxed. -->
        <a href="#" class="rec-close" id="histclose" aria-label="close" title="close">&times;</a></span>
    </div>
    <div class="daylist" id="daylist"></div>
    <!-- THE SET AS A WHOLE, and it used to be a strip pinned above the list —
         one row of sixteen plates, squeezed to a card's width, retiring the
         moment the set filled. it was the only view of the collection and it was
         the smallest thing on the screen.
         it is a view now, reached by the button in the head. that buys three
         things the strip could not have: the cells are large enough to be the
         drawings they are rather than thumbnails, the grid stays square as the
         cast grows, and the set stops competing with the days for the same
         inches. it also stops retiring — a filled collection is worth looking
         at, and the strip deleted itself at exactly the moment it became one. -->
    <div class="collection" id="reccollection" hidden></div>
    <!-- whose record this is. it belongs at the FOOT of this card and nowhere
         else in the game: the question "where does this live" only occurs to
         you once you are looking at a year of days you would hate to lose, and
         that is this screen. drawn only when there is a server to sign in to —
         renderAccount leaves it hidden otherwise, so a copy of index.html
         opened off a disk shows no dead buttons. -->
    <div class="rec-foot" id="recfoot" hidden></div>
  </section>
</div>

<!-- the account card. the LAST STEP of signing in and the only screen in the
     game with a field in it, so it is kept to one question at a time: where to
     send a code, or what to call you, or whether you want the morning line.
     everything on it is optional and every mode closes — a player who signs in
     and answers nothing gets the whole game and a record that follows them,
     which is the point of it. -->
<div class="veil" id="acctveil">
  <section class="acct-card">
    <div class="rec-head">
      <strong class="rec-title" id="accttitle">your account</strong>
      <span class="rec-right"><a href="#" class="rec-close" id="acctclose">close &times;</a></span>
    </div>
    <div class="acct-body" id="acctbody"></div>
  </section>
</div>

<div class="veil" id="introveil">
  <div class="intro-card">
    <div class="intro-strip" aria-hidden="true">
      <i style="background:var(--flag-1)"></i><i style="background:var(--flag-2)"></i>
      <i style="background:var(--flag-3)"></i><i style="background:var(--flag-4)"></i>
    </div>
    <!-- the plate is a net drawn by the board's own marks, filled by renderIntro -->
    <div class="intro-art" id="introart"></div>
    <div class="intro-body" id="introbody"></div>
  </div>
</div>

<!-- a question, in the game's own card instead of the browser's.
     empty until ask() fills it, and only ever one at a time — a second question
     supersedes the first rather than stacking on it. `alertdialog` rather than
     `dialog` because it is always a consequence being reported, never a form;
     the label is written by ask() off the title, since the card is built from
     the same bulletinHTML as the other two and that has no id to point at. -->
<div class="veil askveil" id="askveil">
  <section class="bulletin" id="askbulletin" role="alertdialog" aria-modal="true"></section>
</div>

<div class="toast" id="toast">copied</div>

<script>
/* ================= feature catalogue ================= */

const MARKGRID=`<g fill="none" stroke="var(--mark,#fff)" stroke-width="1" opacity=".16"><path d="M12 0V96M24 0V96M36 0V96M48 0V96M60 0V96M72 0V96M84 0V96M0 12H96M0 24H96M0 36H96M0 48H96M0 60H96M0 72H96M0 84H96"/></g>`;
/* ---- the forty-nine signs ----
   96x96, single colour, horizontals / verticals / 45° diagonals / true circular
   arcs only, after Aicher's Munich 1972 system.

   `e` used to ride alongside `c` and `p`: one emoji per feature, for the emoji
   strip the run-over card used to build. that strip is gone (see showRunOver)
   and SHAREBLOCK says why the text share is deliberately NOT emoji — so the
   field was read by nothing at all, in this file or in tools/ or worker/. it is
   dropped here rather than restated thirty-three more times.

   AT FORTY-NINE THE BINDING CONSTRAINT IS EACH OTHER, NOT EACH ONE. the grid
   draws these at about eighty pixels a side, so a sign is not finished when it
   reads — it is finished when it cannot be mistaken for any of the other
   forty-eight. that is what the notes above each entry are: what the sign is
   NOT, and which neighbour made it move. the pairs that cost the most were
   round ones (nine of the cast are a disc of some sort) and triangles.

   the FIRST shape in `p` is the primary path: the sign proper, and the one
   `featureShape` wears down into the settle-polyline when the feature comes
   free. everything after it is a hole or a counterform (a window, a gutter, a
   midrib) drawn in `--emblem`, the plate colour, so it cuts rather than adds.
   that ordering is load-bearing — put a counterform first and the thread will
   settle into a window.

   so each primary is a closed outline of six to twelve corners that still reads
   when it is worn down to five points. that rules out bands: the outline of a
   stroked zigzag runs out along the top and back along the bottom, and reduces
   to a smear whichever way you sample it. the waves, the bars and the brackets
   are all solids here for that reason, not decoration. */
const FEATURES={
  // a lumpy cloud, and the rain as separate strokes below. flat-based it
  // reduced to the same low ridge as mountains; a closed blob does not
  weather:{c:'--hellblau',p:`<path d="M16 56A16 16 0 0 1 34 32A18 18 0 0 1 64 28A16 16 0 0 1 82 48A70 70 0 0 1 16 56Z"/><path d="M26 70H36L18 88H8ZM52 70H62L44 88H34ZM78 70H88L70 88H60Z"/>`},
  // a bird in profile. drawn head-on with swept wings it was an arrow, every time
  birds:{c:'--gruen',p:`<path d="M4 40L14 30A10 10 0 0 1 32 26A26 26 0 0 1 64 42L90 16V34L66 58A40 40 0 0 1 4 40Z"/><path d="M28 40H56L38 58L28 48Z" fill="var(--emblem)"/><circle cx="21" cy="33" r="2.5" fill="var(--emblem)"/>`},
  // a hammer laid on the diagonal — upright it read as a signpost
  tools:{c:'--tuerkis',p:`<path d="M12 36L36 12L46 22L38 30L78 70L70 78L30 38L22 46Z"/>`},
  // an eighth note. the head is a diamond so head, stem and flag are one path
  music:{c:'--violett',p:`<path d="M48 14H58L80 36V50L58 28V70L40 88L22 70L40 52L48 60Z"/>`},
  // half a slice, cut side up, rind left standing between the segments
  citrus:{c:'--orange',p:`<path d="M12 44H84A36 36 0 0 1 12 44Z"/><g fill="var(--emblem)"><path d="M44 44H52V86H44Z"/><path d="M44 44H52V86H44Z" transform="rotate(45 48 44)"/><path d="M44 44H52V86H44Z" transform="rotate(-45 48 44)"/><path d="M38 44H58A10 10 0 0 1 38 44Z"/></g>`},
  chess:{c:'--violett',p:`<path d="M28 16H42V28H54V16H68V70L84 86H12L28 70Z"/>`},
  // sea, not two thin bands: a solid with a wave for a top edge. the crest is
  // an arc, not a peak — sharp peaks are what mountains is, and it showed
  water:{c:'--hellblau',p:`<path d="M8 62A20 20 0 0 1 48 62A20 20 0 0 0 88 62V86H8Z"/><path d="M8 34A20 20 0 0 1 48 34A20 20 0 0 0 88 34V44A20 20 0 0 1 48 44A20 20 0 0 0 8 44Z"/>`},
  // one path, two arcs: a crescent rather than a disc with a disc cut out of it
  night:{c:'--dunkelblau',p:`<path d="M60 14A36 36 0 1 0 60 82A35 35 0 0 1 60 14Z"/><path d="M76 62L84 70L76 78L68 70Z"/>`},
  fire:{c:'--orange',p:`<path d="M34 8L74 48A26 26 0 0 1 22 48L34 36Z"/><path d="M48 40L58 50A10 10 0 0 1 38 50Z" fill="var(--emblem)"/>`},
  mountains:{c:'--gruen',p:`<path d="M8 84L32 60L44 72L64 52L88 76V84Z"/><path d="M32 60L40 68H24ZM64 52L72 60H56Z" fill="var(--emblem)"/>`},
  // two of the same thing, one behind the other — the sign for a doubled letter
  doubled:{c:'--gelb',p:`<path d="M18 18H60V36H78V78H36V60H18Z"/><path d="M30 30H60V36H36V60H30Z" fill="var(--emblem)"/>`},
  // three bars as one rising step, the gaps cut back in above a kept baseline

/* ================= generator versions =================
   a day is generated by the newest version whose `from` is on or before it.

   FEATURE CHOICE SPLICES FROM A SHRINKING POOL, SO THE POOL'S LENGTH IS A
   HIDDEN SEED INPUT. `Math.floor(fr()*pool.length)` reads a different index the
   moment the length changes, and every splice after it inherits the shift — so
   a seventeenth feature does not add a seventeenth name to the same ten nets,
   it rewrites which features are on every board of every day the version owns.
   `feats` is spelled out per entry rather than read from FKEYS for exactly that
   reason: it puts the pool under version control instead of under whatever the
   drawing table happens to hold.

   WHAT IT DOES NOT DO, ON A FAMILY BOARD, IS MOVE THE GEOMETRY — and this file
   and AGENTS.md both used to say it did, which was true when they were written
   and has been false since v4. the only thing a feature KEY feeds is
   `strength`, and strength's two consumers are `width` (stroke, drawing only)
   and `nodeCount` — and nodeCount is read in exactly one place, the scatter
   placement loop, which is the `else` of the layered/families branch. every
   daily board from v4 on is a family board, so nodeCount is dead code for all
   of them and the coordinates do not know which feature is riding them.
   measured when the cast went to forty-nine: 910 boards over 100 sampled days,
   780 casts rewritten, ZERO changes to xyHash, par, starting crossings or
   neuron count. the pool length still moves geometry where the scatter loop is
   live — v1 and v2's days, and the time trial, which forces layout='scatter'.

   SO DO NOT LET tools/parity-fixtures.json TELL YOU A CAST CHANGE WAS SAFE. its
   rows are startCrossings, salt, par, nodes and a hash of the coordinates, and
   not one of those five carries which features are on the board — so `verify-
   parity --check` passes clean through a change that renamed every thread in
   the game, and it did. that is the fixtures being narrow, not the change being
   inert. to see a cast move you have to hash `threads.map(t=>t.key)` yourself.

   what none of this means is that an entry can never be edited. this file used
   to say a version is frozen the moment it ships and that editing one is never
   right; it is not, pre-launch. nobody has played a day yet, so there is no
   run to protect, and editing the entry that owns today is usually simpler and
   far more legible than appending a version whose only difference is a list.
   v5 was amended on the day it shipped and v11's cast was rewritten on 16 Aug
   2026. the cost is real and it is only this: a score already in your own save
   refers to a board that no longer exists.

   changing geometry or par for a day that HAS been played is a different
   matter, and that is what appending a version with a future `from` is for. */

   repeated both because they are counter-intuitive:
   - a PIN makes a net EASIER, not harder. the family comment on the pin loop

     a step whose only new ingredient is a pin therefore measures as a step DOWN:

  {threads:2, nodes:4, shared:0, pinned:0, minX:3,  maxX:6},   //  8 · + length
  {threads:2, nodes:5, shared:0, pinned:0, minX:4,  maxX:9},   // 10 · + length
  {threads:3, nodes:4, shared:0, pinned:0, minX:6,  maxX:12},  // 12 · + a third feature
  {threads:3, nodes:5, shared:0, pinned:0, minX:7,  maxX:14},  // 15 · + length
  {threads:3, nodes:6, shared:1, pinned:0, minX:8,  maxX:16},  // 17 · + the first superposition
  {threads:4, nodes:5, shared:1, pinned:1, minX:10, maxX:20},  // 19 · + a fourth feature
  {threads:4, nodes:6, shared:1, pinned:2, minX:12, maxX:24},  // 23 · + length
  {threads:4, nodes:7, shared:2, pinned:2, minX:14, maxX:30},  // 26 · + the second superposition
  {threads:5, nodes:6, shared:2, pinned:2, minX:16, maxX:36}   // 28 · + a fifth feature

/* ---- the same ramp again, and this time the day stops GROWING ----

   spreading in bulk: live neurons run 6,8,10,12,15,17,19,23,26,28, so the last

     the first superposition  net 5 -> net 3

  {threads:2, nodes:4, shared:0, pinned:0, minX:3,  maxX:6},   //  8 · + length
  {threads:3, nodes:4, shared:0, pinned:0, minX:5,  maxX:11},  // 12 · + a third feature
  {threads:3, nodes:4, shared:1, pinned:0, minX:6,  maxX:13},  // 11 · + the first superposition
  {threads:3, nodes:5, shared:1, pinned:1, minX:7,  maxX:15},  // 14 · + length, + the first pin
  {threads:4, nodes:4, shared:1, pinned:1, minX:9,  maxX:18},  // 15 · + a fourth feature
  {threads:4, nodes:5, shared:2, pinned:1, minX:10, maxX:20},  // 18 · + the second superposition
  {threads:4, nodes:5, shared:2, pinned:2, minX:12, maxX:24},  // 18 · + the second pin
  {threads:5, nodes:5, shared:2, pinned:2, minX:14, maxX:28},  // 23 · + a fifth feature
  {threads:5, nodes:5, shared:3, pinned:2, minX:15, maxX:32}   // 22 · + the third superposition

const rampFor=r=>{
  const m=(r||GEN_RULES).ramp;

/* `rules` is passed rather than read off GEN_RULES by every caller, because
   famSeq asks for a spec while deciding a whole day's layouts and has only the
   date in hand — GEN_RULES holds whatever net was built last. buildNet does set
   it before asking, and passing it anyway is what stops that ordering from
   being load-bearing again. */
function netSpec(i, rules){
  const T=rampFor(rules);
  const s = i<T.length ? {...T[i]}
    : {threads:5, nodes:5+((i-T.length)%3), shared:Math.min(2+Math.floor((i-T.length)/2),4),
       pinned:Math.min(2+Math.floor((i-T.length)/3),5), minX:16, maxX:60};

  s.par = s.threads*2 + s.shared*3 + (s.nodes-3)*2 + (s.pinned||0)*2 + 3;
  return s;
}

     optimum that does not happen to fall under par is not an optimum, so it is
     dropped and the net scores on two rungs. that reading cost 7 of
     2026-08-14's ten nets their top rung and 48 of the 120 across 2026-08-01 …

     that was played under it: a day already played keeps the rungs it was
     played with, which is the whole reason this is a version and not a fix.

     plus its grace under `ramp`, and clean is held a turn above it — so the
     three rungs are three by construction and no arithmetic can fold two of
     them together. `Math.max` keeps clean at the board's par wherever par is
     already clear of perfect, which on a v9 net is every time, so the derivation
     is a floor rather than a new number. */
  if(GEN_RULES.rung==='flat') return {optimum:(o<par)?o:par, par};
  const graced = GEN_RULES.rung==='ramp' || GEN_RULES.rung==='wide';

  const gap = GEN_RULES.rung==='wide' ? cleanGap(perfect) : 1;

  /* the local save is untouched. signing out is leaving a DEVICE, not deleting
     a record — the collection stays on this browser exactly as it was, and
     signing back in merges rather than replaces.
     the unlock stays too, and that is the same sentence rather than an
     oversight: the purchase has not gone anywhere, the player is coming back,
     and this browser had the archive open a moment ago. deleting the ACCOUNT is
     the one that gives it up, and that one says so before the second press. */
  syncSay='';
  if($('histveil').classList.contains('show')) renderAccount();
  toast('signed out · this device keeps its own record');
}

/* ---- the sync ----
   one call, both directions. `save()` is called on nearly every turn, so this
   is debounced hard rather than being called from the handful of places that
   matter — a list of "places that matter" is a list that goes out of date. */
let syncTimer=null, syncing=false, syncQueued=false;
function syncSoon(){
  if(!account||!account.signedIn) return;
  clearTimeout(syncTimer);
  syncTimer=setTimeout(()=>syncNow(),3000);
}
async function syncNow(){
  if(!API||!account||!account.signedIn) return;
  if(syncing){ syncQueued=true; return }
  syncing=true; syncSay='saving';
  if($('histveil').classList.contains('show')) renderAccount();
  /* what was sent, as it was sent. a net cleared while the request was in
     flight is NOT in the answer coming back, so adopting that answer would drop
     it — and it is a clear, which is the one thing this must never lose. if the
     collection moved underneath us, throw the answer away and sync again with
     the newer one; a run takes seconds and this converges immediately. */
  const sent=JSON.stringify(store.collection);
  try{
    const j=await apiCall('/sync',{
      method:'POST',
      headers:{'content-type':'application/json'},
      body:outbound()
    });
    if(JSON.stringify(store.collection)!==sent){ syncQueued=true }
    else if(j&&j.state){ adoptState(j.state); syncSay='saved' }
  }catch(e){
    // an offline device is not a broken one. it keeps playing and tries later.
    syncSay = /^http 401/.test(e.message) ? '' : 'offline';
    if(/^http 401/.test(e.message)) account={signedIn:false};
  }
  syncing=false;
  if($('histveil').classList.contains('show')) renderAccount();
  if(syncQueued){ syncQueued=false; syncSoon() }
}

/* take the merged record; leave the board alone.
   the collection, the day rows and the high-water marks are the point and they
   are adopted whole. the RUN is not — replacing it mid-drag would swap the
   board out from under a hand that is on it. the one exception is a run that
   has not been touched, which is what a device that has never seen today has:
   there, taking the further-along run is the whole reason somebody signed in. */
function adoptState(merged){
  if(!merged||typeof merged!=='object') return;
  const mine=R(), theirs=merged.run;
  store.collection=merged.collection||store.collection;
  store.meta=merged.meta||store.meta;
  store.premium=!!merged.premium;
  if(merged.runsDay===store.runsDay) store.runsToday=Math.max(store.runsToday||0,merged.runsToday||0);

  const untouched = mine && !mine.turns && !mine.netIndex && !(mine.cleared||[]).length && !mine.netMoves;
  const catchUp = untouched && theirs && theirs.day===mine.day && theirs.mode===mine.mode
               && ((theirs.cleared||[]).length>0 || theirs.netIndex>0);
  if(catchUp){
    store.run=theirs;
    if(merged.parked) store.parked=merged.parked;
    try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}
    builtFor=-1; resetDescent(); renderAll();
    toast('your set is where you left it · net '+((theirs.cleared||[]).length+1));
  } else {
    try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}
    renderHud();
  }
  if($('histveil').classList.contains('show')) openRecord();
}

/* on boot, and only for a device that has signed in before — asking `who am i`
   of a browser that never has is a request that can only ever answer "nobody". */
async function wakeAccount(){
  if(!API) return;
  const back=new URLSearchParams(location.search).get('signin');
  if(back){
    /* scrub the verdict out of the url before anything else: it must not
       survive a reload, and it must not end up in a shared link. */
    const u=new URL(location.href); u.searchParams.delete('signin');
    history.replaceState(null,'',u.pathname+u.search+u.hash);
    if(back==='cancelled'){ /* pressing cancel is not a failure worth a line */ }
    else if(back!=='ok') toast('that sign-in did not go through · nothing was lost');
  }
  /* a player still in the tutorial is about to be offered a sign-in on the card
     that ends it, and that card cannot wait on a request. asking here — and
     ONLY here, for the one load where it is needed — means the answer is in
     hand by the time a first net is untangled. everybody else pays nothing:
     a returning player with no account still makes no request at all. */
  if(!store.tutorialDone) askSignIns();
  /* three reasons to ask, and "somebody opened the game" is not one of them: a
     browser that has signed in before, one coming back from a provider, and one
     holding a purchase made without an account. every other visit sends nothing
     at all, which is what keeps a static file a static file. */
  if(!store.signedInOnce && back!=='ok' && !acct.token) return;
  /* one call answers both halves — who this is, and what they own — and it is
     the quiet one, because there is no button behind this. an unreachable
     worker leaves the local flag and the local record exactly as it found them. */
  const me=await api('me');
  if(!me || me.error){
    account={signedIn:false};
    if(!me) syncSay='offline';
  } else {
    account=me;
    if(applyEntitlement(me)) entitlementChanged();
    if(me.signedIn){
      store.signedInOnce=true;
      if(back==='ok') toast('signed in · your record follows you now');
      // a purchase made before there was an account catches up with it here
      await linkUnlock();
      await syncNow();
      tellClock();
      // signing in is not finished until anything still unanswered is asked
      if(back==='ok') afterSignIn();
    } else {
      /* the session expired or was signed out elsewhere. forget the hint so the
         next boot is silent rather than asking again every single load. */
      delete store.signedInOnce;
      try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}
    }
  }
  if($('histveil').classList.contains('show')) renderAccount();
}

/* ================= the account card =================
   one screen, three things it can be asking, and never more than one at a time:
   where to send a code, what to call you, or what you have already chosen.

   the shape of the whole thing is that NOTHING on it is required. an account
   exists to carry a record between devices; a name is so the game can say hello
   and so a leaderboard has a handle one day; an address is only ever for the
   two mails that exist. a player who signs in and closes this immediately has
   the entire game and a record that follows them. the rest is asked once,
   politely, at the one moment it makes sense — straight after signing in — and
   then never again. */
let acctMode='hello', acctEmail='', acctErr='', acctBusy=false, acctArmed=false;

function openAccount(mode){
  acctMode=mode||'manage'; acctErr=''; acctArmed=false;
  if(mode!=='code') acctEmail=(account&&account.email)||'';
  renderAcct(); showVeil('acctveil');
}
const closeAccount=()=>{ $('acctveil').classList.remove('show');
                         if($('histveil').classList.contains('show')) renderAccount() };

/* the last step of signing in. it only appears while there is still something
   unanswered — no name, or the daily never put to this account — so somebody
   who signed in with google and said yes to the mail last month simply lands
   back in the game. */
function afterSignIn(){
  if(!account||!account.signedIn) return;
  const noName=!account.nickname;
  const unasked=account.mail && !account.dailyEmail && !store.askedDaily;
  if(!noName && !unasked) return;
  if(document.querySelector('.veil.show')) return;   // never on top of another card
  openAccount('hello');
}

function acctBtn(id,label,solid){
  return `<button class="wbtn${solid?' solid':''}" id="${id}"${acctBusy?' disabled':''}>${label}</button>`;
}

function renderAcct(){
  const body=$('acctbody'), title=$('accttitle');
  const err=acctErr?`<div class="acct-err">${esc(acctErr)}</div>`:'';
  const signedIn=!!(account&&account.signedIn);

  /* ---- signing in with an address ---- */
  if(acctMode==='email'||acctMode==='code'){
    title.textContent='sign in with email';
    if(acctMode==='email'){
      body.innerHTML=err
        +`<div class="acct-ask">where should the code go?</div>`
        +`<input class="acct-field" id="acctemail" type="email" inputmode="email" autocomplete="email"
                spellcheck="false" placeholder="you@example.com" value="${esc(acctEmail)}">`
        +`<div class="acct-row">${acctBtn('acctsend',acctBusy?'sending…':'send the code',true)}</div>`
        /* said before the address is typed, not after: it is the reason to type
           one at all, and a promise made afterwards is an excuse. */
        +`<div class="acct-note">no password, ever. six digits, and you are in.<br>
            the only mails this game sends are that code and the daily, and the daily is off unless you ask.</div>`;
      $('acctsend').onclick=sendCode;
      $('acctemail').onkeydown=e=>{ if(e.key==='Enter'){e.preventDefault();sendCode()} };
      setTimeout(()=>$('acctemail')&&$('acctemail').focus(),40);
    } else {
      body.innerHTML=err
        +`<div class="acct-ask">six digits, sent to <b>${esc(acctEmail)}</b>.</div>`
        +`<input class="acct-field code" id="acctcode" type="text" inputmode="numeric"
                autocomplete="one-time-code" maxlength="6" placeholder="000000">`
        +`<div class="acct-row">${acctBtn('acctverify',acctBusy?'checking…':'sign in',true)}`
        +`<a href="#" class="acctlink" id="acctagain">send another</a></div>`
        +`<div class="acct-note">it lasts ten minutes. check the spam folder — a first mail from a new sender often lands there.</div>`;
      const go=()=>verifyCode();
      $('acctverify').onclick=go;
      $('acctagain').onclick=e=>{e.preventDefault();acctMode='email';acctErr='';renderAcct()};
      const f=$('acctcode');
      // six digits and it goes, because typing a sixth digit and then hunting
      // for a button is a step that exists only because nobody removed it
      f.oninput=()=>{ f.value=f.value.replace(/\D/g,'').slice(0,6); if(f.value.length===6) go() };
      f.onkeydown=e=>{ if(e.key==='Enter'){e.preventDefault();go()} };
      setTimeout(()=>f&&f.focus(),40);
    }
    return;
  }

  if(!signedIn){ closeAccount(); return }

  /* ---- what to call you, and whether you want the morning line ---- */
  const nick=account.nickname||'';
  const mail=account.email||'';
  const canMail=!!account.mail;

  if(acctMode==='hello'){
    title.textContent='hello';
    body.innerHTML=err
      +`<div class="acct-ask">what do you want to be called?</div>`
      +`<input class="acct-field" id="acctnick" type="text" maxlength="40" autocomplete="nickname"
              placeholder="anything you like" value="${esc(nick)}">`
      +(canMail?`<label class="acct-check"><input type="checkbox" id="acctdaily"${account.dailyEmail?' checked':''}>`
        +`<span>send me the daily · one line each morning when the day's ten are up${
            mail&&account.emailOk?` · to ${esc(mail)}`:''}</span></label>`
        +(mail&&account.emailOk?'':`<input class="acct-field" id="acctaddr" type="email" inputmode="email"
              autocomplete="email" spellcheck="false" placeholder="where to send it" value="${esc(mail)}">`)
      :'')
      +`<div class="acct-row">${acctBtn('acctdone',acctBusy?'saving…':'done',true)}`
      +`<a href="#" class="acctlink" id="acctskip">not now</a></div>`
      +`<div class="acct-note">both are optional and both can change later, from the foot of the record.</div>`;
    $('acctdone').onclick=()=>saveHello();
    $('acctskip').onclick=e=>{e.preventDefault();store.askedDaily=true;save();closeAccount()};
    $('acctnick').onkeydown=e=>{ if(e.key==='Enter'){e.preventDefault();saveHello()} };
    setTimeout(()=>$('acctnick')&&!nick&&$('acctnick').focus(),40);
    return;
  }

  /* ---- everything already chosen, and the way out ---- */
  title.textContent='your account';
  body.innerHTML=err
    +`<div class="acct-ask">what do you want to be called?</div>`
    +`<input class="acct-field" id="acctnick" type="text" maxlength="40" placeholder="anything you like" value="${esc(nick)}">`
    +(canMail
      ? `<label class="acct-check"><input type="checkbox" id="acctdaily"${account.dailyEmail?' checked':''}>`
        +`<span>send me the daily · one line each morning</span></label>`
        +`<input class="acct-field" id="acctaddr" type="email" inputmode="email" spellcheck="false"
                placeholder="where to send it" value="${esc(mail)}">`
        +(mail&&!account.emailOk
          ? `<div class="acct-note">that address is not confirmed yet, so nothing is sent to it.
               <a href="#" class="acctlink" id="acctconfirm" style="margin-left:0">send a code</a></div>`
          : '')
      : `<div class="acct-note">this deployment cannot send mail, so there is no daily to offer.</div>`)
    +`<div class="acct-row">${acctBtn('acctsave',acctBusy?'saving…':'save',true)}</div>`
    +`<div class="acct-foot">`
      +`<a href="#" class="acctlink" id="acctout2">sign out</a>`
      /* the one destructive thing in the game, and it takes two presses. no red
         to lean on — there is none in this palette — so the second press is
         what carries the weight, and it says exactly what it will do. */
      +`<a href="#" class="acctlink last" id="acctdel">${acctArmed?'press again to erase it':'delete account'}</a>`
    +`</div>`
    /* the second press has to say everything it does, and the purchase is the
       half nobody expects — the record is on this browser as well, so losing
       the server's copy costs nothing, and the unlock is not. it is only said
       when there IS one: a warning about a thing you do not own is noise. */
    +(acctArmed?`<div class="acct-note">this erases the record held for you. this browser keeps its own copy, so nothing on this device is lost.`
       +(POLICY.premium?' the full version goes with the account and cannot be restored afterwards.':'')
       +`</div>`:'');
  $('acctsave').onclick=()=>saveHello(true);
  $('acctout2').onclick=e=>{e.preventDefault();closeAccount();doSignOut()};
  $('acctdel').onclick=e=>{e.preventDefault(); if(!acctArmed){acctArmed=true;renderAcct()} else deleteAccount()};
  if($('acctconfirm')) $('acctconfirm').onclick=e=>{
    e.preventDefault(); acctEmail=$('acctaddr').value.trim(); acctMode='email'; renderAcct();
  };
}

async function sendCode(){
  const el=$('acctemail'); if(!el) return;
  acctEmail=el.value.trim().toLowerCase();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(acctEmail)){ acctErr='that address does not look like one'; return renderAcct() }
  acctBusy=true; acctErr=''; renderAcct();
  try{
    await apiCall('/auth/email/code',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({email:acctEmail})});
    acctBusy=false; acctMode='code'; acctErr=''; renderAcct();
  }catch(e){ acctBusy=false; acctErr=e.message; renderAcct() }
}

async function verifyCode(){
  const el=$('acctcode'); if(!el||acctBusy) return;
  const code=el.value.replace(/\D/g,'');
  if(code.length!==6){ acctErr='that code is six digits'; return renderAcct() }
  acctBusy=true; acctErr=''; renderAcct();
  try{
    const me=await apiCall('/auth/email/verify',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({email:acctEmail,code})});
    acctBusy=false; account={...me,signedIn:true,mail:true};
    store.signedInOnce=true; save();
    /* the record comes down before anything else is asked: the point of the
       whole exercise is on the other side of this call. */
    await syncNow(); tellClock();
    acctMode='hello'; acctErr=''; renderAcct();
  }catch(e){ acctBusy=false; acctErr=e.message; renderAcct() }
}

async function saveHello(stay){
  if(acctBusy) return;
  const patch={tzOffset:new Date().getTimezoneOffset()};
  const nick=$('acctnick'); if(nick) patch.nickname=nick.value.trim();
  const addr=$('acctaddr'); const daily=$('acctdaily');
  const wantDaily=!!(daily&&daily.checked);
  const typed=addr?addr.value.trim().toLowerCase():'';
  /* the address goes up FIRST and on its own when it changed, because turning
     the daily on is refused against an address nobody has proved — so the two
     have to be two calls, in that order, with a code in between. */
  acctBusy=true; acctErr=''; renderAcct();
  try{
    if(addr && typed!==(account.email||'')){
      await saveProfile({email:typed});
      if(wantDaily && !account.emailOk){
        acctBusy=false; store.askedDaily=true; save();
        acctEmail=typed; acctMode='email';
        acctErr='one code to that address and the daily is on';
        return renderAcct();
      }
    }
    if(daily) patch.dailyEmail=wantDaily;
    await saveProfile(patch);
    store.askedDaily=true; save();
    acctBusy=false;
    if(stay){ acctErr=''; renderAcct(); toast('saved') }
    else closeAccount();
  }catch(e){ acctBusy=false; acctErr=e.message; renderAcct() }
}

async function deleteAccount(){
  acctBusy=true; renderAcct();
  try{ await apiCall('/account',{method:'DELETE'}) }catch(e){}
  acctBusy=false; acctArmed=false;
  account={signedIn:false}; syncSay='';
  delete store.signedInOnce; delete store.askedDaily;
  /* the entitlement went with the account, which the second press said it
     would, so the flag goes here too — leaving it on would give this browser a
     full version the server has never heard of, and the first sync of the next
     account somebody signs into would take it away with no explanation. the
     code is gone too: it belonged to an order that no longer names anybody. */
  POLICY.premium=false; save();
  acct={}; saveAcct();
  entitlementChanged();
  closeAccount();
  toast('erased · this device keeps its own record');
}

/* a tab going away is the last chance to send a run that finished seconds ago
   and is still sitting inside the three-second debounce. `keepalive` is what
   lets it outlive the page; nothing reads the answer, so nothing waits. */
addEventListener('pagehide',()=>{
  if(!API||!account||!account.signedIn||!navigator.sendBeacon) return;
  clearTimeout(syncTimer);
  try{
