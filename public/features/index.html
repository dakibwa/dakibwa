let members=[],threads=[],builtFor=-1,initialCross=1,spec=null,netPairs=[];

function lanePar(){
  const n=Math.max(1,threads.length-1);
  const laneY=t=>BH*.09+threads.indexOf(t)*(BH*.82/n);
  const band=(BH*.82/n)/2;
  let out=0;
  members.forEach(m=>{
    if(m.threads.length>1) return;            // shared neurons are counted below
    if(Math.abs(m.y0-laneY(m.threads[0]))>band) out++;
  });
  return Math.max(3,out+spec.shared);
}

const FAM_SEP=64;          // the clearance a *composition* wants, not the 38 that stops overlap

function segList(len, chord){
  const s=[];
  for(let i=0;i<len-1;i++) s.push([i,i+1]);
  if(chord) s.push(chord);
  return s;
}
function famCrossFree(polys,chords){
  for(let i=0;i<polys.length;i++){
    const A=polys[i], SA=segList(A.length, chords&&chords[i]);
    for(let a=0;a<SA.length;a++)for(let b=a+1;b<SA.length;b++){
      const p1=A[SA[a][0]],p2=A[SA[a][1]],q1=A[SA[b][0]],q2=A[SA[b][1]];
      if(p1===q1||p1===q2||p2===q1||p2===q2)continue;
      if(segX(p1,p2,q1,q2))return false;
    }
    for(let j=i+1;j<polys.length;j++){
      const B=polys[j], SB=segList(B.length, chords&&chords[j]);
      for(let a=0;a<SA.length;a++)for(let b=0;b<SB.length;b++){
        const p1=A[SA[a][0]],p2=A[SA[a][1]],q1=B[SB[b][0]],q2=B[SB[b][1]];
        if(p1===q1||p1===q2||p2===q1||p2===q2)continue;
        if(segX(p1,p2,q1,q2))return false;
      }
    }
  }
  return true;
}
function segDist(p,a,b){
  const vx=b.x-a.x, vy=b.y-a.y, L=vx*vx+vy*vy;
  let t=L?((p.x-a.x)*vx+(p.y-a.y)*vy)/L:0;
  t=Math.max(0,Math.min(1,t));
  return Math.hypot(p.x-(a.x+vx*t), p.y-(a.y+vy*t));
}

const RINGBOX={x0:70,x1:970,y0:60,y1:520,r:150};
function trackLen(){const B=RINGBOX;return 2*((B.x1-B.x0)-2*B.r)+2*((B.y1-B.y0)-2*B.r)+2*Math.PI*B.r}
function trackPt(u){
  const B=RINGBOX, lx=(B.x1-B.x0)-2*B.r, ly=(B.y1-B.y0)-2*B.r, q=Math.PI/2*B.r, P=trackLen();
  u=((u%P)+P)%P;
  const arc=(cx,cy,a0)=>{const a=a0+(u/B.r);return{x:cx+Math.cos(a)*B.r,y:cy+Math.sin(a)*B.r}};
  if(u<lx) return {x:B.x0+B.r+u, y:B.y0};                       u-=lx;
  if(u<q)  return arc(B.x1-B.r,B.y0+B.r,-Math.PI/2);            u-=q;
  if(u<ly) return {x:B.x1, y:B.y0+B.r+u};                       u-=ly;
  if(u<q)  return arc(B.x1-B.r,B.y1-B.r,0);                     u-=q;
  if(u<lx) return {x:B.x1-B.r-u, y:B.y1};                       u-=lx;
  if(u<q)  return arc(B.x0+B.r,B.y1-B.r,Math.PI/2);             u-=q;
  if(u<ly) return {x:B.x0, y:B.y1-B.r-u};                       u-=ly;
  return arc(B.x0+B.r,B.y0+B.r,Math.PI);
}

const FAMILIES={

  layered:{ minT:2, minL:3, cyc:3, slots(T,L,tut){
    const x0=BW*.10,x1=BW*.90,ytop=tut?BH*.46:BH*.14,ybot=BH*.88,s=[],g=[];
    for(let k=0;k<T;k++){s[k]=[];g[k]=[];for(let i=0;i<L;i++){
      s[k][i]={x:x0+(x1-x0)*(L>1?i/(L-1):.5), y:ytop+(ybot-ytop)*(T>1?k/(T-1):.5)};
      g[k][i]='c'+i;
    }}
    return {s,g};
  }},

  hourglass:{ minT:2, minL:4, cyc:3, slots(T,L){
    const x0=BW*.10,x1=BW*.90,ytop=BH*.12,ybot=BH*.90,mid=(ytop+ybot)/2;
    const full=(ybot-ytop)/Math.max(1,T-1);
    const waist=Math.max(.42, FAM_SEP/full);
    const s=[],g=[];
    for(let k=0;k<T;k++){s[k]=[];g[k]=[];for(let i=0;i<L;i++){
      const u=L>1?Math.abs(2*i/(L-1)-1):1;                 // 0 at the waist, 1 at the ends
      const step=full*(waist+(1-waist)*Math.pow(u,1.35));
      s[k][i]={x:x0+(x1-x0)*(L>1?i/(L-1):.5), y:mid+(k-(T-1)/2)*step};
      g[k][i]='c'+i;
    }}
    return {s,g};
  }},

  residual:{ minT:2, minL:5, cyc:3, slots(T,L,tut,rnd){
    const span=L+(L>=6?2:1);
    const x0=BW*.08,x1=BW*.92,ytop=BH*.13,ybot=BH*.89;
    const X=i=>x0+(x1-x0)*(span>1?i/(span-1):.5), Y=k=>ytop+(ybot-ytop)*(T>1?k/(T-1):.5);
    const s=[],g=[];
    for(let k=0;k<T;k++){
      const want=span-L, drop=new Set();
      for(let q=0;q<24 && drop.size<want;q++) drop.add(1+Math.floor(rnd()*(span-2)));
      const keep=[]; for(let i=0;i<span;i++) if(!drop.has(i)) keep.push(i);
      s[k]=keep.map(i=>({x:X(i),y:Y(k)}));
      g[k]=keep.map(i=>'c'+i);
    }
    return {s,g};
  }},

  lattice:{ minT:2, minL:3, cyc:4, slots(T,L){
    const cell=Math.min(820/Math.max(1,L-1), 450/Math.max(1,T-1), 175);
    const cx=BW/2, cy=BH/2, s=[], g=[];
    for(let k=0;k<T;k++){s[k]=[];g[k]=[];for(let i=0;i<L;i++){
      s[k][i]={x:cx+(i-(L-1)/2)*cell, y:cy+(k-(T-1)/2)*cell};
      g[k][i]='all';
    }}
    return {s,g};
  }},

  fan:{ minT:3, minL:3, cyc:3, local:true, slots(T,L){
    const hx=BW/2, hy=700, A=44*Math.PI/180, r0=200, r1=660, s=[], g=[];
    for(let k=0;k<T;k++){
      const th=T>1?(-A+2*A*k/(T-1)):0;
      s[k]=[];g[k]=[];
      for(let i=0;i<L;i++){
        const r=r0+(r1-r0)*(L>1?i/(L-1):.5);
        s[k][i]={x:hx+Math.sin(th)*r, y:hy-Math.cos(th)*r};
        g[k][i]='r'+i;
      }
    }
    return {s,g};
  }},

  arcs:{ minT:2, minL:3, cyc:3, local:true, slots(T,L){
    const hx=BW/2, hy=600, r1=540;
    const S=Math.min(130, 44*Math.max(1,L-1))*Math.PI/180;
    const r0=Math.max(r1*.5, FAM_SEP*Math.max(1,L-1)/S);
    const s=[],g=[];
    for(let k=0;k<T;k++){
      const r=r0+(r1-r0)*(T>1?k/(T-1):.5);
      s[k]=[];g[k]=[];
      for(let i=0;i<L;i++){
        const p=-S/2+S*(L>1?i/(L-1):.5);
        s[k][i]={x:hx+Math.sin(p)*r, y:hy-Math.cos(p)*r};
        g[k][i]='a'+i;
      }
    }
    return {s,g};
  }},

  ring:{ minT:2, minL:3, cyc:4, slots(T,L,tut,rnd){
    const P=trackLen(), N=T*L, u0=rnd()*P, s=[], g=[];
    for(let k=0;k<T;k++){
      s[k]=[];g[k]=[];
      for(let i=0;i<L;i++){
        s[k][i]=trackPt(u0+P*(k*L+i)/N);
        g[k][i]='ring';
      }
    }
    return {s,g};
  }}
};

const FAM_LIST=['layered','arcs','hourglass','lattice','ring','fan','residual'];
const FAM_FROM={layered:0, arcs:1, hourglass:1, lattice:2, ring:3, fan:4, residual:5};
const FAM_UNTIL={ring:8, fan:8};
let _famDay=null,_famSeq=null;
function famSeq(day){
  if(_famDay===day) return _famSeq;
  const rnd=mulberry32(fnv(day+':layout')), seq=[], used={};
  const rules=genRules(genFor(day));
  for(let i=0;i<32;i++){
    const s=netSpec(i,rules), T=s.threads, L=Math.max(3,s.nodes);
    const all=FAM_LIST.filter(f=>FAM_FROM[f]<=i && i<=(FAM_UNTIL[f]??99)
                                 && T>=FAMILIES[f].minT && L>=FAMILIES[f].minL);
    let pool=all.filter(f=>f!==seq[i-1] && (i>=10 || (used[f]||0)<2));
    if(pool.length<2) pool=all.filter(f=>i>=10 || (used[f]||0)<2);
    if(!pool.length) pool=all;
    const f=pool[Math.floor(rnd()*pool.length)];
    seq.push(f); used[f]=(used[f]||0)+1;
  }
  _famDay=day; _famSeq=seq;
  return seq;
}
const famFor=(day,i)=>famSeq(day)[Math.min(i,31)];

const FAM_PAR=[3,4,5,6,7,8,10,11,13,15];
const famTarget=i=>i<FAM_PAR.length?FAM_PAR[i]:15+Math.floor((i-9)*1.5);

const WEAVES={
  twist:  (i,L,a)=> a*i,
  chevron:(i,L,a)=> a*(i<=(L-1)/2 ? i : L-1-i),
  wave:   (i,L,a)=> Math.round(a*Math.sin(2*Math.PI*i/Math.max(1,L-1))*1.5),
  plait:  (i,L,a)=> a*(i%2)
};
const WEAVE_LIST=['twist','chevron','wave','plait'];
function famWeave(order, name, amp){
  const f=WEAVES[name]; if(!f||!amp) return;
  const L=Math.max(...order.map(o=>o.length));
  const placed=new Set();
  for(let i=0;i<L;i++){
    const seats=[];
    for(let k=0;k<order.length;k++){
      const n=order[k][i];
      if(n && !n.pinned && !placed.has(n) && !seats.includes(n)) seats.push(n);
    }
    if(seats.length<2) continue;
    seats.forEach(n=>placed.add(n));
    const home=seats.map(n=>({x:n.x, y:n.y}));
    const S=seats.length, sh=((Math.round(f(i,L,amp))%S)+S)%S;
    if(!sh) continue;
    seats.forEach((n,j)=>{ n.x=home[(j+sh)%S].x; n.y=home[(j+sh)%S].y });
  }
}
function famStep(live,cyc,local,rnd){
  const byG=new Map();
  live.forEach(n=>{if(n.pinned)return;
                   const a=byG.get(n.gid)||[]; a.push(n); byG.set(n.gid,a)});
  const gids=[...byG.keys()].sort();
  gids.forEach(g=>byG.get(g).sort((a,b)=>a.oi-b.oi));
  const runs=(arr,k)=>{
    const out=[];
    for(let s=0;s+k<=arr.length;s++){
      let ok=true; for(let j=0;j<k;j++) if(arr[s+j].moved){ok=false;break}
      if(ok) out.push(s);
    }
    return out;
  };
  const usable=gids.filter(g=>{
    const arr=byG.get(g);
    return local ? runs(arr,2).length>0 : arr.filter(n=>!n.moved).length>=2;
  });
  if(!usable.length) return null;
  const arr=byG.get(usable[Math.floor(rnd()*usable.length)]);
  const free=arr.filter(n=>!n.moved);
  const want=Math.min(2+Math.floor(rnd()*Math.max(1,cyc-1)), free.length);
  let pick=null;
  if(local){
    for(let k=want;k>=2 && !pick;k--){
      const r=runs(arr,k);
      if(r.length){ const s=r[Math.floor(rnd()*r.length)]; pick=arr.slice(s,s+k) }
    }
  } else {
    const p=free.slice(); pick=[];
    for(let j=0;j<want;j++) pick.push(p.splice(Math.floor(rnd()*p.length),1)[0]);
  }
  if(!pick||pick.length<2) return null;
  const px=pick.map(n=>n.x), py=pick.map(n=>n.y), k=pick.length;
  pick.forEach((n,j)=>{n.x=px[(j+1)%k]; n.y=py[(j+1)%k]; n.moved=true});
  return {pick, px, py};
}

function famChord(fig, chords, k){
  const o=fig[k], n=o.length;
  if(n<3) return null;
  const cand=[];
  for(let j=2;j<n;j++) cand.push([0,j]);           // the head tied back in
  for(let i=n-3;i>=1;i--) cand.push([i,n-1]);      // the tail tied back in
  cand.sort((p,q)=>{
    const sp=p[1]-p[0], sq=q[1]-q[0];
    return (sp===n-1?1:0)-(sq===n-1?1:0) || sq-sp || p[0]-q[0];
  });
  for(const c of cand){
    const A=o[c[0]], B=o[c[1]];
    let ok=true;
    for(let i=0;i<fig.length && ok;i++) for(const p of fig[i]){
      if(p===A||p===B) continue;
      if(segDist(p,A,B)<MIN_SEP){ ok=false; break }
    }
    for(let i=0;i<fig.length && ok;i++){
      const P=fig[i], S=segList(P.length, chords[i]);
      for(const [u,v] of S){
        const q1=P[u], q2=P[v];
        if(q1===A||q1===B||q2===A||q2===B) continue;
        if(segX(A,B,q1,q2)){ ok=false; break }
      }
    }
    if(ok) return c;
  }
  return null;
}

const CHORD_FROM=2, CHORD_OPEN=1;
const famCeil=want=>Math.round(want*1.8)+2;
function famPlan(fam,T,L,shared,pinned,want,tut,rnd,idx){
  const F=FAMILIES[fam];
  if(!F || T<F.minT || L<F.minL) return null;
  const xCap = GEN_RULES.dense==='cap' ? famCeil(want) : Infinity;
  const {s,g}=F.slots(T,L,tut,rnd);
  const nodes=[], order=[];
  for(let k=0;k<T;k++){
    if(!s[k] || s[k].length<2) return null;
    order[k]=[];
    for(let i=0;i<s[k].length;i++){
      const n={hx:s[k][i].x, hy:s[k][i].y, x:s[k][i].x, y:s[k][i].y, oi:k,
               gid:g[k][i], t:[k], pinned:false, merged:false, gone:false, alt:null};
      nodes.push(n); order[k].push(n);
    }
  }
  let minSep=Infinity;
  for(let a=0;a<nodes.length;a++){
    const A=nodes[a];
    if(Math.abs(clampX(A.hx)-A.hx)>.5 || Math.abs(clampY(A.hy)-A.hy)>.5) return null;
    for(let b=a+1;b<nodes.length;b++)
      minSep=Math.min(minSep, Math.hypot(A.hx-nodes[b].hx, A.hy-nodes[b].hy));
  }
  if(minSep<FAM_SEP) return null;
  if(!famCrossFree(order.map(o=>o.map(n=>({x:n.hx,y:n.hy}))))) return null;

  const pairs=[];
  for(let a=0;a<nodes.length;a++)for(let b=a+1;b<nodes.length;b++){
    if(nodes[a].t[0]===nodes[b].t[0]) continue;      // one thread cannot superpose with itself
    pairs.push([Math.hypot(nodes[a].hx-nodes[b].hx, nodes[a].hy-nodes[b].hy), nodes[a], nodes[b]]);
  }
  const tight=pairs.length?Math.min(...pairs.map(p=>p[0])):0;
  let merges=0;
  const bands = GEN_RULES.merge==='widen' ? [1.35,2,3,6,Infinity] : [1.35];
  for(const w of bands){
    if(merges>=shared) break;
    const near=pairs.filter(p=>p[0]<=tight*w).map(p=>[p[1],p[2]]);
    for(let i=near.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[near[i],near[j]]=[near[j],near[i]]}
    for(const [A,B] of near){
      if(merges>=shared) break;
      if(A.gone||B.gone||A.merged||B.merged) continue;
      const ka=A.t[0], kb=B.t[0];
      if(ka===kb) continue;
      if(order[ka].includes(B) || order[kb].includes(A)) continue;
      order[kb][order[kb].indexOf(B)]=A;
      A.t.push(kb); A.merged=true; A.alt={x:B.hx,y:B.hy};
      B.gone=true; merges++;
    }
  }

  let chords=null;
  if(GEN_RULES.chord==='one' || GEN_RULES.chord==='late'){
    const fin=order.map((o,k)=>o.map(n=>
      (n.merged && n.t[1]===k && n.alt) ? {x:n.alt.x, y:n.alt.y}
                                        : {x:n.hx, y:n.hy}));
    chords=order.map(()=>null);
    const room = (GEN_RULES.chord==='late' && idx!=null && idx<CHORD_FROM) ? CHORD_OPEN : order.length;
    let put=0;
    for(let k=0;k<order.length;k++){
      if(put>=room) break;
      chords[k]=famChord(fin, chords, k);
      if(chords[k]) put++;
    }
    if(!chords.some(c=>c) || !famCrossFree(fin, chords)) chords=null;
  }
  const live=nodes.filter(n=>!n.gone);

  for(let p=0;p<pinned;p++){
    const k=p%T;
    let cands=order[k].filter(n=>!n.pinned && !n.merged);
    if(!cands.length && GEN_RULES.pinFill) cands=live.filter(n=>!n.pinned && !n.merged);
    if(!cands.length) continue;
    cands[Math.floor(rnd()*cands.length)].pinned=true;
  }

  live.forEach(n=>n.moved=false);
  const plan={fam, nodes:live, order, chords, d:0, merges, minSep, par:0, x:0};


  if(GEN_RULES.weave==='pattern' && T>=3){
    const home=live.map(n=>({n, x:n.x, y:n.y}));
    const restore=()=>home.forEach(h=>{h.n.x=h.x; h.n.y=h.y});
    let best=null;
    const off=Math.floor(rnd()*WEAVE_LIST.length);
    for(let w=0;w<WEAVE_LIST.length;w++){
      const name=WEAVE_LIST[(w+off)%WEAVE_LIST.length];
      for(let amp=1;amp<=3;amp++){
        restore();
        famWeave(order, name, amp);
        const priced=famCost(plan), x=famX(plan);
        if(x>xCap) continue;
        if(!best || priced>best.par || (priced===best.par && x>best.x))
          best={name, amp, par:priced, x};
      }
    }
    restore();
    if(best){
      const bare=famCost(plan);
      if(best.par>bare || (best.par===bare && best.x>famX(plan))){
        famWeave(order, best.name, best.amp);
        plan.weave=best.name; plan.amp=best.amp;
        plan.d=live.filter(n=>Math.hypot(n.x-n.hx,n.y-n.hy)>.5).length;
      }
    }
  }

  plan.par=famCost(plan); plan.x=famX(plan);
  for(let miss=0; plan.par<want && miss<26; ){
    const st=famStep(live, F.cyc||3, !!F.local, rnd);
    if(!st) break;
    const priced=famCost(plan), x=famX(plan);
    const holdsX = GEN_RULES.weave!=='pattern' || x>=plan.x;
    if((priced>plan.par || (priced===plan.par && x>plan.x)) && holdsX && x<=xCap){
      if(priced>plan.par) miss=0;
      plan.par=priced; plan.x=x; plan.d+=st.pick.length;
    } else {
      st.pick.forEach((n,j)=>{n.x=st.px[j]; n.y=st.py[j]; n.moved=false});
      miss++;
    }
  }
  if(GEN_RULES.parMode==='greedy'){
    plan.par=famGreedy(plan).actions;
    for(let miss=0; plan.par<want && miss<20; ){
      const st=famStep(live, F.cyc||3, !!F.local, rnd);
      if(!st) break;
      const priced=famGreedy(plan).actions, x=famX(plan);
      const holdsX = GEN_RULES.weave!=='pattern' || x>=plan.x;
      if((priced>plan.par || (priced===plan.par && x>plan.x)) && holdsX && x<=xCap){
        if(priced>plan.par) miss=0;
        plan.par=priced; plan.x=x; plan.d+=st.pick.length;
      } else {
        st.pick.forEach((n,j)=>{n.x=st.px[j]; n.y=st.py[j]; n.moved=false});
        miss++;
      }
    }
  }
  plan.route=plan.par;
  plan.par=Math.max(3, plan.par + (GEN_RULES.parSlack||0));
  return plan;
}

function planSegs(plan){
  return plan.order.map((o,k)=>segList(o.length, plan.chords&&plan.chords[k]));
}
function famX(plan){
  const at=new Map(); plan.nodes.forEach((n,i)=>at.set(n,i));
  const P=plan.nodes.map(n=>({x:clampX(n.x), y:clampY(n.y)}));
  const seq=plan.order.map(o=>o.map(n=>P[at.get(n)]));
  const S=planSegs(plan), self=GEN_RULES.selfX==='count';
  let n=0;
  for(let a=0;a<seq.length;a++){
    const A=seq[a], SA=S[a];
    if(self) for(let p=0;p<SA.length;p++)for(let q=p+1;q<SA.length;q++){
      const p1=A[SA[p][0]],p2=A[SA[p][1]],q1=A[SA[q][0]],q2=A[SA[q][1]];
      if(p1===q1||p1===q2||p2===q1||p2===q2)continue;
      if(segX(p1,p2,q1,q2)) n++;
    }
    for(let b=a+1;b<seq.length;b++){
      const B=seq[b], SB=S[b];
      for(let p=0;p<SA.length;p++)for(let q=0;q<SB.length;q++){
        const p1=A[SA[p][0]],p2=A[SA[p][1]],q1=B[SB[q][0]],q2=B[SB[q][1]];
        if(p1===q1||p1===q2||p2===q1||p2===q2)continue;
        if(segX(p1,p2,q1,q2)) n++;
      }
    }
  }
  return n;
}


function famProbe(seq,T,pa,pb,S){
  const self=GEN_RULES.selfX==='count';
  return (A,B)=>{
    pa.x=A.x; pa.y=A.y; pb.x=B.x; pb.y=B.y;
    const c=new Array(T).fill(0);
    for(let a=0;a<T;a++){
      const U=seq[a], SU=S[a];
      if(self) for(let p=0;p<SU.length;p++)for(let q=p+1;q<SU.length;q++){
        const p1=U[SU[p][0]],p2=U[SU[p][1]],q1=U[SU[q][0]],q2=U[SU[q][1]];
        if(p1===q1||p1===q2||p2===q1||p2===q2)continue;
        if(segX(p1,p2,q1,q2)) c[a]+=2;
      }
      for(let b=a+1;b<T;b++){
        const V=seq[b], SV=S[b];
        for(let p=0;p<SU.length;p++)for(let q=0;q<SV.length;q++){
          const p1=U[SU[p][0]],p2=U[SU[p][1]],q1=V[SV[q][0]],q2=V[SV[q][1]];
          if(p1===q1||p1===q2||p2===q1||p2===q2)continue;
          if(segX(p1,p2,q1,q2)){c[a]++;c[b]++}
        }
      }
    }
    let x=0,f=0;
    for(let a=0;a<T;a++){ x+=c[a]; if(!c[a] && !seq[a].some(n=>n.merged)) f++ }
    return {x:x/2, f};
  };
}
function famCost(plan){
  const at=new Map(); plan.nodes.forEach((n,i)=>at.set(n,i));
  const T=plan.order.length;
  const P=plan.nodes.map((n,i)=>({x:clampX(n.x), y:clampY(n.y), hx:n.hx, hy:n.hy,
                                  merged:n.merged, alt:n.alt, t:n.t.slice(),
                                  pinned:n.pinned, i}));
  const seq=plan.order.map(o=>o.map(n=>P[at.get(n)]));
  const S=planSegs(plan);
  const all=P.slice();
  let moves=0;
  const step=()=>{ moves++ };
  P.forEach(p=>{
    if(!p.merged) return;
    const kb=p.t[1], j=seq[kb].indexOf(p);
    const half={x:p.x, y:p.y, hx:p.alt?p.alt.x:null,
                hy:p.alt?p.alt.y:null, merged:false, t:[kb], i:1000+p.i};
    if(j>=0) seq[kb][j]=half;
    p.merged=false; p.t=[p.t[0]];
    const put=splitPlace(p.i, p.x, p.y, j>=0?famProbe(seq,T,p,half,S):null);
    p.x=put.a.x; p.y=put.a.y; half.x=put.b.x; half.y=put.b.y;
    all.push(half);
    step();
  });
  all.forEach(p=>{
    if(p.pinned || p.hx==null) return;
    if(Math.hypot(p.x-p.hx, p.y-p.hy)<=MIN_SEP*.7) return;
    p.x=clampX(p.hx); p.y=clampY(p.hy);
    step();
  });
  return moves;      // the floor that keeps par sane lives at the call site,
}                    // so the scramble loop can see a genuinely cheap board

function famGreedy(plan){
  const at=new Map(); plan.nodes.forEach((n,i)=>at.set(n,i));
  const T=plan.order.length;
  const P=plan.nodes.map((n,i)=>({x:clampX(n.x), y:clampY(n.y), hx:n.hx, hy:n.hy,
                                  merged:n.merged, alt:n.alt, t:n.t.slice(),
                                  pinned:n.pinned, i}));
  const seq=plan.order.map(o=>o.map(n=>P[at.get(n)]));
  const S=planSegs(plan), self=GEN_RULES.selfX==='count';
  const all=P.slice();
  const X=()=>{
    let c=0;
    for(let a=0;a<T;a++){
      const A=seq[a], SA=S[a];
      if(self) for(let p=0;p<SA.length;p++)for(let q=p+1;q<SA.length;q++){
        const p1=A[SA[p][0]],p2=A[SA[p][1]],q1=A[SA[q][0]],q2=A[SA[q][1]];
        if(p1===q1||p1===q2||p2===q1||p2===q2)continue;
        if(segX(p1,p2,q1,q2)) c++;
      }
      for(let b=a+1;b<T;b++){
        const B=seq[b], SB=S[b];
        for(let p=0;p<SA.length;p++)for(let q=0;q<SB.length;q++){
          const p1=A[SA[p][0]],p2=A[SA[p][1]],q1=B[SB[q][0]],q2=B[SB[q][1]];
          if(p1===q1||p1===q2||p2===q1||p2===q2)continue;
          if(segX(p1,p2,q1,q2)) c++;
        }
      }
    }
    return c;
  };
  const adrift=p=>!p.pinned && p.hx!=null && Math.hypot(p.x-p.hx,p.y-p.hy)>MIN_SEP*.7;
  const log=[]; let actions=0;
  for(let guard=0; guard<200; guard++){
    const shared=all.filter(p=>p.merged);
    const now=X();
    if(now===0 && !shared.length) break;
    let best=null;
    for(const p of all){
      if(p.merged || !adrift(p)) continue;
      const ox=p.x, oy=p.y;
      p.x=clampX(p.hx); p.y=clampY(p.hy);
      const s=X();
      p.x=ox; p.y=oy;
      if(!best || s<best.s) best={s, p, kind:'drag'};
    }
    if(shared.length && (!best || best.s>=now)) best={s:now-1, p:shared[0], kind:'split'};
    if(!best) break;
    if(best.kind==='drag'){
      best.p.x=clampX(best.p.hx); best.p.y=clampY(best.p.hy);
      log.push(['drag', best.p.i]);
    } else {
      const p=best.p;
      const kb=p.t[1], j=seq[kb].indexOf(p);
      const half={x:p.x, y:p.y, hx:p.alt?p.alt.x:null,
                  hy:p.alt?p.alt.y:null, merged:false, t:[kb], i:1000+p.i};
      if(j>=0) seq[kb][j]=half;
      p.merged=false; p.t=[p.t[0]];
      const put=splitPlace(p.i, p.x, p.y, j>=0?famProbe(seq,T,p,half,S):null);
      p.x=put.a.x; p.y=put.a.y; half.x=put.b.x; half.y=put.b.y;
      all.push(half);
      log.push(['split', p.i]);
    }
    actions++;
  }
  if(GEN_RULES.selfX==='count') for(let guard=0; guard<200 && X()>0; guard++){
    const p=all.find(q=>!q.pinned && q.hx!=null &&
                        (q.x!==clampX(q.hx) || q.y!==clampY(q.hy)));
    if(!p) break;
    p.x=clampX(p.hx); p.y=clampY(p.hy);
    log.push(['drag', p.i]);
    actions++;
  }
  return {actions, log, left:X()};
}

const MIN_SEP=38;
function separateNodes(min=MIN_SEP){
  for(let pass=0;pass<24;pass++){
    let moved=false;
    for(let a=0;a<members.length;a++)for(let b=a+1;b<members.length;b++){
      const A=members[a], B=members[b];
      let dx=B.x0-A.x0, dy=B.y0-A.y0, d=Math.hypot(dx,dy);
      if(d>=min) continue;
      if(d<1e-6){dx=1;dy=0;d=1}                 // coincident: part along a fixed axis
      const ux=dx/d, uy=dy/d, push=(min-d)/2+.5;
      if(A.pinned&&B.pinned) continue;          // the pin loop refuses to make these
      if(A.pinned){ B.x0=clampX(B.x0+ux*push*2); B.y0=clampY(B.y0+uy*push*2) }
      else if(B.pinned){ A.x0=clampX(A.x0-ux*push*2); A.y0=clampY(A.y0-uy*push*2) }
      else { A.x0=clampX(A.x0-ux*push); A.y0=clampY(A.y0-uy*push);
             B.x0=clampX(B.x0+ux*push); B.y0=clampY(B.y0+uy*push) }
      moved=true;
    }
    if(!moved) break;
  }
  members.forEach(n=>{n.xv=n.xr=n.x0; n.yv=n.yr=n.y0});
}

let portrait=false;
function wantsPortrait(){

}
function applyOrientation(force){
  const p=wantsPortrait();

  portrait=p;

function publishPlateInset(){
  const f=$('field'), s=$('netsvg');
  if(!f || !s) return;
  const vb=s.viewBox.baseVal, sr=s.getBoundingClientRect(), fr=f.getBoundingClientRect();
  if(!vb || !vb.width || !vb.height || !sr.width || !sr.height) return;
  const k=Math.min(sr.width/vb.width, sr.height/vb.height);
  const padR=fr.left+f.clientLeft+f.clientWidth, padB=fr.top+f.clientTop+f.clientHeight;
  const plateR=sr.left+(sr.width+vb.width*k)/2, plateB=sr.top+(sr.height+vb.height*k)/2;
  f.style.setProperty('--plate-x', Math.max(0,padR-plateR).toFixed(2)+'px');
  f.style.setProperty('--plate-y', Math.max(0,padB-plateB).toFixed(2)+'px');
}

function buildNet(force){

  let bestSalt=39, bestMiss=Infinity, accepted=false;
  for(let pass=0;pass<2;pass++){
  const forced=pass===1?bestSalt:-1;
  for(let salt=0;salt<40;salt++){

    const rnd=mulberry32(fnv(seedKey+':net:'+idx+':'+salt));
    members=[];
    threads=chosen.map((k,i)=>{
      const strength=1+(fnv(R().day+':str:'+idx+':'+k)%3);   // 1 faint, 2 clear, 3 dominant
      return {key:k,def:FEATURES[k],col:THREADPAL[i%THREADPAL.length],
              strength, nodeCount:spec.nodes+(strength-1),
              width:4.5,
              nodes:[],freed:false,crossings:0};
    });
    let ok=true;
    const tut=inTutorialRun() && R().netIndex<TUTNETS.length;

    const layered=()=>{
      const L=Math.max(3,spec.nodes);                     // columns
      const T=threads.length;
      const R0=T+(spec.shared>0?0:1);                     // slots per column
      const x0=BW*.10, x1=BW*.90, ytop=tut?BH*.46:BH*.14, ybot=BH*.88;
      const colX=i=>x0+(x1-x0)*(L===1?0:i/(L-1));
      const rowY=r=>ytop+(ybot-ytop)*(R0===1?.5:r/(R0-1));
      const orders=[];
      for(let c=0;c<L;c++){
        const o=[...Array(T).keys()];
        if(c>0) for(let i=o.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[o[i],o[j]]=[o[j],o[i]]}
        orders.push(o);
      }
      const sharedCols=[];
      for(let k=0;k<spec.shared && L>2;k++) sharedCols.push(1+Math.floor(rnd()*(L-2)));
      const grid=[];
      for(let c=0;c<L;c++){
        grid[c]=[];

        const topY=mid-step*(seats.length-1)/2;

function featureShape(k,n){
  const fig=FIGURES[k];
  if(fig && fig.n===n) return fig.p;
  const key=k+':'+n; if(key in _shapeCache) return _shapeCache[key];
  if(!_shapeSVG){
    _shapeSVG=document.createElementNS('http://www.w3.org/2000/svg','svg');
    _shapeSVG.setAttribute('viewBox','0 0 96 96');
    _shapeSVG.style.cssText='position:absolute;left:-9999px;width:96px;height:96px';
    document.body.appendChild(_shapeSVG);
  }
  _shapeSVG.innerHTML='<g>'+FEATURES[k].p+'</g>';
  let e=null,L=0;
  for(const el of _shapeSVG.firstChild.children){
    let l=0; try{ l=el.getTotalLength() }catch(err){ l=0 }
    if(l>4){ e=el; L=l; break }
  }
  if(!e||n<2) return (_shapeCache[key]=null);
  const at=t=>{const p=e.getPointAtLength(t);return [p.x,p.y]};
  const a=at(0), z=at(L);
  const closed=Math.hypot(a[0]-z[0],a[1]-z[1])<0.75;
  const M=Math.max(96,n*12);
  const dense=[];
  for(let i=0;i<M;i++) dense.push(at(L*i/(closed?M:M-1)));
  const tri=(i,arr)=>{
    const m=arr.length, p=arr[(i-1+m)%m], q=arr[i], r=arr[(i+1)%m];
    return Math.abs((q[0]-p[0])*(r[1]-p[1])-(r[0]-p[0])*(q[1]-p[1]));
  };
  let pts=dense;
  while(pts.length>n){
    let bi=closed?0:1, bv=Infinity;
    for(let i=closed?0:1;i<(closed?pts.length:pts.length-1);i++){
      const v=tri(i,pts); if(v<bv){ bv=v; bi=i }
    }
    pts=pts.slice(0,bi).concat(pts.slice(bi+1));
  }
  if(closed && pts.length>2){
    let bi=0, bl=Infinity;
    for(let i=0;i<pts.length;i++){
      const p=pts[i], q=pts[(i+1)%pts.length];
      const d=Math.hypot(p[0]-q[0],p[1]-q[1]);

}

        if(p1===n3||p1===n4||p2===n3||p2===n4) continue;
        if(segX(P(p1),P(p2),P(n3),P(n4))) c++;

function crossingsIfMoved(n,nx,ny,base){
  const ox=n.x0, oy=n.y0;
  const before=incidentCross(n);
  n.x0=nx; n.y0=ny;
  const after=incidentCross(n);
  n.x0=ox; n.y0=oy;
  return base-before+after;
}

  if(idle<1200) return;           // pause while the player is actively working
  if(descentStalledAt===idleAt) return;
  const base=countCross().total;
  if(base===0) return;
  const spin=Math.floor(Math.random()*DESCENT_ANGLES);
  const searchIn=nodes=>{
    for(const rad of DESCENT_RADII){
      for(const n of nodes){
        if(n.pinned||n.threads.every(t=>t.freed)) continue;

          const nx=clampX(n.x0+Math.cos(th)*rad);

  const best = (worst && searchIn(worst.nodes))
            || searchIn(members.filter(n=>!n.pinned&&!n.threads.every(t=>t.freed)));

  settlingNode=best.n; settlingNode.el.classList.add('settling');

             t0:performance.now(), dur:DESCENT_GLIDE};

  threads.filter(t=>!t.freed&&canFree(t)).forEach(t=>{freeThread(t,false);r.freed.push(t.key)});

function tutCross(sub,want){
  const pt=n=>(sub&&n===sub.n)?{x:sub.x,y:sub.y}:{x:n.x0,y:n.y0};
  const act=threads.filter(t=>!t.freed);
  const per=act.map(()=>0);
  let total=0; const mine=[];
  for(let i=0;i<act.length;i++)for(let j=i+1;j<act.length;j++){
    const A=act[i],B=act[j];
    for(let a=0;a<A.nodes.length-1;a++)for(let b=0;b<B.nodes.length-1;b++){
      const n1=A.nodes[a],n2=A.nodes[a+1],n3=B.nodes[b],n4=B.nodes[b+1];
      if(n1===n3||n1===n4||n2===n3||n2===n4)continue;
      const x=segX(pt(n1),pt(n2),pt(n3),pt(n4));
      if(!x)continue;
      total++; per[i]++; per[j]++;
      if(want&&(n1===want||n2===want||n3===want||n4===want)) mine.push(x);
    }
  }
  let freeable=0;
  act.forEach((t,i)=>{ if(per[i]===0 && !t.nodes.some(n=>n.merged)) freeable++ });
  return {total,freeable,mine};
}
const TUT_GRID=13, TUT_ROOM=30;
const TUT_RING=24;
function tutFind(){
  if(!members.length||!threads.length) return null;
  const now=tutCross(null,null);
  if(!now.total) return null;                  // nothing crossing: nothing to point at
  const movable=members.filter(n=>!n.pinned && !n.threads.every(t=>t.freed));
  if(!movable.length) return null;
  const xs=members.map(n=>n.x0), ys=members.map(n=>n.y0), pad=58;
  const bx0=clampX(Math.min(...xs)-pad), bx1=clampX(Math.max(...xs)+pad);
  const by0=clampY(Math.min(...ys)-pad), by1=clampY(Math.max(...ys)+pad);
  let best=null;
  const better=(a,b)=> !b ? true
    : a.freeable!==b.freeable ? a.freeable>b.freeable
    : a.total  !==b.total    ? a.total  <b.total
    : a.solid  !==b.solid    ? a.solid  >b.solid
    : a.clear  !==b.clear    ? a.clear  >b.clear
    : a.d<b.d;
  const clearPath=(n,x,y)=>{
    const ax=n.x0, ay=n.y0, vx=x-ax, vy=y-ay, L2=vx*vx+vy*vy;
    return members.every(m=>{
      if(m===n) return true;
      const u=L2?Math.max(0,Math.min(1,((m.x0-ax)*vx+(m.y0-ay)*vy)/L2)):0;
      return Math.hypot(m.x0-(ax+vx*u), m.y0-(ay+vy*u))>=MIN_SEP;
    }) ? 1 : 0;
  };
  const test=(n,x,y)=>{
    const d=Math.hypot(n.x0-x,n.y0-y);
    if(d<MIN_SEP) return;                      // not a move you could tell you made
    if(members.some(m=>m!==n&&Math.hypot(m.x0-x,m.y0-y)<MIN_SEP)) return;
    const r=tutCross({n,x,y},null);
    if(best && (r.freeable<best.freeable
      || (r.freeable===best.freeable && r.total>best.total))) return;
    let solid=0;
    for(let a=0;a<8;a++){
      const th=a*Math.PI/4;
      if(tutCross({n, x:clampX(x+Math.cos(th)*TUT_ROOM),
                      y:clampY(y+Math.sin(th)*TUT_ROOM)},null).total<=r.total) solid++;
    }
    const cand={n,x,y,total:r.total,freeable:r.freeable,solid,clear:clearPath(n,x,y),d};
    if(better(cand,best)) best=cand;
  };
  const gx=Math.max(7,Math.round(TUT_GRID*Math.min(1,8/Math.max(1,movable.length))));
  const gy=Math.max(3,Math.round(gx*(by1-by0)/Math.max(1,bx1-bx0)));
  movable.forEach(n=>{
    for(let i=0;i<gx;i++)for(let j=0;j<gy;j++)
      test(n, bx0+(bx1-bx0)*i/(gx-1), by0+(by1-by0)*j/(gy-1));
  });
  if(!best) return null;
  let step=Math.max((bx1-bx0)/(gx-1),(by1-by0)/(gy-1))/2;
  for(let pass=0;pass<3;pass++,step/=2){
    const c=best;
    for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++){
      if(!dx&&!dy) continue;
      test(c.n, clampX(c.x+dx*step), clampY(c.y+dy*step));
    }
  }
  if(best.freeable<=now.freeable && best.total>=now.total) return null;
  return {n:best.n, x:best.x, y:best.y, marks:tutCross(null,best.n).mine};
}

function stampToday(depth,feats,tier){
  const d=R().day, pd=store.collection.playedDays;
  const i=pd.findIndex(x=>isDay(x,d));
  if(i<0) return;
  const row = (pd[i] && typeof pd[i]==='object') ? pd[i] : (pd[i]={d,depth:0});
  if(isTrial()){
    row.trialDepth=Math.max(row.trialDepth||0,depth);
    if(!row.mode) row.mode='trial';
  } else {
    const cl=R().cleared;
    const turns=cl.reduce((a,c)=>a+(c.moves||0),0);
    const par=cl.reduce((a,c)=>a+(c.par||0),0);
    const had=row.depth||0;
    const keyNow=rungCount(cl.map(c=>c.tier), POLICY.dailyNets).key;
    const keyHad=rungsOf(row.tiers) ? rungsOf(row.tiers).key : -1;
    const better = keyNow!==keyHad ? keyNow>keyHad
                 : (row.turns==null || turns-par < row.turns-row.par);
    const tiers=cl.map(c=>String(c.tier||'')[0]||'').join('');
    if(depth>had || (depth===had && better)){
      row.turns=turns; row.par=par; row.moves=R().turns||0;
      row.tiers=tiers;

    const began=R().startedAt||'';
    if(!row.first || row.first.at===began) row.first={at:began, depth, turns, par, tiers};
    if(row.lastRun!==began){ row.runs=(row.runs||0)+1; row.lastRun=began }
    row.depth=Math.max(had,depth);
    row.mode='daily';
  }
  if(feats&&feats.length) row.feats=[...new Set([...(row.feats||[]),...feats])];
  if(tier && (!row.best || TIERRANK[tier]>TIERRANK[row.best])) row.best=tier;

    const bestWords=best!=null ? ' · '+best+' turns at best' : '';
    if(locked){
      det='in the archive'+bestWords;
    } else if(played){
      const p=[], rd=dayReading(row);
      const bar=(rd&&rd.rungs)?rungTrack(row.tiers,true):'';
      const barDepth=bar?Math.min(row.tiers.length,POLICY.dailyNets):0;
      if(isFlawless(row.tiers)) p.push('flawless');
      if(row.depth && row.depth<POLICY.dailyNets && barDepth<row.depth)
        p.push(row.depth+' of '+POLICY.dailyNets+' nets');
      if(!rd && row.moves!=null) p.push(row.moves+' turns');
      if(row.mode==='trial'&&row.trialDepth) p.push('time trial · depth '+row.trialDepth);
      if(row.back) p.push('archive');
      det=p.join(' · ')||(bar?'':'played');
      right = bar
        + `<span class="dstate dreplay${canPlay?'':' shut'}" aria-hidden="true"`
        +` data-tip="${esc(canPlay?'play this day again':replayWords())}">&#8635;</span>`;
    } else {
      det=(isToday?'not played yet':'not played')+bestWords;
      right=rungTrack('',true)+'<span class="dstate">play →</span>';
    }

    el.innerHTML=`<i class="dtier" style="--tc:${daySpine(d)}"></i>`
      +`<span class="ddate">${dayLabel(d)}</span>`
      +`<span class="ddet">${det}</span>`
      +right;
    const words=played?tierWords(row.tiers):'';
    const label=[dayLabel(d), det, played&&tier?tierSay(tier):'', words,
                 played?(canPlay?'play again':replayWords()):''].filter(Boolean).join(' · ');
    el.setAttribute('aria-label',label);
    const offer=()=>openDay(d);
    if(canPlay){
      el.setAttribute('role','button'); el.tabIndex=0;
      el.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); offer() } };
    }
    el.onclick=()=>{
      if(canPlay) return offer();
      const price=priceWords();
      flashMsg(spent
        ? `${dayLabel(d)} · ${replayWords()}`
        : `${dayLabel(d)} · in the archive · unlock${price?' · '+price:''}`);
    };
    list.appendChild(el);
  });
  if(best && best.d!==d0) list.appendChild(bestLineEl(best));
  const arch=(POLICY.premium||API)?archiveLineEl():null;
  if(arch){ if(POLICY.premium) list.insertBefore(arch,list.firstChild); else list.appendChild(arch) }

  renderAccount();
  $('histveil').classList.add('show');
  list.scrollTop=keep;
}


function renderThreads(){

  if(c.dataset.sig!==sig || threads.some(t=>!t.slot||!t.slot.isConnected)){
    c.dataset.sig=sig;

        threads.forEach(x=>{if(x.el) x.el.classList.toggle('lit',on&&x===t)});
      };

      b.onpointerleave=()=>{clearTimeout(t.litT); lit(false)};
      b.onclick=()=>{lit(true); clearTimeout(t.litT); t.litT=setTimeout(()=>lit(false),1100)};
      c.appendChild(b); t.slot=b;

const SAY_BASE=1400, SAY_PER=55, SAY_MIN=2200, SAY_MAX=5600, SAY_MERGE=650, SAY_ROWS=3;
let sayT=null, sayRows=[], sayAt=0;
const FLAG=['--flag-1','--flag-2','--flag-3','--flag-4'];

function flashMsg(txt,o){

function sayParts(txt,o){
  if(o.plain) return {kick:'',line:txt};
  const i=txt.indexOf(' · ');
  return (i>0 && i<=22) ? {kick:txt.slice(0,i), line:txt.slice(i+3)} : {kick:'',line:txt};
}
function sayHide(now){
  const el=$('say');

  sayRows=[]; sayAt=0;

function sayShow(txt,o){
  const el=$('say');
  if(document.querySelector('.veil.show')){ toast(txt); return }
  const now=performance.now();
  const row=Object.assign({txt}, sayParts(txt,o), o);
  const merging = sayRows.length && sayRows.length<SAY_ROWS && (now-sayAt)<SAY_MERGE;
  if(merging) sayRows.push(row); else { sayRows=[row]; sayAt=now }

  const cols=[]; sayRows.forEach(r=>(r.cols||['--silver']).forEach(c=>{if(!cols.includes(c))cols.push(c)}));
  el.innerHTML='<div class="saycard">'
    +`<div class="saystrip">${cols.map(c=>`<i style="background:var(${c})"></i>`).join('')}</div>`
    +sayRows.map((r,i)=>{
      const rc=r.cols||['--silver'];
      const bar=rc.length>1
        ? `background:linear-gradient(var(${rc[0]}) 0 50%,var(${rc[1]}) 50% 100%)`
        : `background:var(${rc[0]})`;
      const lead=r.mark ? r.mark
        : sayRows.length>1 ? `<i class="saybar" style="${bar}"></i>` : '';
      const fresh=(merging && i===sayRows.length-1) ? ' rowin' : '';
      return `<div class="sayrow${fresh}${r.tight?' tight':''}">${lead}<div class="saytext">`
        +(r.kick?`<span class="saykick">${r.kick}</span>`:'')
        +`<div class="sayline${r.big?' big':''}">${r.line}</div></div></div>`;
    }).join('')
    +'</div>';
  el.classList.add('on');

  const chars=sayRows.reduce((a,r)=>a+r.txt.length,0);
  const mult=sayRows.some(r=>r.hold)?1.3:1;
  const hold=Math.min(SAY_MAX,Math.max(SAY_MIN,(SAY_BASE+SAY_PER*chars)*mult));
  if(sayT)clearTimeout(sayT);
  sayT=setTimeout(()=>{sayRows=[];sayAt=0;sayT=null;el.classList.remove('on')},hold);
}
function sayNudge(){

}

function renderHud(){
  const r=R();

  const {optimum,par}=netTargets();
  const tier=liveTier();

  const D=POLICY.dailyNets, tut=inTutorial();
  const cells=trial?r.cleared.slice(r.cleared.length-r.cleared.length%D):r.cleared;
  if(tut){
    const step=Math.min(tutStepAt,3);
    paintCells('setmeter',Array.from({length:3},(_,i)=>'var('+(i<step?TIERCOL.perfect:SETAHEAD)+')'),
      'tutorial step '+step+' of 3');
  } else
  paintCells('setmeter',Array.from({length:D},(_,i)=>'var('+(cells[i]?tierCol(cells[i].tier):SETAHEAD)+')'),
    cells.length+' of '+D+' nets cleared');
  const strip=$('setmeter');
  [...strip.children].forEach(c=>c.classList.remove('now'));
  const cur=strip.children[cells.length];

  const t=r.netMoves, over=t>par;
  const hasOpt=optimum<par, capped=(tier==='done'&&!over);
  const graded=hasOpt&&!capped;
  const chasing=graded&&t<=optimum;
  const left=Math.max(0,par-t);
  const perfectLeft=graded?Math.max(0,Math.min(left,optimum-t)):0;
  let pct, segs, num, unit, lap=-1;
  if(over){
    const span=2*par, overBy=t-par;
    lap=Math.floor(overBy/span);
    pct=100*(overBy-lap*span)/span;
    segs=[{col:`var(${LAPCOL[lap%LAPCOL.length]})`,grow:1}];
    num=overBy; unit='over par';
  } else {
    pct=100*left/par;
    segs=[{col:'var(--par-perfect)',grow:perfectLeft},
          {col:'var(--par-par)',    grow:left-perfectLeft}];
    num=chasing?optimum-t:par-t;

  }
  meter.dataset.phase=phase;
  if(lap>0) meter.style.setProperty('--lap-under',`var(${LAPCOL[(lap-1)%LAPCOL.length]})`);
  else meter.style.removeProperty('--lap-under');
  const wrapping = over && meter.dataset.lap!==undefined && meter.dataset.lap!==String(lap);
  if(wrapping){ clearTimeout(meter.__phaseT); bar.style.transitionDuration='0s' }
  if(over) meter.dataset.lap=lap; else delete meter.dataset.lap;
  paintRun('parmeter',pct,segs,num+' turns '+unit);
  if(wrapping){ void bar.offsetWidth; bar.style.transitionDuration='' }
  $('parnum').textContent=num;
  $('parof').textContent=unit;

  $('field').classList.toggle('over',!!r.over);
  const d=new Date(), mo=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
  $('statusdate').textContent=`${d.getDate()} ${mo[d.getMonth()]}`;
  $('histbtn').setAttribute('aria-label',`your days · ${d.getDate()} ${mo[d.getMonth()]}`);

function shareCardSVG(){
  const r=R(), W=CARD_W, H=CARD_H, M=44, RX=W-M;
  const {cells,turns,par,slots}=shareFigures(r);

  const numeric=/^\d+$/.test(fig);

  const SY=312, SH=72, GAP=slots>12?4:8, CW=(RX-M-(slots-1)*GAP)/slots;
  const strip=Array.from({length:slots},(_,i)=>{
    const x=(M+i*(CW+GAP)).toFixed(1), w=CW.toFixed(1), c=cells[i];
    const frame=`<rect x="${x}" y="${SY}" width="${w}" height="${SH}" fill="none" stroke="${PLATEINK}" stroke-opacity=".3"/>`;
    if(!c) return frame;

    return frame+`<rect x="${x}" y="${SY+SH-h}" width="${w}" height="${h}" fill="${cssv(TIERCOL[c.tier])}"/>`;
  }).join('');

  const LY=414, KW=11, KH=20;

    const kh=Math.round(KH*SHAREFILL[name]);
    const g=`<rect x="${kx}" y="${LY-KH}" width="${KW}" height="${KH}" fill="none" stroke="${PLATEINK}" stroke-opacity=".3"/>`
      +`<rect x="${kx}" y="${LY-kh}" width="${KW}" height="${kh}" fill="${cssv(TIERCOL[name])}"/>`
      +`<text x="${kx+KW+13}" y="${LY-4}" font-size="14" letter-spacing="2" fill-opacity=".8">${tierSay(name)}</text>`;
    kx+=KW+13+tierSay(name).length*9.3+22;
    return g;
  }).join('');
  const note=isTrial() ? 'time trial'
    : (played && cells.length<POLICY.dailyNets) ? `${cells.length} of ${POLICY.dailyNets} nets` : '';

  const MW=(()=>{
    try{const c=document.createElement('canvas').getContext('2d');
      c.font='700 46px Helvetica,Arial';
      return Math.max(60,c.measureText(WORDMARK).width-(WORDMARK.length-1)*1.4);
    }catch(e){return 190}   // a plausible measure, so the mark still draws
  })();
  const MARK=FLAG.map((c,i)=>
    `<stop offset="${i/4}" stop-color="${cssv(c)}"/><stop offset="${(i+1)/4}" stop-color="${cssv(c)}"/>`
  ).join('');

  const sun=Array.from({length:14},(_,i)=>{

  }).join('');

  return `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
    <rect width="${W}" height="${H}" fill="${PLATE}"/>
    <defs><linearGradient id="mark" x1="0" y1="0" x2="1" y2="0">${MARK}</linearGradient></defs>
    <g font-family="Helvetica,Arial" fill="${PLATEINK}">
      <text x="${M}" y="76" font-size="46" font-weight="700" letter-spacing="-1.4">${WORDMARK}</text>
      <rect x="${M}" y="91" width="${MW.toFixed(2)}" height="7" fill="url(#mark)"/>
      <text x="${M}" y="114" font-size="14" letter-spacing="3.4" fill-opacity=".8">${dayLabel(r.day||today())}</text>
      <g stroke="${PLATEINK}" stroke-width="2.4" stroke-opacity=".55">${sun}</g>
      <line x1="${M}" y1="128" x2="${RX}" y2="128" stroke="${PLATEINK}" stroke-opacity=".32"/>
      <text x="${M}" y="236" font-size="${numeric?126:88}" font-weight="300" letter-spacing="${numeric?-5:-2}">${fig}</text>
      <text x="${M+2}" y="274" font-size="22" letter-spacing="3.6" fill-opacity=".92">${word}</text>
      ${played?`<text x="${RX}" y="274" font-size="15" letter-spacing="1.6" text-anchor="end" fill-opacity=".72">${turns} turns · par ${par}</text>`:''}
      <line x1="${M}" y1="296" x2="${RX}" y2="296" stroke="${PLATEINK}" stroke-opacity=".32"/>
      ${strip}
      ${key}
      ${note?`<text x="${RX}" y="${LY-4}" font-size="14" letter-spacing="2" text-anchor="end" fill-opacity=".8">${note}</text>`:''}
      <text x="${M}" y="450" font-size="12" letter-spacing="2.2" fill-opacity=".7">untangling superposed features · after otl aicher, munich 1972</text>
    </g>
  </svg>`;
}
async function shareCardBlob(){

};
$('reset').onclick=async e=>{
  e.preventDefault();
  const ok=await ask({
    title:'reset everything', sub:'controls',
    rows:[['this clears','every day, badge and streak']],
    note:'none of it is kept anywhere else, so there is nothing to put it back from.',
    yes:'reset', no:'keep it', danger:true
  });

  localStorage.removeItem(KEY);

};
if(DEV){

const RMARK={
  feature:()=>[threadPart([[4,32],[24,12],[44,32],[64,12]],THREADPAL[0])],
  neuron:()=>[threadPart([[2,22],[66,22]],THREADPAL[1]),
              ...neuronParts(34,22,[THREADPAL[1]])],
  shared:(a,b)=>[threadPart([[2,22],[34,22],[66,22]],a||THREADPAL[2]),
              threadPart([[16,4],[34,22],[52,40]],b||THREADPAL[3]),
              ...neuronParts(34,22,[a||THREADPAL[2],b||THREADPAL[3]])],
  pinned:()=>[threadPart([[2,22],[66,22]],THREADPAL[4]),
              ...neuronParts(34,22,[THREADPAL[4]],{pinned:true})],
  crossing:()=>[threadPart([[14,2],[54,42]],THREADPAL[5]),
                threadPart([[54,2],[14,42]],THREADPAL[0]),
                ...crossParts([[34,22]])]
};
const rmark=k=>markSVG(RMARK[k](),'0 0 68 44','rmark');

function introPlate(){
  const A=THREADPAL[0], B=THREADPAL[1], C=THREADPAL[2];
  const parts=[
    threadPart([[60,-30],[60,45],[135,120],[97.5,195],[60,270],[60,345]],A,3.4),
    threadPart([[135,-30],[135,45],[60,120],[97.5,195],[210,270],[210,345]],B,5.6),
    threadPart([[210,-30],[210,45],[210,120],[172.5,195],[135,270],[135,345]],C,4.5),
    ...neuronParts(60,45,[A]), ...neuronParts(135,45,[B]), ...neuronParts(210,45,[C]),
    ...neuronParts(135,120,[A]), ...neuronParts(60,120,[B]),
    ...neuronParts(210,120,[C],{pinned:true}),
    ...neuronParts(97.5,195,[A,B]), ...neuronParts(172.5,195,[C]),
    ...neuronParts(60,270,[A]), ...neuronParts(210,270,[B]), ...neuronParts(135,270,[C]),
    ...crossParts([[97.5,82.5]]), ...crossParts([[153.75,232.5]])
  ];
  return `<svg viewBox="0 0 270 315" preserveAspectRatio="xMidYMid slice" role="img"
    aria-label="three coloured features threaded through a small net, two of them sharing one neuron">
    <defs><pattern id="introgrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="var(--rule)" stroke-width="1"/></pattern></defs>
    <rect x="-200" y="-200" width="700" height="800" fill="var(--paper)"/>
    <rect x="-200" y="-200" width="700" height="800" fill="url(#introgrid)"/>
    ${parts.map(partHTML).join('')}</svg>`;
}
function rungLadder(){
  const rungs=['done','clean','perfect','flawless'];
  return `<div class="rladder">
    <span class="track" aria-hidden="true">${
      rungs.map(t=>`<i class="on${t==='flawless'?' flaw':''}" style="--fill:var(${TIERCOL[t]})"></i>`).join('')}</span>
    <span class="rlnames">${rungs.map(t=>`<i>${tierSay(t)}</i>`).join('')}</span>
  </div>`;
}
let introMode='day';
let fromCard=false;
function backToCard(){
  fromCard=false;
  renderIntro('day');
  showVeil('introveil');
}
function renderIntro(mode){
  introMode=mode;
  const b=$('introbody');
  const plain = mode==='rules';
  document.querySelector('.intro-card').classList.toggle('plain',plain);
  if(!plain && !$('introart').firstChild) $('introart').innerHTML=introPlate();
  if(mode==='rules'){
    b.innerHTML=`<div class="intro-title">how to play</div>
      <div class="intro-sub">ten nets a day &middot; clearing the crossings reveals the feature</div>
      <div class="rkey">
        ${rmark('feature')}<span><b>feature</b> &middot; free it</span>
        ${rmark('neuron')}<span><b>neuron</b> &middot; drag it</span>
        ${rmark('shared')}<span><b>shared neuron</b> &middot; tap to split</span>
        ${rmark('pinned')}<span><b>pinned</b> &middot; will not move</span>
        ${rmark('crossing')}<span><b>crossing</b> &middot; clear it</span>
      </div>
      ${rungLadder()}
      <button class="intro-start" id="introstart">${fromCard?'back':'back to the net'}</button>`;
  } else {
    const fresh=!store.tutorialDone;
    const streak=store.meta.streak||0;
    const runSay=`<b>${streak}</b><span>day${streak===1?'':'s'} running</span>`;
    const rows=dayRows();
    const perfect=rows.reduce((a,r)=>a+(typeof r.tiers==='string'
      ? r.tiers.slice(0,POLICY.dailyNets).split('p').length-1 : 0),0);
    const week=menuDays().map(({d,row})=>{
      const played=!!(row && typeof row.tiers==='string' && row.tiers);
      const isNow=d===today();
      const can=played && canPlayDay(d);
      const shut=isShut({d,row});
      const chip=played
        ? `<span class="dstate dreplay${can?'':' shut'}" aria-hidden="true"`
          +` data-tip="${esc(can?'play this day again':replayWords())}">&#8635;</span>`
        : canPlayDay(d)
        ? `<span class="dstate dreplay dplay" aria-hidden="true">&rarr;</span>`
        : '<span class="dstate dreplay ghost" aria-hidden="true"></span>';
      const trialable=played||canPlayDay(d);
      const trialChip=trialable
        ? `<button class="dstate dreplay dtrial${canTimeTrial()?'':' shut'}" data-trial="${d}"`
          +` data-tip="${esc(canTimeTrial()?'play this day as a time trial':'the time trial is part of the full version')}"`
          +` aria-label="time trial · ${dayLabel(d)}">`
          +`<svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.8">`
          +`<circle cx="12" cy="13.5" r="7"/><path d="M10 3.5h4M12 3.5v3M12 13.5l3-3"/></g></svg></button>`
        : '<span class="dstate dreplay ghost" aria-hidden="true"></span>';
      const press=played||canPlayDay(d);
      const say=played?(can?'play again':replayWords()):(canPlayDay(d)?'play':'');
      return `<div class="wbday${isNow?' now':''}${played?'':' none'}${shut?' shut':''}"`
        +(press?` role="button" tabindex="0" data-day="${d}"`:'')
        +` aria-label="${dayLabel(d)}${isNow?' · today':''} · ${played?tierWords(row.tiers):(shut?'in the archive':'not played')}`
        +`${say?' · '+say:''}">`
        +`<i class="wbtier" style="${shut?'':'--tc:'+daySpine(d)}" aria-hidden="true"></i>`
        +`<span class="wbwhen">${isNow?'today':dayLabelShort(d)}</span>`
        +rungTrack(played?row.tiers:'',true)
        +`<span class="wbchips">${chip}${trialChip}</span></div>`;
    }).join('');
    const firstDay = !fresh && !rows.length;
    const head=fresh
      ? `<div class="intro-title">${WORDMARK}</div>
         <div class="intro-sub">untangle what a neural net knows</div>`
      : `<div class="intro-title">${firstDay?'your first day':'welcome back'}</div>
         <div class="intro-sub">${dayLabel(today())} · the same ten for everyone</div>`;
    const keepScroll=(()=>{ const w=b.querySelector('.wbweek'); return w?w.scrollTop:0 })();
    b.innerHTML=head
      +`<div class="wbstats">
        <div>${runSay}</div>
        <div><b>${perfect}</b><span>perfect nets</span></div>
      </div>
      <div class="wbweek">${week}</div>
      <div class="intro-note wbspread" id="wbspread"></div>
      <button class="intro-start" id="introstart">${fresh?'start untangling'
        :firstDay?'start your first ten':"start today's run"}</button>`
      +`<div class="intro-doors">`
      +(fresh?'':`<button class="help" id="introlessons" aria-label="the guided nets">`
        +`<svg viewBox="0 0 24 24" aria-hidden="true">`
        +`<rect x="2.5" y="9" width="6" height="6" fill="currentColor"/>`
        +`<rect x="10.5" y="9.75" width="4.5" height="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/>`
        +`<rect x="17.5" y="9.75" width="4.5" height="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/>`
        +`</svg></button>`)
      +`<button class="help" id="introcoll" aria-label="the collection" aria-label="the collection">`
      +`<svg viewBox="0 0 24 24" aria-hidden="true"><g fill="currentColor">`
      +`<rect x="4" y="4" width="4.5" height="4.5"/><rect x="9.75" y="4" width="4.5" height="4.5"/><rect x="15.5" y="4" width="4.5" height="4.5"/>`
      +`<rect x="4" y="9.75" width="4.5" height="4.5"/><rect x="9.75" y="9.75" width="4.5" height="4.5"/><rect x="15.5" y="9.75" width="4.5" height="4.5"/>`
      +`<rect x="4" y="15.5" width="4.5" height="4.5"/><rect x="9.75" y="15.5" width="4.5" height="4.5"/><rect x="15.5" y="15.5" width="4.5" height="4.5"/>`
      +`</g></svg></button>`
      +`<button class="help" id="introrules" aria-label="how to play">?</button>`
      +`<button class="help groundbtn" id="introground" aria-label="ground">`
      +`<svg class="themeglyph" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor"/></svg></button>`
      +`<button class="help" id="introbuy"></button>`
      +`</div>`;
    paintTill($('introbuy'));
    const press=d=>{
      if(canPlayDay(d)){ store.introSeen=true; store.lastIntroDay=today(); save();
        $('introveil').classList.remove('show'); return openDay(d) }
      flashMsg(`${dayLabel(d)} · ${replayWords()}`);
    };
    $('introbody').querySelector('.wbweek').scrollTop=keepScroll;
    $('introbody').querySelector('.wbweek').onclick=e=>{
      const t=e.target.closest('[data-trial]');
      if(t){ e.stopPropagation(); return startDayTrial(t.dataset.trial) }
      const row=e.target.closest('[data-day]');
      if(row) press(row.dataset.day);
    };
    $('introbody').querySelector('.wbweek').onkeydown=e=>{
      if(e.key!=='Enter' && e.key!==' ') return;
      const row=e.target.closest('[data-day]');
      if(row){ e.preventDefault(); press(row.dataset.day) }
    };
    paintSpread(); ensureSpread(); ensurePrice();
  }
  $('introstart').onclick=()=>{
    if(introMode==='rules' && fromCard) return backToCard();
    store.introSeen=true; store.lastIntroDay=today(); save();
    $('introveil').classList.remove('show');
  };
  if($('introlessons')) $('introlessons').onclick=()=>startLessons();
  if($('introcoll')) $('introcoll').onclick=()=>{ fromCard=true; recView='collection'; hideVeils(); openRecord() };
  if($('introbuy')) $('introbuy').onclick=()=>{ if(!POLICY.premium) beginUnlock() };
  if($('introrules')) $('introrules').onclick=()=>{ fromCard=true; renderIntro('rules') };
}
function startLessons(){
  const r=R();
  if(r.netMoves || (r.cleared||[]).length)
    return flashMsg('the guided nets need a day you have not started');
  store.introSeen=true; store.lastIntroDay=today();
  store.tutorialDone=false;
  r.netIndex=0; r.netMoves=0; r.turns=0; r.positions={}; r.freed=[];
  r.splitNodes=[]; r.assisted=false; r.cleared=[]; r.over=false;
  builtFor=-1; resetDescent(); save();
  hideVeils(); renderAll();
  flashMsg('the guided nets · three lessons, and nothing here is scored');
}
$('helpbtn').onclick=()=>{fromCard=false; renderIntro('rules'); showVeil('introveil')};
$('collbtn').onclick=()=>{ fromCard=false; recView='collection'; hideVeils(); openRecord() };
$('buybtn').onclick=()=>beginUnlock();
addEventListener('click',e=>{
  const b=e.target.closest&&e.target.closest('.groundbtn');
  if(!b) return;
  e.preventDefault();
  setTheme(themeNow()==='light'?'dark':'light');
});
if(DEV){
  $('solvebtn').hidden=false;
  $('solvebtn').onclick=()=>{ try{ window.__solveNet() }catch(e){ toast('solve failed · '+e.message) } };
}
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  document.querySelectorAll('.veil.show').forEach(dismissVeil);
});

window.__st=()=>({run:R(),badges:store.collection.badges,threads:threads.map(t=>({k:t.key,f:t.freed,c:t.crossings}))});
window.__solveNet=()=>{
  const r=R();
  if(r.over) return;
  if(spec.fam){
    const plan=spec.plan;
    const route = (plan && GEN_RULES.parMode==='greedy')
      ? famGreedy(plan).log
      : [...members.filter(n=>n.merged).map(n=>['split',n.idx]),
         ...members.map(n=>['drag',n.idx])];
    for(const [kind,idx] of route){
      const n=members.find(m=>m.idx===idx);
      if(!n) continue;
      if(kind==='split'){
        if(!n.merged) continue;
        const alt=n.alt;
        (r.splitNodes=r.splitNodes||[]).push(n.idx);
        splitNode(n,true); chargeTurn(r);
        const half=members.find(m=>m.idx===1000+n.idx);
        if(half&&alt){half.hx=alt.x; half.hy=alt.y}
      } else {
        if(n.pinned||n.hx==null||n.merged) continue;
        if(Math.hypot(n.x0-n.hx,n.y0-n.hy)<=MIN_SEP*.7) continue;
        n.x0=clampX(n.hx); n.y0=clampY(n.hy);
        r.positions[n.idx]=[n.x0,n.y0];
        chargeTurn(r);
      }
    }
    recordDay(); countCross();
    threads.filter(t=>!t.freed&&canFree(t)).forEach(t=>{freeThread(t,false);r.freed.push(t.key)});
    save(); refresh(); renderHud();
    if(threads.every(t=>t.freed))clearNet();
    return;
  }
  const lane=t=>BH*.09+threads.indexOf(t)*(BH*.82/Math.max(1,threads.length-1));
  const done=new Set(); let sh=0;
  threads.filter(t=>!t.freed).forEach(t=>{
    t.nodes.forEach((n,i)=>{
      if(done.has(n.idx))return; done.add(n.idx);
      if(n.pinned){done.add(n.idx);return}          // pins are already where they must be
      if(n.threads.length>1){n.x0=BW*.42+95*(sh++);n.y0=(lane(n.threads[0])+lane(n.threads[1]))/2}
      else{n.x0=clampX(BW*.07+(BW*.86*i/Math.max(1,t.nodes.length-1)));n.y0=lane(t)+(i%2?9:-9)}
      r.positions[n.idx]=[n.x0,n.y0];
    });
    r.turns=(r.turns||0)+1; r.netMoves++;
  });
  members.filter(n=>n.merged).slice().forEach(n=>{
    (r.splitNodes=r.splitNodes||[]).push(n.idx);
    splitNode(n,true); r.turns=(r.turns||0)+1; r.netMoves++;
  });
  recordDay(); countCross();
  threads.filter(t=>!t.freed&&canFree(t)).forEach(t=>{freeThread(t,false);r.freed.push(t.key)});
  save(); refresh(); renderHud();
  if(threads.every(t=>t.freed))clearNet();
};

renderAll();
publishPlateInset();
addEventListener('load',publishPlateInset);
if(!store.introSeen || (store.lastIntroDay!==today() && R().netMoves===0 && !R().cleared.length)){
  renderIntro('day'); showVeil('introveil');
}
readUnlockReturn().then(wakeAccount);
