    navigator.sendBeacon(API+'/sync',new Blob([outbound()],{type:'application/json'}));
  }catch(e){}
});
function fnv(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function mulberry32(seed){return function(){let t=seed+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function cssv(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}

/* ================= the unlock =================
   the full version — the archive and the time trial — is one payment, and the
   same worker that holds the record holds it. this is the client half: four
   calls, and one rule that outranks all of them.

   THE RULE: NOTHING HERE IS LOAD-BEARING. the game is a static file that plays
   offline, and `worker/` may not be deployed at all, so every call is guarded
   and every failure is silent — the local flag stands, today and yesterday stay
   free, and the only thing lost is the ability to buy. that is the difference
   between giving a game a back end and making a game need one.

   the token is for a player who bought WITHOUT signing in: there has to be
   something holding the purchase, and it is a random id the server minted,
   signed, and handed back. a player who signs in has a session doing that job
   instead, and `linkUnlock` hands the one over to the other.

   it lives under its OWN key rather than inside the save. `probe-run-v3` is the
   game and the controls drawer can reset it; an entitlement a reset could wipe
   is an entitlement people will lose. */
const ACCT='features-acct-v1';
let acct={};
try{acct=JSON.parse(localStorage.getItem(ACCT)||'{}')}catch(e){acct={}}
function saveAcct(){try{localStorage.setItem(ACCT,JSON.stringify(acct))}catch(e){}}

let priceInfo=null;                 // {amount,currency}, once the server has said
/* is there anywhere to pay. null is UNKNOWN, which is what a page that has not
   asked yet holds and what a page with no worker behind it holds forever — and
   the two are treated the same, because an `unlock` link that leads to "the
   till is not answering" is worse than no link. this game shipped for a fortnight
   with a placeholder that flipped the flag and said nothing was charged; the
   honest version of that is to say nothing at all until there is a till.
   DEV is the exception, so the paid tier stays testable with no backend. */
let till=null;

/* the quiet face of the same api. `apiCall` above throws, which is right for the
   sign-in card: a player who just pressed a button is owed a reason. nothing on
   the unlock path is, because an absent server is the NORMAL state here — the
   game ships without one — so this answers `null` for "could not ask" and
   `{error}` for "asked and was refused", and every caller treats the first as
   silence rather than as a fault. */
async function api(path,body){
  if(!API) return null;
  const o={headers:{},credentials:'same-origin'};
  if(acct.token) o.headers['Authorization']='Bearer '+acct.token;
  if(body!==undefined){
    o.method='POST'; o.headers['Content-Type']='application/json'; o.body=JSON.stringify(body);
  }
  let res;
  try{ res=await fetch(API+'/'+path,o) }catch(e){ return null }   // offline, blocked, or not deployed
  let data=null;
  try{ data=await res.json() }catch(e){}
  /* a token the server will not take is worse than no token at all: it fails
     every call from here to the end of time. throw it away and carry on
     anonymous — signing in, or the code, is what gets the purchase back.
     a SIGNED-IN caller is not holding a token at all, so this cannot touch a
     session; /me answers a signed-out visitor with a 200 and no `full`. */
  if(res.status===401 && acct.token){ acct.token=null; saveAcct() }
  return res.ok ? (data||{}) : {error:(data&&data.error)||{code:'http_'+res.status}};
}

/* the server's answer, written into the one switch. it speaks in BOTH
   directions — it grants what was bought and takes back what was refunded,
   which is most of the point of having it — but only when it actually answers,
   so an unreachable api leaves the flag exactly as it found it. */
function applyEntitlement(r){
  if(!r || r.error) return false;
  /* the server has looked at this token and does not know it — a rotated
     signing secret, or an account that has since been linked or deleted. it
     will never work again, so it goes now rather than riding along failing
     quietly on every call from here to the end of time. */
  if(r.badToken) acct.token=null;
  if(r.token) acct.token=r.token;
  if('restoreCode' in r) acct.code=r.restoreCode||null;
  if(r.price) priceInfo=r.price;
  if(typeof r.till==='boolean') till=r.till;
  saveAcct();
  if(typeof r.full!=='boolean') return false;
  const was=!!store.premium;
  POLICY.premium=r.full; save();
  return was!==r.full;
}
/* is there a till to send anybody to. see `till` — DEV counts so the paid tier
   is testable with no worker running, and everybody else is only offered a
   purchase once the server has said it can take one. */
const canBuy=()=>DEV||till===true;
/* the two screens that draw the entitlement, redrawn when it moves. everywhere
   else reads the flag at the moment it renders, so it is already right.
   the cleared card is in here for the price as much as for the flag: it is
   built the instant the day ends and the price may still be in flight, so this
   is also what puts the number on the offer when the answer lands late. */
function entitlementChanged(){
  if($('histveil').classList.contains('show')) openRecord();
  if($('runveil').classList.contains('show')) showRunOver();
  /* the day card too, since it draws the till link and the price in its foot and
     is built before either can have arrived. only that card: the rules card has
     nothing on it money can change, and redrawing it under somebody reading it
     would be the network taking a screen away. */
  if(introMode==='day' && $('introveil').classList.contains('show')) renderIntro('day');
  /* and the masthead, which carries the till's own mark. renderHud is what
     decides whether it is drawn, so the answer landing has to reach it. */
  renderHud();
}
/* what it costs, asked for only when there is somewhere to print it — a player
   who never opens the record never makes this call. the record redraws when the
   answer lands, because it was drawn before the answer existed.
   /me is one call answering both halves: who is signed in, and what they own.
   a visitor with neither a session nor a token still gets the price, because
   somebody has to be told the cost before they can decide to pay it. */
let priceAsked=false;
async function ensurePrice(){
  if(priceInfo || priceAsked || !API) return;
  priceAsked=true;
  const moved=applyEntitlement(await api('me'));
  if(priceInfo || moved) entitlementChanged();
}
/* the purchase catching up with the account.
   somebody can buy without ever signing in — that is deliberate, a till that
   demands an account first is a till fewer people reach — and then sign in
   later, at which point the entitlement is sitting on an anonymous id and the
   record is sitting on a real one. this moves the first onto the second, once,
   and the token is spent doing it. */
async function linkUnlock(){
  if(!acct.token || !account || !account.signedIn) return;
  const r=await api('unlock/link',{});
  if(!r || r.error) return;
  /* the anonymous id is gone now: the account holds the purchase. dropping the
     token here rather than waiting for the next 401 is what stops this device
     presenting a credential to a row that no longer exists. */
  acct.token=null;
  if(applyEntitlement(r)) entitlementChanged();
  else saveAcct();
}
/* £3, not £3.00 — the second is a form for invoices, not a price on a link. the
   divisor comes out of Intl rather than being 100, because a yen amount is
   already whole and dividing it would offer the game for a hundredth of what it
   costs. */
function priceWords(){
  if(!priceInfo || typeof priceInfo.amount!=='number' || !priceInfo.currency) return '';
  try{
    const cur=priceInfo.currency.toUpperCase();
    const digits=new Intl.NumberFormat(undefined,{style:'currency',currency:cur})
      .resolvedOptions().minimumFractionDigits;
    const unit=Math.pow(10,digits), whole=priceInfo.amount%unit===0;
    return new Intl.NumberFormat(undefined,{style:'currency',currency:cur,
      minimumFractionDigits:whole?0:digits, maximumFractionDigits:digits})
      .format(priceInfo.amount/unit);
  }catch(e){ return '' }
}

/* ---- how everybody else did yesterday ----
   `the same ten for everyone` is the strongest thing in the design and until now
   it did nothing: it was a promise about fairness with no way to see the other
   side of it. every player got the identical ten nets, so the spread across them
   is a real comparison rather than a table of who plays most — which is why what
   comes back is a HISTOGRAM and there is no leaderboard, no nickname and no
   other player's row anywhere in it.
   YESTERDAY AND NEVER TODAY. today's spread would be a spoiler in the same way
   the archive's difficulty reading is one — it says how hard the ten you are
   about to play turned out to be — and it would be a spoiler measured off a day
   half the world has not woken up to yet.
   it is asked for exactly where it is drawn, after the card is already on
   screen, and it is silent every way it can fail: no api, an undeployed worker,
   a file:// url, a day too thin to be anonymous, or a reply that is not the
   shape it should be. the line is simply absent, which is the same discipline
   the sign-in row and the price follow — the game plays whole with none of this
   reachable, and this is the last thing that should test that. */
let spread=null, spreadAsked=false;
async function ensureSpread(){
  if(spreadAsked || !API) return;
  spreadAsked=true;
  const r=await api('day/'+dayAdd(today(),-1)+'/spread');
  if(!r || r.error || !r.enough || !Array.isArray(r.dist)) return;
  spread=r;
  paintSpread();
}
/* the line, or nothing at all. `beat` is strictly-fewer, which is what the word
   means — a tie is not a win — and the clause is DROPPED at zero rather than
   printed. that is not flattery: this game's own rule is that a day cannot be
   failed, so the one screen a player opens before playing does not get to open
   with a nought, and the median above it has already told them where they were.
   the count leads because it is the part that is actually new — somebody else
   played this. */
function paintSpread(){
  const el=$('wbspread');
  if(!el || !spread) return;
  const nets=spread.nets||POLICY.dailyNets;
  let say=`${spread.players} played yesterday · median ${spread.median} of ${nets}`;
  const mine=rungsOf((dayRows().find(r=>r.d===dayAdd(today(),-1))||{}).tiers);
  if(mine){
    const under=spread.dist.reduce((a,b)=>a+(b.good<mine.good?b.n:0),0);
    const pct=Math.round(under/spread.players*100);
    if(pct>0) say+=` · you beat ${pct}%`;
  }
  el.textContent=say;
}

/* a shut door that leads somewhere. the record is where the unlock lives — a
   way through rather than the subject, which is the design — so a locked trial
   says what it is and opens the screen that sells it, rather than throwing a
   payment page at one tap of a button that used to be free. */
function offerFull(what){
  hideVeils();
  openRecord();
  toast(what+' · part of the full version');
  return false;
}
/* the unlock, for real. it hands off to stripe's own checkout page — this game
   never sees a card number and does not want to — and the player comes back to
   `return_path` with a session id, which readUnlockReturn picks up.
   with nothing behind it a dev build still flips the switch locally, which is
   how the paid tier was tested before there was anything to pay. */
async function beginUnlock(){
  if(POLICY.premium) return;
  const r=API ? await api('unlock/checkout',{return_path:location.pathname}) : null;
  if(!r || r.error){
    if(DEV){
      POLICY.premium=true; save(); entitlementChanged();
      return toast('unlocked locally · dev build, nothing was charged');
    }
    return toast(r && r.error && r.error.code==='rate_limited'
      ? 'too many tries · give it a minute'
      : 'the till is not answering · try again shortly');
  }
  if(r.token){ acct.token=r.token; saveAcct() }
  // bought already, and only the local flag had drifted — a reinstall, or a
  // second browser on the same purchase
  if(r.already){
    applyEntitlement(Object.assign({full:true},r)); entitlementChanged();
    return toast('you already own the full version');
  }
  if(r.url) location.href=r.url;
  else toast('the till is not answering · try again shortly');
}
/* the same purchase on a second device, for somebody who bought without an
   account. signing in is the other way and the better one — it moves the record
   too — but a purchase made anonymously has to have SOME way across, and the
   code is it. which is why the server counts every guess at one, and why a
   wrong code and a malformed one get the same answer here. */
async function restoreUnlock(){
  if(!API) return toast('restoring needs the game served over the web');
  const code=prompt('unlock code from the device you bought it on');
  if(code==null) return;
  const r=await api('unlock/restore',{code:code});
  if(!r) return toast('could not reach the till · try again shortly');
  if(r.error) return toast(
      r.error.code==='device_limit' ? 'that code is open on as many devices as it opens'
    : r.error.code==='rate_limited' ? 'too many tries · wait an hour'
    : 'that code does not open anything');
  applyEntitlement(r); entitlementChanged();
  toast('full version restored');
}
/* coming back from stripe. the webhook is the authority and will grant this on
   its own, so confirming here buys one thing only: the player is looking at the
   screen NOW and should not have to wait on a round trip they cannot see. when
   it fails, the next visit's /me picks it up. */
async function readUnlockReturn(){
  const q=new URLSearchParams(location.search);
  const state=q.get('unlock');
  if(!state) return;
  const cs=q.get('cs');
  // the parameters have done their job, and a reload must not re-run this
  q.delete('unlock'); q.delete('cs');
  const rest=q.toString();
  try{history.replaceState(null,'',location.pathname+(rest?'?'+rest:'')+location.hash)}catch(e){}
  if(state!=='done') return toast('nothing was charged');
  const r=cs ? await api('unlock/confirm',{session_id:cs}) : null;
  if(r && !r.error && r.full){
    applyEntitlement(r); entitlementChanged();
    return flashMsg('unlocked · the archive and the time trial are yours',{cols:['--sig-violett']});
  }
  if(r && r.pending) return toast('payment still clearing · it opens when it does');
  // paid for, but by a device this one cannot prove it is
  if(r && r.mismatch) return toast('paid · restore it here with your unlock code');
  toast('could not confirm just now · it will be there next visit');
}

/* ================= the ground =================
   two grounds, one game. the tokens do nearly all of it, but a good deal of
   the board's colour does not go through the cascade at all: cssv() resolves a
   token once and writes the answer into an svg attribute or an inline style —
   a thread stroke, a node ring, the plate, a meter block — and an attribute
   does not re-cascade when the tokens under it move. so switching has to go
   back and re-resolve every one of them, or the board keeps the strokes of the
   ground it just left.

   this is a repaint rather than buildNet(true). a rebuild would also work, and
   it would keep the player's positions, splits and freed threads — but it
   would throw away the shape a freed feature eased into, which lives only in
   the live nodes and is not stored anywhere, and it would re-run the salt loop
   to arrive at the board already on screen. */
const SYSLIGHT = window.matchMedia ? matchMedia('(prefers-color-scheme: light)') : null;
function themeNow(){
  if(store.theme==='light'||store.theme==='dark') return store.theme;
  return (SYSLIGHT && SYSLIGHT.matches) ? 'light' : 'dark';
}
/* the ground is toggled in two places — the masthead, and the record's head,
   which is the only one reachable while that card is up. so this stops asking
   for ONE button by id and writes whichever exist: two controls reporting one
   state is the way they drift, and the drift is silent because both of them
   LOOK right (the glyph's half-turn is a css rule keyed off data-theme, so it
   follows the ground whatever this function does). what would go stale is what
   the reader and the tooltip get, which is exactly the half nobody checks.
   a third one anywhere would need no line here — only the class. */
function applyTheme(mode){
  document.documentElement.setAttribute('data-theme',mode);
  const label='ground · '+(mode==='light'?'paper':'dark');
  document.querySelectorAll('.groundbtn').forEach(b=>{
    b.title=label; b.setAttribute('aria-label',label);
    b.setAttribute('aria-pressed',mode==='light'?'true':'false');
  });
}
function repaintTheme(){
  /* everything built by partEl — every neuron ring, pin and card fragment —
     says which tokens it was painted from, so this needs no list of them */
  document.querySelectorAll('[data-tok]').forEach(e=>{
    e.getAttribute('data-tok').split(' ').forEach(pair=>{
      const i=pair.indexOf(':');
      e.setAttribute(pair.slice(0,i),cssv(pair.slice(i+1)));
    });
  });
  // and the handful that write a style rather than an attribute
  if(gRoot){
    const pat=$('netsvg').querySelector('#fg path');
    if(pat) pat.setAttribute('stroke',cssv('--grid'));
    const plate=gRoot.querySelector('.plate');
    if(plate) plate.setAttribute('fill',cssv('--surface'));
    threads.forEach(t=>{ if(t.el) t.el.style.stroke=cssv(t.col) });
    /* any ring carrying an inline stroke: an inline style outranks the attribute
       the repaint above just corrected, so it has to be corrected in its own
       right rather than left to the sweep. */
    members.forEach(n=>{
      if(!n.el || !n.el.style.stroke) return;
      n.el.style.stroke=cssv(n.threads[0].col);
    });
  }
  lastT='';                  // the crossings track skips a repaint it thinks it already did
  renderHud(); refresh();
  /* the one overlay that bakes colours rather than referencing them: every
     emblem in the record resolves its mark from the plate's luminance, so the
     whole screen is rebuilt rather than repainted */
  if($('histveil').classList.contains('show')) openRecord();
  /* deliberately not chased: the freeing runner and the cleared sweep resolve a
     colour and remove themselves inside half a second, so the only way to catch
     one stale is to switch ground during the half second it exists. */
}
function setTheme(mode){ store.theme=mode; save(); applyTheme(mode); repaintTheme() }
applyTheme(themeNow());
/* with no stored choice the system IS the choice, so follow it while it lasts.
   the first tap on the button is what makes the choice the player's. */
if(SYSLIGHT && SYSLIGHT.addEventListener){
  SYSLIGHT.addEventListener('change',()=>{ if(!store.theme){ applyTheme(themeNow()); repaintTheme() } });
}

/* ---- the two ways a track gets drawn ----
   both of them are handed `var(--token)` strings rather than resolved values,
   so `--fill` holds the reference and flipping the ground repaints the whole
   cluster without a single line of javascript re-running.

   cells: a fixed number of equal divisions, each either a colour or empty. only
   the day's strip wants this, and it wants it because ten nets are ten things —
   the discreteness IS the reading, and it is the same object that gets shared. */
/* the cells are REUSED, never rebuilt. this used to empty the strip and make ten
   fresh elements on every renderHud, which is why `.track > i`'s
   `transition:background` had never once run in the life of the game: a brand
   new element has no previous colour to ease from, so a net completing snapped
   from the day-ahead colour to its tier between two frames. keeping the same ten
   nodes alive is the whole of what makes that transition real. */
function paintCells(id,colors,label){
  const el=$(id); if(!el)return;
  while(el.children.length>colors.length) el.lastElementChild.remove();
  while(el.children.length<colors.length) el.appendChild(document.createElement('i'));
  colors.forEach((c,i)=>{
    const cell=el.children[i];
    cell.classList.toggle('on',!!c);
    if(c) cell.style.setProperty('--fill',c); else cell.style.removeProperty('--fill');
  });
  if(label)el.setAttribute('aria-label',label);
}
/* a run: one length, `pct` of the track, divided in proportion by the grows
   handed in. a segment with no grow is not drawn at all rather than drawn at
   nothing — see .tval.clear for why that distinction is the whole difference
   between an empty bar and a bar that looks broken. */
function paintRun(id,pct,segs,label){
  const el=$(id); if(!el)return;
  const run=el.firstElementChild;
  run.style.width=Math.max(0,Math.min(100,pct)).toFixed(1)+'%';
  run.innerHTML='';
  segs.forEach(s=>{
    if(!s.grow)return;
    const seg=document.createElement('i');
    seg.style.flexGrow=s.grow;
    seg.style.setProperty('--fill',s.col);
    run.appendChild(seg);
  });
  if(label)el.setAttribute('aria-label',label);
}

/* ================= the instrument cluster ================= */

/* three tracks of one form, on one line across the masthead: what is left of
   this net, where the net sits in the day's ten, and what is left of the clean
   line. one bar each, on the same ground, at the same height, divided by
   hairlines — see .track. what distinguishes them is what they are drawn IN:
   crossings in the thread palette, the strip in the tier ladder, turns in the
   one hue it owns.

   the tier colour used to be painted onto the crossings track too, so that
   crossing par restated the whole head at once. it read well and it cost the
   crossings instrument its own identity — three readings that were always the
   same colour are one reading with three shapes. the tier signal keeps the two
   places it belongs to, plus one frame: the crossings track completes in the
   colour of the tier just minted, which is the colour of the cell that is about
   to fill in the strip. a hand-off rather than a state. */

/* the ladder's colours live on TIERCOL. this only guards the case where a tier
   key arrives that TIERCOL has not been taught yet, and it answers with the
   BOTTOM rung: an unknown key means a net was played, and the conservative
   thing to say about a net you cannot grade is that it finished.
   it has to be re-pointed every time the ladder moves, and it has been missed
   once already: it answered hellblau, which became `clean`, and then tuerkis,
   which is `clean` again now. a guard that promotes is worse than no guard. it
   is written as the bottom rung's own token so the next move is one line, and
   it is a LITERAL rather than TIERCOL.done on purpose — this exists for the case
   where the table itself is the thing that cannot be trusted. */
const tierCol=t=>TIERCOL[t]||'--violett';
/* the tier this net would mint if it finished on the turn you are on — the same
   three rungs tierFor() awards, read a move early so the track can show you
   which band you are standing in. */
function liveTier(){
  const r=R(), {optimum,par}=netTargets();
  if(r.assisted) return 'done';                       // descent caps a net at done
  if(optimum<par && r.netMoves<=optimum) return 'perfect';
  return r.netMoves<=par ? 'clean' : 'done';
}

/* the bar DRAINS, left-anchored, and the bare track opening behind it on the
   right is what you have taken out. all three read that way round now — turns
   used to drain the other way, its live run pinned to the right edge and the
   spent turns opening from the left, which put two instruments on one line
   emptying towards each other.
   the signature carries init because two nets running back to back can share a
   crossing count while needing different track lengths. */
let lastT='', peakCross=1;
function setTension(cross,init){
  /* a cleared net holds this bay until the next one is built, exactly as it does
     in renderThreads — see holdGauge. clearNet has already advanced netIndex and
     zeroed netMoves by the time the beat starts, so anything walking in here is
     repainting an instrument against a board that is not on screen: a theme flip
     resets lastT on purpose and then calls refresh, which is how it gets in.
     the LENGTH is guarded as well as the segments because it is the other half of
     the same picture. this bay would land back on the same nothing it is already
     showing — a net clears at zero crossings — and the turns bay would not, and
     one rule over both is what keeps them a pair. */
  if($('threadrow').dataset.done) return;
  const sig=cross+'/'+init;
  if(sig===lastT) return; lastT=sig;
  /* the bar's length is what is left, measured against the worst this net has
     ever been rather than against where it started. you can make new crossings
     as readily as remove them, so a bar scaled to the opening count pins at
     full and stops moving the moment you do — and the moment it stops moving is
     exactly the moment you most need to see that you went backwards. */
  peakCross=Math.max(peakCross||1, cross, init);
  $('crossnum').textContent=cross;
  $('threadrow').style.width=(100*cross/peakCross).toFixed(1)+'%';
  $('crossbar').setAttribute('aria-label',cross+' of '+init+' crossings left');
}
/* ---- and then the two bays that read the NET simply stop, holding the last
   thing they said about it until the next net is built.

   they used to flood at this point, in the four colours the wordmark is made of,
   across the pair. the argument for it was that a cleared net is the game itself
   speaking and the flag is what the game wears when it speaks. the owner asked
   for it out (16 Aug 2026), and he is right about the instrument: a bay that has
   spent a whole net being a measurement should not answer the finish by turning
   into a mark. it also threw away the only reading the player wants at exactly
   the moment they want it — how the net they just finished actually went.

   what is left standing IS the finish, and it needs no decoration. the crossings
   bay is drained to nothing, which is what clearing a net means and which the
   `.run` note calls the strongest thing that instrument says. the turns bay is on
   the score the net ended with, numeral and bar agreeing, which is the same
   number the card about to arrive leads with.

   so this writes no colour, no width and no label. all it does is CLAIM the two
   bays, and the claim is the load-bearing half: clearNet has already advanced
   netIndex and zeroed netMoves by the time the beat starts, so anything that
   repaints a bay during it is drawing the NEXT net's opening budget beside a card
   announcing the one that just cleared — a full bar reading `n to perfect` over a
   board still showing the net you solved. setTension, renderThreads and the turns
   bar each check the claim; buildNet releases both together.

   the third bay is deliberately NOT claimed. `setmeter` draws the day's cells in
   the tier ladder, so it is where the tier this net just earned LANDS, and it is
   the one bay whose reading is about the day rather than about the net — holding
   it would hold the reward back at the moment it arrives.

   lastT is deliberately left standing too, so an incidental refresh cannot walk
   the crossings bay off the reading it stopped on. */
function holdGauge(){
  for(const id of ['threadrow','parrow']){ const r=$(id); if(r) r.dataset.done='1' }
}

/* ================= tangle ================= */

let members=[],threads=[],builtFor=-1,initialCross=1,spec=null,netPairs=[];

/* par, measured off the net you actually got rather than off the recipe that
   asked for it. the ingredient formula sat 1.5x-7x above the true optimum, so
   every simulated skill level minted `clean` on ~100% of nets and the three
   tiers collapsed into one.

   a thread's solution is its own horizontal lane — that construction already
   exists, in the pin placement above. so the honest cost of a net is how many
   neurons start outside their thread's band, plus one split per shared neuron.
   this also adapts to a lucky day, which the recipe could not. */
function lanePar(){
  const n=Math.max(1,threads.length-1);
  const laneY=t=>BH*.09+threads.indexOf(t)*(BH*.82/n);
  const band=(BH*.82/n)/2;
  let out=0;
  members.forEach(m=>{
    if(m.threads.length>1) return;            // shared neurons are counted below
    if(Math.abs(m.y0-laneY(m.threads[0]))>band) out++;
  });
  return Math.max(3,out+spec.shared);
}
/*@fam*/
/* ================= layout families =================

   ten nets a day, every day, and until now every one of them was the same
   picture: columns left to right, threads swapping order between neighbours.
   honest, readable, and after a week it is wallpaper. the fix is not decoration
   — it is that a net does not have to be a layer stack. real networks are not
   all layer stacks either, so the families below borrow shapes that exist: a
   stack with a waist (an autoencoder), a stack with skips (a residual block),
   a fan of experts, a lattice of filters, an embedding ring, a band of
   receptive fields. the shape earns the variety instead of dressing it.

   ---- the one idea every family is built on ----

   a family declares a SOLVED FIGURE: a slot for every neuron of every thread,
   chosen so that when each neuron sits in its own slot no two threads cross.
   the puzzle is then a PERMUTATION of that figure — d neurons swapped around
   their neighbours — and solving it is putting them back.

   three things fall out of that, and all three are the reason it is built this
   way rather than as seven separate placement routines:

   1. SOLVABILITY IS BY CONSTRUCTION, not by luck. the zero-crossing
      arrangement is not searched for, it is the thing the generator started
      from; every neuron reaches it by moving to its own slot. the salt-retry
      loop only picks among boards that are already solvable, so it can never
      be what makes a net finishable. pinned neurons are placed AT their slot,
      never displaced, so an immovable neuron is one the solution wanted there
      anyway — the same argument the layered builder used, now enforced for
      every shape at once. famPlan additionally refuses any figure whose own
      solved form is not crossing-free (famCrossFree), so a family with a
      geometry bug cannot ship a net; it falls back to the stack.

   2. PAR IS AN INPUT, NOT AN ESTIMATE. lanePar guessed the cost of a net by
      counting neurons outside a lane, and guessed badly — one net wanted 3
      turns where its neighbours wanted 12. here the generator is TOLD how many
      neurons to displace, so the cost of the named solution is known exactly:
      d drags, plus one split and one drag for each superposed neuron, minus
      the finishing action, which is free. par is a proved-reachable upper
      bound rather than a geometric hunch. the offline solver that is landing
      separately can only lower it, and when it does, par stops being a design
      knob and becomes a measurement — this is the honest thing to ship until
      then, and it is the first version of par a player could actually verify.

   3. THE BOARD IS ALWAYS A COMPOSITION. the scrambled start uses exactly the
      same set of positions as the solved figure, so a tangled net is a
      disturbed pattern rather than a scatter — and neuron spacing is a
      property of the figure, not an accident of where the dice fell. every
      family is gated at FAM_SEP, which is far above the MIN_SEP floor
      separateNodes enforces; a composition wants much more room than the
      minimum that stops two circles overlapping.

   ---- orientation ----
   the plate turns a quarter turn on a tall window. the stack families read
   top-to-bottom there instead of left-to-right, which is how a net is usually
   drawn anyway; the ring and the lattice are orientation-agnostic outright;
   the fan and the band open sideways from a hub off the short edge. no family
   depends on which way is along. */

const FAM_SEP=64;          // the clearance a *composition* wants, not the 38 that stops overlap

/* ---- the segments a thread draws ----
   a thread used to be a path and nothing else, so its segments were "every
   consecutive pair" and every crossing loop in the game spelled that out inline
   as `i` and `i+1`. from v9 it can also carry a CHORD — one extra edge, from a
   loose end back to an interior neuron of its own run — and there is no longer
   a formula for which pairs are joined. so the joins are listed instead, once,
   and every loop that walks a thread walks this list.

   they are INDICES into the node list, never node objects. the node list is
   what the rest of the game addresses a neuron by: splitNode replaces a
   superposed neuron with one of its halves in place, famCost and famGreedy do
   the same to price it, and an index survives all three where a captured object
   would go stale. it is also why the chord cannot be expressed by repeating a
   node in the list — a repeat would be counted, dragged, split and freed twice.

   the chord is [a,b] with b>a+1, and one of a,b is always an END of the run.
   that is not arbitrary: a thread with an end-anchored chord is still a single
   unbroken walk — down the run and back along the chord — so it keeps drawing
   as ONE polyline, which is what the board, the release runner and the settle
   are all built on. an interior-to-interior chord would leave four odd-degree
   neurons and need a second element per thread. see famChord. */
function segList(len, chord){
  const s=[];
  for(let i=0;i<len-1;i++) s.push([i,i+1]);
  if(chord) s.push(chord);
  return s;
}
/* two segments-of-polylines test, on hypothetical positions rather than the
   live board — used to prove a family's solved figure before it is allowed to
   generate anything. `chords` is the parallel list of one-per-thread chords, or
   nothing before v9.
   a thread is now checked against ITSELF as well as against the others: a run
   with a chord on it can meet its own line, which a flat lane never could. that
   pass costs nothing on a net with no chords — a path's segments only ever meet
   at the neuron they share, which the identity test already skips — so it runs
   unconditionally rather than behind a flag that could disagree with the board. */
function famCrossFree(polys,chords){
  for(let i=0;i<polys.length;i++){
    const A=polys[i], SA=segList(A.length, chords&&chords[i]);
    for(let a=0;a<SA.length;a++)for(let b=a+1;b<SA.length;b++){
      const p1=A[SA[a][0]],p2=A[SA[a][1]],q1=A[SA[b][0]],q2=A[SA[b][1]];
      if(p1===q1||p1===q2||p2===q1||p2===q2)continue;
      if(segX(p1,p2,q1,q2))return false;
    }
    for(let j=i+1;j<polys.length;j++){
      const B=polys[j], SB=segList(B.length, chords&&chords[j]);
      for(let a=0;a<SA.length;a++)for(let b=0;b<SB.length;b++){
        const p1=A[SA[a][0]],p2=A[SA[a][1]],q1=B[SB[b][0]],q2=B[SB[b][1]];
        if(p1===q1||p1===q2||p2===q1||p2===q2)continue;
        if(segX(p1,p2,q1,q2))return false;
      }
    }
  }
  return true;
}
/* how far a point stands off a segment. the chord's clearance test, and the one
   reason a chord is ever refused on a shape that could geometrically hold it. */
function segDist(p,a,b){
  const vx=b.x-a.x, vy=b.y-a.y, L=vx*vx+vy*vy;
  let t=L?((p.x-a.x)*vx+(p.y-a.y)*vy)/L:0;
  t=Math.max(0,Math.min(1,t));
  return Math.hypot(p.x-(a.x+vx*t), p.y-(a.y+vy*t));
}

/* a stadium track — two straights and two half turns — walked at equal arc
   length, so neurons space evenly however many there are. munich's own
   olympiastadion oval, and the only closed curve on the board that uses a
   1040x580 plate properly. */
const RINGBOX={x0:70,x1:970,y0:60,y1:520,r:150};
function trackLen(){const B=RINGBOX;return 2*((B.x1-B.x0)-2*B.r)+2*((B.y1-B.y0)-2*B.r)+2*Math.PI*B.r}
function trackPt(u){
  const B=RINGBOX, lx=(B.x1-B.x0)-2*B.r, ly=(B.y1-B.y0)-2*B.r, q=Math.PI/2*B.r, P=trackLen();
  u=((u%P)+P)%P;
  const arc=(cx,cy,a0)=>{const a=a0+(u/B.r);return{x:cx+Math.cos(a)*B.r,y:cy+Math.sin(a)*B.r}};
  if(u<lx) return {x:B.x0+B.r+u, y:B.y0};                       u-=lx;
  if(u<q)  return arc(B.x1-B.r,B.y0+B.r,-Math.PI/2);            u-=q;
  if(u<ly) return {x:B.x1, y:B.y0+B.r+u};                       u-=ly;
  if(u<q)  return arc(B.x1-B.r,B.y1-B.r,0);                     u-=q;
  if(u<lx) return {x:B.x1-B.r-u, y:B.y1};                       u-=lx;
  if(u<q)  return arc(B.x0+B.r,B.y1-B.r,Math.PI/2);             u-=q;
  if(u<ly) return {x:B.x0, y:B.y1-B.r-u};                       u-=ly;
  return arc(B.x0+B.r,B.y0+B.r,Math.PI);
}

/* each family answers one question: where does thread k's i-th neuron belong
   when the net is solved? `g` is the grouping the scramble is allowed to
   permute within — keeping a swap inside its own layer, ring or band is what
   keeps a disturbed figure still legible as that figure. */
const FAMILIES={

  /* ---- the stack ----------------------------------------------------------
     columns across, one neuron per thread per column: the picture the game
     shipped with, kept because it is the clearest thing to learn on and it is
     the only family the tutorial ever sees.
     SOLVED: every thread flat in its own lane. distinct horizontal lines are
     parallel and never meet, so the figure is crossing-free for any T and L. */
  layered:{ minT:2, minL:3, cyc:3, slots(T,L,tut){
    const x0=BW*.10,x1=BW*.90,ytop=tut?BH*.46:BH*.14,ybot=BH*.88,s=[],g=[];
    for(let k=0;k<T;k++){s[k]=[];g[k]=[];for(let i=0;i<L;i++){
      s[k][i]={x:x0+(x1-x0)*(L>1?i/(L-1):.5), y:ytop+(ybot-ytop)*(T>1?k/(T-1):.5)};
      g[k][i]='c'+i;
    }}
    return {s,g};
  }},

  /* ---- the hourglass (an autoencoder) -------------------------------------
     the same columns, but each layer is spaced by its own width and the middle
     ones pinch: a bottleneck drawn rather than described. a layer with fewer
     seats than features is exactly why a real net superposes, so this is the
     family that most deserves its shared neurons — and they land in the waist,
     because the nearest-neighbour rule picks the tightest pair on the board.
     SOLVED: thread k keeps seat k in every column. seat spacing is positive
     everywhere, so y_k(i) < y_k'(i) for k<k' at every column; two segments
     ordered at both ends cannot cross. the pinch is capped so the waist never
     closes past FAM_SEP — a bottleneck you cannot get a finger into is not a
     bottleneck, it is a bug. */
  hourglass:{ minT:2, minL:4, cyc:3, slots(T,L){
    const x0=BW*.10,x1=BW*.90,ytop=BH*.12,ybot=BH*.90,mid=(ytop+ybot)/2;
    const full=(ybot-ytop)/Math.max(1,T-1);
    const waist=Math.max(.42, FAM_SEP/full);
    const s=[],g=[];
    for(let k=0;k<T;k++){s[k]=[];g[k]=[];for(let i=0;i<L;i++){
      const u=L>1?Math.abs(2*i/(L-1)-1):1;                 // 0 at the waist, 1 at the ends
      const step=full*(waist+(1-waist)*Math.pow(u,1.35));
      s[k][i]={x:x0+(x1-x0)*(L>1?i/(L-1):.5), y:mid+(k-(T-1)/2)*step};
      g[k][i]='c'+i;
    }}
    return {s,g};
  }},

  /* ---- the residual stack -------------------------------------------------
     threads that skip a layer, so the line jumps the block instead of passing
     through it. lengths differ, columns hold different numbers of neurons, and
     long bold segments cut across the picture — the only stack family that
     does not read as a rectangle.
     SOLVED: lanes again. a thread present in a subset of columns still lays
     flat at its own height, and distinct horizontals never meet, so dropping
     columns cannot break the argument. the two end columns are never dropped,
     so every thread still spans the plate. */
  residual:{ minT:2, minL:5, cyc:3, slots(T,L,tut,rnd){
    /* THE RUN IS DRAWN WIDER THAN THE RAMP ASKED, and each thread skips back
       down to it. dropping columns out of L was the obvious way to write this
       and it quietly undercut the ladder: at nodes:5 every thread came out four
       deep, so a residual net stood 15 neurons where its rung asks 19, and it
       is the only family that ever came out smaller than the rung it was drawn
       for — 55 nets over a 60-day sweep, 5.9 neurons short on average. it is
       what put a perfect of 5 at net 6 behind a perfect of 9 at net 5.
       the skips ARE the family and they stay. spanning L+2 and dropping one or
       two keeps every one of them — lengths still differ, columns still hold
       different numbers of neurons, the long segments still cut across — while
       a thread never falls below the L its rung asked for. */
    const span=L+(L>=6?2:1);
    const x0=BW*.08,x1=BW*.92,ytop=BH*.13,ybot=BH*.89;
    const X=i=>x0+(x1-x0)*(span>1?i/(span-1):.5), Y=k=>ytop+(ybot-ytop)*(T>1?k/(T-1):.5);
    const s=[],g=[];
    for(let k=0;k<T;k++){
      const want=Math.min(span-L, L>=6?1+Math.floor(rnd()*2):1), drop=new Set();
      for(let q=0;q<24 && drop.size<want;q++) drop.add(1+Math.floor(rnd()*(span-2)));
      const keep=[]; for(let i=0;i<span;i++) if(!drop.has(i)) keep.push(i);
      s[k]=keep.map(i=>({x:X(i),y:Y(k)}));
      g[k]=keep.map(i=>'c'+i);
    }
    return {s,g};
  }},

  /* ---- the lattice (a convolution) ----------------------------------------
     a rigid square grid with equal spacing both ways, sized to the net and
     centred on the plate, and the scramble is global rather than per-column —
     so a thread can hold two cells in one column and none in the next, and the
     picture reads as weaving through a field rather than passing through
     layers. the one family that looks identical whichever way up the board is.
     SOLVED: thread k takes row k. distinct horizontals, again. */
  lattice:{ minT:2, minL:3, cyc:4, slots(T,L){
    const cell=Math.min(820/Math.max(1,L-1), 450/Math.max(1,T-1), 175);
    const cx=BW/2, cy=BH/2, s=[], g=[];
    for(let k=0;k<T;k++){s[k]=[];g[k]=[];for(let i=0;i<L;i++){
      s[k][i]={x:cx+(i-(L-1)/2)*cell, y:cy+(k-(T-1)/2)*cell};
      g[k][i]='all';
    }}
    return {s,g};
  }},

  /* ---- the fan (a mixture of experts) -------------------------------------
     a hub off the bottom edge and one ray per feature, neurons stepping
     outward along it. it is the strahlenkranz the rest of the game is already
     drawn in, and the scramble swaps neurons between rays at the same radius,
     so a disturbed fan pinwheels.
     SOLVED: thread k lies on the ray at angle t_k. rays from a common hub meet
     only at the hub, and the innermost radius is 200, so distinct rays are
     disjoint over the whole board. the hub sits off the plate so no thread has
     to come near the convergence. */
  fan:{ minT:3, minL:3, cyc:3, local:true, slots(T,L){
    const hx=BW/2, hy=700, A=44*Math.PI/180, r0=200, r1=660, s=[], g=[];
    for(let k=0;k<T;k++){
      const th=T>1?(-A+2*A*k/(T-1)):0;
      s[k]=[];g[k]=[];
      for(let i=0;i<L;i++){
        const r=r0+(r1-r0)*(L>1?i/(L-1):.5);
        s[k][i]={x:hx+Math.sin(th)*r, y:hy-Math.cos(th)*r};
        g[k][i]='r'+i;
      }
    }
    return {s,g};
  }},

  /* ---- the band (nested receptive fields) ---------------------------------
     concentric arcs over a hub off the bottom edge — one band per feature,
     neurons stepping around it. solved it is a rainbow; disturbed, threads
     hop between bands and the arcs braid.
     SOLVED: thread k is inscribed in the circle of radius r_k. the chord
     between neighbours on that circle dips no closer to the hub than
     r_k*cos(step/2), so the bands stay strictly nested as long as
     r_k < r_(k+1)*cos(step/2). the angular span is narrowed when there are few
     neurons — three neurons over a half turn is a shallow V that would cut
     inside the band below it — and famCrossFree checks the finished figure
     anyway rather than trusting the inequality. */
  arcs:{ minT:2, minL:3, cyc:3, local:true, slots(T,L){
    const hx=BW/2, hy=600, r1=540;
    const S=Math.min(130, 44*Math.max(1,L-1))*Math.PI/180;
    /* the innermost band is held at half the outermost. it used to start at
       170 against an outer 540, and three bands that far apart stopped reading
       as one figure the moment anything moved between them — a neuron hopping
       from the inside to the outside drew a 370-unit near-vertical spike, and
       the picture was a scatter with two arcs left in it. */
    const r0=Math.max(r1*.5, FAM_SEP*Math.max(1,L-1)/S);
    const s=[],g=[];
    for(let k=0;k<T;k++){
      const r=r0+(r1-r0)*(T>1?k/(T-1):.5);
      s[k]=[];g[k]=[];
      for(let i=0;i<L;i++){
        const p=-S/2+S*(L>1?i/(L-1):.5);
        s[k][i]={x:hx+Math.sin(p)*r, y:hy-Math.cos(p)*r};
        g[k][i]='a'+i;
      }
    }
    return {s,g};
  }},

  /* ---- the ring (an embedding table) --------------------------------------
     every neuron on one closed track and every thread a chord diagram across
     it: the busiest start in the set, and the most dramatic resolution, since
     solving it empties the middle of the board completely.
     SOLVED: each thread owns a contiguous run of track positions. two disjoint
     arcs of a convex curve are separated by a straight line — the one through
     both gaps between them — and a polyline through points on an arc stays
     inside that arc's convex hull, so no two threads' lines can meet. the run
     is contiguous, not merely disjoint, which is what makes the hulls
     separable rather than interleaved. */
  ring:{ minT:2, minL:3, cyc:4, slots(T,L,tut,rnd){
    const P=trackLen(), N=T*L, u0=rnd()*P, s=[], g=[];
    for(let k=0;k<T;k++){
      s[k]=[];g[k]=[];
      for(let i=0;i<L;i++){
        s[k][i]=trackPt(u0+P*(k*L+i)/N);
        g[k][i]='ring';
      }
    }
    return {s,g};
  }}
};

/* ---- which family, and when ----
   layout variety rides the same ramp difficulty does. RAMP adds one ingredient
   at a time — length, a third feature, a shared neuron, a pin, width — and one
   family unlocks per net alongside it, so a day opens on the shape you already
   know and earns the strange ones. net 0 can only ever be the stack: somebody
   learning what a crossing is should not be handed a chord diagram, and that
   is true whether or not they have finished the tutorial, so it is keyed on
   the net index rather than on player state.

   the pool is filtered by what the net's own size can actually be drawn as —
   a fan of two rays is a letter V, a hourglass needs columns to pinch — so a
   family is never drawn only to be thrown away by famPlan. that matters most
   at nets 1 and 2, where two threads leave few shapes standing.

   within a day the order is drawn from the date, no family runs twice in a
   row, and none appears more than twice in the ten. the no-repeat rule stands
   down when it would leave a single candidate, because a rule that forces the
   answer is not variety — it is a different fixed sequence. */
const FAM_LIST=['layered','arcs','hourglass','lattice','ring','fan','residual'];
const FAM_FROM={layered:0, arcs:1, hourglass:1, lattice:2, ring:3, fan:4, residual:5};
/* ---- and where a family has to STOP ----
   FAM_FROM says a shape needs a certain size before it reads as itself. this
   says the opposite thing at the other end: a shape has to be able to PRICE the
   net it is drawn for, and two of them cannot price the last one.

   famTarget asks net 9 for a 15-turn route. measured over 40 days: hourglass,
   lattice, layered and residual reach it every time. ring reaches it on none of
   them and fan on one in seven — and the two miss for opposite reasons, which
   is why one rule covers both and neither is a scramble-budget problem.
   ring is BLOCKED, not cheap. lift the v11 crossing ceiling and it prices net 9
   correctly on every day — by drawing 67 crossings, which is precisely the mat
   `dense:'cap'` was added to stop. ring at the deep end can be honestly priced
   or it can be legible, and it cannot be both.
   fan is simply cheap. no ceiling is near it — 15 crossings against a cap of 29
   — and neither lifting the cap nor a ten-fold scramble budget moves it off a
   route of 11. threads radiating from a point are cheap to walk back.
   so the last net of the day is drawn from the four shapes that can carry it.
   both families keep everything up to net 8, which is most of the day. */
const FAM_UNTIL={ring:8, fan:8};
let _famDay=null,_famSeq=null;
function famSeq(day){
  if(_famDay===day) return _famSeq;
  const rnd=mulberry32(fnv(day+':layout')), seq=[], used={};
  /* the day's own rules, not whatever net was built last: this decides a whole
     day's layouts in one pass and netSpec reads the ramp table out of them. */
  const rules=genRules(genFor(day));
  for(let i=0;i<32;i++){
    const s=netSpec(i,rules), T=s.threads, L=Math.max(3,s.nodes);
    const all=FAM_LIST.filter(f=>FAM_FROM[f]<=i && i<=(FAM_UNTIL[f]??99)
                                 && T>=FAMILIES[f].minT && L>=FAMILIES[f].minL);
    let pool=all.filter(f=>f!==seq[i-1] && (i>=10 || (used[f]||0)<2));
    if(pool.length<2) pool=all.filter(f=>i>=10 || (used[f]||0)<2);
    if(!pool.length) pool=all;
    const f=pool[Math.floor(rnd()*pool.length)];
    seq.push(f); used[f]=(used[f]||0)+1;
  }
  _famDay=day; _famSeq=seq;
  return seq;
}
const famFor=(day,i)=>famSeq(day)[Math.min(i,31)];

/* the par each net is aiming at — a designed curve rather than whatever the
   dice produced. it tracks the shipped lane-par ramp (3,4,4,6,6,6,10,10,12,20,
   measured across the layered days) without its noise: that ramp wanted 3
   turns for one net and 12 for its neighbour on the same rung.
   the generator disturbs the figure until the solution genuinely costs this
   much, so the number on the scorecard is a property the puzzle was built to
   have rather than a reading taken off it afterwards. */
const FAM_PAR=[3,4,5,6,7,8,10,11,13,15];
const famTarget=i=>i<FAM_PAR.length?FAM_PAR[i]:15+Math.floor((i-9)*1.5);

/* ---- the weave: a board that opens as a PATTERN ------------------------------
   the scramble below is a good difficulty engine and a bad picture. it rotates
   two or three seats in one group at a time, keeps the rotation when it costs a
   turn, and repeats until par is met — so what the player is handed is a pile of
   locally-random swaps. measured on any net past the fourth that reads as a mat,
   and the complaint it produced is the accurate one: more crossings made the
   board messier without making it harder.

   a WEAVE is the opposite move. it is a single permutation applied across the
   whole figure at once, so every neuron is displaced by the same RULE rather
   than by its own dice roll, and the opening board is a design — a diagonal
   braid, a chevron, a rosette — rather than a tangle. it is still exactly a
   permutation of the solved figure's own seats, so the guarantee this whole
   block rests on is untouched: the zero-crossing arrangement is where the
   generator started and every neuron reaches it by going to its own slot.

   IT IS ONE MECHANISM AND NOT SEVEN. the permutation is indexed by (thread,
   position) — order[k][i] — which every family has, so nothing here knows what
   a column is and no family is special-cased. what each family makes of it is
   its own geometry's business: the stacks braid, the lattice weaves, the ring
   interleaves its runs into a rosette, the polar families pinwheel.

   the shift at position i is the whole vocabulary. k(i)=a*i walks one seat
   further along at every step and draws a diagonal; folding that at the middle
   draws a chevron; running it through a sine draws a wave; alternating it draws
   a plait. amplitude `a` is the knob, and it is what the caller turns to buy
   turns without buying mess. */
const WEAVES={
  twist:  (i,L,a)=> a*i,
  chevron:(i,L,a)=> a*(i<=(L-1)/2 ? i : L-1-i),
  wave:   (i,L,a)=> Math.round(a*Math.sin(2*Math.PI*i/Math.max(1,L-1))*1.5),
  plait:  (i,L,a)=> a*(i%2)
};
const WEAVE_LIST=['twist','chevron','wave','plait'];
/* apply one weave to the figure, in place.

   at each position index the movable neurons are collected in their own across
   order and their COORDINATES are cycled by the shift the weave asks for.

   a PINNED neuron is the one thing held out. it sits exactly on its own slot by
   construction, and that is the whole reason a family net carrying pins is
   still solvable — move one and the figure it is a permutation of stops being
   reachable. so the weave flows around it and leaves a hole.

   a MERGED neuron is NOT held out, and getting that wrong is what made the
   deepest boards illegible on the first pass. it stands in two threads' lists,
   so a loop over (thread, position) reaches it twice and the second write
   decides where it lands — which is why it was skipped outright to begin with.
   skipping is the expensive fix: superpositions plus pins came to 23% of the
   neurons on net 9, and a quarter of a pattern punched out is not a pattern.
   writing it ONCE costs nothing instead. it weaves at the first position it
   appears at and is passed over afterwards, which is what `placed` is for, and
   the holes on the deepest net fall back to the pins alone.

   it consumes no randomness — the caller picks the weave and the amplitude —
   so a weave is a deterministic function of the plan it is handed. */
function famWeave(order, name, amp){
  const f=WEAVES[name]; if(!f||!amp) return;
  const L=Math.max(...order.map(o=>o.length));
  const placed=new Set();
  for(let i=0;i<L;i++){
    const seats=[];
    for(let k=0;k<order.length;k++){
      const n=order[k][i];
      if(n && !n.pinned && !placed.has(n) && !seats.includes(n)) seats.push(n);
    }
    if(seats.length<2) continue;
    seats.forEach(n=>placed.add(n));
    const home=seats.map(n=>({x:n.x, y:n.y}));
    const S=seats.length, sh=((Math.round(f(i,L,amp))%S)+S)%S;
    if(!sh) continue;
    seats.forEach((n,j)=>{ n.x=home[(j+sh)%S].x; n.y=home[(j+sh)%S].y });
  }
}
/* one disturbance: take a few seats in the same layer and rotate what sits in
   them. a rotation is a derangement, so every neuron picked genuinely ends up
   somewhere that is not its own slot. it hands back what it did, because the
   caller prices the result and puts it back if it bought nothing.

   `local` decides whether a rotation may reach across a layer or only between
   next-door seats. the two polar families need it: their seats are rings at
   different radii, and a neuron sent from the innermost band to the outermost
   draws a 270-unit spike straight through every band between them, which does
   not read as a disturbed set of arcs — it reads as a scatter with some arcs
   left in it. a grid can take the long throw, and the lattice and the ring
   want it, because a chord across the whole figure is their character. */
function famStep(live,cyc,local,rnd){
  const byG=new Map();
  live.forEach(n=>{if(n.pinned)return;
                   const a=byG.get(n.gid)||[]; a.push(n); byG.set(n.gid,a)});
  const gids=[...byG.keys()].sort();
  gids.forEach(g=>byG.get(g).sort((a,b)=>a.oi-b.oi));
  /* the runs of k seats in a row that are all still free. a local rotation has
     to be adjacent in the LAYER, not merely adjacent among whatever is left —
     taking neighbours out of a shrinking list quietly reunites seat 0 with
     seat 4 once the three between them have gone, which is the long spike
     local exists to stop. */
  const runs=(arr,k)=>{
    const out=[];
    for(let s=0;s+k<=arr.length;s++){
      let ok=true; for(let j=0;j<k;j++) if(arr[s+j].moved){ok=false;break}
      if(ok) out.push(s);
    }
    return out;
  };
  const usable=gids.filter(g=>{
    const arr=byG.get(g);
    return local ? runs(arr,2).length>0 : arr.filter(n=>!n.moved).length>=2;
  });
  if(!usable.length) return null;
  const arr=byG.get(usable[Math.floor(rnd()*usable.length)]);
  const free=arr.filter(n=>!n.moved);
  const want=Math.min(2+Math.floor(rnd()*Math.max(1,cyc-1)), free.length);
  let pick=null;
  if(local){
    for(let k=want;k>=2 && !pick;k--){
      const r=runs(arr,k);
      if(r.length){ const s=r[Math.floor(rnd()*r.length)]; pick=arr.slice(s,s+k) }
    }
  } else {
    const p=free.slice(); pick=[];
    for(let j=0;j<want;j++) pick.push(p.splice(Math.floor(rnd()*p.length),1)[0]);
  }
  if(!pick||pick.length<2) return null;
  const px=pick.map(n=>n.x), py=pick.map(n=>n.y), k=pick.length;
  pick.forEach((n,j)=>{n.x=px[(j+1)%k]; n.y=py[(j+1)%k]; n.moved=true});
  return {pick, px, py};
}

/* ---- where a thread's chord goes, if it goes anywhere ----
   `fig` is the FINISHED figure: every thread's neurons at the coordinates they
   hold when the net is solved and every superposition parted. `chords` is the
   list built so far, so each new edge is measured against the ones already
   accepted as well as against every run.

   the candidates are the end-anchored pairs, and they are tried biggest loop
   first with the outright closing edge last. biggest first because the loop is
   the point: a chord that cuts off two neurons draws a cell you can see a
   neuron sitting inside, and a chord that cuts off one draws a sliver. closing
   edge last because a thread that still has a loose end reads as a thread with
   a loop ON it, where a fully closed one reads as a ring — a different object,
   worth having but not worth having first.

   an edge is taken only if it clears every neuron on the board by the same
   clearance two neurons keep from each other, and crosses nothing already
   drawn. the clearance test is doing two jobs at once and both matter: it is
   what refuses a chord lying flat along a straight run — the four lane
   families draw their threads collinear, so a chord there IS the run, an
   invisible edge that segX cannot even report because parallel segments never
   report — and it is the hourglass's own waist argument, that a gap you cannot
   get a neuron into is not a gap. what survives is a loop with room in it.

   first fit wins and nothing is drawn at random, so this consumes no numbers
   from the stream: a v9 figure is v8's figure with edges added to it, not a
   different draw. */
function famChord(fig, chords, k){
  const o=fig[k], n=o.length;
  if(n<3) return null;
  const cand=[];
  for(let j=2;j<n;j++) cand.push([0,j]);           // the head tied back in
  for(let i=n-3;i>=1;i--) cand.push([i,n-1]);      // the tail tied back in
  cand.sort((p,q)=>{
    const sp=p[1]-p[0], sq=q[1]-q[0];
    return (sp===n-1?1:0)-(sq===n-1?1:0) || sq-sp || p[0]-q[0];
  });
  for(const c of cand){
    const A=o[c[0]], B=o[c[1]];
    let ok=true;
    for(let i=0;i<fig.length && ok;i++) for(const p of fig[i]){
      if(p===A||p===B) continue;
      if(segDist(p,A,B)<MIN_SEP){ ok=false; break }
    }
    for(let i=0;i<fig.length && ok;i++){
      const P=fig[i], S=segList(P.length, chords[i]);
      for(const [u,v] of S){
        const q1=P[u], q2=P[v];
        if(q1===A||q1===B||q2===A||q2===B) continue;
        if(segX(A,B,q1,q2)){ ok=false; break }
      }
    }
    if(ok) return c;
  }
  return null;
}

/* the whole placement for one net, as plain data: no svg, no dom, no board
   state, so the offline harness runs the very same function the browser does
   rather than a copy of it that can drift. returns null when the family will
   not fit this net — too tight to grab, off the plate, or a solved figure that
   is not actually clean — and the caller falls back to the stack. */
/* ---- how many loops the opening may carry, under `chord:'late'` ----
   NOT whether: net 0 is always the stack and a stack's threads are collinear,
   so famChord can never give one an edge anyway, which leaves net 1 as the only
   net a whether-gate could reach — and gating it there was tried and measured
   worse. net 1 is two threads of four neurons; strip its chords and it comes out
   at exactly 3 crossings and a 2-turn route on every day of a 193-day range, the
   same puzzle every morning forever.
   what the measurement does support is a count. net 1 carries a mean of 2.0
   chords — BOTH its threads, every day, because its family pool at that index is
   arcs and hourglass and both of those curve — against 0.5 to 1.3 everywhere
   below it. so the second net of the day is the most looped net in the day. one
   chord before net 2 keeps the idea and drops the pile-up. */
const CHORD_FROM=2, CHORD_OPEN=1;
/* the crossing ceiling, from `dense:'cap'`. it is tied to the net's own par
   target rather than being a table of its own, so it tracks whatever curve
   famTarget draws and cannot drift away from it. 1.8 turns' worth of crossings
   plus two: measured over 193 days it sits above the median opening board at
   every net index and under the ninetieth percentile from net 3 down, which is
   exactly the tail — the ring and lattice draws — that made the same net index
   a different game on different mornings. */
const famCeil=want=>Math.round(want*1.8)+2;
function famPlan(fam,T,L,shared,pinned,want,tut,rnd,idx){
  const F=FAMILIES[fam];
  if(!F || T<F.minT || L<F.minL) return null;
  const xCap = GEN_RULES.dense==='cap' ? famCeil(want) : Infinity;
  const {s,g}=F.slots(T,L,tut,rnd);
  const nodes=[], order=[];
  for(let k=0;k<T;k++){
    if(!s[k] || s[k].length<2) return null;
    order[k]=[];
    for(let i=0;i<s[k].length;i++){
      // oi is the seat's place in its own group's natural order — the row in a
      // column, the band in an arc, the ray at a radius. it is always the
      // thread index, because a group is one value of i across every k.
      const n={hx:s[k][i].x, hy:s[k][i].y, x:s[k][i].x, y:s[k][i].y, oi:k,
               gid:g[k][i], t:[k], pinned:false, merged:false, gone:false, alt:null};
      nodes.push(n); order[k].push(n);
    }
  }
  // gate: on the plate, far enough apart to grab on a phone, and provably clean
  let minSep=Infinity;
  for(let a=0;a<nodes.length;a++){
    const A=nodes[a];
    if(Math.abs(clampX(A.hx)-A.hx)>.5 || Math.abs(clampY(A.hy)-A.hy)>.5) return null;
    for(let b=a+1;b<nodes.length;b++)
      minSep=Math.min(minSep, Math.hypot(A.hx-nodes[b].hx, A.hy-nodes[b].hy));
  }
  if(minSep<FAM_SEP) return null;
  if(!famCrossFree(order.map(o=>o.map(n=>({x:n.hx,y:n.hy}))))) return null;

  /* superposition, placed where the figure is tightest: the two neurons that
     become one are the closest pair the shape offers, so the fold reads as the
     layer running out of room rather than as two dots chosen at random. the
     slot the absorbed neuron vacates stays empty, which is the hole the split
     later fills back in. */
  const pairs=[];
  for(let a=0;a<nodes.length;a++)for(let b=a+1;b<nodes.length;b++){
    if(nodes[a].t[0]===nodes[b].t[0]) continue;      // one thread cannot superpose with itself
    pairs.push([Math.hypot(nodes[a].hx-nodes[b].hx, nodes[a].hy-nodes[b].hy), nodes[a], nodes[b]]);
  }
  /* the threshold is relative to the closest pair that COULD fold, not to the
     closest pair on the board — in a wide stack the nearest neighbours are two
     neurons of the same thread, and measuring against those left some nets
     with no candidate at all and quietly dropped their superposition. */
  const tight=pairs.length?Math.min(...pairs.map(p=>p[0])):0;
  /* a widening band, from v5. the tight band is the right FIRST answer — a
     superposition should read as the layer running out of room, not as two
     dots chosen at random — but when it runs out of disjoint candidates the
     net silently got fewer shared neurons than its ramp row asked for.
     measured across 600 family nets: 1.3%, all of them net 7, which is the one
     row whose whole step is the second shared neuron. so widen rather than
     give up, and take the closest pair still standing. */
  let merges=0;
  const bands = GEN_RULES.merge==='widen' ? [1.35,2,3,6,Infinity] : [1.35];
  for(const w of bands){
    if(merges>=shared) break;
    const near=pairs.filter(p=>p[0]<=tight*w).map(p=>[p[1],p[2]]);
    for(let i=near.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[near[i],near[j]]=[near[j],near[i]]}
    for(const [A,B] of near){
      if(merges>=shared) break;
      if(A.gone||B.gone||A.merged||B.merged) continue;
      const ka=A.t[0], kb=B.t[0];
      if(ka===kb) continue;
      if(order[ka].includes(B) || order[kb].includes(A)) continue;
      order[kb][order[kb].indexOf(B)]=A;
      A.t.push(kb); A.merged=true; A.alt={x:B.hx,y:B.hy};
      B.gone=true; merges++;
    }
  }

  /* ---- and now the chords, from v9 ----
     the figure they are measured against is the one the player ENDS on: every
     superposition parted, both halves standing on their own slots. a merged
     neuron is in two threads' lists at one slot, and the thread that lent it
     the seat gets that seat back — n.alt, the hole the merge left — the moment
     the pair is split. measuring a chord against the merged figure would be
     measuring it against a board nobody finishes on, and on a lane family it
     would pass: a borrowed seat bends a straight run, and the bend goes away
     again the instant the player does the one thing the net is about.
     the whole figure is re-proved with its chords in before any of it ships.
     it cannot fail — every chord was checked against this exact drawing as it
     was chosen — and it is asked anyway, because "cannot fail" is the sentence
     that precedes an unsolvable board. failing drops the chords rather than the
     family: a net without them is still a good net, and it is v8's exactly. */
  let chords=null;
  if(GEN_RULES.chord==='one' || GEN_RULES.chord==='late'){
    const fin=order.map((o,k)=>o.map(n=>
      (n.merged && n.t[1]===k && n.alt) ? {x:n.alt.x, y:n.alt.y}
                                        : {x:n.hx, y:n.hy}));
    chords=order.map(()=>null);
    /* `late` allows CHORD_OPEN loops before CHORD_FROM and as many as the figure
       will take after it. an idx of nothing — the offline harnesses, which price
       a plan without a position in a day — counts as late, because a plan asked
       for on its own is not the opening of anybody's morning.
       the cap is applied as the chords are CHOSEN rather than trimmed off
       afterwards, because famChord measures each candidate against the chords
       already accepted: dropping one after the fact would leave the rest proved
       against a figure that is not the one being shipped. */
    const room = (GEN_RULES.chord==='late' && idx!=null && idx<CHORD_FROM) ? CHORD_OPEN : order.length;
    let put=0;
    for(let k=0;k<order.length;k++){
      if(put>=room) break;
      chords[k]=famChord(fin, chords, k);
      if(chords[k]) put++;
    }
    if(!chords.some(c=>c) || !famCrossFree(fin, chords)) chords=null;
  }
  const live=nodes.filter(n=>!n.gone);

  /* a pin sits exactly on its own slot and is never scrambled.
     that is deliberate and it is also the whole reason a pin is worth almost
     nothing here: in a family the solved figure IS the set of slots, so a
     neuron that cannot move is a neuron already standing in the answer. the
     solver measured the same sign on the layered builder — pins made a net 0.3
     to 0.8 moves EASIER — and its own conclusion was that a pin is texture
     rather than difficulty. the fix it proposes, pinning where the neuron
     stands, cannot be taken here without giving up the thing this whole block
     is built on: that the zero-crossing arrangement is where the generator
     started rather than something a search has to find. so the sign stays, the
     count is honest, and the ramp does not lean on pins for a step.
     from v5 a draw that lands on a thread with nothing eligible falls through
     to any other thread instead of being dropped. it has never yet fired in
     600 nets — the round robin is well fed — but a ramp row that says two and
     delivers one on an unlucky day should be impossible, not unlikely. */
  for(let p=0;p<pinned;p++){
    const k=p%T;
    let cands=order[k].filter(n=>!n.pinned && !n.merged);
    if(!cands.length && GEN_RULES.pinFill) cands=live.filter(n=>!n.pinned && !n.merged);
    if(!cands.length) continue;
    cands[Math.floor(rnd()*cands.length)].pinned=true;
  }

  /* disturb, price, keep it only if it bought something. displacing a neuron
     does not reliably cost a turn: two neurons of the SAME feature can trade
     places without crossing anything (a thread never crosses itself), and —
     the one that really bites — disturbing EVERY layer the same way just
     relabels the figure. an early version displaced neurons blindly and called
     the count par; on the two-thread nets it faithfully swapped both rows in
     all three columns and produced a board that was already solved, with a par
     of three printed over it.
     so each rotation is priced, and rolled back when the price does not move.
     the loop ends when the puzzle is worth the par it is about to be scored
     out of, or when the figure stops yielding — and par then follows what was
     actually achieved rather than what was asked for. */
  live.forEach(n=>n.moved=false);
  const plan={fam, nodes:live, order, chords, d:0, merges, minSep, par:0, x:0};


  /* ---- the weave goes on FIRST, and the rotations only close the gap --------
     order matters and it is the whole point. a weave laid over a board that has
     already been locally scrambled is a pattern drawn on a mat and reads as the
     mat; laid first, it is the board's composition, and what follows are
     departures FROM it.

     it is fitted rather than chosen: every (weave, amplitude) pair is priced on
     the figure it would actually make and the best-fitting one is kept, where
     best means the dearest route that is still under this net's crossing
     ceiling. that is the same two tests the rotation loop below applies, asked
     once over a catalogue instead of one rotation at a time — so a weave can
     never hand back a board the scramble would have refused.

     a weave that buys nothing is REFUSED, not merely unhelpful. an amplitude
     that divides the seat count rotates every seat the same way and relabels
     the figure — the exact bug the rotation loop's second clause was written
     for — and on a two-thread net most amplitudes do precisely that. so the
     plain figure is the baseline and a weave has to beat it.

     the woven seats are deliberately NOT protected from the rotation loop
     below, and that is the second half of the design rather than an oversight.
     a weave rarely lands exactly on the net's par target — on the small nets it
     lands well under — so something has to close the gap, and the rotations are
     what close it. what they leave behind is a handful of neurons standing off
     the pattern: DEFECTS, which is the difficulty this board has that a plain
     weave does not, because a pattern with three liars in it has to be read
     rather than merely recognised. their number is self-regulating, since every
     rotation is priced and kept only if it buys a turn — the nearer the weave
     gets to par, the fewer of them there are.

     THREE THREADS IS THE FLOOR, and it is arithmetic rather than taste. the
     weave cycles the seats at a position, so with two threads the only shift
     available is the one that swaps them: the cyclic group has order two, there
     is no pattern to draw, and every weave in the catalogue collapses to the
     same alternation. worse, it collapses to a CHEAP one — both threads
     swapping at the same column is close to the relabel, and it took the two
     opening nets of the day from a 2-turn route to a 1-turn one, which is a
     tutorial-sized net solvable in a single drag. the morning's two-thread
     warm-ups therefore keep the local scramble they already had; they are three
     and four neurons deep and were never the boards anyone called a mat. */
  if(GEN_RULES.weave==='pattern' && T>=3){
    const home=live.map(n=>({n, x:n.x, y:n.y}));
    const restore=()=>home.forEach(h=>{h.n.x=h.x; h.n.y=h.y});
    let best=null;
    /* the catalogue is walked in a fixed order and the draw only decides where
       it STARTS, so the day still picks the pattern but the fit still decides
       whether it is worth having. */
    const off=Math.floor(rnd()*WEAVE_LIST.length);
    for(let w=0;w<WEAVE_LIST.length;w++){
      const name=WEAVE_LIST[(w+off)%WEAVE_LIST.length];
      for(let amp=1;amp<=3;amp++){
        restore();
        famWeave(order, name, amp);
        const priced=famCost(plan), x=famX(plan);
        if(x>xCap) continue;
        if(!best || priced>best.par || (priced===best.par && x>best.x))
          best={name, amp, par:priced, x};
      }
    }
    restore();
    if(best){
      const bare=famCost(plan);
      if(best.par>bare || (best.par===bare && best.x>famX(plan))){
        famWeave(order, best.name, best.amp);
        plan.weave=best.name; plan.amp=best.amp;
        plan.d=live.filter(n=>Math.hypot(n.x-n.hx,n.y-n.hy)>.5).length;
      }
    }
  }

  plan.par=famCost(plan); plan.x=famX(plan);
  for(let miss=0; plan.par<want && miss<26; ){
    const st=famStep(live, F.cyc||3, !!F.local, rnd);
    if(!st) break;
    const priced=famCost(plan), x=famX(plan);
    /* keep a rotation when it makes the solution dearer, or when it leaves the
       price alone but puts more crossings on the board. the second clause is
       what the smallest nets live on: a two-thread net with one crossing costs
       nothing at all, because the single move that fixes it is the move that
       finishes the net, and the game does not bill that one. judging purely on
       price, every rotation available to net 0 looked worthless and got rolled
       back, and the tutorial shipped already solved. the clause also refuses
       the relabel — swapping every layer the same way empties the board of
       crossings, and that now reads as the step backwards it is.
       AND FROM v11, NEVER PAST THE CEILING. a rotation that would take the
       board over xCap is rolled back exactly like one that bought nothing, so
       the accepted figure is under the ceiling by construction rather than by
       luck, and par follows what was actually achieved — which is what this
       loop has always done when the figure stopped yielding. a ring net simply
       stops being scrambled into a mat that costs no more turns than the fan
       net beside it and merely looks four times worse.
       AND FROM v12, NEVER BACKWARDS EITHER. the first clause asks only that the
       price went up and says nothing about the board, so a rotation that costs
       a turn more while REMOVING a crossing has always been accepted — a puzzle
       that bills higher and looks tidier, which is the whole complaint this
       version exists to answer, running in reverse. it was harmless while the
       board was noise and is fatal on a woven one: net 0 is two threads over
       three columns, the weave leaves it at 2 crossings, and one such rotation
       took it to 1 — under the band, so no salt could be accepted and pass two
       shipped the closest miss. a first net solvable in a single drag is the
       exact failure the two-pass salt search was written to stop.
       so the crossing count may rise or hold and never fall. it is gated on the
       weave rule rather than applied outright because it is a generator rule
       like any other: every board from v11 back was drawn with the old test and
       has to stay drawn with it. */
    const holdsX = GEN_RULES.weave!=='pattern' || x>=plan.x;
    if((priced>plan.par || (priced===plan.par && x>plan.x)) && holdsX && x<=xCap){
      if(priced>plan.par) miss=0;
      plan.par=priced; plan.x=x; plan.d+=st.pick.length;
    } else {
      st.pick.forEach((n,j)=>{n.x=st.px[j]; n.y=st.py[j]; n.moved=false});
      miss++;
    }
  }
  /* PHASE TWO, from v5. famCost prices the walkthrough in the order the nodes
     happen to sit in the array, and the offline harness showed what that costs:
     the same moves taken best-first clear every family net in about 55% of the
     actions — net 9 in 11 rather than 16, net 4 in 4 rather than 8. par was
     therefore not loose by a little, it was very nearly double, and a par
     nobody can miss is not a line. so the cheap count drives the scramble,
     which is all it is good for, and the number printed on the net is the
     cheapest walkthrough this generator can actually find.
     it costs one greedy pass per accepted rotation, which is why it does not
     drive the loop as well — measured at 30-60ms for the deepest net, against
     3ms for the cheap one. */
  if(GEN_RULES.parMode==='greedy'){
    plan.par=famGreedy(plan).actions;
    for(let miss=0; plan.par<want && miss<20; ){
      const st=famStep(live, F.cyc||3, !!F.local, rnd);
      if(!st) break;
      const priced=famGreedy(plan).actions, x=famX(plan);
      // the same two gates as phase one, for the same reasons
      const holdsX = GEN_RULES.weave!=='pattern' || x>=plan.x;
      if((priced>plan.par || (priced===plan.par && x>plan.x)) && holdsX && x<=xCap){
        if(priced>plan.par) miss=0;
        plan.par=priced; plan.x=x; plan.d+=st.pick.length;
      } else {
        st.pick.forEach((n,j)=>{n.x=st.px[j]; n.y=st.py[j]; n.moved=false});
        miss++;
      }
    }
  }
  /* ---- and then par is the solution PLUS an allowance ----
     the number above is the cheapest route this generator can find, and the
     offline solver established that on every net it could prove, that route IS
     the optimum. printing it as par therefore set the clean line at perfection:
     measured across 490 family nets, par equalled the optimum on 71% of them
     and the median slack from net three onward was zero. clean stopped being a
     line a good player crosses and became a line only a flawless one does.

     that is the same mistake as the old formula, arrived at from the other
     side. the formula sat so far above the optimum that a competent player
     scored 90% clean and the ladder had one rung; pricing the true route put
     the rung on top of the optimum and left no room under it at all.

     three is not a guess. the solver picked it from the distribution of a
     competent player's excess over the optimum — zero on half of nets, two or
     fewer on 78%, and the marginal gain collapsing after three — and the same
     allowance is what makes `perfect` mean something, since perfect is the
     optimum and clean now sits a few honest turns above it. */
  /* the route par is quoted FROM, kept rather than thrown away. it is the same
     number the offline solver ships as `optimum` for a family net — checked, it
     is famGreedy on all 490 family rows in optima.json — so a day from v8 can
     read its top rung straight off the board it is standing on instead of out
     of a table that has to be generated ahead and eventually runs out. see
     netTargets. */
  plan.route=plan.par;
  plan.par=Math.max(3, plan.par + (GEN_RULES.parSlack||0));
  return plan;
}

/* the segment lists for a plan's threads, in the order plan.order holds them.
   built once per count rather than per pair, because it is the same list every
   time and a crossing loop asks for it O(T^2) times. */
function planSegs(plan){
  return plan.order.map((o,k)=>segList(o.length, plan.chords&&plan.chords[k]));
}
/* crossings on the board as it stands, before anybody has touched it.
