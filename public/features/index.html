<!-- THE POLICY, AND WHAT IT CAN AND CANNOT DO HERE (26 Aug 2026).

     `'unsafe-inline'` is in script-src and is not going away: the whole game is
     two inline script blocks by design — no build, no bundler, nothing to
     hash against — and hashes with no build step would mean the game stopped
     booting on every edit until somebody remembered to recompute them. that is
     a worse failure than the one it prevents, and it would end with the policy
     being deleted rather than maintained. so this does NOT stop an injected
     inline handler.

     what it does stop is what an injected handler is FOR. `connect-src 'self'`
     is the line that matters: the reflected XSS found in the provider names
     was worth having because it could post the save and the unlock token to an
     origin the attacker chose, and this refuses every destination but ours.
     `base-uri 'none'` kills the <base> trick that repoints every relative url
     at once, `object-src 'none'` closes plugin embedding, `form-action 'self'`
     stops an injected form posting outward, and img-src is `data:` for the
     favicon and nothing else — no pixel can carry data off the page.

     the localhost origins are for `?api=`, which points a DEV page at a
     `wrangler dev` on another port. it is not a hole worth removing: a remote
     attacker gains a channel to the VICTIM'S OWN MACHINE, which they cannot
     read back cross-origin, rather than a channel to themselves.

     THE STRIPE ENTRIES ARE THE PRICE OF EMBEDDING CHECKOUT and they are as
     narrow as that buys: `script-src` for the loader, `frame-src` for the
     iframe the card is typed into, `connect-src` for the calls that iframe's
     parent makes. `maps.googleapis.com` was in here for an afternoon for
     Stripe's address autocomplete and came straight back out — that request is
     made by Stripe's own iframe, which is a separate origin governed by its own
     policy, so listing it here bought nothing and widened this one.

     GOOGLE SIGN-IN NEEDS ONE CONNECTION AND NO SCRIPT. the in-page path is
     FedCM — the browser owns the account picker, but its request is still
     governed by this document's connect-src policy. accounts.google.com is
     therefore allowed there and nowhere else. a browser that cannot do FedCM
     falls back to the redirect, which never needs a policy exception.

     `frame-ancestors` is deliberately absent because a <meta> cannot carry it —
     it is header-only. Clickjacking cover has to come from the site serving
     this file; the akibwa deploy is the place for that. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-FF+cmT7vi+FbrumseCqCkat7ZxwipyD2WBeAHeqCfvc=' 'sha256-xMyYKPmIyvuG2SxWEP8DfCMZZgml3CvN2Ntk2ODmUhw=' https://js.stripe.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.stripe.com https://accounts.google.com; frame-src https://js.stripe.com https://checkout.stripe.com https://hooks.stripe.com; base-uri 'none'; object-src 'none'; form-action 'self'">
<!-- the tab mark is a sibling of akibwa.com's own favicon, which is the house
     construction: a rounded white tile, a faint inner keyline at 13% ink, a
     bold near-black letter, and the colour beneath it. that file is 64 wide and
     this one is 32, so the shared measures here are exactly half of it — rx 14
     -> 7, the keyline's 1.5/61/12.5/3 -> .75/30.5/6.25/1.5. side by side in a
     bookmarks bar the CORNER RADIUS is what makes two marks read as a set, so
     it is copied to the unit.

     where the two part company is the colour. akibwa carries a thin blue line
     with an orange terminal dot; this one FILLS the bottom 12 of its 32 with the
     four-colour flag, on the owner's instruction, and a filled field is a bigger
     departure than a rule was. the tile, the radius and the keyline are what
     still carry the family — stated here because the next person to look at the
     pair will wonder whether the divergence was noticed.

     the letter is also a PATH, not a <text>. akibwa's asks for Avenir Next, then
     Inter, then Helvetica Neue, so its A is a different glyph on a machine with
     none of them. this one cannot drift. it is lowercase because everything this
     game writes is, and it is FITTED to the masthead's f rather than invented:
     against the real 25px/700 glyph, as ratios of its height, width .455 against
     .467, stem .18 against .20, hook overhang .18 against .147. the crossbar is
     the one place the aicher grid costs fidelity — it sits .45 down where the
     title's sits .34, because a TRUE circular hook wide enough to reach that far
     right springs lower than a real type hook, which is flattened. raise it and
     the counter closes and the letter rasterises as a plus sign.

     the band is 4 units, and that number is not taste. the viewBox is 32 and a
     tab draws it at 16, so a unit is half a device pixel and only EVEN heights
     land on whole ones — an odd band is a blurred band, which is what capped the
     original 2-unit rule: at 3 units it was 1.5px and smeared. 4 units is the
     next clean step up, and it exactly doubles the colour that survives — 28
     pure flag pixels at 16px against the 2-unit rule's 14.

     it stops at 4 because of where the letter ends. the stem's baseline is y24,
     so a band from y24 has the f standing exactly ON it and needs nothing doing
     to either. 6 units would climb two past the baseline and the stem would have
     to be knocked out of the colour; 12 fills the bottom third and the tile stops
     being a letter on a ground and becomes a colour chip with a letter on top.
     both were built and both were rejected — the point of this mark is a letter
     with a rule under it, and the rule should be legible, not loud.

     the band also still FLOATS: four units of tile below it, the way akibwa's
     blue line sits clear of its own bottom edge. run flush to the edge instead
     and the family resemblance goes with it, for one extra pixel of colour.

     the band is CLIPPED to the tile so it takes the bottom corner arcs.
     unclipped it is a square block in a rounded tile and looks broken at 96px —
     checked, and checked in webkit too, because a clipPath is exactly the kind
     of thing that renders in one engine and not the other. it does not: both
     agree to the pixel, and both put zero flag pixels outside the arc. the
     keyline is drawn LAST, over the field, because it is the tile's edge and an
     edge that stops where a colour starts is not an edge.

     the tile is also what lets the colours be fixed at all. a tab bar is light
     on one machine and dark on the next and an icon cannot ask which. a
     prefers-color-scheme rule inside the svg looks like the answer and is not:
     chromium honours it, WEBKIT IGNORES IT, so the f would stay near-black on
     every safari and ios dark tab bar — the same class of bug as the unitless
     `r`. so the mark brings its own ground.

     A DATA-URI CANNOT READ A CSS TOKEN. these are therefore resolved values and
     the only hardcoded colours in the file: --surface and --ink at their LIGHT
     values, then --flag-1..4 resolved through their var() chains — hellblau,
     gelb, gruen, orange, in that order and for the reasons given at --flag-*.
     if any of the six move in :root, MOVE THEM HERE BY HAND. nothing checks
     this and nothing will tell you. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3CclipPath id='t'%3E%3Crect width='32' height='32' rx='7'/%3E%3C/clipPath%3E%3C/defs%3E%3Crect width='32' height='32' rx='7' fill='%23FBFAF6'/%3E%3Cg fill='none' stroke='%2315191C' stroke-width='4'%3E%3Cpath d='M14 24V12A6 6 0 0 1 20 6'/%3E%3Cpath d='M10 14H20'/%3E%3C/g%3E%3Cg clip-path='url(%23t)'%3E%3Crect y='24' width='8' height='4' fill='%232EA3DC'/%3E%3Crect x='8' y='24' width='8' height='4' fill='%23EFC319'/%3E%3Crect x='16' y='24' width='8' height='4' fill='%231FA45A'/%3E%3Crect x='24' y='24' width='8' height='4' fill='%23E97E18'/%3E%3C/g%3E%3Crect x='.75' y='.75' width='30.5' height='30.5' rx='6.25' fill='none' stroke='%2315191C' stroke-opacity='.13' stroke-width='1.5'/%3E%3C/svg%3E">
<!-- the ground is stamped before the first paint, or the page shows one theme
     and then the other. the key is repeated here rather than shared because
     this has to run before the stylesheet is even parsed; it is the one place
     in the file that knows a storage key twice, and it is the cheap half of
     the trade. no stored choice means follow the system. -->
<script>(function(){var t='dark';try{t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'}catch(e){}
try{var s=JSON.parse(localStorage.getItem('probe-run-v3')||'{}');if(s.theme==='light'||s.theme==='dark')t=s.theme}catch(e){}
document.documentElement.setAttribute('data-theme',t)})();</script>

  /* IT WRAPS AGAIN, and only when it has to. this head is a title plus up to
     four controls, and the fourth — the ground square — is what tipped the
     narrowest case over: at 375 the card gives the row 323px, and title +
     `collection` + `full version` + ground + close want 372. with nowrap the
     flexbox pays for that by deforming everything at once, which is what it did
     — the title broke onto two lines, `full version` lost 17px of its box, and
     both 34px squares came out 26.5 wide, which is a square that is not one.
     wrapping spends the same shortfall in one place instead: the controls drop
     to a line of their own at full size, and the head gets 26px taller on the
     one screen where that is the cheapest thing it owns.
     it engages nowhere else. `full version` is drawn only where there is a till
     (`canBuy`), so the everyday narrow head is three items wanting 257 of 323
     and stays on one line, and at 640px the card has 602 for a row that wants
     363. this is the graceful end of a range, not a layout. */

    flex:0 0 auto;display:flex;flex-wrap:wrap;align-items:center;

    .coach-body{padding:11px 13px 12px}
    .coach-text{font-size:13px}
    .intro-card{grid-template-columns:1fr;grid-template-rows:auto auto minmax(0,1fr) auto}
    .intro-art{grid-column:1;grid-row:2}
    #introbody{grid-column:1;grid-row:3}
    .menupane,.paneside{grid-column:1;grid-row:3;border-right:0}
    #menudoors{grid-row:4}
    #introcard:not(.view-home) .intro-art{display:none}
    #introcard:not(.view-home) #introbody{display:none}
    .intro-art{aspect-ratio:16/7;min-height:0;border-right:0;border-bottom:1px solid var(--silver)}
    .intro-art > svg{min-height:0}
    .intro-body{padding:17px 18px 20px}
  }


  @media (max-width:345px){
    #runveil .wbtn{letter-spacing:.04em;padding:8px 6px;white-space:nowrap}
  }

  @media (prefers-reduced-motion:reduce){
    .field,.coach,.play.tutorial .coach,.devdrawer:not([hidden]),
    .minted .mb,.veil.show .bulletin .brow,.field .tlabel2.tin,
    .field .mhalo,
    .field .tutping,.field .tutlead,
    .field .mnode.landed,.field .mnode.retraining,.field .mnode.settling{animation:none}
    .field.swap-out > svg,.field.swap-in > svg,
    .field.swap-out .netnum,.field.swap-in .netnum{animation:none;opacity:1;transform:none}
    .freerun,.clearsweep{display:none}
    .field .mnode.grabbed{transition:none}
    .descentbtn.running svg{animation:none;background:rgba(18,161,154,.2)}
    .help.owned:hover .tickmark{animation:none}
    .live-dot,.coach-dots i.now{animation:none;opacity:.85}
    .veil,.veil.show,.veil > *,.veil.show > *{transform:none;transition-property:opacity,visibility}
    .say,.say.on{transform:none;
      transition-property:opacity,visibility}
    .say .rowin{animation:none}
    .help:active,.act:active,.wbtn:active,.intro-start:active,
    .tval:hover,.tval:active{transform:none}
    .toast,.toast.show{transform:translateX(-50%);transition:opacity var(--t-ui)}
  }
</style>
</head>
<body>
<div class="sheet">

  <div class="hud">
  <header class="hud-head">
    <div class="mark">
      <div>
        <!-- the rule lives inside the heading because it is part of the word,
             not a thing beside it: it takes the word's measure for free and it
             cannot be left behind when the word resizes. -->
        <h1>features<i class="wordrule" aria-hidden="true"></i></h1>
        <!-- not "a game about features" any more: under this word that says one
             thing twice. the two lines are the object and the daily shape. -->
      </div>
    </div>
    <div class="instruments">
      <div class="unitrow">
        <!-- figure first, then the words it is a figure OF, then the bar. the
             figure and the words are one line and stand at opposite ends of the
             bay, so the bay is spoken for at both edges however wide it gets —
             see .unit-top. -->
        <div class="unit unit-cross">
          <div class="unit-top">
            <b class="unit-fig" id="crossnum">0</b>
            <span class="unit-name"><span class="unit-label">crossings left</span></span>
          </div>
          <div class="track crossbar" id="crossbar"><span class="run" id="threadrow"></span></div>
        </div>
        <div class="unit unit-par">
          <div class="unit-top">
            <b class="unit-fig" id="parnum">0</b>
            <!-- "turns" is what is counted and "to perfect" is which line it is
                 counted against, so they are one phrase and travel together -->
            <span class="unit-name"><span class="unit-label">turns</span><em class="unit-of" id="parof">to par</em></span>
          </div>
          <div class="track parmeter" id="parmeter" aria-label="turns against par"><span class="run" id="parrow"></span></div>
        </div>
        <div class="unit unit-set">
          <div class="unit-top">
            <b class="unit-fig" id="setnum">0</b>
            <span class="unit-name"><span class="unit-label" id="setlabel">today's set</span></span>
          </div>
          <div class="track setmeter" id="setmeter" aria-label="today's set"></div>
        </div>
      </div>
      <!-- every piece of game feedback lands here, so it has to be announced.
           it is clipped, not hidden, and it costs the head no height. -->
      <span class="msg" id="msg" role="status" aria-live="polite"></span>
    </div>
    <div class="btns">
      <!-- one button, because there is one screen: the collection and the record
           were two readings of the same history and are now one list. it is also
           the fourth button the phone head never had 48px spare for. -->
      <button class="help" id="histbtn" aria-label="your days">
        <svg class="recglyph" viewBox="0 0 24 24" aria-hidden="true">
          <g fill="currentColor"><rect x="3" y="5" width="4" height="4"/><rect x="3" y="11" width="4" height="4"/><rect x="3" y="17" width="4" height="4"/></g>
          <g fill="none" stroke="currentColor" stroke-width="1.6"><path d="M10 7h11M10 13h11M10 19h11"/></g>
        </svg>
        <span class="caltext" id="statusdate"></span>
      </button>
      <!-- THE ORDER IS THE DOORS ROW'S (28 Aug 2026, the owner's call: "the
           order should always be the same") — home, collection, ?, ground,
           who-you-are, till. the collection's mark returns for exactly that
           parity: the sheets carry it, so the bar does too. -->
      <button class="help" id="collbtn" aria-label="the collection">
        <svg viewBox="0 0 24 24" aria-hidden="true"><g fill="currentColor">
        <rect x="4" y="4" width="4.5" height="4.5"/><rect x="9.75" y="4" width="4.5" height="4.5"/><rect x="15.5" y="4" width="4.5" height="4.5"/>
        <rect x="4" y="9.75" width="4.5" height="4.5"/><rect x="9.75" y="9.75" width="4.5" height="4.5"/><rect x="15.5" y="9.75" width="4.5" height="4.5"/>
        <rect x="4" y="15.5" width="4.5" height="4.5"/><rect x="9.75" y="15.5" width="4.5" height="4.5"/><rect x="15.5" y="15.5" width="4.5" height="4.5"/>
        </g></svg>
      </button>
      
      <!-- ---- the guided nets are NOT here ----
           a mark for the lessons stood in this slot, hidden until `tutorialDone`
           and shown from then on as the only way back to them. it moved to the
           foot of the day card on the owner's call (17 Aug 2026): the lessons are
           a thing you decide to do before a day starts, not a control you reach
           for mid-net, and the card that opens the day is where that decision is
           already being made. it has since moved once more, to the `?` card
           (28 Aug) — see `ruleslessons` in renderIntro — where help lives.
           what the bar keeps is what belongs to a net in progress — the ground,
           the record, the collection, the till and `?` — and the cluster gets a
           sixth slot back, which it needed: a seventh mark overflows a phone. -->
      <!-- ---- the full version ----
           a PLUS, because that is what it is: the game's own framing is that the
           free tier is complete and money adds the archive, the replay and the
           trial — "an addition drawn as an addition" (see the note on the record's
           played row). a circle, a horizontal and a vertical, which is as plain as
           this palette gets.
           `hidden` until `canBuy()` says there is a till AND the player does not
           already hold it, which is the same gate the record's line and the
           cleared card's offer read. a shop button that answers "the till is not
           answering" is worse than none, and a buyer must never see one at all.
           it stays in the QUIET ink of every other control here rather than taking
           the purchase violet: a saturated field in the masthead is a badge, and
           a badge is the one form this interface does not use. -->
      <button class="help" id="helpbtn" aria-label="how to play">?</button>
      <!-- `groundbtn` is what applyTheme writes and what the click is wired to,
           so this one and the sheets' are found together and cannot drift. -->
      <button class="help groundbtn" id="themebtn" aria-label="ground">
        <svg class="themeglyph" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor"/></svg>
      </button>
      <!-- who you are, in the bar too — filled by fillIntroAuth with the same
           mark every doors row gets; display:contents so the button inside is
           the cluster's own flex item. -->
      <span class="door-auth mastauth"></span>
      <!-- ---- THE TILL HOLDS THIS CORNER TOO ---- (17 Aug 2026, the owner's call)
           it stood between the collection and `?` and was drawn only to somebody
           who could still buy — so the one mark in this row that reports WHO YOU
           ARE sat among the doors and disappeared the moment you bought it. it is
           last now, at the end of the row, which is the same corner the day card
           gives it, and it is drawn in BOTH states: a plus while it is for sale,
           a tick once it is yours. `paintTill` draws both, in one place, so the
           two corners cannot end up disagreeing about what a purchase looks like.
           the old `hidden` gate on `canBuy()` has gone with it — see paintTill for
           what replaced it and why. it stays in the QUIET ink of every other
           control here rather than taking the purchase violet: a saturated field
           in the masthead is a badge, and a badge is the one form this interface
           does not use.
           the `>_` solve button was the last mark in this row and is now in the
           controls drawer with every other dev affordance. it never reached a
           player — it was `hidden` off a DEV host — but it was in the masthead on
           every screenshot taken during development, which is the row this game
           is judged on. -->
      <button class="help" id="buybtn" hidden></button>
      </div>
  </header>

  <div class="hud-body">
  <div class="play" id="play">
  <div class="field" id="field">
    <svg id="netsvg" viewBox="0 0 1040 580" preserveAspectRatio="xMidYMid meet" aria-label="the tangle"></svg>

    <div class="coach" id="coach">
      <div class="coach-strip" aria-hidden="true">
        <i style="background:var(--flag-1)"></i><i style="background:var(--flag-2)"></i>
        <i style="background:var(--flag-3)"></i><i style="background:var(--flag-4)"></i>
      </div>
      <div class="coach-body">
        <div class="coach-head">
          <span id="coachlabel">tutorial · step 1 of 3</span>
          <span class="coach-dots" id="coachdots"><i></i><i></i><i></i></span>
        </div>
        <div class="coach-text" id="coachtext"></div>
        <!-- filled by renderTutorial from the board's own marks -->
        <div class="coach-key" id="coachkey"></div>
      </div>
    </div>

    <!-- the seen half of every flashMsg. the heard half is #msg up in the
         masthead, which is why this is hidden from the reader: one fact, one
         announcement. -->
    <div class="say" id="say" aria-hidden="true"></div>

    <!-- both bulletins are IN the board, not over the window. they tuck into the
         plate's bottom-right off --plate-x / --plate-y, and those are inherited
         custom properties published on `.field` by publishPlateInset — so this
         is the only place in the document that can read them. see .boardcard in
         the stylesheet for the rest of the argument.
         the day card is here rather than at body level because the day now ends
         on the board it was won on: the tenth net stays cleared on the plate
         instead of being swapped out for an eleventh nobody can play. -->
    <div class="veil boardcard" id="netveil"><section class="bulletin" id="netbulletin"></section></div>
    <div class="veil boardcard" id="runveil"><section class="bulletin" id="runbulletin"></section></div>
  </div>
  </div><!-- /play -->

  </div>
  </div>
</div>


<div class="devdrawer" id="devdrawer" hidden>
  <div class="dd-head"><span>controls</span><a href="#" id="ddclose">close &times;</a></div>
  <div class="actionrow">
    <button class="act" id="descentbtn"><svg viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 4v13M7 12l5 5 5-5M5 21h14"/></g></svg><span>let it settle</span></button>
    <button class="act" id="skipnet"><svg viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 6l7 6-7 6zM13 6l7 6-7 6z"/></g></svg><span>skip net</span></button>
    <button class="act" id="reset"><svg viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8"><path d="M19 12a7 7 0 1 1-2-4.9M19 4v4h-4"/></g></svg><span>reset</span></button>
    <button class="act" id="newrun" hidden><svg viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 5l11 7-11 7z"/></g></svg><span>new run</span></button>
    <!-- DEVELOPER TOOL, and it says so. it solves the net down the exact route
         par is priced from, so it is also a live check that the two agree.
         it was a mark in the masthead — `hidden` off a DEV host, so it never
         reached a player, but present in the top right of every screenshot taken
         while the game was being designed. it belongs here, with the reset button
         and under the note saying none of this is settled. still `hidden` until
         DEV unhides it: a button that plays the game for you is the one control
         that can empty the whole product. -->
    <button class="act devsolve" id="solvebtn" hidden
            title="dev · solve this net (walks the route par is priced from)">
      <svg viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M4 18L10 12L4 6"/><path d="M12 18h8"/></g></svg><span>solve net</span></button>
  </div>
  <!-- ---- STEP THROUGH EVERY SCREEN ----
       the game is one file of overlays and most of them are only reachable by
       playing your way to them: a card that appears on a cleared net, a record
       you have to have a record for. so judging the SET of them — do they agree
       about the ground, do the cards sit at the same measure, does one of them
       still say something the others stopped saying — meant a run per screen.
       this walks the list instead, in the drawer that already says none of it is
       settled as part of the game. `[` and `]` do the same thing off the drawer,
       so the screen can be judged without a panel over the corner of it. -->
  <div class="dd-screens">
    <button class="act sq" id="ddprev" aria-label="previous screen">&lsaquo;</button>
    <span class="dd-screen" id="ddscreen">the board</span>
    <button class="act sq" id="ddnext" aria-label="next screen">&rsaquo;</button>
  </div>
  <div class="dd-note">press <b>d</b> to hide &middot; <b>[</b> <b>]</b> to step through the screens &middot; none of this is settled as part of the game</div>
</div>

<!-- neither bulletin is here: both live inside `.field`, above, because both are
     cards about a board you are still looking at. what is left at this level is
     the three overlays that genuinely replace the screen — the record, the rules
     and the welcome. -->

<!-- the record, the account card and the checkout were three veils of their
     own and are PANES OF THE ONE MENU now (28 Aug 2026, the owner's call:
     "the collection displayed on the left hand side so the menu never
     changes... the profile takes over where the previous runs are showing...
     same with the pay feature — the new stuff fades into the same menu and
     you never feel like you're going to a new page"). see the intro card. -->


<!-- ---- THE ARCHIVE'S LOOK ----
     a day you played, that you can no longer play. it used to answer a press
     with a toast and nothing else, which is the game refusing and then having
     nothing to show for the refusal. this is the day itself: its ten nets as
     they were dealt, drawn small and unplayable, with the rung each one minted
     under it. what is for sale is the right to play them again, so the thing
     on the page is the thing for sale. -->
<!-- checkout, mounted inside the game rather than a page away. the card is
     Stripe's own iframe; this is only the frame around it and the way out. -->

<div class="veil" id="archveil">
  <section class="arch-card">
    <div class="rec-head">
      <strong class="rec-title" id="archtitle">the archive</strong>
      <span class="rec-right"><a href="#" class="rec-close" id="archclose" aria-label="close"><svg viewBox="0 0 15 15" width="15" height="15" aria-hidden="true"><path d="M1.5 1.5 13.5 13.5M13.5 1.5 1.5 13.5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></a></span>
    </div>
    <div class="arch-body" id="archbody"></div>
  </section>
</div>

<div class="veil" id="introveil">
  <!-- ---- THE ONE MENU ---- (28 Aug 2026, the owner's call)
       every page is a PANE of this card now, so the frame never changes and
       nothing feels like a new screen. the left half is the plate, or the
       collection, or the rules; the right half is the menu itself, or the
       profile, or the checkout taking over "where the previous runs are
       showing". the strip, the doors and the frame never move; `menuView`
       decides the panes and renderPanes draws the decision. -->
  <div class="intro-card menusheet" id="introcard">
    <div class="intro-strip" aria-hidden="true"></div>
    <!-- the plate is a net drawn by the board's own marks, filled by renderIntro -->
    <div class="intro-art" id="introart"></div>
    <div class="menupane collection" id="panecoll" hidden></div>
    <div class="menupane panerules" id="panerules" hidden></div>
    <div class="menupane paneside" id="paneside" hidden>
      <div class="pane-head" id="panehead"><strong class="rec-title" id="accttitle">your account</strong></div>
      <div class="acct-body" id="acctbody"></div>
      <!-- the restore line lives with the profile: a buyer on a new phone is
           exactly who is standing here -->
      <div class="rec-arch" id="recarch" hidden></div>
      <div class="pay-body" id="paybody" hidden></div>
    </div>
    <div class="intro-body" id="introbody"></div>
    <!-- the persistent doors: built ONCE at boot, never rebuilt with the
         morning's card — renderPanes only moves the `here` mark -->
    <div class="intro-doors rec-doors" id="menudoors"></div>
  </div>
</div>

<!-- a question, in the game's own card instead of the browser's.
     empty until ask() fills it, and only ever one at a time — a second question
     supersedes the first rather than stacking on it. `alertdialog` rather than
     `dialog` because it is always a consequence being reported, never a form;
     the label is written by ask() off the title, since the card is built from
     the same bulletinHTML as the other two and that has no id to point at. -->
<div class="veil askveil" id="askveil">
  <section class="bulletin" id="askbulletin" role="alertdialog" aria-modal="true"></section>
</div>

<div class="toast" id="toast">copied</div>

<script>

const MARKGRID=`<g fill="none" stroke="var(--mark,#fff)" stroke-width="1" opacity=".16"><path d="M12 0V96M24 0V96M36 0V96M48 0V96M60 0V96M72 0V96M84 0V96M0 12H96M0 24H96M0 36H96M0 48H96M0 60H96M0 72H96M0 84H96"/></g>`;

  buildings:{c:'--dunkelblau',p:`<path d="M12 88V52L34 30L56 52V40L70 26L84 40V88Z"/><g fill="var(--emblem)"><rect x="26" y="58" width="12" height="14"/><rect x="62" y="52" width="10" height="12"/><rect x="42" y="70" width="10" height="18"/></g>`},
  motion:{c:'--gelb',p:`<path d="M28 36H56V20L84 48L56 76V60H28L40 48Z"/><path d="M6 38H22V44H6ZM6 52H22V58H6Z"/>`},

  lightning:{c:'--orange',p:`<path d="M58 8H86L46 48H66L38 76H6L34 48H18Z"/>`},
  eyes:{c:'--hellblau',p:`<path d="M6 48A54 54 0 0 1 90 48A54 54 0 0 1 6 48Z"/><circle cx="48" cy="48" r="16" fill="var(--emblem)"/><circle cx="48" cy="48" r="8"/>`},

  insects:{c:'--gruen',p:`<path d="M48 24A36 36 0 0 1 48 84A36 36 0 0 1 48 24Z"/><circle cx="48" cy="16" r="10"/><path d="M8 22L28 42H36L16 22ZM4 50H30V58H4ZM16 86L36 66H28L8 86ZM88 22L68 42H60L80 22ZM92 50H66V58H92ZM80 86L60 66H68L88 86Z"/><path d="M45 30H51V80H45Z" fill="var(--emblem)"/>`},
  loops:{c:'--violett',p:`<path d="M4 70H92V82H4Z"/><path d="M18 44A30 30 0 1 1 78 44A30 30 0 1 1 18 44Z"/><circle cx="48" cy="44" r="20" fill="var(--emblem)"/>`},

function figNorm(pts){
  const n=pts.length; let cx=0,cy=0;
  for(const p of pts){cx+=p[0];cy+=p[1]}
  cx/=n; cy/=n;
  const c=pts.map(p=>[p[0]-cx,p[1]-cy]);
  let s=0; for(const p of c) s+=p[0]*p[0]+p[1]*p[1];
  s=Math.sqrt(s/n)||1;
  return c.map(p=>[p[0]/s,p[1]/s]);
}
function figRot(A,b){
  let sxx=0,sxy=0,syx=0,syy=0;
  for(let i=0;i<A.length;i++){
    sxx+=A[i][0]*b[i][0]; sxy+=A[i][0]*b[i][1];
    syx+=A[i][1]*b[i][0]; syy+=A[i][1]*b[i][1];
  }
  const th=Math.atan2(sxy-syx,sxx+syy),ct=Math.cos(th),st=Math.sin(th);
  let d=0;
  for(let i=0;i<A.length;i++){
    const x=ct*A[i][0]-st*A[i][1], y=st*A[i][0]+ct*A[i][1];
    d+=(x-b[i][0])**2+(y-b[i][1])**2;
  }
  return Math.sqrt(d/A.length);
}
const figMirror=pts=>pts.map(p=>[-p[0],p[1]]);
function figDist(a,b){ return Math.min(figRot(a,b), figRot(figNorm(figMirror(a)),b)) }

function figMarkup(k,{ink='currentColor',ghost=false,pad=20,fit=null}={}){
  const f=FIGURES[k]; if(!f) return '';
  const th=figFlatAngle(f);
  const pts = th
    ? f.p.map(q=>[Math.cos(th)*q[0]-Math.sin(th)*q[1], Math.sin(th)*q[0]+Math.cos(th)*q[1]])
    : f.p;
  const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]);
  const mnx=Math.min(...xs),mxx=Math.max(...xs),mny=Math.min(...ys),mxy=Math.max(...ys);
  const bw=mxx-mnx||1, bh=mxy-mny||1, S=Math.min((96-2*pad)/bw,(96-2*pad)/bh);
  const ox=pad+((96-2*pad)-bw*S)/2, oy=pad+((96-2*pad)-bh*S)/2;
  const P=pts.map(p=>[ox+(p[0]-mnx)*S, oy+(p[1]-mny)*S]);
  const w=(FIG_WEIGHT[f.n]||15)*(ghost?0.82:1)*(fit&&FIT_WEIGHT[fit]||1);
  const m=P.length-1, TAPER=0.45;
  const body = f.chord
    ? (()=>{ const [a,b]=f.chord, lo=Math.min(a,b), hi=Math.max(a,b);
             return P.slice(lo,hi+1).map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ')+'Z' })()
    : P.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ')+'Z';
  const poly=body;
  let out=`<path d="${poly}" fill="${ink}" fill-rule="evenodd" stroke="none"/>`;
  for(let i=0;i<m;i++){
    const sw=w*(1-TAPER*(i/Math.max(1,m-1)));
    out+=`<path d="M${P[i][0].toFixed(1)} ${P[i][1].toFixed(1)}L${P[i+1][0].toFixed(1)} ${P[i+1][1].toFixed(1)}" `
      +`fill="none" stroke="${ink}" stroke-width="${sw.toFixed(2)}" stroke-linecap="round"/>`;
  }
  if(f.chord){
    const [a,b]=f.chord;
    out+=`<path d="M${P[a][0].toFixed(1)} ${P[a][1].toFixed(1)}L${P[b][0].toFixed(1)} ${P[b][1].toFixed(1)}" `
      +`fill="none" stroke="${ink}" stroke-width="${w.toFixed(2)}" stroke-linecap="round"/>`;
  }
  out+=`<circle cx="${P[0][0].toFixed(1)}" cy="${P[0][1].toFixed(1)}" r="${(w*0.62).toFixed(2)}" fill="${ink}"/>`;
  return ghost ? `<g opacity=".5">${out}</g>` : out;
}

async function apiCall(path,opts){

function googleHereOk(){

function ensureGooglePrep(){
  if(!googleHereOk()) return null;
  if(googlePrep && Date.now()-googlePrep.at < 8*60e3) return googlePrep;
  return apiCall('/auth/google/prepare',{method:'POST'}).then(j=>{
    if(!j || !j.nonce || !j.state || !j.clientId) return null;
    googlePrep={clientId:j.clientId, nonce:j.nonce, state:j.state, at:Date.now()};
    return googlePrep;
  }).catch(()=>null);
}
async function landedSignedIn(me){

async function tryGoogleHere(){
  if(!googleHereOk()) return false;
  const prep=googlePrep && Date.now()-googlePrep.at < 10*60e3 ? googlePrep : null;
  if(!prep) return false;
  let cred;
  try{
    cred=await navigator.credentials.get({
      identity:{
        context:'signin',
        mode:'active',
        providers:[{
          configURL:'https://accounts.google.com/gsi/fedcm.json',
          clientId:prep.clientId,
          params:{nonce:prep.nonce},
        }],
      },
    });
  }catch(e){
    if(e && e.name==='NotAllowedError') return 'cancel';
    return false;
  }
  const token=cred && (cred.token || cred.idToken);
  if(!token) return false;
  const spent=prep; googlePrep=null;
  try{
    const me=await apiCall('/auth/google/id',{
      method:'POST',
      headers:{'content-type':'application/json'},
      body:JSON.stringify({credential:token, state:spent.state}),
    });
    await landedSignedIn(me);
    return true;
  }catch(e){
    acctErr=e.message||'that sign-in did not go through';
    if(menuShown()&&menuView==='profile') renderAcct();
    else toast('that sign-in did not go through · nothing was lost');
    ensureGooglePrep();
    return 'cancel';
  }
}

async function syncNow(){
  if(!API||!account||!account.signedIn) return;
  if(syncing){ syncQueued=true; return }
  syncing=true; syncSay='saving';
  if(menuShown()&&menuView==='profile') renderAcct();

  try{

    });
    if(JSON.stringify(store.collection)!==sent){ syncQueued=true }
    else if(j&&j.state){ adoptState(j.state); syncSay='saved' }
  }catch(e){
    syncSay = /^http 401/.test(e.message) ? '' : 'offline';
    if(/^http 401/.test(e.message)) account={signedIn:false};
  }
  syncing=false;
  if(menuShown()&&menuView==='profile') renderAcct();
  if(syncQueued){ syncQueued=false; syncSoon() }
}

function sanitizeCollection(c){
  if(!c||typeof c!=='object'||!c.badges||typeof c.badges!=='object') return c;
  for(const b of Object.values(c.badges)){
    if(!b||typeof b!=='object') continue;
    if(!(b.tier in TIERRANK)) b.tier='done';   // a rung it earned, just not a nameable one
    if(b.fit!=null && !(b.fit in FITRANK)) delete b.fit;
  }
  return c;
}
function adoptState(merged){
  if(!merged||typeof merged!=='object') return;
  const mine=R(), theirs=merged.run;
  store.collection=sanitizeCollection(merged.collection)||store.collection;
  store.meta=merged.meta||store.meta;
  store.premium=!!merged.premium;
  if(merged.runsDay===store.runsDay) store.runsToday=Math.max(store.runsToday||0,merged.runsToday||0);

  const untouched = mine && !mine.turns && !mine.netIndex && !(mine.cleared||[]).length && !mine.netMoves;
  const catchUp = untouched && theirs && theirs.day===mine.day && theirs.mode===mine.mode
               && ((theirs.cleared||[]).length>0 || theirs.netIndex>0);
  if(catchUp){
    store.run=theirs;
    if(merged.parked) store.parked=merged.parked;
    try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}
    builtFor=-1; resetDescent(); renderAll();
    toast('your set is where you left it · net '+((theirs.cleared||[]).length+1));
  } else {
    try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}
    renderHud();
  }
  if(menuShown()) renderMenu();
}

async function wakeAccount(){
  if(!API) return;
  const back=new URLSearchParams(location.search).get('signin');
  if(back){
    const u=new URL(location.href); u.searchParams.delete('signin');
    history.replaceState(null,'',u.pathname+u.search+u.hash);
    if(back==='cancelled'){ /* pressing cancel is not a failure worth a line */ }
    else if(back!=='ok') toast('that sign-in did not go through · nothing was lost');
  }
  if(!store.tutorialDone) askSignIns();
  if(!store.signedInOnce && back!=='ok' && !acct.token) return;
  const me=await api('me');
  if(!me || me.error){
    account={signedIn:false};
    if(!me) syncSay='offline';
  } else {
    account=me;
    if(applyEntitlement(me)) entitlementChanged();
    if(me.signedIn){
      store.signedInOnce=true;
      if(back==='ok') toast('signed in · your record follows you now');
      await linkUnlock();
      await syncNow();
      tellClock();
      if(back==='ok') afterSignIn();
    } else {
      delete store.signedInOnce;
      try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}
    }
  }
  if(menuShown()&&menuView==='profile') renderAcct();
}

function lanePar(){
  const n=Math.max(1,threads.length-1);
  const laneY=t=>BH*.09+threads.indexOf(t)*(BH*.82/n);
  const band=(BH*.82/n)/2;
  let out=0;
  members.forEach(m=>{
    if(m.threads.length>1) return;            // shared neurons are counted below
    if(Math.abs(m.y0-laneY(m.threads[0]))>band) out++;
  });
  return Math.max(3,out+spec.shared);
}

function segList(len, chord){

      const p1=A[SA[a][0]],p2=A[SA[a][1]],q1=A[SA[b][0]],q2=A[SA[b][1]];
      if(p1===q1||p1===q2||p2===q1||p2===q2)continue;
      if(segX(p1,p2,q1,q2))return false;
    }
    for(let j=i+1;j<polys.length;j++){
      const B=polys[j], SB=segList(B.length, chords&&chords[j]);
      for(let a=0;a<SA.length;a++)for(let b=0;b<SB.length;b++){
        const p1=A[SA[a][0]],p2=A[SA[a][1]],q1=B[SB[b][0]],q2=B[SB[b][1]];
        if(p1===q1||p1===q2||p2===q1||p2===q2)continue;
        if(segX(p1,p2,q1,q2))return false;
      }
    }
  }
  return true;
}
function segDist(p,a,b){
  const vx=b.x-a.x, vy=b.y-a.y, L=vx*vx+vy*vy;
  let t=L?((p.x-a.x)*vx+(p.y-a.y)*vy)/L:0;
  t=Math.max(0,Math.min(1,t));
  return Math.hypot(p.x-(a.x+vx*t), p.y-(a.y+vy*t));
}

const RINGBOX={x0:70,x1:970,y0:60,y1:520,r:150};
function trackLen(){const B=RINGBOX;return 2*((B.x1-B.x0)-2*B.r)+2*((B.y1-B.y0)-2*B.r)+2*Math.PI*B.r}
function trackPt(u){
  const B=RINGBOX, lx=(B.x1-B.x0)-2*B.r, ly=(B.y1-B.y0)-2*B.r, q=Math.PI/2*B.r, P=trackLen();
  u=((u%P)+P)%P;
  const arc=(cx,cy,a0)=>{const a=a0+(u/B.r);return{x:cx+Math.cos(a)*B.r,y:cy+Math.sin(a)*B.r}};
  if(u<lx) return {x:B.x0+B.r+u, y:B.y0};                       u-=lx;
  if(u<q)  return arc(B.x1-B.r,B.y0+B.r,-Math.PI/2);            u-=q;
  if(u<ly) return {x:B.x1, y:B.y0+B.r+u};                       u-=ly;
  if(u<q)  return arc(B.x1-B.r,B.y1-B.r,0);                     u-=q;
  if(u<lx) return {x:B.x1-B.r-u, y:B.y1};                       u-=lx;
  if(u<q)  return arc(B.x0+B.r,B.y1-B.r,Math.PI/2);             u-=q;
  if(u<ly) return {x:B.x0, y:B.y1-B.r-u};                       u-=ly;
  return arc(B.x0+B.r,B.y0+B.r,Math.PI);
}

const FAMILIES={

  layered:{ minT:2, minL:3, cyc:3, slots(T,L,tut){
    const x0=BW*.10,x1=BW*.90,ytop=BH*.14,ybot=BH*.88,s=[],g=[];
    for(let k=0;k<T;k++){s[k]=[];g[k]=[];for(let i=0;i<L;i++){
      s[k][i]={x:x0+(x1-x0)*(L>1?i/(L-1):.5), y:ytop+(ybot-ytop)*(T>1?k/(T-1):.5)};
      g[k][i]='c'+i;
    }}
    return {s,g};
  }},

  hourglass:{ minT:2, minL:4, cyc:3, slots(T,L){
    const x0=BW*.10,x1=BW*.90,ytop=BH*.12,ybot=BH*.90,mid=(ytop+ybot)/2;
    const full=(ybot-ytop)/Math.max(1,T-1);
    const waist=Math.max(.42, FAM_SEP/full);
    const s=[],g=[];
    for(let k=0;k<T;k++){s[k]=[];g[k]=[];for(let i=0;i<L;i++){
      const u=L>1?Math.abs(2*i/(L-1)-1):1;                 // 0 at the waist, 1 at the ends
      const step=full*(waist+(1-waist)*Math.pow(u,1.35));
      s[k][i]={x:x0+(x1-x0)*(L>1?i/(L-1):.5), y:mid+(k-(T-1)/2)*step};
      g[k][i]='c'+i;
    }}
    return {s,g};
  }},

  residual:{ minT:2, minL:5, cyc:3, slots(T,L,tut,rnd){
    const span=L+(L>=6?2:1);
    const x0=BW*.08,x1=BW*.92,ytop=BH*.13,ybot=BH*.89;
    const X=i=>x0+(x1-x0)*(span>1?i/(span-1):.5), Y=k=>ytop+(ybot-ytop)*(T>1?k/(T-1):.5);
    const s=[],g=[];
    for(let k=0;k<T;k++){
      const want=span-L, drop=new Set();
      for(let q=0;q<24 && drop.size<want;q++) drop.add(1+Math.floor(rnd()*(span-2)));
      const keep=[]; for(let i=0;i<span;i++) if(!drop.has(i)) keep.push(i);
      s[k]=keep.map(i=>({x:X(i),y:Y(k)}));
      g[k]=keep.map(i=>'c'+i);
    }
    return {s,g};
  }},

  lattice:{ minT:2, minL:3, cyc:4, slots(T,L){
    const cell=Math.min(820/Math.max(1,L-1), 450/Math.max(1,T-1), 175);
    const cx=BW/2, cy=BH/2, s=[], g=[];
    for(let k=0;k<T;k++){s[k]=[];g[k]=[];for(let i=0;i<L;i++){
      s[k][i]={x:cx+(i-(L-1)/2)*cell, y:cy+(k-(T-1)/2)*cell};
      g[k][i]='all';
    }}
    return {s,g};
  }},

  fan:{ minT:3, minL:3, cyc:3, local:true, slots(T,L){
    const hx=BW/2, hy=700, A=44*Math.PI/180, r0=200, r1=660, s=[], g=[];
    for(let k=0;k<T;k++){
      const th=T>1?(-A+2*A*k/(T-1)):0;
      s[k]=[];g[k]=[];
      for(let i=0;i<L;i++){
        const r=r0+(r1-r0)*(L>1?i/(L-1):.5);
        s[k][i]={x:hx+Math.sin(th)*r, y:hy-Math.cos(th)*r};
        g[k][i]='r'+i;
      }
    }
    return {s,g};
  }},

  arcs:{ minT:2, minL:3, cyc:3, local:true, slots(T,L){
    const hx=BW/2, hy=600, r1=540;
    const S=Math.min(130, 44*Math.max(1,L-1))*Math.PI/180;
    const r0=Math.max(r1*.5, FAM_SEP*Math.max(1,L-1)/S);
    const s=[],g=[];
    for(let k=0;k<T;k++){
      const r=r0+(r1-r0)*(T>1?k/(T-1):.5);
      s[k]=[];g[k]=[];
      for(let i=0;i<L;i++){
        const p=-S/2+S*(L>1?i/(L-1):.5);
        s[k][i]={x:hx+Math.sin(p)*r, y:hy-Math.cos(p)*r};
        g[k][i]='a'+i;
      }
    }
    return {s,g};
  }},

  ring:{ minT:2, minL:3, cyc:4, slots(T,L,tut,rnd){
    const P=trackLen(), N=T*L, u0=rnd()*P, s=[], g=[];
    for(let k=0;k<T;k++){
      s[k]=[];g[k]=[];
      for(let i=0;i<L;i++){
        s[k][i]=trackPt(u0+P*(k*L+i)/N);
        g[k][i]='ring';
      }
    }
    return {s,g};
  }},

  drift:{ minT:2, minL:3, cyc:4, slots(T,L,tut,rnd){
    const x0=BW*.09, x1=BW*.91, ytop=BH*.10, ybot=BH*.92;
    const mid=(ytop+ybot)/2, room=(ybot-ytop)/2, need=FAM_SEP*1.06*(T-1)/2;
    if(need>room) return {s:[],g:[]};
    for(let attempt=0;attempt<20;attempt++){
      const hBase=need+(room-need)*(.45+.55*rnd());
      const hAmp=Math.min(room-hBase, hBase-need)*(rnd()*.9);
      const cAmp=(room-hBase-Math.abs(hAmp))*(rnd()*1.6-.8);
      const p0=rnd()*6.283, p1=rnd()*6.283, wp=rnd()*6.283;
      const f0=1+Math.floor(rnd()*2), f1=1+Math.floor(rnd()*3), wf=1+Math.floor(rnd()*2);
      const C=u=>mid+cAmp*Math.sin(p0+f0*Math.PI*u);
      const H=u=>hBase+hAmp*Math.sin(p1+f1*Math.PI*u);
      const gaps=[...Array(Math.max(1,T-1))].map(()=>.55+rnd());
      const sum=gaps.reduce((a,b)=>a+b,0), v=[0];
      for(const q of gaps) v.push(v[v.length-1]+q/sum);
      const warp=.72+rnd()*.62;
      const V=(k,u)=>Math.pow(v[k], warp+(1-warp)*.5*(1+Math.sin(wp+wf*Math.PI*u)));
      const lane=(k,u)=>C(u)+H(u)*(2*V(k,u)-1);
      const base=[...Array(L)].map((_,i)=>x0+(x1-x0)*(L>1?i/(L-1):.5));
      const jit=.22*(x1-x0)/Math.max(1,L-1);
      const s=[],g=[];
      for(let k=0;k<T;k++){
        s[k]=[];g[k]=[];
        for(let i=0;i<L;i++){
          const x=base[i]+(i===0||i===L-1?0:(rnd()*2-1)*jit);
          s[k][i]={x, y:lane(k,(x-x0)/(x1-x0))};
          g[k][i]='c'+i;
        }
      }
      const all=s.flat(); let ok=true;
      for(let a=0;a<all.length&&ok;a++){
        if(all[a].y<ytop-1||all[a].y>ybot+1){ok=false;break}
        for(let b=a+1;b<all.length;b++)
          if(Math.hypot(all[a].x-all[b].x,all[a].y-all[b].y)<FAM_SEP){ok=false;break}
      }
      if(ok) return {s,g};
    }
    return {s:[],g:[]};
  }},

  meander:{ minT:2, minL:3, cyc:4, slots(T,L,tut,rnd){
    const cell=78, x0=BW*.06, ytop=BH*.09, ybot=BH*.93;
    const cols=1+Math.floor((BW*.94-x0)/cell), rows=1+Math.floor((ybot-ytop)/cell);
    if(cols<L||rows<2) return {s:[],g:[]};
    const P=(c,r)=>({x:x0+c*cell, y:ytop+r*cell});
    const clear=(pts,segs,p,a,b)=>{
      for(const q of pts) if(Math.hypot(p.x-q.x,p.y-q.y)<FAM_SEP) return false;
      for(const e of segs) if(segDist(p,e[0],e[1])<FAM_SEP*.55) return false;
      if(!a) return true;
      for(const q of pts){ if(q===a) continue;
        if(segDist(q,a,b)<FAM_SEP*.55) return false; }
      for(const e of segs){ if(e[0]===a||e[1]===a) continue;
        if(segX(a,b,e[0],e[1])) return false; }
      return true;
    };
    for(let attempt=0;attempt<16;attempt++){
      const s=[], g=[], segs=[], pts=[];
      let ok=true;
      for(let k=0;k<T&&ok;k++){
        let run=null;
        for(let go=0;go<30&&!run;go++){
          const c0=Math.floor(rnd()*Math.max(1,cols-L+1)), r0=Math.floor(rnd()*rows);
          const p0=P(c0,r0);
          if(!clear(pts,segs,p0)) continue;
          const walk=[{c:c0,r:r0,p:p0}], own=[];
          while(walk.length<L){
            let took=false;
            for(let t=0;t<26&&!took;t++){
              const dx=1+Math.floor(rnd()*3), q=Math.floor(rnd()*3), dy=(q-1)*dx;
              const last=walk[walk.length-1];
              const c=last.c+dx, r=last.r+dy;
              if(c>=cols||r<0||r>=rows) continue;
              if(cols-c < L-walk.length-1) continue;      // leave room to finish
              const p=P(c,r);
              if(!clear(pts,segs,p,last.p,p)) continue;
              let self=false;
              for(let z=0;z+1<own.length && !self;z++)
                if(segX(last.p,p,own[z],own[z+1])) self=true;
              if(self) continue;
              walk.push({c,r,p}); own.push(last.p); took=true;
            }
            if(!took) break;
          }
          if(walk.length>=L && walk[walk.length-1].c-c0 >= Math.max(2,Math.round((cols-1)*.5))) run=walk;
        }
        if(!run){ok=false;break}
        s[k]=run.map(w=>w.p); g[k]=run.map((_,i)=>'c'+i);
        for(const w of run) pts.push(w.p);
        for(let i=0;i+1<run.length;i++) segs.push([run[i].p,run[i+1].p]);
      }
      if(ok) return {s,g};
    }
    return {s:[],g:[]};
  }}
};

const FAM_LIST=['layered','arcs','hourglass','lattice','ring','fan','residual','drift','meander'];
const FAM_FROM={layered:0, arcs:1, hourglass:1, lattice:1, ring:3, fan:4, residual:5,
                drift:0, meander:0};
const FAM_WIDE={drift:1, meander:1};
const FAM_UNTIL={ring:8, fan:8};
let _famDay=null,_famSeq=null;
function famSeq(day){
  if(_famDay===day) return _famSeq;
  const rnd=mulberry32(fnv(day+':layout')), seq=[], used={};
  const rules=genRules(genFor(day));
  for(let i=0;i<32;i++){
    const s=netSpec(i,rules), T=s.threads, L=Math.max(3,s.nodes);
    const all=FAM_LIST.filter(f=>FAM_FROM[f]<=i && i<=(FAM_UNTIL[f]??99)
                                 && (!FAM_WIDE[f] || rules.open==='wide')
                                 && T>=FAMILIES[f].minT && L>=FAMILIES[f].minL);
    let pool=all.filter(f=>f!==seq[i-1] && (i>=10 || (used[f]||0)<2));
    if(pool.length<2) pool=all.filter(f=>i>=10 || (used[f]||0)<2);
    if(!pool.length) pool=all;
    const f=pool[Math.floor(rnd()*pool.length)];
    seq.push(f); used[f]=(used[f]||0)+1;
  }
  _famDay=day; _famSeq=seq;
  return seq;
}
const famFor=(day,i)=>famSeq(day)[Math.min(i,31)];

const FAM_PAR=[3,4,5,6,7,8,10,11,13,15];
const famTarget=i=>i<FAM_PAR.length?FAM_PAR[i]:15+Math.floor((i-9)*1.5);

const WEAVES={
  twist:  (i,L,a)=> a*i,
  chevron:(i,L,a)=> a*(i<=(L-1)/2 ? i : L-1-i),
  wave:   (i,L,a)=> Math.round(a*Math.sin(2*Math.PI*i/Math.max(1,L-1))*1.5),
  plait:  (i,L,a)=> a*(i%2)
};
const WEAVE_LIST=['twist','chevron','wave','plait'];
function famWeave(order, name, amp){
  const f=WEAVES[name]; if(!f||!amp) return;
  const L=Math.max(...order.map(o=>o.length));
  const placed=new Set();
  for(let i=0;i<L;i++){
    const seats=[];
    for(let k=0;k<order.length;k++){
      const n=order[k][i];
      if(n && !n.pinned && !placed.has(n) && !seats.includes(n)) seats.push(n);
    }
    if(seats.length<2) continue;
    seats.forEach(n=>placed.add(n));
    const home=seats.map(n=>({x:n.x, y:n.y}));
    const S=seats.length, sh=((Math.round(f(i,L,amp))%S)+S)%S;
    if(!sh) continue;
    seats.forEach((n,j)=>{ n.x=home[(j+sh)%S].x; n.y=home[(j+sh)%S].y });
  }
}
function famStep(live,cyc,local,rnd){
  const byG=new Map();
  live.forEach(n=>{if(n.pinned)return;
                   const a=byG.get(n.gid)||[]; a.push(n); byG.set(n.gid,a)});
  const gids=[...byG.keys()].sort();
  gids.forEach(g=>byG.get(g).sort((a,b)=>a.oi-b.oi));
  const runs=(arr,k)=>{
    const out=[];
    for(let s=0;s+k<=arr.length;s++){
      let ok=true; for(let j=0;j<k;j++) if(arr[s+j].moved){ok=false;break}
      if(ok) out.push(s);
    }
    return out;
  };
  const usable=gids.filter(g=>{
    const arr=byG.get(g);
    return local ? runs(arr,2).length>0 : arr.filter(n=>!n.moved).length>=2;
  });
  if(!usable.length) return null;
  const arr=byG.get(usable[Math.floor(rnd()*usable.length)]);
  const free=arr.filter(n=>!n.moved);
  const want=Math.min(2+Math.floor(rnd()*Math.max(1,cyc-1)), free.length);
  let pick=null;
  if(local){
    for(let k=want;k>=2 && !pick;k--){
      const r=runs(arr,k);
      if(r.length){ const s=r[Math.floor(rnd()*r.length)]; pick=arr.slice(s,s+k) }
    }
  } else {
    const p=free.slice(); pick=[];
    for(let j=0;j<want;j++) pick.push(p.splice(Math.floor(rnd()*p.length),1)[0]);
  }
  if(!pick||pick.length<2) return null;
  const px=pick.map(n=>n.x), py=pick.map(n=>n.y), k=pick.length;
  pick.forEach((n,j)=>{n.x=px[(j+1)%k]; n.y=py[(j+1)%k]; n.moved=true});
  return {pick, px, py};
}

function famChord(fig, chords, k){
  const o=fig[k], n=o.length;
  if(n<3) return null;
  const cand=[];
  for(let j=2;j<n;j++) cand.push([0,j]);           // the head tied back in
  for(let i=n-3;i>=1;i--) cand.push([i,n-1]);      // the tail tied back in
  cand.sort((p,q)=>{
    const sp=p[1]-p[0], sq=q[1]-q[0];
    return (sp===n-1?1:0)-(sq===n-1?1:0) || sq-sp || p[0]-q[0];
  });
  for(const c of cand){
    const A=o[c[0]], B=o[c[1]];
    let ok=true;
    for(let i=0;i<fig.length && ok;i++) for(const p of fig[i]){
      if(p===A||p===B) continue;
      if(segDist(p,A,B)<MIN_SEP){ ok=false; break }
    }
    for(let i=0;i<fig.length && ok;i++){
      const P=fig[i], S=segList(P.length, chords[i]);
      for(const [u,v] of S){
        const q1=P[u], q2=P[v];
        if(q1===A||q1===B||q2===A||q2===B) continue;
        if(segX(A,B,q1,q2)){ ok=false; break }
      }
    }
    if(ok) return c;
  }
  return null;
}

const CHORD_FROM=2, CHORD_OPEN=1;
const famCeil=want=>Math.round(want*1.8)+2;
function famPlan(fam,T,L,shared,pinned,want,tut,rnd,idx,lens){
  const F=FAMILIES[fam];
  if(!F || T<F.minT || L<F.minL) return null;
  const xCap = GEN_RULES.dense==='cap' ? famCeil(want) : Infinity;
  const {s,g}=F.slots(T,L,tut,rnd);
  const rot = lens ? Math.floor(rnd()*T) : 0;
  if(lens) for(let k=0;k<T;k++){
    if(!s[k]) continue;
    const want=Math.max(3, Math.min(lens[(k+rot)%lens.length], s[k].length));
    if(want>=s[k].length) continue;
    const o=Math.floor(rnd()*(s[k].length-want+1));
    s[k]=s[k].slice(o,o+want); g[k]=g[k].slice(o,o+want);
  }
  const nodes=[], order=[];
  for(let k=0;k<T;k++){
    if(!s[k] || s[k].length<2) return null;
    order[k]=[];
    for(let i=0;i<s[k].length;i++){
      const n={hx:s[k][i].x, hy:s[k][i].y, x:s[k][i].x, y:s[k][i].y, oi:k,
               gid:g[k][i], t:[k], pinned:false, merged:false, gone:false, alt:null};
      nodes.push(n); order[k].push(n);
    }
  }
  let minSep=Infinity;
  for(let a=0;a<nodes.length;a++){
    const A=nodes[a];
    if(Math.abs(clampX(A.hx)-A.hx)>.5 || Math.abs(clampY(A.hy)-A.hy)>.5) return null;
    for(let b=a+1;b<nodes.length;b++)
      minSep=Math.min(minSep, Math.hypot(A.hx-nodes[b].hx, A.hy-nodes[b].hy));
  }
  if(minSep<FAM_SEP) return null;
  if(!famCrossFree(order.map(o=>o.map(n=>({x:n.hx,y:n.hy}))))) return null;

  const pairs=[];
  for(let a=0;a<nodes.length;a++)for(let b=a+1;b<nodes.length;b++){
    if(nodes[a].t[0]===nodes[b].t[0]) continue;      // one thread cannot superpose with itself
    pairs.push([Math.hypot(nodes[a].hx-nodes[b].hx, nodes[a].hy-nodes[b].hy), nodes[a], nodes[b]]);
  }
  const tight=pairs.length?Math.min(...pairs.map(p=>p[0])):0;
  let merges=0;
  const bands = GEN_RULES.merge==='widen' ? [1.35,2,3,6,Infinity] : [1.35];
  for(const w of bands){
    if(merges>=shared) break;
    const near=pairs.filter(p=>p[0]<=tight*w).map(p=>[p[1],p[2]]);
    for(let i=near.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[near[i],near[j]]=[near[j],near[i]]}
    for(const [A,B] of near){
      if(merges>=shared) break;
      if(A.gone||B.gone||A.merged||B.merged) continue;
      const ka=A.t[0], kb=B.t[0];
      if(ka===kb) continue;
      if(order[ka].includes(B) || order[kb].includes(A)) continue;
      order[kb][order[kb].indexOf(B)]=A;
      A.t.push(kb); A.merged=true; A.alt={x:B.hx,y:B.hy};
      B.gone=true; merges++;
    }
  }

  let chords=null;
  if(GEN_RULES.chord==='one' || GEN_RULES.chord==='late'){
    const fin=order.map((o,k)=>o.map(n=>
      (n.merged && n.t[1]===k && n.alt) ? {x:n.alt.x, y:n.alt.y}
                                        : {x:n.hx, y:n.hy}));
    chords=order.map(()=>null);
    const room = (GEN_RULES.chord==='late' && idx!=null && idx<CHORD_FROM) ? CHORD_OPEN : order.length;
    let put=0;
    for(let k=0;k<order.length;k++){
      if(put>=room) break;
      chords[k]=famChord(fin, chords, k);
      if(chords[k]) put++;
    }
    if(!chords.some(c=>c) || !famCrossFree(fin, chords)) chords=null;
  }
  const live=nodes.filter(n=>!n.gone);

  for(let p=0;p<pinned;p++){

    let cands=order[k].filter(n=>!n.pinned && !n.merged);
    if(!cands.length && GEN_RULES.pinFill) cands=live.filter(n=>!n.pinned && !n.merged);
    if(!cands.length) continue;
    cands[Math.floor(rnd()*cands.length)].pinned=true;
  }

  live.forEach(n=>n.moved=false);
  const plan={fam, nodes:live, order, chords, d:0, merges, minSep, par:0, x:0};


  if(GEN_RULES.weave==='pattern' && T>=3){
    const home=live.map(n=>({n, x:n.x, y:n.y}));
    const restore=()=>home.forEach(h=>{h.n.x=h.x; h.n.y=h.y});
    let best=null;
    const off=Math.floor(rnd()*WEAVE_LIST.length);
    for(let w=0;w<WEAVE_LIST.length;w++){
      const name=WEAVE_LIST[(w+off)%WEAVE_LIST.length];
      for(let amp=1;amp<=3;amp++){
        restore();

    if(!st) break;
    const priced=famCost(plan), x=famX(plan);
    const holdsX = GEN_RULES.weave!=='pattern' || x>=plan.x;
    if((priced>plan.par || (priced===plan.par && x>plan.x)) && holdsX && x<=xCap){
      if(priced>plan.par) miss=0;

    } else {
      st.pick.forEach((n,j)=>{n.x=st.px[j]; n.y=st.py[j]; n.moved=false});

        if(priced>plan.par) miss=0;

      } else {
        st.pick.forEach((n,j)=>{n.x=st.px[j]; n.y=st.py[j]; n.moved=false});
        miss++;

    }

}

function famCost(plan){
  const at=new Map(); plan.nodes.forEach((n,i)=>at.set(n,i));

  P.forEach(p=>{
    if(!p.merged) return;
    const kb=p.t[1], j=seq[kb].indexOf(p);
    const half={x:p.x, y:p.y, hx:p.alt?p.alt.x:null,

    p.x=put.a.x; p.y=put.a.y; half.x=put.b.x; half.y=put.b.y;

function famGreedy(plan){

  const byI=new Map(P.map(p=>[p.i,p]));

    const c=new Array(T).fill(0);
    for(let a=0;a<T;a++){

      const U=seq[a], SU=S[a];

        const p1=U[SU[p][0]],p2=U[SU[p][1]],q1=U[SU[q][0]],q2=U[SU[q][1]];
        if(p1===q1||p1===q2||p2===q1||p2===q2)continue;

      }
      for(let b=a+1;b<T;b++){

        for(let p=0;p<SU.length;p++)for(let q=0;q<SV.length;q++){
          const p1=U[SU[p][0]],p2=U[SU[p][1]],q1=V[SV[q][0]],q2=V[SV[q][1]];
          if(p1===q1||p1===q2||p2===q1||p2===q2)continue;
          if(segX(p1,p2,q1,q2)){c[a]++;c[b]++}
        }
      }
    }

  };
  const sweep=()=>{
    const c=cross();
    for(let k=0;k<T;k++){
      if(freed[k]) continue;
      if(c[k]===0 && !seq[k].some(p=>p.merged)) freed[k]=true;
    }

                  hy:p.alt?p.alt.y:null, merged:false, t:[kb], i:1000+p.i};
      seq[kb][j]=half;
      p.merged=false; p.t=[p.t[0]];
      const put=splitPlace(p.i, p.x, p.y, famProbe(seq,T,p,half,S));

          if(p1===q1||p1===q2||p2===q1||p2===q2)continue;

function famBest(plan){

function featureShape(k,n){

  const key=k+':'+n; if(key in _shapeCache) return _shapeCache[key];
  if(!_shapeSVG){
    _shapeSVG=document.createElementNS('http://www.w3.org/2000/svg','svg');
    _shapeSVG.setAttribute('viewBox','0 0 96 96');
    _shapeSVG.style.cssText='position:absolute;left:-9999px;width:96px;height:96px';
    document.body.appendChild(_shapeSVG);
  }
  _shapeSVG.innerHTML='<g>'+FEATURES[k].p+'</g>';
  let e=null,L=0;
  for(const el of _shapeSVG.firstChild.children){
    let l=0; try{ l=el.getTotalLength() }catch(err){ l=0 }
    if(l>4){ e=el; L=l; break }

  const a=at(0), z=at(L);

    return Math.abs((q[0]-p[0])*(r[1]-p[1])-(r[0]-p[0])*(q[1]-p[1]));
  };

      const v=tri(i,pts); if(v<bv){ bv=v; bi=i }
    }

  }

  n.threads.forEach(t=>{
    const i=t.nodes.indexOf(n); if(i<0) return;
    add(t.nodes[i-1],1); add(t.nodes[i+1],1);
    add(t.nodes[i-2],.42); add(t.nodes[i+2],.42);
    if(t.chord){
      const [a,b]=t.chord;
      if(i===a){ add(t.nodes[b],1); add(t.nodes[b-1],.42); add(t.nodes[b+1],.42) }
      if(i===b){ add(t.nodes[a],1); add(t.nodes[a-1],.42); add(t.nodes[a+1],.42) }
    }

const DESCENT_OFFER_MS=8000, DESCENT_TICK_MS=380, DESCENT_GLIDE=520,

function bumpIdle(){

function incidentCross(n){
  let c=0;
  const act=threads.filter(t=>!t.freed);
  const P=m=>({x:m.x0,y:m.y0});
  const self=GEN_RULES.selfX==='count';
  for(const A of n.threads){
    if(A.freed) continue;
    const i=A.nodes.indexOf(n); if(i<0) continue;
    const SA=segList(A.nodes.length,A.chord);
    const segs=SA.filter(s=>s[0]===i||s[1]===i).map(s=>[A.nodes[s[0]],A.nodes[s[1]]]);
    for(const [p1,p2] of segs) for(const B of act){
      if(B===A && !self) continue;
      const SB=segList(B.nodes.length,B.chord);
      for(const [u,v] of SB){
        const n3=B.nodes[u],n4=B.nodes[v];
        if(p1===n3||p1===n4||p2===n3||p2===n4) continue;
        if(segX(P(p1),P(p2),P(n3),P(n4))) c++;
      }
    }
  }
  return c;
}
function crossingsIfMoved(n,nx,ny,base){
  const ox=n.x0, oy=n.y0;
  const before=incidentCross(n);
  n.x0=nx; n.y0=ny;
  const after=incidentCross(n);
  n.x0=ox; n.y0=oy;
  return base-before+after;
}

function descentTick(){

    if(!descentArmed) btn.classList.remove('on');

  if(!descentArmed){
    btn.classList.toggle('on', idle>DESCENT_OFFER_MS);
    return;
  }
  if(idle<1200) return;           // pause while the player is actively working
  if(descentStalledAt===idleAt) return;
  const base=countCross().total;
  if(base===0) return;
  const spin=assistSpin(r,'descent',DESCENT_ANGLES);
  const searchIn=nodes=>{
    for(const rad of DESCENT_RADII){
      for(const n of nodes){
        if(n.pinned||n.threads.every(t=>t.freed)) continue;
        for(let a=0;a<DESCENT_ANGLES;a++){
          const th=((a+spin)%DESCENT_ANGLES)*2*Math.PI/DESCENT_ANGLES;
          const nx=clampX(n.x0+Math.cos(th)*rad);
          const ny=clampY(n.y0+Math.sin(th)*rad);
          if(crossingsIfMoved(n,nx,ny,base)<base) return {n,nx,ny};
        }
      }
    }
    return null;
  };
  const worst=threads.filter(t=>!t.freed).sort((a,b)=>b.crossings-a.crossings)[0];
  const best = (worst && searchIn(worst.nodes))
            || searchIn(members.filter(n=>!n.pinned&&!n.threads.every(t=>t.freed)));
  if(!best){
    descentStalledAt=idleAt;
    if(++descentStall===1) flashMsg(mergedCount()

      : 'descent has settled as far as it can · the last crossings are yours',

  r.assisted=true;
  r.assists=(r.assists||0)+1;

             t0:performance.now(), dur:DESCENT_GLIDE};

  r.positions[best.n.idx]=[Math.round(best.n.x0*10)/10,Math.round(best.n.y0*10)/10];
  countCross();
  threads.filter(t=>!t.freed&&canFree(t)).forEach(t=>{freeThread(t,false);r.freed.push(t.key)});
  save(); refresh(); renderHud();
  if(threads.every(t=>t.freed)){
    if(settlingNode){settlingNode.el.classList.remove('settling');settlingNode=null}
    clearNet();
  }
}

const TUTNETS=[

function tutCross(sub,want){
  const pt=n=>(sub&&n===sub.n)?{x:sub.x,y:sub.y}:{x:n.x0,y:n.y0};
  const act=threads.filter(t=>!t.freed);
  const per=act.map(()=>0);
  let total=0; const mine=[];
  for(let i=0;i<act.length;i++)for(let j=i+1;j<act.length;j++){
    const A=act[i],B=act[j];
    for(let a=0;a<A.nodes.length-1;a++)for(let b=0;b<B.nodes.length-1;b++){
      const n1=A.nodes[a],n2=A.nodes[a+1],n3=B.nodes[b],n4=B.nodes[b+1];
      if(n1===n3||n1===n4||n2===n3||n2===n4)continue;

      if(want&&(n1===want||n2===want||n3===want||n4===want)) mine.push(x);
    }

  act.forEach((t,i)=>{ if(per[i]===0 && !t.nodes.some(n=>n.merged)) freeable++ });

    : a.solid  !==b.solid    ? a.solid  >b.solid
    : a.clear  !==b.clear    ? a.clear  >b.clear
    : a.d<b.d;
  const clearPath=(n,x,y)=>{
    const ax=n.x0, ay=n.y0, vx=x-ax, vy=y-ay, L2=vx*vx+vy*vy;
    return members.every(m=>{
      if(m===n) return true;
      const u=L2?Math.max(0,Math.min(1,((m.x0-ax)*vx+(m.y0-ay)*vy)/L2)):0;
      return Math.hypot(m.x0-(ax+vx*u), m.y0-(ay+vy*u))>=MIN_SEP;
    }) ? 1 : 0;
  };
  const test=(n,x,y)=>{
    const d=Math.hypot(n.x0-x,n.y0-y);
    if(d<MIN_SEP) return;                      // not a move you could tell you made
    if(members.some(m=>m!==n&&Math.hypot(m.x0-x,m.y0-y)<MIN_SEP)) return;
    const r=tutCross({n,x,y},null);
    if(best && (r.freeable<best.freeable
      || (r.freeable===best.freeable && r.total>best.total))) return;
    let solid=0;
    for(let a=0;a<8;a++){
      const th=a*Math.PI/4;
      if(tutCross({n, x:clampX(x+Math.cos(th)*TUT_ROOM),
                      y:clampY(y+Math.sin(th)*TUT_ROOM)},null).total<=r.total) solid++;
    }
    const cand={n,x,y,total:r.total,freeable:r.freeable,solid,clear:clearPath(n,x,y),d};
    if(better(cand,best)) best=cand;
  };
  const gx=Math.max(7,Math.round(TUT_GRID*Math.min(1,8/Math.max(1,movable.length))));
  const gy=Math.max(3,Math.round(gx*(by1-by0)/Math.max(1,bx1-bx0)));
  movable.forEach(n=>{
    for(let i=0;i<gx;i++)for(let j=0;j<gy;j++)
      test(n, bx0+(bx1-bx0)*i/(gx-1), by0+(by1-by0)*j/(gy-1));
  });
  if(!best) return null;
  let step=Math.max((bx1-bx0)/(gx-1),(by1-by0)/(gy-1))/2;
  for(let pass=0;pass<3;pass++,step/=2){
    const c=best;
    for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++){
      if(!dx&&!dy) continue;
      test(c.n, clampX(c.x+dx*step), clampY(c.y+dy*step));
    }
  }
  if(best.freeable<=now.freeable && best.total>=now.total) return null;
  return {n:best.n, x:best.x, y:best.y, marks:tutCross(null,best.n).mine};
}

  if(!inTutorial()||!tutLights.length) return;
  const field=$('field'), svg=$('netsvg'), coach=$('coach');
  if(!field||!svg||!coach||!coach.offsetWidth||!coach.offsetHeight) return;
  const fr=field.getBoundingClientRect(), sr=svg.getBoundingClientRect();
  const vb=svg.viewBox.baseVal;
  if(!fr.width||!fr.height||!sr.width||!sr.height||!vb.width||!vb.height) return;
  const k=Math.min(sr.width/vb.width,sr.height/vb.height);
  const plate={
    left:sr.left+(sr.width-vb.width*k)/2,
    top:sr.top+(sr.height-vb.height*k)/2,
    width:vb.width*k,height:vb.height*k,
  };
  const pad=matchMedia('(max-width:700px)').matches?10:16;
  const w=coach.offsetWidth, h=coach.offsetHeight;
  const xs=[plate.left+pad, plate.left+plate.width-pad-w];
  const ys=[plate.top+pad, plate.top+plate.height-pad-h];
  const m=boardCTM(), scale=boardScale();
  if(!m) return;
  const points=[];
  tutLights.forEach(l=>{
    const add=(x,y,r)=>{
      const p=new DOMPoint(x,y).matrixTransform(m);
      points.push({x:p.x,y:p.y,r});
    };
    add(l.n.x0,l.n.y0,Math.max(34,46*(NR/10)*scale));
    l.marks.forEach(x=>add(x.x,x.y,Math.max(24,24*(NR/10)*scale)));
  });
  const candidates=[];
  xs.forEach(x=>ys.forEach(y=>{
    const r={left:x,top:y,right:x+w,bottom:y+h};
    const score=Math.min(...points.map(p=>{
      const dx=Math.max(r.left-p.x,0,p.x-r.right);
      const dy=Math.max(r.top-p.y,0,p.y-r.bottom);
      return Math.hypot(dx,dy)-p.r;
    }));
    candidates.push({x,y,score});
  }));
  candidates.sort((a,b)=>b.score-a.score || a.y-b.y || a.x-b.x);
  const best=candidates[0];

  coach.style.top=(best.y-fr.top)+'px';
}

    const had=row.depth||0;
    const keyNow=rungCount(cl.map(c=>c.tier), POLICY.dailyNets).key;
    const keyHad=rungsOf(row.tiers) ? rungsOf(row.tiers).key : -1;
    const better = keyNow!==keyHad ? keyNow>keyHad

function renderThreads(){

  if(c.dataset.done) return;          // a cleared net holds this bay until the next one — see holdGauge
  if(c.dataset.sig!==sig || threads.some(t=>!t.slot||!t.slot.isConnected)){
    c.dataset.sig=sig;
    c.innerHTML='';
    $('field').classList.remove('dimthreads');
    threads.forEach(t=>{
      const b=document.createElement('button');
      b.className='tval'; b.type='button';
      b.style.setProperty('--fill','var('+t.col+')');
      const lit=on=>{
        if(!t.el||!t.el.isConnected) return;
        $('field').classList.toggle('dimthreads',on);
        threads.forEach(x=>{if(x.el) x.el.classList.toggle('lit',on&&x===t)});
      };
      b.onpointerenter=()=>{clearTimeout(t.litT); lit(true)};
      b.onpointerleave=()=>{clearTimeout(t.litT); lit(false)};
      b.onclick=()=>{lit(true); clearTimeout(t.litT); t.litT=setTimeout(()=>lit(false),1100)};
      c.appendChild(b); t.slot=b;
    });
  }
  threads.forEach(t=>{
    if(!t.slot)return;
    const shares=!t.freed&&t.nodes.some(n=>n.merged);
    t.slot.style.flexGrow = t.crossings;
    t.slot.classList.toggle('clear', t.crossings===0);
    const idx=threads.indexOf(t)+1;
    t.slot.setAttribute('aria-label',
      t.freed?t.key+' · freed'
      :'thread '+idx+' · '+(shares&&t.crossings===0?'shares a neuron, split it'
                    :t.crossings+' crossings'));
  });
}

function sayShow(txt,o){

  const now=performance.now();
  const row=Object.assign({txt}, sayParts(txt,o), o);
  const merging = sayRows.length && sayRows.length<SAY_ROWS && (now-sayAt)<SAY_MERGE;
  if(merging) sayRows.push(row); else { sayRows=[row]; sayAt=now }

  const cols=[]; sayRows.forEach(r=>(r.cols||['--silver']).forEach(c=>{if(!cols.includes(c))cols.push(c)}));
  el.innerHTML='<div class="saycard">'
    +`<div class="saystrip">${cols.map(c=>`<i style="background:var(${c})"></i>`).join('')}</div>`
    +sayRows.map((r,i)=>{

      const bar=rc.length>1
        ? `background:linear-gradient(var(${rc[0]}) 0 50%,var(${rc[1]}) 50% 100%)`
        : `background:var(${rc[0]})`;
      const lead=r.mark ? r.mark
        : sayRows.length>1 ? `<i class="saybar" style="${bar}"></i>` : '';
      const fresh=(merging && i===sayRows.length-1) ? ' rowin' : '';
      return `<div class="sayrow${fresh}${r.tight?' tight':''}">${lead}<div class="saytext">`
        +(r.kick?`<span class="saykick">${r.kick}</span>`:'')
        +`<div class="sayline${r.big?' big':''}">${r.line}</div></div></div>`;
    }).join('')
    +'</div>';
  el.classList.add('on');

  const chars=sayRows.reduce((a,r)=>a+r.txt.length,0);
  const mult=sayRows.some(r=>r.hold)?1.3:1;
  const hold=Math.min(SAY_MAX,Math.max(SAY_MIN,(SAY_BASE+SAY_PER*chars)*mult));
  if(sayT)clearTimeout(sayT);
  sayT=setTimeout(()=>{sayRows=[];sayAt=0;sayT=null;el.classList.remove('on')},hold);

    cells.length+' of '+D+' nets cleared');

window.__solveNet=()=>{
  const r=R();
  if(r.over) return;
  if(spec.fam){
    const plan=spec.plan;
    const route = (plan && GEN_RULES.parMode==='greedy')
      ? famGreedy(plan).log
      : [...members.filter(n=>n.merged).map(n=>['split',n.idx]),
         ...members.map(n=>['drag',n.idx])];
    for(const [kind,idx] of route){
      const n=members.find(m=>m.idx===idx);
      if(!n) continue;
      if(kind==='split'){
        if(!n.merged) continue;
        const alt=n.alt;
        (r.splitNodes=r.splitNodes||[]).push(n.idx);
        splitNode(n,true);
        chargeTurn(r,[1,n.idx,...(r.positions[n.idx]||[]),...(r.positions[1000+n.idx]||[])]);
        const half=members.find(m=>m.idx===1000+n.idx);
        if(half&&alt){half.hx=alt.x; half.hy=alt.y}
      } else {
        if(n.pinned||n.hx==null||n.merged) continue;
        if(Math.hypot(n.x0-n.hx,n.y0-n.hy)<=MIN_SEP*.7) continue;
        n.x0=clampX(n.hx); n.y0=clampY(n.hy);
        r.positions[n.idx]=[n.x0,n.y0];
        chargeTurn(r,[0,n.idx,Math.round(n.x0*10)/10,Math.round(n.y0*10)/10]);
      }
    }
    recordDay(); countCross();
    threads.filter(t=>!t.freed&&canFree(t)).forEach(t=>{freeThread(t,false);r.freed.push(t.key)});
    save(); refresh(); renderHud();
    if(threads.every(t=>t.freed))clearNet();
    return;
  }
  const lane=t=>BH*.09+threads.indexOf(t)*(BH*.82/Math.max(1,threads.length-1));
  const done=new Set(); let sh=0;
  threads.filter(t=>!t.freed).forEach(t=>{
    t.nodes.forEach((n,i)=>{
      if(done.has(n.idx))return; done.add(n.idx);
      if(n.pinned){done.add(n.idx);return}          // pins are already where they must be
      if(n.threads.length>1){n.x0=BW*.42+95*(sh++);n.y0=(lane(n.threads[0])+lane(n.threads[1]))/2}
      else{n.x0=clampX(BW*.07+(BW*.86*i/Math.max(1,t.nodes.length-1)));n.y0=lane(t)+(i%2?9:-9)}
      r.positions[n.idx]=[n.x0,n.y0];
    });
    r.turns=(r.turns||0)+1; r.netMoves++; r.logGap=true;
  });
  members.filter(n=>n.merged).slice().forEach(n=>{
    (r.splitNodes=r.splitNodes||[]).push(n.idx);
    splitNode(n,true); r.turns=(r.turns||0)+1; r.netMoves++; r.logGap=true;
  });
  recordDay(); countCross();
  threads.filter(t=>!t.freed&&canFree(t)).forEach(t=>{freeThread(t,false);r.freed.push(t.key)});
  save(); refresh(); renderHud();
  if(threads.every(t=>t.freed))clearNet();
};
if(!DEV){ delete window.__solveNet; delete window.__st }

renderAll();
publishPlateInset();
addEventListener('load',publishPlateInset);
if(!store.introSeen || (store.lastIntroDay!==today() && R().netMoves===0 && !R().cleared.length)){
  openMenu('home');
}
readUnlockReturn().then(wakeAccount);
</script>
