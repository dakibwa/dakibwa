/* board coordinate space. bigger than the old 720x400 so nodes have room to
   breathe at the same on-screen size — crowding was doing difficulty's job. */
const BW=1040, BH=580, PADX=24, PADY=22;
const clampX=x=>Math.max(PADX,Math.min(BW-PADX,x));
const clampY=y=>Math.max(PADY,Math.min(BH-PADY,y));

/* --gelb is back. it was pulled when the board was white paper, where a 3.4px
   yellow line measured 1.68:1 and read as a gap; against this ground it measures
   10.32:1 and is one of the clearest threads on the board. --dunkelblau goes the
   other way — 1.9:1 here — and is replaced by the near-white ink.

   the ORDER is the accessibility fix. a net takes THREADPAL[0..k-1], so the
   order decides which pairs a player ever has to tell apart, and colour is the
   only thing telling threads apart at all. every pair was measured as CIE76
   deltaE after simulating deuteranopia, protanopia and tritanopia; under about
   18 is a confusion risk. the old order put green third, and light blue against
   green is 13.7 apart to a tritanope — so every three-thread net, which is most
   of the week, had a pair that could read as one thread.

   --ink IS NOT A THREAD COLOUR, and that overrides the ordering argument above.
   it used to sit third, because it separated better than anything else could:
   the three-thread floor was 46.8 with it and is 18.5 without. but --ink is also
   what a CROSSING is drawn in — see crossParts, an ink ring between two paper
   bands — so every net from the third rung on had one thread painted in exactly
   the colour of every mark the player is hunting. that is a legibility cost paid
   by everyone, on most nets, all of the time, and it is worse than the one it
   was buying off. a crossing has to be the only ink on the board.

   so the order is the same order, minus ink, which puts yellow third. that is
   also the best third available: measured as CIE76 deltaE after simulating
   protanopia, deuteranopia and tritanopia, the three-thread floor is 25.4 light
   / 18.5 dark with yellow, against 18.8 / 14.5 for violet, 11.8 / 5.1 for
   turquoise and 7.0 / 9.7 for green.

   the residual, stated plainly and it is now bigger: four threads floor at 16.2
   light / 14.5 dark (yellow against violet to a tritanope), and five at 7.0 /
   9.7 (light blue against green). both are under the ~18 confusion line, and
   five-thread nets were already under it at 14.5 before this change. colour is
   still the only channel telling threads apart, and there is no seventh colour
   left to reach for — dash is spoken for (`.thread.freedt`) and stroke width is
   bound to feature strength, so closing this properly means a NEW channel, not a
   better ordering. that is the outstanding piece of work here. */
const THREADPAL=['--sig-hellblau','--sig-orange','--sig-gelb','--sig-violett','--sig-gruen','--sig-tuerkis'];
/* a deliberately gentle opening: the first nets are almost free, and
   difficulty arrives one ingredient at a time — length, then a third
   thread, then shared neurons, then width. */
/* difficulty arrives as new *constraints*, not just more of everything:
   length, then a third feature, then a shared neuron to split, then pinned
   neurons you cannot move at all, then width. */
const RAMP=[
  {threads:2, nodes:3, shared:0, pinned:0, minX:2,  maxX:4},   // tutorial-sized
  {threads:2, nodes:4, shared:0, pinned:0, minX:3,  maxX:6},
  {threads:2, nodes:5, shared:0, pinned:0, minX:4,  maxX:9},
  {threads:3, nodes:4, shared:0, pinned:0, minX:6,  maxX:12},
  {threads:3, nodes:5, shared:1, pinned:0, minX:8,  maxX:16},
  {threads:3, nodes:5, shared:1, pinned:1, minX:10, maxX:20},
  {threads:3, nodes:6, shared:1, pinned:2, minX:12, maxX:24},
  {threads:4, nodes:5, shared:2, pinned:2, minX:14, maxX:30}
];
function netSpec(i){
  const s = i<RAMP.length ? {...RAMP[i]}
    : {threads:5, nodes:5+((i-RAMP.length)%3), shared:Math.min(2+Math.floor((i-RAMP.length)/2),4),
       pinned:Math.min(2+Math.floor((i-RAMP.length)/3),5), minX:16, maxX:60};
  // par allows for the extra neurons strength brings, and for routing round pins
  s.par = s.threads*2 + s.shared*3 + (s.nodes-3)*2 + (s.pinned||0)*2 + 3;
  return s;
}

/* ---- the two lines a net is scored against ----

   the cleared card — comes through here, so the day the solver's numbers are
   wired is a change to OPTIMA and to nothing else.

   `optimum` is the true minimum. the game cannot compute it at play time; it is
   the offline solver's job, arriving as a {day, netIndex, optimum} lookup.
   `par` is the clean line, and today it is lanePar()'s geometric estimate, live
   on `spec` — measured against the net you actually got, so it is not
   netSpec()'s number.

   with no optimum, optimum stands AT par. that is what makes the whole ladder
   safe to ship early: `perfect` cannot fire, the turns track shows one band,
   and tierFor() returns exactly the two tiers it returned before. nothing here
   invents a number it does not have.

   THE SEAM. par is an estimate and it is a loose one: against the solver's
   output it sits 3 to 8 turns above the true optimum, and a competent-player
   proxy minted `clean` on ~90% of 500 nets. so the middle rung of the ladder
   is only worth something once par is derived from the optimum rather than
   from geometry — `par = optimum + allowance`, one line, right here. the
   allowance is deliberately NOT guessed: setting it wants the proxy's
   distribution of finishing move counts per net, not a plausible-looking
   constant, and a wrong one would restate every score in the game. */
/* the solver's best known route for every net, `day -> [ten turn counts]`,
   lifted from tools/optima.json. copied in rather than fetched because this file
   has no build step and no network; regenerate with tools/build-optima.mjs.
   grouped by day rather than keyed `day:index` because it is 610 numbers and a
   day is the unit everything else here is keyed on.

   WHAT `perfect` MEANS, EXACTLY. 67 of these are proved optima — 8 closed by A*,
   59 by a family construction the solver could bracket shut. the other 543 are
   UPPER BOUNDS: the cheapest route it found, not the cheapest that exists.
   shipping only the proved ones was the first cut, and it was honest and nearly
   useless — it lit the perfect band on 12.3% of nets, one or two a day, always
   an early one, so the ladder's top rung was invisible on the nets where it
   would have meant most. with the bounds in it is 96.8%, 9.7 nets of every ten,
   and no day without one.

   so `perfect` now means "you matched the best line anyone has found for this
   net", not "you proved the optimum". the failure mode of that is generous, not
   wrong: a player who finds something better still scores perfect, because the
   tier awards `moves <= optimum` — they simply are not told they beat it. the
   reverse, a target nobody can reach, cannot happen, because every one of these
   numbers is a route the solver actually walked.
   tightening the 543 is a solver problem, not a table problem — tools/BALANCE.md
   states the obstruction: the search is a column model and only two of the seven
   layout families reduce to one.

   the unit is TOTAL moves — every drag and every split, including the action
   that finishes the net, which is what netMoves counts now nothing is waived.
   optima.json also carries `optimumCharged`, the OLD billing, one lower. it is
   not the number this wants. */

function netTargets(){
  const par=spec?spec.par:0, r=R();
  const day=OPTIMA[r.day];                       // ten numbers, or nothing for a day outside the table
  const o=day?day[r.netIndex]:undefined;
  /* an optimum at or above par is not an optimum, and an optimum of zero is a
     rung everybody stands on — 17% of nets have one, because the move that
     finishes a net is not charged. both fall back rather than shipping a
     degenerate `perfect`; the real fix is upstream, in what counts as a move. */
  return {optimum:(typeof o==='number'&&o>0&&o<par)?o:par, par};
}

/* ================= state ================= */

const KEY='probe-run-v3';
/* the local date, not the UTC one. a daily puzzle should turn over at the
   player's midnight; toISOString() turned it over at 01:00 in british summer
   time, an hour after the run-over card says it does, and the masthead date
   disagreed with the calendar's today square for that hour. */
function today(){const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)}

/* ---- entitlement policy ----
   one run a day is the shipped free game. everything that limits play reads
   from here, so premium tiers (more runs, staged levels) become a change to
   this object rather than a hunt through the code. test builds are unlimited. */
const DEV = /^(localhost|127\.0\.0\.1|\[::1\]|.*\.local)$/.test(location.hostname)
         || /[?&]dev\b/.test(location.search);
/* there is no move budget. the day is a fixed set of ten and cannot be failed —
   the score is turns against par, per net — so a countdown to zero was a
   resource the game kept charging you for and never spent. it survived as a
   number in the cleared card ("moves left today", almost always 0 by net six),
   as a day row that saturated at fifty, and as a skip that quietly ended your
   day when it ran out. turns are counted up now, which is what the cleared card
   and the record were already doing. the masthead reads that count DOWN from
   par, but that is a readout of a turn budget the net genuinely has, not a
   day-long resource that could run out under you. */
const POLICY = {
  dailyNets: 10,           // today's ten, same ten for everyone
  runsPerDay: DEV ? Infinity : 1,
  /* the paid tier, and the whole of it: one boolean, kept in the save so the
     unlock button in the record survives a reload. it reads through to `store`
     rather than holding its own copy so that there is exactly one switch —
     the button, the devtools flip the archive was tested with, and anything a
     server eventually says all land on the same field. no payment goes
     anywhere near it and none can until there is a backend to take one. */
  get premium(){ return !!store.premium },
  set premium(v){ store.premium = !!v },
  get unlimited(){ return this.runsPerDay===Infinity }
};
let store={};
try{store=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){store={}}
if(!store.collection){
  store.collection={badges:{},tickets:[],playedDays:[],pairs:{}};
  try{ // carry stamps/tickets forward from earlier prototypes
    const old=JSON.parse(localStorage.getItem('probe-proto-v2')||'{}');
    if(old.meta&&old.meta.playedDays) store.collection.playedDays=old.meta.playedDays;
  }catch(e){}
}
if(!store.meta) store.meta={streak:0,bestDepth:0,lastPlayDay:null};
if(!store.collection.pairs) store.collection.pairs={};   // added after first ship
/* the archive.
   nets are a pure function of (day, netIndex), so any past day is reproducible
   from its date alone — nothing is stored and nothing needs to be. playing one
   is therefore just a run whose `day` is not today. that single field already
   feeds the generator, so the rest of this is bookkeeping: keep the calendar
   honest about which days were played live, and keep the streak un-buyable. */
const LAUNCH='2026-08-01';
const dayAdd=(iso,n)=>new Date(new Date(iso+'T00:00:00Z').getTime()+n*864e5).toISOString().slice(0,10);
function newRun(mode,day){
  const d=day||today();
  store.run={day:d, mode:mode||'daily', archive:d!==today(),
             turns:0, netIndex:0, netMoves:0,
             positions:{}, freed:[], splitNodes:[], saeUsed:false, over:false, cleared:[], assisted:false};
}
const isTrial=()=>R().mode==='trial';
const isArchive=()=>!!R().archive;
/* today is free, yesterday is the taste, everything older is the paid tier.
   the future is not for sale — its puzzles do not exist yet. */
function canPlayDay(d){
  if(d>today() || d<LAUNCH) return false;
  if(d===today() || d===dayAdd(today(),-1)) return true;
  return !!POLICY.premium;
}
/* how many runs you have had TODAY is a fact about today, not about whichever
   run you happen to be sitting in. it used to be reset only where the run rolls
   over — which an archive run skips — so starting yesterday's puzzle at 23:50
   left the counter frozen and "run again" never appeared again. */
if(store.runsDay!==today()){ store.runsDay=today(); store.runsToday=0 }
// an archive run must survive a reload; only a live run rolls over at midnight
if(!store.run || (!store.run.archive && store.run.day!==today())){
  // the run created here IS the day's run, so it counts as one. leaving this
  // at 0 shipped two daily runs against a policy of one.
  store.runsToday=1;
  newRun();
}
if(store.runsToday==null) store.runsToday=0;
// a run saved under the budget model carries what it spent, not what it used
if(store.run && store.run.turns==null) store.run.turns=Math.max(0,50-(store.run.movesLeft??50));
function canStartAnotherRun(){
  return POLICY.unlimited || (store.runsToday||0) < POLICY.runsPerDay;
}
function startAnotherRun(){
  if(!canStartAnotherRun()) return false;
  store.runsToday=(store.runsToday||0)+1;
  newRun();
  builtFor=-1; resetDescent(); save();
  hideVeils(); renderAll();
  toast('fresh run · today\'s ten again');
  return true;
}
/* stopping for the day used to set `over`, which nothing could clear: the card
   said "the rest of today's set is still there when you are" and there was no
   way back to it. stopping is now a pause the run remembers, and `over` means
   only what it says. */
function pauseRun(){
  const r=R(); r.paused=true; r.over=true; save();
}
function resumeRun(){
  const r=R(); r.paused=false; r.over=false;
  builtFor=-1; resetDescent(); save();
  hideVeils(); renderAll();

  return true;
}
/* a trial used to overwrite today's run outright — reachable in one click from
   the run-over card — so a half-finished set vanished with no way back, and
   because the run counter had already spent the day there was no button to
   start another. park the daily run and hand it back when the trial ends. */
function resumeParked(){
  if(!store.parked) return false;
  store.run=store.parked; store.parked=null;
  return resumeRun();
}
function canResume(){
  return !!store.parked ||
         (R().paused && !isTrial() && R().cleared.length<POLICY.dailyNets);
}
/* time trial: no move budget — instead the net keeps training, re-tangling
   itself as you work. clear nets until it out-trains you. */
function startTrialRun(){
  const cur=R();
  if(cur && cur.mode!=='trial' && !cur.archive && cur.cleared.length<POLICY.dailyNets) store.parked=cur;
  newRun('trial');
  builtFor=-1; resetDescent(); save();
  hideVeils(); renderAll();
  // the trial already reads violet in the record; it keeps it here

           {cols:['--sig-violett']});
