   the self pass is the same rule countCross follows and for the same reason: a
   thread that meets its own line is crossing something, and from v9 that counts
   against it whether the meeting is over a chord or over a knot in a plain run.
   before v9 nobody looked, so it stays behind the version's rule. */
function famX(plan){
  const at=new Map(); plan.nodes.forEach((n,i)=>at.set(n,i));
  const P=plan.nodes.map(n=>({x:clampX(n.x), y:clampY(n.y)}));
  const seq=plan.order.map(o=>o.map(n=>P[at.get(n)]));
  const S=planSegs(plan), self=GEN_RULES.selfX==='count';
  let n=0;
  for(let a=0;a<seq.length;a++){
    const A=seq[a], SA=S[a];
    if(self) for(let p=0;p<SA.length;p++)for(let q=p+1;q<SA.length;q++){
      const p1=A[SA[p][0]],p2=A[SA[p][1]],q1=A[SA[q][0]],q2=A[SA[q][1]];
      if(p1===q1||p1===q2||p2===q1||p2===q2)continue;
      if(segX(p1,p2,q1,q2)) n++;
    }
    for(let b=a+1;b<seq.length;b++){
      const B=seq[b], SB=S[b];
      for(let p=0;p<SA.length;p++)for(let q=0;q<SB.length;q++){
        const p1=A[SA[p][0]],p2=A[SA[p][1]],q1=B[SB[q][0]],q2=B[SB[q][1]];
        if(p1===q1||p1===q2||p2===q1||p2===q2)continue;
        if(segX(p1,p2,q1,q2)) n++;
      }
    }
  }
  return n;
}

/* ---- what the solution costs, billed the way the game bills ----
   d + 2 per superposed pair is the obvious formula and it is wrong by up to
   seven turns on the widest nets, because a net can arrive at zero crossings
   before every displaced neuron has been put back: some of them were only
   crossing each other, and repairing their neighbours settled it. a formula
   that counts those prices a puzzle nobody has to solve.

   so par is not a formula. it is this walkthrough, run and counted: split
   every superposed neuron, then put every displaced one back, in the order
   the board holds them, charging exactly as a player's hand would be charged.
   window.__solveNet performs the same walk in the same order, which is why a
   dev run of it lands on par to the turn rather than near it.

   this used to skip the action that finished the net, mirroring a billing rule
   that has since been retired — every action costs a turn now, so every par
   here is one higher than it was, which is exactly the correction that keeps
   par and the turn counter speaking the same units.

   it is still an upper bound — a player who works out which drags matter can
   beat it, and the offline solver being built separately will be able to say
   by how much. what it is not any more is arbitrary. */

/* ---- the board a candidate split placement is judged on ----
   splitPlace asks this question twelve times per split and takes the best
   answer, so it is written once here and both walks hand it the same seq. `pa`
   is the half that keeps the original feature and `pb` the new one; they are
   already sitting in seq, so moving them is all it takes to see the board a
   placement would make.
   f counts the features that would come free: a thread with nothing crossing it
   and no superposition left on it. that is canFree, said in the plan's own
   vocabulary, and it is what makes the last split of a net able to finish it. */
function famProbe(seq,T,pa,pb,S){
  const self=GEN_RULES.selfX==='count';
  return (A,B)=>{

         layer with fewer neurons than features is exactly why real networks
         superpose in the first place, so the bottleneck in the picture is the
         reason the puzzle exists. */
      const grid=[];
      for(let c=0;c<L;c++){
        grid[c]=[];
        const pair=sharedCols.includes(c)?orders[c].slice(0,2):null;
        const seats=orders[c].filter(ti=>!(pair&&ti===pair[1]));   // this layer's true width
        const span=(ybot-ytop), mid=(ytop+ybot)/2;
        const step=seats.length>1?Math.min(span/(R0-1), span/(seats.length-1)):0;
        const topY=mid-step*(seats.length-1)/2;
        seats.forEach((ti,r)=>{
          const jitter=(rnd()-.5)*10;
          const n={x0:colX(c),y0:clampY(topY+step*r+jitter),phase:rnd()*Math.PI*2,
                   freq:.3+rnd()*.4,idx:members.length,threads:[]};
          n.xv=n.xr=n.x0; n.yv=n.yr=n.y0;
          members.push(n); grid[c][ti]=n;
          if(pair && ti===pair[0]){ grid[c][pair[1]]=n; n.merged=true; }
        });
      }
      threads.forEach((th,ti)=>{
        th.nodes=[];
        for(let c=0;c<L;c++){ const n=grid[c][ti]; if(n){ if(!n.threads.includes(th)) n.threads.push(th); th.nodes.push(n) } }
      });
      /* pins belong in their layer, not off on the old lane grid. a pin is put
         on the height its own thread holds in column 0 — the identity ordering
         — so the flat solution stays reachable through it. pinning a neuron
         somewhere its thread never needs to be would make the net unsolvable. */
      for(let k=0;k<spec.pinned;k++){
        const ti=k%threads.length, c=1+Math.floor(rnd()*Math.max(1,L-2));
        const n=grid[c][ti], home=grid[0][ti];
        if(!n||!home||n.merged||n.pinned) continue;
        /* two pinned neurons landing on each other cannot be parted afterwards,
           because neither is allowed to move — so refuse the draw rather than
           mint a pair that is stuck on top of itself. a pin landing on a
           MOVABLE neuron is fine: separateNodes moves the other one. */
        if(members.some(m=>m.pinned&&m!==n&&Math.hypot(m.x0-n.x0,m.y0-home.y0)<MIN_SEP)) continue;
        n.y0=n.yv=n.yr=home.y0;
        n.pinned=true;
      }
      return threads.every(t=>t.nodes.length>=2);
    };

    if(GEN.layout==='families'){
      /* ---- a family, planned as data and then made into neurons ----
         famPlan does the whole placement without touching the dom, which is
         what lets the offline harness run this exact code rather than a copy
         of it. it hands back a solved figure, a scramble of known size and the
         par that follows from it. a family that will not fit this net — too
         tight to grab at phone scale, off the plate, or a figure whose own
         solved form is not clean — returns null, and the stack takes over,
         because a net that cannot be drawn well is worse than a familiar one. */
      const T=threads.length, L=Math.max(3,spec.nodes);
      const fam=famFor(R().day,idx);
      const plan=famPlan(fam,T,L,spec.shared,spec.pinned,famTarget(idx),tut,rnd,idx)
              || famPlan('layered',T,L,spec.shared,spec.pinned,famTarget(idx),tut,rnd,idx);
      if(!plan){ ok=false }
      else{
        spec.fam=plan.fam; spec.famD=plan.d; spec.plan=plan;
        plan.nodes.forEach(n=>{
          const m={x0:clampX(n.x), y0:clampY(n.y), hx:n.hx, hy:n.hy, alt:n.alt,
                   phase:rnd()*Math.PI*2, freq:.3+rnd()*.4, idx:members.length, threads:[]};
          m.xv=m.xr=m.x0; m.yv=m.yr=m.y0;
          if(n.pinned) m.pinned=true;
          if(n.merged) m.merged=true;
          n.m=m; members.push(m);
        });
        /* the chord is the plan's, never the thread's own idea. par was priced
           on a figure that either carries it or does not, and a board that
           disagreed with its own par about how many edges it draws would be
           scored against a puzzle nobody was given. */
        threads.forEach((th,k)=>{ th.nodes=plan.order[k].map(n=>n.m);
                                  th.chord=plan.chords?plan.chords[k]:null });
        plan.nodes.forEach(n=>n.t.forEach(k=>{
          if(!n.m.threads.includes(threads[k])) n.m.threads.push(threads[k]);
        }));
        /* the band the salt loop judges on, and it is doing a much smaller job
           than it used to. difficulty is set by d, not read off the crossing
           count, so this only rejects a draw that came out looking already
           solved or one that came out an unreadable mat — and it can never be
           what makes a net finishable, because every draw already is. the
           floor is a third of d rather than d itself: two neurons swapped in
           the same layer usually buy one crossing, not two. */
        spec.minX=Math.max(2, Math.round(plan.par*0.5));
        spec.maxX=Math.max(spec.minX+3, Math.round(plan.par*5)+8);
        ok=threads.every(t=>t.nodes.length>=2);
      }
    } else if(GEN.layout==='layered'){
      ok=layered();
      /* the ramp's crossing bands were tuned against a scatter, where any two
         segments could cross. a layered net can only cross where two threads
         swap order between adjacent columns, so its ceiling is
         (columns-1) x pairs-of-threads — far lower. aim at a fraction of what
         this shape can actually reach instead of at numbers from the old one. */
      const L=Math.max(3,spec.nodes), T=threads.length;
      const ceiling=(L-1)*T*(T-1)/2;
      spec.minX=Math.max(2,Math.round(ceiling*0.40));
      spec.maxX=Math.max(spec.minX+2,Math.round(ceiling*0.85));
    } else {
    const place=(center)=>{
      for(let t=0;t<400;t++){
        const x=center?BW*.34+rnd()*BW*.32:BW*.06+rnd()*BW*.88;
        const y=tut?(BH*.42+rnd()*BH*.46):(center?BH*.3+rnd()*BH*.4:BH*.08+rnd()*BH*.84);
        if(members.every(m=>Math.hypot(m.x0-x,m.y0-y)>72)){
          const n={x0:x,y0:y,xv:x,yv:y,xr:x,yr:y,phase:rnd()*Math.PI*2,freq:.3+rnd()*.4,idx:members.length,threads:[]};
          members.push(n);return n;
        }
      } return null;
    };
    /* shared neurons claim the centre band FIRST, while the board is empty.
       placed last, they had to find a gap in a 333x232 band already holding
       30-45 nodes at 72px separation, and failed on 17-42% of days at nets
       11 and deeper. a failure there aborts the salt, and since every salt
       could fail the loop could run out — dropping every pinned neuron,
       leaving initialCross unset, and producing a net far off spec (net 11
       measured 233 crossings against a declared ceiling of 60).
       they still join their threads afterwards, once there are nodes to
       splice between. */
    const sharedNodes=[];
    for(let s=0;s<spec.shared;s++){
      const n=place(true); if(!n){ok=false;break}
      n.merged=true;                // one neuron carrying two features
      sharedNodes.push(n);
    }
    if(ok) for(const th of threads){
      for(let i=0;i<th.nodeCount;i++){
        const n=place(false); if(!n){ok=false;break}
        n.threads.push(th); th.nodes.push(n);
      }
      if(!ok)break;
    }
    if(ok) sharedNodes.forEach((n,s)=>{
      const a=threads[s%threads.length], b=threads[(s+1)%threads.length];
      n.threads.push(a,b);
      a.nodes.splice(1+Math.floor(rnd()*Math.max(1,a.nodes.length-2)),0,n);
      b.nodes.splice(1+Math.floor(rnd()*Math.max(1,b.nodes.length-2)),0,n);
    });
    }
    // pinned neurons: load-bearing for features you haven't found, so immovable.
    // they are placed AT a position the lane solution uses, which guarantees the
    // net stays solvable — you just have to route everything else around them.
    // (the layered builder pins inside its own grid, and a family pins on its
    // own slots, both above.)
    if(ok&&spec.pinned>0&&GEN.layout!=='layered'&&GEN.layout!=='families'){
      const laneY=t=>BH*.09+threads.indexOf(t)*(BH*.82/Math.max(1,threads.length-1));
      const cands=members.filter(n=>n.threads.length===1);
      for(let p=0;p<spec.pinned&&cands.length;p++){
        const n=cands.splice(Math.floor(rnd()*cands.length),1)[0];
        const t=n.threads[0], i=t.nodes.indexOf(n);
        n.x0=clampX(BW*.07+(BW*.86*i/Math.max(1,t.nodes.length-1)));
        n.y0=clampY(laneY(t)+(i%2?9:-9));
        n.xv=n.xr=n.x0; n.yv=n.yr=n.y0;
        n.pinned=true;
      }
    }
    if(!ok) continue;
    // part any overlapping neurons before the crossing count judges this salt,
    // so the number the ramp accepts is the number the player will actually see
    separateNodes();
    /* which salt is accepted must depend on (day, netIndex) and NOTHING else.
       this used to apply the player's saved positions first and then accept on
       the resulting crossing count, with a `netMoves>0` escape — so reloading
       mid-net force-accepted salt 0 and handed you a different board than the
       one you had been playing. it also recomputed initialCross from your
       own progress, which reset the masthead track to 0% untangled.
       judge the salt on pristine geometry; restore the player afterwards. */
    const c0=countCross();
    /* how far outside the band this salt fell, so pass two can replay the least
       wrong one. under the floor is what actually bites — a net below minX is a
       net with too little to do — so being short counts double against being
       over, and a board inside the band always wins by scoring zero. */
    /* ---- and the ROUTE has to arrive as well as the picture ----
       famTarget draws the ladder the day is supposed to climb and famPlan
       scrambles towards it, but the scramble GIVES UP after 26 barren rotations
       and hands back whatever it reached — so the target was a hope and the
       accepted route was whatever the shape happened to yield.
       measured over 40 days, that is not a rounding error: at a fixed net index
       the route ranges 8 to 15 turns across the layout families, against a
       ladder that steps 1 or 2 between rungs. the dice throw six times the
       signal, which is why 49 of 53 downward steps in the day's perfect line
       are the route falling — and why no edit to RAMP_EVEN can fix it. moving
       the pin off net 6 just moves the dip to net 7.
       so a route outside the rung is a miss, exactly like a board outside the
       crossing band, and it is scored the same way and replayed the same way:
       the salt loop already tries forty scrambles and pass two replays the
       least wrong of them, so this is the existing machinery being told about
       the other half of what a net has to be. a day where no salt reaches the
       rung still builds — it takes the closest, which is what pass two has
       always done.
       IT IS A BAND AND NOT A FLOOR, and the floor alone was tried first. the
       designed line — famTarget plus graceFor — already climbs 5,6,7,8,9,9,10,
       11,13,15, so once nothing may come in UNDER its rung the thing that
       breaks the climb is a net coming in over it: a lattice that prices net 4
       at 9 stands above a net 5 that correctly priced at 8. one turn of room
       took the dips from 34 over 40 days to 10, and left the day's median line
       sitting exactly on the designed one. wider bands give most of it back —
       two turns leaves 22, three leaves 25 — and none of them moves the median
       opening board off 11 crossings, so the ladder costs no extra tangle.
       it costs about 5ms a net in extra scrambling, on a build of ten. */
    const shortBy = (GEN.layout==='families' && spec.plan)
      ? Math.max(0, famTarget(idx)-spec.plan.route,
                    spec.plan.route-(famTarget(idx)+1)) : 0;
    if(pass===0){
      const miss=(c0.total<spec.minX ? (spec.minX-c0.total)*2
               : c0.total>spec.maxX ? (c0.total-spec.maxX) : 0) + shortBy*3;
      if(miss<bestMiss){ bestMiss=miss; bestSalt=salt }
    }
    const inBand=c0.total>=spec.minX && c0.total<=spec.maxX && !shortBy;
    if(inBand || pass===1){
      initialCross=Math.max(c0.total,1);
      if(GEN.par==='lanes') spec.par=lanePar();      // measure the net you actually got
      /* par came from famPlan, which scrambled until the walkthrough cost it.
         a time trial has no plan to read: it overrides the layout to scatter
         while the version still says its par is a family one, so it falls back
         to the lane estimate the scatter has always been measured by. */
      if(GEN.par==='family') spec.par=spec.plan?spec.plan.par:lanePar();
      const pos=R().positions||{};
      members.forEach(n=>{if(pos[n.idx]){n.x0=pos[n.idx][0];n.y0=pos[n.idx][1];n.xv=n.xr=n.x0;n.yv=n.yr=n.y0}});
      accepted=true;
      break;
    }
  }
  if(accepted) break;
  }
  // the pairs this net superposed, captured before any saved split is replayed
  netPairs=[...new Set(members.filter(n=>n.threads.length>1)
    .map(n=>[n.threads[0].key,n.threads[1].key].sort().join('|')))];

  // markers draw ABOVE neurons: a crossing sitting under a neuron must still be visible
  gThreads=mk('g',{},gRoot);gMembers=mk('g',{},gRoot);gMarkers=mk('g',{},gRoot);
  gLabels=mk('g',{},gRoot);gFx=mk('g',{},gRoot);
  applyOrientation(true);
  threads.forEach(t=>{
    t.el=document.createElementNS('http://www.w3.org/2000/svg','polyline');
    t.el.setAttribute('class','thread');
    t.el.style.stroke=cssv(t.col);
    t.el.style.strokeWidth=t.width*markScale();   // heavier stroke = stronger feature
    gThreads.appendChild(t.el);
  });
  members.forEach(n=>paintNode(n));
  // re-apply splits recorded earlier in this net
  (R().splitNodes||[]).forEach(i=>{
    const n=members.find(m=>m.idx===i && m.merged);
    if(n) splitNode(n,true);
  });
  R().freed.forEach(k=>{const t=threads.find(x=>x.key===k); if(t) freeThread(t,true)});
  /* a board with nothing left tangled IS a cleared board, however it got here.
     the class is normally put on by boardCleared, at the end of the sweep — but
     the day's last net is not wiped when it clears (see clearNet), so a reload
     restores a solved plate, and without this it came back ghosted at .24 and
     dashed, drawn as if there were still work in it. */
  if(threads.length && threads.every(t=>t.freed)) $('field').classList.add('cleared');
  physDirty=true;
}

/* ---- polysemantic neurons ----
   a shared neuron carries two features at once. a feature cannot be called
   identified while it still shares a neuron with another, so these must be
   split before their threads can pull free — which is precisely the job an
   SAE does. splitting costs a move. */
function svgAdd(name,attrs,parent){
  const e=document.createElementNS('http://www.w3.org/2000/svg',name);
  for(const k in attrs)e.setAttribute(k,attrs[k]);
  (parent||$('netsvg')).appendChild(e);
  return e;
}
/* threads carry their stroke inline because it encodes feature strength, so the
   mobile CSS that scales the other marks cannot reach them. this is the same
   compensation expressed as a factor: 1 on a wide board, up to ~1.7 on a phone.
   presentational only — it never touches a position or a seed. */
function markScale(){
  const w=boardScale()*BW;              // the board's rendered width, letterbox excluded
  return w ? Math.min(1.75, Math.max(1, 620/w)) : 1;
}
/* ---- one drawing of a neuron, wherever it appears ----
   the board and the teaching cards each used to draw these by hand, and the
   hand-drawn ones drifted: the rules card had a shared neuron as two rings side
   by side, which is the one thing a shared neuron is not, and a pin with two
   ticks where the board had four at the compass points. every mark now comes
   out of the builders below, so a change to the board reaches the cards on its
   own and cannot be forgotten. the numbers are the ones .field .mnode carries in
   the CSS above — on the board the CSS still wins, so the two have to stay
   equal; off the board the paint here is all there is. */
const MARK={

  // a circle of radius a, so it comes in a little to weigh the same in the line
  pinSq:.88,
  // and the pin's own stroke, a tenth under w. pinSq matches the AREA the two
  // marks enclose, which leaves the square holding the longer edge to stroke —
  // 8·s·w of ink against the ring's 2π·r·w, twelve per cent more, in four
  // straight runs and four mitred corners that fill solid. so equal widths do
  // not read as equal weights, and the square is the one that has to give.
  // rasterised at the size it actually draws: ring 1069 device pixels, square
  // at 3 1197, square at 2.7 1077. `.field .mnode.pinned` carries the same
  // tenth for the board, and the two have to stay equal.

  body:'--node-fill'

/* a part is one SVG element: tag, geometry, the paint it needs where no .field

const part=(tag,attrs,paint,role,cls)=>({tag,attrs,paint,role,cls});
/* ---- the pin ----

   because it is load-bearing for features you have not found yet, so the mark
   has to say ANCHORED, not broken and not punished.
   two earlier answers, and both failed on the same axis. the first said it from
   outside — a dashed silver circle at r=15 with four ticks — which is a survey
   mark, an annotation ABOUT the neuron rather than part of it, and it broke on
   a phone where the ring grows and a baked path does not. the second said it
   inside, hatching the interior at 45 degrees: a good argument (hatching has
   been the drafting sign for fixed-to-ground for a century) that does not
   survive the size it draws at. at 23 css pixels the three bars close up into a
   textured blob, and a blob reads as scribbled out — broken, which is the one
   thing it must not say.
   the axis both were reaching for was already taken. INSIDE the ring belongs to
   the superposed neuron, which puts the second feature's ring there; OUTSIDE it
   belongs to the halo that says to tap it. any pin drawn in either place is
   competing with the mark it most needs to be told apart from, and confusing
   those two is a gameplay error rather than a visual one — one cannot be
   touched, the other must be, and costs a turn.
   the one channel nothing else uses is the silhouette. so a neuron that is
   HOLDING a pin is not a circle: it is a square, in the same feature colour,
   sized and stroked to weigh the same in a line of round ones. it draws that way
   only while the pin is holding — see pinHolds and the call in mountNode. once
   the last feature through it is identified the pin releases, it takes its place
   in the sign, and it is a circle again: the square means THIS WILL NOT MOVE,

   a square is what a fixed point is drawn as everywhere from a structural
   support to a terminal in a circuit. it is the only angular mark on a board of
   arcs, so it is found instantly and cannot be mistaken for a ring, a ring
   inside a ring, or a halo; it is made of horizontals and verticals, which is
   the grid the whole system is set on; and it is unchanged by the quarter turn
   the board takes on a phone, which a one-sided mark would not have survived.

function pinBody(x,y,col){

    {fill:MARK.body,stroke:col,'stroke-width':MARK.wPin},'body','mnode pinned');
}
/* `cols` is one colour token per feature this neuron carries. two of them is
   superposition: ONE neuron, drawn as the outer ring in the first feature's
   colour with the second feature's ring inside it, and a halo outside it in
   that same leading colour — the double ring says what this neuron IS, the
   halo says it is the one you act on. see `.field .mhalo` for the ping.
   the halo is first in the list so it is drawn under the rings: it is the
   quietest mark of the three and must never sit on top of either.
   (this was briefly drawn as two fused lobes instead. that came from misreading
   which mark the owner wanted merged — it was the crossings, which do fuse now.

function neuronParts(x,y,cols,o){

    : part('circle',{cx:x,cy:y,r:MARK.r},
      {fill:MARK.body,stroke:cols[0],'stroke-width':shared?MARK.wMerged:MARK.w},
      'body','mnode'+(shared?' merged':'')));

}
function threadPart(pts,col,w){
  return part('polyline',{points:pts.map(p=>p.join(',')).join(' ')},
    {fill:'none',stroke:col,'stroke-width':w||MARK.wThread,
     'stroke-linecap':'round','stroke-linejoin':'round'},'thread','thread');
}
/* a crossing is a stroked path with round caps rather than a circle, so that
   two crossings whose haloes would overlap can be drawn as ONE body: a dot when
   it is one, a lozenge growing between them as a pair converges. a card passes
   a single point and gets back exactly the dot the board draws — which is the

  const d=P.length>1 ? 'M'+P.join('L') : `M${P[0]}l0 0`;

// the distance at which two crossings stop being two marks and become one body:
// exactly where their haloes touch, so there is never a state in between
const crossFuse=scale=>MARK.rX*(scale||1)*2.95;
/* a part becomes a live element on the board, or a string on a card. `lean`

function partEl(p,parent,lean){

       a literal here, and the ground can change under it — so the element

/* the board's mark sizes, in board units, read from the css that owns them so

let NR=10, NW=3;
function readMarkSizes(){

  const ox=(Math.min(...xs)+Math.max(...xs))/2, oy=(Math.min(...ys)+Math.max(...ys))/2;
  const span=Math.max(Math.max(...xs)-Math.min(...xs), Math.max(...ys)-Math.min(...ys), 1);
  const S=slot.r/span;
  /* where a vertex of the sign lands on the board. one function, used by the
     turn search and by the placement below, because two copies of it is the
     search choosing an order for marks that end up somewhere else.
     the sign has an up. on a quarter-turned board the board's +x runs down the
     screen and +y runs left, so the emblem is laid into those axes instead of
     straight onto x and y — or it settles on its side. the slot is square, so
     the same fit serves either way round. */
  const at=([px,py])=>{
    const dx=portrait?(py-oy):(px-ox), dy=portrait?-(px-ox):(py-oy);
    return [clampX(cx+dx*S), clampY(cy+dy*S)];
  };
  // a whole sign has no first corner, so it is turned to wherever it is nearest
  if(t.signWhole) pts=bestTurn(t.nodes.map(n=>movable.includes(n)?n:null), pts, at);
  const now=performance.now();
  let k=0;                                            // stagger counter over the MOVABLE nodes
  t.nodes.forEach((n,i)=>{
    if(!movable.includes(n)) return;
    const [bx,by]=at(pts[Math.min(i,pts.length-1)]);
    /* staggered along the thread, and eased hard OUT rather than in-and-out:
       each neuron leaves at once, travels fast and stops dead on its mark, and
       they arrive in order, so the sign draws itself instead of every point
       gliding into place simultaneously and the shape only existing at the end.
       the flick as each one lands is what makes it read as arriving rather than
       as having drifted. */
    n.tw={ax:n.xv, ay:n.yv, bx, by,
          t0:now+(reduceMotion?0:k*26), dur:reduceMotion?1:440,
          out:true, land:!reduceMotion};
    k++;
    n.x0=bx; n.y0=by;
    /* and a released pin stops being drawn as one, HERE, at the moment it
       moves. the square is not a description of the neuron, it is the mark for
       a rule — "will not move", in those words on the rules card — and it is
       the only angular mark on a board of arcs precisely so that it is found
       instantly. a square left in a settled sign is that mark contradicting
       itself inside an Aicher pictogram made of circles, arcs and 45s.
       it goes at the settle rather than at the free because between the two the
       neuron is still lying in the tangle, where the rule still reads true of
       where it is standing. it is the same rule the split already follows: a
       superposed neuron stops being drawn fused the instant it is parted.
       paintNode rebuilds the mark from n.pinned, so the flag is what changes —
       and the flag is what everything else asks. */
    if(n.pinned){ n.pinned=false; paintNode(n) }
  });

}
function freeThread(t,silent){
  t.freed=true; t.el.classList.add('freedt');
  // the phase a settled thread breathes on: shared by all its neurons, so the
  // emblem it becomes moves as one object rather than eight separate points
  t.calm=threads.indexOf(t)*1.1;
  /* asked NOW, against the held set this thread's sign will actually be drawn
     against — see signWhole. it is armed with the settle rather than with the
     free, because between the two the neurons are still lying in the tangle,
     and a closing edge across the board for a third of a second is exactly the
     spike the whole rule exists to avoid. */
  const whole=signWhole(t);
  const lbl=document.createElementNS('http://www.w3.org/2000/svg','text');
  lbl.setAttribute('class','tlabel2');lbl.setAttribute('text-anchor','middle');
  lbl.textContent=t.key;
  lbl.dataset.thread=t.key;
  gLabels.appendChild(lbl);
  placeLabel(lbl,labelAnchor(t));
  // the dim is the .done class's own business now — the inline opacity it also
  // wrote was a second source of truth for the same fact
  t.nodes.forEach(n=>{if(n.threads.every(th=>th.freed)) n.el.classList.add('done')});
  if(!silent){
    /* the release runs along the line. a ring at the thread's midpoint said
       only "something happened somewhere"; a light travelling the full length
       of THIS thread says which one came free and how far it reaches — which
       is the fact the moment is about.
       it is drawn from x0, not from where the line currently is: the last node
       dropped is still springing home, and the runner should show the line the
       thread is arriving at rather than the one it is leaving. it is a static
       copy, so it costs nothing per frame. */
    if(!reduceMotion){
      const run=document.createElementNS('http://www.w3.org/2000/svg','polyline');
      run.setAttribute('class','freerun');
      run.setAttribute('points',threadPoints(t,n=>`${n.x0.toFixed(1)},${n.y0.toFixed(1)}`));
      run.style.stroke=cssv(t.col);
      run.style.strokeWidth=(t.width*1.4*markScale()).toFixed(2);
      gFx.appendChild(run);
      let L=0; try{L=run.getTotalLength()}catch(e){}
      if(!L||!isFinite(L)) L=700;
      const seg=Math.max(40,L*.17);
      run.style.strokeDasharray=`${seg.toFixed(0)} ${(L+seg).toFixed(0)}`;
      run.style.setProperty('--len',L.toFixed(0)+'px');
      run.style.setProperty('--seg',seg.toFixed(0)+'px');
      setTimeout(()=>run.remove(),480);
      lbl.classList.add('tin');
    }
    // not inside the motion guard: holding the thread at full colour while its
    // sign forms is a legibility decision, not an animation, and it matters
    // MORE when the runner and the stagger are not there to carry the moment
    t.el.classList.add('justfreed');
    setTimeout(()=>{if(t.el)t.el.classList.remove('justfreed')},reduceMotion?900:1150);
    // the card wears the thread's own colour, which is the whole of how it says
    // WHICH one without pointing at anything, and the name is the one word in
    // the game set large — it is the thing you just earned
    flashMsg('feature identified · '+t.key,{cols:[t.col],big:true});
    tutReach(2);
    // the light gets most of the way down the thread before the sign starts
    // assembling behind it
    setTimeout(()=>{ t.signWhole=whole; t.settled=true; settleIntoShape(t); repositionLabel(t); }, reduceMotion?0:320);
  }else{
    /* the restore path: the neurons are loaded already standing on their sign,
       so there is nothing to settle and nothing to wait for.

       the pin release is the one part that does NOT come back with the
       positions, because it lives in a flag rather than in a coordinate.
       settleIntoShape drops it at the end of the animation, and this path never
       runs the animation — so without this the tenth net of a reloaded finished
       day came back with its pin still set: undraggable, pushing neighbours
       around in the physics as a fixed point, and telling every reader of
       `n.pinned` that a neuron which has plainly moved into a sign has not.
       the same condition as the settle's, so a restored board and a played one
       arrive at the same state rather than merely looking alike. */
    t.signWhole=whole; t.settled=true;
    t.nodes.forEach(n=>{ if(n.pinned && n.threads.every(th=>th.freed)){ n.pinned=false; paintNode(n) } });
  }
}

/* ================= drag ================= */

let dragN=null,dragMoved=false,dragStart=null,dragOff={x:0,y:0};
let dragLast={x:0,y:0},dragNbrs=[],swallowNextDown=false;
/* the neurons a drag can reach along the thread: the ones either side at full
   strength, theirs at less. bounded by how many threads pass through the node,
   never by how big the net is, so this costs the same on net forty as on net
   one — and only these carry a tug, so the frame loop's extra work is a null
   check per node. */
function neighboursOf(n){
  const w=new Map();
  const add=(m,x)=>{ if(m&&m!==n&&!m.pinned&&(w.get(m)||0)<x) w.set(m,x) };
  n.threads.forEach(t=>{
    const i=t.nodes.indexOf(n); if(i<0) return;
    add(t.nodes[i-1],1); add(t.nodes[i+1],1);
    add(t.nodes[i-2],.42); add(t.nodes[i+2],.42);
    // the tug runs along the thread, and a chord is part of the thread: without
    // this the one edge that spans the run is the one edge that does not pull
    if(t.chord){
      const [a,b]=t.chord;
      if(i===a){ add(t.nodes[b],1); add(t.nodes[b-1],.42); add(t.nodes[b+1],.42) }
      if(i===b){ add(t.nodes[a],1); add(t.nodes[a-1],.42); add(t.nodes[a+1],.42) }
    }
  });
  return [...w].map(([m,x])=>({n:m,w:x}));

/* the board is centred inside the field rather than filling it, so screen-to-
   board is no longer the element box divided by the viewBox — that mapping was
   off by the letterbox on every screen that is not exactly 1040:580, which is
   nearly all of them. ask the svg for its own matrix instead; it already knows
   where preserveAspectRatio put the content. */
// the matrix of the board's own group, so it carries the quarter turn too
function boardCTM(){ const g=gRoot||$('netsvg'); return g.getScreenCTM() }
function svgPt(e){
  const m=boardCTM();
  if(m){const p=new DOMPoint(e.clientX,e.clientY).matrixTransform(m.inverse()); return {x:p.x,y:p.y}}

// screen pixels per board unit. hypot, not `a`, because a rotated matrix keeps
// the scale in b and c and would otherwise measure zero.
function boardScale(){
  const m=boardCTM();
  if(m){const s=Math.hypot(m.a,m.b); if(s) return s}
  const w=$('netsvg').getBoundingClientRect().width; return w?w/BW:1;
}
function pick(x,y){
  // keep the grab radius a finger-friendly ~26 screen px whatever the board scales to
  const scale=1/boardScale();
  let best=null,bd=Math.max(20,26*scale);
  members.forEach(n=>{if(n.pinned||n.threads.every(t=>t.freed))return;
    const d=Math.hypot(n.x0-x,n.y0-y); if(d<bd){bd=d;best=n}}); return best}
$('netsvg').addEventListener('pointerdown',e=>{
  if(R().over)return;
  // this press was spent skipping the between-nets transition; it must not also
  // grab a neuron on the net it has just revealed
  if(swallowNextDown){swallowNextDown=false; return}
  bumpIdle();
  sayNudge();          // you are back on the board; the game stops talking
  const p=svgPt(e); dragN=pick(p.x,p.y);
  if(dragN){dragMoved=false;dragStart={x:dragN.x0,y:dragN.y0};
    dragLast={x:dragN.x0,y:dragN.y0};
    $('field').classList.add('dragging');
    // the pickup: it lifts under the finger. a superposed neuron's own circle is
    // unpainted, so the lift has to reach the fused body that stands in for it

    if(dragN.mf) dragN.mf.g.classList.add('grabbed');
    dragN.tw=null; dragN.tug=null;
    dragNbrs=neighboursOf(dragN);

    // merged neuron used to snap it under the pointer, crossing the 6px

    dragOff={x:dragN.x0-p.x,y:dragN.y0-p.y};

});
/* ---- the hand knows what the press will do ----
   the grab cursor used to live on `.mnode`, the drawn circle — 10 board units.
   what a press actually grabs is pick()'s radius, a finger-friendly ~26 screen
   px. so the two disagreed by more than double: you could be well inside
   grabbing distance and still be shown an arrow, and crossing marks draw ABOVE
   the neurons, so passing one flipped the cursor off a node you were still on
   top of. moving across the board flickered.
   so the cursor is decided by pick() itself, on the field rather than on any
   element. it cannot disagree with the press, because it IS the press's own

function hoverNode(e){
  const f=$('field');

$('netsvg').addEventListener('pointermove',hoverNode);
// leaving the board with the class still on would leave a grab hand over the panel
$('netsvg').addEventListener('pointerleave',()=>$('field').classList.remove('overnode'));
$('netsvg').addEventListener('pointermove',e=>{
  if(!dragN)return;

  dragN.x0=clampX(p.x+dragOff.x); dragN.y0=clampY(p.y+dragOff.y);
  /* the line does not move rigidly with the hand. the neurons either side are
     pumped by how FAST you are moving — not by how far you have gone — and the
     frame loop bleeds it away, so a flick stretches the thread behind you and a
     slow pull barely bends it, and letting go lets it recoil. driving it off
     speed rather than displacement is what keeps it honest: hold still and the
     neighbours are back on their true positions within a few frames, so a
     crossing never LOOKS resolved because the line is still stretched. */

      const o=dragNbrs[i], n=o.n, g=o.w*.34, cap=TUG_MAX*o.w;

});
/* every action costs a turn — a drag and a split alike, since the same beat
   should not cost differently depending on which kind it was.

   the action that FINISHED a net used to be free, on the reasoning that it
   prices work still ahead of you and there is none left. measuring the true
   optima killed that idea: it made 17% of all nets solvable in zero charged
   turns, including every single opening net, so a `perfect` keyed to charged
   turns was handed out for nothing on the first three nets of every day. worse,
   it made the unit non-monotonic — the same sequence of moves scored
   differently depending on which move happened to finish — so the scale wobbled
   under the tiers built on it.

   par absorbs the difference exactly: every net's par gains one turn and nothing
   else moves, so nobody is worse off relative to par. and the length of a move
   log becomes the score, which is what a replay-verified leaderboard wants. */
function chargeTurn(r){
  countCross();
  if(!isTrial()) r.turns=(r.turns||0)+1;   // trials cost time, not turns

}
function endDrag(){
  $('field').classList.remove('dragging');
  if(!dragN)return;
  const r=R(), node=dragN;
  node.el.classList.remove('grabbed');
  if(node.mf) node.mf.g.classList.remove('grabbed');

  // the recoil, and cutting it dead would be the one place the line snapped

       one-move clean and depth unbounded. */
    node.x0=node.xv=node.xr=dragStart.x;
    node.y0=node.yv=node.yr=dragStart.y;

    if(node.merged && !r.over){
      (r.splitNodes=r.splitNodes||[]).push(node.idx);
      splitNode(node,false);
      recordDay(); tutReach(1);

      afterMove(r);

  }
  r.positions[node.idx]=[Math.round(node.x0*10)/10,Math.round(node.y0*10)/10];

}
function afterMove(r){
  countCross();
  const blocked=threads.filter(t=>!t.freed&&t.crossings===0&&t.nodes.some(n=>n.merged));
  threads.filter(t=>!t.freed&&canFree(t)).forEach(t=>{freeThread(t,false);r.freed.push(t.key)});
  save(); refresh(); renderHud();
  if(threads.every(t=>t.freed)) clearNet();

  // was a second name for the same thing, in the one message that has to point

       and the only one that fires when NOTHING on the board has changed — which
       is precisely why it is hard to act on. so it is the only card that draws:
       the ring it is telling you to tap, in the two colours the real neuron is
       wearing right now. it is also a sentence rather than a label and a value,
       so it is set as one, and it holds a third longer than a report does. */
    const t=blocked[0], n=t.nodes.find(m=>m.merged);
    const cols=n?n.threads.map(th=>th.col):[t.col];

$('netsvg').addEventListener('pointerup',endDrag);
$('netsvg').addEventListener('pointercancel',endDrag);
// the swallow flag is only ever meant to survive one press, even one that never
// reached the board
addEventListener('pointerup',()=>{swallowNextDown=false});

/* a window that changes shape can change which way up the board is, and always
   changes how many screen pixels a board unit is worth — which is what the
   thread weights are drawn in. */
/* watch the board, not the window: the field also changes size when the coach
   card comes and goes, and a device-emulated resize does not always reach a
   window listener at all. */
let resizeT=null;
function relayoutBoard(){
  /* the letterbox is the one thing here that must not wait out the debounce:
     a card already on screen is anchored to it, and 100ms of the card adrift
     in the margin is 100ms of it visibly off the board. it is two rects and
     two custom properties, so it is cheap enough to do on every callback —
     and it is ahead of the early return below, because the field can change
     shape before a net exists. */
  publishPlateInset();
  clearTimeout(resizeT);
  resizeT=setTimeout(()=>{
    publishPlateInset();     // again once the dust settles; applyOrientation may flip it

    // from them — force its outline to be rebuilt at the new radius
    readMarkSizes();

      t.el.style.strokeWidth=t.width*markScale();   // never blank this: it is the strength

    });

    // changed width has to redraw them or the fit is one layout out of date

addEventListener('resize',relayoutBoard);

/* ================= descent — the slow nudge =================
   gradient descent as a hint: the net settles toward a lower-energy
   arrangement on its own, the same process that trained it. offered only
   when the player has stalled, so thinking time never costs anything;
   accepting it caps the net's tier at par. */

/* smaller hops, more often, each one glided: the net should look like it is
   relaxing continuously rather than twitching once a second */
const DESCENT_OFFER_MS=8000, DESCENT_TICK_MS=380, DESCENT_GLIDE=520,
      DESCENT_RADII=[18,38,70,110], DESCENT_ANGLES=14;
let idleAt=performance.now(), descentArmed=false, settlingNode=null, descentStall=0,
    descentStalledAt=null;

function bumpIdle(){
  idleAt=performance.now();

  if(settlingNode){settlingNode.el.classList.remove('settling'); settlingNode=null}
}
/* moving one neuron can only change the crossings on the segments that touch
   it, so a hypothetical move is worth O(threads x nodes) rather than a full
   O(T^2 n^2) recount of the board. descent probes four radii by fourteen angles
   by every eligible node, every 380ms; on a five-thread net that was around
   1.2 million segment tests per tick — and it kept paying that forever once it
   had settled into a local minimum, which is exactly when a stuck player is
   watching. two segments that both touch the moved node share an endpoint, and
   segX already refuses those, so nothing is counted twice. */
function incidentCross(n){
  let c=0;
  const act=threads.filter(t=>!t.freed);
  const P=m=>({x:m.x0,y:m.y0});
  const self=GEN_RULES.selfX==='count';
  for(const A of n.threads){
    if(A.freed) continue;
    const i=A.nodes.indexOf(n); if(i<0) continue;
    /* which of this thread's edges the neuron is actually an end of. it used to
       be "the one before and the one after", which is right for a plain run and
       misses the chord entirely — and a chord is the longest edge the neuron
       owns, so descent would have been hunting with the biggest line on the
       board invisible to it. */
    const SA=segList(A.nodes.length,A.chord);
    const segs=SA.filter(s=>s[0]===i||s[1]===i).map(s=>[A.nodes[s[0]],A.nodes[s[1]]]);
    for(const [p1,p2] of segs) for(const B of act){
      // a thread is compared with itself where the version counts that, for the
      // same reason countCross does it: it can meet itself, and that is real
      if(B===A && !self) continue;
      const SB=segList(B.nodes.length,B.chord);
      for(const [u,v] of SB){
        const n3=B.nodes[u],n4=B.nodes[v];
        if(p1===n3||p1===n4||p2===n3||p2===n4) continue;
        if(segX(P(p1),P(p2),P(n3),P(n4))) c++;

function crossingsIfMoved(n,nx,ny,base){
  const ox=n.x0, oy=n.y0;
  const before=incidentCross(n);

  const after=incidentCross(n);
  n.x0=ox; n.y0=oy;
  return base-before+after;
}
function descentTick(){
  const r=R(), btn=$('descentbtn');
  if(r.over || dragN || document.querySelector('.veil.show') || !threads.length || threads.every(t=>t.freed)){
    if(!descentArmed) btn.classList.remove('on');
    return;
  }
  const idle=performance.now()-idleAt;
  if(!descentArmed){
    btn.classList.toggle('on', idle>DESCENT_OFFER_MS);
    return;
  }
  if(idle<1200) return;           // pause while the player is actively working
  /* if the last search found nothing, nothing can change until the player acts:
     descent only moves the board when it succeeds, so a failed search over
     unchanged geometry will fail again. wait for the next input rather than
     re-running it three times a second. */
  if(descentStalledAt===idleAt) return;
  const base=countCross().total;
  if(base===0) return;
  // first-improvement search on real landing points, nearest ring first:
  // a nudge, not an optimiser — and it keeps each tick cheap on deep nets
  const spin=Math.floor(Math.random()*DESCENT_ANGLES);
  const searchIn=nodes=>{
    for(const rad of DESCENT_RADII){
      for(const n of nodes){
        if(n.pinned||n.threads.every(t=>t.freed)) continue;
        for(let a=0;a<DESCENT_ANGLES;a++){
          const th=((a+spin)%DESCENT_ANGLES)*2*Math.PI/DESCENT_ANGLES;
          const nx=clampX(n.x0+Math.cos(th)*rad);
          const ny=clampY(n.y0+Math.sin(th)*rad);
          if(crossingsIfMoved(n,nx,ny,base)<base) return {n,nx,ny};
        }
      }
    }
    return null;
  };
  const worst=threads.filter(t=>!t.freed).sort((a,b)=>b.crossings-a.crossings)[0];
  const best = (worst && searchIn(worst.nodes))
            || searchIn(members.filter(n=>!n.pinned&&!n.threads.every(t=>t.freed)));
  if(!best){
    descentStalledAt=idleAt;
    // settled into a local minimum — say so instead of stalling silently
    if(++descentStall===1) flashMsg(mergedCount()
      ? 'descent can untangle but it cannot split a shared neuron · that part is yours'
      : 'descent has settled as far as it can · the last crossings are yours',
      // descent owns green on its own button; the card it speaks in is the
      // same colour, so a glance places it before a word is read. green rather
      // than the turquoise that stood here because turquoise is a rung now —
      // see .descentbtn
      {cols:['--sig-gruen'], hold:true});
    return;
  }
  descentStall=0;
  r.assisted=true;
  if(settlingNode&&settlingNode!==best.n) settlingNode.el.classList.remove('settling');
  settlingNode=best.n; settlingNode.el.classList.add('settling');
  best.n.tw={ax:best.n.xv, ay:best.n.yv, bx:best.nx, by:best.ny,
             t0:performance.now(), dur:DESCENT_GLIDE};
  best.n.x0=best.nx; best.n.y0=best.ny;
  /* the threads descent frees are saved; the geometry that freed them was not,
     so a reload came back to dashed, named, half-transparent threads lying
     across a fully tangled net — a picture that was simply a lie, and one
     nothing detected because freed threads are excluded from the count. */
  r.positions[best.n.idx]=[Math.round(best.n.x0*10)/10,Math.round(best.n.y0*10)/10];
  countCross();
  threads.filter(t=>!t.freed&&canFree(t)).forEach(t=>{freeThread(t,false);r.freed.push(t.key)});
  save(); refresh(); renderHud();
  if(threads.every(t=>t.freed)){
    if(settlingNode){settlingNode.el.classList.remove('settling');settlingNode=null}
    clearNet();
  }
}
setInterval(descentTick,DESCENT_TICK_MS);
$('descentbtn').onclick=()=>{
  if(descentArmed) return;
  descentArmed=true;
  R().assisted=true; save();
  const db=$('descentbtn');
  db.classList.add('running');
  db.querySelector('span').textContent='settling';
  // tierFor forces `done` on an assisted net, so par is not what it tops out at
  flashMsg('descent engaged · the net relaxes on its own · this net now tops out at done',
           {cols:['--sig-gruen']});

function resetDescent(){
  descentArmed=false; descentStall=0; descentStalledAt=null;
  const b=$('descentbtn');
  b.classList.remove('running','on');
  b.querySelector('span').textContent='let it settle';
  if(settlingNode){settlingNode.el.classList.remove('settling');settlingNode=null}

/* ================= tutorial ================= */

/* THE TUTORIAL IS THREE NETS AND IT TEACHES THE THREE RULES. one per net, in the
   order they are needed, and nothing else on the board while each is being
   taught: net 0 is two plain threads (drag, crossings, a line coming free), net 1
   adds one shared neuron (tap to split), net 2 adds a pin (a neuron that will not
   move, so you go round it).
   they used to be one net, which taught only the first rule — a player met their
   first superposed neuron mid-day, in a scored net, with a passing message to
   explain it, and met their first pin the same way. those are the two moves the
   game turns on and both were being discovered rather than taught.
   the run is OUTSIDE the day: nothing here is scored, no badge is minted, and
   the day's ten begins afterwards untouched. */
const TUTNETS=[
  {threads:2, nodes:4, shared:0, pinned:0, minX:2, maxX:5},
  {threads:2, nodes:4, shared:1, pinned:0, minX:2, maxX:5},
  {threads:2, nodes:5, shared:0, pinned:1, minX:2, maxX:6}
];
// the whole tutorial run, whatever net of it you are on
function inTutorialRun(){return !store.tutorialDone && !isTrial() && R().mode!=='trial'}
// this particular net is a guided one — the coach card and the spotlight ask this
function inTutorial(){return inTutorialRun() && R().netIndex<TUTNETS.length && !R().over}
let tutStepAt=1;

/* ================= the spotlight =================
   the guided net points at the neuron to act on. see `.field .tutspot` for what
   is drawn and why; this is how the neuron is CHOSEN, which is the half that
   has to be honest.

   the net is generated — net 0 of a real day, with the same seed as every other
   net — so there is no index to hard-code and no fixed answer to point at. the
   target is derived from the board in front of the player every time: the one
   movable neuron, and the one place to put it, that most improves the board it
   is currently on. that has three consequences worth stating.

   it retargets by itself as the steps advance, because "the best move now" on a
   board with one feature already free is a different move.

   it cannot trap anybody. if the player ignores it and drags something else,
   the next thing that happens is the same search over the board they just made
   — so it re-points rather than repeating itself, and it follows a player who
   is doing well rather than dragging them back. and if a move leaves nothing
   crossing at all, there is nothing to point at and the light goes out.

   it never writes a position. the whole search runs through tutCross, which
   takes the hypothetical position as an ARGUMENT instead of moving the neuron
   and putting it back — the day has to hand every player the same board and the
   same score, and a search that mutated x0/y0 would be one thrown exception
   away from a different puzzle. */
let gTut=null, tutLit=null;
/* the crossing count on a board where ONE neuron is somewhere else, plus
   whichever crossings a named neuron is party to. this is countCross's inner
   loop with the position lookup made substitutable and the thread state left
   alone — countCross writes t.crossings, and the search runs hundreds of these
   between two frames of a real game.
   it walks consecutive pairs and knows nothing about a v9 chord, which is safe
   because the tutorial is always net 0, net 0 can only ever be the stack (see
   the FAM_FROM note), and a stack's threads are drawn collinear so famChord can
   never find an edge to give one. the branch is left out rather than written
   and never taken, because this runs hundreds of times between two frames. a
   family that ever reaches net 0 with a chord on it has to come back here. */
function tutCross(sub,want){
  const pt=n=>(sub&&n===sub.n)?{x:sub.x,y:sub.y}:{x:n.x0,y:n.y0};
  const act=threads.filter(t=>!t.freed);
  const per=act.map(()=>0);
  let total=0; const mine=[];
  for(let i=0;i<act.length;i++)for(let j=i+1;j<act.length;j++){
    const A=act[i],B=act[j];
    for(let a=0;a<A.nodes.length-1;a++)for(let b=0;b<B.nodes.length-1;b++){
      const n1=A.nodes[a],n2=A.nodes[a+1],n3=B.nodes[b],n4=B.nodes[b+1];
      if(n1===n3||n1===n4||n2===n3||n2===n4)continue;
      const x=segX(pt(n1),pt(n2),pt(n3),pt(n4));
      if(!x)continue;
      total++; per[i]++; per[j]++;
      if(want&&(n1===want||n2===want||n3===want||n4===want)) mine.push(x);
    }
  }
  // canFree's two conditions, counted: clean, and holding no shared neuron
  let freeable=0;
  act.forEach((t,i)=>{ if(per[i]===0 && !t.nodes.some(n=>n.merged)) freeable++ });
  return {total,freeable,mine};
}
/* the best move on the board as it stands, or null if there isn't one.
   a coarse sweep of candidate destinations per movable neuron, then three
   halving passes in on the winner so the mark lands somewhere a person would
   aim rather than on a grid corner.

   ranked: features it would free, then crossings left, then ROOM, then a CLEAR
   PATH, then how far the hand has to travel. the last three are all the same
   argument — this is the first move a player ever makes and it has to LOOK as
   right as it is — and each of the two middle ones was put in after watching
   the one below it get it wrong on net 0 of 2026-08-13:

     rank on distance alone and the winning spot is pressed right up against the
     boundary of the region that works. it landed the neuron four units clear of
     the line it had just been untangled from: correct, and indistinguishable
     from a mistake. so every candidate still in contention is probed at eight
     points around it and the one standing in open ground wins.

     that fixed the destination and left the ROUTE. the winner ran the leader
     line straight over a third neuron, so the dashes appeared to terminate on
     it and the drag pulled one mark through another. so a candidate whose
     straight path keeps every other neuron a clearance away beats one that
     does not.

   candidates stay inside the tangle's own bounds: a landing mark out in the
   empty margin is not a move anyone would think of making, and on a desktop the
   top of the board belongs to the coach card. */
const TUT_GRID=13, TUT_ROOM=30;
/* the pointing ring's rest radius, in the r=10 space every mark is authored in.
   @keyframes tutping starts and ends here and has to stay equal to it — the
   keyframes cannot read this, for the same reason .mhalo's cannot: chrome will
   not interpolate an r whose value arrived through var(). */
const TUT_RING=24;
function tutFind(){
  if(!members.length||!threads.length) return null;
  const now=tutCross(null,null);
  if(!now.total) return null;                  // nothing crossing: nothing to point at
  const movable=members.filter(n=>!n.pinned && !n.threads.every(t=>t.freed));
  if(!movable.length) return null;
  const xs=members.map(n=>n.x0), ys=members.map(n=>n.y0), pad=58;
  const bx0=clampX(Math.min(...xs)-pad), bx1=clampX(Math.max(...xs)+pad);
  const by0=clampY(Math.min(...ys)-pad), by1=clampY(Math.max(...ys)+pad);
  let best=null;
  const better=(a,b)=> !b ? true
    : a.freeable!==b.freeable ? a.freeable>b.freeable
    : a.total  !==b.total    ? a.total  <b.total
    : a.solid  !==b.solid    ? a.solid  >b.solid
    : a.clear  !==b.clear    ? a.clear  >b.clear
    : a.d<b.d;
  // does the straight line from the neuron to a destination keep clear of every
  // other neuron? point-to-segment, not point-to-line: a neuron off the END of
  // the path is not in the way of anything
  const clearPath=(n,x,y)=>{
    const ax=n.x0, ay=n.y0, vx=x-ax, vy=y-ay, L2=vx*vx+vy*vy;
    return members.every(m=>{
      if(m===n) return true;
      const u=L2?Math.max(0,Math.min(1,((m.x0-ax)*vx+(m.y0-ay)*vy)/L2)):0;
      return Math.hypot(m.x0-(ax+vx*u), m.y0-(ay+vy*u))>=MIN_SEP;
    }) ? 1 : 0;
  };
  const test=(n,x,y)=>{
    const d=Math.hypot(n.x0-x,n.y0-y);
    if(d<MIN_SEP) return;                      // not a move you could tell you made
    // separateNodes would shove a neighbour aside afterwards, which is a second
    // thing moving for one drag — never point at a spot that would cause it
    if(members.some(m=>m!==n&&Math.hypot(m.x0-x,m.y0-y)<MIN_SEP)) return;
    const r=tutCross({n,x,y},null);
    // the two cheap terms decide nearly every candidate, so the eight probes are
    // only ever paid for by one that is already in contention
    if(best && (r.freeable<best.freeable
      || (r.freeable===best.freeable && r.total>best.total))) return;
    let solid=0;
    for(let a=0;a<8;a++){
      const th=a*Math.PI/4;
      if(tutCross({n, x:clampX(x+Math.cos(th)*TUT_ROOM),
                      y:clampY(y+Math.sin(th)*TUT_ROOM)},null).total<=r.total) solid++;
    }
    const cand={n,x,y,total:r.total,freeable:r.freeable,solid,clear:clearPath(n,x,y),d};
    if(better(cand,best)) best=cand;
  };
  /* the sweep is neurons x cells x nine crossing counts, so it grows with the
     square of the board. that cannot bite today — inTutorial() pins it to net 0
     and RAMP[0] is three neurons and two features, where the whole search costs
     half a millisecond — but run over the deepest nets of a day it measures 40ms,
     which is two dropped frames, and net 0 is a ramp entry somebody could widen.
     so the grid thins as the board grows. eight movable neurons and under, which
     is every net 0 the ramp can currently produce, keeps the full grid and the
     numbers above are unchanged. */
  const gx=Math.max(7,Math.round(TUT_GRID*Math.min(1,8/Math.max(1,movable.length))));
  const gy=Math.max(3,Math.round(gx*(by1-by0)/Math.max(1,bx1-bx0)));
  movable.forEach(n=>{
    for(let i=0;i<gx;i++)for(let j=0;j<gy;j++)
      test(n, bx0+(bx1-bx0)*i/(gx-1), by0+(by1-by0)*j/(gy-1));
  });
  if(!best) return null;
  let step=Math.max((bx1-bx0)/(gx-1),(by1-by0)/(gy-1))/2;
  for(let pass=0;pass<3;pass++,step/=2){
    const c=best;
    for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++){
      if(!dx&&!dy) continue;
      test(c.n, clampX(c.x+dx*step), clampY(c.y+dy*step));
    }
  }
  // only ever point at a move that is actually an improvement
  if(best.freeable<=now.freeable && best.total>=now.total) return null;
  return {n:best.n, x:best.x, y:best.y, marks:tutCross(null,best.n).mine};
}
function tutSpotClear(){
  if(gTut){ gTut.remove(); gTut=null }
  tutLit=null;
}
function tutSpotlight(){
  if(!inTutorial()||!gRoot||!members.length){ tutSpotClear(); return }
  readMarkSizes();                 // the aperture is in neuron radii, and those move
  const t=tutLit=tutFind();
  if(!t){ tutSpotClear(); return }
  /* every radius here is authored in the same r=10 space the neuron marks are,
     and multiplied by the phone treatment — so the aperture is always the same
     number of NEURONS wide however big a neuron currently is. */
  /* TUT_RING has to equal the rest radius in @keyframes tutping: the leader
     line leaves the RING, not the aperture, and starting it at the aperture
     edge instead left a 30-unit gap that read as two unrelated marks. */
  const k=NR/10, hole=46*k, xhole=24*k, ringR=TUT_RING*k;
  const f=(v)=>v.toFixed(1);
  if(!gTut||!gTut.isConnected){
    gTut=document.createElementNS('http://www.w3.org/2000/svg','g');
    gTut.setAttribute('class','tutspot');
    gTut.setAttribute('aria-hidden','true');
  }
  /* under the labels and the effects layer, over everything else. a feature
     coming free is the payoff of the whole net and its runner and its name must
     never arrive dimmed — but the tangle underneath them is exactly what the
     spotlight is holding back. */
  if(gTut.parentNode!==gRoot||gTut.nextSibling!==gLabels){
    if(gLabels&&gLabels.parentNode===gRoot) gRoot.insertBefore(gTut,gLabels);
    else gRoot.appendChild(gTut);
  }
  // the spotlight's cut-outs: the neuron to move, and the crossings to clear
  const holes=[{x:t.n.x0,y:t.n.y0,r:hole}].concat(t.marks.map(m=>({x:m.x,y:m.y,r:xhole})));
  /* the light picks out the neuron to move and the crossings to clear, and stops
     there. it used to also draw a leader line to a dashed ghost on the exact
     spot — which is not a lesson, it is the answer: there was nothing left to
     work out, only two shapes to match, and a player who follows it has learned
     where to look rather than what the game is. what the first net has to teach
     is that a neuron can be dragged and that crossings are the thing to get rid
     of. the light says both. where to put it is the puzzle, and it is the same
     puzzle every net after this one asks. */
  gTut.innerHTML=
     `<mask id="tutcut" maskUnits="userSpaceOnUse" x="0" y="0" width="${BW}" height="${BH}">`
    +`<rect x="0" y="0" width="${BW}" height="${BH}" fill="#fff"/>`
    + holes.map(h=>`<circle cx="${f(h.x)}" cy="${f(h.y)}" r="${f(h.r)}" fill="#000"/>`).join('')
    +`</mask>`
    +`<rect class="tutscrim" x="0" y="0" width="${BW}" height="${BH}" mask="url(#tutcut)"/>`
    /* the ping is under the standing ring: it is the quieter of the two and
       must never sit on top of it. both are authored at r=10 scale and the css
       scales them, so TUT_RING is the literal @keyframes tutping starts from.
       the ping carries opacity 0, which is what it falls back to when the
       animation is off — see the reduced-motion block. */
    +`<circle class="tutping" cx="${f(t.n.x0)}" cy="${f(t.n.y0)}" r="${TUT_RING}"`
    + ` stroke-width="1.5" opacity="0"/>`
    +`<circle class="tutring" cx="${f(t.n.x0)}" cy="${f(t.n.y0)}" r="${TUT_RING}"`
    + ` stroke-width="1.8"/>`;
}
/* the aperture is measured in neuron radii and the phone treatment changes what
   a neuron radius is, so a board that changes shape has to redraw it. its own
   listener rather than a line in relayoutBoard, and behind the same guard as
   everything else here: off the guided net this costs one comparison. */
let tutRelayoutT=null;
function tutRelayout(){
  if(!inTutorial()) return;
  clearTimeout(tutRelayoutT);
  tutRelayoutT=setTimeout(tutSpotlight,180);
}
addEventListener('resize',tutRelayout);
if(window.ResizeObserver) new ResizeObserver(tutRelayout).observe($('field'));
/* the first net is RAMP[0]: two features, no shared neurons, no pins. step one
   used to say the two features "share neurons", which is the game's exact term
   for a polysemantic neuron and is the one thing this net does not have — and
   step two called the crossing marks white dots, when a crossing is a dark disc
   with a pale ring. both are marks the player is looking straight at. */
/* `this net` went with the welcome card's jargon: the opening no longer says
   `net` anywhere, and reintroducing it in the first sentence of the guided net
   would put the word back four seconds after it was removed. `here` costs
   nothing — the board is on screen and the card is pointing at it. */
/* one idea per step, and the instruction FIRST. every one of these used to open
   with a fact and bury the thing to do at the end of it — "two features run
   through here, and they cross" before "drag a neuron", and "the ringed dots are
   crossings" before anything to do about them. a player reading a card mid-net
   wants the verb, and the board behind it is already showing the fact.
   the nouns are the ones the key row directly below is drawing at that exact
   moment: neuron, crossing, and the two coloured lines. nothing here names a
   thing the player cannot point at. */
/* one set of steps per guided net, because each net is teaching a different rule
   and the coaching for a pin is no use on a board that has none. every step is
   about a mark the player can see on the board in front of them at the moment it
   is written — the spotlight is picking that mark out while they read it. */
const TUTSTEPS_BY_NET=[
  [ // net 0 — the gesture, and what a crossing is
    '<b>drag the lit neuron.</b> the lines follow it.',
    'each <b>X</b> is a crossing. clear every crossing off one line and it comes free.',
    'one crossing left. <b>clear it</b> and the last line comes free too.'
  ],
  [ // net 1 — superposition. the one move the game turns on
    'one neuron here is carrying <b>both</b> features at once — the double ring.',
    '<b>tap it to split.</b> a shared neuron has to come apart before either line can leave.',
    'now they are two. <b>clear the crossings</b> and both come free.'
  ],
  [ // net 2 — the pin. a constraint rather than an action
    'the <b>square</b> neuron is pinned. it will not move, whatever you do to it.',
    '<b>move the others around it.</b> everything else works exactly as before.',
    'last crossing. <b>clear it</b> and that is every rule the game has.'
  ]
];
const TUTSTEPS=TUTSTEPS_BY_NET[0];   // the shape older code still reads
/* what the card says once the board is doing the pointing. step one stops
   saying "a neuron" — the whole complaint was that a player has to map that
   word onto one of a board of marks — and the later two get one short clause,
   because by then the gesture is known and only the target has moved.
   they are variants rather than replacements: if the search finds no move worth
   lighting, the light is off and the card must not refer to it. */
const TUTLIT=[
  '<b>drag the lit neuron.</b> the lines follow it.',
  null, null
];
const TUTLITADD=' the light is on the next one.';
function renderTutorial(){
  $('play').classList.toggle('tutorial',inTutorial());
  if(!inTutorial()){ tutSpotClear(); return }
  // the coaching for THIS net — a pin's lesson is no use on a board without one
  const net=Math.min(R().netIndex, TUTSTEPS_BY_NET.length-1);
  const steps=TUTSTEPS_BY_NET[net];
  const step=Math.min(tutStepAt,steps.length);
  // the board first: what the card is allowed to say depends on whether there
  // is anything lit to say it about
  tutSpotlight();
  // and which lesson of the three you are on, since there are three nets now
  $('coachlabel').textContent=`guided net ${net+1} of ${TUTNETS.length} · step ${step} of ${steps.length}`;
  $('coachtext').innerHTML = (!tutLit || net>0) ? steps[step-1]
    : (TUTLIT[step-1] || steps[step-1]+TUTLITADD);
  [...$('coachdots').children].forEach((d,i)=>{
    d.classList.toggle('done',i+1<step);
    d.classList.toggle('now',i+1===step);
  });
  // the same three fragments the rules card uses, so the coach and the rules
  // cannot end up drawing the board differently
  const key=$('coachkey');
  if(!key.firstChild) key.innerHTML=['feature','neuron','crossing']
    .map(k=>`<span>${rmark(k)}${k}</span>`).join('');
  key.style.display = step===1 ? '' : 'none';
}
function tutReach(step){
  if(!inTutorial())return;
  // the bay counts the steps too, and it is renderHud that draws it — without
  // this the card advanced and the numeral beside it sat on 1 for all three
  if(step>=tutStepAt){tutStepAt=step+1; renderTutorial(); renderHud()}
  /* a move that does not advance the step still changed the board, and the
     spotlight is a reading of the board — this is where it re-points at a
     player who ignored it. every committed move reaches here, so it is the one
     hook the light needs and it stays inside the tutorial's own code. */
  else tutSpotlight();
}
function endTutorial(){
  store.tutorialDone=true;
  /* and the day starts, clean. the tutorial ran on netIndex 0..2 outside the
     day, so leaving those on the run would hand a new player a day that opens on
     net 3 with three nets already "cleared" — a first day of seven, scored
     against a set of ten, with three lessons stamped into the record as if they
     had been played. the run is reset to the day's own first net and the ten it
     is owed. nothing here is lost: the tutorial mints nothing and scores
     nothing, which is the whole reason it can be thrown away. */
  const r=R();
  r.netIndex=0; r.netMoves=0; r.turns=0; r.positions={}; r.freed=[];
  r.splitNodes=[]; r.assisted=false; r.cleared=[]; r.over=false;
  builtFor=-1;
  save();
  /* the bar carries the lessons' own door and it is decided by `tutorialDone`,
     which has just moved — so it is redrawn here rather than left to the next
     move to pick up. without this the mark a player would use to come back
     appears a beat after the card that tells them they are finished, on whatever
     the next render happens to be. */
  renderHud();
  tutSpotClear();
  const c=$('coach');
  // it leaves rather than being switched off — it is the last thing the guided
  // net says, and it was disappearing mid-sentence
  if(reduceMotion){ $('play').classList.remove('tutorial'); c.style.display=''; return }
  c.classList.add('leaving');
  setTimeout(()=>{
    c.classList.remove('leaving');
    $('play').classList.remove('tutorial');
    c.style.display='';
  },240);
}

/* ================= time trial: the net keeps training =================
   descent inverted. every few seconds the net nudges one neuron to a WORSE
   position, adding crossings. it speeds up as you go deeper. let the tangle
   reach the fail line and the net has out-trained you. */
const RETANGLE_BASE=7000, RETANGLE_FLOOR=2600;
let retangleTimer=null, retangleAt=0;
function retanglePeriod(){
  return Math.max(RETANGLE_FLOOR, RETANGLE_BASE - R().cleared.length*550);
}
function failLine(){ return Math.round(initialCross*2)+5 }
function retangleTick(){
  const r=R();
  if(!isTrial()||r.over||dragN||document.querySelector('.veil.show')||!threads.length) return;
  if(threads.every(t=>t.freed)) return;
  if(performance.now()<retangleAt) return;
  retangleAt=performance.now()+retanglePeriod();
  const base=countCross().total;
  // find a nudge that makes things worse — the mirror of descent
  const cand=members.filter(n=>!n.pinned&&!n.threads.every(t=>t.freed));
  if(!cand.length) return;
  // search wide: on a sparse net a short hop crosses nothing at all
  const spin=Math.floor(Math.random()*16);
  let worst=null;
  for(const rad of [80,150,230,320]){
    for(const n of cand){
      for(let a=0;a<16;a++){

        const nx=clampX(n.x0+Math.cos(th)*rad);
        const ny=clampY(n.y0+Math.sin(th)*rad);

     restored a pristine net and kept the depth — an unlimited undo in the one
     mode whose entire tension is that the net is winning. */
  R().positions[worst.n.idx]=[Math.round(worst.n.x0*10)/10,Math.round(worst.n.y0*10)/10];
  save();
  worst.n.el.classList.add('retraining');
  setTimeout(()=>worst.n.el.classList.remove('retraining'),900);

  const now=countCross().total;
  if(now>=failLine()){ flashMsg('the net out-trained you',{cols:['--sig-violett'],big:true}); endRun(); }

/* ================= progression ================= */

/* a net is scored against the two lines netTargets() knows, and there is no way
   to fail — everyone completes the day, and the question is how cleanly.
   two lines make three rungs: at or under the true optimum is perfect, inside
   par is clean, and finishing at all is done.

   this used to be two rungs, collapsed on purpose: par is a geometric estimate
   sitting 3 to 8 turns above the true optimum, so a competent player minted
   `clean` on about 90% of nets and the middle rung meant nothing. the third
   rung is back because the offline solver gives us a line that is not an
   estimate — and it is wired so that it can only appear where a real optimum
   does. with none, netTargets() stands optimum at par, the first branch cannot
   fire, and this returns exactly what the two-rung version returned. */
function tierFor(moves,par,assisted){
  const {optimum}=netTargets();
  const t = moves>par ? 'done' : (optimum<par && moves<=optimum) ? 'perfect' : 'clean';
  return (assisted && t!=='done') ? 'done' : t;   // descent caps a net at done
}
/* `x&&x.d||x` rather than `x.d||x`: the day list already renders around a row

   the whole game down over a save the record displays perfectly well. */
const isDay=(x,d)=>(x&&x.d||x)===d;
function recordDay(){
  /* THE LESSONS DO NOT TOUCH THE DAY, which is what the tutorial has always said
     about itself — "the run is OUTSIDE the day: nothing here is scored, no badge
     is minted, and the day's ten begins afterwards untouched" — and was not true
     of these two lines. every committed move lands here, guided or not, so the
     three lessons wrote a row against today and bumped the streak before the
     day's ten had begun. it cost a new player nothing visible: a live run on the
     day keeps `spentDay` false, and the real run upgrades the row in place.
     it is not nothing now. the welcome card leads on the run of days, and the
     lessons can be replayed from its foot — so without this, `the guided nets` is
     a way to add a day to your streak without playing one, and a player who does
     the three and closes the tab has a day on record they never played. the row
     is written by the first move of the DAY'S ten instead, which is the event
     `spentDay` and the streak were always about.
     the exit is the only exit: endTutorial is reached from one place, when the
     third guided net clears, so this cannot suppress a real move. */
  if(inTutorialRun()) return;
  const d=R().day, pd=store.collection.playedDays;
  if(!pd.some(x=>isDay(x,d))){
    // `back` marks a day filled in later rather than earned on the day. the
    // list keeps both, and shows them differently — a backfilled day counts
    // toward the record but never toward the streak, or the streak is
    // purchasable and stops meaning anything.
    pd.push({d,depth:0,back:isArchive()});
    if(!isArchive()){
      const y=dayAdd(today(),-1);
      store.meta.streak = (store.meta.lastPlayDay===y)?(store.meta.streak||0)+1:1;

}

   a `tiers` letter — it is minted by the DAY, in clearNet, onto the badges of a
   set that came in ten perfects. it is here because badges are compared with
   this table and a rung it does not know would rank below `over`.
   IT MUST STAY IN STEP WITH worker/merge.js, which mirrors this table to merge

function stampToday(depth,feats,tier){

       they move together or not at all: a deeper run replaces them, an equal

       restarting at net one) leaves the pair it cannot beat alone. */
    const cl=R().cleared;

       see rungCount. it used to rank by turns against par alone, and leaving it
       there while the card and the record moved would have been the worst of
       both: a run with more good rungs shown as the better day and then thrown
       away by the guard, so the row on screen and the row in the save disagree
       about which run happened.
       turns against par survives as the TIEBREAK, which is exactly the demotion
       it took everywhere else — the rungs are lumpy and two runs that both post
       `8 of 10` are separated by nothing else. a run with no tiers at all (an
       older save's row) has no key, so it ranks on the differential alone and
       any run carrying rungs beats it, which is the same precedence bestReading
       applies on the record.
       worker/merge.js's bestRun() is the other copy of this and moves with it. */
    const keyNow=rungCount(cl.map(c=>c.tier), POLICY.dailyNets).key;
    const keyHad=rungsOf(row.tiers) ? rungsOf(row.tiers).key : -1;
    const better = keyNow!==keyHad ? keyNow>keyHad

       draws them as ten cells and there is nowhere else to read them from.
       a string, not an array: it is ten characters against ten objects in a
       save that already carries a row a day forever, and tierFor mints exactly
       perfect / clean / done, whose initials do not collide. */
    const tiers=cl.map(c=>String(c.tier||'')[0]||'').join('');

      row.turns=turns; row.par=par; row.moves=R().turns||0;

         the three of them describe the SAME run, so a replay that cannot beat
         the pair must not be allowed to overwrite the tiers that earned it
         either. it is purely ADDITIVE — every row written before this has no
         `tiers` at all, nothing reads it without checking, and no existing
         field changes shape. */

       everything above is a high-water mark and a replay is meant to climb it.
       but the day you first played is not a score you can beat, it is a thing
       that happened, and a better run writing over it would be the only place
       in this file where playing more DELETES something. so it is written by
       the first run to score the day and by no other, and every replay after it
       leaves it exactly alone.
       `at` is that run's own start time, which is what tells the two apart: the
       first attempt goes on deepening for as long as it is the run playing, and
       stops the moment a different one comes along. it is also the instant
       worker/merge.js orders two devices by — EARLIER WINS there, the way a
       pair keeps the day it was first found, rather than better winning the way
       the score does.
       purely ADDITIVE, the same as `tiers` was: every row written before this
       has no `first`, nothing reads it without checking, and no existing field
       changes shape. */
    const began=R().startedAt||'';

       than incremented somewhere a run begins. stampToday runs after every net,
       so a counter that simply added one would count nets; keyed on the run's
       own stamp it moves once per run and cannot double no matter how many nets
       that run clears. `lastRun` is the whole state it needs.
       a row from before this has no count and gets 1 on its next run rather
       than a guess at its history — undercounting a past nobody recorded is the
       honest direction, and it is why this is additive like `first` and `tiers`

    if(row.lastRun!==began){ row.runs=(row.runs||0)+1; row.lastRun=began }

function clearNet(){

     welcome-back card with any runway left. */
  feats.forEach(k=>{

     the freed threads all stay on the net it was won on, so the plate keeps the

       index is past the end of TUTNETS. it read `length-1`, which ended the

     already run endTutorial() a few lines above, so its card lands on a screen
     with no coach on it and is not crowded at all — and it is the one place in
     the game that offers a sign-in unprompted, which has nowhere else to go.

     `0 < 3`, true, and the last lesson lost its card along with the two that
     were meant to. that quietly killed the one thing the exception above exists

       pay for the room it takes: `2 features, 2 crossings` is the two numbers
       the masthead bays are drawing live, and the ordinal counts the day's ten,
       which the guided nets sit outside of.
       inTutorial() rather than inTutorialRun() is the point. it asks whether the
       net just built is a GUIDED one, so the plaque is absent exactly where the
       coach card is present and returns the moment the coach leaves. that also
       settles the replay: once the tutorial is done, net 0 is the ramp's own
       opener again (see buildNet) — an ordinary scored net of the day's ten with
       nothing else on screen naming it — so it gets its plaque like any other.
       nothing goes missing that was not already missing: the FIRST guided net is
       built at boot rather than through here and never had a plaque either, so
       all three now read the same way.
       not a feature and not a neuron, so not a feature's colour: the four the
       wordmark is made of. a new net is the game starting something, and this
       is the game's own mark. */
    if(!inTutorial())
      flashMsg('net '+String(R().netIndex+1).padStart(3,'0')+' · '+spec.threads+' features, '+countCross().total+' crossings',
               {cols:FLAG});
  };
  swapSkip=land;
  if(reduceMotion){ land(); return }
  /* also called with no event, by the timeout and by a second nextNet landing
     the previous swap — so it cannot assume it was handed one. it used to
     throw there, which meant the 190ms timeout never landed and the next net
     only ever arrived if you happened to press something. */
  const skip=e=>{ if(e&&e.type==='pointerdown') swallowNextDown=true; land() };
  swapSkip=skip;
  f.classList.add('swap-out');

  addEventListener('keydown',skip,true);
