    transition:opacity 180ms var(--ease-out),transform var(--t-card) var(--ease-out);
  }
  /* a card taller than the window must sit at the top of it, not be centred
     with its head cut off */
  @media (max-height:760px){ .veil{align-items:flex-start} }

  /* ---------- bulletin-style panel ----------
     THE SAME CARD AS THE OTHER TWO. everything the game floats over the board —
     the in-play `.saycard`, the tutorial `.coach` — is a --surface ground, a
     hairline --silver border, ink type, and a thin colour strip along the top.
     this one was the exception: a saturated --dunkelblau plate carrying white
     type, with the tier as a band across it. it is the card that lands at the
     best moment in the game and it did not belong to the game's own family.
     it is a surface card now, in the same four parts and the same order.

     what that costs and what it buys. white on dunkelblau measured 5.39:1; ink
     on --surface measures 15.22 dark and 16.93 light, so the 12px note has three
     times the headroom it had. the stamps gain more: a feature plate against the
     dunkelblau card ran 1.00 to 3.21 — an emblem you could barely find on the
     card announcing you had earned it — and against --surface it is 3.22 to
     10.32 on the dark ground. and the tier strip is freed: see TIERCOL, where
     that one plate was quietly deciding the whole ladder.

     it stays OPAQUE, which was measured separately and does not change with the
     ground: the thing behind this card is a lit board, and a note composited
     over a board is a note on an unknown ground. 12% does not read as
     transparency anyway. */
  .bulletin{
    max-width:440px;width:100%;color:var(--ink);position:relative;overflow:hidden;
    background:var(--surface);border:1px solid var(--silver);
    box-shadow:var(--shadow-card);
  }
  /* the tier, and the one place on this card the ladder is drawn. same 7px the
     `.say` card uses for the feature it is speaking about — the two cards sit in
     the same corner of the same board and their strips have to weigh the same. */
  .bulletin .bstrip{height:7px;width:100%;display:block}
  .bulletin .bhead{display:flex;justify-content:space-between;align-items:flex-start;padding:20px 22px 0}
  .bulletin h2{font-size:31px;font-weight:700;letter-spacing:-.025em;text-transform:lowercase;line-height:1}
  /* the rung, in words, directly under the title. it is ink rather than the
     tier's own colour: the strip above has already said which rung this is, and
     a word in a signal colour would be the game's one saturated piece of TYPE. */
  .bulletin .bsub{font-size:11px;letter-spacing:.18em;text-transform:lowercase;color:var(--ink-soft);margin-top:5px}
  .bulletin .bnum{font-size:52px;font-weight:300;line-height:.85;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
  /* hairlines in --rule, the same material every other rule in the game is drawn
     in. they were white at 35%, which is a rule mixed with its own ground and
     only exists on a plate that has one. */
  .bulletin .brules{margin:18px 0 0;border-top:1px solid var(--rule)}
  .bulletin .brow{display:flex;justify-content:space-between;gap:12px;padding:9px 22px;border-bottom:1px solid var(--rule);font-size:11.5px;letter-spacing:.1em;text-transform:lowercase;color:var(--ink-soft)}
  /* the rows arrive in reading order, a beat apart, inside the card's own
     entrance — the card is a readout being printed, not a picture being shown */
  .veil.show .bulletin .brow{animation:rowin .26s var(--ease-out) both;
    animation-delay:calc(70ms + var(--i,0) * 32ms)}
  @keyframes rowin{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
  /* the label is quiet and the figure is ink: on a row that is a reading, the
     reading is the part worth looking at. on the white plate they were one
     colour and the distinction could not be made at all. */
  .bulletin .brow b{font-weight:400;font-variant-numeric:tabular-nums;color:var(--ink)}
  .bulletin .bbody{padding:16px 22px 20px;position:relative}
  .bulletin .bnote{font-size:12.5px;line-height:1.55;color:var(--ink-soft);padding-right:46px}
  /* the ray dial belongs to the card, not to its controls. anchored to the whole
     bulletin it sat in the same band as the buttons, and on a narrow card the
     buttons grow until they reach it — measured 15px of it lying across "stop
     for today" at a 306px card. a decoration that lands on a control's label is
     not decoration. so it hangs off the note band instead, where the only thing
     it can ever overlap is the text that has been given room for it. */
  /* the dial is drawn in --silver rather than at 50% white, for the same reason
     the rules are: a decoration mixed with its own ground cannot follow the
     ground anywhere else. it keeps its opacity, which is what makes it a
     watermark rather than a diagram. */
  .bulletin .bsun{position:absolute;right:22px;bottom:16px;width:34px;height:34px;opacity:.55;pointer-events:none}
  .bactions{display:flex;gap:9px;padding:0 22px 20px}
  /* a wide button depresses rather than shrinking. it is the same physical idea
     as the icon buttons — the control moves under the finger — said in the way
     each shape can say it: a small square scales, a long bar goes down.
     these are the game's own two button idioms now that the card has no plate to
     invert against: a ghost is a --silver hairline round ink, like `.dstate` and
     `.act`; the primary is a solid block of ink with the ground knocked out of
     it, which is exactly `.intro-start` — down to the dunkelblau it goes to on
     hover, the one job that colour still has here. */
  .wbtn{
    border:1px solid var(--silver);background:transparent;font:inherit;font-size:12px;
    letter-spacing:.1em;padding:8px 15px;cursor:pointer;color:var(--ink);text-transform:lowercase;
    transition:background var(--t-ui),color var(--t-ui),border-color var(--t-ui),
               transform var(--t-lift) var(--ease-out);
  }
  .wbtn:hover{background:var(--surface-2);border-color:var(--ink)}
  .wbtn:active{transform:translateY(1px) scale(.99);
    transition-duration:var(--t-ui),var(--t-ui),var(--t-ui),var(--t-press)}
  .wbtn.solid{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .wbtn.solid:hover{background:var(--dunkelblau);border-color:var(--dunkelblau);color:var(--paper)}

  /* minted badges strip inside bulletin.
     the stamps are sized to hold a row rather than to a drawing width. at 82px
     three of them wanted 266 and a 306px card offers 262 — four pixels short, so
     the commonest result in the game (three features off one net) broke to two
     rows and left the third stamp alone above the note with a hole beside it.
     78 fits three across on the narrowest card the layout supports, and they may
     shrink further before they will wrap. */
  .minted{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 18px}
  /* a stamp is pressed down onto the card: it comes in slightly large and stops
     dead on contact. the old one arrived at 1.4x and five degrees off true and
     then bounced — a cartoon, and the one overshoot in the game that had least
     business being one, since a stamp is the most physical object on screen. */
  .minted .mb{flex:0 1 78px;min-width:0;text-align:center;animation:stampin .32s var(--ease-snap) both;
    animation-delay:calc(150ms + var(--i,0) * 60ms)}
  .minted .mb .feature-stamp{display:block;width:100%;height:auto;filter:drop-shadow(0 2px 0 rgba(36,52,61,.12))}
  .minted .mb span{display:block;font-size:9px;letter-spacing:.08em;padding:3px 2px 0;text-transform:lowercase;color:var(--ink)}
  /* the strength tally belongs to the label above it, so it sits ON it rather
     than floating a line below looking like a stray mark */
  .minted .mb u{display:block;text-decoration:none;font-size:8px;letter-spacing:1px;
    line-height:1;margin-top:2px;color:var(--ink-soft)}
  @keyframes stampin{from{opacity:0;transform:scale(1.16)}to{opacity:1;transform:none}}

  /* ---------- the cards that sit ON the board ----------
     holdCleared exists to hold a SOLVED board still for 1.6s — the last crossing
     goes, every freed thread eases into a drawing of its own sign, and then
     nothing moves. a 440x639 plate was then drawn over the middle of that under
     a 7px blur: the card announced a board it had just finished making worth
     looking at, and took it away to do so. measured, it covered 43% of the plate
     and blurred the other 57%.
     so these veils stop being veils. they keep `.show` — sayShow, dismissVeil,
     hideVeils and nextNet all read that class and none of them can tell the
     difference — and give up only what they PAINT: no ground, no backdrop blur.
     each is still the full click target across the board, so clicking beside the
     cleared card still continues, which is what dismissVeil promises.

     BOTH bulletins are here now. the day card was the exception, on the stated
     grounds that it was terminal and had no board left behind it — and that was
     never true. `continue →` on the tenth net built an ELEVENTH, so the biggest
     moment in the game arrived as a 440x619 modal, 30% of a 1280x720 window and
     88% of a phone, over a blurred tangle nobody would ever be allowed to play.
     the day now ends on the board it was won on and stays there (see clearNet),
     which takes the exception away with it: the last thing the game does is the
     same thing it does after every other net, at the scale of the whole day.

     WHERE. the same corner as the in-play `.say` card, chosen the same way:
     bottom right hides 0.02 crossings a net where the centre hides 1.01. and the
     same offsets, because there is only one letterbox and publishPlateInset
     already publishes it — `--plate-x` / `--plate-y` on `.field`. those are
     inherited custom properties, which is the whole reason both veils sit
     inside `.field` in the markup: a fixed overlay at body level cannot see them,
     and measuring the board a second time to work around that would be two
     sources of truth for one number. absolute rather than fixed, so `.field`'s
     own overflow clips them to the board and the masthead stays reachable
     behind.

     WHAT IT IS NOT: translucent. the ground was --dunkelblau when that was
     measured and is --surface now, and the answer did not change — it got
     easier. white on dunkelblau was 5.39:1, and composited over the paper plate
     at 12% clear the same white fell to 4.37:1, under the 4.5 a 12px note needs,
     before a gelb thread had passed beneath it (4.80). ink on --surface starts
     from 15.22:1 dark and 16.93 light, so the arithmetic no longer binds — but
     the reason underneath it does: the thing behind this card is a LIT BOARD,
     not a flat colour, so a translucent card's contrast is whatever happens to
     be passing under it. 12% does not read as transparency anyway. the ground
     stays opaque and the board shows AROUND the card rather than through it:
     16% of the plate covered where it was 43%, and none of the rest blurred. */
  .veil.boardcard{
    position:absolute;background:none;padding:0;overflow:visible;
    align-items:flex-end;justify-content:flex-end;
  }
  .veil.boardcard.show{-webkit-backdrop-filter:none;backdrop-filter:none}
  .boardcard > .bulletin{
    max-width:min(360px,calc(100% - 2 * var(--plate-x,0px) - 36px));
    /* both letterbox margins, the way the width already takes both — the card is
       anchored to the plate's bottom edge, so a cap counting the inset once let
       a tall card climb out of the top of the plate and into the dead margin
       above it. it never bound on the net card at 270px; the day card is twice
       that and finds it at the first short window. */
    max-height:calc(100% - 2 * var(--plate-y,0px) - 36px);
    margin:0 calc(var(--plate-x,0px) + 18px) calc(var(--plate-y,0px) + 18px) 0;
    /* the shadow of the other corner card, not of a modal: `.saycard` sits on
       --shadow-float and these now sit beside it on the same board. --shadow-card
       is left to the cards that really are modals — the record, the rules. */
    box-shadow:var(--shadow-float);
    /* a corner card lifts the way the other corner card does: 7px, no scale.
       the 14px-and-a-scale entrance belongs to a plate arriving in the middle of
       the screen, and neither of these is one any more. */
    transform:translateY(7px);
  }
  .boardcard.show > .bulletin{transform:none}
  /* a small object in the corner of a board, so the whole card steps down
     together rather than one part of it shrinking against the rest */
  .boardcard h2{font-size:23px}
  .boardcard .bsub{font-size:10px;margin-top:4px}
  .boardcard .bnum{font-size:40px}
  .boardcard .bhead{padding:15px 18px 0}
  .boardcard .brules{margin-top:13px}
  .boardcard .brow{padding:8px 18px;font-size:11px}
  .boardcard .bbody{padding:13px 18px 14px}
  .boardcard .bnote{font-size:12px;padding-right:0}
  .boardcard .minted{gap:7px;margin:0}
  .boardcard .minted + .bnote{margin-top:13px}
  /* five is the most features a net ever holds, and 5 x 58 + 4 x 7 = 318 against
     the 324 this card leaves inside its padding — so the commonest results and
     the worst case all stay on one row. the day card's eight run to a second
     row on the same measure, which is why it shows two full fives (showRunOver)
     rather than a five and a ragged three. */
  .boardcard .minted .mb{flex:0 1 58px}
  .boardcard .bactions{padding:0 18px 16px}
  .boardcard .wbtn{padding:7px 12px}
  /* the day card is the one with somewhere to send you — share, the record, run
     again, the trial, and the way back into an unfinished set. five buttons on a
     324px line is three rows of one-and-a-half words each, so they go to a grid
     of two and the leading action takes the full width of it. */
  #runveil .bactions{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  #runveil .bactions .wbtn:first-child:nth-last-child(odd){grid-column:1 / -1}
  #runveil .wbtn{padding:8px 10px;font-size:11.5px;letter-spacing:.08em}
  /* the readings these cards stopped printing. on the net card: features freed
     was a count of the stamps directly beneath it, the strength tally had no key
     anywhere on the card, and clean-so-far and turns-today are DAY facts on a
     card about one net. on the day card: today's set, clean and the streak, all
     three of which are drawn or written within an inch of the row that repeated
     them — the title and the numeral say the set is complete and how deep it
     went, the sub line says the clean count, and the masthead carries the streak.
     cut from the drawing, kept for the reader, because a screen reader has no
     masthead glance and no board to count stamps off. */
  .bulletin .bquiet{position:absolute;width:1px;height:1px;overflow:hidden;
    clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}

  @media (max-width:700px){
    /* the plate is turned a quarter and comes out about 256x460 inside a 355px
       field: there is no corner here to tuck 360px of card into, which is the
       same wall `.say` hit at this width. so the card spans the board and sits at
       the FOOT of it — the one edge a portrait net can spare, and short enough
       now that the top half of the plate, where the signs mostly settle, is still
       open. the width comes off the field rather than the plate for the same
       reason `.say`'s does: a card spanning the board is already inside it. */
    .boardcard > .bulletin{
      max-width:none;width:calc(100% - 20px);
      margin:0 auto 10px;max-height:62%;
    }
    /* 297px inside the padding here against the 318 five 58s want: the worst case
       broke to a second row and cost 90px of card — 15% of the plate — to show
       one stamp with a hole beside it. 52 keeps all five on the line, and the
       same arithmetic the desktop size came off: 5 x 52 + 4 x 7 = 288. */
    .boardcard .minted .mb{flex:0 1 52px}
    /* the day's second row of stamps costs 105px, and this card has 388 to spend
       — it was the difference between a card that fits at the foot of the plate
       and one whose last row of buttons is below the board. so the phone shows
       the row it has room for. the count the row is a sample of is in .bquiet,
       and the whole set is one button away in the record. */
    #runveil .minted .mb:nth-child(n+6){display:none}
  }

  /* the same cut, for the same reason, on a window too SHORT rather than too
     narrow. a landscape phone at 720x420 leaves the plate 434x242 and the card
     204 to sit in — the NET card already overruns that, at 268, and scrolls
     inside itself. neither can be made to fit and stay a card: the day card
     needs 329 with one row of stamps, and the only arrangement that clears 204
     is no stamps, no note and the buttons on a single line, which is not the
     card any more. so it still scrolls here, by 125 rather than by 230, against
     the modal's own 239 over a board it also blurred. */
  @media (max-height:560px){
    #runveil .minted .mb:nth-child(n+6){display:none}
  }

  /* every control is in here until it earns a place on the board. the HUD
     should be readable as a HUD, not as a HUD plus a workbench. */
  .devdrawer{
    position:fixed;right:14px;bottom:14px;z-index:70;width:212px;
    background:var(--surface);border:1px solid var(--silver);
    box-shadow:var(--shadow-float);padding:11px 12px 12px;
  }
  .devdrawer:not([hidden]){animation:drawerin .22s var(--ease-out) both}
  @keyframes drawerin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .devdrawer[hidden]{display:none}
  .dd-head{display:flex;justify-content:space-between;align-items:baseline;
    font-size:9.5px;letter-spacing:.14em;color:var(--ink-soft);text-transform:lowercase;margin-bottom:9px}
  .dd-head a{color:var(--silver);text-decoration:none}
  .dd-head a:hover{color:var(--ink)}
  .devdrawer .actionrow{display:grid;grid-template-columns:1fr 1fr;gap:3px}
  .dd-note{margin-top:10px;padding-top:9px;border-top:1px solid var(--rule);
    font-size:9px;line-height:1.5;letter-spacing:.06em;color:var(--silver);text-transform:lowercase}
  .dd-note b{color:var(--ink-soft)}
  .devtab{
    position:fixed;right:14px;bottom:14px;z-index:69;width:9px;height:9px;
    border:1px solid var(--rule);background:transparent;cursor:pointer;padding:0;
  }
  .devtab:hover{border-color:var(--silver)}

  /* ---------- the record ----------
     one card, and only one thing on it moves. the head holds the one question
     a day list structurally cannot answer — which of the sixteen features have
     still never come off a board — and the days scroll under it. */
  .record{
    max-width:640px;width:100%;display:flex;flex-direction:column;
    /* the LIST scrolls, not the card: .veil > * hands every overlay an
       overflow-y of its own, and here that would take the head with it */
    max-height:calc(100dvh - 40px);overflow:hidden;
    border:1px solid var(--silver);background:var(--surface);box-shadow:var(--shadow-card);
    /* `--set-ahead` was declared here too, and is gone with the rest of it.
       the masthead draws a net not yet reached as the BARE TRACK, and this card
       deliberately does not: these cells sit on --surface with no track behind
       them, and --rule on --surface is 1.28:1, which is no mark at all. what
       they take instead is plain --silver, which is free again now that no rung
       is a neutral, and which measures 4.31 here on paper and 2.97 on the dark
       ground. the hairline is a hairline and every rung is a block, so height
       tells them apart before colour is asked to. */
  }
  .rec-head{
    flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:13px 18px;border-bottom:1px solid var(--ink);
  }
  .rec-title{font-size:15px;font-weight:700;letter-spacing:-.01em;text-transform:lowercase;line-height:1}
  .rec-close{font-size:11px;letter-spacing:.14em;color:var(--ink-soft);text-decoration:none;text-transform:lowercase}
  .rec-close:hover{color:var(--ink)}
  /* a line, not a block: the numerals sit beside their labels on the title's
     own baseline, which is the difference between a reading and a dashboard */
  .rec-right{display:flex;align-items:baseline;gap:16px;margin-left:auto;min-width:0}
  .recstats{display:flex;align-items:baseline;gap:14px;min-width:0}
  .rstat{display:flex;align-items:baseline;gap:5px;white-space:nowrap;
    font-size:8.5px;letter-spacing:.12em;color:var(--ink-soft);text-transform:lowercase}
  /* the score is the screen's subject, so it is drawn as one. it used to be
     13px/400 — smaller and lighter than the word "record" beside it, and smaller
     than the close button, on a screen whose entire job is telling you how you
     did. this is the numeral voice the file already uses on the run card and the
     share plate (300 weight, tabular, tight), not a new size invented here.
     the figure carries no tracking: tracking is for words. */
  .rstat b{font-size:23px;font-weight:300;letter-spacing:-.02em;line-height:1;
    color:var(--ink);font-variant-numeric:tabular-nums}
  .rstat em{font-style:normal;font-size:11px;letter-spacing:.06em;color:var(--ink)}
  .rstat i{font-style:normal;font-size:9px;letter-spacing:.12em;color:var(--ink-soft)}
  .rstat i::before{content:'·';margin-right:5px;opacity:.55}

  /* ---------- the sixteen ----------
     one row, pinned, and the whole of what used to be a panel up here. a found
     feature wears its own plate with a band under it in the tier it was minted
     at; an unfound one is a hairline square with a cross in it, which says
     unidentified without giving the sign away. the plates are what make it a
     legend as well as a tally: a stamp in a row below is the same drawing. */
  .featrow{
    flex:0 0 auto;display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:4px;
    padding:11px 18px 12px;border-bottom:1px solid var(--rule);
  }
  .fcell{display:block;min-width:0;border-bottom:3px solid var(--tc,var(--rule));transition:filter var(--t-ui)}
  .fcell svg{display:block;width:100%;height:auto}
  .fcell:hover{filter:var(--hover-lift)}
  .fcell.none{border:1px solid var(--rule);border-bottom-width:3px;color:var(--silver)}

  /* ---------- the days ----------
     the archive is the paid tier, and it is now ONE row at the foot of the list
     rather than a row per shut day. a free player has every day older than
     yesterday shut, which was 11 of the 13 rows a new player met, growing by one
     every day forever — about 95% of the list inside a year — and the violet
     field on the first of them was the only saturated object on the card, so the
     visual anchor of a history screen was a shop. the count says the same thing
     in one line, the list stops growing, and the way through is a link in the
     quietest ink here rather than the loudest field.
     it is dashed and it is --rule: dashed means shut, the one thing it means
     anywhere on this screen, and --rule is a step below the played rows' own
     keyline, which is where the archive belongs in the order of things. */
  .dayarch{
    display:flex;align-items:center;gap:10px;width:100%;
    border:1px dashed var(--rule);background:transparent;
    padding:0 11px;min-height:34px;
  }
  .dayarch .datext{font-size:10px;letter-spacing:.09em;
    color:var(--ink-soft);text-transform:lowercase}
  /* a way through, not the subject: same ink as the line it sits on, and a
     hairline under it rather than a field around it — at 9px an unmarked link
     is not readable as one, and a hairline is the mark this whole card is made
     of. it still flips POLICY.premium and nothing else; there is no payment
     behind it and there cannot be until there is a server to take one. */
  .archlink{
    margin-left:auto;flex:0 0 auto;text-decoration:none;
    font-size:9px;letter-spacing:.12em;text-transform:lowercase;
    color:var(--ink-soft);border-bottom:1px solid var(--rule);padding-bottom:1px;
    transition:color var(--t-ui),border-color var(--t-ui);
  }
  .archlink:hover{color:var(--ink);border-bottom-color:var(--ink)}

  /* the list is the one region on this card that scrolls */
  .daylist{flex:1 1 auto;min-height:0;overflow-y:auto;padding:10px 18px 16px;
    display:flex;flex-direction:column;gap:5px}
  /* ONE LINE, and structurally so: the row never wraps and the middle column is
     the only thing that gives (it ellipses). the right-hand column is a fixed
     width now — ten cells and nine gaps, the same on every row — so nothing has
     to be measured to know it fits, and the bars line up down the card as a
     column you can read across. that is the difference between a list of days
     and a scoreboard. */
  .dayrow{
    display:flex;align-items:center;gap:10px;flex-wrap:nowrap;width:100%;
    font:inherit;color:var(--ink);text-align:left;appearance:none;
    border:1px solid var(--rule);background:var(--surface);
    padding:0 11px 0 0;min-height:38px;cursor:pointer;overflow:hidden;
    transition:border-color var(--t-ui);
  }
  /* silver, not ink: ink is what marks TODAY, so hovering any row used to make
     it look like the row you are on */
  .dayrow:hover{border-color:var(--silver)}
  .dayrow .dtier{flex:0 0 auto;width:7px;align-self:stretch;background:var(--tc,var(--rule))}
  .dayrow .ddate{flex:0 0 auto;width:78px;padding:11px 0;
    font-size:10.5px;letter-spacing:.07em;text-transform:lowercase;font-variant-numeric:tabular-nums}
  .dayrow .ddet{flex:0 1 auto;min-width:0;max-width:47%;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    font-size:10px;letter-spacing:.09em;color:var(--ink-soft);text-transform:lowercase}
  /* ---------- the day's ten ----------
     one cell per net, and THE TIER IS THE HEIGHT: full, two thirds, a third,
     and a hairline for a net the day never reached. colour comes off TIERCOL
     and says the same thing a second time, which is the point of it. under the
     old green/light blue/turquoise ladder the hues measured 1.00 : 1.00 : 1.01
     in greyscale against each other, so a hue-only strip was one flat grey block
     in a screenshot, on a monochrome panel, and to anyone whose cones did not
     separate green from turquoise. the current ladder separates in greyscale
     too — worst pair 1.43 on either ground now the rungs are canonical on both,
     against 1.08 while the light ladder read --sig-* — but not by enough to
     lean on, and the height is still what carries the reading through all
     three. it is horizontals and verticals only, so it stays on the 45° grid
     the rest of the card is drawn on.

     what stood here was the day's FEATURES — about fourteen emblems of a
     possible sixteen on every finished day, so every row carried roughly the
     same fourteen as every other. 151 coloured glyphs on one screenful against
     a score glyph a fraction of the size: 26.6 : 1 of ink in favour of the
     collectibles, on a screen whose subject is the score. these cells differ
     from day to day, which is the only thing that makes a row worth drawing.

     it is the form the file already has twice — the masthead's set strip and
     the share card's ladder — not a third one. cells of one width on one
     baseline, each handed `var(--token)` rather than a resolved colour, so a
     theme flip repaints them with no javascript re-running. */
  .dayrow .dcells{
    --cw:6px;--ch:18px;
    flex:0 0 auto;margin-left:auto;display:flex;align-items:flex-end;gap:2px;height:var(--ch);
  }
  /* the hairline is silver, and it can be again: no rung is a neutral now, so
     silver is nobody else's and an unreached net is the only thing on this card
     wearing it. it is also the one mark here that is not a block — see the note
     on --set-ahead's removal above. */
  .dayrow .dcells i{flex:0 0 auto;width:var(--cw);height:1px;
    background:var(--fill,var(--silver))}
  .dayrow .dcells i.t1{height:calc(var(--ch) / 3)}
  .dayrow .dcells i.t2{height:calc(var(--ch) / 3 * 2)}
  .dayrow .dcells i.t3{height:var(--ch)}
  /* played, but filled in from the archive rather than earned on the day —
     hatched, the mark the calendar used, and the reason it never touched the
     streak. a bought day fills the grid; it cannot buy the run of days. */
  /* `--tc` carries its own fallback here as well as on .dtier: a backfilled day
     from a legacy save has no recorded rung and sets no --tc, and a bare
     `var(--tc)` inside a gradient is invalid at computed-value time — which
     drops the whole background and draws NOTHING, rather than dropping through
     to the hairline the way .dtier does. */
  .dayrow.back .dtier{background:repeating-linear-gradient(45deg,var(--tc,var(--rule)) 0 3px,var(--surface) 3px 6px)}
  /* a day you can still play is SOLID. it was dashed, and dashed is the idiom
     for "not available yet" — so the primary call to action on the screen, and
     today's own row, were drawn as though disabled, and playing one rewarded you
     by making it solid. dashed now means exactly one thing, below: shut. */
  .dayrow.open{border-color:var(--silver)}
  /* a shut day has no row of its own any more — see .dayarch, which carries the
     whole run of them in one line at the foot of the list. */
  /* today outranks both: whatever else the row is, it is the one you are on */
  .dayrow.today{border-color:var(--ink)}
  /* ink, not a signal colour: the ladder owns the hues, so a border in one of
     them reads as a tier the row did not mint */
  .dayrow.open:hover{border-color:var(--ink)}
  /* the one chip left on a row: `play →` on a day still open to you. it takes
     the slot the cells take on a played row, so the right edge of the list is
     one column whatever the row is. */
  .dstate{flex:0 0 auto;margin-left:auto;display:flex;align-items:center;gap:5px;
    font-size:9px;letter-spacing:.11em;text-transform:lowercase;color:var(--ink-soft);
    border:1px solid var(--rule);padding:3px 7px}
  .dayrow.open .dstate{color:var(--ink);border-color:var(--silver)}
  .dayrow.open:hover .dstate{border-color:var(--sig-hellblau);color:var(--sig-hellblau)}
  .runempty{
    border:1px dashed var(--silver);padding:17px 15px;text-align:center;
    font-size:11.5px;letter-spacing:.07em;color:var(--ink-soft);text-transform:lowercase;line-height:1.6
  }

  /* the rules card is read, not admired: one column, no artwork plate.
     it is also a reference you come back to, not a lesson — the guided net does
     the teaching — so it is a legend of the board's own marks with the words
     reduced to labels, rather than prose with pictures beside it. */
  .intro-card.plain{grid-template-columns:1fr;max-width:452px}
  .intro-card.plain .intro-art{display:none}
  .rkey{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center;
    margin-top:16px;padding-top:14px;border-top:1px dashed var(--rule);
    font-size:12.5px;color:var(--ink-soft);line-height:1.4}
  .rkey b{color:var(--ink);font-weight:700}
  /* the marks are board fragments at board scale, so a neuron here is the same
     size relative to its thread as the one you are about to drag */
  .rmark{width:56px;height:36px;display:block;flex:0 0 auto}
  /* ---------- intro ---------- */
  .intro-card{
    max-width:790px;width:100%;background:var(--surface);border:1px solid var(--ink);display:grid;
    grid-template-columns:minmax(0,1.08fr) minmax(360px,.92fr);overflow:hidden;box-shadow:var(--shadow-card);
  }
  .intro-strip{height:7px;display:flex;grid-column:1/-1}
  .intro-strip i{flex:1}
  .intro-art{position:relative;min-height:100%;overflow:hidden;background:var(--paper);border-right:1px solid var(--rule)}
  .intro-art > svg{display:block;width:100%;height:100%;min-height:390px}
  .intro-art span{
    position:absolute;left:14px;bottom:14px;background:var(--surface);border:1px solid var(--silver);
    padding:5px 8px;font-size:9.5px;letter-spacing:.16em;color:var(--ink);text-transform:lowercase;
  }
  .intro-body{padding:20px 22px 24px}
  .intro-title{font-size:19px;font-weight:700;text-transform:lowercase;letter-spacing:-.01em}
  .intro-sub{font-size:11px;color:var(--ink-soft);letter-spacing:.12em;margin-top:3px;text-transform:lowercase}
  /* .intro-steps went with the numbered steps it styled — the rules card is a
     legend now, and nothing else in the game is a numbered list. */
  .intro-note{margin-top:15px;padding-top:13px;border-top:1px dashed var(--silver);font-size:12px;color:var(--ink-soft);line-height:1.55}
  .intro-note b{color:var(--ink);font-weight:700}
  .intro-lead{font-size:14px;line-height:1.55;margin-top:14px}
  .wbstats{display:grid;grid-template-columns:1fr 1fr;gap:0;margin:16px 0 0;border-top:1px solid var(--ink)}
  .wbstats div{padding:11px 0;border-bottom:1px solid var(--rule)}
  .wbstats div:nth-child(odd){border-right:1px solid var(--rule);padding-right:12px}
  .wbstats div:nth-child(even){padding-left:12px}
  .wbstats b{display:block;font-size:23px;font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .wbstats span{font-size:10px;letter-spacing:.14em;color:var(--ink-soft);text-transform:lowercase}
  .wbrow{display:flex;gap:5px;margin-top:14px;flex-wrap:wrap}
  .wbrow i{width:15px;height:15px;border:1.5px solid var(--rule);display:block}
  .intro-start{margin-top:17px;width:100%;border:1px solid var(--ink);background:var(--ink);color:var(--paper);font:inherit;font-size:12.5px;letter-spacing:.1em;padding:9px;cursor:pointer;text-transform:lowercase;
    transition:background var(--t-ui),border-color var(--t-ui),color var(--t-ui),transform var(--t-lift) var(--ease-out)}
  .intro-start:hover{background:var(--dunkelblau)}
  .intro-start:active{transform:translateY(1px) scale(.995);
    transition-duration:var(--t-ui),var(--t-ui),var(--t-ui),var(--t-press)}
  .intro-alt{margin-top:8px;background:transparent;color:var(--ink);border-color:var(--silver)}
  .intro-alt:hover{background:var(--sig-violett);border-color:var(--sig-violett);color:#fff}

  .toast{
    position:fixed;left:50%;bottom:32px;transform:translateX(-50%) translateY(8px);
    background:var(--ink);color:var(--paper);font-size:11.5px;letter-spacing:.1em;
    padding:8px 16px;opacity:0;pointer-events:none;text-transform:lowercase;z-index:60;
    transition:opacity var(--t-exit) var(--ease-in),transform var(--t-exit) var(--ease-in);
  }
  .toast.show{transition:opacity var(--t-ui) var(--ease-out),transform var(--t-card) var(--ease-out)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* the wordmark, three columns of instrument and three buttons stop sharing a
     line here. what gave way was the buttons: they ran off the right of the
     panel and were clipped by the shell — a two-column head did the same before
     the cluster arrived, at a slightly wider window, so this is an old break
     rather than a new one. the head keeps all its parts and drops the cluster
     onto its own row, where the tracks get the full width instead of a third of
     a squeeze each. */
  @media (max-width:860px){
    .hud-head{grid-template-columns:1fr auto;gap:11px}
    .mark{grid-column:1;grid-row:1}
    .btns{grid-column:2;grid-row:1}
    .instruments{grid-column:1 / -1;grid-row:2;border:1px solid var(--rule);padding:9px 13px 8px}
  }

  /* the board is aspect-locked, the rail is not: below roughly 1120px the rail
     is the taller column and the board floats above a growing band of white —
     233px of it at 900px. from here down the rail becomes a horizontal
     instrument strip and the board takes the full width. this is the ONLY
     thing that changes here; the narrow-screen treatment is at 700px. */
  @media (max-width:760px){
    .hud-body{grid-template-columns:minmax(0,1fr)}
    .rail{
      border-left:0;border-top:1px solid var(--silver);
      flex-direction:row;flex-wrap:wrap;align-items:flex-start;
      gap:16px 24px;padding:16px 22px 18px;
    }
    /* in a column the numeral belongs flush right; in a wide row that same
       margin-left:auto strands it ~150px from its own glyph */
    .rail .gauge-row{justify-content:flex-start;gap:12px}
    .rail .gauge-row b{margin-left:0}
    .railactions{
      flex:1 1 100%;margin-top:4px;flex-direction:row;align-items:stretch;gap:8px;
    }
    .railactions .actionrow{flex:1 1 auto;display:flex;gap:4px}
  }

  @media (max-width:700px){
    .sheet{padding:14px 10px 36px}
    h1{font-size:21px}
    .hud-head{gap:11px;padding:11px 13px 12px}
    /* three columns of a third of a phone still hold a figure, its caption and
       a countable track, so the cluster stays whole rather than splitting up —
       splitting it would cost the one line the three tracks share, which is
       the whole of what makes them one instrument. what gives instead is the
       figure and the caption sharing a line; see .unit-top below. */
    .instruments{padding:9px 11px 8px}
    .unit{padding:0 9px}
    .unit-label{font-size:8.5px;letter-spacing:.1em}
    .unit-fig{font-size:20px}
    .unit-of{font-size:7.5px}
    /* THE LINE FOLDS. a third of a phone is ~92px of usable bay, and the widest
       bay wants 20px of figure, 12 of gap and 62 of caption to hold them side by
       side — it fits at 375 by two pixels and does not fit at 360. so the
       caption takes a full line and drops under its figure. same three parts in
       the same order, one flex line instead of two, and it is the wrap doing it
       rather than a second layout: nothing here restates the desktop rule.
       the fold is set at 700 rather than at the ~430 where it is forced, because
       700 is where this file already puts the narrow treatment and a fourth
       breakpoint costs more than the 200px of tablet it would buy. */
    .unit-top{flex-wrap:wrap}
    .unit-name{margin-left:0;flex-basis:100%;margin-top:2px}
    /* a fourth button in the cluster is 48px including its gap, and on a phone
       the head did not have 48px spare: the row ran 27px past the panel and
       took the instrument tracks with it, which is a horizontal scrollbar on a
       page that does not scroll. the buttons give the width back — they are
       34px tall already, so 34 wide is the square they were always closest to. */
    .btns{gap:4px}
    .btns .help{min-width:34px;padding:0 6px}
    .rail{gap:15px 20px;padding:14px 13px 15px}
    .rail .gauge{flex:1 1 128px}
    .railactions{flex-wrap:wrap}
    .railactions .actionrow{flex:1 1 100%}
    /* the coach card floated over the board and covered 73% of it — on the
       first screen a new player ever sees. inline it above the tangle instead;
       there is no width here to overlay anything on. */
    .field{display:flex;flex-direction:column}
    .coach{
      position:static;transform:none;width:auto;order:-1;margin-bottom:10px;
      box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--surface);
    }
    .play.tutorial .coach{animation:none}

    /* the board is aspect-locked, so a narrow screen renders it short and every
       mark shrinks with it: at 390px a crossing marker came out 1.27 CSS px and
       a thread 1.20. scale the marks back up. presentational only — positions,
       seeds and geometry are untouched, so the day is the same puzzle here. */
    .field{--nr:15;--nw:4.2}
    /* crossings size themselves from markScale inline, so they need no width
       rule here — a stroke is not reachable from a media query anyway. neither
       the pin's square nor the shared neuron's inner ring and halo need one:
       every one of them is expressed off --nr where it is defined, so raising
       --nr here is the whole of the phone treatment for the marks. */
    /* 12.5 source units renders at 4.4 CSS px on a 390px board — a caption you
       cannot read is not a reward for freeing the thread */
    .field .tlabel2{font-size:28px;stroke-width:9}

    /* the rail was 325px against a 205px board — the instruments outweighed
       the game. tighter glyphs and gaps, and the meters lose a row. */
    .rail{gap:12px 16px;padding:12px 13px 13px}
    .gauge{gap:5px}
    .gauge-glyph{width:34px}
    .gauge-row{gap:9px}
    .gauge-row b{font-size:26px}
    /* a third of a phone is 90px of bay. the bar loses 2px of height with the
       cluster around it and keeps everything else — there is nothing to thin
       out any more, because there are no gaps left to spend. */
    .track{height:8px;margin-top:7px}

    /* a vertical list of days should be at its best on a phone, so nothing
       here reflows the row — it stays one line and the margins give instead.
       the sixteen fold to two rows of eight; sixteen cells across 315px would
       be 16px each, which is a colour chip rather than a sign. */
    .veil{padding:12px}
    .record{max-height:calc(100dvh - 24px)}
    .rec-head{padding:11px 13px}
    .rec-right{gap:12px}
    .recstats{gap:11px}
    /* still one row of sixteen: at 309px that is 18px a cell, which loses the
       detail of a sign but keeps the only thing this row is for — how much of
       the set is filled, and where the gaps are */
    .featrow{padding:10px 13px 11px;gap:3px}
    .daylist{padding:9px 13px 13px}
    .dayrow{gap:8px;padding-right:9px}
    .dayrow .ddate{width:64px;font-size:10px;letter-spacing:.04em}
    .dayrow .ddet{font-size:9.5px}
    /* 68px of bar against 78: the cells lose a pixel of width and three of
       height and stay on exact thirds — 5 / 10 / 15 — because a tier read off a
       height cannot afford to round. two numbers change and the whole form
       follows them, which is what the two custom properties are for. */
    .dayrow .dcells{--cw:5px;--ch:15px}
    .dayarch{padding:0 9px;gap:8px}
    .dayarch .datext{font-size:9.5px}
    /* nothing floats over the board any more, so it keeps its whole height */
    .field{padding-bottom:0}
    .coach{top:10px;width:calc(100% - 20px)}
    /* the board is turned a quarter turn here and is tall and narrow, so a card
       spanning the width covers a whole LAYER of the net rather than a slice of
       one. it drops to the type the coach uses at this size, and it sits higher
       — 28% of a tall board is well clear of the middle, and clear of the coach
       card inlined above it on the guided net.
       the phone deliberately does NOT follow the desktop card into the corner.
       the corner is worth having because a 408px card is a small object on a
       1040-wide plate and can be tucked out of the way; a card that spans the
       width has no corner to be tucked into, and putting it at the foot would
       cover the last layer of the net instead of a middle one — the same cost,
       moved. the measurement that chose bottom right was taken on a landscape
       plate with a card-sized rectangle and does not transfer to this shape.
       so the rule above is reset back to a top anchor. `bottom` has to be
       cleared explicitly or an element carrying both top and bottom is
       stretched between them rather than sized by its content; the plate
       offset on `right` is simply overwritten. the letterbox is horizontal
       only here (the turned plate fills the field's height), so 28% needs no
       plate correction — and the plate is 338 of the field's 353px, so a card
       inset 14px from the field is inside it either way.
       both axes are centred without a transform: auto inline margins across a
       left:0/right:0 span, and the `translate` property for the half-height,
       which composes with the entrance lift instead of replacing it.
       the width cap goes back to being measured off the field too. the desktop
       one subtracts the letterbox, which is right for a card tucked into a
       corner of the plate and wrong for one spanning the board: it would take
       15px off a card that is already inside the plate at both ends. */
    .say{left:0;right:0;top:28%;bottom:auto;translate:0 -50%;
         width:calc(100% - 20px);max-width:calc(100% - 28px);margin-inline:auto}
    /* the coach card is not floating here, it is INLINE at the top of the board
       — so on the guided net the top of the board is spoken for, and 28% lands
       the message on top of it. this is the only screen where the two can meet. */
    .play.tutorial .say{top:40%}
    .sayrow{gap:11px;padding:10px 12px}
    .sayline{font-size:13px}
    .sayline.big{font-size:21px}
    .saymark{width:46px;height:30px}
    .coach-body{padding:11px 13px 12px}
    .coach-text{font-size:13px}
    .intro-card{max-width:430px;grid-template-columns:1fr;max-height:92vh;overflow-y:auto}
    .intro-art{aspect-ratio:16/7;min-height:0;border-right:0;border-bottom:1px solid var(--silver)}
    .intro-art > svg{min-height:0}
    .intro-body{padding:17px 18px 20px}
  }

  /* ---------- reduced motion ----------
     deliberately not a blanket `animation:none` on everything: some of what
     moves here is carrying meaning, and a state change still has to be legible
     with the motion off. what goes is travel — slides, sweeps, lifts, the light
     that runs down a freed thread, the board swap. fades and colour changes
     stay, because a cross-fade is not motion.
     the superposed neuron's halo is the one mark here that gives anything up.
     its ping is travel, so the travel goes — and what is left is the same ring
     standing at its rest radius, which is where it spends most of every cycle
     anyway. the neuron still reads as the one to act on with the motion off,
     and the split still lands both halves where they belong, instantly.
     the physics has its own path in startPhysics: no drift, and springs that
     arrive in one frame rather than five. */
  @media (prefers-reduced-motion:reduce){
    .field,.coach,.play.tutorial .coach,.devdrawer:not([hidden]),
    .minted .mb,.veil.show .bulletin .brow,.field .tlabel2.tin,
    .field .mhalo,
    /* the guided net's spotlight gives up its two travels and nothing else. the
       ping is a travel, so it goes — and it carries opacity 0 on the element,
       so what is left is the standing ring, which was always the mark that does
       the pointing. the leader's dashes stop marching and stay dashes. the
       scrim, the ring, the leader and the landing mark are all still there,
       still ink, still on exactly one neuron and one place to take it. a static
       spotlight is fine; no spotlight is not, because on this net it is the
       only thing telling a new player which mark the coach card means. */
    .field .tutping,.field .tutlead,
    .field .mnode.landed,.field .mnode.retraining,.field .mnode.settling{animation:none}
    .field.swap-out > svg,.field.swap-in > svg,
    .field.swap-out .netnum,.field.swap-in .netnum{animation:none;opacity:1;transform:none}
    .freerun,.clearsweep{display:none}
    .field .mnode.grabbed{transition:none}
    .descentbtn.running svg{animation:none;background:rgba(18,161,154,.2)}
    .live-dot,.coach-dots i.now{animation:none;opacity:.85}
    .veil,.veil.show,.veil > *,.veil.show > *{transform:none;transition-property:opacity,visibility}
    /* the card still arrives, holds and fades — a cross-fade is not motion, and
       this is the only channel several of these facts have. what goes is the
       7px lift and the rows printing themselves in one at a time. clearing
       `transform` outright is safe now that the card sits in a corner rather
       than being centred by one — and the phone's half-height centring is on
       the `translate` property, which this does not touch. */
    .say,.say.on{transform:none;
      transition-property:opacity,visibility}
    .say .rowin{animation:none}
    .help:active,.act:active,.wbtn:active,.intro-start:active,
    .tval:hover,.tval:active{transform:none}
    .toast,.toast.show{transform:translateX(-50%);transition:opacity var(--t-ui)}
  }
</style>
</head>
<body>
<div class="sheet">

  <div class="hud">
  <header class="hud-head">
    <div class="mark">
      <div>
        <!-- the rule lives inside the heading because it is part of the word,
             not a thing beside it: it takes the word's measure for free and it
             cannot be left behind when the word resizes. -->
        <h1>features<i class="wordrule" aria-hidden="true"></i></h1>
        <!-- not "a game about features" any more: under this word that says one
             thing twice. the two lines are the object and the daily shape. -->
      </div>
    </div>
    <div class="instruments">
      <div class="unitrow">
        <!-- figure first, then the words it is a figure OF, then the bar. the
             figure and the words are one line and stand at opposite ends of the
             bay, so the bay is spoken for at both edges however wide it gets —
             see .unit-top. -->
        <div class="unit unit-cross">
          <div class="unit-top">
            <b class="unit-fig" id="crossnum">0</b>
            <span class="unit-name"><span class="unit-label">crossings left</span></span>
          </div>
          <div class="track crossbar" id="crossbar"><span class="run" id="threadrow"></span></div>
        </div>
        <div class="unit unit-par">
          <div class="unit-top">
            <b class="unit-fig" id="parnum">0</b>
            <!-- "turns" is what is counted and "to perfect" is which line it is
                 counted against, so they are one phrase and travel together -->
            <span class="unit-name"><span class="unit-label">turns</span><em class="unit-of" id="parof">to par</em></span>
          </div>
          <div class="track parmeter" id="parmeter" aria-label="turns against par"><span class="run" id="parrow"></span></div>
        </div>
        <div class="unit unit-set">
          <div class="unit-top">
            <b class="unit-fig" id="setnum">0</b>
            <span class="unit-name"><span class="unit-label" id="setlabel">today's set</span></span>
          </div>
          <div class="track setmeter" id="setmeter" aria-label="today's set"></div>
        </div>
      </div>
      <!-- every piece of game feedback lands here, so it has to be announced.
           it is clipped, not hidden, and it costs the head no height. -->
      <span class="msg" id="msg" role="status" aria-live="polite"></span>
    </div>
    <div class="btns">
      <!-- one button, because there is one screen: the collection and the record
           were two readings of the same history and are now one list. it is also
           the fourth button the phone head never had 48px spare for. -->
      <button class="help" id="histbtn" title="the record · every day you have played" aria-label="the record">
        <svg class="recglyph" viewBox="0 0 24 24" aria-hidden="true">
          <g fill="currentColor"><rect x="3" y="5" width="4" height="4"/><rect x="3" y="11" width="4" height="4"/><rect x="3" y="17" width="4" height="4"/></g>
          <g fill="none" stroke="currentColor" stroke-width="1.6"><path d="M10 7h11M10 13h11M10 19h11"/></g>
        </svg>
        <span class="caltext" id="statusdate"></span>
      </button>
      <button class="help" id="themebtn" title="ground" aria-label="ground">

<div class="toast" id="toast">copied</div>

<script>
/* ================= feature catalogue ================= */

const MARKGRID=`<g fill="none" stroke="var(--mark,#fff)" stroke-width="1" opacity=".16"><path d="M12 0V96M24 0V96M36 0V96M48 0V96M60 0V96M72 0V96M84 0V96M0 12H96M0 24H96M0 36H96M0 48H96M0 60H96M0 72H96M0 84H96"/></g>`;
/* ---- the sixteen signs ----
   96x96, single colour, horizontals / verticals / 45° diagonals / true circular
   arcs only, after Aicher's Munich 1972 system.

   the FIRST shape in `p` is the primary path: the sign proper, and the one
   `featureShape` wears down into the settle-polyline when the feature comes
   free. everything after it is a hole or a counterform (a window, a gutter, a
   midrib) drawn in `--emblem`, the plate colour, so it cuts rather than adds.
   that ordering is load-bearing — put a counterform first and the thread will
   settle into a window.

   so each primary is a closed outline of six to twelve corners that still reads
   when it is worn down to five points. that rules out bands: the outline of a
   stroked zigzag runs out along the top and back along the bottom, and reduces
   to a smear whichever way you sample it. the waves, the bars and the brackets
   are all solids here for that reason, not decoration. */
const FEATURES={
  // a lumpy cloud, and the rain as separate strokes below. flat-based it
  // reduced to the same low ridge as mountains; a closed blob does not
  weather:{c:'--hellblau',e:'🟦',p:`<path d="M16 56A16 16 0 0 1 34 32A18 18 0 0 1 64 28A16 16 0 0 1 82 48A70 70 0 0 1 16 56Z"/><path d="M26 70H36L18 88H8ZM52 70H62L44 88H34ZM78 70H88L70 88H60Z"/>`},
  // a bird in profile. drawn head-on with swept wings it was an arrow, every time
  birds:{c:'--gruen',e:'🟩',p:`<path d="M4 40L14 30A10 10 0 0 1 32 26A26 26 0 0 1 64 42L90 16V34L66 58A40 40 0 0 1 4 40Z"/><path d="M28 40H56L38 58L28 48Z" fill="var(--emblem)"/><circle cx="21" cy="33" r="2.5" fill="var(--emblem)"/>`},
  // a hammer laid on the diagonal — upright it read as a signpost
  tools:{c:'--tuerkis',e:'⬛',p:`<path d="M12 36L36 12L46 22L38 30L78 70L70 78L30 38L22 46Z"/>`},
  // an eighth note. the head is a diamond so head, stem and flag are one path
  music:{c:'--violett',e:'🟪',p:`<path d="M48 14H58L80 36V50L58 28V70L40 88L22 70L40 52L48 60Z"/>`},
  // half a slice, cut side up, rind left standing between the segments
  citrus:{c:'--orange',e:'🟧',p:`<path d="M12 44H84A36 36 0 0 1 12 44Z"/><g fill="var(--emblem)"><path d="M44 44H52V86H44Z"/><path d="M44 44H52V86H44Z" transform="rotate(45 48 44)"/><path d="M44 44H52V86H44Z" transform="rotate(-45 48 44)"/><path d="M38 44H58A10 10 0 0 1 38 44Z"/></g>`},
  chess:{c:'--violett',e:'🟪',p:`<path d="M28 16H42V28H54V16H68V70L84 86H12L28 70Z"/>`},
  // sea, not two thin bands: a solid with a wave for a top edge. the crest is
  // an arc, not a peak — sharp peaks are what mountains is, and it showed
  water:{c:'--hellblau',e:'🟦',p:`<path d="M8 62A20 20 0 0 1 48 62A20 20 0 0 0 88 62V86H8Z"/><path d="M8 34A20 20 0 0 1 48 34A20 20 0 0 0 88 34V44A20 20 0 0 1 48 44A20 20 0 0 0 8 44Z"/>`},
  // one path, two arcs: a crescent rather than a disc with a disc cut out of it
  night:{c:'--dunkelblau',e:'🟦',p:`<path d="M60 14A36 36 0 1 0 60 82A35 35 0 0 1 60 14Z"/><path d="M76 62L84 70L76 78L68 70Z"/>`},
  fire:{c:'--orange',e:'🟧',p:`<path d="M34 8L74 48A26 26 0 0 1 22 48L34 36Z"/><path d="M48 40L58 50A10 10 0 0 1 38 50Z" fill="var(--emblem)"/>`},
  mountains:{c:'--gruen',e:'🟩',p:`<path d="M8 84L32 60L44 72L64 52L88 76V84Z"/><path d="M32 60L40 68H24ZM64 52L72 60H56Z" fill="var(--emblem)"/>`},
  // two of the same thing, one behind the other — the sign for a doubled letter
  doubled:{c:'--gelb',e:'🟨',p:`<path d="M18 18H60V36H78V78H36V60H18Z"/><path d="M30 30H60V36H36V60H30Z" fill="var(--emblem)"/>`},
  // three bars as one rising step, the gaps cut back in above a kept baseline
  numbers:{c:'--tuerkis',e:'🟩',p:`<path d="M10 86V64H32V46H54V22H78V86Z"/><g fill="var(--emblem)"><rect x="29" y="46" width="6" height="34"/><rect x="51" y="22" width="6" height="58"/></g>`},
  // a leaf on the diagonal, midrib cut out of it
  plants:{c:'--gruen',e:'🟩',p:`<path d="M16 80A64 64 0 0 1 80 16A64 64 0 0 1 16 80Z"/><path d="M28 72L72 28L76 32L32 76Z" fill="var(--emblem)"/>`},
  animals:{c:'--violett',e:'⬛',p:`<path d="M10 26H26L38 38H80L88 46V84H76V58H48V84H36V50H22L10 38Z"/><circle cx="19" cy="31" r="3" fill="var(--emblem)"/>`},
  // a skyline: gable and tower as one outline, windows cut out of it
  buildings:{c:'--dunkelblau',e:'🟦',p:`<path d="M12 88V52L34 30L56 52V40L70 26L84 40V88Z"/><g fill="var(--emblem)"><rect x="26" y="58" width="12" height="14"/><rect x="62" y="52" width="10" height="12"/><rect x="42" y="70" width="10" height="18"/></g>`},
  // an arrow with the tail notched out of it, and the speed left behind it
  motion:{c:'--gelb',e:'🟨',p:`<path d="M28 36H56V20L84 48L56 76V60H28L40 48Z"/><path d="M6 38H22V44H6ZM6 52H22V58H6Z"/>`}
};
const FKEYS=Object.keys(FEATURES);

/* ================= generator versions =================
   a day is generated by the newest version whose `from` is on or before it.
   a version is FROZEN the moment it ships: never edit one, add another. this
   is the only reason a day from months ago still regenerates identically —
   and it is why `feats` is spelled out here rather than read from FKEYS.

   feature choice splices from a shrinking pool, so the pool's LENGTH is a
   hidden seed input: adding a seventeenth feature to FEATURES silently
   rewrote the cast of every day ever played (verified — every date tested
   changed). pinning the list per version is what stops that.

   adding a feature, or changing geometry or par, means appending a version
   with `from` set to the day it ships. everything before that date is
   untouched. */
/*@gen*/
const GEN_VERSIONS=[
  { v:1, from:'2000-01-01', par:'recipe', layout:'scatter',
    feats:['weather','birds','tools','music','citrus','chess','water','night',
           'fire','mountains','doubled','numbers','plants','animals','buildings','motion'] },
  { v:2, from:'2026-08-11', par:'lanes', layout:'scatter',
    feats:['weather','birds','tools','music','citrus','chess','water','night',
           'fire','mountains','doubled','numbers','plants','animals','buildings','motion'] },
  /* v3 draws the net as a net: neurons in columns, threads running left to
     right through them, a crossing being two threads swapping order between
     adjacent layers. the scatter it replaces never looked like the thing the
     game is about. it survives as the time-trial generator, where an endless
     unstructured tangle is the point. */
  { v:3, from:'2026-08-12', par:'lanes', layout:'layered',
    feats:['weather','birds','tools','music','citrus','chess','water','night',
           'fire','mountains','doubled','numbers','plants','animals','buildings','motion'] },
  /* v4 stops drawing the same picture ten times a day. one layered stack was
     honest but it was also the whole visual vocabulary, and a daily game shows
     you its vocabulary every morning forever. a net now picks a layout family —
     stack, hourglass, residual, lattice, fan, band, ring — and the shape it
     picks is a pure function of the date, so the ten are varied and two days
     running are a different set. see the layout families block for how a family
     proves its own solvability and where par comes from; it changes both, so it
     changes the generator, so it is a version rather than an edit.
     `from` is the day after v3 shipped: today's boards belong to today. */
  { v:4, from:'2026-08-13', par:'family', layout:'families',
    feats:['weather','birds','tools','music','citrus','chess','water','night',
           'fire','mountains','doubled','numbers','plants','animals','buildings','motion'] },
  /* v5 carries RULES, not just a cast. the offline solver's report pointed out
     that the split angle, the ramp and the pin rule all sat outside this table
     while deciding every board — so fixing one of them would have silently
     rewritten every day ever played, which is the exact failure the table
     exists to prevent. anything a coordinate depends on belongs here now, and
     genRules() supplies the pre-v5 defaults so the old days keep the old
     behaviour without an entry having to say so.
       split:'vertical'  the halves part up and down, never sideways
       merge:'widen'     keep looking for a pair rather than drop a superposition
       pinFill:true      a pin lands somewhere rather than being quietly skipped
       parMode:'greedy'  par is the cheapest walkthrough found, not the first one */
  { v:5, from:'2026-08-14', par:'family', layout:'families',
    split:'vertical', merge:'widen', pinFill:true, parMode:'greedy',
    feats:['weather','birds','tools','music','citrus','chess','water','night',
           'fire','mountains','doubled','numbers','plants','animals','buildings','motion'] },
  /* v6 changes no geometry at all — the boards are v5's, seed for seed. it
     changes only what they are scored against.
       parSlack:3  clean sits three turns above the cheapest route rather than
                   on top of it. v5 printed the route itself, which set the
                   clean line at perfection on 71% of nets. */
  { v:6, from:'2026-08-15', par:'family', layout:'families',
    split:'vertical', merge:'widen', pinFill:true, parMode:'greedy', parSlack:3,
    feats:['weather','birds','tools','music','citrus','chess','water','night',
           'fire','mountains','doubled','numbers','plants','animals','buildings','motion'] },
  /* v7 changes where the two halves of a split LAND.
       splitPart:'clear'  the parting direction is chosen against the board
                          rather than fixed by the hash, and the pair is parted
                          about a midpoint pulled inside the plate so clamping
                          can never fold one half onto the other.
     up to v6 a split fired blind: the halves went out along the hashed angle
     whatever was standing there, and measured across 300 nets that put a NEW
     crossing on the board 50.4% of the time. the player pays a turn for that,
     and on the turn that would have finished the net it takes the win away —
     which is the complaint, in the owner's words: they should pop and free
     themselves. so a v7 split tries twelve directions, scores each on the
     board it would actually make, and takes the one that leaves the fewest
     crossings — preferring, among equals, one that lets a feature come free.
     the hashed angle is still tried FIRST, so where it was already clean the
     board is v6's exactly and only the genuinely unfair splits move.
     this is a generator rule and it belongs in this table for the reason the
     v5 note gives: it moves crossings, so it moves par, so it would have
     rewritten every day ever played had it been an edit. */
  { v:7, from:'2026-08-16', par:'family', layout:'families',
    split:'vertical', merge:'widen', pinFill:true, parMode:'greedy', parSlack:3,
    splitPart:'clear',
    feats:['weather','birds','tools','music','citrus','chess','water','night',
           'fire','mountains','doubled','numbers','plants','animals','buildings','motion'] }
];
/* the rules in force for the net being built. a module-level object rather than
   an argument threaded through nine functions, because splitNode is called by
   the player's hand long after buildNet has returned and has no day to read. */
const GEN_RULES={split:'angled', merge:'tight', pinFill:false, parMode:'walk', parSlack:0,
                 splitPart:'fixed'};
function genRules(g){
  return {split:g.split||'angled', merge:g.merge||'tight',
          pinFill:!!g.pinFill, parMode:g.parMode||'walk', parSlack:g.parSlack||0,
          splitPart:g.splitPart||'fixed'};
}
function genFor(day){
  let g=GEN_VERSIONS[0];
  for(const x of GEN_VERSIONS) if(x.from<=day) g=x;
  return g;
}
/*@endgen*/
const PERF_X=Array.from({length:9},(_,i)=>`<circle cx="${8+i*13}" cy="4" r="3.6"/><circle cx="${8+i*13}" cy="130" r="3.6"/>`).join('');
const PERF_Y=Array.from({length:9},(_,i)=>`<circle cx="4" cy="${12+i*13}" r="3.6"/><circle cx="116" cy="${12+i*13}" r="3.6"/>`).join('');
/* a white mark vanishes on the lighter grounds — gelb measures 1.68:1 against
   white and orange 2.81, well under the 3:1 a graphical object needs. pick the
   mark from the ground's own luminance instead of assuming white, so every
   emblem clears the bar whichever square it happens to sit on. */
const lum=hex=>{
  const m=hex.replace('#','').match(/../g).map(h=>parseInt(h,16)/255)
    .map(c=>c<=.03928?c/12.92:Math.pow((c+.055)/1.055,2.4));
  return .2126*m[0]+.7152*m[1]+.0722*m[2];
};
/* the switch point is not a taste call, it is where the two candidate marks
   measure the same against the plate: (L+.05)/.0556 == 1.05/(L+.05), which is
   L = .192, not the .30 that was here. the difference is not academic — green
   and turquoise sit at .275 and .279, so both were taking a white mark worth
   3.2:1 when the dark one was worth 5.9:1. five of the sixteen emblems. */
const markOn=v=>lum(cssv(v))>0.192?'#0E1214':'#ffffff';
/* the band under the emblem says which tier the stamp was earned at, and it
   said it in colour alone — so wherever the band and the plate above it are the
   same colour it said nothing, and the stamp read as one flat block. that is
   two features per rung on the current ladder: tools and numbers are turquoise
   like `clean`, music, chess and animals are violet like `done`, doubled and
   motion are yellow like `perfect`. give the band a count as well. three cells
   clean, two done, one over — which survives a plate of its own colour, a
   colour-blind reader, and a greyscale share card.
   note what the count does NOT do: `perfect` has no entry and falls to one cell,
   the same as `over`. that predates this ladder and is left alone here, because
   TIERCELLS is read by every stamp in the game and this change is the ladder's
   colours. it is a real gap and it is worth closing on its own. */
const TIERCELLS={clean:3, done:2, par:2, over:1};
function featureStamp(k,tier,locked){
  const d=FEATURES[k], tierCol=tier?TIERCOL[tier]:'--rule';
  const mk=locked?markOn('--rule'):markOn(d.c);
  const mark=locked
    ? `<g fill="none" stroke="${mk}" stroke-width="2" opacity=".78"><circle cx="48" cy="48" r="21"/><path d="M48 18V78M18 48H78M27 27L69 69M69 27L27 69"/></g>`
    : `<g fill="${mk}">${d.p}</g>`;
  const cells=tier?(TIERCELLS[tier]||1):1;
  const cw=(96-(cells-1)*5)/cells;
  const band=Array.from({length:cells},(_,i)=>
    `<rect x="${(12+i*(cw+5)).toFixed(1)}" y="112" width="${cw.toFixed(1)}" height="8" fill="var(--tier)"/>`).join('');
  const cancel=locked?'':`<g fill="none" stroke="${mk}" stroke-width="2" opacity=".45"><circle cx="88" cy="34" r="17"/><path d="M72 28H108M72 34H108M72 40H108"/></g>`;
  return `<svg class="feature-stamp" viewBox="0 0 120 134" role="img" aria-label="${locked?'unidentified feature':k+' feature · '+tier}" style="--emblem:var(${locked?'--rule':d.c});--tier:var(${tierCol})">
    <rect x="4" y="4" width="112" height="126" fill="var(--stamp)" stroke="var(--stamp-edge)"/>
    <g fill="var(--surface)">${PERF_X}${PERF_Y}</g>
    <rect x="12" y="12" width="96" height="96" fill="var(--emblem)"/>
    <g transform="translate(12 12)" style="--mark:${mk}">${MARKGRID}${mark}</g>
    ${cancel}${band}
    <rect x="12" y="124" width="42" height="2" fill="var(--stamp-edge)"/><rect x="59" y="124" width="49" height="2" fill="var(--stamp-edge)"/>
  </svg>`;
}
const SUN=(col)=>`<svg viewBox="0 0 44 44"><g stroke="${col}" stroke-width="2.4">`+
  Array.from({length:14},(_,i)=>{const a=i*(360/14)*Math.PI/180;
    return `<line x1="${(22+Math.cos(a)*7).toFixed(1)}" y1="${(22+Math.sin(a)*7).toFixed(1)}" x2="${(22+Math.cos(a+.22)*19).toFixed(1)}" y2="${(22+Math.sin(a+.22)*19).toFixed(1)}"/>`;
  }).join('')+`</g></svg>`;

/* ================= run structure ================= */

/* the ladder, top to bottom: perfect (the solver's true minimum), clean (inside
   par), done (finished). `par` and `over` are dead keys kept only so badges
   minted under older schemes still render — nothing awards them now.
   silver is deliberately not on the live ladder: the day cannot be failed, so
   the bottom rung is a finish rather than a demerit, and a colour says that
   where a grey would not. */
/* ONE ladder, and both instruments draw from it: the day's strip colours each
   net by the rung it minted, and the turns bay colours its three budgets with
   the same three, in the same order. yellow is the rung you are chasing while
   the bar is yellow; turquoise is the rung you are chasing while it is
   turquoise.
   orange is not on it and will not be. it was `clean` — the commonest good
   outcome in the game and therefore the colour most of the strip was made of —
   and it reads as a warning rather than as a result. it stays a THREAD colour,
   which is a different job on a different surface. */
/* NO NEUTRAL IS A RUNG. `done` was silver, and silver put a grey next to the
   day-ahead grey: a net you FINISHED and a net you have NOT PLAYED were both
   neutrals, one shade apart, so the strip stopped answering how far through the
   day you are. every rung is a colour now and the neutral belongs to the day
   ahead alone — which is the reading the strip exists for.

   WHAT WAS CHOOSING THESE, AND NO LONGER IS. the ladder used to be gruen /
   hellblau / tuerkis, and that was not a preference either — it was the residue
   of one surface. the bulletin drew a tier strip on a saturated --dunkelblau
   plate, and against that plate nothing in the palette reaches 2:1: violett
   1.18, silver 1.08, gruen 1.67, tuerkis 1.69, hellblau 1.90, and dunkelblau
   itself 1.00. one card therefore ruled out most of the palette and left
   exactly the three signals that sit in the same corner of the wheel — so the
   ladder's three rungs were three near neighbours, by construction. the owner
   read it back the way it was built: turquoise too close, green and blue the
   same, not striking, no distinct edges.
   THE BULLETIN IS A SURFACE CARD NOW (see .bulletin), on --surface with a
   hairline and ink type, like every other card the game floats over the board.
   the plate is gone and so is the constraint, and the ladder is picked on
   distinctness instead of on what survived a blue plate.

   measured as CIE76 dE, worst rung pair, after simulating protanopia,
   deuteranopia and tritanopia — under about 18 is a confusion risk, the same bar
   THREADPAL is ordered against. ONE number per set, not the worse of two
   grounds, because the rungs are the same three values on both grounds now:
                                       normal   cvd
     gelb / gruen   / violett .......... 75.8   28.7
     gelb / tuerkis / violett .......... 65.2   25.1   <- this ladder
     gruen/ hellblau/ tuerkis .......... 38.4    5.4   <- what shipped before it
     gelb / hellblau/ violett .......... 37.9   14.8
   two things moved when the rungs went canonical, and the table is rescored
   rather than left standing. orange-bearing sets still score higher and are
   still not available: see above. and gelb/gruen now leads gelb/tuerkis, which
   it did not when this was picked — the argument then was that green collapses
   toward yellow under protanopia, and that was true of the BRONZE yellow paper
   used to draw. against canonical gelb it is not: green goes from 26.9 to 49.6
   on that floor and takes the lead.
   green is spoken for all the same. it is descent's colour, and descent must not
   be a rung — see .descentbtn, where owning turquoise while turquoise was `done`
   is the exact mistake that rule was written after. so the ladder stays where it
   is, on a number comfortably above the floor, and the reason is availability
   rather than distinctness, which is worth saying plainly rather than leaving a
   stale sum to imply otherwise. it is still 1.7x the shipped ladder in normal
   vision and over 4x under colour blindness.

   THE RUNGS ARE FIELDS, SO THEY ARE AICHER'S OWN COLOURS ON BOTH GROUNDS.
   this ladder shipped reading --sig-*, and on paper that turned it to mud: gelb
   #665207, a bronze; tuerkis #0E817C; violett #5F4E92. three dark desaturated
   bars in the masthead of a game whose wordmark, four pixels above them, draws
   the canonical set at full strength. the owner read it back as muted, and it
   was.
   the --sig-* set is the LINE set, and says so where it is declared: gelb goes
   to a bronze because a 3px thread at 1.68:1 on the board plate cannot be seen
   and because a lighter ochre collapses into the orange thread beside it under
   protanopia. every one of those arguments is about a STROKE. the ladder is
   never a stroke — the tracks, the card strips, the record's cells, the day
   row's tier bar and the stamp band are all solid fills — and gelb's own note
   already reserved the canonical value for exactly that: "untouched everywhere
   it is a FIELD, which is where Aicher put it on paper anyway".
   what changes, measured on the light ground:
                                        --sig-*      canonical
     worst rung pair, normal vision ...... 57.8         65.2
     worst rung pair, worst dichromacy ... 16.0         25.1
     greyscale L* of the three ........... 35.7/48.6/37.8  80.4/59.8/49.5
   read that last row twice. under --sig-* the light ladder is NOT MONOTONIC —
   `perfect` is DARKER than `done` — so the claim this ladder was chosen on,
   perfect being the loudest mark on both grounds, was true on the dark ground
   and false on paper by its own greyscale measure. canonical makes it true:
   worst greyscale pair 1.43 dark / 1.43 light, against 1.08 before and the old
   green-blue ladder's 1.00.

   contrast, as every rung is a graphical object on some ground:
                      board d  board l  track d  track l  share plate #0E1214
     gelb    perfect   10.32     1.61     8.09     1.10          11.20
     tuerkis clean      5.44     3.05     4.27     2.09           5.91
     violett done       3.80     4.37     2.98     2.99           4.13
   the light column is the price and it is stated rather than rounded away: gelb
   is 1.10:1 against the bare track. WCAG ratio is a text-legibility model and it
   is the wrong instrument for a boundary between two solid fields — what decides
   that is perceptual distance, and the same boundary is 22.5 dE taking the worst
   of normal vision and three dichromacies, against the 18.0 confusion floor this
   whole ladder was chosen at. the check that settles it is already on screen:
   the wordmark's flag has always drawn canonical gelb on --surface, at that
   identical 1.61:1, and it does not vanish — it is the brightest thing in the
   masthead.
   worst rung-against-bare-track, worst of four visions: 22.5 light, 30.7 dark.
   and the reading never rested on colour alone anyway — the height channel
   (CELLH, SHAREFILL) carries it in the record and on the share plate, and length
   carries it in the two bays. */
const TIERCOL={perfect:'--gelb', clean:'--tuerkis', done:'--violett', par:'--tuerkis', over:'--violett'};
/* and a net you have not played yet is THE BARE TRACK. not silver, which now
   collides with tuerkis; not the shade of silver mixed down towards the track
   that stood here, which measured 1.42 against the track it sits on and so was
   a hole pretending to be a material — on the dark ground you could not tell
   the two apart at all.
   this is the whole cluster's one vocabulary, applied here at last: on the
   crossings bay and on the turns bay a coloured length is what is live and the
   bare track behind it is what has gone. the strip is the same object read the
   other way round — the colour is what you have EARNED and the bare track is
   what the day has not reached yet. three bays, one material for absence, and
   the only difference between them is which direction the colour travels.
   what it gives up is a strip that opens looking full. it opens looking empty
   instead, because it is: at the first net of the day you have earned nothing,
   and a bar of grey asserting otherwise was the fourth material in a row that
   only needed three. */
const SETAHEAD='--rule';
/* CARDCOL was here, and it was this table: the canonical ladder, kept apart for
   the share card, which is the one thing the game makes that leaves the sharer's
   screen and therefore has to be the same card for two players on two different
   grounds. it held --gelb / --tuerkis / --violett, which is now what TIERCOL
   holds, so it was two identical tables with two different reasons written over
   them — canonical because the plate travels, canonical because a rung is a
   field — and the second reason covers every surface the first one did.
   one table, then. it would have to split again the day something draws a rung
   as a LINE on paper, because that is the one case --sig-* exists for; nothing
   does today, and a stroke would be the thing to reconsider rather than the

const TICKETDEFS=[
  {id:'first',  label:'first identification',   band:'--sig-hellblau'},
  {id:'depth3', label:'depth three',            band:'--sig-gruen'},
  {id:'depth5', label:'depth five',             band:'--sig-orange'},
