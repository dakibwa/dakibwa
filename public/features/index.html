/* ================= time trial: the net keeps training =================
   descent inverted. every few seconds the net nudges one neuron to a WORSE
   position, adding crossings. it speeds up as you go deeper. let the tangle
   reach the fail line and the net has out-trained you. */
const RETANGLE_BASE=7000, RETANGLE_FLOOR=2600;
let retangleTimer=null, retangleAt=0;
function retanglePeriod(){
  return Math.max(RETANGLE_FLOOR, RETANGLE_BASE - R().cleared.length*550);
}
function failLine(){ return Math.round(initialCross*2)+5 }
function retangleTick(){
  const r=R();
  if(!isTrial()||r.over||dragN||document.querySelector('.veil.show')||!threads.length) return;
  if(threads.every(t=>t.freed)) return;
  if(performance.now()<retangleAt) return;
  retangleAt=performance.now()+retanglePeriod();
  const base=countCross().total;
  // find a nudge that makes things worse — the mirror of descent
  const cand=members.filter(n=>!n.pinned&&!n.threads.every(t=>t.freed));
  if(!cand.length) return;
  // search wide: on a sparse net a short hop crosses nothing at all
  const spin=Math.floor(Math.random()*16);
  let worst=null;
  for(const rad of [80,150,230,320]){
    for(const n of cand){
      for(let a=0;a<16;a++){
        const th=((a+spin)%16)*Math.PI/8;
        const nx=clampX(n.x0+Math.cos(th)*rad);
        const ny=clampY(n.y0+Math.sin(th)*rad);
        const c=crossingsIfMoved(n,nx,ny,base);
        if(c>base&&(!worst||c>worst.c)) worst={n,nx,ny,c};
      }
    }
    if(worst) break;
  }
  if(!worst) return;
  worst.n.x0=worst.nx; worst.n.y0=worst.ny;
  /* depth is banked by clearNet but the tangle was never written, so reloading
     restored a pristine net and kept the depth — an unlimited undo in the one
     mode whose entire tension is that the net is winning. */
  R().positions[worst.n.idx]=[Math.round(worst.n.x0*10)/10,Math.round(worst.n.y0*10)/10];
  save();
  worst.n.el.classList.add('retraining');
  setTimeout(()=>worst.n.el.classList.remove('retraining'),900);
  countCross(); refresh(); renderHud();
  const now=countCross().total;
  if(now>=failLine()){ flashMsg('the net out-trained you',{cols:['--sig-violett'],big:true}); endRun(); }
  else flashMsg('the net is retraining',{cols:['--sig-violett']});
}
setInterval(retangleTick,400);

/* ================= progression ================= */

/* a net is scored against the two lines netTargets() knows, and there is no way
   to fail — everyone completes the day, and the question is how cleanly.
   two lines make three rungs: at or under the true optimum is perfect, inside
   par is clean, and finishing at all is done.

   this used to be two rungs, collapsed on purpose: par is a geometric estimate
   sitting 3 to 8 turns above the true optimum, so a competent player minted
   `clean` on about 90% of nets and the middle rung meant nothing. the third
   rung is back because the offline solver gives us a line that is not an
   estimate — and it is wired so that it can only appear where a real optimum
   does. with none, netTargets() stands optimum at par, the first branch cannot
   fire, and this returns exactly what the two-rung version returned. */
function tierFor(moves,par,assisted){
  const {optimum}=netTargets();
  const t = moves>par ? 'done' : (optimum<par && moves<=optimum) ? 'perfect' : 'clean';
  return (assisted && t!=='done') ? 'done' : t;   // descent caps a net at done
}
function award(id){
  const t=TICKETDEFS.find(x=>x.id===id);
  if(!t||store.collection.tickets.includes(id))return;
  store.collection.tickets.push(id);
  setTimeout(()=>toast('ticket earned · '+t.label),1500);
}
/* `x&&x.d||x` rather than `x.d||x`: the day list already renders around a row
   it cannot make sense of, and a writer that throws on the same row would take
   the whole game down over a save the record displays perfectly well. */
const isDay=(x,d)=>(x&&x.d||x)===d;
function recordDay(){
  const d=R().day, pd=store.collection.playedDays;
  if(!pd.some(x=>isDay(x,d))){
    // `back` marks a day filled in later rather than earned on the day. the
    // list keeps both, and shows them differently — a backfilled day counts
    // toward the record but never toward the streak, or the streak is
    // purchasable and stops meaning anything.
    pd.push({d,depth:0,back:isArchive()});
    if(!isArchive()){
      const y=dayAdd(today(),-1);
      store.meta.streak = (store.meta.lastPlayDay===y)?(store.meta.streak||0)+1:1;
      store.meta.lastPlayDay=d;
    }
    save();
  }
}
/* the day row is what the record screen reads back weeks later, so it carries
   the shape of the run — how deep, which features came free, the best tier of
   the day — not just a played / not-played flag. rows written by earlier
   prototypes are bare strings or {d,depth}; upgrade them in place rather than
   dropping a player's history on the floor */
const TIERRANK={over:0,done:1,par:1,clean:2,perfect:3};
function stampToday(depth,feats,tier){
  const d=R().day, pd=store.collection.playedDays;
  const i=pd.findIndex(x=>isDay(x,d));
  if(i<0) return;
  const row = (pd[i] && typeof pd[i]==='object') ? pd[i] : (pd[i]={d,depth:0});
  // a trial restarts at net 1, so writing depth unconditionally let one trial
  // net overwrite a daily run of six. the day keeps its best of each.
  if(isTrial()){
    row.trialDepth=Math.max(row.trialDepth||0,depth);
    if(!row.mode) row.mode='trial';
  } else {
    /* the day's score is turns against par and it needs BOTH halves written or
       it cannot be read back weeks later. these are the cleared nets' own two
       sums — exactly what the run-over card totals — rather than r.turns, which
       also carries skip penalties and the turns spent on a net still unfinished.
       they move together or not at all: a deeper run replaces them, an equal
       run replaces them only if it scored better, and a shallower one (a replay
       restarting at net one) leaves the pair it cannot beat alone. */
    const cl=R().cleared;
    const turns=cl.reduce((a,c)=>a+(c.moves||0),0);
    const par=cl.reduce((a,c)=>a+(c.par||0),0);
    const had=row.depth||0;
    if(depth>had || (depth===had && (row.turns==null || turns-par < row.turns-row.par))){
      row.turns=turns; row.par=par; row.moves=R().turns||0;
      /* the rung each of the ten minted, in order, one letter each — the record
         draws them as ten cells and there is nowhere else to read them from.
         it rides inside this guard with the turns/par pair on purpose: the three
         of them describe the SAME run, so a replay that cannot beat the pair must
         not be allowed to overwrite the tiers that earned it either.
         a string, not an array: it is ten characters against ten objects in a
         save that already carries a row a day forever, and tierFor mints exactly
         perfect / clean / done, whose initials do not collide. it is purely
         ADDITIVE — every row written before this has no `tiers` at all, nothing
         reads it without checking, and no existing field changes shape. */
      row.tiers=cl.map(c=>String(c.tier||'')[0]||'').join('');
    }
    row.depth=Math.max(had,depth);
    row.mode='daily';
  }
  if(feats&&feats.length) row.feats=[...new Set([...(row.feats||[]),...feats])];
  if(tier && (!row.best || TIERRANK[tier]>TIERRANK[row.best])) row.best=tier;
}
function clearNet(){
  const r=R(), tier=tierFor(r.netMoves,spec.par,r.assisted);
  const wasTutorial=inTutorial();
  const feats=threads.map(t=>t.key);
  /* one ladder, TIERRANK, shared with the day row. the local copy this replaces
     predated `done` and had no key for it, so `clean > done` compared 2 with
     undefined and a badge could never be upgraded. since the first net most
     players finish is over par, nearly every feature locked at `done` on day
     one — which quietly emptied "features at clean", the one metric on the
     welcome-back card with any runway left. */
  feats.forEach(k=>{
    const cur=store.collection.badges[k];
    if(!cur||TIERRANK[tier]>TIERRANK[cur.tier]) store.collection.badges[k]={tier,day:r.day};
  });
  r.cleared.push({feats,tier,moves:r.netMoves,par:spec.par,idx:r.netIndex,assisted:!!r.assisted});
  /* the set finishing is not a net finishing. advancing the index and wiping the
     board are how the game gets to the NEXT net, and after the tenth there is no
     next net — so doing them anyway generated an eleventh, drew it, and left the
     day card to be a modal over a tangle the player would never be allowed to
     touch. the day ends here instead: the index, the positions, the splits and
     the freed threads all stay on the net it was won on, so the plate keeps the
     ten emblems it just finished drawing and a reload rebuilds exactly that
     board rather than a fresh one. the day card then has somewhere to sit — see
     .boardcard — and nextNet is simply never reached, because nothing on that
     card asks for another net. */
  const setDone = !isTrial() && r.cleared.length>=POLICY.dailyNets;
  if(setDone) r.over=true;
  else { r.netIndex++; r.netMoves=0; r.positions={}; r.freed=[]; r.splitNodes=[]; r.assisted=false }
  resetDescent();
  const depth=r.cleared.length;
  if(isTrial()) store.meta.bestTrialDepth=Math.max(store.meta.bestTrialDepth||0,depth);
  else store.meta.bestDepth=Math.max(store.meta.bestDepth||0,depth);
  /* a net only clears once every thread is free, and a thread cannot free
     while it still shares a neuron — so reaching here means every pair this
     net superposed was found and split. */
  netPairs.forEach(p=>{ if(!store.collection.pairs[p]) store.collection.pairs[p]=r.day });
  stampToday(depth,feats,tier);
  award('first');
  if(tier==='clean')award('clean');
  if(depth>=3)award('depth3');
  if(depth>=5)award('depth5');
  if(spec.shared>0)award('super');
  if((store.meta.streak||0)>=7)award('week');
  if(wasTutorial){tutReach(3); endTutorial()}
  save();
  celebrateGauge();
  boardCleared();
  /* the masthead lags a net all through the cleared beat: the bays are written
     by renderHud, and nothing calls it between a net clearing and the next one
     being built. that was invisible while there was always a next net. the last
     net of the day has none, so `today's set 1` sat beside a card reading `day
     complete` until the page was reloaded — the game contradicting itself, in
     two places six inches apart. the flood the gauge just laid down survives
     this: setTension and renderThreads both hold the bar until buildNet clears
     `dataset.done`. */
  if(setDone) renderHud();
  /* the tenth net gets ONE card, not two. it used to print `net cleared ·
     continue →`, and the only thing continuing led to was the day card — two
     bulletins, in the same corner, for one moment, the first of them offering a
     net that no longer existed. the day card carries the net's own reading
     inside its totals, so it simply arrives instead, off the same beat. */
  const card = setDone ? showRunOver : (()=>showNetCleared(feats,tier,wasTutorial));
  /* under reduced motion the sign is already drawn the instant the thread frees
     and nothing is in flight, so there is nothing to hold FOR: the card keeps
     the 260 it always had and not one millisecond of the beat is scheduled. */
  if(reduceMotion) setTimeout(card,260);
  else holdCleared(card);
}
/* ---- the beat ----
   a net finishing is the best moment in this game and it was the one moment you
   were never shown. the last crossing goes, the thread pulls loose, names itself
   and eases into a drawing of its own sign — and the bulletin used to arrive at
   940ms, which is the same instant the longest of those signs lands. the solved
   board, every feature drawn as its own emblem, existed for about a frame before
   a card was drawn over it.
   so the card waits the gesture out and then holds still:
      ~940   the last sign lands. settleIntoShape starts at +320, staggers 26ms a
             neuron and runs 440, so a thread of n neurons is down at 320+26(n-1)
             +440 — stepped through at 882 for a five-neuron thread and 942 for a
             seven. 980 clears both, and would still clear a nine at 968: the card
             now waits for the sign the DEEP nets draw, not for the common one.
       980   the game stops talking. the feature's name card goes down under its
             own fade (--t-fade, 420ms) instead of being cut off mid-sentence by
             the bulletin landing on top of it, so the board is clear at 1400.
   1150-1370 the freed threads recede out of `justfreed` into their filed opacity
             — the last thing on the board that moves, and it finishes with the
             card's fade rather than after it.
   1400-1600 nothing moves at all. that stillness is the whole point.
   the beat goes here and not on the other side of the card. by the time you have
   pressed `continue →` you have said you are done looking; holding you after an
   explicit press is the exact failure the swap already avoids, and the 170ms the
   veil takes to fade would spend most of a beat there behind a blur anyway.
   and it is a beat, not a wait: any press or key lands the card immediately, the
   same way a press lands the net swap. the listeners are armed only once the
   signs are down — before that a press is still about the move you just made
   rather than about the board, and letting it through would spend the entire
   payoff on a stray finger. same floor, same reason, as sayNudge's own. */
const NET_QUIET=980;   // the last sign has landed and the board stops arriving
const NET_BEAT=620;    // 420 for the name card to clear, then 200 of dead still
let holdT=null, holdSkip=null;
function cancelHold(){
  if(!holdSkip) return;
  removeEventListener('pointerdown',holdSkip,true);
  removeEventListener('keydown',holdSkip,true);
  holdSkip=null; clearTimeout(holdT); holdT=null;
}
function holdCleared(show){
  const land=()=>{ if(!holdSkip) return; cancelHold(); show() };
  holdSkip=land;                      // so a net advanced mid-beat cancels through this
  holdT=setTimeout(()=>{
    // "you are back on the board; the game stops talking" — except here it is the
    // board itself that has become the thing worth reading, not a press
    sayNudge();
    const skip=e=>{ if(e&&e.type==='pointerdown') swallowNextDown=true; land() };
    holdSkip=skip;
    addEventListener('pointerdown',skip,true);
    addEventListener('keydown',skip,true);
    holdT=setTimeout(skip,NET_BEAT);
  },NET_QUIET);
}
/* the whole net coming clean gets the gesture the board never had: one bar
   crosses the plate, and the threads come up out of their ghosted state behind
   it. "all of this, finished" is not something a ring at a midpoint can say —
   which is why the same ring doing duty for a single thread, a single neuron
   and the entire net made all three feel like the same small event. */
function boardCleared(){
  const f=$('field');
  if(reduceMotion||!gFx){ f.classList.add('cleared'); return }
  const g=svgAdd('g',{class:'clearsweep'},gFx);
  const bar=(x,w,op,col)=>{
    const r=svgAdd('rect',{x,y:0,width:w,height:BH},g);
    r.setAttribute('fill',col); r.setAttribute('opacity',op);
  };
  bar(-104,104,'.07',cssv('--ink'));     // the wash it drags behind it
  bar(0,3,'.55',cssv('--sig-orange'));   // and the edge itself
  setTimeout(()=>f.classList.add('cleared'),170);
  setTimeout(()=>g.remove(),620);
}
/* between nets. the cleared net leaves and the next one arrives, and the card
   that stood between them leaves properly rather than being switched off. the
   board is only absent for the 190ms in the middle — and any press or key skips
   straight to the end, because by the tenth net of the day you know what a new
   net looks like and you want to be in it. */
let swapT=null, swapSkip=null;
function nextNet(){
  hideVeils();
  /* the beat can still be running when this is reached — `skip net` stays live
     while the cleared board is being held, and nothing else takes it down. the
     previous net's bulletin arriving over the net you have already moved on to
     is worse than never seeing it. */
  cancelHold();
  const f=$('field');
  if(swapSkip) swapSkip();            // a second press mid-swap simply lands it
  const land=()=>{
    if(!swapSkip) return;
    removeEventListener('pointerdown',swapSkip,true);
    removeEventListener('keydown',swapSkip,true);
    swapSkip=null; clearTimeout(swapT);
    f.classList.remove('swap-out','swap-in','cleared','dimthreads');
    buildNet(true); renderAll();
    if(!reduceMotion){
      f.classList.add('swap-in');
      swapT=setTimeout(()=>f.classList.remove('swap-in'),320);
    }
    /* not a feature and not a neuron, so not a feature's colour: the four the
       wordmark is made of. a new net is the game starting something, and this
       is the game's own mark. */
    flashMsg('net '+String(R().netIndex+1).padStart(3,'0')+' · '+spec.threads+' features, '+countCross().total+' crossings',
             {cols:FLAG});
  };
  swapSkip=land;
  if(reduceMotion){ land(); return }
  /* also called with no event, by the timeout and by a second nextNet landing
     the previous swap — so it cannot assume it was handed one. it used to
     throw there, which meant the 190ms timeout never landed and the next net
     only ever arrived if you happened to press something. */
  const skip=e=>{ if(e&&e.type==='pointerdown') swallowNextDown=true; land() };
  swapSkip=skip;
  f.classList.add('swap-out');
  addEventListener('pointerdown',skip,true);
  addEventListener('keydown',skip,true);
  swapT=setTimeout(skip,190);
}
function endRun(){
  const r=R(); if(r.over)return;
  r.over=true; save();
  setTimeout(showRunOver,600);
}

/* ================= bulletins ================= */

/* the ground was fixed at dunkelblau, because it was the only palette colour
   that carried white body type (5.39:1 — gelb managed 1.68, which was a blank
   card every seventh net) and because a card that is a plate has to be a plate
   of SOMETHING. it is not a plate any more: see .bulletin. it takes --surface
   like the two other cards the game floats over the board, and the run's colour
   stays where it was already the more useful of the two — the strip, where it
   names the tier this net minted at.
   the strip reads TIERCOL, which is one table now and canonical on either
   ground. it used to read the ground-adapted --sig-* here, on the argument that
   canonical gelb would be "a 1.61:1 band that vanished into the card" — and the
   band that argument describes is the wordmark's own flag, which draws canonical
   gelb on --surface at that exact ratio and is the loudest thing in the
   masthead. what it actually bought was a bronze strip on the card announcing
   the best result in the game. see TIERCOL for the measurements. */
/* the note and the ray dial are optional now, and both are off on the cleared
   card. a note that is true of every net after every net is not a reading, and
   the dial is decoration that needs 34px plus 46px of clearance on the note it
   hangs off — which a card tucked into the corner of the board does not have to
   spend. the day card is unchanged: it keeps both. */
function bulletinHTML(o){
  return `<div class="bstrip" style="background:var(${o.strip||'--tuerkis'})"></div>
  <div class="bhead"><div><h2>${o.title}</h2><div class="bsub">${o.sub}</div></div><div class="bnum">${o.num}</div></div>
  <div class="brules">${o.rows.map((r,i)=>`<div class="brow" style="--i:${i}"><span>${r[0]}</span><b>${r[1]}</b></div>`).join('')}</div>
  <div class="bbody">${o.body||''}${o.note?`<div class="bnote">${o.note}</div>`:''}${o.sun===false?'':`<div class="bsun">${SUN('var(--silver)')}</div>`}</div>
  <div class="bactions">${o.actions}</div>`;
}
function showNetCleared(feats,tier,wasTutorial){
  const r=R();
  const last=r.cleared[r.cleared.length-1];
  // the card is shown on a timer, and the run it describes can be gone by then
  // — a new run, an archive day, a trial. it has nothing to say about a run
  // that no longer exists.
  if(!last) return;
  const strengthOf=k=>{const t=threads.find(x=>x.key===k);return t?t.strength:2};
  /* the strength tally under each label went with the rest. three block glyphs
     with no key anywhere on the card read as an artefact rather than a reading,
     and the board behind is already drawing strength as the width of the line. */
  const mint=`<div class="minted">${feats.map((k,i)=>{
    const b=store.collection.badges[k];
    return `<div class="mb" style="--i:${i}">${featureStamp(k,b.tier,false)}<span>${k}</span></div>`;
  }).join('')}</div>`;
  const cleanN=r.cleared.filter(c=>TIERRANK[c.tier]>=TIERRANK.clean).length;
  // the cut readings, kept for the reader — see .bquiet
  const quiet=`<p class="bquiet">${feats.length} features freed: `+
    `${feats.map(k=>k+' '+['','faint','clear','dominant'][strengthOf(k)]).join(', ')}. `+
    `${cleanN} of ${r.cleared.length} clean so far. ${r.turns||0} turns today.</p>`;
  $('netbulletin').innerHTML=bulletinHTML({
    strip:TIERCOL[tier],
    title:wasTutorial?'you untangled it':'net cleared',
    /* the tier IS the score and the rules card teaches the ladder, so this line
       is one word. it used to gloss each rung — "clean · within par" — which is
       the rung said twice, and the gloss for `done` ("over par") was the same
       fact as the turns row directly under it. an assisted net keeps its second
       clause: descent is not something the tier name can tell you, and it is the
       reason this one could not mint above done. */
    sub:last.assisted?'done · settled with descent':tier,
    num:String(r.netIndex).padStart(2,'0'),
    /* one row. what actually differs between one cleared net and the next is the
       numeral, the tier, the turns against par, and which features came free —
       and three of those four are already drawn above and below this. what went:
       `features freed`, a count of the stamps immediately beneath it; and
       `clean so far` and `turns today`, which are DAY readings on a card about a
       single net. the masthead carries the day while you play it and the record
       holds it afterwards; this card is the net. */
    rows:[['turns',last.moves+' / '+last.par]],
    body:mint+quiet,
    /* the note earns its place only when it has something to say once. the
       tutorial's is the game explaining what it is about to become, and the
       assisted one names a consequence you cannot see anywhere on the board. the
       ordinary one said "minted into your collection" above the stamps that ARE
       the minting, then "the next net is deeper", which is true of every net
       after every net forever. */
    note:wasTutorial
      ? 'that is the whole game. from here the nets deepen — longer threads, then a third feature, then neurons shared between two features at once.'
      : (last.assisted ? 'untangle the next one unaided for a clean badge.' : ''),
    sun:false,
    actions:`<button class="wbtn solid" id="contbtn">continue →</button><button class="wbtn" id="stopbtn">stop for today</button>`
  });
  showVeil('netveil');
  $('contbtn').onclick=nextNet;
  $('stopbtn').onclick=()=>{pauseRun();hideVeils();setTimeout(showRunOver,150)};
}
function showRunOver(){
  const r=R(), depth=r.cleared.length;
  const feats=[...new Set(r.cleared.flatMap(c=>c.feats))];
  /* the emoji strip that used to be built here — and handed to copyShare as the
     text share — is gone. it painted perfect 🟨 against a ladder whose perfect
     is green, and there is no honest emoji for the silver rung at all. the
     share now reads the run itself; see SHAREBLOCK. */
  const cleanN=r.cleared.filter(c=>TIERRANK[c.tier]>=TIERRANK.clean).length;
  const turns=r.cleared.reduce((a,c)=>a+c.moves,0);
  const parTot=r.cleared.reduce((a,c)=>a+c.par,0);
  const trial=isTrial();
  $('runbulletin').innerHTML=bulletinHTML({
    /* the strip took its colour from DEPTH — orange at five nets or more — and
       both halves of that are now wrong. orange is no longer a tier colour at
       all, and depth is ten for everyone who finishes, so the band that crowns
       the day was the same band for every completed day ever played.
       it takes the ladder instead, off the one reading the game is scored on:
       under par, level with it, past it — one TIERCOL, canonical on either
       ground, the same rung this day would post on a share plate.
       the two rows that are NOT a scored day are the two that were wrong here.
       a day left short said `done`, which is the comment's own "stays neutral"
       drawn in the bottom rung — a set you put down and a set you finished over
       par came out the same colour. and a trial said violett, which used to be
       nobody's and is now the bottom rung itself. both take a colour that cannot
       be a rung: silver for a day that was never scored, dunkelblau for a trial,
       which is not a day at all and is the one thing here still worth a plate
       colour of its own. */
    strip: trial ? '--sig-dunkelblau'
         : depth < POLICY.dailyNets ? '--silver'
         : (turns-parTot) < 0 ? TIERCOL.perfect
         : (turns-parTot) === 0 ? TIERCOL.clean
         : TIERCOL.done,
    title:trial?'out-trained':(depth>=POLICY.dailyNets?'day complete':'day set aside'),
    sub:trial?'time trial · the net kept learning'
        :`${cleanN} of ${depth} clean · ${turns} turns against par ${parTot}`,
    num:String(depth).padStart(2,'0'),
    /* four rows became one, the same cut and for the same reason the net card
       took: a card in the corner of a board prints the reading you cannot get
       anywhere else and stops. `today's set 10 / 10` is the title and the
       numeral, six inches apart on the same line. `clean 7 of 10` is the first
       half of the sub directly above it. `day streak` is in the masthead, which
       is still on screen — that is the whole point of the card being here rather
       than over it. what is left is the score the day is played for.
       a trial genuinely is a descent and depth is its whole score, so it keeps
       that: how deep you went, against how deep you have ever gone. `features
       named` goes for the reason the net card's did — it is a count of the
       stamps in the next block down. */
    rows:trial
      ? [['depth reached',depth+' nets'],['best time trial',store.meta.bestTrialDepth||depth]]
      : [['against par',fmtScore(turns-parTot)+' · '+turns+' of '+parTot]],
    /* ten, not eight. the stamps stepped down to 58px with the rest of the card
       and five of them now fit a row, so eight drew a five and a ragged three
       with a hole beside it — the exact break the net card's own sizing note is
       about. two full rows say more and cost the same height, and a finished day
       frees about fourteen of the sixteen, so there is always more to show. */
    body:(feats.length?`<div class="minted">${feats.slice(0,10).map((k,i)=>{
      const b=store.collection.badges[k]||{tier:'over'};
      return `<div class="mb" style="--i:${i}">${featureStamp(k,b.tier,false)}<span>${k}</span></div>`;
    }).join('')}</div>`:'')
    // the cut rows, kept for the reader — see .bquiet
    +`<p class="bquiet">${trial?`${feats.length} features named.`
        :`today's set ${depth} of ${POLICY.dailyNets}. ${cleanN} of ${depth} clean. ${feats.length} features named.`} `
      +`day streak ${store.meta.streak||1}.</p>`,
    note:trial
      ? 'the net re-tangled faster than you could separate it. it gets quicker the deeper you go.'
      : (depth>=POLICY.dailyNets
          ? 'today is done. the set resets at midnight.'
          : 'the rest of today\'s set is still there when you are.'),
    /* the ray dial goes for the reason the net card's did: it wants 34px of
       itself plus 46px of clearance on the note it hangs off, and a card that
       has stepped down to a 324px measure is spending a quarter of the line on
       a watermark. it is still on the share plate, which is the surface that
       has room for it. */
    sun:false,
    /* an unfinished set gets its way back, and it leads: it is the thing the
       note directly above promises is still there. */
    actions:(canResume()?`<button class="wbtn solid" id="resumebtn">${store.parked?'back to today\'s set':'resume today\'s set'} →</button>`:'')+
            `<button class="wbtn${canResume()?'':' solid'}" id="sharebtn">share</button>`+
            `<button class="wbtn" id="recordbtn2">the record</button>`+
            (canStartAnotherRun()?`<button class="wbtn" id="againbtn">${trial?'daily run':'run again'} →</button>`:'')+
            `<button class="wbtn" id="trialbtn">${trial?'trial again':'time trial'} ⏱</button>`
  });
  showVeil('runveil');
  $('sharebtn').onclick=()=>copyShare();
  $('recordbtn2').onclick=()=>{hideVeils();openRecord()};
  $('trialbtn').onclick=()=>startTrialRun();
  if($('resumebtn')) $('resumebtn').onclick=()=>{store.parked?resumeParked():resumeRun()};
  if($('againbtn')) $('againbtn').onclick=()=>startAnotherRun();
}
function hideVeils(){document.querySelectorAll('.veil').forEach(v=>v.classList.remove('show'))}

/* ================= the record ================= */

/* a feature at icon size: the emblem without the stamp frame or the perforation,
   both of which turn to mud below about thirty pixels */
function featIcon(k){
  const d=FEATURES[k]; if(!d) return '';
  return `<svg class="rfeat" viewBox="0 0 96 96" role="img" aria-label="${k}" style="--emblem:var(${d.c})">
    <rect width="96" height="96" fill="var(--emblem)"/><g fill="${markOn(d.c)}">${d.p}</g></svg>`;
}
const MONTHS=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
const WDAYS=['sun','mon','tue','wed','thu','fri','sat'];
/* read off the iso string through a LOCAL midnight: `new Date('2026-08-12')`
   parses as utc midnight, so .getDate() named the day before for anyone west of
   it. the weekday earns its place in a list you read down a column — it is how
   you find the saturday you missed without counting rows. */
function dayLabel(iso){
  const d=new Date(iso+'T00:00:00');
  const yr=d.getFullYear()!==new Date().getFullYear()?" '"+String(d.getFullYear()).slice(2):'';
  return `${WDAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}${yr}`;
}
/* four prototypes have written playedDays now: bare iso strings, {d,depth}, the
   row carrying feats / best / mode / moves, and that row plus `tiers`. every
   read normalises instead of migrating, so an old save renders and nothing in it
   is dropped — a legacy row simply has nothing to say beyond having happened.
   stampToday and recordDay do the upgrade in place, the next time that day is
   played. NOTHING is backfilled here, and `tiers` in particular must not be:
   which rung each of a day's ten nets minted is not derivable from a row that
   never stored it, and inventing ten cells from `best` or from turns-against-par
   would be drawing a day that did not happen. a row without it draws no cells at
   all, which reads as an absence — which is what it is. */
function dayRows(){
  const out=new Map();
  (store.collection.playedDays||[]).forEach(x=>{
    const r = typeof x==='string' ? {d:x,depth:0}
            : (x && typeof x==='object' && typeof x.d==='string') ? x
            : null;
    if(!r) return;                    // anything else is not a day and is skipped
    /* the same date twice can only come of two prototypes' arrays being merged.
       keep whichever row carries more; never let the barer one win. */
    const prev=out.get(r.d);
    if(!prev || Object.keys(r).length>Object.keys(prev).length) out.set(r.d,r);
  });
  return [...out.values()];
}
/* the spine of the screen: every day from today back to launch, newest first,
   played or not — a day you never opened is the product, because it is a
   specific date you can still go back for. any played day older than launch
   comes too: an early prototype's rows predate it, and a record that drops
   them is not a record. two years of rows is the cap, so a runaway LAUNCH
   cannot build a hundred thousand of them. */
function allDays(){
  const rows=dayRows(), by=new Map(rows.map(r=>[r.d,r]));
  const days=new Set(rows.map(r=>r.d));
  let d=today();
  for(let i=0;i<730 && d>=LAUNCH;i++,d=dayAdd(d,-1)) days.add(d);
  return [...days].sort().reverse().map(x=>({d:x,row:by.get(x)||null}));
}
/* ---- the day's ten, drawn ----
   ten cells, one per net, and the tier is the HEIGHT — see .dayrow .dcells for
   why height rather than hue, and for what this replaced.
   `tiers` is the initials stampToday stored, one per cleared net in order. the
   decode is a table rather than a startsWith so that an unknown letter draws a
   hairline instead of throwing or inventing a rung: TIERRANK still carries two
   dead keys, and a save is the one input here nothing can validate in advance.
   the colours come off TIERCOL and are handed over as `var(--token)` strings,
   never resolved, so flipping the ground repaints ten cells a row with no
   javascript re-running — the same discipline paintCells and paintRun keep. */
const TIEROF={p:'perfect', c:'clean', d:'done'};
const CELLH={perfect:'t3', clean:'t2', done:'t1'};
function dayCells(tiers){
  // a row from any earlier save shape has no tiers and draws nothing at all.
  // no cells is an absence, and an absence is exactly what it is; ten hairlines
  // would be a claim that the day was played and scored nothing.
  if(typeof tiers!=='string' || !tiers) return '';
  let out='';
  for(let i=0;i<POLICY.dailyNets;i++){
    const t=TIEROF[tiers[i]];
    out += t ? `<i class="${CELLH[t]}" style="--fill:var(${TIERCOL[t]})"></i>` : '<i></i>';
  }
  return `<span class="dcells" aria-hidden="true">${out}</span>`;
}
/* the same reading in words, because the cells are a picture and the row's
   label is what a screen reader gets instead of it */
function tierWords(tiers){
  if(typeof tiers!=='string' || !tiers) return '';
  const n={};
  [...tiers.slice(0,POLICY.dailyNets)].forEach(ch=>{
    const t=TIEROF[ch]; if(t) n[t]=(n[t]||0)+1;
  });
  return ['perfect','clean','done'].filter(t=>n[t]).map(t=>n[t]+' '+t).join(', ');
}

/* clicking a row offers that day. replaying one you already cleared is allowed
   — it simply cannot improve a tier you already hold, same as any net. */
function offerDay(iso,done){
  if(iso===today() && !isArchive()){ hideVeils(); return }
  if(!canPlayDay(iso)) return flashMsg('that day is in the archive · unlock it to play');
  if(!confirm(`play ${dayLabel(iso)}? your run in progress is set aside.`)) return;
  newRun('daily',iso);
  builtFor=-1; resetDescent(); save(); hideVeils(); renderAll();
  flashMsg(iso===today()?'today\'s net':'playing the archive · '+dayLabel(iso)+' · this does not extend a streak');
}
/* the unlock. POLICY.premium is a client constant with nothing behind it, so
   this is the whole transaction: flip the one switch and redraw. it is here to
   show what unlocking looks like — no payment is taken, no provider is called,
   and none can be until there is a backend to take one (README, phase 2). */
function unlockArchive(){
  if(POLICY.premium) return;
  POLICY.premium=true;
  save();
  openRecord();
  toast('archive unlocked · placeholder, nothing was charged');
}

/* the day's score, golf style: turns against par across the ten. negative is
   under par and good. it is the one reading that every net contributes to —
   tier counts are lumpy, a net missed by one turn scoring the same as one
   missed by nine — and it needs nothing from the solver, which is why the
   headline is this and not a count of perfects. `perfect` can only fire where
   the solver can prove an optimum, which today is two of the seven layout
   families: a perfect count would mostly measure which families the day drew. */
/* the score says which side of par it is IN WORDS, because a bare sign cannot.
   it used to render `+3` / `−8`, and three things were wrong with that. the
   minus sign U+2212 is a stroke away from the em dash used for "no data", at
   13px and in the same slot — so a new player's record read `— best day` and
   looked like a negative score. golf's red-for-under convention would have
   disambiguated it, except this palette has no red and WCAG forbids colour as
   the sole carrier anyway. and a signed number needs the reader to already know
   which direction is good; "8 under par" needs nothing. the spoken form of the
   game's own scoring was always the answer. */
function fmtScore(n){ return n>0 ? n+' over par' : n<0 ? (-n)+' under par' : 'level par' }
/* the same reading split, for the one place that sets the figure large and the
   words small beside it */
function scoreParts(n){
  return n>0 ? {fig:String(n), word:'over par'}
     : n<0 ? {fig:String(-n), word:'under par'}
           : {fig:'level',     word:'par'};
}
/* a day only has a score if it has both halves stored and the set was actually
   finished — ten nets. two nets at three under is not a round. */
const dayScore=r=>(r && r.turns!=null && r.par!=null && (r.depth||0)>=POLICY.dailyNets)
  ? r.turns-r.par : null;

/* ---- the one screen ----
   a head that does not move — the sixteen, which is the question a day list
   structurally cannot answer — and the days, which do. */
function openRecord(){
  const d0=today(), rows=dayRows();
  const keep=$('daylist').scrollTop;          // a theme flip redraws this whole screen

  /* ---- the two numbers worth keeping ----
     derived, not stored: every day row carries its own turns and par, so the
     best round is a scan rather than a field that can drift out of step with
     the rows it claims to summarise. best DEPTH is gone — a day is a fixed set
     of ten that cannot be failed, so depth is ten for anyone who finishes and
     says nothing whatever about how well they did. */
  const best=rows.map(dayScore).filter(v=>v!=null).sort((a,b)=>a-b)[0];
  const badges=store.collection.badges||{};
  const stat=(fig,word,label)=>
    `<span class="rstat"><b>${fig}</b><em>${word}</em><i>${label}</i></span>`;
  /* ONE reading, and it names itself. two changes here.
     `16/16 at clean` is gone. a finished day frees about fourteen of the sixteen
     features, so the counter reaches 16/16 inside two or three days and then
     reads the same forever — the identical terminal-counter failure that
     `bestDepth` and `features collected` were already deleted for elsewhere. a
     number that stops moving is not a reading.
     and the survivor leads with TODAY when today has been scored, because the
     screen is opened seconds after finishing a run and the live question is how
     that run went. best-ever changes a handful of times and then never again. on
     day one they are the same number, so nothing is lost by preferring today. */
  const todayScore=dayScore(rows.find(x=>x.d===d0));
  const shown = todayScore!=null ? todayScore : best;
  if(shown!=null){
    const {fig,word}=scoreParts(shown);
    $('recstats').innerHTML=stat(fig,word,
      todayScore==null ? 'your best day'
      : (best!=null && todayScore<=best) ? 'today · your best' : 'today');
  } else {
    /* no scored day anywhere: say what a day IS rather than print a dash. this
       is the whole of the old `—`, which meant "no data" and read as a minus. */
    $('recstats').innerHTML=stat(POLICY.dailyNets,'nets today','not played yet');
  }

  /* ---- the sixteen, for exactly as long as there are any left to find ----
     a found feature wears its plate with a band in the tier it was minted at;
     an unfound one is a hairline square with a cross in it, which says
     unidentified without giving the sign away.

     the row answers the one question a list of days structurally cannot — which
     features have I never seen — and that question expires. a finished day frees
     about fourteen of the sixteen, so the set closes in two or three days and
     the row then shows sixteen filled plates for the rest of the game: a
     collection display, in a game that is not scored on collecting.
     so it retires with the set it tracks. it also stops the worst first
     impression on the screen — a new player used to meet sixteen crosses at the
     top of a game whose whole promise is that a day cannot be failed. it now
     leads with what is left to find, and when nothing is, it leaves. */
  const named=FKEYS.filter(k=>badges[k]).length;
  const featrow=$('recfeatrow'), done=named>=FKEYS.length;
  featrow.style.display=done?'none':'';
  if(done){ featrow.innerHTML=''; featrow.removeAttribute('aria-label') }
  else {
    featrow.innerHTML=FKEYS.map(k=>{
      const b=badges[k];
      return b
        ? `<span class="fcell" style="--tc:var(${tierCol(b.tier)})" title="${k} · ${b.tier}">${featIcon(k)}</span>`
        : `<span class="fcell none" title="unidentified"><svg viewBox="0 0 96 96" role="img" aria-label="unidentified feature">`
          +`<g fill="none" stroke="currentColor" stroke-width="7"><path d="M30 30L66 66M66 30L30 66"/></g></svg></span>`;
    }).join('');
    const sum=`still to identify · ${FKEYS.length-named} of ${FKEYS.length}`;
    featrow.setAttribute('aria-label',sum);
    featrow.title=sum;
  }

  /* ---- the days ---- */
  const list=$('daylist'); list.innerHTML='';
  const days=allDays();
  const shut=[];       // every day the archive holds. they get ONE row, at the foot
  days.forEach(({d,row})=>{
    const played=!!row, canPlay=canPlayDay(d), isToday=d===d0;
    /* a day that is neither played nor open to you is not a row. eleven of the
       thirteen a new player met were exactly that, and the run of them grows by
       one every day for as long as the game exists. counted here, said once
       below. */
    if(!played && !canPlay){ shut.push(d); return }
    /* a played day with no recorded rung draws NO rung. it used to fall back to
       `over`, which TIERCOL paints identically to `done` — so a day the game has
       no record of rendered exactly like a day you finished over par, and the
       spine of the list asserted a score nobody played for. it is a legacy save
       shape and the honest drawing of it is the bare --rule the .dtier already
       falls back to, which is also what dayCells() does one column over: no
       tiers, no cells. an absence is drawn as an absence. */
    const tier=played?(row.best||null):null;
    const el=document.createElement('div');
    el.className='dayrow'+(isToday?' today':'')
      +(played ? (row.back?' back':'') : ' open');

    let det, right='';
    if(played){
      const p=[], sc=dayScore(row);
      /* the net count only earns its place when the set was left SHORT. it used
         to lead every row — "10 nets · " on 37 of 42 — which is the same
         tautology bestDepth was deleted for: a finished day is always ten, so
         the most repeated string on the screen carried no information and stood
         in front of the one that did.
         a scored day therefore leads with its score. a day left short says how
         far it got, because that is the thing that differs. a legacy row has
         neither and simply says it happened. */
      if(sc!=null) p.push(fmtScore(sc));
      else {
        if(row.depth) p.push(row.depth+' of '+POLICY.dailyNets+' nets');
        if(row.moves!=null) p.push(row.moves+' turns');
      }
      if(row.mode==='trial'&&row.trialDepth) p.push('time trial · depth '+row.trialDepth);
      // filled in from the archive rather than earned on the day. it counts
      // toward the record and never toward the streak, and says so.
      if(row.back) p.push('archive');
      det=p.join(' · ')||'played';
      /* the ten cells, and nothing else on the right of a played row. what was
         here was the day's features — fourteen of sixteen on a finished day, so
         near enough the same fourteen on every row in the list. */
      right=dayCells(row.tiers);
    } else {
      det=isToday?'not played yet':'not played';
      right='<span class="dstate">play →</span>';
    }

    el.innerHTML=`<i class="dtier"${tier?` style="--tc:var(${TIERCOL[tier]})"`:''}></i>`
      +`<span class="ddate">${dayLabel(d)}</span>`
      +`<span class="ddet">${det}</span>`
      +right;
    // the cells are aria-hidden, so the tiers go into the label as words instead
    const words=played?tierWords(row.tiers):'';
    const label=dayLabel(d)+' · '+det+(played&&tier?' · '+tier:'')+(words?' · '+words:'');
    el.setAttribute('aria-label',label);
    /* only a row you can actually do something with is a control. every row
       reaching here either is playable or is a day you have already played —
       a shut day is not a row any more. */
    if(canPlay){
      el.setAttribute('role','button'); el.tabIndex=0;
      el.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); offerDay(d,played) } };
    }
    el.onclick=()=>{
      if(canPlay) offerDay(d,played);
      else flashMsg('that day is in the archive · unlock it to play');
    };
    list.appendChild(el);
  });
  /* ---- the archive, in one line ----
     the run of shut days used to be a row each, with a filled violet button on
     the first of them — the only saturated object on the card, which made the
     visual anchor of a history screen a shop, and a list that grew by a row a
     day forever whether you played or not. one line at the foot says the same
     thing and says it once. `unlock` is a link in the quietest ink here rather
     than a field: it is a way through, not the subject.
     POLICY.premium opens every one of these days, so when it is on `shut` is
     empty and there is no row to draw — the gate is the same one canPlayDay
     already applies, not a second copy of it. */
  if(shut.length){
    const el=document.createElement('div');
    el.className='dayarch';
    el.innerHTML=`<span class="datext">${shut.length} earlier day${shut.length===1?'':'s'} · in the archive</span>`
      +(POLICY.premium ? ''
        : `<a href="#" class="archlink" data-buy="1"`
          +` title="flips the client-side premium flag · there is no payment behind it yet">unlock</a>`);
    el.onclick=e=>{
      if(!e.target.closest('[data-buy]')) return;
      e.preventDefault(); unlockArchive();
    };
    list.appendChild(el);
  }
  /* the empty state tested `days`, which allDays() seeds with every date back to
     LAUNCH — so it was never empty and this branch had never once rendered in
     the life of the game. what a new player actually met was a list of locked
     archive rows with a violet unlock button as the brightest thing on screen:
     a history screen whose first impression was a shop.
     `rows` is the honest test — days you have actually played — and when there
     are none the archive is not the story, so it replaces the list entirely
     rather than sitting above it. */
  if(!rows.length) list.innerHTML=
    '<div class="runempty">nothing on record yet.<br>'
    +'play today\'s ten and this fills in — one day, ten nets, the same ten for everyone.</div>';

  /* the whole screen is written before this and nothing is read back after it.
     there used to be a second pass here: read `clientWidth` off every stamp
     strip in the list — a forced synchronous layout, on a card that had just
     been made visible — to work out how many emblems fitted and where a `+n`
     overflow marker went, mirroring the icon size and gap out of the css into
     two javascript constants that had to be kept in step by hand. a resize
     listener then re-ran the whole of openRecord to do it again.
     ten cells of a fixed width fit by construction, so all of that is gone: one
     write, no read, no mirror of the css, and nothing to redo when the window
     changes size — the media query moves the two numbers and the cells follow. */
  $('histveil').classList.add('show');
  list.scrollTop=keep;
}

/* ================= hud ================= */

/* the per-thread crossing counts, in the crossings bay of the masthead. they
   used to be chips floating over the board's last column; see the .threadrow
   css for why they are not a total and why the total is the track instead. */
const STRENGTH=['','faint','clear','dominant'];
function renderThreads(){
  const c=$('threadrow');
  /* rebuild when the thread SET changes, not merely its size: two consecutive
     nets with the same thread count would otherwise keep the old net's slots
     and leave stale counts on screen.
     and rebuild whenever a thread has no slot, whatever the signature says.
     buildNet makes fresh thread objects every time it runs, so rebuilding the
     SAME net — which a relayout, a theme repaint or a replay all do — left the
     row holding slots that belonged to the discarded objects. every live thread
     then failed the `if(!t.slot) return` below and the row quietly stopped
     updating, still showing the counts it had before the rebuild. */
  const sig=R().netIndex+':'+threads.map(t=>t.key).join(',');
  if(c.dataset.done) return;          // the finish flood owns the bar until the next net
  if(c.dataset.sig!==sig || threads.some(t=>!t.slot||!t.slot.isConnected)){
    c.dataset.sig=sig;
    c.innerHTML='';
    $('field').classList.remove('dimthreads');
    threads.forEach(t=>{
      const b=document.createElement('button');
      b.className='tval'; b.type='button';
      /* the thread's colour goes in as a reference to its token, not as the
         value the token currently holds. a theme flip then repaints it with
         nothing to re-run — the same reason paintCells and paintRun are handed
         var(...) strings rather than resolved ones. */
      b.style.setProperty('--fill','var('+t.col+')');
      /* pointing at a count answers "which line is this one?" by dimming the
         others rather than by fattening its own. the thread's stroke width
         encodes how strongly the feature is represented and is not available
         to say anything else; dimming leaves it alone, and reads better
         besides — one line lit on a quiet board. it also works far better from
         up here than it did from a chip sitting on top of the board. */
      const lit=on=>{
        if(!t.el||!t.el.isConnected) return;
        $('field').classList.toggle('dimthreads',on);
        threads.forEach(x=>{if(x.el) x.el.classList.toggle('lit',on&&x===t)});
      };
      b.onpointerenter=()=>{clearTimeout(t.litT); lit(true)};
      b.onpointerleave=()=>{clearTimeout(t.litT); lit(false)};
      // touch has no hover, so a tap holds it lit long enough to read
      b.onclick=()=>{lit(true); clearTimeout(t.litT); t.litT=setTimeout(()=>lit(false),1100)};
      c.appendChild(b); t.slot=b;
    });
  }
  threads.forEach(t=>{
    if(!t.slot)return;
    const shares=!t.freed&&t.nodes.some(n=>n.merged);
    t.slot.dataset.s=t.strength;
    /* the segment's share of the bar IS its crossing count, carried by
       flex-grow — so the widths are exact at any bay width, need no cap and no
       quantising, and can never clip. no crossings, no share, no width: that is
       the whole rule, and it is what makes a drained bar actually empty. the
       `clear` class lifts the 3px floor, which exists so a small count cannot
       round away and has no business propping up a count of nothing. */
    t.slot.style.flexGrow = t.crossings;
    t.slot.classList.toggle('clear', t.crossings===0);
    t.slot.setAttribute('aria-label',
      t.freed?t.key+' · freed'
      :t.key+' · '+(shares&&t.crossings===0?'shares a neuron, split it'
                    :t.crossings+' crossings')+' · '+STRENGTH[t.strength]+' feature');
    t.slot.title=t.slot.getAttribute('aria-label');
  });
}
/* ================= the game's voice =================
   one entry point, two outputs: #msg is the aria-live region and always gets
   the sentence verbatim, and `.say` is the card over the board. every call site
   still works with nothing but a string; the ones that know more about what
   they are saying pass a second argument, and get a colour, a mark and a longer
   hold for it.

   HOW LONG. it was 3400ms for everything, which is generous for "weather" and
   short for a 76-character instruction — the same number doing two jobs badly.
   the hold is read time now: a fixed beat to notice the card at all, plus time
   per character, clamped at both ends. at ~18 characters a second (roughly
   200wpm) the per-character figure would be 55ms for prose read straight
   through; these are glanced rather than read, but they arrive unannounced and
   half of them name something you then have to find on the board, so 55 is what
   it stays. that puts `feature identified · weather` at 2.9s, `net 004` at
   3.3s, the split at 4.1s, and both the blocked thread (after its multiplier)
   and the trial's opening sentence at the 5.6s ceiling.

   TWO AT ONCE. clearing the last crossing of two threads frees both inside one
   `forEach`, and the old line simply overwrote itself — the first feature you
   freed was never named at all. a queue would be worse: you would be reading
   about a move you made two moves ago. so a message arriving within 650ms of
   the card appearing is ADDED to it as another row, the hold is recomputed from
   everything on it, and the card keeps up without ever making you wait. later
   than that and it is a new event, and the card is replaced. */
const SAY_BASE=1400, SAY_PER=55, SAY_MIN=2200, SAY_MAX=5600, SAY_MERGE=650, SAY_ROWS=3;
let sayT=null, sayRows=[], sayAt=0;
// the wordmark's own flag, read off the one place its order is written
const FLAG=['--flag-1','--flag-2','--flag-3','--flag-4'];

function flashMsg(txt,o){
  $('msg').textContent=txt;
  sayShow(txt,o||{});
}
/* every message in this game is already written `label · detail`, so the card
   gets its two-part setting for free and no copy has to be rewritten. a first
   part longer than a label is not one — that message is a sentence, and it is
   set as a sentence. */
function sayParts(txt,o){
  if(o.plain) return {kick:'',line:txt};
  const i=txt.indexOf(' · ');
  return (i>0 && i<=22) ? {kick:txt.slice(0,i), line:txt.slice(i+3)} : {kick:'',line:txt};
}
function sayHide(now){
  const el=$('say');
  if(sayT){clearTimeout(sayT); sayT=null}
  sayRows=[]; sayAt=0;
  el.classList.remove('on');
  // a veil is about to cover the board: the card does not fade out underneath
  // one, it is simply not there
  if(now){ el.style.transition='none'; el.offsetHeight; el.style.transition='' }
}
function sayShow(txt,o){
  const el=$('say');
  /* a full veil is up — the cleared-net bulletin, the collection, the rules.
     a card is either noise behind that or noise on top of it, and the bulletin
     is the payoff of the whole net; nothing gets drawn over it.
     in practice one message can reach here: tapping a locked day in the record,
     which is feedback about a control INSIDE the overlay. that is what the
     toast is for, and what it already carries for "net skipped". the live
     region has spoken either way — that is the part that must not be dropped. */
  if(document.querySelector('.veil.show')){ toast(txt); return }
  const now=performance.now();
  const row=Object.assign({txt}, sayParts(txt,o), o);
  const merging = sayRows.length && sayRows.length<SAY_ROWS && (now-sayAt)<SAY_MERGE;
  if(merging) sayRows.push(row); else { sayRows=[row]; sayAt=now }

  /* the strip is every row's colour in order: one is the thing being spoken
     about, two is a shared neuron drawn as its own two features meeting. */
  const cols=[]; sayRows.forEach(r=>(r.cols||['--silver']).forEach(c=>{if(!cols.includes(c))cols.push(c)}));
  // built as one string with no stray whitespace: `.say` is width:max-content,
  // and a trailing text node gives it a line box the card then sits below
  el.innerHTML='<div class="saycard">'
    +`<div class="saystrip">${cols.map(c=>`<i style="background:var(${c})"></i>`).join('')}</div>`
    +sayRows.map((r,i)=>{
      const rc=r.cols||['--silver'];
      // a row about two features carries both, the same way the strip does
      const bar=rc.length>1
        ? `background:linear-gradient(var(${rc[0]}) 0 50%,var(${rc[1]}) 50% 100%)`
        : `background:var(${rc[0]})`;
      const lead=r.mark ? r.mark
        : sayRows.length>1 ? `<i class="saybar" style="${bar}"></i>` : '';
      const fresh=(merging && i===sayRows.length-1) ? ' rowin' : '';
      return `<div class="sayrow${fresh}${r.tight?' tight':''}">${lead}<div class="saytext">`
        +(r.kick?`<span class="saykick">${r.kick}</span>`:'')
        +`<div class="sayline${r.big?' big':''}">${r.line}</div></div></div>`;
    }).join('')
    +'</div>';
  el.classList.add('on');

  const chars=sayRows.reduce((a,r)=>a+r.txt.length,0);
  // an instruction is held a third longer than a report: you have to act on it,
  // and it arrives at the moment you are stuck. the ceiling still holds.
  const mult=sayRows.some(r=>r.hold)?1.3:1;
  const hold=Math.min(SAY_MAX,Math.max(SAY_MIN,(SAY_BASE+SAY_PER*chars)*mult));
  if(sayT)clearTimeout(sayT);
  sayT=setTimeout(()=>{sayRows=[];sayAt=0;sayT=null;el.classList.remove('on')},hold);
}
/* the timer is the longest the card will stay, not how long it stays: reaching
   for the board takes it down. the game has finished saying this and you have
   moved on, and a card you cannot dismiss sitting over the puzzle for six
   seconds is the failure mode a generous hold invites. the floor stops a press
   that lands in the same breath as the message from swallowing it unread. */
function sayNudge(){
  if(!sayRows.length || performance.now()-sayAt<420) return;
  if(sayT){clearTimeout(sayT); sayT=null}
  sayRows=[]; sayAt=0; $('say').classList.remove('on');
}
/* every veil in the game opens through here, so none of them can forget to
   take the card down first */
function showVeil(id){ sayHide(true); $(id).classList.add('show') }
function renderHud(){
  const r=R();
  const trial=isTrial();
  const {optimum,par}=netTargets();
  const tier=liveTier();

  /* ---- today's set ----
     ten cells: a cleared net MINTS its own in the tier it earned, the net you
     are on carries the ink ring, and the rest are the day still ahead in
     silver. the ink cell is why the masthead no longer repeats the net number
     the board already carries in the corner — the strip says where you are by
     position.
     the strip used to open as ten empty cells and fill from the left, which
     made it the only instrument in the head that started at nothing while the
     two beside it started full and drained. that was one form and two
     behaviours. it starts full now: ten blanks of silver, each converted to its
     rung as you play it, so all three tracks open solid and all three are spent
     across the day. what the strip spends is the day itself.
     nothing about the reading moves. the cells are still ten, the divisions are
     still hairlines, and each one still records the rung its net minted — the
     change is only what an UNPLAYED cell is drawn in, which was the absence of
     a colour and is now a material. an absence cannot be a rung; neither can
     silver, and that is why it is the one chosen.
     this is the share strip too, which is the reason it is worth ten cells of
     the masthead: the day is the same ten for everyone, so the strip compares.
     it is still TEN CELLS underneath — the rung each net minted is still a
     separate thing, and the strip is still what gets shared — but the divisions
     between them are no longer drawn, so it reads as one length like the two
     bays beside it. what that costs is countability WITHIN a run of the same
     rung: four clean nets in a row are one clean length now and cannot be
     counted off. the numeral above has always been the count, the boundary into
     the day ahead is still exactly where you are, and the cells themselves are
     untouched for anything that reads them. see the note by .track. */
  const D=POLICY.dailyNets;
  // a trial has no ten, so its strip rolls: a band of ten that empties and refills
  const cells=trial?r.cleared.slice(r.cleared.length-r.cleared.length%D):r.cleared;
  /* every cell is handed a colour now, so paintCells never draws its empty case
     here any more. the case stays in paintCells rather than being torn out: it
     is one `if`, and a track handed a hole should draw a hole rather than throw. */
  paintCells('setmeter',Array.from({length:D},(_,i)=>'var('+(cells[i]?tierCol(cells[i].tier):SETAHEAD)+')'),
    cells.length+' of '+D+' nets cleared');
  /* the cells persist between renders now (paintCells reuses them so the colour
     can transition), so `now` has to be cleared off the cell that was carrying
     it — it used to be discarded for free when the strip was rebuilt. */
  const strip=$('setmeter');
  [...strip.children].forEach(c=>c.classList.remove('now'));
  const cur=strip.children[cells.length];
  if(cur && !r.over) cur.classList.add('now');
  /* nets at or above the clean line, drawn in the clean line's own colour —
     which is what let the word "clean" come off it. the strip beneath is the
     referent: an orange numeral over orange cells, and a green cell reads as
     plainly better than orange without having to be told that it is. green is
     the top of the ladder and is the "nicer colour" a perfect lands on: against
     a silver blank it is the largest step any cell in the strip can take.
     this instrument still records what was EARNED while the other two show what
     is left — that difference is real and is carried by the colours themselves
     now rather than by one bar starting empty while two started full. a cell
     that has gone from silver to a signal colour is a thing gained; a bar that
     has shortened is a thing spent. same direction of travel, opposite meaning,
     and the eye gets both without either instrument breaking the form. */
  const cleanN=r.cleared.filter(c=>TIERRANK[c.tier]>=TIERRANK.clean).length;
  $('setlabel').textContent=trial?'time trial':"today's set";
  /* the numeral counts DOWN, like the two beside it: nets still to play, ten to
     nothing. all three readings in the head now answer "how much is left", so
     the day ends with three noughts rather than two noughts and a ten.
     the CELLS still fill, and that is deliberate — they are the only record of
     which rung each net minted, and a strip that emptied as you played would
     erase the day while you were having it. so the number is what is spent and
     the strip is what was earned. */
  $('setnum').textContent=trial?r.cleared.length:Math.max(0,D-r.cleared.length);

  /* ---- turns against par ----
     ONE line at a time, and the whole bar is that line.

     it used to draw both lines at once — a solid run for the turns that still
     left a perfect and a half-strength run for the ones that only left a clean —
     two bands sharing ten pixels, in which the band you were actually chasing
     was whichever one you worked out you were standing in. and the two were the
     same colour in practice: `--hue-soft` mixed `--hue` with the track, which on
     a bar sitting ON that track is a band you cannot find.

     so the bar is a budget, and there are three of them in sequence. while a
     perfect is still on, the bar IS the perfect budget: full at the first turn,
     draining to nothing exactly as the optimum runs out. the turn after that it
     hands over — refills, and is now the par budget, draining the same way. past
     par it inverts and builds up from nothing, which is the one reading here
     that counts UP, because turns over par are the only thing in this game you
     accumulate rather than spend.
     each phase gets the whole width, so the same ten pixels answer one question
     at a time and the numeral beside it always names the line the bar is drawing.
     zero is still not failure — the day cannot be failed, and the rung the net
     mints is the strip's business.

     `graded` is the two cases with no perfect to chase: no proved optimum for
     this net (most of them — see OPTIMA), and a net under descent, which is
     capped at done. both skip straight to the par budget, which is then the
     whole of par rather than the part of it past the optimum. */
  const t=r.netMoves, over=t>par;
  const hasOpt=optimum<par, capped=(tier==='done'&&!over);
  const graded=hasOpt&&!capped;
  /* `<=` is what makes this agree with the rung it counts toward: tierFor awards
     perfect at moves===optimum, so standing exactly on the optimum reads "0 to
     perfect" — one more and it is gone — rather than jumping to par a turn
     early. the bar is empty at that moment and that is correct: the budget is
     spent, and the perfect is still yours until you spend one more. */
  const chasing=graded&&t<=optimum;
  /* BOTH LINES, ON ONE BAR, FROM THE FIRST TURN. the bar is the whole run to
     par, and the yellow head of it is the part that would still leave a perfect —
     so the join between yellow and turquoise IS the perfect line, standing where
     it will be, and you can see from the opening turn how much of the run is
     perfect and how much is only clean.
     it drains from that end, so the yellow shortens first: when it runs out you
     have spent the perfect and the turquoise is what is left to par. no refill,
     because there is nothing to hand over to — the par run was always on the bar,
     you were simply looking at the front of it.
     (it says yellow because `perfect` is yellow: this described a green head for
     two ladders, and outlived both.)
     this replaces a version that gave each line the whole width in turn. that one
     read well moment to moment and could not answer the question the owner
     actually had, which is where par sits while you are still chasing perfect.
     the WORDING still switches — the numeral names the nearer line you can still
     make — so the reading changes hands even though the bar does not. */
  const left=Math.max(0,par-t);
  const perfectLeft=graded?Math.max(0,Math.min(left,optimum-t)):0;
  let pct, segs, num, unit;
  if(over){
    /* PAST PAR THE BAR FILLS AGAIN, and the full bar is TWICE par rather than
       par. the overspend is the one reading here with no ceiling of its own, so
       the scale is a choice about how much runway it gets before it pins and
       stops saying anything — and at one par it pinned almost at once on the
       nets where it matters most. today's ten are par 3, 3, 3, 4, 8, 6, 9, 11,
       13, 15: on the first four the whole build was over in three or four turns
       and then sat full for the rest of the net.
       at twice par the rule is still one you can state — a full bar is double
       what the net should have cost — and every net gets a build long enough to
       read as one. it halves the fill rate on the deep nets too, which is not a
       side effect worth apologising for: seven over on a par-15 net drew as
       nearly half a bar, and seven over on fifteen is not half a disaster.
       the numeral is untouched either way. it names the exact overspend from the
       first turn past par and keeps naming it long after the bar has pinned, so
       nothing is lost at the ceiling except the picture. */
    pct=100*Math.min(t-par,2*par)/(2*par);
    segs=[{col:'var(--par-over)',grow:1}];
    num=t-par; unit='over par';
  } else {
    pct=100*left/par;
    segs=[{col:'var(--par-perfect)',grow:perfectLeft},
          {col:'var(--par-par)',    grow:left-perfectLeft}];
    num=chasing?optimum-t:par-t;
    unit=chasing?'to perfect':'to par';
  }
  /* crossing par is the one moment the bar does something other than shorten: it
     empties, then starts filling again from the other end, and at --t-ui (170ms,
     the hover speed) that reversal reads as a glitch rather than as a turn. so
     that ONE change gets a slower sweep. the perfect line needs none — the bar
     simply keeps draining through it, which is the point of drawing both. */
  const meter=$('parmeter'), phase=over?'over':'under';
  if(!reduceMotion && meter.dataset.phase && meter.dataset.phase!==phase){
    const bar=meter.firstElementChild;
    bar.style.transitionDuration='520ms';
    clearTimeout(meter.__phaseT);
    meter.__phaseT=setTimeout(()=>{ bar.style.transitionDuration='' },560);
  }
  meter.dataset.phase=phase;
  paintRun('parmeter',pct,segs,num+' turns '+unit);
  // the numeral and its unit come off the same branch that drew the bar, so the
  // two can never name different lines
  $('parnum').textContent=num;
  $('parof').textContent=unit;

  $('field').classList.toggle('over',!!r.over);
  /* `statusword` was written here — "day complete", "out-trained", "time trial".
     the element is gone and so is the reading: the trial case is what setlabel
     above already switched the third bay to, and the over case arrives as a card
     over the board. see the note where .unit-feet used to be. */
  const d=new Date(), mo=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
  $('statusdate').textContent=`${d.getDate()} ${mo[d.getMonth()]}`+((store.meta.streak||0)>0?` · ${store.meta.streak}`:'');
  $('histbtn').title=`the record · ${d.getDate()} ${mo[d.getMonth()]}`
    +((store.meta.streak||0)>0?` · streak ${store.meta.streak}`:'');
}
function renderAll(){
  buildNet(); renderHud(); refresh(); startPhysics(); renderTutorial();
  if(R().over) setTimeout(showRunOver,200);
}
