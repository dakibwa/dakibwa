function endRun(){
  const r=R(); if(r.over)return;
  r.over=true; save();
  setTimeout(showRunOver,600);
}

/* ================= bulletins ================= */

/* WHAT A CARD IS ALLOWED TO SAY. five of these drifted the same way and were cut
   back together on 14 Aug 2026, so the rule is written here once rather than
   argued five times. a card has four text slots and each says its thing ONCE:

     the numeral  how far you got — a net's ordinal, a day's depth. nothing else
                  on the card repeats it.
     the sub      the CONCLUSION: the tier on a net, the score on a day. the
                  strip above it is already drawing that as a colour, so this is
                  the same reading in words and it belongs at the top.
     the rows     the reading nothing else on the card carries, and only that. a
                  row restating the numeral, the sub or the stamps below it is
                  ink spent saying nothing — `turns 2 / 9` under a card already
                  headed `perfect` was the whole of the complaint, and it was
                  ambiguous into the bargain: 2 of 9 reads as progress, not as a
                  score against par.
     the note     at most one short sentence, and only where it says something
                  that will NOT be true of the next card of the same kind. "from
                  here the nets deepen" is a fact about the game and the nets
                  teach it themselves; "untangle the next one unaided" is a fact
                  about the net you just played.

   and nothing offers a way to stop. the buttons lead on, and a card is closed by
   escape or a click beside it — which on the cleared card IS continuing, see
   dismissVeil. an explicit `stop for today` was a button asking a player who has
   just won to consider not playing. */

/* the ground was fixed at dunkelblau, because it was the only palette colour
   that carried white body type (5.39:1 — gelb managed 1.68, which was a blank
   card every seventh net) and because a card that is a plate has to be a plate
   of SOMETHING. it is not a plate any more: see .bulletin. it takes --surface
   like the two other cards the game floats over the board, and the run's colour
   stays where it was already the more useful of the two — the strip, where it
   names the tier this net minted at.
   the strip reads TIERCOL, which is one table now and canonical on either
   ground. it used to read the ground-adapted --sig-* here, on the argument that
   canonical gelb would be "a 1.61:1 band that vanished into the card" — and the
   band that argument describes is the wordmark's own flag, which draws canonical
   gelb on --surface at that exact ratio and is the loudest thing in the
   masthead. what it actually bought was a bronze strip on the card announcing
   the best result in the game. see TIERCOL for the measurements. */
/* the note and the ray dial are optional now, and both are off on the cleared
   card. a note that is true of every net after every net is not a reading, and
   the dial is decoration that needs 34px plus 46px of clearance on the note it
   hangs off — which a card tucked into the corner of the board does not have to
   spend. the day card is unchanged: it keeps both. */
/* the strip takes a LIST as well as a single token. one band is a tier or a
   feature — a reading of the board. four is the wordmark's own flag, which is
   what `.saystrip` already draws for the messages that are the GAME speaking
   rather than a reading, and a question is exactly that. a single token still
   draws one full-width band, so neither of the two cards that were here before
   changes by a pixel. */
function bulletinHTML(o){
  const bands=Array.isArray(o.strip)?o.strip:[o.strip||'--tuerkis'];
  return `<div class="bstrip">${bands.map(c=>`<i style="background:var(${c})"></i>`).join('')}</div>
  <div class="bhead"><div><h2>${o.title}</h2><div class="bsub">${o.sub}</div></div><div class="bnum">${o.num}</div></div>
  ${/* a card with no rows draws no rule strip: .brules carries a top border, so
        an empty one is a hairline across the card under a heading, which reads as
        a row that failed to render rather than as a card that has none. */
    (o.rows||[]).length?`<div class="brules">${o.rows.map((r,i)=>`<div class="brow" style="--i:${i}"><span>${r[0]}</span><b>${r[1]}</b></div>`).join('')}</div>`:''}
  <div class="bbody">${o.body||''}${o.note?`<div class="bnote">${o.note}</div>`:''}${o.offer?`<div class="boffer">${o.offer}</div>`:''}${o.sun===false?'':`<div class="bsun">${SUN('var(--silver)')}</div>`}</div>
  <div class="bactions">${o.actions}</div>
  ${o.foot||''}`;
}
/* ---- the one invitation ----
   the tutorial's cleared card carries this and nothing else in the game does.
   it is the right moment because it is the FIRST one: they have just felt the
   thing work, they have a stamp, and there is now something to lose.

   what it says is what is true. a player without an account does not lose their
   progress — it is in this browser and it always was — so an ask built on "sign
   in or lose it" would be a lie, and a lie about the one subject where being
   caught costs you the account. what signing in actually buys is the SECOND
   device and surviving a browser clear, so that is what it offers.
   it draws nothing when there is no backend to sign in to, and it never appears
   again: the tutorial happens once, and after it the foot of the record is the
   permanent home. */
function signInInvite(){
  return `<div class="bfoot" id="binvite" hidden></div>`;
}
function fillSignInInvite(){
  const el=$('binvite');
  if(!el||!API) return;
  askSignIns().then(list=>{
    if(!$('binvite')||!list.length||(account&&account.signedIn)) return;
    const el2=$('binvite');
    el2.hidden=false;
    el2.innerHTML=`<span class="bfoot-say">saved in this browser · sign in and it follows you anywhere</span>`
      +`<span class="bfoot-ins">${list.map(p=>
          `<a href="#" class="acctlink" id="binv-${p}" aria-label="sign in with ${p}">${p}</a>`).join('')}</span>`;
    list.forEach(p=>{
      const a=$('binv-'+p);
      if(a) a.onclick=e=>{e.preventDefault(); if(p==='email') hideVeils(); goSignIn(p)};
    });

}
function showNetCleared(feats,tier,wasTutorial,read){
  /* the card is shown on a timer, and the run it describes can be gone by then
     — a new run, an archive day, a trial. it has nothing to say about a run
     that no longer exists.
     it used to test that the net it was about to describe was still the last
     entry in r.cleared, which is the one thing the tutorial ending takes away
     while leaving the run itself standing — so the one card the tutorial cannot
     afford to lose was the only card that never drew. the test is the run's own
     identity now, and everything the card reports comes off the reading taken
     when the net was won (see clearNet). */
  if(!read || read.run!==R()) return;
  const strengthOf=k=>{const t=threads.find(x=>x.key===k);return t?t.strength:2};
  /* the strength tally under each label went with the rest. three block glyphs
     with no key anywhere on the card read as an artefact rather than a reading,
     and the board behind is already drawing strength as the width of the line. */
  const mint=`<div class="minted">${feats.map((k,i)=>{
    const b=store.collection.badges[k];
    return `<div class="mb" style="--i:${i}">${featureStamp(k,b.tier,false)}<span>${k}</span></div>`;
  }).join('')}</div>`;
  // the cut readings, kept for the reader — see .bquiet
  const quiet=`<p class="bquiet">${feats.length} features freed: `+
    `${feats.map(k=>k+' '+['','faint','clear','dominant'][strengthOf(k)]).join(', ')}. `+
    `${read.clean} of ${read.depth} clean so far. ${read.turns} turns today.</p>`;
  $('netbulletin').innerHTML=bulletinHTML({
    strip:TIERCOL[tier],
    /* THE TIER LEADS. it used to sit in the sub, one grey word under `net
       cleared`, which had the card announcing the thing that is true of every
       cleared net and whispering the thing that is only true of this one. the
       tier is the score — the day is measured in rungs now, not in turns against
       par — so it is the headline and `net cleared` is the quiet line beneath it
       saying what happened.
       the rules card teaches the ladder, so this stays one word. it used to
       gloss each rung — "clean · within par" — which is the rung said twice. */
    title:tier,
    /* an assisted net keeps its clause, and it belongs here now: descent is not
       something the tier name can tell you, and it is the reason this one could
       not mint above done. */
    sub:(wasTutorial?'you untangled it':'net cleared')
        +(read.assisted?' · settled with descent':''),
    num:String(read.num).padStart(2,'0'),
    /* NO ROW. the turns were the last thing on this card measuring the net in a
       currency the game no longer scores in: the day is counted in rungs, so
       what matters at the moment of winning is which rung, and that is now the
       biggest word on the card. a turns count under it invited the player to
       audit a number the tier had already ruled on.
       the count is not lost — the masthead carries it for the whole net, right
       up to the moment this card covers the board.

       what this row held, in the order it held it, because each was cut for a
       reason worth not repeating: `2 / 9`, turns over par, which read as
       progress rather than as a score and quoted a yardstick the tier above had
       already ruled on; then `turns taken 2`, the bare count, which is what went
       just now; and before all of it `features freed`, a count of the stamps
       immediately beneath it, plus `clean so far` and `turns today`, which are
       DAY readings on a card about a single net. */
    rows:[],
    body:mint+quiet,
    /* the note earns its place only when it says something that will not be true
       of the next cleared net too. the assisted one names a consequence you
       cannot see anywhere on the board, so it stays.
       the tutorial's was three lines of roadmap — longer threads, a third
       feature, shared neurons — delivered to somebody who has met none of the
       three, and it was the largest block of text on the card at the one moment
       the game has nothing to explain. the nets ARE the curriculum and each of
       those arrives with its own coaching when it arrives (see the shared-neuron
       message in afterMove).
       what replaced it — "that is the whole game. it gets deeper from here." —
       went the same way for the same reason, just smaller: the card already says
       `perfect` in the largest type on it and holds two stamps the player has
       just earned, and a line telling them it gets harder is the game talking
       over its own reward. the assisted note stays, because it names a
       consequence that is nowhere on the board. */
    note:read.assisted ? 'untangle the next one unaided for a clean badge.' : '',
    sun:false,
    /* one action, and it goes forward. `stop for today` sat beside it and was an
       invitation to put the game down at the exact moment the player had just
       been rewarded for picking it up — see the note at the head of this section.
       nothing is lost with it: clearNet saved before this card was built, so the
       tier, the badges and the day's row are already on disk, and closing the tab
       leaves the run exactly where a stop would have. */
    actions:`<button class="wbtn solid" id="contbtn">continue →</button>`,
    // the one place in the game that offers a sign-in unprompted, and only here
    foot:wasTutorial?signInInvite():''
  });
  showVeil('netveil');
  if(wasTutorial) fillSignInInvite();
  $('contbtn').onclick=nextNet;
}
/* ---- the offer, on the one card that has earned the right to make it ----
   a daily game's paid tier is only ever wanted at one moment: the moment you
   finish and there is nothing left until midnight. this card is already
   standing in that moment — the line above this one says "the set resets at
   midnight" — so the offer costs nothing to place and is asked at the only
   time the answer is plausibly yes. anywhere earlier and it is interrupting a
   game to sell a game.

   THE CONDITIONS ARE THE DESIGN. a finished day only: a set you put down has
   not run out of anything, and someone who stopped at net four is being sold
   more of a thing they just walked away from. never on a trial card, which is
   already the paid thing. and never once it is bought, obviously.

   it says the count, because "the archive" is a word and "12 earlier days" is
   an amount, and it names the trial second because that is the half a player
   has just watched go dark on the button below. the price rides the link so
   that nobody has to press it to find out.
   ANOTHER RUN LEADS IT, and it is the one thing here about the day the player
   is standing in rather than about days they have never seen: they have just
   played ten nets, `run again` is not on the card, and this names the one thing
   the card is not already giving them. the other two follow it in the order they
   always had.
   IT IS AN ADDITION AND NOT A RESTORATION, which is the whole reason this line
   still reads right after the record's rows stopped saying `one run only`. it
   does not say what the free player has run out of — they have run out of
   nothing, a new set of ten arrives tomorrow and that is the finished game — it
   says what money puts on top. `another run at any day` is deliberately the same
   phrase the locked replay chip answers a press with — two screens, one product,
   one way of naming it. see replayWords. */
function runOverOffer(trial,depth){
  if(trial || POLICY.premium || depth<POLICY.dailyNets) return '';
  ensurePrice();                      // redraws this card if the answer is late
  if(!canBuy()) return '';            // nothing to sell here yet — see `till`
  const n=archiveCount(), price=priceWords();
  const what=n ? `another run at any day, ${n} earlier day${n===1?'':'s'} and the time trial`
               : 'another run at any day and the time trial';
  return `${what} · <a href="#" id="runoffer">unlock</a>${price?' · '+price:''}`;
}
function showRunOver(){

     share now reads the run itself; see SHAREBLOCK. */
  const turns=r.cleared.reduce((a,c)=>a+c.moves,0);
  const parTot=r.cleared.reduce((a,c)=>a+c.par,0);
  const trial=isTrial();
  /* the day's own rungs, off the run rather than off a stored row. a trial runs

  const rung=rungCount(r.cleared.map(c=>c.tier), trial?depth:POLICY.dailyNets);
  $('runbulletin').innerHTML=bulletinHTML({
    /* the strip took its colour from DEPTH — orange at five nets or more — and
       both halves of that are now wrong. orange is no longer a tier colour at
       all, and depth is ten for everyone who finishes, so the band that crowns
       the day was the same band for every completed day ever played.
       it takes the ladder instead, off the one reading the game is scored on:
       under par, level with it, past it — one TIERCOL, canonical on either
       ground, the same rung this day would post on a share plate.
       the reading it takes is the day's RUNGS now, and the two boundaries are
       the only two that are not invented: every net at clean or better takes the
       top band, none of them takes the bottom, anything between takes the middle.
       a threshold anywhere else would be a fourth rule about the ladder that
       nothing else in the game knows. the top band is much rarer than it was —
       any under-par day used to earn it, and a set with nothing wrong in it now
       has to — which is the same correction the headline itself is.
       the silver is gone with it. it meant "a day that was never scored", and a
       set left short IS scored now; a strip saying otherwise would contradict the
       sub directly under it. it cannot reach the top band anyway, because its
       count is out of ten and it did not play ten. a TRIAL keeps dunkelblau: it
       is not a day at all, and is the one thing here still worth a plate colour
       of its own. */
    strip: trial ? '--sig-dunkelblau'
         : rung.good>=rung.of ? TIERCOL.perfect
         : rung.good ? TIERCOL.clean
         : TIERCOL.done,
    title:trial?'out-trained':(depth>=POLICY.dailyNets?'day complete':'day set aside'),
    /* THE CONCLUSION, not the inputs. this line used to read `12 of 12 clean · 57
       turns against par 230` with `against par | 173 under par · 57 of 230`
       directly beneath it, and between the two of them the card stated its
       inputs three times and its answer once, quietly, on the right-hand end of a
       row whose label repeated the line above. 57, 230, the depth and the words
       "against par" were each on the card twice.
       so the sub takes the answer — the day's score, the single reading the whole
       set was played for — and the row below takes the figures it was worked out
       from, once. the strip is already drawing the same answer as a rung, so this
       is that rung in words, which is exactly what the net card's sub does with
       its tier.
       THE ANSWER IS THE RUNGS NOW, not turns against par — see rungCount for the
       flaw that moved it — so the pairing is simply re-pointed: the sub says how
       many of the day came in at clean or better, and the row under it says which
       rungs those were. turns against par went to .bquiet, which is where the
       clean count used to sit; the two of them swapped places, and the card's
       shape is untouched.
       a SHORT set no longer needs a line of its own here. the count is out of the
       DAY rather than out of the run, so a set left short reads on the same scale
       as a finished one; how far it got is the numeral in the corner, the
       denominator in .bquiet, and the title above. */
    sub:trial?'time trial · the net kept learning':rungText(rung),
    num:String(depth).padStart(2,'0'),
    /* one row: what the answer above was made of, said once. the three rungs in
       the ladder's own order, and `done` is named rather than left as the
       remainder — the set is ten and the reader should not have to subtract to
       find where the other six went.
       a trial has no par, so its row is the only comparison it has: this descent
       against the deepest you have ever gone. it used to print `depth reached`
       too, which is the numeral in the corner of the same card spelled out; and
       when this run IS the best, bestTrialDepth has already been raised to match
       it, so the row would have said the same number twice over. it names the run

    rows:trial
      ? [['best time trial', (store.meta.bestTrialDepth||depth)>depth
            ? (store.meta.bestTrialDepth)+' nets' : 'this run']]
      : [['rungs',rungWords(rung,' · ')||'none yet']],
    /* ten, not eight. the stamps stepped down to 58px with the rest of the card
       and five of them now fit a row, so eight drew a five and a ragged three
       with a hole beside it — the exact break the net card's own sizing note is
       about. two full rows say more and cost the same height, and a finished day
       frees about fourteen of the sixteen, so there is always more to show. */
    body:(feats.length?`<div class="minted">${feats.slice(0,10).map((k,i)=>{
      const b=store.collection.badges[k]||{tier:'over'};
      return `<div class="mb" style="--i:${i}">${featureStamp(k,b.tier,false)}<span>${k}</span></div>`;
    }).join('')}</div>`:'')
    /* the quiet line, and PAR IS NO LONGER IN IT. `57 turns against par 62` was
       the last place in the game that spoke par as a RESULT, and it had been
       demoted twice already — off the record's head, off the best-day line, off
       the day rows — each time on the same argument, which is that the day is
       scored in rungs and a second scoring language beside it is one the reader
       has to reconcile. it survived here as "the reading with fine resolution",
       and that was true and beside the point: nobody was asking this card to

/* hideVeils takes the question down too — it is a `.veil` and would be caught by
   the selector anyway. what it must not do is take it down SILENTLY: a caller
   awaiting an answer that never arrives is a run that stops halfway through
   changing, which is worse than either answer. so it goes through closeAsk,
   which resolves first and hides second. */
function hideVeils(){
  closeAsk(false);
  document.querySelectorAll('.veil').forEach(v=>v.classList.remove('show'));
}

/* ================= asking =================

   `confirm()` was the only thing in this game the game did not draw. it is
   titled "akibwa.com says", it is sentence case in the system face, its buttons
   are the OS's in the OS's order, and none of it is reachable from the
   stylesheet — so the one moment the game asks the player to decide something
   was the one moment it stopped looking like itself. see .askveil.

   WHAT IT COSTS. `confirm()` is synchronous and returns a boolean; this returns
   a promise, and every caller has to await it. that is not a mechanical change,
   because the game keeps running while the card is up, so between the question
   and the answer the run can move. two things make that safe here and both are
   inherited rather than invented:
     - the card is a `.veil.show`, and descentTick and retangleTick — the only
       two loops that WRITE run state on a timer — both already bail on
       `.veil.show`. so the run is frozen for exactly as long as the question is
       open, the same way it is under the record or the rules.
     - dragging is guarded on `.veil.show` too, so no move can be made behind it.
   what is NOT frozen is anything a caller started before it asked, so a caller
   that cares must re-check after the await. the day offer was the one that did,
   and it is a straight press now — see openDay — which leaves `reset` as the
   only caller and nothing for it to re-read, since it wipes the save whatever
   the run has been doing meanwhile. the obligation is not gone, it is unclaimed:
   the next caller reading a stored fact across the await inherits it.

   ONE AT A TIME. a second question supersedes the first and the first resolves
   FALSE — an unanswered question is a no, which is the answer that does nothing.
   every way this card can close resolves: the buttons, escape, a click beside
   it, hideVeils, and being superseded. there is no path that leaves a caller
   waiting on a card that is no longer on screen.

   A TEXT ENTRY GOES IN `body`. bulletinHTML already takes arbitrary html there
   — it is where the cleared card puts its stamps — so a card that asks for a
   restore code is an `<input>` in `body` plus a `value()` reading it at confirm
   time, and nothing here changes shape to allow it. */
let askResolve=null, askReturn=null;
function closeAsk(v){
  if(!askResolve) return;
  const done=askResolve; askResolve=null;

function askKeys(e){
  if(e.key==='Escape'){
    /* escape cancels the QUESTION and nothing behind it. the global handler
       lower down dismisses every open veil, which with this card up would take
       the record down with it and leave the player two screens from where they
       were. stopping propagation in the capture phase is what keeps this one
       key from meaning two things at once. */
    e.preventDefault(); e.stopPropagation(); closeAsk(false); return;
  }
  if(e.key!=='Tab') return;
  const f=[...$('askbulletin').querySelectorAll('button,input,select,textarea,a[href],[tabindex]:not([tabindex="-1"])')]

  if(!f.length) return;
  const first=f[0], last=f[f.length-1];

  // adrift entirely — which is where focus is the moment the card opens
  if(!$('askbulletin').contains(document.activeElement)){ e.preventDefault(); (e.shiftKey?last:first).focus() }

}
function ask(o){
  // superseded, not stacked: the older question resolves false and gives up the

  closeAsk(false);

  $('askbulletin').innerHTML=bulletinHTML({
    // the game speaking rather than a reading of the board — see bulletinHTML
    strip:FLAG,
    title:o.title, sub:o.sub||'', num:'',
    rows:o.rows||[], body:o.body||'', note:o.note||'', sun:false,
    /* the confirm leads and the cancel follows, the same order and the same two
       idioms as the card that ends a net. what moves is the WEIGHT: on an
       ordinary question the block of ink is the thing you came to do, and on a
       destructive one it is the way out. either way the keyboard starts on the
       cancel, so a return pressed on reflex costs nothing. */
    actions:`<button class="wbtn${o.danger?'':' solid'}" id="askyes">${o.yes}</button>`
           +`<button class="wbtn${o.danger?' solid':''}" id="askno">${o.no||'not now'}</button>`

/* a feature at icon size: the emblem without the stamp frame or the perforation,

    ? `<path d="M0 0H23L0 23Z" fill="var(--surface)"/>`
      +`<path d="M23 0L0 23" fill="none" stroke="var(--sig-rosa)" stroke-width="4"/>`
    : '';
  return `<svg class="rfeat" viewBox="0 0 96 96" role="img" aria-label="${k}" style="--emblem:var(${d.c})">

const MONTHS=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];

/* four prototypes have written playedDays now: bare iso strings, {d,depth}, the

   all, which reads as an absence — which is what it is. */

  const out=new Map();

    const prev=out.get(r.d);

/* the spine of the screen: TODAY AND YESTERDAY, newest first, played or not,

   version is sold on. the owner cut it to the two free days knowing exactly
   that, so what is left is a record of where you are standing rather than a
   shop you walk through. THE STORED ROWS ARE UNTOUCHED: this decides which days

     that" was agreed to.

     already written rather than by an exception. same guard as the trial's: a
     trial is not parked (it has nothing to come back to), an archive day is not
     parked (it is not the day's set), and a finished set is not parked (it is
     already banked in the record).

     and the day's row are written as you go. */
  const leaving=R();
  if(leaving && leaving.mode!=='trial' && !leaving.archive
     && leaving.day!==iso && leaving.cleared.length<POLICY.dailyNets) store.parked=leaving;
  newRun('daily',iso);
  builtFor=-1; resetDescent(); save(); hideVeils(); renderAll();
  /* THE ONLY THING THAT SAYS WHAT JUST HAPPENED, now that no card said it in
     advance — and it lands after hideVeils, on the board it is talking about,
     because showVeil clears the say card and a message under a veil is a
     message nobody reads. it names the day either way: today's ten by their
     name, an archive day by its date plus the one thing playing it does not do,
     which is the sentence the card used to carry as a caveat. */
  flashMsg(iso===today()?'today\'s net':'playing the archive · '+dayLabel(iso)+' · this does not extend a streak');
}
/* the day's score, golf style: turns against par across the ten. negative is
   under par and good.
   IT IS NO LONGER THE HEADLINE — the day's rungs are, see rungCount — and it is
   kept rather than deleted because it is still true and still the only reading
   here with fine resolution. the rungs are lumpy: a net missed by one turn and a
   net missed by nine both say `done`, and two days that both post `8 of 10` are
   separated by nothing else. so it survives as the SECOND reading, in the slots
   it already had — the card's quiet line, the plate's corner, the share text,
   and the tiebreak in stampToday's guard — and leads nowhere.
   the ten-net floor stays with it. a partial differential really is meaningless:
   two nets at three under is not a round. a partial COUNT is not, which is why
   rungsOf has no such floor. */
/* the score says which side of par it is IN WORDS, because a bare sign cannot.
   it used to render `+3` / `−8`, and three things were wrong with that. the
   minus sign U+2212 is a stroke away from the em dash used for "no data", at
   13px and in the same slot — so a new player's record read `— best day` and
   looked like a negative score. golf's red-for-under convention would have
   disambiguated it, except this palette has no red and WCAG forbids colour as
   the sole carrier anyway. and a signed number needs the reader to already know
   which direction is good; "8 under par" needs nothing. the spoken form of the
   game's own scoring was always the answer. */
function fmtScore(n){ return n>0 ? n+' over par' : n<0 ? (-n)+' under par' : 'level par' }
/* the same reading split, for the one place that sets the figure large and the
   words small beside it */
function scoreParts(n){
  return n>0 ? {fig:String(n), word:'over par'}
     : n<0 ? {fig:String(-n), word:'under par'}
           : {fig:'level',     word:'par'};
}
/* a day only has a score if it has both halves stored and the set was actually
   finished — ten nets. two nets at three under is not a round. */
const dayScore=r=>(r && r.turns!=null && r.par!=null && (r.depth||0)>=POLICY.dailyNets)
  ? r.turns-r.par : null;

/* what a stored day says about itself, in the two parts the record sets large
   and small. every day since the rungs started being stored can answer in the
   current measure, which is most of the record and all of it from here on.
   A ROW WRITTEN BEFORE THEM FALLS BACK TO ITS SCORE rather than to nothing. it
   still has its turns and its par, and that reading was demoted rather than
   deleted — so an old row goes on speaking a language the game still speaks,
   instead of a fortnight of somebody's history quietly turning into `10 of 10
   nets` because the game changed its mind about how to read it.
   `key` is bigger-is-better in BOTH kinds so a caller can sort without knowing
   which it got. the two are never compared against each other: they are not the
   same unit, and bestReading picks a kind before it ranks anything. */
function dayReading(r){
  const g=rungsOf(r&&r.tiers);
  /* the rungs travel with the reading. the record's head draws the day's ten as
     a bar under the figure, and the figure can be today's or the best day's —
     so whichever day wins has to carry its own cells with it rather than have
     the head go back to the rows and guess which one it just showed. the older
     measure has no cells to carry: a row scored in turns against par never
     stored a rung, and an absence is drawn as an absence. */
  if(g) return {...rungParts(g), rungs:true, key:g.key, tiers:r.tiers};
  const s=dayScore(r);
  if(s==null) return null;
  return {...scoreParts(s), rungs:false, key:-s};
}
/* the best day in the record. rungs if ANY day can be read in rungs, so one
   ancient row cannot win a comparison it is not even in; the older measure only
   if nothing in the whole record has rungs at all, which is a save that has not
   been played since they landed.
   IT SCANS THE WHOLE OF playedDays and always did — `rows` is dayRows(), not
   the record's list — which is why it still answers over years of history now
   that the list itself is two days. it carries the DATE of the day that won,
   because that day is usually no longer a row you can look at, and a best
   figure with no day attached is a number rather than a memory. */
function bestReading(rows){
  const all=rows.map(r=>{ const x=dayReading(r); return x?{...x,d:r.d}:null }).filter(Boolean);
  const g=all.filter(x=>x.rungs);
  return (g.length?g:all).sort((a,b)=>b.key-a.key)[0]||null;
}
/* the record's long memory, at the foot of a list that is now two days long.
   without it the card cannot say a longer record exists at all: the days that
   made it scrolled out of the list when the list stopped holding them, and the
   head is today by definition. it names the DATE for that reason — the date is
   the only trace left of the days that are no longer rows.
   it is drawn only when the best day is NOT today. the head already says
   today, and setting the same figure twice on one card is the tautology this
   screen has deleted three times over — see the note on `10 nets · ` in the
   row detail, and bestDepth before it.
   the date is guarded rather than trusted: a save is the one input nothing can
   validate, and dayLabel on a row whose `d` is not a date prints `undefined
   nan`, which is exactly what this screen just stopped doing upstairs. a
   reading with an unreadable date keeps the reading and drops the date. */
const isIso=d=>typeof d==='string' && /^\d{4}-\d{2}-\d{2}$/.test(d)
  && !Number.isNaN(new Date(d+'T00:00:00').getTime());
function bestLineEl(best){
  const el=document.createElement('div');
  el.className='daybest';
  const when=isIso(best.d)?dayLabel(best.d):'';
  /* THE READING CAME OFF THIS LINE and the date stayed. it read `your best day ·
     fri 14 aug · 7 of 10 clean or better`, which is three things where the line
     only ever answered one: WHICH day was your best. how well it went is drawn
     in that day's own row, in the ten cells, in the colours the whole game
     scores in — and on a two-row list the row is usually still on screen.
     `bestReading` has not gone anywhere and is not doing less work: ranking the
     days is exactly how this line knows which date to print. it just stops
     printing the number it ranked them by. */
  el.innerHTML='<span class="dbtext">your best day</span>'
    +(when?`<span class="dbwhen">${when}</span>`:'');
  return el;
}

/* the purchase's one line, in its two states — ONE element, because they are
   the same fact seen from either side of the payment: what you hold, or the way
   to claim what you already paid for. `restore` is a link in the quietest ink on
   the card rather than a field: a way through, not the subject.
   IT NO LONGER SELLS ANYTHING. it used to lead with a count of the shut days and
   an `unlock`, and it stood on the first shut row — where the wall started. the
   record shows today and yesterday now, so there is no wall and no count to
   make; the offer moved wholly to the cleared card's runOverOffer, which is one
   screen and one place the archive is asked for rather than two.
   what could NOT move is `restore`, and it nearly went out with the offer it was
   standing next to. this was its only door in the whole game: a player who bought
   anonymously on their phone gets across to their laptop by typing the code, and
   deleting the line that carries it would have sold a purchase with no way to
   claim it on a second device. `beginUnlock` had two doors and kept the other
   one; this had one. */
function archiveLineEl(){
  ensurePrice();     // redraws this card if the answer arrives after it
  /* HELD, AND NOTHING TO SAY ABOUT IT. this drew `full version · the archive and
     the time trial` across the top of a buyer's record every time they opened
     it — a label telling somebody what they already bought, on the screen they
     came to for something else. the entitlement announces itself by the archive
     working.
     the CODE is the exception and it is why this can still draw at all: it is
     what a buyer types on a second device, and this line is its only home in the
     whole game. so a buyer with a code gets the code, a buyer without one gets
     nothing at all, and the caller handles the nothing. */
  if(POLICY.premium && !acct.code) return null;
  const el=document.createElement('div');
  el.className='dayarch'+(POLICY.premium?' held':'');
  if(POLICY.premium){
    el.innerHTML='<span class="datext">on another device</span>'
      +`<span class="dacode" title="type this on another device to open it there">${acct.code}</span>`;
  } else {
    /* the link is only drawn when there is somewhere for it to lead. a copy
       opened off a disk has no api and no code to check one against, and an
       offer that answers "not from here" is worse than no offer — the same rule
       the till puts on `unlock`, asked of the thing restore actually needs. */
    el.innerHTML='<span class="datext">bought the full version already?</span>'
      +(API
        ? `<a href="#" class="archlink" data-restore="1"`
          +` title="enter the code from the device you bought it on">restore</a>`
        : '');
  }
  el.onclick=e=>{
    if(e.target.closest('[data-buy]')){ e.preventDefault(); beginUnlock() }
    else if(e.target.closest('[data-restore]')){ e.preventDefault(); restoreUnlock() }
  };
  return el;
}
/* the month spine that stood here is gone with the long list it was a spine
   for. it existed so a year of rows could be found in — the saturday you missed,
   without counting rows — and a list of today and yesterday, each writing its
   date in full, has nothing to navigate. on the first of a month it would have
   drawn a header per row. see the note in openRecord where it was called. */

/* ---- the foot: whose record this is ----
   drawn from three things and nothing else: whether this deployment has any
   sign-ins at all, whether this browser is signed in, and what the last sync
   said. it renders SYNCHRONOUSLY from whatever is known and then asks — a card
   that pops a row in half a second after opening is worse than one that grows a
   row the first time you open it, and both beat blocking the screen on a fetch
   that may be answering from a plane. */
function renderAccount(){
  const foot=$('recfoot');
  if(!API || (signIns && !signIns.length)){ foot.hidden=true; foot.innerHTML=''; return }
  if(!signIns){                            // first look on this session
    foot.hidden=true;
    askSignIns().then(()=>{ if($('histveil').classList.contains('show')) renderAccount() });
    return;
  }
  foot.hidden=false;
  const link=(id,text,label)=>`<a href="#" class="acctlink" id="${id}" aria-label="${label}">${text}</a>`;

  if(account&&account.signedIn){
    /* who, in the plainest terms available, and in this order: the name they
       chose, then the address — which is how you know WHICH google you are on —
       then the provider, which is all there is for a facebook account
       registered by phone or an apple one whose relay we were never given.
       the whole saying is the way back into the card, because "that is not the
       right account" and "I want to change that" are the same press. */
    const who=account.nickname||account.email||('your '+(account.provider||'')+' account').trim();
    const state=syncSay==='saving' ? '<span class="acct-state">saving</span>'
              : syncSay==='offline' ? '<span class="acct-state">offline · will send later</span>'
              : syncSay==='saved' ? '<span class="acct-state">saved</span>' : '';
    foot.innerHTML=`<button class="acct-who acct-say" id="acctwho" title="your account">signed in · ${esc(who)}</button>${state}`
      +`<span class="acct-ins">${link('acctout','sign out','sign out of this device')}</span>`;
    $('acctwho').onclick=()=>openAccount('manage');
    $('acctout').onclick=e=>{e.preventDefault();doSignOut()};
    return;
  }

  /* signed out. the line says what is TRUE rather than what is on offer: this
     record is on this browser and nowhere else, which is the fact that makes
     signing in worth doing and which nobody is otherwise ever told.
     it is four words because of the phone. the three names and their lead-in
     are fixed width and must never be the thing that gives — a control you
     cannot read is worse than a sentence you cannot finish — so at 375px it is
     the saying that ellipses, and a longer one ellipsed mid-thought. the card
     is titled "the record" a few lines above, so "kept" needs no subject. */
  const names={google:'google',apple:'apple',facebook:'facebook',email:'email'};
  foot.innerHTML=`<span class="acct-say">kept on this device only</span>`
    +`<span class="acct-ins">sign in${signIns.map(p=>
        link('acctin-'+p,names[p]||p,'sign in with '+(names[p]||p))).join('')}</span>`;
  signIns.forEach(p=>{
    const el=$('acctin-'+p);
    if(el) el.onclick=e=>{e.preventDefault();goSignIn(p)};
  });
}

/* ---- the one screen, in two views ----
   the days answer "what did i do on the 11th"; the collection answers "which
   have i still not found". neither can answer the other's question, and they
   want the same inches, so they take turns.
   it is deliberately NOT remembered across sessions. the record is opened to
   see how today went far more often than to look at the set, so a player who
   browsed the collection once should not meet it every morning afterwards; the
   toggle is one press from wherever you land. it DOES survive a redraw within
   a session — a theme flip, an entitlement arriving — because the alternative
   is the card silently changing subject under a player who is reading it. */
let recView='days';
function openRecord(){
  const d0=today(), rows=dayRows();
  const keep=$('daylist').scrollTop;          // a theme flip redraws this whole screen

  /* ---- the one number worth keeping ----
     derived, not stored: every day row carries its own turns and par, so the
     best round is a scan rather than a field that can drift out of step with
     the rows it claims to summarise. best DEPTH is gone — a day is a fixed set
     of ten that cannot be failed, so depth is ten for anyone who finishes and
     says nothing whatever about how well they did. */
  const best=bestReading(rows);
  const badges=store.collection.badges||{};
  /* ---- THE HEAD SAYS NOTHING ABOUT TODAY ANY MORE ----
     it drew today's score as an instrument: a figure, two clauses, and the
     day's ten rungs on a track underneath. the figure was right and the place
     was wrong. today's row is the FIRST row of the list, two inches below,
     drawing the same ten rungs about the same day — so the card stated one
     number twice in two forms, and the larger of the two sat where a title bar
     goes on a screen whose subject is the list.
     it also had to invent an empty state. before the morning's run there is no
     score, so the head said `10 nets today · not played yet` over ten bare
     cells — a whole instrument reporting that nothing had happened yet. the
     row says `not played yet` on its own and needs no instrument to do it.
     nothing was lost with it. the score is in the rows where it is attached to
     its day, `bestLineEl` still names the best one at the foot, and the head is
     now a title and the ways out, which is what a title bar is. */

  /* the way to the full version, and it is the same gate the cleared card's
     offer uses — `canBuy()` is true only when a till has answered. a copy of
     the game opened off a disk has no api at all and gets no button, which is
     the rule the whole account block already follows: an unlock that answers
     "not from here" is worse than no unlock.
     already bought is not a reason to draw it either. `archiveLineEl` at the
     top of the list is what speaks to a player who holds the full version, and
     it carries the restore code with it. */
  const buy=$('histbuy');
  buy.hidden = POLICY.premium || !canBuy();
  buy.onclick=e=>{ e.preventDefault(); beginUnlock() };

  /* ---- the collection ----
     a found feature wears its plate with a band in the tier it was minted at;
     an unfound one is a hairline square with a cross in it, which says
     unidentified without giving the sign away.

     it answers the one question a list of days structurally cannot — which
     features have I never seen — and as a strip above the list it USED to
     retire the moment the set filled, on the argument that a full row of plates
     is a collection display in a game not scored on collecting. that argument
     was right about a strip and wrong about a collection: the thing it deleted
     at the moment of completion is the thing a player would want to look at.
     it is a view of its own now and it stays, full or not.

     THE COLUMN COUNT IS NOT COMPUTED HERE ANY MORE. it was
     ceil(sqrt(FKEYS.length)), set on the element from this function, which kept
     the grid square at any cast and made the width of the card's whole subject
     move whenever a feature was added. it is a flat seven in the stylesheet
     now — see .collection for why — and this loop draws ONLY the features that
     exist, so the caption below and the cells above it are counting the same
     set. nothing here needs to change when the cast grows. */
  const named=FKEYS.filter(k=>badges[k]).length;
  const grid=$('reccollection');
  /* the caption leads with what is LEFT, which is the only half with anywhere
     to go, and falls back to the total once nothing is. a line reading `0 still
     to identify` is a counter that has stopped, and this card has deleted two
     of those already. */
  const left=FKEYS.length-named;
  grid.innerHTML=`<p class="colcap">${left
      ? `${left} of ${FKEYS.length} still to identify`
      : `all ${FKEYS.length} identified`}</p>`
    +FKEYS.map(k=>{
      const b=badges[k];
      return b
        ? `<span class="fcell" style="--tc:var(${tierCol(b.tier)})" title="${k} · ${b.tier}">${featIcon(k,b.tier)}</span>`
        : `<span class="fcell none" title="unidentified"><svg viewBox="0 0 96 96" role="img" aria-label="unidentified feature">`
          +`<g fill="none" stroke="currentColor" stroke-width="7"><path d="M30 30L66 66M66 30L30 66"/></g></svg></span>`;
    }).join('');

  /* ---- which of the two views is up ----
     the days and the collection are one card, so only one of them is in the
     flow at a time — both are `flex:1 1 auto` in a fixed-height column and
     showing both would give each half a card and a scrollbar. the button says
     where it GOES, not where you are, which is the way every other control in
     this game is labelled. */
  /* which of the two readings this card is showing. `recView` is still the
     switch and is still module state — what went is the head's toggle that used
     to flip it: the top bar has a mark for each view now, and each one sets this
     before opening (see collbtn and histbtn). so this reads the choice and draws
     it, and nothing on this card changes it. */
  const dayEl=$('daylist');
  dayEl.hidden = recView!=='days';
  grid.hidden = recView!=='collection';

  /* ---- the days ----
     TODAY AND YESTERDAY. it was every day since launch, shut ones included,
     because the backlog was what the full version sold and a shut day drawn as
     a row is a thing where "12 earlier days" is only a word. the owner cut it
     anyway and with the consequence in front of him: the archive stops being a
     surface here, and this screen stops selling it. the offer is not gone from
     the game — the cleared card's runOverOffer still makes it, on the one
     screen where a player has just finished the thing being extended — but it
     is gone from the record, and that is the trade that was chosen.
     what is left is the two days you can actually play, which is also all this
     list ever showed a free player that they could press. the archive line, the
     month spine and the shut row went with the tail; see below for each.
     nothing is hidden by it. the days that scrolled away are still in the save,
     still counted by the streak, and still read by the best day at the foot. */
  const list=$('daylist'); list.innerHTML='';
  const days=allDays();
  days.forEach(({d,row})=>{
    const played=!!row, canPlay=canPlayDay(d), isToday=d===d0, locked=isShut({d,row});
    /* A DAY YOU HAVE HAD YOUR RUN AT. it is the other way a row can be closed,
       and the two never appear together: `locked` is a day in the archive you
       never played, and this list holds today and yesterday, neither of which
       is ever in the archive. so on this screen a played day you cannot play is
       a spent one, and there is nothing else it could be.
       WHAT IT DRESSES IS THE CHIP AND NO LONGER THE ROW. it used to wear the
       shut idiom whole — dashed keyline, date a step back in ink — which said
       "this day is not available to you" about a day the player had just
       finished. that is the free tier drawn as a loss, and it is not one: the
       day was played, the row is the record of it, and nothing about it is
       withheld. the one thing that IS withheld is the replay, so the replay is
       what carries the mark. the row keeps only the half of `.spent` that was
       about behaviour rather than about ink — it must not promise a run under
       the pointer — and see .dayrow.spent for that. */
    const spent=played && !canPlay;

    /* the archive line stood here, on the first shut row, where the wall
       started. there is no shut row in a list of today and yesterday, so there
       is no wall for it to introduce and it is not drawn among the rows at all.
       it is not gone — it lost the selling half and kept `restore`, and it is
       drawn once at one end or the other of the list; see the two calls below.
       the month spine went the same way and for the same reason: it existed so
       a year of rows could be navigated, and two rows that both write their
       date in full navigate themselves. it would have drawn a header per row on
       the first of a month, which is a spine with nothing to hold up. */

    /* THE DAY'S BEST RUNG, and it no longer draws anything — the spine it used
       to colour is a date mark now, see DAYSPINE. what it still does is speak:
       the row's aria-label names the best tier, because a screen reader gets no
       bar and no cells and this is the one word that says how the day went.
       it stays null on a played day with no recorded rung rather than falling
       back to `over`, which TIERCOL paints identically to `done` — that is a
       legacy save shape, and a label claiming a score nobody played for is the
       same lie in words that the spine used to tell in colour. an absence is
       said as an absence. */
    const tier=played?(row.best||null):null;
    const el=document.createElement('div');
    el.className='dayrow'+(isToday?' today':'')
      +(locked ? ' shut' : played ? ((row.back?' back':'')+(spent?' spent':'')) : ' open');

    let det, right='';
    /* how hard the day is, on any archive day you have not played — whether it
       is shut to you or open. it is drawn for the buyer too, and especially:
       they are the one with three hundred days to choose between, so taking the
       reading away at the moment it becomes useful would be exactly backwards.
       never on today or yesterday. today is the day everybody is playing right
       now and being told its difficulty before you start changes the run; the
       archive is a chooser, which is a different question. */
    const best=(!played && inArchive(d)) ? dayBest(d) : null;
    const bestWords=best!=null ? ' · '+best+' turns at best' : '';
    if(locked){
      /* nothing on the right. `play →` is the mark of a day that is open to
         you, and a greyed copy of it on every shut row is the shop repeated
         three hundred times — which is exactly what got these rows deleted
         before. the detail column says where the day is instead, once, in
         words, and the dashed keyline says it again without any ink at all. */
      det='in the archive'+bestWords;
    } else if(played){
      const p=[], rd=dayReading(row);
      /* `one run only` LED THIS COLUMN and is gone. it was the free tier stated
         as a restriction, in the loudest slot the row has, on the one screen a
         free player looks at their own record — and the free tier is not a
         restriction. a new set of ten arrives every day and you play it; that is
         the whole game, finished. the row has no reason to apologise for it.
         what money adds is the replay, and that now has a mark of its own on the
         right of the same row — see the chip below. an addition drawn as an
         addition says the same product fact without the row calling itself
         spent, and it says it to the player who has bought it as well, who
         otherwise had no way to discover the thing they paid for.
         so a played row's detail is what it always was for a buyer: whatever the
         bar beside it cannot say, and nothing when the bar says it all. */
      /* THE BAR, and nothing else on the right of a played row — the same one
         the head draws, at the row's size. see .track.dtrack for what it
         replaced and rungTrack for the drawing.
         a row from any earlier save shape has no rungs and gets NO bar. an
         absence drawn as an absence, which is the answer .dtier already gives a
         day with no recorded rung, and what the height ladder did here before
         it. ten bare cells would be a claim that the day was played and scored
         nothing. `rd.rungs` is the same predicate the words are chosen by, so
         the picture and the reading can never disagree about which they are. */
      const bar=(rd&&rd.rungs)?rungTrack(row.tiers,true):'';
      /* how many nets the bar can actually vouch for. normally the day's depth
         exactly — stampToday writes tiers and depth from one run — but they can
         part on a merged save: worker/merge.js takes depth as the MAX across
         devices while the scored quartet travels off the single winning run, so
         a legacy row that went deeper can leave depth 8 against six letters. */
      const barDepth=bar?Math.min(row.tiers.length,POLICY.dailyNets):0;
      /* the net count only earns its place when the set was left SHORT. it used
         to lead every row — "10 nets · " on 37 of 42 — which is the same
         tautology bestDepth was deleted for: a finished day is always ten, so
         the most repeated string on the screen carried no information and stood
         in front of the one that did.
         a scored day therefore leads with its score. a SHORT set is scored too
         now — the rungs count out of the day rather than out of the run, see
         rungCount — so it leads with the same reading. a row too old to read
         either way simply says it happened.
         the bar one column over draws the same rungs as a picture, and that is
         the pairing the cleared card already makes: the strip is the answer as a
         mark, the words are the answer as a reading. what neither the bar nor a
         glance can give is the COUNT, which is the whole measure — and the bar
         made that MORE true, not less: it has no divisions, so four cleans in a
         row are one turquoise length and cannot be counted off at all.

         THE READING CAME OFF THE ROW AND THE BAR TOOK THE SPACE. the argument
         above is still true — a length cannot be counted off — and it is
         answered by giving the picture enough room to be read as a proportion
         instead of a caption: the bar was 92px in the corner of a row whose
         middle held its own restatement in words, and it took the room those
         words were using. it is 240 now rather than the whole of it, which is
         still two and a half times the old measure and no longer the largest
         object on the card; see .track.dtrack. filled against bare says how far
         the day got, and the colours say how it went, which is what the whole
         card is scored in.
         WHAT THIS COSTS, stated rather than discovered: colour is now the only
         VISUAL carrier of the count. turquoise against violet measures 1.43 in
         greyscale, so a screenshot, a monochrome panel or anyone whose cones do
         not part those two gets the length and not the breakdown. the row's
         aria-label still spells the rungs out in words, so nothing is lost to a
         screen reader — but a sighted reader who cannot separate the two hues
         has lost a reading they had. the owner asked for the bar and this is
         the trade it carries. */
      /* CUT once the bar is there. `6 of 10 nets` is filled length against bare
         length, which is the masthead's own reading for the day ahead and the
         one thing here a picture says better than a clause. it comes back the
         moment the bar cannot say it — no bar at all, or a bar that does not
         reach as far as the day did. */
      /* THE ONE READING THE BAR CANNOT GIVE, and the deliberate exception to the
         rule above that a played row says only what the bar cannot. the bar CAN
         be read — ten gelb cells and the cut across them — but only against the
         other rows, and on a record two days long there may be nothing to
         compare it to. the word is absolute where the picture is relative.
         it is also the rarest thing this column will ever print. `one run only`
         was cut from here for leading 37 rows in 42; this leads a row on the
         days a player takes all ten at the solver's own line, and says nothing
         at all on every other. that is the opposite failure mode, which is the
         one a detail column is for. */
      if(isFlawless(row.tiers)) p.push('flawless');
      if(row.depth && row.depth<POLICY.dailyNets && barDepth<row.depth)
        p.push(row.depth+' of '+POLICY.dailyNets+' nets');
      if(!rd && row.moves!=null) p.push(row.moves+' turns');
      if(row.mode==='trial'&&row.trialDepth) p.push('time trial · depth '+row.trialDepth);
      /* filled in from the archive rather than earned on the day. it counts
         toward the record and never toward the streak, and says so.
         it STAYS, though it was looked at with the net count: the bar does not
         say it, and cutting what the bar does not say is how the row ends up
         with a fact carried only by 7px of 45° hatching on the .dtier spine —
         a mark with no legend anywhere on the card. it is also the one thing
         here that is about where the day came from rather than how it went,
         which is why no reading can absorb it. */
      if(row.back) p.push('archive');
      /* `played` was the fallback when nothing else needed saying, and with the
         reading gone that is now the ordinary case rather than the odd one — so
         every finished day would carry a word that the bar beside it, and the
         date, and the tier spine already make unmistakable. a row with a bar
         says nothing in words unless it has something the bar cannot say. a row
         with NO bar still says `played`, because there it is the only evidence
         the day happened at all. */
      det=p.join(' · ')||(bar?'':'played');
      /* ---- the replay, drawn on every played row ----
         it is a glyph and not the word `replay` because it sits at the end of a
         row that already carries a date, possibly a clause, a ten-cell bar and
         now a count: a text object saying `replay` is the crowding the bar was
         narrowed and the count was abbreviated to escape. the
         arrow is a true circular arc, which is the one curve this palette
         allows, and it is `.dstate` at every other measure so a row's two
         possible chips are the same object at the same size.
         EVERYONE GETS IT, and that is the change. it used to be drawn only where
         the day could actually be replayed, which meant the two players who most
         needed to see it saw nothing: the buyer, for whom a replayable row
         carried no mark a non-replayable one lacked, so the thing they had paid
         for was reachable and undiscoverable; and the free player, whose row
         instead said `one run only` and dressed itself as spent, which is the
         free tier drawn as a punishment rather than as the complete game it is.
         so the chip is the product, present on the row either way, and the only
         difference is whether it is yours yet.
         LOCKED IS DASHED AND NOTHING ELSE — see .dreplay.shut, and .wbtn.shut
         before it. no lock glyph and no field: a lock on a day you PLAYED reads
         as a day taken away from you, and a saturated field on a row is the mark
         that got the archive rows deleted the first time. pressing it is the
         row's own press, which answers in words and never opens a checkout. */
      right = bar
        + `<span class="dstate dreplay${canPlay?'':' shut'}" aria-hidden="true"`
        +` title="${esc(canPlay?'play this day again':replayWords())}">&#8635;</span>`;
    } else {
      det=(isToday?'not played yet':'not played')+bestWords;
      right='<span class="dstate">play →</span>';
    }

    /* ---- the spine is a DATE mark now, not a score one ----
       it drew TIERCOL[row.best] — the best rung the day minted — which is the
       maximum of a set the bar two columns over already draws in full, all ten
       of them, in the same three colours. a summary of a thing shown complete,
       three inches from it.
       so it goes decorative, and the owner asked for that. THE COLOURS ARE THE
       THREE THAT ARE NOT RUNGS, and that is the whole of the care needed here:
       gelb, tuerkis and violett mean perfect, clean and done everywhere in this
       game, so cycling all six would put a gelb spine against a bar whose gelb
       cell means something — a false signal, at a glance, on the screen where
       the reading matters most. hellblau, gruen and orange are never rungs, so
       a spine cannot be misread as one however pretty it gets.
       keyed on the date rather than the row's position, so a day's colour is a
       property of the day: it does not shuffle when the list gains a row, and
       the same date is the same colour on every device. */
    el.innerHTML=`<i class="dtier" style="--tc:var(${DAYSPINE[dayOrd(d)%DAYSPINE.length]})"></i>`
      +`<span class="ddate">${dayLabel(d)}</span>`
      +`<span class="ddet">${det}</span>`
      +right;
    // the cells are aria-hidden, so the tiers go into the label as words instead
    const words=played?tierWords(row.tiers):'';
    /* the replay chip is aria-hidden — it is a glyph, and a screen reader
       announcing `clockwise open circle arrow` inside a row that is itself the
       button is worse than silence. so the row's own label carries what the
       chip means, which is the same division `dayCells` and this label already
       make: the picture is hidden and the words say what it drew.
       BOTH of its states, now that it has two. a dashed keyline is not a thing a
       screen reader can be given, so the label is where the locked chip says in
       words what the drawing says in ink — and it says it in the same sentence
       the press and the tooltip use, so the three cannot drift. */
    /* JOINED FROM THE PARTS THAT EXIST, rather than concatenated around a `det`
       that is assumed to. `det` is empty on an ordinary played row now — the bar
       says what it used to — so the old form read `sat 15 aug ·  · 2 perfect`,
       with an empty segment a screen reader pauses twice for.
       the attempt count is the ONE reading here that is drawn as a mark and said
       as words rather than being a picture of the words: `×3` carries no unit,
       so this is where the unit is — and it is said in the same order the row
       draws it, after how the day went and before what pressing it does. `>1` is
       the same test the mark is drawn by, so the label and the row cannot
       disagree about whether the day was replayed. */
    const label=[dayLabel(d), det, played&&tier?tier:'', words,
                 played?(canPlay?'play again':replayWords()):''].filter(Boolean).join(' · ');
    el.setAttribute('aria-label',label);
    /* only a row you can actually do something with is a control. a shut row
       answers a press by naming its price, which is a courtesy and not a
       control — making three hundred of them tab stops would put the whole
       archive between the keyboard and the rest of the card, to reach a reading
       the `unlock` link right above them already gives. the label still says
       where the day is, so nothing is hidden from a screen reader.
       a SPENT row is not a control for the same reason and by the same test —
       canPlay is the whole of it, and it now answers the money and the one run
       a day alike. */
    /* THE DATE IS ALL IT TAKES NOW. the row used to hand the day its own stored
       readings too — the rungs it had drawn and the first run it was keeping —
       because the card openDay put up drew both and had no business reaching
       back into playedDays for a day it was told about. there is no card, so
       there is nothing to draw them on — and the rungs were never only there,
       since this row draws them itself. see openDay. */
    const offer=()=>openDay(d);
    if(canPlay){
      el.setAttribute('role','button'); el.tabIndex=0;
      el.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); offer() } };
    }
    el.onclick=()=>{
      if(canPlay) return offer();
      /* it names the day you just pressed and what opening it costs, and stops
         there. the line above is the way through; a row that went straight to a
         payment page would make three hundred accidental tap targets out of a
         list whose whole purpose is browsing.
         THIS IS ALSO THE LOCKED CHIP'S PRESS. the chip is a span inside the row
         and not a control of its own, so a tap on it arrives here — one handler,
         one sentence, and no way for the mark and the answer to disagree. it is
         why the chip needs no listener and why it can never open a checkout: the
         only thing on this screen that could is the row, and the row says words.
         a SPENT day is a different sentence: it is not in the archive, it is a
         day you have finished, and what the answer names is the replay that
         money adds rather than a run you have used up — see replayWords. telling
         somebody who played this morning that today is archived would be the
         card misreading its own record. */
      const price=priceWords();
      flashMsg(spent
        ? `${dayLabel(d)} · ${replayWords()}`
        : `${dayLabel(d)} · in the archive · unlock${price?' · '+price:''}`);
    };
    list.appendChild(el);
  });
  /* ---- your best day, at the foot ----
     the one reading here that still scans the whole of playedDays, and with the
     list down to two days it is the only thing on the card that knows a longer
     record exists. it took the head's place as the fallback and is better off
     here: over today's score it was a rival, under the days it is the record.
     not drawn when the best day IS today — the head is already saying it — and
     not drawn when there is no readable day at all, where the empty state below
     is the truer thing to say.
     it also gives the list a bottom edge. two rows and then nothing reads as a
     list that stopped loading; two rows and then a closing line reads as all
     there is, which is what it now is. */
  if(best && best.d!==d0) list.appendChild(bestLineEl(best));
  /* ---- THERE IS NO EMPTY STATE, and the list is why ----
     it used to lead with `nothing on record yet. play today's ten and this fills
     in — one day, ten nets, the same ten for everyone.` — two lines in a dashed
     box, above a list that was already showing today and yesterday, each drawing
     ten bare cells and a `play →`.
     so the card said `nothing here yet, go and play` directly on top of the two
     days you can play, both of which say `not played yet` and carry the button
     that starts them. an empty state is for a list with nothing in it; this list
     is never empty, because `allDays()` seeds today and yesterday whatever the
     save holds. the rows ARE the invitation and they are a better one — they
     name the day, draw its bar, and can be pressed. */
  /* the same line, at the two ends it belongs at.
     HELD, it is a receipt and goes at the TOP: it carries the restore code, and
     a buyer looks for that on the morning they get a new phone rather than in
     the course of reading their history.
     NOT HELD, it is the way to claim a purchase made somewhere else, and it goes
     at the FOOT under the days — it is the quietest thing on the card and it is
     addressed to the few people who have already paid, not to the player whose
     record this is. it does not sell anything any more; see archiveLineEl. */
  /* it returns null for a buyer with no code to show — see archiveLineEl, where
     the label went and only the code stayed. */
  const arch=(POLICY.premium||API)?archiveLineEl():null;
  if(arch){ if(POLICY.premium) list.insertBefore(arch,list.firstChild); else list.appendChild(arch) }

  /* the whole screen is written before this and nothing is read back after it.
     there used to be a second pass here: read `clientWidth` off every stamp
     strip in the list — a forced synchronous layout, on a card that had just
     been made visible — to work out how many emblems fitted and where a `+n`
     overflow marker went, mirroring the icon size and gap out of the css into
     two javascript constants that had to be kept in step by hand. a resize
     listener then re-ran the whole of openRecord to do it again.
     a bar of a fixed width fits by construction, so all of that is gone: one
     write, no read, no mirror of the css, and nothing to redo when the window
     changes size — the media query moves the bar's two numbers and the ten
     cells inside it divide whatever they are given. */
  renderAccount();
  $('histveil').classList.add('show');
  list.scrollTop=keep;
}

/* ================= hud ================= */

/* the per-thread crossing counts, in the crossings bay of the masthead. they
   used to be chips floating over the board's last column; see the .threadrow
   css for why they are not a total and why the total is the track instead. */
const STRENGTH=['','faint','clear','dominant'];
function renderThreads(){
  const c=$('threadrow');
  /* rebuild when the thread SET changes, not merely its size: two consecutive
     nets with the same thread count would otherwise keep the old net's slots
     and leave stale counts on screen.
     and rebuild whenever a thread has no slot, whatever the signature says.
     buildNet makes fresh thread objects every time it runs, so rebuilding the
     SAME net — which a relayout, a theme repaint or a replay all do — left the
     row holding slots that belonged to the discarded objects. every live thread
     then failed the `if(!t.slot) return` below and the row quietly stopped
     updating, still showing the counts it had before the rebuild. */
  const sig=R().netIndex+':'+threads.map(t=>t.key).join(',');
  if(c.dataset.done) return;          // a cleared net holds this bay until the next one — see holdGauge
  if(c.dataset.sig!==sig || threads.some(t=>!t.slot||!t.slot.isConnected)){
    c.dataset.sig=sig;
    c.innerHTML='';
    $('field').classList.remove('dimthreads');
    threads.forEach(t=>{
      const b=document.createElement('button');
      b.className='tval'; b.type='button';
      /* the thread's colour goes in as a reference to its token, not as the
         value the token currently holds. a theme flip then repaints it with
         nothing to re-run — the same reason paintCells and paintRun are handed
         var(...) strings rather than resolved ones. */
      b.style.setProperty('--fill','var('+t.col+')');
      /* pointing at a count answers "which line is this one?" by dimming the
         others rather than by fattening its own. the thread's stroke width
         encodes how strongly the feature is represented and is not available
         to say anything else; dimming leaves it alone, and reads better
         besides — one line lit on a quiet board. it also works far better from
         up here than it did from a chip sitting on top of the board. */
      const lit=on=>{
        if(!t.el||!t.el.isConnected) return;
        $('field').classList.toggle('dimthreads',on);
        threads.forEach(x=>{if(x.el) x.el.classList.toggle('lit',on&&x===t)});
      };
      b.onpointerenter=()=>{clearTimeout(t.litT); lit(true)};
      b.onpointerleave=()=>{clearTimeout(t.litT); lit(false)};
      // touch has no hover, so a tap holds it lit long enough to read
      b.onclick=()=>{lit(true); clearTimeout(t.litT); t.litT=setTimeout(()=>lit(false),1100)};
      c.appendChild(b); t.slot=b;
    });
  }
  threads.forEach(t=>{
    if(!t.slot)return;
    const shares=!t.freed&&t.nodes.some(n=>n.merged);
    t.slot.dataset.s=t.strength;
    /* the segment's share of the bar IS its crossing count, carried by
       flex-grow — so the widths are exact at any bay width, need no cap and no
       quantising, and can never clip. no crossings, no share, no width: that is
       the whole rule, and it is what makes a drained bar actually empty. the
       `clear` class lifts the 3px floor, which exists so a small count cannot
       round away and has no business propping up a count of nothing. */
    t.slot.style.flexGrow = t.crossings;
    t.slot.classList.toggle('clear', t.crossings===0);
    t.slot.setAttribute('aria-label',
      t.freed?t.key+' · freed'
      :t.key+' · '+(shares&&t.crossings===0?'shares a neuron, split it'
                    :t.crossings+' crossings')+' · '+STRENGTH[t.strength]+' feature');
    t.slot.title=t.slot.getAttribute('aria-label');
  });
}
/* ================= the game's voice =================
   one entry point, two outputs: #msg is the aria-live region and always gets
   the sentence verbatim, and `.say` is the card over the board. every call site
   still works with nothing but a string; the ones that know more about what
   they are saying pass a second argument, and get a colour, a mark and a longer
   hold for it.

   HOW LONG. it was 3400ms for everything, which is generous for "weather" and
   short for a 76-character instruction — the same number doing two jobs badly.
   the hold is read time now: a fixed beat to notice the card at all, plus time
   per character, clamped at both ends. at ~18 characters a second (roughly
   200wpm) the per-character figure would be 55ms for prose read straight
   through; these are glanced rather than read, but they arrive unannounced and
   half of them name something you then have to find on the board, so 55 is what
   it stays. that puts `feature identified · weather` at 2.9s, `net 004` at
   3.3s, the split at 4.1s, and both the blocked thread (after its multiplier)
   and the trial's opening sentence at the 5.6s ceiling.

   TWO AT ONCE. clearing the last crossing of two threads frees both inside one
   `forEach`, and the old line simply overwrote itself — the first feature you
   freed was never named at all. a queue would be worse: you would be reading
   about a move you made two moves ago. so a message arriving within 650ms of
   the card appearing is ADDED to it as another row, the hold is recomputed from
   everything on it, and the card keeps up without ever making you wait. later
   than that and it is a new event, and the card is replaced. */
const SAY_BASE=1400, SAY_PER=55, SAY_MIN=2200, SAY_MAX=5600, SAY_MERGE=650, SAY_ROWS=3;
let sayT=null, sayRows=[], sayAt=0;
// the wordmark's own flag, read off the one place its order is written
const FLAG=['--flag-1','--flag-2','--flag-3','--flag-4'];

function flashMsg(txt,o){
  $('msg').textContent=txt;
  sayShow(txt,o||{});
}
/* every message in this game is already written `label · detail`, so the card
   gets its two-part setting for free and no copy has to be rewritten. a first
   part longer than a label is not one — that message is a sentence, and it is
   set as a sentence. */
function sayParts(txt,o){
  if(o.plain) return {kick:'',line:txt};
  const i=txt.indexOf(' · ');
  return (i>0 && i<=22) ? {kick:txt.slice(0,i), line:txt.slice(i+3)} : {kick:'',line:txt};
}
function sayHide(now){
  const el=$('say');
  if(sayT){clearTimeout(sayT); sayT=null}
  sayRows=[]; sayAt=0;
  el.classList.remove('on');
  // a veil is about to cover the board: the card does not fade out underneath
  // one, it is simply not there
  if(now){ el.style.transition='none'; el.offsetHeight; el.style.transition='' }
}
function sayShow(txt,o){
  const el=$('say');
  /* a full veil is up — the cleared-net bulletin, the collection, the rules.
     a card is either noise behind that or noise on top of it, and the bulletin
     is the payoff of the whole net; nothing gets drawn over it.
     in practice one message can reach here: tapping a locked day in the record,
     which is feedback about a control INSIDE the overlay. that is what the
     toast is for, and what it already carries for "net skipped". the live
     region has spoken either way — that is the part that must not be dropped. */
  if(document.querySelector('.veil.show')){ toast(txt); return }
  const now=performance.now();
  const row=Object.assign({txt}, sayParts(txt,o), o);
  const merging = sayRows.length && sayRows.length<SAY_ROWS && (now-sayAt)<SAY_MERGE;
  if(merging) sayRows.push(row); else { sayRows=[row]; sayAt=now }

  /* the strip is every row's colour in order: one is the thing being spoken
     about, two is a shared neuron drawn as its own two features meeting. */
  const cols=[]; sayRows.forEach(r=>(r.cols||['--silver']).forEach(c=>{if(!cols.includes(c))cols.push(c)}));
  // built as one string with no stray whitespace: `.say` is width:max-content,
  // and a trailing text node gives it a line box the card then sits below
  el.innerHTML='<div class="saycard">'
    +`<div class="saystrip">${cols.map(c=>`<i style="background:var(${c})"></i>`).join('')}</div>`
    +sayRows.map((r,i)=>{
      const rc=r.cols||['--silver'];
      // a row about two features carries both, the same way the strip does
      const bar=rc.length>1
        ? `background:linear-gradient(var(${rc[0]}) 0 50%,var(${rc[1]}) 50% 100%)`
        : `background:var(${rc[0]})`;
      const lead=r.mark ? r.mark
        : sayRows.length>1 ? `<i class="saybar" style="${bar}"></i>` : '';
      const fresh=(merging && i===sayRows.length-1) ? ' rowin' : '';
      return `<div class="sayrow${fresh}${r.tight?' tight':''}">${lead}<div class="saytext">`
        +(r.kick?`<span class="saykick">${r.kick}</span>`:'')
        +`<div class="sayline${r.big?' big':''}">${r.line}</div></div></div>`;
    }).join('')
    +'</div>';
  el.classList.add('on');

  const chars=sayRows.reduce((a,r)=>a+r.txt.length,0);
  // an instruction is held a third longer than a report: you have to act on it,
  // and it arrives at the moment you are stuck. the ceiling still holds.
  const mult=sayRows.some(r=>r.hold)?1.3:1;
  const hold=Math.min(SAY_MAX,Math.max(SAY_MIN,(SAY_BASE+SAY_PER*chars)*mult));
  if(sayT)clearTimeout(sayT);
  sayT=setTimeout(()=>{sayRows=[];sayAt=0;sayT=null;el.classList.remove('on')},hold);
}
/* the timer is the longest the card will stay, not how long it stays: reaching
   for the board takes it down. the game has finished saying this and you have
   moved on, and a card you cannot dismiss sitting over the puzzle for six
   seconds is the failure mode a generous hold invites. the floor stops a press
   that lands in the same breath as the message from swallowing it unread. */
function sayNudge(){
  if(!sayRows.length || performance.now()-sayAt<420) return;
  if(sayT){clearTimeout(sayT); sayT=null}
  sayRows=[]; sayAt=0; $('say').classList.remove('on');
}
/* every veil in the game opens through here, so none of them can forget to
   take the card down first */
function showVeil(id){ sayHide(true); $(id).classList.add('show') }
function renderHud(){
  const r=R();
  /* ---- which doors the bar is showing ----
     HERE AND NOT IN renderTutorial, which is where these two landed first and is
     the one function that cannot draw them: it runs only while a guided net is on
