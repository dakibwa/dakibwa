}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}}
const R=()=>store.run;
const $=id=>document.getElementById(id);
function fnv(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function mulberry32(seed){return function(){let t=seed+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function cssv(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}

/* ================= the ground =================
   two grounds, one game. the tokens do nearly all of it, but a good deal of
   the board's colour does not go through the cascade at all: cssv() resolves a
   token once and writes the answer into an svg attribute or an inline style —
   a thread stroke, a node ring, the plate, a meter block — and an attribute
   does not re-cascade when the tokens under it move. so switching has to go
   back and re-resolve every one of them, or the board keeps the strokes of the
   ground it just left.

   this is a repaint rather than buildNet(true). a rebuild would also work, and
   it would keep the player's positions, splits and freed threads — but it
   would throw away the shape a freed feature eased into, which lives only in
   the live nodes and is not stored anywhere, and it would re-run the salt loop
   to arrive at the board already on screen. */
const SYSLIGHT = window.matchMedia ? matchMedia('(prefers-color-scheme: light)') : null;
function themeNow(){
  if(store.theme==='light'||store.theme==='dark') return store.theme;
  return (SYSLIGHT && SYSLIGHT.matches) ? 'light' : 'dark';
}
function applyTheme(mode){
  document.documentElement.setAttribute('data-theme',mode);
  const b=$('themebtn'); if(!b) return;
  const label='ground · '+(mode==='light'?'paper':'dark');
  b.title=label; b.setAttribute('aria-label',label);
  b.setAttribute('aria-pressed',mode==='light'?'true':'false');
}
function repaintTheme(){
  /* everything built by partEl — every neuron ring, pin and card fragment —
     says which tokens it was painted from, so this needs no list of them */
  document.querySelectorAll('[data-tok]').forEach(e=>{
    e.getAttribute('data-tok').split(' ').forEach(pair=>{
      const i=pair.indexOf(':');
      e.setAttribute(pair.slice(0,i),cssv(pair.slice(i+1)));
    });
  });
  // and the handful that write a style rather than an attribute
  if(gRoot){
    const pat=$('netsvg').querySelector('#fg path');
    if(pat) pat.setAttribute('stroke',cssv('--grid'));
    const plate=gRoot.querySelector('.plate');
    if(plate) plate.setAttribute('fill',cssv('--surface'));
    threads.forEach(t=>{ if(t.el) t.el.style.stroke=cssv(t.col) });
    /* any ring carrying an inline stroke: an inline style outranks the attribute
       the repaint above just corrected, so it has to be corrected in its own
       right rather than left to the sweep. */
    members.forEach(n=>{
      if(!n.el || !n.el.style.stroke) return;
      n.el.style.stroke=cssv(n.threads[0].col);
    });
  }
  lastT='';                  // the crossings track skips a repaint it thinks it already did
  renderHud(); refresh();
  /* the one overlay that bakes colours rather than referencing them: every
     emblem in the record resolves its mark from the plate's luminance, so the
     whole screen is rebuilt rather than repainted */
  if($('histveil').classList.contains('show')) openRecord();
  /* deliberately not chased: the freeing runner and the cleared sweep resolve a
     colour and remove themselves inside half a second, so the only way to catch
     one stale is to switch ground during the half second it exists. */
}
function setTheme(mode){ store.theme=mode; save(); applyTheme(mode); repaintTheme() }
applyTheme(themeNow());
/* with no stored choice the system IS the choice, so follow it while it lasts.
   the first tap on the button is what makes the choice the player's. */
if(SYSLIGHT && SYSLIGHT.addEventListener){
  SYSLIGHT.addEventListener('change',()=>{ if(!store.theme){ applyTheme(themeNow()); repaintTheme() } });
}

/* ---- the two ways a track gets drawn ----
   both of them are handed `var(--token)` strings rather than resolved values,
   so `--fill` holds the reference and flipping the ground repaints the whole
   cluster without a single line of javascript re-running.

   cells: a fixed number of equal divisions, each either a colour or empty. only
   the day's strip wants this, and it wants it because ten nets are ten things —
   the discreteness IS the reading, and it is the same object that gets shared. */
/* the cells are REUSED, never rebuilt. this used to empty the strip and make ten
   fresh elements on every renderHud, which is why `.track > i`'s
   `transition:background` had never once run in the life of the game: a brand
   new element has no previous colour to ease from, so a net completing snapped
   from the day-ahead colour to its tier between two frames. keeping the same ten
   nodes alive is the whole of what makes that transition real. */
function paintCells(id,colors,label){
  const el=$(id); if(!el)return;
  while(el.children.length>colors.length) el.lastElementChild.remove();
  while(el.children.length<colors.length) el.appendChild(document.createElement('i'));
  colors.forEach((c,i)=>{
    const cell=el.children[i];
    cell.classList.toggle('on',!!c);
    if(c) cell.style.setProperty('--fill',c); else cell.style.removeProperty('--fill');
  });
  if(label)el.setAttribute('aria-label',label);
}
/* a run: one length, `pct` of the track, divided in proportion by the grows
   handed in. a segment with no grow is not drawn at all rather than drawn at
   nothing — see .tval.clear for why that distinction is the whole difference
   between an empty bar and a bar that looks broken. */
function paintRun(id,pct,segs,label){
  const el=$(id); if(!el)return;
  const run=el.firstElementChild;
  run.style.width=Math.max(0,Math.min(100,pct)).toFixed(1)+'%';
  run.innerHTML='';
  segs.forEach(s=>{
    if(!s.grow)return;
    const seg=document.createElement('i');
    seg.style.flexGrow=s.grow;
    seg.style.setProperty('--fill',s.col);
    run.appendChild(seg);
  });
  if(label)el.setAttribute('aria-label',label);
}

/* ================= the instrument cluster ================= */

/* three tracks of one form, on one line across the masthead: what is left of
   this net, where the net sits in the day's ten, and what is left of the clean
   line. one bar each, on the same ground, at the same height, divided by
   hairlines — see .track. what distinguishes them is what they are drawn IN:
   crossings in the thread palette, the strip in the tier ladder, turns in the
   one hue it owns.

   the tier colour used to be painted onto the crossings track too, so that
   crossing par restated the whole head at once. it read well and it cost the
   crossings instrument its own identity — three readings that were always the
   same colour are one reading with three shapes. the tier signal keeps the two
   places it belongs to, plus one frame: the crossings track completes in the
   colour of the tier just minted, which is the colour of the cell that is about
   to fill in the strip. a hand-off rather than a state. */

/* the ladder's colours live on TIERCOL. this only guards the case where a tier
   key arrives that TIERCOL has not been taught yet, and it answers with the
   BOTTOM rung: an unknown key means a net was played, and the conservative
   thing to say about a net you cannot grade is that it finished.
   it has to be re-pointed every time the ladder moves, and it has been missed
   once already: it answered hellblau, which became `clean`, and then tuerkis,
   which is `clean` again now. a guard that promotes is worse than no guard. it
   is written as the bottom rung's own token so the next move is one line, and
   it is a LITERAL rather than TIERCOL.done on purpose — this exists for the case
   where the table itself is the thing that cannot be trusted. */
const tierCol=t=>TIERCOL[t]||'--violett';
/* the tier this net would mint if it finished on the turn you are on — the same
   three rungs tierFor() awards, read a move early so the track can show you
   which band you are standing in. */
function liveTier(){
  const r=R(), {optimum,par}=netTargets();
  if(r.assisted) return 'done';                       // descent caps a net at done
  if(optimum<par && r.netMoves<=optimum) return 'perfect';
  return r.netMoves<=par ? 'clean' : 'done';
}

/* the bar DRAINS, left-anchored, and the bare track opening behind it on the
   right is what you have taken out. all three read that way round now — turns
   used to drain the other way, its live run pinned to the right edge and the
   spent turns opening from the left, which put two instruments on one line
   emptying towards each other.
   the signature carries init because two nets running back to back can share a
   crossing count while needing different track lengths. */
let lastT='', peakCross=1;
function setTension(cross,init){
  /* the finish flood owns the bar until the next net, exactly as it does in
     renderThreads. only the segments were guarded, and the LENGTH is the other
     half of the flood: a theme flip mid-card resets lastT on purpose and then
     calls refresh, which walked in and set the full bar back to a width of
     nothing — a flood of the right colour and no width at all. */
  if($('threadrow').dataset.done) return;
  const sig=cross+'/'+init;
  if(sig===lastT) return; lastT=sig;
  /* the bar's length is what is left, measured against the worst this net has
     ever been rather than against where it started. you can make new crossings
     as readily as remove them, so a bar scaled to the opening count pins at
     full and stops moving the moment you do — and the moment it stops moving is
     exactly the moment you most need to see that you went backwards. */
  peakCross=Math.max(peakCross||1, cross, init);
  $('crossnum').textContent=cross;
  $('threadrow').style.width=(100*cross/peakCross).toFixed(1)+'%';
  $('crossbar').setAttribute('aria-label',cross+' of '+init+' crossings left');
}
/* and then floods, in the tier the net just minted — the colour that lands in
   the day's strip a beat later. lastT is deliberately left standing so an
   incidental refresh cannot repaint over the finish. */
function celebrateGauge(){
  const last=R().cleared[R().cleared.length-1];
  const row=$('threadrow');
  row.style.width='100%';
  // it has to ask for the whole bar: a segment's basis is zero and its width is
  // whatever grow it is given, which for one segment is any number above nothing
  row.innerHTML='<i style="flex-grow:1;--fill:var('+tierCol(last?last.tier:'clean')+')"></i>';
  row.dataset.done='1';
  $('crossbar').setAttribute('aria-label','net untangled');
}

/* ================= tangle ================= */

let members=[],threads=[],builtFor=-1,initialCross=1,spec=null,netPairs=[];

/* par, measured off the net you actually got rather than off the recipe that
   asked for it. the ingredient formula sat 1.5x-7x above the true optimum, so
   every simulated skill level minted `clean` on ~100% of nets and the three
   tiers collapsed into one.

   a thread's solution is its own horizontal lane — that construction already
   exists, in the pin placement above. so the honest cost of a net is how many
   neurons start outside their thread's band, plus one split per shared neuron.
   this also adapts to a lucky day, which the recipe could not. */
function lanePar(){
  const n=Math.max(1,threads.length-1);
  const laneY=t=>BH*.09+threads.indexOf(t)*(BH*.82/n);
  const band=(BH*.82/n)/2;
  let out=0;
  members.forEach(m=>{
    if(m.threads.length>1) return;            // shared neurons are counted below
    if(Math.abs(m.y0-laneY(m.threads[0]))>band) out++;
  });
  return Math.max(3,out+spec.shared);
}
/*@fam*/
/* ================= layout families =================

   ten nets a day, every day, and until now every one of them was the same
   picture: columns left to right, threads swapping order between neighbours.
   honest, readable, and after a week it is wallpaper. the fix is not decoration
   — it is that a net does not have to be a layer stack. real networks are not
   all layer stacks either, so the families below borrow shapes that exist: a
   stack with a waist (an autoencoder), a stack with skips (a residual block),
   a fan of experts, a lattice of filters, an embedding ring, a band of
   receptive fields. the shape earns the variety instead of dressing it.

   ---- the one idea every family is built on ----

   a family declares a SOLVED FIGURE: a slot for every neuron of every thread,
   chosen so that when each neuron sits in its own slot no two threads cross.
   the puzzle is then a PERMUTATION of that figure — d neurons swapped around
   their neighbours — and solving it is putting them back.

   three things fall out of that, and all three are the reason it is built this
   way rather than as seven separate placement routines:

   1. SOLVABILITY IS BY CONSTRUCTION, not by luck. the zero-crossing
      arrangement is not searched for, it is the thing the generator started
      from; every neuron reaches it by moving to its own slot. the salt-retry
      loop only picks among boards that are already solvable, so it can never
      be what makes a net finishable. pinned neurons are placed AT their slot,
      never displaced, so an immovable neuron is one the solution wanted there
      anyway — the same argument the layered builder used, now enforced for
      every shape at once. famPlan additionally refuses any figure whose own
      solved form is not crossing-free (famCrossFree), so a family with a
      geometry bug cannot ship a net; it falls back to the stack.

   2. PAR IS AN INPUT, NOT AN ESTIMATE. lanePar guessed the cost of a net by
      counting neurons outside a lane, and guessed badly — one net wanted 3
      turns where its neighbours wanted 12. here the generator is TOLD how many
      neurons to displace, so the cost of the named solution is known exactly:
      d drags, plus one split and one drag for each superposed neuron, minus
      the finishing action, which is free. par is a proved-reachable upper
      bound rather than a geometric hunch. the offline solver that is landing
      separately can only lower it, and when it does, par stops being a design
      knob and becomes a measurement — this is the honest thing to ship until
      then, and it is the first version of par a player could actually verify.

   3. THE BOARD IS ALWAYS A COMPOSITION. the scrambled start uses exactly the
      same set of positions as the solved figure, so a tangled net is a
      disturbed pattern rather than a scatter — and neuron spacing is a
      property of the figure, not an accident of where the dice fell. every
      family is gated at FAM_SEP, which is far above the MIN_SEP floor
      separateNodes enforces; a composition wants much more room than the
      minimum that stops two circles overlapping.

   ---- orientation ----
   the plate turns a quarter turn on a tall window. the stack families read
   top-to-bottom there instead of left-to-right, which is how a net is usually
   drawn anyway; the ring and the lattice are orientation-agnostic outright;
   the fan and the band open sideways from a hub off the short edge. no family
   depends on which way is along. */

const FAM_SEP=64;          // the clearance a *composition* wants, not the 38 that stops overlap

/* two segments-of-polylines test, on hypothetical positions rather than the
   live board — used to prove a family's solved figure before it is allowed to
   generate anything. */
function famCrossFree(polys){
  for(let i=0;i<polys.length;i++)for(let j=i+1;j<polys.length;j++){
    const A=polys[i],B=polys[j];
    for(let a=0;a<A.length-1;a++)for(let b=0;b<B.length-1;b++){
      if(A[a]===B[b]||A[a]===B[b+1]||A[a+1]===B[b]||A[a+1]===B[b+1])continue;
      if(segX(A[a],A[a+1],B[b],B[b+1]))return false;
    }
  }
  return true;
}

/* a stadium track — two straights and two half turns — walked at equal arc
   length, so neurons space evenly however many there are. munich's own
   olympiastadion oval, and the only closed curve on the board that uses a
   1040x580 plate properly. */
const RINGBOX={x0:70,x1:970,y0:60,y1:520,r:150};
function trackLen(){const B=RINGBOX;return 2*((B.x1-B.x0)-2*B.r)+2*((B.y1-B.y0)-2*B.r)+2*Math.PI*B.r}
function trackPt(u){
  const B=RINGBOX, lx=(B.x1-B.x0)-2*B.r, ly=(B.y1-B.y0)-2*B.r, q=Math.PI/2*B.r, P=trackLen();
  u=((u%P)+P)%P;
  const arc=(cx,cy,a0)=>{const a=a0+(u/B.r);return{x:cx+Math.cos(a)*B.r,y:cy+Math.sin(a)*B.r}};
  if(u<lx) return {x:B.x0+B.r+u, y:B.y0};                       u-=lx;
  if(u<q)  return arc(B.x1-B.r,B.y0+B.r,-Math.PI/2);            u-=q;
  if(u<ly) return {x:B.x1, y:B.y0+B.r+u};                       u-=ly;
  if(u<q)  return arc(B.x1-B.r,B.y1-B.r,0);                     u-=q;
  if(u<lx) return {x:B.x1-B.r-u, y:B.y1};                       u-=lx;
  if(u<q)  return arc(B.x0+B.r,B.y1-B.r,Math.PI/2);             u-=q;
  if(u<ly) return {x:B.x0, y:B.y1-B.r-u};                       u-=ly;
  return arc(B.x0+B.r,B.y0+B.r,Math.PI);
}

/* each family answers one question: where does thread k's i-th neuron belong
   when the net is solved? `g` is the grouping the scramble is allowed to
   permute within — keeping a swap inside its own layer, ring or band is what
   keeps a disturbed figure still legible as that figure. */
const FAMILIES={

  /* ---- the stack ----------------------------------------------------------
     columns across, one neuron per thread per column: the picture the game
     shipped with, kept because it is the clearest thing to learn on and it is
     the only family the tutorial ever sees.
     SOLVED: every thread flat in its own lane. distinct horizontal lines are
     parallel and never meet, so the figure is crossing-free for any T and L. */
  layered:{ minT:2, minL:3, cyc:3, slots(T,L,tut){
    const x0=BW*.10,x1=BW*.90,ytop=tut?BH*.46:BH*.14,ybot=BH*.88,s=[],g=[];
    for(let k=0;k<T;k++){s[k]=[];g[k]=[];for(let i=0;i<L;i++){
      s[k][i]={x:x0+(x1-x0)*(L>1?i/(L-1):.5), y:ytop+(ybot-ytop)*(T>1?k/(T-1):.5)};
      g[k][i]='c'+i;
    }}
    return {s,g};
  }},

  /* ---- the hourglass (an autoencoder) -------------------------------------
     the same columns, but each layer is spaced by its own width and the middle
     ones pinch: a bottleneck drawn rather than described. a layer with fewer
     seats than features is exactly why a real net superposes, so this is the
     family that most deserves its shared neurons — and they land in the waist,
     because the nearest-neighbour rule picks the tightest pair on the board.
     SOLVED: thread k keeps seat k in every column. seat spacing is positive
     everywhere, so y_k(i) < y_k'(i) for k<k' at every column; two segments
     ordered at both ends cannot cross. the pinch is capped so the waist never
     closes past FAM_SEP — a bottleneck you cannot get a finger into is not a
     bottleneck, it is a bug. */
  hourglass:{ minT:2, minL:4, cyc:3, slots(T,L){
    const x0=BW*.10,x1=BW*.90,ytop=BH*.12,ybot=BH*.90,mid=(ytop+ybot)/2;
    const full=(ybot-ytop)/Math.max(1,T-1);
    const waist=Math.max(.42, FAM_SEP/full);
    const s=[],g=[];
    for(let k=0;k<T;k++){s[k]=[];g[k]=[];for(let i=0;i<L;i++){
      const u=L>1?Math.abs(2*i/(L-1)-1):1;                 // 0 at the waist, 1 at the ends
      const step=full*(waist+(1-waist)*Math.pow(u,1.35));
      s[k][i]={x:x0+(x1-x0)*(L>1?i/(L-1):.5), y:mid+(k-(T-1)/2)*step};
      g[k][i]='c'+i;
    }}
    return {s,g};
  }},

  /* ---- the residual stack -------------------------------------------------
     threads that skip a layer, so the line jumps the block instead of passing
     through it. lengths differ, columns hold different numbers of neurons, and
     long bold segments cut across the picture — the only stack family that
     does not read as a rectangle.
     SOLVED: lanes again. a thread present in a subset of columns still lays
     flat at its own height, and distinct horizontals never meet, so dropping
     columns cannot break the argument. the two end columns are never dropped,
     so every thread still spans the plate. */
  residual:{ minT:2, minL:5, cyc:3, slots(T,L,tut,rnd){
    const x0=BW*.08,x1=BW*.92,ytop=BH*.13,ybot=BH*.89;
    const X=i=>x0+(x1-x0)*(L>1?i/(L-1):.5), Y=k=>ytop+(ybot-ytop)*(T>1?k/(T-1):.5);
    const s=[],g=[];
    for(let k=0;k<T;k++){
      const want=Math.min(L>=6?1+Math.floor(rnd()*2):1, L-3), drop=new Set();
      for(let q=0;q<24 && drop.size<want;q++) drop.add(1+Math.floor(rnd()*(L-2)));
      const keep=[]; for(let i=0;i<L;i++) if(!drop.has(i)) keep.push(i);
      s[k]=keep.map(i=>({x:X(i),y:Y(k)}));
      g[k]=keep.map(i=>'c'+i);
    }
    return {s,g};
  }},

  /* ---- the lattice (a convolution) ----------------------------------------
     a rigid square grid with equal spacing both ways, sized to the net and
     centred on the plate, and the scramble is global rather than per-column —
     so a thread can hold two cells in one column and none in the next, and the
     picture reads as weaving through a field rather than passing through
     layers. the one family that looks identical whichever way up the board is.
     SOLVED: thread k takes row k. distinct horizontals, again. */
  lattice:{ minT:2, minL:3, cyc:4, slots(T,L){
    const cell=Math.min(820/Math.max(1,L-1), 450/Math.max(1,T-1), 175);
    const cx=BW/2, cy=BH/2, s=[], g=[];
    for(let k=0;k<T;k++){s[k]=[];g[k]=[];for(let i=0;i<L;i++){
      s[k][i]={x:cx+(i-(L-1)/2)*cell, y:cy+(k-(T-1)/2)*cell};
      g[k][i]='all';
    }}
    return {s,g};
  }},

  /* ---- the fan (a mixture of experts) -------------------------------------
     a hub off the bottom edge and one ray per feature, neurons stepping
     outward along it. it is the strahlenkranz the rest of the game is already
     drawn in, and the scramble swaps neurons between rays at the same radius,
     so a disturbed fan pinwheels.
     SOLVED: thread k lies on the ray at angle t_k. rays from a common hub meet
     only at the hub, and the innermost radius is 200, so distinct rays are
     disjoint over the whole board. the hub sits off the plate so no thread has
     to come near the convergence. */
  fan:{ minT:3, minL:3, cyc:3, local:true, slots(T,L){
    const hx=BW/2, hy=700, A=44*Math.PI/180, r0=200, r1=660, s=[], g=[];
    for(let k=0;k<T;k++){
      const th=T>1?(-A+2*A*k/(T-1)):0;
      s[k]=[];g[k]=[];
      for(let i=0;i<L;i++){
        const r=r0+(r1-r0)*(L>1?i/(L-1):.5);
        s[k][i]={x:hx+Math.sin(th)*r, y:hy-Math.cos(th)*r};
        g[k][i]='r'+i;
      }
    }
    return {s,g};
  }},

  /* ---- the band (nested receptive fields) ---------------------------------
     concentric arcs over a hub off the bottom edge — one band per feature,
     neurons stepping around it. solved it is a rainbow; disturbed, threads
     hop between bands and the arcs braid.
     SOLVED: thread k is inscribed in the circle of radius r_k. the chord
     between neighbours on that circle dips no closer to the hub than
     r_k*cos(step/2), so the bands stay strictly nested as long as
     r_k < r_(k+1)*cos(step/2). the angular span is narrowed when there are few
     neurons — three neurons over a half turn is a shallow V that would cut
     inside the band below it — and famCrossFree checks the finished figure
     anyway rather than trusting the inequality. */
  arcs:{ minT:2, minL:3, cyc:3, local:true, slots(T,L){
    const hx=BW/2, hy=600, r1=540;
    const S=Math.min(130, 44*Math.max(1,L-1))*Math.PI/180;
    /* the innermost band is held at half the outermost. it used to start at
       170 against an outer 540, and three bands that far apart stopped reading
       as one figure the moment anything moved between them — a neuron hopping
       from the inside to the outside drew a 370-unit near-vertical spike, and
       the picture was a scatter with two arcs left in it. */
    const r0=Math.max(r1*.5, FAM_SEP*Math.max(1,L-1)/S);
    const s=[],g=[];
    for(let k=0;k<T;k++){
      const r=r0+(r1-r0)*(T>1?k/(T-1):.5);
      s[k]=[];g[k]=[];
      for(let i=0;i<L;i++){
        const p=-S/2+S*(L>1?i/(L-1):.5);
        s[k][i]={x:hx+Math.sin(p)*r, y:hy-Math.cos(p)*r};
        g[k][i]='a'+i;
      }
    }
    return {s,g};
  }},

  /* ---- the ring (an embedding table) --------------------------------------
     every neuron on one closed track and every thread a chord diagram across
     it: the busiest start in the set, and the most dramatic resolution, since
     solving it empties the middle of the board completely.
     SOLVED: each thread owns a contiguous run of track positions. two disjoint
     arcs of a convex curve are separated by a straight line — the one through
     both gaps between them — and a polyline through points on an arc stays
     inside that arc's convex hull, so no two threads' lines can meet. the run
     is contiguous, not merely disjoint, which is what makes the hulls
     separable rather than interleaved. */
  ring:{ minT:2, minL:3, cyc:4, slots(T,L,tut,rnd){
    const P=trackLen(), N=T*L, u0=rnd()*P, s=[], g=[];
    for(let k=0;k<T;k++){
      s[k]=[];g[k]=[];
      for(let i=0;i<L;i++){
        s[k][i]=trackPt(u0+P*(k*L+i)/N);
        g[k][i]='ring';
      }
    }
    return {s,g};
  }}
};

/* ---- which family, and when ----
   layout variety rides the same ramp difficulty does. RAMP adds one ingredient
   at a time — length, a third feature, a shared neuron, a pin, width — and one
   family unlocks per net alongside it, so a day opens on the shape you already
   know and earns the strange ones. net 0 can only ever be the stack: somebody
   learning what a crossing is should not be handed a chord diagram, and that
   is true whether or not they have finished the tutorial, so it is keyed on
   the net index rather than on player state.

   the pool is filtered by what the net's own size can actually be drawn as —
   a fan of two rays is a letter V, a hourglass needs columns to pinch — so a
   family is never drawn only to be thrown away by famPlan. that matters most
   at nets 1 and 2, where two threads leave few shapes standing.

   within a day the order is drawn from the date, no family runs twice in a
   row, and none appears more than twice in the ten. the no-repeat rule stands
   down when it would leave a single candidate, because a rule that forces the
   answer is not variety — it is a different fixed sequence. */
const FAM_LIST=['layered','arcs','hourglass','lattice','ring','fan','residual'];
const FAM_FROM={layered:0, arcs:1, hourglass:1, lattice:2, ring:3, fan:4, residual:5};
let _famDay=null,_famSeq=null;
function famSeq(day){
  if(_famDay===day) return _famSeq;
  const rnd=mulberry32(fnv(day+':layout')), seq=[], used={};
  for(let i=0;i<32;i++){
    const s=netSpec(i), T=s.threads, L=Math.max(3,s.nodes);
    const all=FAM_LIST.filter(f=>FAM_FROM[f]<=i && T>=FAMILIES[f].minT && L>=FAMILIES[f].minL);
    let pool=all.filter(f=>f!==seq[i-1] && (i>=10 || (used[f]||0)<2));
    if(pool.length<2) pool=all.filter(f=>i>=10 || (used[f]||0)<2);
    if(!pool.length) pool=all;
    const f=pool[Math.floor(rnd()*pool.length)];
    seq.push(f); used[f]=(used[f]||0)+1;
  }
  _famDay=day; _famSeq=seq;
  return seq;
}
const famFor=(day,i)=>famSeq(day)[Math.min(i,31)];

/* the par each net is aiming at — a designed curve rather than whatever the
   dice produced. it tracks the shipped lane-par ramp (3,4,4,6,6,6,10,10,12,20,
   measured across the layered days) without its noise: that ramp wanted 3
   turns for one net and 12 for its neighbour on the same rung.
   the generator disturbs the figure until the solution genuinely costs this
   much, so the number on the scorecard is a property the puzzle was built to
   have rather than a reading taken off it afterwards. */
const FAM_PAR=[3,4,5,6,7,8,10,11,13,15];
const famTarget=i=>i<FAM_PAR.length?FAM_PAR[i]:15+Math.floor((i-9)*1.5);

/* one disturbance: take a few seats in the same layer and rotate what sits in
   them. a rotation is a derangement, so every neuron picked genuinely ends up
   somewhere that is not its own slot. it hands back what it did, because the
   caller prices the result and puts it back if it bought nothing.

   `local` decides whether a rotation may reach across a layer or only between
   next-door seats. the two polar families need it: their seats are rings at
   different radii, and a neuron sent from the innermost band to the outermost
   draws a 270-unit spike straight through every band between them, which does
   not read as a disturbed set of arcs — it reads as a scatter with some arcs
   left in it. a grid can take the long throw, and the lattice and the ring
   want it, because a chord across the whole figure is their character. */
function famStep(live,cyc,local,rnd){
  const byG=new Map();
  live.forEach(n=>{if(n.pinned)return;
                   const a=byG.get(n.gid)||[]; a.push(n); byG.set(n.gid,a)});
  const gids=[...byG.keys()].sort();
  gids.forEach(g=>byG.get(g).sort((a,b)=>a.oi-b.oi));
  /* the runs of k seats in a row that are all still free. a local rotation has
     to be adjacent in the LAYER, not merely adjacent among whatever is left —
     taking neighbours out of a shrinking list quietly reunites seat 0 with
     seat 4 once the three between them have gone, which is the long spike
     local exists to stop. */
  const runs=(arr,k)=>{
    const out=[];
    for(let s=0;s+k<=arr.length;s++){
      let ok=true; for(let j=0;j<k;j++) if(arr[s+j].moved){ok=false;break}
      if(ok) out.push(s);
    }
    return out;
  };
  const usable=gids.filter(g=>{
    const arr=byG.get(g);
    return local ? runs(arr,2).length>0 : arr.filter(n=>!n.moved).length>=2;
  });
  if(!usable.length) return null;
  const arr=byG.get(usable[Math.floor(rnd()*usable.length)]);
  const free=arr.filter(n=>!n.moved);
  const want=Math.min(2+Math.floor(rnd()*Math.max(1,cyc-1)), free.length);
  let pick=null;
  if(local){
    for(let k=want;k>=2 && !pick;k--){
      const r=runs(arr,k);
      if(r.length){ const s=r[Math.floor(rnd()*r.length)]; pick=arr.slice(s,s+k) }
    }
  } else {
    const p=free.slice(); pick=[];
    for(let j=0;j<want;j++) pick.push(p.splice(Math.floor(rnd()*p.length),1)[0]);
  }
  if(!pick||pick.length<2) return null;
  const px=pick.map(n=>n.x), py=pick.map(n=>n.y), k=pick.length;
  pick.forEach((n,j)=>{n.x=px[(j+1)%k]; n.y=py[(j+1)%k]; n.moved=true});
  return {pick, px, py};
}

/* the whole placement for one net, as plain data: no svg, no dom, no board
   state, so the offline harness runs the very same function the browser does
   rather than a copy of it that can drift. returns null when the family will
   not fit this net — too tight to grab, off the plate, or a solved figure that
   is not actually clean — and the caller falls back to the stack. */
function famPlan(fam,T,L,shared,pinned,want,tut,rnd){
  const F=FAMILIES[fam];
  if(!F || T<F.minT || L<F.minL) return null;
  const {s,g}=F.slots(T,L,tut,rnd);
  const nodes=[], order=[];
  for(let k=0;k<T;k++){
    if(!s[k] || s[k].length<2) return null;
    order[k]=[];
    for(let i=0;i<s[k].length;i++){
      // oi is the seat's place in its own group's natural order — the row in a
      // column, the band in an arc, the ray at a radius. it is always the
      // thread index, because a group is one value of i across every k.
      const n={hx:s[k][i].x, hy:s[k][i].y, x:s[k][i].x, y:s[k][i].y, oi:k,
               gid:g[k][i], t:[k], pinned:false, merged:false, gone:false, alt:null};
      nodes.push(n); order[k].push(n);
    }
  }
  // gate: on the plate, far enough apart to grab on a phone, and provably clean
  let minSep=Infinity;
  for(let a=0;a<nodes.length;a++){
    const A=nodes[a];
    if(Math.abs(clampX(A.hx)-A.hx)>.5 || Math.abs(clampY(A.hy)-A.hy)>.5) return null;
    for(let b=a+1;b<nodes.length;b++)
      minSep=Math.min(minSep, Math.hypot(A.hx-nodes[b].hx, A.hy-nodes[b].hy));
  }
  if(minSep<FAM_SEP) return null;
  if(!famCrossFree(order.map(o=>o.map(n=>({x:n.hx,y:n.hy}))))) return null;

  /* superposition, placed where the figure is tightest: the two neurons that
     become one are the closest pair the shape offers, so the fold reads as the
     layer running out of room rather than as two dots chosen at random. the
     slot the absorbed neuron vacates stays empty, which is the hole the split
     later fills back in. */
  const pairs=[];
  for(let a=0;a<nodes.length;a++)for(let b=a+1;b<nodes.length;b++){
    if(nodes[a].t[0]===nodes[b].t[0]) continue;      // one thread cannot superpose with itself
    pairs.push([Math.hypot(nodes[a].hx-nodes[b].hx, nodes[a].hy-nodes[b].hy), nodes[a], nodes[b]]);
  }
  /* the threshold is relative to the closest pair that COULD fold, not to the
     closest pair on the board — in a wide stack the nearest neighbours are two
     neurons of the same thread, and measuring against those left some nets
     with no candidate at all and quietly dropped their superposition. */
  const tight=pairs.length?Math.min(...pairs.map(p=>p[0])):0;
  /* a widening band, from v5. the tight band is the right FIRST answer — a
     superposition should read as the layer running out of room, not as two
     dots chosen at random — but when it runs out of disjoint candidates the
     net silently got fewer shared neurons than its ramp row asked for.
     measured across 600 family nets: 1.3%, all of them net 7, which is the one
     row whose whole step is the second shared neuron. so widen rather than
     give up, and take the closest pair still standing. */
  let merges=0;
  const bands = GEN_RULES.merge==='widen' ? [1.35,2,3,6,Infinity] : [1.35];
  for(const w of bands){
    if(merges>=shared) break;
    const near=pairs.filter(p=>p[0]<=tight*w).map(p=>[p[1],p[2]]);
    for(let i=near.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[near[i],near[j]]=[near[j],near[i]]}
    for(const [A,B] of near){
      if(merges>=shared) break;
      if(A.gone||B.gone||A.merged||B.merged) continue;
      const ka=A.t[0], kb=B.t[0];
      if(ka===kb) continue;
      if(order[ka].includes(B) || order[kb].includes(A)) continue;
      order[kb][order[kb].indexOf(B)]=A;
      A.t.push(kb); A.merged=true; A.alt={x:B.hx,y:B.hy};
      B.gone=true; merges++;
    }
  }
  const live=nodes.filter(n=>!n.gone);

  /* a pin sits exactly on its own slot and is never scrambled.
     that is deliberate and it is also the whole reason a pin is worth almost
     nothing here: in a family the solved figure IS the set of slots, so a
     neuron that cannot move is a neuron already standing in the answer. the
     solver measured the same sign on the layered builder — pins made a net 0.3
     to 0.8 moves EASIER — and its own conclusion was that a pin is texture
     rather than difficulty. the fix it proposes, pinning where the neuron
     stands, cannot be taken here without giving up the thing this whole block
     is built on: that the zero-crossing arrangement is where the generator
     started rather than something a search has to find. so the sign stays, the
     count is honest, and the ramp does not lean on pins for a step.
     from v5 a draw that lands on a thread with nothing eligible falls through
     to any other thread instead of being dropped. it has never yet fired in
     600 nets — the round robin is well fed — but a ramp row that says two and
     delivers one on an unlucky day should be impossible, not unlikely. */
  for(let p=0;p<pinned;p++){
    const k=p%T;
    let cands=order[k].filter(n=>!n.pinned && !n.merged);
    if(!cands.length && GEN_RULES.pinFill) cands=live.filter(n=>!n.pinned && !n.merged);
    if(!cands.length) continue;
    cands[Math.floor(rnd()*cands.length)].pinned=true;
  }

  /* disturb, price, keep it only if it bought something. displacing a neuron
     does not reliably cost a turn: two neurons of the SAME feature can trade
     places without crossing anything (a thread never crosses itself), and —
     the one that really bites — disturbing EVERY layer the same way just
     relabels the figure. an early version displaced neurons blindly and called
     the count par; on the two-thread nets it faithfully swapped both rows in
     all three columns and produced a board that was already solved, with a par
     of three printed over it.
     so each rotation is priced, and rolled back when the price does not move.
     the loop ends when the puzzle is worth the par it is about to be scored
     out of, or when the figure stops yielding — and par then follows what was
     actually achieved rather than what was asked for. */
  live.forEach(n=>n.moved=false);
  const plan={fam, nodes:live, order, d:0, merges, minSep, par:0, x:0};
  plan.par=famCost(plan); plan.x=famX(plan);
  for(let miss=0; plan.par<want && miss<26; ){
    const st=famStep(live, F.cyc||3, !!F.local, rnd);
    if(!st) break;
    const priced=famCost(plan), x=famX(plan);
    /* keep a rotation when it makes the solution dearer, or when it leaves the
       price alone but puts more crossings on the board. the second clause is
       what the smallest nets live on: a two-thread net with one crossing costs
       nothing at all, because the single move that fixes it is the move that
       finishes the net, and the game does not bill that one. judging purely on
       price, every rotation available to net 0 looked worthless and got rolled
       back, and the tutorial shipped already solved. the clause also refuses
       the relabel — swapping every layer the same way empties the board of
       crossings, and that now reads as the step backwards it is. */
    if(priced>plan.par || (priced===plan.par && x>plan.x)){
      if(priced>plan.par) miss=0;
      plan.par=priced; plan.x=x; plan.d+=st.pick.length;
    } else {
      st.pick.forEach((n,j)=>{n.x=st.px[j]; n.y=st.py[j]; n.moved=false});
      miss++;
    }
  }
  /* PHASE TWO, from v5. famCost prices the walkthrough in the order the nodes
     happen to sit in the array, and the offline harness showed what that costs:
     the same moves taken best-first clear every family net in about 55% of the
     actions — net 9 in 11 rather than 16, net 4 in 4 rather than 8. par was
     therefore not loose by a little, it was very nearly double, and a par
     nobody can miss is not a line. so the cheap count drives the scramble,
     which is all it is good for, and the number printed on the net is the
     cheapest walkthrough this generator can actually find.
     it costs one greedy pass per accepted rotation, which is why it does not
     drive the loop as well — measured at 30-60ms for the deepest net, against
     3ms for the cheap one. */
  if(GEN_RULES.parMode==='greedy'){
    plan.par=famGreedy(plan).actions;
    for(let miss=0; plan.par<want && miss<20; ){
      const st=famStep(live, F.cyc||3, !!F.local, rnd);
      if(!st) break;
      const priced=famGreedy(plan).actions, x=famX(plan);
      if(priced>plan.par || (priced===plan.par && x>plan.x)){
        if(priced>plan.par) miss=0;
        plan.par=priced; plan.x=x; plan.d+=st.pick.length;
      } else {
        st.pick.forEach((n,j)=>{n.x=st.px[j]; n.y=st.py[j]; n.moved=false});
        miss++;
      }
    }
  }
  /* ---- and then par is the solution PLUS an allowance ----
     the number above is the cheapest route this generator can find, and the
     offline solver established that on every net it could prove, that route IS
     the optimum. printing it as par therefore set the clean line at perfection:
     measured across 490 family nets, par equalled the optimum on 71% of them
     and the median slack from net three onward was zero. clean stopped being a
     line a good player crosses and became a line only a flawless one does.

     that is the same mistake as the old formula, arrived at from the other
     side. the formula sat so far above the optimum that a competent player
     scored 90% clean and the ladder had one rung; pricing the true route put
     the rung on top of the optimum and left no room under it at all.

     three is not a guess. the solver picked it from the distribution of a
     competent player's excess over the optimum — zero on half of nets, two or
     fewer on 78%, and the marginal gain collapsing after three — and the same
     allowance is what makes `perfect` mean something, since perfect is the
     optimum and clean now sits a few honest turns above it. */
  plan.par=Math.max(3, plan.par + (GEN_RULES.parSlack||0));
  return plan;
}

/* crossings on the board as it stands, before anybody has touched it */
function famX(plan){
  const at=new Map(); plan.nodes.forEach((n,i)=>at.set(n,i));
  const P=plan.nodes.map(n=>({x:clampX(n.x), y:clampY(n.y)}));
  const seq=plan.order.map(o=>o.map(n=>P[at.get(n)]));
  let n=0;
  for(let a=0;a<seq.length;a++)for(let b=a+1;b<seq.length;b++){
    const A=seq[a],B=seq[b];
    for(let p=0;p<A.length-1;p++)for(let q=0;q<B.length-1;q++){
      if(A[p]===B[q]||A[p]===B[q+1]||A[p+1]===B[q]||A[p+1]===B[q+1])continue;
      if(segX(A[p],A[p+1],B[q],B[q+1])) n++;
    }
  }
  return n;
}

/* ---- what the solution costs, billed the way the game bills ----
   d + 2 per superposed pair is the obvious formula and it is wrong by up to
   seven turns on the widest nets, because a net can arrive at zero crossings
   before every displaced neuron has been put back: some of them were only
   crossing each other, and repairing their neighbours settled it. a formula
   that counts those prices a puzzle nobody has to solve.

   so par is not a formula. it is this walkthrough, run and counted: split
   every superposed neuron, then put every displaced one back, in the order
   the board holds them, charging exactly as a player's hand would be charged.
   window.__solveNet performs the same walk in the same order, which is why a
   dev run of it lands on par to the turn rather than near it.

   this used to skip the action that finished the net, mirroring a billing rule
   that has since been retired — every action costs a turn now, so every par
   here is one higher than it was, which is exactly the correction that keeps
   par and the turn counter speaking the same units.

   it is still an upper bound — a player who works out which drags matter can
   beat it, and the offline solver being built separately will be able to say
   by how much. what it is not any more is arbitrary. */

/* ---- the board a candidate split placement is judged on ----
   splitPlace asks this question twelve times per split and takes the best
   answer, so it is written once here and both walks hand it the same seq. `pa`
   is the half that keeps the original feature and `pb` the new one; they are
   already sitting in seq, so moving them is all it takes to see the board a
   placement would make.
   f counts the features that would come free: a thread with nothing crossing it
   and no superposition left on it. that is canFree, said in the plan's own
   vocabulary, and it is what makes the last split of a net able to finish it. */
function famProbe(seq,T,pa,pb){
  return (A,B)=>{
    pa.x=A.x; pa.y=A.y; pb.x=B.x; pb.y=B.y;
    const c=new Array(T).fill(0);
    for(let a=0;a<T;a++)for(let b=a+1;b<T;b++){
      const U=seq[a],V=seq[b];
      for(let p=0;p<U.length-1;p++)for(let q=0;q<V.length-1;q++){
        if(U[p]===V[q]||U[p]===V[q+1]||U[p+1]===V[q]||U[p+1]===V[q+1])continue;
        if(segX(U[p],U[p+1],V[q],V[q+1])){c[a]++;c[b]++}
      }
    }
    let x=0,f=0;
    for(let a=0;a<T;a++){ x+=c[a]; if(!c[a] && !seq[a].some(n=>n.merged)) f++ }
    return {x:x/2, f};
  };
}
function famCost(plan){
  const at=new Map(); plan.nodes.forEach((n,i)=>at.set(n,i));
  const T=plan.order.length;
  const P=plan.nodes.map((n,i)=>({x:clampX(n.x), y:clampY(n.y), hx:n.hx, hy:n.hy,
                                  merged:n.merged, alt:n.alt, t:n.t.slice(),
                                  pinned:n.pinned, i}));
  const seq=plan.order.map(o=>o.map(n=>P[at.get(n)]));
  const all=P.slice();
  let moves=0;
  const step=()=>{
    const c=new Array(T).fill(0);
    for(let a=0;a<T;a++)for(let b=a+1;b<T;b++){
      const A=seq[a],B=seq[b];
      for(let p=0;p<A.length-1;p++)for(let q=0;q<B.length-1;q++){
        if(A[p]===B[q]||A[p]===B[q+1]||A[p+1]===B[q]||A[p+1]===B[q+1])continue;
        if(segX(A[p],A[p+1],B[q],B[q+1])){c[a]++;c[b]++}
      }
    }
    moves++;   // every action bills, the finishing one included
  };
  P.forEach(p=>{
    if(!p.merged) return;
    /* through splitPlace, never a second copy of it: the price of a solution
       and the geometry of the board have to move together or par drifts off it.
       the half is seated in seq and p is unmerged BEFORE the placement is
       chosen, because from v7 the choice is made by looking at the board — and
       the board it has to look at is the one the split leaves behind. */
    const kb=p.t[1], j=seq[kb].indexOf(p);
    const half={x:p.x, y:p.y, hx:p.alt?p.alt.x:null,
                hy:p.alt?p.alt.y:null, merged:false, t:[kb], i:1000+p.i};
    if(j>=0) seq[kb][j]=half;
    p.merged=false; p.t=[p.t[0]];
    const put=splitPlace(p.i, p.x, p.y, j>=0?famProbe(seq,T,p,half):null);
    p.x=put.a.x; p.y=put.a.y; half.x=put.b.x; half.y=put.b.y;
    all.push(half);
    step();
  });
  all.forEach(p=>{
    if(p.pinned || p.hx==null) return;
    if(Math.hypot(p.x-p.hx, p.y-p.hy)<=MIN_SEP*.7) return;
    p.x=clampX(p.hx); p.y=clampY(p.hy);
    step();
  });
  return moves;      // the floor that keeps par sane lives at the call site,
}                    // so the scramble loop can see a genuinely cheap board

/* ---- the same actions, taken best-first ----
   famCost walks the solution in whatever order the nodes sit in the array.
   this walks the same moves — send a neuron to its own slot, split a superposed
   one — choosing at each step the one that leaves the fewest crossings behind.
   both are reachable, so both are upper bounds on the true minimum; this one is
   very much the tighter, and it is the one par is set from.
   it also hands back the route it took, so window.__solveNet can walk exactly
   the line par was priced off rather than an equivalent-length approximation. */
function famGreedy(plan){
  const at=new Map(); plan.nodes.forEach((n,i)=>at.set(n,i));
  const T=plan.order.length;
  const P=plan.nodes.map((n,i)=>({x:clampX(n.x), y:clampY(n.y), hx:n.hx, hy:n.hy,
                                  merged:n.merged, alt:n.alt, t:n.t.slice(),
                                  pinned:n.pinned, i}));
  const seq=plan.order.map(o=>o.map(n=>P[at.get(n)]));
  const all=P.slice();
  const X=()=>{
    let c=0;
    for(let a=0;a<T;a++)for(let b=a+1;b<T;b++){
      const A=seq[a],B=seq[b];
      for(let p=0;p<A.length-1;p++)for(let q=0;q<B.length-1;q++){
        if(A[p]===B[q]||A[p]===B[q+1]||A[p+1]===B[q]||A[p+1]===B[q+1])continue;
        if(segX(A[p],A[p+1],B[q],B[q+1])) c++;
      }
    }
    return c;
  };
  const adrift=p=>!p.pinned && p.hx!=null && Math.hypot(p.x-p.hx,p.y-p.hy)>MIN_SEP*.7;
  const log=[]; let actions=0;
  for(let guard=0; guard<200; guard++){
    const shared=all.filter(p=>p.merged);
    const now=X();
    if(now===0 && !shared.length) break;
    let best=null;
    for(const p of all){
      if(p.merged || !adrift(p)) continue;
      const ox=p.x, oy=p.y;
      p.x=clampX(p.hx); p.y=clampY(p.hy);
      const s=X();
      p.x=ox; p.y=oy;
      if(!best || s<best.s) best={s, p, kind:'drag'};
    }
    // a split never removes a crossing by itself, so without a nudge the search
    // would defer every one of them to the end and pay for the drags twice
    if(shared.length && (!best || best.s>=now)) best={s:now-1, p:shared[0], kind:'split'};
    if(!best) break;
    if(best.kind==='drag'){
      best.p.x=clampX(best.p.hx); best.p.y=clampY(best.p.hy);
      log.push(['drag', best.p.i]);
    } else {
      // the same placement the board will make, for the same reason famCost
      // takes it: this walk IS the route par is quoted from
      const p=best.p;
      const kb=p.t[1], j=seq[kb].indexOf(p);
      const half={x:p.x, y:p.y, hx:p.alt?p.alt.x:null,
                  hy:p.alt?p.alt.y:null, merged:false, t:[kb], i:1000+p.i};
      if(j>=0) seq[kb][j]=half;
      p.merged=false; p.t=[p.t[0]];
      const put=splitPlace(p.i, p.x, p.y, j>=0?famProbe(seq,T,p,half):null);
      p.x=put.a.x; p.y=put.a.y; half.x=put.b.x; half.y=put.b.y;
      all.push(half);
      log.push(['split', p.i]);
    }
    actions++;
  }
  return {actions, log, left:X()};
}
/*@endfam*/

let gRoot,gThreads,gMarkers,gMembers,gLabels,gFx,physRAF=null,physDirty=true;

/* ---- motion preference ----
   read live, because the OS setting can change while the tab is open. only
   things that MOVE consult it; nothing that merely changes state does, or a
   player who turns motion off stops being told what happened. */
const RMQ = window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)') : null;
let reduceMotion = !!(RMQ && RMQ.matches);
if(RMQ && RMQ.addEventListener) RMQ.addEventListener('change',e=>{reduceMotion=e.matches});
/* one flick of a neuron's ring: it has been picked up and put down, or it has
   just arrived on its mark in the settle. one class, one timer, no rAF. */
function flickNode(n){
  if(reduceMotion||!n||!n.el) return;
  n.el.classList.add('landed');
  setTimeout(()=>{if(n.el)n.el.classList.remove('landed')},300);
}

/* ---- no two neurons on top of each other ----
   a neuron draws at r=10 on a wide board and r=15 on a phone, so a pair closer
   than about 30 units overlaps and a pair closer than a few units is simply one
   circle with a second one hiding under it — you drag what you think is the
   node and the other stays behind. measured across 80 generated nets before
   this existed: 37% held a pair under 20 units apart and the worst was 0.1,
   exactly coincident. the pin loop was the main source, dropping an immovable
   neuron onto a movable one at the same column height.

   this is enforced after placement rather than inside any one layout, so every
   shape — the layered net, and whatever families come later — inherits it
   instead of each having to remember. it is a deterministic relaxation: fixed
   iteration order, fixed pass count, no randomness, so the same day still
   generates the same board.

   pinned neurons never move. they are placed at a position the solution needs,
   and moving one could make the net unsolvable — so the movable neighbour is
   pushed instead, which costs nothing, since a start position is only where the
   puzzle begins. */
const MIN_SEP=38;
function separateNodes(min=MIN_SEP){
  for(let pass=0;pass<24;pass++){
    let moved=false;
    for(let a=0;a<members.length;a++)for(let b=a+1;b<members.length;b++){
      const A=members[a], B=members[b];
      let dx=B.x0-A.x0, dy=B.y0-A.y0, d=Math.hypot(dx,dy);
      if(d>=min) continue;
      if(d<1e-6){dx=1;dy=0;d=1}                 // coincident: part along a fixed axis
      const ux=dx/d, uy=dy/d, push=(min-d)/2+.5;
      if(A.pinned&&B.pinned) continue;          // the pin loop refuses to make these
      if(A.pinned){ B.x0=clampX(B.x0+ux*push*2); B.y0=clampY(B.y0+uy*push*2) }
      else if(B.pinned){ A.x0=clampX(A.x0-ux*push*2); A.y0=clampY(A.y0-uy*push*2) }
      else { A.x0=clampX(A.x0-ux*push); A.y0=clampY(A.y0-uy*push);
             B.x0=clampX(B.x0+ux*push); B.y0=clampY(B.y0+uy*push) }
      moved=true;
    }
    if(!moved) break;
  }
  members.forEach(n=>{n.xv=n.xr=n.x0; n.yv=n.yr=n.y0});
}

/* ---- which way up the board is ----
   the board is 1040x580 and cannot change shape: the same day has to be the
   same puzzle on every screen, so the coordinate space is fixed and the plate
   is centred into whatever the window leaves. a phone is the other way round,
   though, and letterboxing a landscape plate into a portrait window spent two
   thirds of the screen on nothing — the tangle came out a 375x209 strip.

   so on a tall window the plate is turned a quarter turn and the layers stack
   down the screen instead of across it, which is how a net is usually drawn
   anyway. it is presentation only: positions, seeds, par and the solution are
   untouched, and since the pointer maths reads the matrix rather than the
   element box, dragging needs to know nothing about it. only the two marks
   that have an up — the freed thread's name, and the sign it settles into —
   are turned back. */
let portrait=false;
function wantsPortrait(){
  const f=$('field').getBoundingClientRect();
  if(!f.width||!f.height) return portrait;
  return Math.min(f.width/BH, f.height/BW) > Math.min(f.width/BW, f.height/BH);
}
function applyOrientation(force){
  const p=wantsPortrait();
  if(p===portrait && !force){ publishPlateInset(); return false }
  portrait=p;
  $('netsvg').setAttribute('viewBox', portrait?`0 0 ${BH} ${BW}`:`0 0 ${BW} ${BH}`);
  if(gRoot) gRoot.setAttribute('transform', portrait?`rotate(90) translate(0 ${-BH})`:'');
  if(gLabels) threads.forEach(t=>{if(t.freed) repositionLabel(t)});
  publishPlateInset();
  return true;
}

/* ---- how far the plate is from the field's edge ----
   everything that floats over the board is positioned against `.field`, and
   `.field` is not the board: the plate keeps its fixed viewBox and is
   letterboxed into whatever the window leaves, so at 1280x720 the field is
   1238px wide and the plate 1031 — 103px of dead margin down each side. a
   corner-anchored card measured off the field would sit in that margin, off
   the board entirely.
   css cannot work this out for itself, because it falls out of the aspect
   ratio rather than out of any box, so it is measured here once per layout and
   published as two lengths the corner offsets add to. it reads the viewBox off
   the element rather than off `portrait`, so it is correct whichever way up
   the board is and whoever calls it. measured against `#netsvg` rather than
   the field because the phone inlines the coach card as a flex sibling, which
   makes the svg shorter than the field it sits in. */
function publishPlateInset(){
  const f=$('field'), s=$('netsvg');
  if(!f || !s) return;
  const vb=s.viewBox.baseVal, sr=s.getBoundingClientRect(), fr=f.getBoundingClientRect();
  if(!vb || !vb.width || !vb.height || !sr.width || !sr.height) return;
  // xMidYMid meet: the largest scale that fits whole, centred on both axes
  const k=Math.min(sr.width/vb.width, sr.height/vb.height);
  // `right` and `bottom` are measured from the containing block's PADDING box,
  // which is what clientLeft/clientWidth describe — the field has neither
  // border nor padding today, and this does not quietly break if it gains one
  const padR=fr.left+f.clientLeft+f.clientWidth, padB=fr.top+f.clientTop+f.clientHeight;
  const plateR=sr.left+(sr.width+vb.width*k)/2, plateB=sr.top+(sr.height+vb.height*k)/2;
  f.style.setProperty('--plate-x', Math.max(0,padR-plateR).toFixed(2)+'px');
  f.style.setProperty('--plate-y', Math.max(0,padB-plateB).toFixed(2)+'px');
}

function buildNet(force){
  const idx=R().netIndex;
  if(builtFor===idx && !force) return;
  builtFor=idx; lastT=''; peakCross=1;
  { const r=$('threadrow'); if(r) delete r.dataset.done; }
  // presentation state belonging to the net being replaced, not to this one
  $('field').classList.remove('cleared','dimthreads','swap-in');
  readMarkSizes();
  spec=netSpec(idx);
  const svg=$('netsvg'); svg.innerHTML='';
  const mk=(n,a,p)=>{const e=document.createElementNS('http://www.w3.org/2000/svg',n);for(const k in a)e.setAttribute(k,a[k]);(p||svg).appendChild(e);return e};
  const defs=mk('defs',{});
  const pat=document.createElementNS('http://www.w3.org/2000/svg','pattern');
  pat.setAttribute('id','fg');pat.setAttribute('width','28');pat.setAttribute('height','28');pat.setAttribute('patternUnits','userSpaceOnUse');
  const pp=document.createElementNS('http://www.w3.org/2000/svg','path');
  pp.setAttribute('d','M28 0H0V28');pp.setAttribute('fill','none');pp.setAttribute('stroke',cssv('--grid'));pp.setAttribute('stroke-width','1');
  pat.appendChild(pp);defs.appendChild(pat);
  gRoot=mk('g',{class:'boardroot'});
  // the plate itself, so the board reads as an object on the panel rather than
  // bleeding into the letterbox the window leaves around it
  mk("rect",{x:0,y:0,width:BW,height:BH,fill:cssv('--surface'),class:"plate"},gRoot);
  mk("rect",{x:0,y:0,width:BW,height:BH,fill:"url(#fg)"},gRoot);

  // pick features for this net, from the cast frozen into this day's generator
  const GEN={...genFor(R().day)};
  // the geometry rules this day's version freezes, where splitNode can reach
  // them long after this function has returned
  Object.assign(GEN_RULES, genRules(GEN));
  if(isTrial()) GEN.layout='scatter';   // the trial is the endless unstructured one
  const fr=mulberry32(fnv(R().day+':feat:'+idx));
  const pool=[...GEN.feats];
  const chosen=[];
  while(chosen.length<spec.threads && pool.length){
    chosen.push(pool.splice(Math.floor(fr()*pool.length),1)[0]);
  }

  for(let salt=0;salt<40;salt++){
    const rnd=mulberry32(fnv(R().day+':net:'+idx+':'+salt));
    members=[];
    // thread colours are assigned per-net so no two threads ever share one
    /* feature strength is drawn, not written: a strongly-represented feature
       runs through more neurons and is stroked heavier, so the thread that
       looks dominant genuinely is the hardest one to isolate. */
    threads=chosen.map((k,i)=>{
      const strength=1+(fnv(R().day+':str:'+idx+':'+k)%3);   // 1 faint, 2 clear, 3 dominant
      return {key:k,def:FEATURES[k],col:THREADPAL[i%THREADPAL.length],
              strength, nodeCount:spec.nodes+(strength-1),
              width:(2.2+strength*1.15),      // 3.4 / 4.5 / 5.6 — a readable spread
              nodes:[],freed:false,crossings:0};
    });
    let ok=true;
    // during the tutorial the coach card floats over the top of the board,
    // so keep the tangle in the lower half where it can't be covered
    const tut=!store.tutorialDone && R().netIndex===0;

    /* ---- layered placement: the net is drawn as a net ----
       neurons sit in columns, threads run left to right through one neuron per
       column, and a crossing is two threads swapping vertical order between
       adjacent columns. that is a real net diagram rather than a scatter, and
       it makes the puzzle honest: untangling IS sorting the order of neurons
       in each layer, which is what the picture was always claiming.
       a shared neuron is two threads occupying the same slot — superposition
       drawn correctly rather than implied by proximity. */
    const layered=()=>{
      const L=Math.max(3,spec.nodes);                     // columns
      const T=threads.length;
      const R0=T+(spec.shared>0?0:1);                     // slots per column
      const x0=BW*.10, x1=BW*.90, ytop=tut?BH*.46:BH*.14, ybot=BH*.88;
      const colX=i=>x0+(x1-x0)*(L===1?0:i/(L-1));
      const rowY=r=>ytop+(ybot-ytop)*(R0===1?.5:r/(R0-1));
      // each column is an ordering of the threads; the first is the identity,
      // so the left edge always opens tidy and the tangle grows rightward
      const orders=[];
      for(let c=0;c<L;c++){
        const o=[...Array(T).keys()];
        if(c>0) for(let i=o.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[o[i],o[j]]=[o[j],o[i]]}
        orders.push(o);
      }
      // which columns carry a shared neuron — never the first or last, so a
      // thread always has somewhere clean to be pulled to
      const sharedCols=[];
      for(let k=0;k<spec.shared && L>2;k++) sharedCols.push(1+Math.floor(rnd()*(L-2)));
      /* each column is spaced by its OWN width, centred, so a layer holding a
         shared neuron visibly pinches. that narrowing is not decoration: a
         layer with fewer neurons than features is exactly why real networks
         superpose in the first place, so the bottleneck in the picture is the
         reason the puzzle exists. */
      const grid=[];
      for(let c=0;c<L;c++){
        grid[c]=[];
        const pair=sharedCols.includes(c)?orders[c].slice(0,2):null;
        const seats=orders[c].filter(ti=>!(pair&&ti===pair[1]));   // this layer's true width
        const span=(ybot-ytop), mid=(ytop+ybot)/2;
        const step=seats.length>1?Math.min(span/(R0-1), span/(seats.length-1)):0;
        const topY=mid-step*(seats.length-1)/2;
        seats.forEach((ti,r)=>{
          const jitter=(rnd()-.5)*10;
          const n={x0:colX(c),y0:clampY(topY+step*r+jitter),phase:rnd()*Math.PI*2,
                   freq:.3+rnd()*.4,idx:members.length,threads:[]};
          n.xv=n.xr=n.x0; n.yv=n.yr=n.y0;
          members.push(n); grid[c][ti]=n;
          if(pair && ti===pair[0]){ grid[c][pair[1]]=n; n.merged=true; }
        });
      }
      threads.forEach((th,ti)=>{
        th.nodes=[];
        for(let c=0;c<L;c++){ const n=grid[c][ti]; if(n){ if(!n.threads.includes(th)) n.threads.push(th); th.nodes.push(n) } }
      });
      /* pins belong in their layer, not off on the old lane grid. a pin is put
         on the height its own thread holds in column 0 — the identity ordering
         — so the flat solution stays reachable through it. pinning a neuron
         somewhere its thread never needs to be would make the net unsolvable. */
      for(let k=0;k<spec.pinned;k++){
        const ti=k%threads.length, c=1+Math.floor(rnd()*Math.max(1,L-2));
        const n=grid[c][ti], home=grid[0][ti];
        if(!n||!home||n.merged||n.pinned) continue;
        /* two pinned neurons landing on each other cannot be parted afterwards,
           because neither is allowed to move — so refuse the draw rather than
           mint a pair that is stuck on top of itself. a pin landing on a
           MOVABLE neuron is fine: separateNodes moves the other one. */
        if(members.some(m=>m.pinned&&m!==n&&Math.hypot(m.x0-n.x0,m.y0-home.y0)<MIN_SEP)) continue;
        n.y0=n.yv=n.yr=home.y0;
        n.pinned=true;
      }
      return threads.every(t=>t.nodes.length>=2);
    };

    if(GEN.layout==='families'){
      /* ---- a family, planned as data and then made into neurons ----
         famPlan does the whole placement without touching the dom, which is
         what lets the offline harness run this exact code rather than a copy
         of it. it hands back a solved figure, a scramble of known size and the
         par that follows from it. a family that will not fit this net — too
         tight to grab at phone scale, off the plate, or a figure whose own
         solved form is not clean — returns null, and the stack takes over,
         because a net that cannot be drawn well is worse than a familiar one. */
      const T=threads.length, L=Math.max(3,spec.nodes);
      const fam=famFor(R().day,idx);
      const plan=famPlan(fam,T,L,spec.shared,spec.pinned,famTarget(idx),tut,rnd)
              || famPlan('layered',T,L,spec.shared,spec.pinned,famTarget(idx),tut,rnd);
      if(!plan){ ok=false }
      else{
        spec.fam=plan.fam; spec.famD=plan.d; spec.plan=plan;
        plan.nodes.forEach(n=>{
          const m={x0:clampX(n.x), y0:clampY(n.y), hx:n.hx, hy:n.hy, alt:n.alt,
                   phase:rnd()*Math.PI*2, freq:.3+rnd()*.4, idx:members.length, threads:[]};
          m.xv=m.xr=m.x0; m.yv=m.yr=m.y0;
          if(n.pinned) m.pinned=true;
          if(n.merged) m.merged=true;
          n.m=m; members.push(m);
        });
        threads.forEach((th,k)=>{ th.nodes=plan.order[k].map(n=>n.m) });
        plan.nodes.forEach(n=>n.t.forEach(k=>{
          if(!n.m.threads.includes(threads[k])) n.m.threads.push(threads[k]);
        }));
        /* the band the salt loop judges on, and it is doing a much smaller job
           than it used to. difficulty is set by d, not read off the crossing
           count, so this only rejects a draw that came out looking already
           solved or one that came out an unreadable mat — and it can never be
           what makes a net finishable, because every draw already is. the
           floor is a third of d rather than d itself: two neurons swapped in
           the same layer usually buy one crossing, not two. */
        spec.minX=Math.max(2, Math.round(plan.par*0.5));
        spec.maxX=Math.max(spec.minX+3, Math.round(plan.par*5)+8);
        ok=threads.every(t=>t.nodes.length>=2);
      }
    } else if(GEN.layout==='layered'){
      ok=layered();
      /* the ramp's crossing bands were tuned against a scatter, where any two
         segments could cross. a layered net can only cross where two threads
         swap order between adjacent columns, so its ceiling is
         (columns-1) x pairs-of-threads — far lower. aim at a fraction of what
         this shape can actually reach instead of at numbers from the old one. */
      const L=Math.max(3,spec.nodes), T=threads.length;
      const ceiling=(L-1)*T*(T-1)/2;
      spec.minX=Math.max(2,Math.round(ceiling*0.40));
      spec.maxX=Math.max(spec.minX+2,Math.round(ceiling*0.85));
    } else {
    const place=(center)=>{
      for(let t=0;t<400;t++){
        const x=center?BW*.34+rnd()*BW*.32:BW*.06+rnd()*BW*.88;
        const y=tut?(BH*.42+rnd()*BH*.46):(center?BH*.3+rnd()*BH*.4:BH*.08+rnd()*BH*.84);
        if(members.every(m=>Math.hypot(m.x0-x,m.y0-y)>72)){
          const n={x0:x,y0:y,xv:x,yv:y,xr:x,yr:y,phase:rnd()*Math.PI*2,freq:.3+rnd()*.4,idx:members.length,threads:[]};
          members.push(n);return n;
        }
      } return null;
    };
    /* shared neurons claim the centre band FIRST, while the board is empty.
       placed last, they had to find a gap in a 333x232 band already holding
       30-45 nodes at 72px separation, and failed on 17-42% of days at nets
       11 and deeper. a failure there aborts the salt, and since every salt
       could fail the loop could run out — dropping every pinned neuron,
       leaving initialCross unset, and producing a net far off spec (net 11
       measured 233 crossings against a declared ceiling of 60).
       they still join their threads afterwards, once there are nodes to
       splice between. */
    const sharedNodes=[];
    for(let s=0;s<spec.shared;s++){
      const n=place(true); if(!n){ok=false;break}
      n.merged=true;                // one neuron carrying two features
      sharedNodes.push(n);
    }
    if(ok) for(const th of threads){
      for(let i=0;i<th.nodeCount;i++){
        const n=place(false); if(!n){ok=false;break}
        n.threads.push(th); th.nodes.push(n);
      }
      if(!ok)break;
    }
    if(ok) sharedNodes.forEach((n,s)=>{
      const a=threads[s%threads.length], b=threads[(s+1)%threads.length];
      n.threads.push(a,b);
      a.nodes.splice(1+Math.floor(rnd()*Math.max(1,a.nodes.length-2)),0,n);
      b.nodes.splice(1+Math.floor(rnd()*Math.max(1,b.nodes.length-2)),0,n);
    });
    }
    // pinned neurons: load-bearing for features you haven't found, so immovable.
    // they are placed AT a position the lane solution uses, which guarantees the
    // net stays solvable — you just have to route everything else around them.
    // (the layered builder pins inside its own grid, and a family pins on its
    // own slots, both above.)
    if(ok&&spec.pinned>0&&GEN.layout!=='layered'&&GEN.layout!=='families'){
      const laneY=t=>BH*.09+threads.indexOf(t)*(BH*.82/Math.max(1,threads.length-1));
      const cands=members.filter(n=>n.threads.length===1);
      for(let p=0;p<spec.pinned&&cands.length;p++){
        const n=cands.splice(Math.floor(rnd()*cands.length),1)[0];

  const cx=mean(t.nodes,n=>n.x0), cy=mean(t.nodes,n=>n.y0);
  /* and a feature that is pinned has less choice than one that is not, so the
     pinned ones that are still tangled get first refusal on the cell nearest
     their pin. without this the free-moving features take the good cells in the
     order the player happens to untangle them, and the pinned one comes free
     last to find every near cell gone — then draws a line half the board long
     back to a neuron it was never allowed to move. reserving costs the mover
     almost nothing: it is choosing between empty cells either way. */
  const mine=held.length?nearestSlot(open,hx,hy):null, res=new Set();
  threads.forEach(o=>{
    if(o===t||o.signSlot) return;
    const op=pinsOf(o); if(!op.length) return;
    const s=nearestSlot(open.filter(q=>!res.has(q.i)), mean(op,n=>n.x0), mean(op,n=>n.y0));
    if(s && s!==mine) res.add(s.i);                  // never reserve away my own anchor
  });
  const room=open.filter(s=>!res.has(s.i));
  if(room.length) open=room;                         // unless it would leave nothing
  const occ=boardOccupancy(t);
  let best=open[0], bv=Infinity;
  open.forEach(s=>{
    let v=slotCost(s,occ);
    v+=HOME_W*Math.hypot(s.cx-cx,s.cy-cy)/BW;                  // ties go to where it already was
    if(held.length) v+=PULL_W*held.length*Math.hypot(s.cx-hx,s.cy-hy)/BW;
    if(v<bv){bv=v;best=s}
  });
  return (t.signSlot=best);
}
function settleIntoShape(t){
  const held=heldNodes(t);
  const movable=t.nodes.filter(n=>!held.includes(n));
  if(movable.length<3) return;                        // claim no slot it cannot draw in
  const pts=featureShape(t.key, t.nodes.length);
  if(!pts) return;
  const slot=claimSlot(t);
  const cx=slot.cx, cy=slot.cy;
  /* the sign is fitted to its own extent, not to the 96 box it was drawn in.
     the emblems do not fill that box evenly — reduced to six points the moon is
     35 units across and the bird is 85 — so scaling everything by 96 drew the
     narrow ones at a third of the size of the wide ones and called it a system.
     each sign's long side reaches the slot instead, scaled the same on both
     axes so nothing is stretched, which is how the munich pictograms are sized
     against each other in the first place: optically, to a common field. */
  const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]);
  const ox=(Math.min(...xs)+Math.max(...xs))/2, oy=(Math.min(...ys)+Math.max(...ys))/2;
  const span=Math.max(Math.max(...xs)-Math.min(...xs), Math.max(...ys)-Math.min(...ys), 1);
  const S=slot.r/span;
  const now=performance.now();
  let k=0;                                            // stagger counter over the MOVABLE nodes
  t.nodes.forEach((n,i)=>{
    if(!movable.includes(n)) return;
    const [px,py]=pts[Math.min(i,pts.length-1)];
    /* the sign has an up. on a quarter-turned board the board's +x runs down
       the screen and +y runs left, so the emblem is laid into those axes
       instead of straight onto x and y — or it settles on its side. the slot is
       square, so the same fit serves either way round. */
    const dx=portrait?(py-oy):(px-ox), dy=portrait?-(px-ox):(py-oy);
    const bx=clampX(cx+dx*S), by=clampY(cy+dy*S);
    /* staggered along the thread, and eased hard OUT rather than in-and-out:
       each neuron leaves at once, travels fast and stops dead on its mark, and
       they arrive in order, so the sign draws itself instead of every point
       gliding into place simultaneously and the shape only existing at the end.
       the flick as each one lands is what makes it read as arriving rather than
       as having drifted. */
    n.tw={ax:n.xv, ay:n.yv, bx, by,

function freeThread(t,silent){

  // emblem it becomes moves as one object rather than eight separate points

  lbl.setAttribute('class','tlabel2');lbl.setAttribute('text-anchor','middle');
  lbl.textContent=t.key;
  lbl.dataset.thread=t.key;

  placeLabel(lbl,labelAnchor(t));
  // the dim is the .done class's own business now — the inline opacity it also
  // wrote was a second source of truth for the same fact
  t.nodes.forEach(n=>{if(n.threads.every(th=>th.freed)) n.el.classList.add('done')});
  if(!silent){
    /* the release runs along the line. a ring at the thread's midpoint said
       only "something happened somewhere"; a light travelling the full length
       of THIS thread says which one came free and how far it reaches — which
       is the fact the moment is about.
       it is drawn from x0, not from where the line currently is: the last node
       dropped is still springing home, and the runner should show the line the
       thread is arriving at rather than the one it is leaving. it is a static
       copy, so it costs nothing per frame. */
    if(!reduceMotion){
      const run=document.createElementNS('http://www.w3.org/2000/svg','polyline');
      run.setAttribute('class','freerun');
      run.setAttribute('points',t.nodes.map(n=>`${n.x0.toFixed(1)},${n.y0.toFixed(1)}`).join(' '));
      run.style.stroke=cssv(t.col);
      run.style.strokeWidth=(t.width*1.4*markScale()).toFixed(2);
      gFx.appendChild(run);
      let L=0; try{L=run.getTotalLength()}catch(e){}
      if(!L||!isFinite(L)) L=700;
      const seg=Math.max(40,L*.17);
      run.style.strokeDasharray=`${seg.toFixed(0)} ${(L+seg).toFixed(0)}`;
      run.style.setProperty('--len',L.toFixed(0)+'px');
      run.style.setProperty('--seg',seg.toFixed(0)+'px');
      setTimeout(()=>run.remove(),480);
      lbl.classList.add('tin');

    // sign forms is a legibility decision, not an animation, and it matters
    // MORE when the runner and the stagger are not there to carry the moment
    t.el.classList.add('justfreed');
    setTimeout(()=>{if(t.el)t.el.classList.remove('justfreed')},reduceMotion?900:1150);
    // the card wears the thread's own colour, which is the whole of how it says
    // WHICH one without pointing at anything, and the name is the one word in
    // the game set large — it is the thing you just earned
    flashMsg('feature identified · '+t.key,{cols:[t.col],big:true});
    tutReach(2);
    // the light gets most of the way down the thread before the sign starts
    // assembling behind it
    setTimeout(()=>{ settleIntoShape(t); repositionLabel(t); }, reduceMotion?0:320);

}

/* ================= drag ================= */

let dragN=null,dragMoved=false,dragStart=null,dragOff={x:0,y:0};

/* the neurons a drag can reach along the thread: the ones either side at full
   strength, theirs at less. bounded by how many threads pass through the node,
   never by how big the net is, so this costs the same on net forty as on net
   one — and only these carry a tug, so the frame loop's extra work is a null
   check per node. */
function neighboursOf(n){
  const w=new Map();
  const add=(m,x)=>{ if(m&&m!==n&&!m.pinned&&(w.get(m)||0)<x) w.set(m,x) };
  n.threads.forEach(t=>{
    const i=t.nodes.indexOf(n); if(i<0) return;
    add(t.nodes[i-1],1); add(t.nodes[i+1],1);
    add(t.nodes[i-2],.42); add(t.nodes[i+2],.42);
  });
  return [...w].map(([m,x])=>({n:m,w:x}));
}
/* the board is centred inside the field rather than filling it, so screen-to-
   board is no longer the element box divided by the viewBox — that mapping was
   off by the letterbox on every screen that is not exactly 1040:580, which is
   nearly all of them. ask the svg for its own matrix instead; it already knows
   where preserveAspectRatio put the content. */

function svgPt(e){

  if(m){const p=new DOMPoint(e.clientX,e.clientY).matrixTransform(m.inverse()); return {x:p.x,y:p.y}}
  const r=$('netsvg').getBoundingClientRect();
  return{x:(e.clientX-r.left)*BW/r.width,y:(e.clientY-r.top)*BH/r.height};

// the scale in b and c and would otherwise measure zero.
function boardScale(){

  const w=$('netsvg').getBoundingClientRect().width; return w?w/BW:1;

function pick(x,y){

  members.forEach(n=>{if(n.pinned||n.threads.every(t=>t.freed))return;

$('netsvg').addEventListener('pointerdown',e=>{

  bumpIdle();

/* ---- the hand knows what the press will do ----

   what a press actually grabs is pick()'s radius, a finger-friendly ~26 screen
   px. so the two disagreed by more than double: you could be well inside
   grabbing distance and still be shown an arrow, and crossing marks draw ABOVE
   the neurons, so passing one flipped the cursor off a node you were still on
   top of. moving across the board flickered.

   element. it cannot disagree with the press, because it IS the press's own
   test — and it stops caring what happens to be painted over the node. */
function hoverNode(e){
  const f=$('field');

$('netsvg').addEventListener('pointermove',hoverNode);
// leaving the board with the class still on would leave a grab hand over the panel
$('netsvg').addEventListener('pointerleave',()=>$('field').classList.remove('overnode'));
$('netsvg').addEventListener('pointermove',e=>{

  /* the line does not move rigidly with the hand. the neurons either side are
     pumped by how FAST you are moving — not by how far you have gone — and the
     frame loop bleeds it away, so a flick stretches the thread behind you and a
     slow pull barely bends it, and letting go lets it recoil. driving it off
     speed rather than displacement is what keeps it honest: hold still and the
     neighbours are back on their true positions within a few frames, so a
     crossing never LOOKS resolved because the line is still stretched. */

      /* the weight caps the tug as well as feeding it. weighting only the gain
         looked right at a walking pace and collapsed at speed — a fast drag
         drove every neighbour into the same ceiling and the wave along the

      const o=dragNbrs[i], n=o.n, g=o.w*.34, cap=TUG_MAX*o.w;

/* every action costs a turn — a drag and a split alike, since the same beat

   prices work still ahead of you and there is none left. measuring the true
   optima killed that idea: it made 17% of all nets solvable in zero charged
   turns, including every single opening net, so a `perfect` keyed to charged
   turns was handed out for nothing on the first three nets of every day. worse,
   it made the unit non-monotonic — the same sequence of moves scored
   differently depending on which move happened to finish — so the scale wobbled
   under the tiers built on it.

   par absorbs the difference exactly: every net's par gains one turn and nothing

function chargeTurn(r){
  countCross();

}
function endDrag(){
  $('field').classList.remove('dragging');

  const r=R(), node=dragN;

  // the tug is left on the neighbours rather than cleared: bleeding it away is
  // the recoil, and cutting it dead would be the one place the line snapped

    node.x0=node.xv=node.xr=dragStart.x;

function afterMove(r){

  save(); refresh(); renderHud();
  if(threads.every(t=>t.freed)) clearNet();

  // was a second name for the same thing, in the one message that has to point

       and the only one that fires when NOTHING on the board has changed — which

/* watch the board, not the window: the field also changes size when the coach

let resizeT=null;
function relayoutBoard(){

/* ================= descent — the slow nudge =================
   gradient descent as a hint: the net settles toward a lower-energy
   arrangement on its own, the same process that trained it. offered only
   when the player has stalled, so thinking time never costs anything;
   accepting it caps the net's tier at par. */

/* smaller hops, more often, each one glided: the net should look like it is
   relaxing continuously rather than twitching once a second */
const DESCENT_OFFER_MS=8000, DESCENT_TICK_MS=380, DESCENT_GLIDE=520,
      DESCENT_RADII=[18,38,70,110], DESCENT_ANGLES=14;
