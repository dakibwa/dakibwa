name: Deploy Cloudflare preview

# Production remains on GitHub Pages until the preview and domain cutover are
# reviewed. At cutover, move the existing main-push trigger here and disable
# deploy-pages.yml in the same change so Features publication keeps deploying.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-static-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check deployment configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Configure the approved Cloudflare deployment credential and account variable before running this workflow."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run release check
        run: npm run check:release

      - name: Deploy static preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy:cloudflare

      - name: Verify served preview
        run: npm run check:hosting -- https://akibwa-site.dakibwa.workers.dev
