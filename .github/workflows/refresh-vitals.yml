name: Refresh Vitals

on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: vitals-pages
  cancel-in-progress: false

jobs:
  refresh-build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check WHOOP secrets
        id: whoop-secrets
        env:
          WHOOP_CLIENT_ID: ${{ secrets.WHOOP_CLIENT_ID }}
          WHOOP_CLIENT_SECRET: ${{ secrets.WHOOP_CLIENT_SECRET }}
          WHOOP_REFRESH_TOKEN: ${{ secrets.WHOOP_REFRESH_TOKEN }}
        run: |
          if [ -z "$WHOOP_CLIENT_ID" ] || [ -z "$WHOOP_CLIENT_SECRET" ] || [ -z "$WHOOP_REFRESH_TOKEN" ]; then
            echo "missing=true" >> "$GITHUB_OUTPUT"
            echo "WHOOP secrets are not configured; skipping Vitals refresh."
          else
            echo "missing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh Vitals data
        if: steps.whoop-secrets.outputs.missing == 'false'
        run: npm run refresh:vitals
        env:
          WHOOP_CLIENT_ID: ${{ secrets.WHOOP_CLIENT_ID }}
          WHOOP_CLIENT_SECRET: ${{ secrets.WHOOP_CLIENT_SECRET }}
          WHOOP_REFRESH_TOKEN: ${{ secrets.WHOOP_REFRESH_TOKEN }}
          WHOOP_API_DAYS: 45

      - name: Commit refreshed data
        if: steps.whoop-secrets.outputs.missing == 'false'
        id: vitals-commit
        run: |
          if git diff --quiet -- data/public-health-data.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Vitals data is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/public-health-data.json
          git commit -m "Refresh Vitals data"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Build static site
        if: steps.vitals-commit.outputs.changed == 'true'
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_CHORUS_APP_URL: ${{ vars.CHORUS_APP_URL }}
          NEXT_PUBLIC_VITALS_APP_URL: ${{ vars.VITALS_APP_URL }}

      - name: Configure Pages
        if: steps.vitals-commit.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: steps.vitals-commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: Deploy to GitHub Pages
        if: steps.vitals-commit.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
