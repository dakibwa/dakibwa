<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Akibwa</title>
    <meta name="description" content="Dakibwa. A notebook of creation, consumption, and consciousness." />
    <meta name="theme-color" content="#f6f4ef" />
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonts - Gwern/LessWrong style: serif for body, sans-serif for UI -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
      :root {
        --bg: #f5f3ec;
        --bg-soft: #ede8db;
        --text: #1c1a16;
        --muted: #696257;
        --line: #d8cfbe;
        --accent: #205c5a;
        --panel: rgba(250, 247, 239, 0.72);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #161511;
          --bg-soft: #201d17;
          --text: #ece3d0;
          --muted: #a89d88;
          --line: #342f25;
          --accent: #79b7ab;
          --panel: rgba(26, 23, 18, 0.72);
        }
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background-color: var(--bg);
        color: var(--text);
        font-family: 'Manrope', system-ui, -apple-system, sans-serif;
        line-height: 1.7;
        overflow-x: hidden;
        overflow-y: auto;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      body::before {
        content: '';
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(circle at 10% 0%, rgba(32, 92, 90, 0.13) 0%, transparent 36%),
          radial-gradient(circle at 100% 100%, rgba(32, 92, 90, 0.1) 0%, transparent 32%);
        z-index: -1;
      }

      .font-display {
        font-family: 'Fraunces', Georgia, serif;
      }

      .surface-panel {
        border: 1px solid var(--line);
        background: var(--panel);
        backdrop-filter: blur(8px);
      }

      #root {
        min-height: 100vh;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <noscript>You need to enable JavaScript to run this app.</noscript>
  </body>
</html>
