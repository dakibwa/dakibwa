<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Akibwa | Music, consumption, and consciousness</title>
    <meta name="description" content="Dakibwa. A public notebook centered on music, influences, and inner questions." />
    <meta name="theme-color" content="#f6f4ef" />
    <meta name="color-scheme" content="light dark" />
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonts - Gwern/LessWrong style: serif for body, sans-serif for UI -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
      :root {
        --bg: #f5f3ec;
        --bg-soft: #ede8db;
        --text: #1c1a16;
        --muted: #696257;
        --line: #d8cfbe;
        --accent: #205c5a;
        --panel: rgba(250, 247, 239, 0.72);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #161511;
          --bg-soft: #201d17;
          --text: #ece3d0;
          --muted: #a89d88;
          --line: #342f25;
          --accent: #79b7ab;
          --panel: rgba(26, 23, 18, 0.72);
        }
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background:
          linear-gradient(180deg, rgba(255, 252, 245, 0.72) 0%, rgba(245, 243, 236, 0.92) 18%, rgba(245, 243, 236, 1) 100%);
        background-color: var(--bg);
        color: var(--text);
        font-family: 'Manrope', system-ui, -apple-system, sans-serif;
        line-height: 1.7;
        overflow-x: hidden;
        overflow-y: auto;
        scroll-behavior: smooth;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      body::before {
        content: '';
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(circle at 10% 0%, rgba(32, 92, 90, 0.13) 0%, transparent 36%),
          radial-gradient(circle at 100% 100%, rgba(32, 92, 90, 0.1) 0%, transparent 32%),
          linear-gradient(120deg, rgba(181, 132, 64, 0.05), transparent 28%);
        z-index: -1;
      }

      body::after {
        content: '';
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.08) 1px, transparent 1px);
        background-size: 42px 42px;
        mask-image: radial-gradient(circle at center, black, transparent 82%);
        opacity: 0.25;
        z-index: -1;
      }

      .font-display {
        font-family: 'Fraunces', Georgia, serif;
      }

      .surface-panel {
        border: 1px solid var(--line);
        background: var(--panel);
        backdrop-filter: blur(8px);
        box-shadow: 0 10px 28px rgba(28, 23, 15, 0.04);
      }

      #root {
        min-height: 100vh;
      }

      a,
      button {
        -webkit-tap-highlight-color: transparent;
      }

      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }

      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }

      ::selection {
        background: rgba(32, 92, 90, 0.18);
        color: var(--text);
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (prefers-color-scheme: dark) {
        html,
        body {
          background:
            linear-gradient(180deg, rgba(17, 15, 12, 0.84) 0%, rgba(22, 21, 17, 0.94) 18%, rgba(22, 21, 17, 1) 100%);
        }

        body::after {
          background-image:
            linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
          opacity: 0.18;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        html,
        body {
          scroll-behavior: auto;
        }

        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <noscript>You need to enable JavaScript to run this app.</noscript>
  </body>
</html>
