<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dakibwa</title>
    <meta name="description" content="Dakibwa redirects to the training dashboard, with the family tree available as a secondary page." />
    <meta name="theme-color" content="#ffffff" />
    <meta http-equiv="refresh" content="0; url=/dashboard.html" />
    <script>
      (function () {
        const params = new URLSearchParams(window.location.search);
        const wantsFamilyPage = params.has('person') || params.get('view') === 'record';
        const target = wantsFamilyPage
          ? `/family.html${window.location.search}${window.location.hash}`
          : '/dashboard.html';
        window.location.replace(target);
      })();
    </script>
  </head>
  <body>
    <p style="font-family: Inter, system-ui, sans-serif; padding: 24px;">
      Redirecting…
    </p>
  </body>
</html>
