name       = "running-dashboard-api"
main       = "worker.js"
compatibility_date = "2024-01-01"

# After deploying, run:
#   wrangler secret put STRAVA_CLIENT_ID
#   wrangler secret put STRAVA_CLIENT_SECRET
#   wrangler secret put WHOOP_CLIENT_ID
#   wrangler secret put WHOOP_CLIENT_SECRET
#   wrangler secret put DASHBOARD_URL

# Optional: custom domain (e.g. api.akibwa.com)
# Add this in the Cloudflare dashboard under Workers → your worker → Triggers → Custom Domains
# [routes]
# pattern = "api.akibwa.com/*"
# zone_name = "akibwa.com"
